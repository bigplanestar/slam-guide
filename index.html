de>lambda*D<\/code> 是求解策略为限制步长、改善数值稳定性加的人工项，不是传感器给出的信息，所以不能把 <code>(H + lambda*I)^-1<\/code> 当成协方差。（见 3.1.4、3.1.5.1、3.3.2）<\/p>\n<p><strong>4. 手算一步 Gauss-Newton<\/strong><\/p>\n<pre class=\"code\"><code>J = [1   1]     r(0,0) = [-3, -1]^T     Omega = diag(1, 4)\n    [1  -1]\n\nH_GN = J^T*Omega*J = [ 5  -3]      g = J^T*Omega*r = [-7, 1]^T\n                     [-3   5]\n\nH_GN*delta_x = -g  =&gt;  delta_x = (2, 1)<\/code><\/pre>\n<p>检查：<code>2 + 1 - 3 = 0<\/code>，<code>2 - 1 - 1 = 0<\/code>，两个残差都为 0。残差对状态是线性的，一阶展开就是精确的，所以一步到位；非线性问题要重新线性化迭代，例如第 3.1.4 节的双地标例子要迭代两次。权重改成 <code>diag(1, 1)<\/code> 时 <code>H_GN = diag(2, 2)<\/code>、<code>g = [-4, -2]^T<\/code>，解仍是 <code>(2, 1)<\/code>：两条测量完全相容、能同时满足时，权重不影响解，只影响 H，也就是解的不确定度。测量互相矛盾时，权重才决定误差怎样分摊。（见 3.1.4、3.1.5.1）<\/p>\n<p><strong>5. 为什么曲率大等于信息强<\/strong><\/p>\n<p>一维高斯后验的负对数为：<\/p>\n<pre class=\"code\"><code>F(x) = 0.5 * (x - mean)^2 / variance\nF&#x27;&#x27;(x) = 1 / variance<\/code><\/pre>\n<p>所以 H 恰好是方差的倒数：方差小、分布窄、状态确定，H 就大。这不是“像个碗”的直觉类比，而是高斯负对数二次项系数恰好等于协方差的逆。多维时比较 <code>0.5*delta_x^T*P^-1*delta_x<\/code> 与 <code>F_min + 0.5*delta_x^T*H*delta_x<\/code>，得到 <code>H approximately_equals P^-1<\/code>。线性高斯问题中它是精确的；非线性 SLAM 中只是当前线性化点附近的局部近似。另外要分清斜率和曲率：两条代价在各自最低点的斜率都是 0，靠一阶导数分不出哪个更尖，要看二阶导数。（见 3.3.1.1、3.3.1.2）<\/p>\n<p><strong>6. 一面墙能约束哪些方向<\/strong><\/p>\n<p>残差 <code>r = x + cos(theta)*p_x - sin(theta)*p_y - 5<\/code>，在 <code>theta = 0<\/code> 处 <code>J = [1, 0, -p_y]<\/code>，<code>Omega = 1/0.1^2 = 100<\/code>：<\/p>\n<pre class=\"code\"><code>正前方一点 p=(2,0)：      H = diag(100, 0, 0)      只约束 x\n左右两点 p=(2,±1)：       H = diag(200, 0, 200)    约束 x 和 yaw\n1000 点、p_y 在 ±2 m：    H ≈ diag(100000, 0, 133600)<\/code><\/pre>\n<p>y 那一列的导数恒为 0：沿墙移动时看到的墙完全一样，点再多 y 方向也没有信息，只是 x、yaw 更强。要让 y 可观，必须加入法向不同的结构，例如水平墙 <code>y = 3<\/code>（<code>J = [0, 1, p_x]<\/code>），两面墙相加后 <code>H = diag(200, 200, 400)<\/code>。这就是单面墙、平行长廊容易退化，墙角容易定位的原因。（见 3.3.1.4）<\/p>\n<p><strong>7. 用特征值定位缺信息的方向；阈值能否统一<\/strong><\/p>\n<p>设 <code>H*q = lambda*q<\/code>，<code>q<\/code> 为单位向量。状态沿 q 走 <code>alpha<\/code>：<\/p>\n<pre class=\"code\"><code>delta_F approximately_equals 0.5 * delta_x^T*H*delta_x = 0.5 * lambda * alpha^2\nvariance_along_q approximately_equals 1 / lambda<\/code><\/pre>\n<p><code>q<\/code> 指出是哪一个状态组合，<code>lambda<\/code> 是这个方向的曲率。lambda 越小方差越大，接近 0 就近似不可观。特征向量不一定和坐标轴对齐，例如单地标的零空间方向是 <code>(4, -3, 1)<\/code>，把平移和转动混在了一起。追问：不能直接用一个固定阈值比较全部特征值。位置用 m、旋转用 rad，量纲不同，特征值大小依赖状态尺度，要结合状态尺度、白化方式和经验数据来设退化阈值。（见 3.3.1.5、3.3.1.6）<\/p>\n<p><strong>8. 2 维测量观测 3 维位姿为什么必然奇异<\/strong><\/p>\n<p>H 的秩不超过所有测量的总维数，2 &lt; 3，所以 H 必然奇异。具体计算：<\/p>\n<pre class=\"code\"><code>h = R(theta)^T*(L - p)，在原点、theta=0 处：\nJ_r = [1  0  -4]      Omega = diag(100, 100)\n      [0  1   3]\n\nH = J_r^T*Omega*J_r，特征值 {0, 100, 2600}\nJ_r * (4, -3, 1)^T = 0<\/code><\/pre>\n<p>零空间方向 <code>v = (4, -3, 1)<\/code> 表示机器人绕地标转圈：绕 L 转过 <code>d theta<\/code> 时位置变化 <code>d theta * (4, -3)<\/code>，同时朝向变化 <code>d theta<\/code>，地标在机体系里一动不动，测量分辨不出机器人在圆周上的哪个位置。再加一个方向不同的地标，测量变成 4 维，H 仍然是 3 × 3，但秩变成 3。第 3.1.4 节距离加方位的单地标例子同理，特征值为 <code>{0, 400, 10400}<\/code>。（见 3.4.2.7、3.1.4）<\/p>\n<p><strong>9. 手算 Omega，为什么整体求逆<\/strong><\/p>\n<pre class=\"code\"><code>det(Sigma) = 4*4 - 2*2 = 12\nOmega = (1/12) * [ 4  -2] = [ 0.333  -0.167]\n                 [-2   4]   [-0.167   0.333]<\/code><\/pre>\n<p><code>Sigma^-1<\/code> 直接来自高斯密度指数里的 <code>r^T*Sigma^-1*r<\/code>，多维时就是矩阵求逆。逐元素取倒数得到 <code>[0.25 0.5; 0.5 0.25]<\/code>，乘回 Sigma 不是单位阵，非对角项的符号也错了。Omega 非对角为负，意思是两个分量同向偏差是常见形状，惩罚应该减轻。对角元 1/3 是条件方差的倒数：<\/p>\n<pre class=\"code\"><code>Var(a | b 已知) = 4 - 2^2/4 = 3   -&gt;   1/3<\/code><\/pre>\n<p>1/4 是边缘方差的倒数，两者只有在不相关时才相等。另外，Sigma 必须正定；数值上用 Cholesky 白化，不显式求逆。（见 3.4.2.4、3.4.2.8 第 2 步）<\/p>\n<p><strong>10. 协方差前推与信息回拉的区别和自查<\/strong><\/p>\n<p><code>A*Sigma*A^T<\/code> 中间的 Sigma 是 n × n 状态协方差，结果是 m × m，回答“预测出的测量有多不确定”，例如卡尔曼中的 <code>S_k = H_k*P_k^-*H_k^T + R_k<\/code>。<code>A^T*Omega*A<\/code> 中间的 Omega 是 m × m 测量信息，结果是 n × n，回答“这些测量把状态定住了多少”，例如 <code>H_GN<\/code>。维数不同时，写反了连乘法都做不成；A 为方阵时两式都能算，但结果不同，而且对称性、行列式可能相同，所以不能靠这些判断。最可靠的自查方法是量纲：<\/p>\n<pre class=\"code\"><code>J^T*Omega*J : (pixel/m)^2 * (1/pixel^2) = 1/m^2     状态方差的倒数\nJ*Sigma*J^T : (pixel/m)^2 * m^2         = pixel^2   测量方差<\/code><\/pre>\n<p>A 可逆时 <code>(A*Sigma*A^T)^-1 = (A^-1)^T*Omega*A^-1<\/code>，“前推再求逆”相当于用 A 的逆做回拉，这就是随手交换转置位置会出错的原因。（见 3.4.2.5）<\/p>\n<p><strong>11. 极坐标噪声为什么在直角坐标里相关<\/strong><\/p>\n<pre class=\"code\"><code>J = [cos(phi)  -rho*sin(phi)] = R(phi) * diag(1, rho)\n    [sin(phi)   rho*cos(phi)]\n\nSigma_cart = R(phi) * diag(sigma_rho^2, rho^2*sigma_phi^2) * R(phi)^T<\/code><\/pre>\n<p>误差椭圆的两个半轴分别是径向 <code>sigma_rho<\/code> 和切向 <code>rho*sigma_phi<\/code>，整体转到视线方向。切向为 <code>10 * 0.008727 = 0.0873 m<\/code>，远大于径向的 0.02 m。在 30 度方位，相关系数约为 -0.873。x、y 相关并不说明传感器内部有耦合，只说明椭圆轴和坐标轴不平行；0 度和 90 度时非对角项为 0。里程计、相机三维点、相对位姿协方差的非对角项也都来自这类雅可比变换。（见 3.4.2.3）<\/p>\n<p><strong>12. 里程计 Δy 与 Δtheta 为什么相关，工程上的坑<\/strong><\/p>\n<p>把每个时间区间的相对位姿等效分解为“先转 alpha_1、平移 s、再转 alpha_2”，并假设分解量的噪声独立，用 <code>Sigma_odom = G*Sigma_u*G^T<\/code> 传播：<\/p>\n<pre class=\"code\"><code>Var(Δy)         = s^2 * sigma_alpha1^2          = 0.0004\nVar(Δtheta)     = sigma_alpha1^2 + sigma_alpha2^2 = 0.0008\nCov(Δy, Δtheta) = s * sigma_alpha1^2            = 0.0004\nrho = 0.0004 / sqrt(0.0004*0.0008) = 0.707<\/code><\/pre>\n<p>同一个 alpha_1 既让车往侧面偏，又让朝向偏，所以两个误差同号出现。只填对角协方差（例如 <code>pose_covariance_diagonal<\/code>）会丢掉这个 0.707 的相关性。只用左右轮两个噪声源时，直行的 Δy 完全由 Δtheta 决定，Sigma 秩为 2、不可逆，需要补一个小的独立侧滑噪声，或在有效子空间里处理。另外，Sigma 随运动量变化，每条边要按自己那段运动重新计算。转弯时相关项会换到 (Δx, Δtheta)。（见 3.4.2.8 第 1 步、变体）<\/p>\n<p><strong>13. H 的对角块求逆为什么不是位姿协方差<\/strong><\/p>\n<p><code>(H_ii)^-1<\/code> 是条件协方差，隐含假设其他位姿都精确已知；<code>(H^-1)<\/code> 的 ii 块才是边缘协方差。仅里程计的例子：<\/p>\n<pre class=\"code\"><code>X_2：(H_22)^-1 = Sigma_odom，sigma = (5.00 cm, 2.00 cm, 0.0283 rad)\n     真实 P_2：            sigma = (7.07 cm, 4.90 cm, 0.0400 rad)<\/code><\/pre>\n<p>对角块求逆的 y 标准差只有真实值的 40% 到 50%，因为它把前一段累积的误差全忽略了，结果明显偏乐观。正确做法是对整个 H 求逆后取块，或用 Schur 补消去其余状态：<\/p>\n<pre class=\"code\"><code>P_ii = (H_ii - H_i,rest * H_rest,rest^-1 * H_rest,i)^-1<\/code><\/pre>\n<p>g2o 的 <code>computeMarginals<\/code>、GTSAM 的 <code>Marginals<\/code>、Ceres 的 <code>Covariance<\/code> 算的都是边缘协方差。规律可以记成：协方差对角是边缘量，信息矩阵对角求逆是条件量。（见 3.4.2.8 第 8 步）<\/p>\n<p><strong>14. 回环为什么让 X_1 也变准；Omega_loop 的来源<\/strong><\/p>\n<p>信息通过 H 的非对角块沿里程计边 1-&gt;2 传回。X_2 被回环钉住后，X_1 就被夹在固定的 X_0 和几乎确定的 X_2 之间：x 方向相当于两条里程计从两头夹住，<code>sigma_x1<\/code> 从 5.00 cm 降到 3.57 cm。朝向变准（0.0283 -&gt; 0.0149 rad）靠的是杠杆臂：<code>A_12<\/code> 中的 <code>-dx<\/code> 让 theta_1 的偏差变成 X_2 的横向偏差 <code>1 m * delta_theta_1<\/code>；回环把 y_2 定到约 1 cm，也就反过来约束了 theta_1。滤波器只保留当前位姿，做不到这种回头修正。追问：回环的 Omega 是下层 ICP 的 H，4 个对称点得到 <code>H_icp = diag(10000, 10000, 40000) = Omega_loop<\/code>。ICP 的 H 往往偏乐观，例如对应点错误、点不独立，所以工程上常放大 <code>Sigma_loop<\/code> 或改用手调权重。错误回环信息量越高，把地图拉坏得越厉害，要配合鲁棒核和卡方门控。（见 3.4.2.8 第 3、5、7 步，3.3.2）<\/p>\n<p><strong>15. H^-1 何时不是协方差；首帧不固定怎么办<\/strong><\/p>\n<p><code>H^-1<\/code> 作为协方差只在线性高斯、模型正确时成立。以下情况会让它失真：ICP 对应点错误或随位姿跳变；鲁棒核大量降权，等效权重已不是标定出的逆协方差；把 LM 阻尼 <code>lambda*I<\/code> 算进去；H 退化；大量点来自同一表面却被当成独立；测量协方差填得太小；外参、时间偏移被当成精确真值；同一信息在滤波和图里重复使用；线性化点离真值太远。纯相对位姿图整体平移、旋转后所有残差不变，这就是规范自由度。例子中把 X_0 放进状态后 H 为 9 × 9，秩只有 6：<\/p>\n<pre class=\"code\"><code>v_1 = (1,0,0, 1,0,0, 1,0,0)   整体沿 x 平移\nv_2 = (0,1,0, 0,1,0, 0,1,0)   整体沿 y 平移\nv_3 = (0,0,1, 0,1,1, 0,2,1)   整体绕原点小转动（y 分量等于各位姿的 x 坐标）<\/code><\/pre>\n<p>处理方法是固定首帧（g2o 的 <code>setFixed(true)<\/code>），或给 X_0 加先验，<code>Omega_prior = P_0^-1<\/code>。不能对奇异 H 直接用伪逆，否则零空间会显示成零方差，被误读为“完全确定”。（见 3.3.1.6、3.3.2、3.4.2.8 第 9 步）<\/p>\n<hr><\/section>", "sections": [{"id": "3.4.1", "title": "先分清四种“协方差”"}, {"id": "3.4.2", "title": "多维情形下，Sigma 和 Omega 究竟从哪里来？"}, {"id": "3.4.3", "title": "本章面试题与参考答案"}]}, {"num": "3.5", "title": "李群李代数与左右扰动", "html": "<section class=\"sec\" data-sec=\"3.5.0\"><div class=\"callout tip\"><strong>为什么现在学这一章<\/strong>：第 1 级已经会用位姿；这一章讲原理：为什么旋转不能直接相加，SO(3)、SE(3)、Exp、Log 是什么，左扰动和右扰动在哪个坐标系表达增量，雅可比为什么随之不同。这是读 FAST-LIO2、图优化代码前必须统一的约定。<\/div><\/section>\n<section class=\"sec\" data-sec=\"3.5.1\"><h3 id=\"s3.5.1\"><span class=\"num\">3.5.1<\/span> 位姿为什么不能总用普通加法更新？<\/h3>\n<p>位置可以直接相加，旋转矩阵却必须始终保持正交。SLAM 通常在当前位姿附近定义一个小的六维扰动：<\/p>\n<pre class=\"code\"><code>delta_xi = [delta_translation; delta_rotation]\n\nT_new = Exp(delta_xi) * T_old       # 左扰动示例<\/code><\/pre>\n<p>SE(3) 是“三维旋转 + 三维平移”组成的刚体位姿空间。<code>Exp<\/code> 把六维小增量转换成合法的 SE(3) 位姿。使用左扰动还是右扰动都可以，但下列内容必须统一：<\/p>\n<ul><li>扰动在哪个坐标系表达；<\/li><li>六维向量的排列；<\/li><li>雅可比的推导；<\/li><li>状态更新方式；<\/li><li>协方差所在的切空间。<\/li><\/ul><\/section>\n<section class=\"sec\" data-sec=\"3.5.2\"><h3 id=\"s3.5.2\"><span class=\"num\">3.5.2<\/span> 什么是群，<code>SO(3)<\/code> 和 <code>SE(3)<\/code> 为什么叫李群？<\/h3>\n<p>先不管“李”字。群可以理解为“一组元素加上一种合法运算”，并满足：<\/p>\n<ul><li>合法元素运算后仍在集合内；<\/li><li>有单位元素；<\/li><li>每个元素都有逆；<\/li><li>运算满足结合律。<\/li><\/ul>\n<p>所有合法三维旋转矩阵组成：<\/p>\n<pre class=\"code\"><code>SO(3)<\/code><\/pre>\n<p>它的群运算是矩阵乘法，单位元素是 I，逆元素是 <code>R^T<\/code>。所有合法三维刚体位姿组成：<\/p>\n<pre class=\"code\"><code>SE(3)<\/code><\/pre>\n<p>它的群运算也是矩阵乘法。<\/p>\n<p>“李群”比一般的群多一个条件：其元素可以连续变化并进行微分。旋转和位姿既能连乘、求逆，又能研究“改变一点”的局部导数，所以 <code>SO(3)<\/code> 和 <code>SE(3)<\/code> 是李群。<\/p><\/section>\n<section class=\"sec\" data-sec=\"3.5.3\"><h3 id=\"s3.5.3\"><span class=\"num\">3.5.3<\/span> 什么是李代数？<\/h3>\n<p>旋转矩阵不能逐元素随意相加，但在单位旋转 I 附近，一个很小的旋转可以用普通三维向量表示：<\/p>\n<pre class=\"code\"><code>phi = [phi_x, phi_y, phi_z]^T<\/code><\/pre>\n<p>把向量 phi 变成反对称矩阵：<\/p>\n<pre class=\"code\"><code>skew(phi)\n\n= [ 0      -phi_z   phi_y]\n  [ phi_z   0      -phi_x]\n  [-phi_y   phi_x   0    ]<\/code><\/pre>\n<p>它满足：<\/p>\n<pre class=\"code\"><code>skew(phi)*p = phi cross p<\/code><\/pre>\n<p>所有这种 <code>3 by 3<\/code> 反对称矩阵组成 <code>so(3)<\/code>，也就是 <code>SO(3)<\/code> 在单位元素处的切空间。可以把它理解成：<\/p>\n<pre class=\"code\"><code>SO(3)  保存合法的有限旋转\nso(3)  表示局部的小旋转增量<\/code><\/pre>\n<p>同理，<code>se(3)<\/code> 通常使用 6 维向量表示。本章约定平移在前、旋转在后：<\/p>\n<pre class=\"code\"><code>xi = [rho_x, rho_y, rho_z, phi_x, phi_y, phi_z]^T<\/code><\/pre>\n<p>它的帽映射为：<\/p>\n<pre class=\"code\"><code>hat(xi)\n\n= [skew(phi)  rho]\n  [0 0 0        0]<\/code><\/pre>\n<p>有些书和库使用“旋转在前、平移在后”。六维向量形状相同不代表语义相同，使用前必须确认分量顺序。<\/p><\/section>\n<section class=\"sec\" data-sec=\"3.5.4\"><h3 id=\"s3.5.4\"><span class=\"num\">3.5.4<\/span> <code>Exp<\/code> 和 <code>Log<\/code> 在做什么？<\/h3>\n<p><code>Exp<\/code> 把李代数中的局部向量映射成合法李群元素：<\/p>\n<pre class=\"code\"><code>R = Exp(skew(phi))\nT = Exp(hat(xi))<\/code><\/pre>\n<p><code>Log<\/code> 做反向映射：<\/p>\n<pre class=\"code\"><code>phi = vee(Log(R))\nxi  = vee(Log(T))<\/code><\/pre>\n<p>其中 <code>vee<\/code> 是 <code>hat<\/code> 或 <code>skew<\/code> 的反向操作，把矩阵重新变回向量。<\/p>\n<p>对 <code>SO(3)<\/code>，令：<\/p>\n<pre class=\"code\"><code>theta = norm(phi)\nA = skew(phi)<\/code><\/pre>\n<p>罗德里格斯公式为：<\/p>\n<pre class=\"code\"><code>Exp(A)\n= I\n  + sin(theta)/theta * A\n  + [1-cos(theta)]/theta^2 * A*A<\/code><\/pre>\n<p>当 theta 很小时：<\/p>\n<pre class=\"code\"><code>Exp(A) approximately_equals I+A<\/code><\/pre>\n<p>这是后面推导小扰动雅可比的基础。对 <code>SE(3)<\/code>：<\/p>\n<pre class=\"code\"><code>Exp(hat(xi))\n\n= [Exp(skew(phi))  V(phi)*rho]\n  [0 0 0                    1]<\/code><\/pre>\n<p>其中：<\/p>\n<pre class=\"code\"><code>V(phi)\n= I\n  + [1-cos(theta)]/theta^2 * skew(phi)\n  + [theta-sin(theta)]/theta^3 * skew(phi)*skew(phi)<\/code><\/pre>\n<p>所以对有限旋转，<code>rho<\/code> 不能无条件地当成齐次矩阵中最终的平移列；两者之间还有 <code>V(phi)<\/code>的耦合。只有在很小的增量附近，才有 <code>V(phi) approximately_equals I<\/code>。<\/p><\/section>\n<section class=\"sec\" data-sec=\"3.5.5\"><h3 id=\"s3.5.5\"><span class=\"num\">3.5.5<\/span> 为什么优化位姿时不直接对矩阵做加法？<\/h3>\n<p>假设当前旋转是 R，优化器求出一个普通向量 <code>delta_phi<\/code>。如果直接对 R 的 9 个元素做加法：<\/p>\n<pre class=\"code\"><code>R_new = R + arbitrary_matrix<\/code><\/pre>\n<p>结果通常不再满足：<\/p>\n<pre class=\"code\"><code>R_new^T*R_new = I\ndet(R_new) = 1<\/code><\/pre>\n<p>使用李代数更新：<\/p>\n<pre class=\"code\"><code>R_new = R*Exp(skew(delta_phi))<\/code><\/pre>\n<p>两个合法旋转相乘后仍然是合法旋转。因此优化器只需在普通向量空间里求小增量，再通过<code>Exp<\/code> 更新到李群上。<\/p><\/section>\n<section class=\"sec\" data-sec=\"3.5.6\"><h3 id=\"s3.5.6\"><span class=\"num\">3.5.6<\/span> 左扰动和右扰动到底左右在哪里？<\/h3>\n<p>假设当前位姿是 T，小增量是 <code>delta_xi<\/code>。<\/p>\n<p>左扰动定义为：<\/p>\n<pre class=\"code\"><code>T_new = Exp(hat(delta_xi_left))*T<\/code><\/pre>\n<p>右扰动定义为：<\/p>\n<pre class=\"code\"><code>T_new = T*Exp(hat(delta_xi_right))<\/code><\/pre>\n<p>“左”和“右”只表示小变换乘在当前位姿 T 的左边还是右边。对 <code>T_W_B<\/code> 这种把机体坐标变到世界坐标的位姿：<\/p>\n<pre class=\"code\"><code>左扰动增量   通常在世界或目标坐标系表达\n右扰动增量   通常在机体或源坐标系表达<\/code><\/pre>\n<p>这个结论依赖本章对 <code>T_W_B<\/code> 的方向约定，不能脱离变换方向死记。<\/p><\/section>\n<section class=\"sec\" data-sec=\"3.5.7\"><h3 id=\"s3.5.7\"><span class=\"num\">3.5.7<\/span> 用一个二维例子看出左右扰动的差别<\/h3>\n<p>假设机器人当前相对世界已经逆时针旋转 90 度，位置是 <code>(10,0)<\/code>。现在给它一个“x 方向移动1 m”的小增量。<\/p>\n<p>若这是右扰动，增量在机器人自身坐标系中表达。机器人的自身 x 轴已指向世界 y 轴，所以：<\/p>\n<pre class=\"code\"><code>T_new = T*Delta_T_body\n\nt_new\n= t + R*[1,0]^T\n= [10,0]^T + [0,1]^T\n= [10,1]^T<\/code><\/pre>\n<p>若这是左扰动，增量在世界坐标系中表达：<\/p>\n<pre class=\"code\"><code>T_new = Delta_T_world*T\n\nt_new\n= [1,0]^T + [10,0]^T\n= [11,0]^T<\/code><\/pre>\n<p>同样是“x 方向 1 m”，右扰动的 x 是机体 x，左扰动的 x 是世界 x，结果当然不同。<\/p>\n<figure class=\"still\"><img loading=\"lazy\" src=\"img/static/left-right-perturbation.png\" alt=\"同一个“x 方向移动 1 m”在左扰动和右扰动下的不同结果\"><figcaption>同一个“x 方向移动 1 m”在左扰动和右扰动下的不同结果<\/figcaption><\/figure>\n<blockquote>图注：机器人已逆时针转过 90 度，所以机体 x 轴指向世界 y 轴。右扰动把增量理解成机体系的量，左扰动理解成世界系的量，终点差了整整一个方向。<\/blockquote>\n<figure class=\"anim\"><div class=\"player\"><video src=\"vid/left_right_perturbation.mp4\" poster=\"vid/left_right_perturbation.jpg\" muted loop playsinline preload=\"none\" aria-label=\"动画 17：同一个增量：右扰动在机体系走到 (10, 1)，左扰动在世界系走到 (11, 0)；纯旋转时左扰动会被带走\"><\/video><\/div><figcaption><span class=\"badge\">动画 17<\/span>同一个增量：右扰动在机体系走到 (10, 1)，左扰动在世界系走到 (11, 0)；纯旋转时左扰动会被带走<\/figcaption><\/figure><\/section>\n<section class=\"sec\" data-sec=\"3.5.8\"><h3 id=\"s3.5.8\"><span class=\"num\">3.5.8<\/span> 左扰动和右扰动如何互相转换？<\/h3>\n<p>两种扰动可以表示同一个物理小变换，但六维向量的坐标数值不同。两者通过位姿 T 的伴随矩阵<code>Adj(T)<\/code> 转换：<\/p>\n<pre class=\"code\"><code>delta_xi_left = Adj(T)*delta_xi_right<\/code><\/pre>\n<p>本章使用 <code>xi=[rho;phi]<\/code> 顺序时：<\/p>\n<pre class=\"code\"><code>Adj(T)\n\n= [R  skew(t)*R]\n  [0       R    ]<\/code><\/pre>\n<p>反向转换为：<\/p>\n<pre class=\"code\"><code>delta_xi_right = inverse(Adj(T))*delta_xi_left<\/code><\/pre>\n<p>协方差也必须跟着表达坐标系一起变换：<\/p>\n<pre class=\"code\"><code>Sigma_left\n= Adj(T)*Sigma_right*Adj(T)^T<\/code><\/pre>\n<p>只转换增量均值、不转换协方差，会让噪声方向与位姿表达不一致。<\/p><\/section>\n<section class=\"sec\" data-sec=\"3.5.9\"><h3 id=\"s3.5.9\"><span class=\"num\">3.5.9<\/span> 同一个变换点公式，左右雅可比为什么不同？<\/h3>\n<p>先忽略 LiDAR-IMU 外参，把机体点 <code>p_B<\/code> 变到世界系：<\/p>\n<pre class=\"code\"><code>p_W = R*p_B+t<\/code><\/pre>\n<p>本节六维增量顺序仍为：<\/p>\n<pre class=\"code\"><code>delta_xi = [delta_rho;delta_phi]<\/code><\/pre>\n<p>对右扰动：<\/p>\n<pre class=\"code\"><code>T_new = T*Exp(hat(delta_xi))<\/code><\/pre>\n<p>使用小角度近似：<\/p>\n<pre class=\"code\"><code>Exp(skew(delta_phi))\napproximately_equals\nI+skew(delta_phi)<\/code><\/pre>\n<p>新点坐标为：<\/p>\n<pre class=\"code\"><code>p_W_new\napproximately_equals\nR*[(I+skew(delta_phi))*p_B + delta_rho] + t\n\n= R*p_B+t\n  + R*delta_rho\n  + R*skew(delta_phi)*p_B<\/code><\/pre>\n<p>交叉乘满足：<\/p>\n<pre class=\"code\"><code>skew(delta_phi)*p_B\n= -skew(p_B)*delta_phi<\/code><\/pre>\n<p>所以：<\/p>\n<pre class=\"code\"><code>p_W_new\napproximately_equals\np_W\n+ R*delta_rho\n- R*skew(p_B)*delta_phi<\/code><\/pre>\n<p>点坐标对右扰动的雅可比为：<\/p>\n<pre class=\"code\"><code>J_point_right\n= [R, -R*skew(p_B)]<\/code><\/pre>\n<p>对左扰动：<\/p>\n<pre class=\"code\"><code>T_new = Exp(hat(delta_xi))*T<\/code><\/pre>\n<p>小扰动直接作用于已经在世界系中的 <code>p_W<\/code>：<\/p>\n<pre class=\"code\"><code>p_W_new\napproximately_equals\n(I+skew(delta_phi))*p_W+delta_rho\n\n= p_W\n  + delta_rho\n  - skew(p_W)*delta_phi<\/code><\/pre>\n<p>所以：<\/p>\n<pre class=\"code\"><code>J_point_left\n= [I, -skew(p_W)]<\/code><\/pre>\n<p>左右雅可比不同不是哪个推导错了，而是增量使用了不同坐标系。它们满足：<\/p>\n<pre class=\"code\"><code>J_right = J_left*Adj(T)<\/code><\/pre>\n<p>这与 <code>delta_xi_left=Adj(T)*delta_xi_right<\/code> 是同一件事。<\/p><\/section>\n<section class=\"sec\" data-sec=\"3.5.10\"><h3 id=\"s3.5.10\"><span class=\"num\">3.5.10<\/span> 点到平面残差的左右雅可比<\/h3>\n<p>地图平面为：<\/p>\n<pre class=\"code\"><code>n^T*p_W+d = 0<\/code><\/pre>\n<p>把预测的带符号点面距离定义为：<\/p>\n<pre class=\"code\"><code>h(T) = n^T*p_W+d<\/code><\/pre>\n<p>由链式法则：<\/p>\n<pre class=\"code\"><code>H_obs = n^T*J_point<\/code><\/pre>\n<p>右扰动时：<\/p>\n<pre class=\"code\"><code>H_obs_right\n= n^T*[R, -R*skew(p_B)]<\/code><\/pre>\n<p>左扰动时：<\/p>\n<pre class=\"code\"><code>H_obs_left\n= n^T*[I, -skew(p_W)]<\/code><\/pre>\n<p>若残差定义为：<\/p>\n<pre class=\"code\"><code>r(T) = z-h(T)<\/code><\/pre>\n<p>则残差雅可比是：<\/p>\n<pre class=\"code\"><code>J_residual = -H_obs<\/code><\/pre>\n<p>若定义为 <code>r(T)=h(T)-z<\/code>，则 <code>J_residual=H_obs<\/code>。所以复制别人的雅可比前必须同时确认：<\/p>\n<pre class=\"code\"><code>1. T 的变换方向\n2. 状态六维分量顺序\n3. 左扰动还是右扰动\n4. 残差是 z-h 还是 h-z\n5. 列向量左乘还是行向量右乘<\/code><\/pre><\/section>\n<section class=\"sec\" data-sec=\"3.5.11\"><h3 id=\"s3.5.11\"><span class=\"num\">3.5.11<\/span> 左扰动和右扰动该选哪个？<\/h3>\n<p>两者都正确，没有“右扰动更高级”或“左扰动一定更稳定”的普遍结论。选择取决于：<\/p>\n<ul><li>状态误差想在哪个坐标系表达；<\/li><li>运动模型和观测模型怎样写更简洁；<\/li><li>所用求解库的 <code>retract<\/code> 或 <code>boxplus<\/code> 约定；<\/li><li>协方差和雅可比已经使用哪套约定。<\/li><\/ul>\n<p>工程上最重要的不是选哪个，而是全部模块保持一致。<\/p><\/section>\n<section class=\"sec\" data-sec=\"3.5.12\"><h3 id=\"s3.5.12\"><span class=\"num\">3.5.12<\/span> 怎样检查自己的位姿和雅可比实现？<\/h3>\n<p>先做不需要优化器的基础测试：<\/p>\n<pre class=\"code\"><code>T*inverse(T) approximately_equals I\n\nT_A_B*T_B_C approximately_equals T_A_C\n\nExp(Log(T)) approximately_equals T<\/code><\/pre>\n<p>再使用有限差分检查解析雅可比。对第 j 个增量方向：<\/p>\n<pre class=\"code\"><code>J_numeric_column_j\n\n= [r(update(T,+epsilon*unit_j))\n   -r(update(T,-epsilon*unit_j))]\n  / (2*epsilon)<\/code><\/pre>\n<p>其中 <code>update<\/code> 必须使用与解析推导相同的左扰动或右扰动。若数值雅可比与解析雅可比符号相反、列互换或旋转部分差很大，优先检查上一节的五项约定。<\/p><\/section>\n<section class=\"sec\" data-sec=\"3.5.13\"><h3 id=\"s3.5.13\"><span class=\"num\">3.5.13<\/span> 相对量的协方差为什么不能总是直接相加？<\/h3>\n<p>先从普通误差传播开始。若输出量 <code>y = f(x)<\/code>，在当前估计附近作一阶展开：<\/p>\n<pre class=\"code\"><code>delta_y approximately_equals J_f * delta_x<\/code><\/pre>\n<p>协方差的定义是误差外积的期望，所以：<\/p>\n<pre class=\"code\"><code>P_y\n= E[delta_y * delta_y^T]\n\napproximately_equals\nE[J_f * delta_x * delta_x^T * J_f^T]\n\n= J_f * P_x * J_f^T<\/code><\/pre>\n<p>这就是常见协方差传播公式的来源。<\/p>\n<p>再看一维相对位置：<\/p>\n<pre class=\"code\"><code>d = x_j - x_i<\/code><\/pre>\n<p>小误差传播为：<\/p>\n<pre class=\"code\"><code>delta_d = [-1, 1] * [delta_x_i, delta_x_j]^T<\/code><\/pre>\n<p>若联合协方差为：<\/p>\n<pre class=\"code\"><code>P_joint = [P_ii  P_ij]\n          [P_ji  P_jj]<\/code><\/pre>\n<p>则：<\/p>\n<pre class=\"code\"><code>P_d = [-1, 1] * P_joint * [-1, 1]^T\n    = P_ii + P_jj - P_ij - P_ji<\/code><\/pre>\n<p>只有交叉协方差 <code>P_ij = P_ji = 0<\/code>，也就是两者不相关时，才能简单相加。相互独立是不相关的充分条件，但对一般非高斯变量，“不相关”不一定代表“独立”。<\/p>\n<p>SE(3) 位姿还要考虑误差在哪个切空间表达。设两个估计位姿为 <code>T_i_bar<\/code>、<code>T_j_bar<\/code>，并采用右扰动：<\/p>\n<pre class=\"code\"><code>T_i = T_i_bar * Exp(delta_i)\nT_j = T_j_bar * Exp(delta_j)<\/code><\/pre>\n<p>估计的相对位姿是：<\/p>\n<pre class=\"code\"><code>T_rel_bar = T_i_bar^-1 * T_j_bar<\/code><\/pre>\n<p>把带扰动的位姿代入真实相对位姿：<\/p>\n<pre class=\"code\"><code>T_rel\n= T_i^-1 * T_j\n= Exp(-delta_i) * T_rel_bar * Exp(delta_j)<\/code><\/pre>\n<p>伴随矩阵满足：<\/p>\n<pre class=\"code\"><code>T * Exp(delta) * T^-1 = Exp(Ad_T * delta)<\/code><\/pre>\n<p>用它把左边的 <code>Exp(-delta_i)<\/code> 移到 <code>T_rel_bar<\/code> 右侧，再忽略小扰动的二阶乘积：<\/p>\n<pre class=\"code\"><code>T_rel\napproximately_equals\nT_rel_bar\n* Exp(\n    -Ad_(T_rel_bar^-1) * delta_i\n    + delta_j\n  )<\/code><\/pre>\n<p>因此相对位姿的右扰动为：<\/p>\n<pre class=\"code\"><code>delta_rel\napproximately_equals\n-Ad_(T_rel_bar^-1) * delta_i + delta_j\n\nJ_rel = [-Ad_(T_rel_bar^-1), I]<\/code><\/pre>\n<p>若两个位姿的联合协方差是 <code>P_joint<\/code>，再使用本节开头的一阶传播公式：<\/p>\n<pre class=\"code\"><code>P_rel approximately_equals J_rel * P_joint * J_rel^T<\/code><\/pre>\n<p><code>Ad_T<\/code> 叫伴随矩阵，用来把同一个六维刚体小扰动换到另一个坐标系或切空间；它还保留改变参考原点产生的平移—旋转耦合。工程接口必须同时说明左右扰动、坐标系和六维分量顺序，否则 <code>6×6<\/code> 矩阵即使形状正确也可能用错。若采用左扰动，上面的雅可比形式会改变，不能直接照抄。<\/p><\/section>\n<section class=\"sec\" data-sec=\"3.5.14\"><h3 id=\"s3.5.14\"><span class=\"num\">3.5.14<\/span> 这些知识在 FAST-LIO2 和图优化中用在哪里？<\/h3>\n<p>FAST-LIO2 的姿态、LiDAR-IMU 旋转外参位于旋转流形上，重力方向也不是可以无约束随便加减的普通三维向量。误差状态卡尔曼滤波在局部切空间求增量，再通过流形上的 <code>boxplus<\/code>更新合法状态。<\/p>\n<p>图优化中，相对位姿残差常通过 <code>Log<\/code> 把位姿差变成 6 维向量：<\/p>\n<pre class=\"code\"><code>r_ij\n= Log(\n    inverse(Z_ij)\n    * inverse(T_i)\n    * T_j\n  )<\/code><\/pre>\n<p>这样才能对残差进行白化、求雅可比并累加 Hessian。具体库的位姿差定义和分量顺序可能不同，不能只凭公式外观猜测。<\/p><\/section>\n<section class=\"sec\" data-sec=\"3.5.15\"><h3 id=\"s3.5.15\"><span class=\"num\">3.5.15<\/span> 本章的最短记忆链<\/h3>\n<pre class=\"code\"><code>点必须附带坐标系\n  -&gt; T_A_B 把 B 系坐标变到 A 系\n  -&gt; R 和 T 必须始终保持合法\n  -&gt; SO(3) 和 SE(3) 保存合法旋转与位姿\n  -&gt; so(3) 和 se(3) 提供局部向量空间\n  -&gt; Exp 把小增量映射回合法位姿\n  -&gt; 左扰动在 T 左边更新，右扰动在 T 右边更新\n  -&gt; 扰动侧决定增量坐标系和雅可比形式\n  -&gt; 位姿、扰动、残差、雅可比和协方差必须使用同一套约定<\/code><\/pre><\/section>\n<section class=\"sec\" data-sec=\"3.5.16\"><h3 id=\"s3.5.16\"><span class=\"num\">3.5.16<\/span> 本章面试题与参考答案<\/h3>\n<p>先自己作答，再对照答案；答案后括号注明对应小节。<\/p>\n<h4>题目<\/h4>\n<ol><li value=\"1\">优化器解出的是一个普通六维向量 <code>delta_xi<\/code>，为什么不能直接把它加到旋转矩阵或齐次位姿矩阵上？SLAM 里通常怎样写回？<\/li><li value=\"2\"><code>T_A_B<\/code> 应该怎样读？已知 <code>T_W_I<\/code> 和 <code>T_I_L<\/code>，写出 <code>T_W_L<\/code>，并说明怎样快速检查乘法顺序是否写反。<\/li><li value=\"3\">手算：B 系相对 A 系逆时针旋转 90 度，B 原点在 A 中位于 <code>(2,1)<\/code>。求 <code>R_B_A<\/code>、<code>t_B_A<\/code>，并用 <code>p_A=(2,2)<\/code> 验证。追问：为什么 <code>t_B_A=-t_A_B<\/code> 是常见错误？<\/li><li value=\"4\">欧拉角、旋转矩阵、四元数各有什么优缺点？比较两个四元数的误差时，为什么不能逐元素相减？<\/li><li value=\"5\"><code>SO(3)<\/code> 和 <code>so(3)<\/code> 分别是什么？<code>skew(phi)<\/code> 起什么作用？拿到别人的 <code>se(3)<\/code> 六维向量时，第一件要确认的事是什么？<\/li><li value=\"6\">写出 <code>SO(3)<\/code> 的罗德里格斯公式和它的小角近似。追问：<code>SE(3)<\/code> 的 <code>Exp<\/code> 中，<code>xi<\/code> 的前三维 <code>rho<\/code> 是否就是结果位姿的平移？<\/li><li value=\"7\">左扰动和右扰动的“左右”指什么？机器人已逆时针转 90 度、位于 <code>(10,0)<\/code>，分别按右扰动和左扰动施加“x 方向移动 1 m”，结果各是多少？<\/li><li value=\"8\">左右扰动怎样互相转换？只转换增量均值、不转换协方差会有什么问题？追问：在二维例子中，一个纯旋转的右扰动换成左扰动后，为什么会多出平移分量？<\/li><li value=\"9\">推导 <code>p_W=R*p_B+t<\/code> 对右扰动和左扰动的雅可比，并说明二者为什么不同却都正确。<\/li><li value=\"10\">写出点到平面残差的观测雅可比。从开源代码复制一个雅可比前，必须核对哪几项约定？<\/li><li value=\"11\">自己实现了位姿运算和解析雅可比，怎样在接入优化器之前验证它们？有限差分时最容易犯什么错？<\/li><li value=\"12\">两个位置估计的方差分别是 <code>0.04<\/code>、<code>0.09<\/code>，交叉协方差是 <code>0.03<\/code>，求相对位置 <code>d=x_j-x_i<\/code> 的方差。追问：<code>SE(3)<\/code> 相对位姿的协方差为什么还需要伴随矩阵？左扰动和右扰动该怎么选？<\/li><\/ol>\n<h4>参考答案<\/h4>\n<p><strong>1. 为什么不能对位姿矩阵直接做加法？<\/strong><\/p>\n<p>旋转矩阵必须满足 <code>R^T*R=I<\/code>、<code>det(R)=1<\/code>，逐元素加上任意矩阵后，这两个约束通常会被破坏，结果不再是合法旋转。做法是在当前位姿附近的切空间里求小增量，再用 <code>Exp<\/code> 映射回李群，与原位姿相乘：<\/p>\n<pre class=\"code\"><code>T_new = Exp(hat(delta_xi)) * T_old      # 左扰动\nT_new = T_old * Exp(hat(delta_xi))      # 右扰动\n\nR_new = R * Exp(skew(delta_phi))        # 两个合法旋转相乘仍合法<\/code><\/pre>\n<p>优化器只在普通向量空间里工作，合法性由 <code>Exp<\/code> 和群乘法保证。同时必须统一扰动侧、六维分量顺序、雅可比、更新方式和协方差所在的切空间。（见 3.5.1、3.5.5）<\/p>\n<p><strong>2. <code>T_A_B<\/code> 的读法与连乘顺序<\/strong><\/p>\n<p><code>T_A_B<\/code> 把 B 系坐标变到 A 系，即 <code>p_A=T_A_B*p_B<\/code>，也可读作“B 系在 A 系中的位姿”。连乘：<\/p>\n<pre class=\"code\"><code>p_W = T_W_I*(T_I_L*p_L) = (T_W_I*T_I_L)*p_L\n\nT_W_L = T_W_I*T_I_L<\/code><\/pre>\n<p>检查方法：从右向左读，相邻下标必须能抵消（中间的 I 衔接）。矩阵乘法一般不交换，<code>T_I_L*T_W_I<\/code> 的下标接不上，一眼可判错。（见 1.2.1、1.2.4）<\/p>\n<p><strong>3. 手算逆变换<\/strong><\/p>\n<pre class=\"code\"><code>R_A_B = [0 -1; 1 0]，t_A_B = [2, 1]^T\n\nR_B_A = R_A_B^T = [0 1; -1 0]\nt_B_A = -R_A_B^T*t_A_B = -[1, -2]^T = [-1, 2]^T\n\n验证：p_B = R_B_A*p_A + t_B_A = [2, -2]^T + [-1, 2]^T = [1, 0]^T<\/code><\/pre>\n<p>结果与 1.2.2 节的 <code>p_B=[1,0]^T<\/code> 一致。推导是先减平移再乘 <code>R^T<\/code>，所以平移也要被旋转；<code>t_B_A=-t_A_B<\/code> 只在两坐标系没有相对旋转时才成立，本例若这样写会得到 <code>[-2,-1]^T<\/code>，是错的。（见 1.2.2、1.2.5）<\/p>\n<p><strong>4. 三种旋转表示的取舍<\/strong><\/p>\n<pre class=\"code\"><code>欧拉角     3 个数，直观；有旋转顺序约定和万向锁\n旋转矩阵   9 个数，旋转点方便；要维持 R^T*R=I、det(R)=1\n四元数     4 个数，插值和积分方便；要维持单位长度<\/code><\/pre>\n<p><code>q<\/code> 和 <code>-q<\/code> 表示同一个旋转，逐元素相减可能得到很大的差，实际却是零误差；应先对齐符号或用 <code>Log(R_1^T*R_2)<\/code> 之类的旋转差来比较。另外，Eigen 内存系数顺序、消息字段顺序和构造函数参数顺序不一定都是 <code>[w,x,y,z]<\/code>，必须查接口。（见 1.2.6）<\/p>\n<p><strong>5. <code>SO(3)<\/code>、<code>so(3)<\/code> 与六维向量顺序<\/strong><\/p>\n<p><code>SO(3)<\/code> 是全部合法三维旋转矩阵组成的李群，群运算是矩阵乘法，单位元是 I，逆是 <code>R^T<\/code>；“李”表示元素能连续变化并求导。<code>so(3)<\/code> 是它在单位元处的切空间，由 <code>3 by 3<\/code> 反对称矩阵组成，可以用三维向量 phi 表示小旋转：<\/p>\n<pre class=\"code\"><code>skew(phi)*p = phi cross p<\/code><\/pre>\n<p><code>skew<\/code> 把向量变成反对称矩阵，<code>vee<\/code> 做反向操作。拿到 <code>se(3)<\/code> 向量时，第一件事是确认分量顺序：本文是 <code>[rho; phi]<\/code>（平移在前），有些书和库是旋转在前。形状都是 6 维，语义却不同，顺序搞错后雅可比、协方差都会错位。（见 3.5.2、3.5.3）<\/p>\n<p><strong>6. 罗德里格斯公式与 <code>V(phi)<\/code><\/strong><\/p>\n<pre class=\"code\"><code>theta = norm(phi)，A = skew(phi)\n\nExp(A) = I + sin(theta)/theta*A + [1-cos(theta)]/theta^2*A*A\n\ntheta 很小时：Exp(A) approximately_equals I+A<\/code><\/pre>\n<p>小角近似是后面推导扰动雅可比的基础。追问的答案是否定的：<\/p>\n<pre class=\"code\"><code>Exp(hat(xi)) = [Exp(skew(phi))  V(phi)*rho]\n               [0 0 0                    1]<\/code><\/pre>\n<p>结果的平移是 <code>V(phi)*rho<\/code>，旋转和平移之间有耦合。只有增量很小时 <code>V(phi) approximately_equals I<\/code>，才能把 <code>rho<\/code> 近似当作平移。（见 3.5.4）<\/p>\n<p><strong>7. 左右扰动的含义与二维手算<\/strong><\/p>\n<p>“左右”只表示小变换乘在当前位姿 T 的左边还是右边。对 <code>T_W_B<\/code>，左扰动增量通常在世界系表达，右扰动增量在机体系表达；这个结论依赖变换方向约定。<\/p>\n<pre class=\"code\"><code>R = [0 -1; 1 0]，t = [10, 0]^T\n\n右扰动：t_new = t + R*[1,0]^T = [10,0]^T + [0,1]^T = [10, 1]^T\n左扰动：t_new = [1,0]^T + t              = [11, 0]^T<\/code><\/pre>\n<p>机体 x 轴已经指向世界 y 轴，所以同样的“x 方向 1 m”在两种约定下终点相差一个方向。（见 3.5.6、3.5.7）<\/p>\n<p><strong>8. 左右扰动的转换与协方差<\/strong><\/p>\n<p>同一个物理小变换在两种约定下数值不同，用伴随矩阵转换（本文 <code>[rho;phi]<\/code> 顺序）：<\/p>\n<pre class=\"code\"><code>delta_xi_left = Adj(T)*delta_xi_right\n\nAdj(T) = [R  skew(t)*R]\n         [0       R    ]\n\nSigma_left = Adj(T)*Sigma_right*Adj(T)^T<\/code><\/pre>\n<p>只转均值不转协方差，噪声的方向会与位姿表达不一致，例如机体系的“前后不确定”被错当成世界系 x 方向的不确定。<\/p>\n<p>追问：右扰动绕机器人自身原点转 phi，位置不变；左扰动的旋转却绕世界原点转。机器人在 <code>(10,0)<\/code>，绕世界原点转小角 phi 会把它带到约 <code>(10, 10*phi)<\/code>，所以左扰动必须附带平移 <code>(0, -10*phi)<\/code> 抵消，才能表示同一个物理变换。这就是 <code>Adj<\/code> 右上角 <code>skew(t)*R<\/code> 这一耦合项的作用。（见 3.5.8、3.5.13）<\/p>\n<p><strong>9. 点变换对左右扰动的雅可比<\/strong><\/p>\n<p>右扰动 <code>T_new=T*Exp(hat(delta_xi))<\/code>，小角近似后：<\/p>\n<pre class=\"code\"><code>p_W_new approximately_equals R*[(I+skew(delta_phi))*p_B + delta_rho] + t\n        = p_W + R*delta_rho - R*skew(p_B)*delta_phi\n\nJ_point_right = [R, -R*skew(p_B)]<\/code><\/pre>\n<p>左扰动 <code>T_new=Exp(hat(delta_xi))*T<\/code>，扰动直接作用在世界点上：<\/p>\n<pre class=\"code\"><code>p_W_new approximately_equals (I+skew(delta_phi))*p_W + delta_rho\n\nJ_point_left = [I, -skew(p_W)]<\/code><\/pre>\n<p>关键一步是 <code>skew(delta_phi)*p = -skew(p)*delta_phi<\/code>。两者不同是因为增量在不同坐标系表达，满足 <code>J_right = J_left*Adj(T)<\/code>，与 <code>delta_xi_left=Adj(T)*delta_xi_right<\/code> 是同一件事。（见 3.5.9）<\/p>\n<p><strong>10. 点到平面雅可比与五项核对<\/strong><\/p>\n<p>平面 <code>n^T*p_W+d=0<\/code>，预测距离 <code>h(T)=n^T*p_W+d<\/code>，由链式法则 <code>H_obs=n^T*J_point<\/code>：<\/p>\n<pre class=\"code\"><code>H_obs_right = n^T*[R, -R*skew(p_B)]\nH_obs_left  = n^T*[I, -skew(p_W)]\n\nr = z-h  时  J_residual = -H_obs\nr = h-z  时  J_residual =  H_obs<\/code><\/pre>\n<p>复制前要核对：T 的变换方向；六维分量顺序；左扰动还是右扰动；残差是 <code>z-h<\/code> 还是 <code>h-z<\/code>；列向量左乘还是行向量右乘。任一项不一致，都会出现符号反、列互换或旋转块错误。（见 3.5.10）<\/p>\n<p><strong>11. 怎样验证位姿与雅可比实现？<\/strong><\/p>\n<p>先做不依赖优化器的恒等式测试：<\/p>\n<pre class=\"code\"><code>T*inverse(T) approximately_equals I\nT_A_B*T_B_C approximately_equals T_A_C\nExp(Log(T)) approximately_equals T<\/code><\/pre>\n<p>再用中心差分逐列检查解析雅可比：<\/p>\n<pre class=\"code\"><code>J_numeric_column_j\n= [r(update(T,+epsilon*unit_j)) - r(update(T,-epsilon*unit_j))] / (2*epsilon)<\/code><\/pre>\n<p>最常见的错误是 <code>update<\/code> 与解析推导用的扰动侧不一致，例如解析式按右扰动推，差分却按左扰动更新，结果看起来像“旋转部分差很大”。若出现符号相反、列互换，优先回查上一题的五项约定。（见 3.5.12）<\/p>\n<p><strong>12. 相对量的协方差<\/strong><\/p>\n<p>由一阶传播 <code>P_y approximately_equals J_f*P_x*J_f^T<\/code>，取 <code>J=[-1, 1]<\/code>：<\/p>\n<pre class=\"code\"><code>P_d = P_ii + P_jj - P_ij - P_ji\n    = 0.04 + 0.09 - 2*0.03\n    = 0.07<\/code><\/pre>\n<p>直接相加得 <code>0.13<\/code>，高估了不确定度；正相关的两个估计误差在相减时部分抵消。只有交叉协方差为 0 时才能直接相加。<\/p>\n<p>追问一：<code>SE(3)<\/code> 位姿的误差定义在切空间里。采用右扰动时，<code>T_rel=Exp(-delta_i)*T_rel_bar*Exp(delta_j)<\/code>，要用 <code>Ad<\/code> 把左侧扰动移到右侧：<\/p>\n<pre class=\"code\"><code>delta_rel approximately_equals -Ad_(T_rel_bar^-1)*delta_i + delta_j\n\nJ_rel = [-Ad_(T_rel_bar^-1), I]\nP_rel approximately_equals J_rel*P_joint*J_rel^T<\/code><\/pre>\n<p>伴随矩阵保留了参考原点改变带来的平移—旋转耦合；左扰动时此式形式不同，不能照抄。<\/p>\n<p>追问二：左右扰动都正确，没有普遍优劣。按状态误差想在哪个坐标系表达、模型写起来是否简洁、求解库的 <code>retract<\/code> 或 <code>boxplus<\/code> 约定来选；FAST-LIO2 的误差状态卡尔曼滤波在切空间求增量再 <code>boxplus<\/code>，图优化用 <code>r_ij=Log(inverse(Z_ij)*inverse(T_i)*T_j)<\/code> 把位姿差变成 6 维向量。工程上最重要的是全部模块用同一套约定。（见 3.5.11、3.5.13、3.5.14）<\/p>\n<hr><\/section>", "sections": [{"id": "3.5.1", "title": "位姿为什么不能总用普通加法更新？"}, {"id": "3.5.2", "title": "什么是群，SO(3) 和 SE(3) 为什么叫李群？"}, {"id": "3.5.3", "title": "什么是李代数？"}, {"id": "3.5.4", "title": "Exp 和 Log 在做什么？"}, {"id": "3.5.5", "title": "为什么优化位姿时不直接对矩阵做加法？"}, {"id": "3.5.6", "title": "左扰动和右扰动到底左右在哪里？"}, {"id": "3.5.7", "title": "用一个二维例子看出左右扰动的差别"}, {"id": "3.5.8", "title": "左扰动和右扰动如何互相转换？"}, {"id": "3.5.9", "title": "同一个变换点公式，左右雅可比为什么不同？"}, {"id": "3.5.10", "title": "点到平面残差的左右雅可比"}, {"id": "3.5.11", "title": "左扰动和右扰动该选哪个？"}, {"id": "3.5.12", "title": "怎样检查自己的位姿和雅可比实现？"}, {"id": "3.5.13", "title": "相对量的协方差为什么不能总是直接相加？"}, {"id": "3.5.14", "title": "这些知识在 FAST-LIO2 和图优化中用在哪里？"}, {"id": "3.5.15", "title": "本章的最短记忆链"}, {"id": "3.5.16", "title": "本章面试题与参考答案"}]}, {"num": "3.6", "title": "基础串讲：用同一面墙走完一次状态更新", "html": "<section class=\"sec\" data-sec=\"3.6.0\"><div class=\"callout tip\"><strong>为什么现在学这一章<\/strong>：前两级和本级的内容很多，单节看懂了，整体仍可能没有串起来。这一章用同一面墙、同一组数字，从概率模型一直走到状态更新和不确定度，是第 1 至 3 级的总复习。<\/div>\n<p>第 2.1 至 3.5 章讨论的是：给定已经收到的测量，怎样选择更可信的机器人状态，以及现有信息能把状态确定到什么程度。概率模型定义“可信”的含义，优化方法负责计算估计值，Hessian 则把求解过程与局部不确定度、退化联系起来。<\/p><\/section>\n<section class=\"sec\" data-sec=\"3.6.1\"><h3 id=\"s3.6.1\"><span class=\"num\">3.6.1<\/span> 按“上一步还缺什么”重组基础三章<\/h3>\n<p>先把第 2.1 至 3.5 章的小节标题换成实际工作中会遇到的问题：<\/p>\n<div class=\"tbl\"><table><thead><tr><th>所处环节<\/th><th>到这里还缺什么？<\/th><th>引入的工具及其产物<\/th><th>对应章节<\/th><\/tr><\/thead><tbody><tr><td>明确任务<\/td><td>真实状态无法直接读取，究竟要求什么？<\/td><td>定义状态 x，用后验分布表达对它的判断<\/td><td>1.1.1、1.1.2<\/td><\/tr><tr><td>连接状态与数据<\/td><td>猜一个 x，怎样知道它能否解释测量？<\/td><td>用 h(x) 预测测量，得到残差 <code>r(x)=z-h(x)<\/code><\/td><td>2.2<\/td><\/tr><tr><td>比较候选状态<\/td><td>残差多大才算合理，已有信息怎样参与？<\/td><td>噪声模型给出似然，按似然选择 MLE；或结合先验得到后验并选择 MAP<\/td><td>2.1.1<\/td><\/tr><tr><td>接入时间<\/td><td>下一帧的先验从哪里来？<\/td><td>上一帧后验经过运动模型传播，成为当前帧先验<\/td><td>4.1.1<\/td><\/tr><tr><td>写成可计算的目标<\/td><td>怎样合并许多精度不同的约束？<\/td><td>高斯密度取负对数，得到带逆协方差权重的平方和 F(x)<\/td><td>2.3.1、2.4<\/td><\/tr><tr><td>求局部修正<\/td><td>F(x) 已经有了，非线性时怎样求解？<\/td><td>用雅可比 J 线性化残差，把未知量改写为当前估计附近的增量<\/td><td>3.1.3<\/td><\/tr><tr><td>算出增量<\/td><td>怎样同时照顾所有残差和它们的权重？<\/td><td>组装 g、H_GN，解 <code>H_GN*delta_x=-g<\/code><\/td><td>3.1.4<\/td><\/tr><tr><td>检查信息<\/td><td>解出来以后，哪些状态方向仍不确定？<\/td><td>查看 H_GN 的弱方向；在条件成立时估计局部协方差<\/td><td>3.3.1<\/td><\/tr><tr><td>写回状态<\/td><td>增量怎样作用到位置和旋转上？<\/td><td>位置可相加；位姿使用与雅可比一致的扰动更新<\/td><td>3.5.1<\/td><\/tr><\/tbody><\/table><\/div>\n<p>这张表按解决问题的依赖关系排列，因此把测量模型放在概率比较之前；它与章节编号顺序并不完全一致。把中间的计算压缩起来，就是：<\/p>\n<pre class=\"code\"><code>候选状态 x\n  -&gt; 预测测量 h(x)\n  -&gt; 残差 r(x)\n  -&gt; 噪声模型给似然，结合先验得到后验\n  -&gt; 选择 MAP；高斯条件下转成加权平方代价 F(x)\n  -&gt; 在当前估计处计算 r、J、g、H_GN\n  -&gt; 解出 delta_x，更新估计\n  -&gt; 检查收敛；非线性时重新计算残差和雅可比<\/code><\/pre>\n<p>这里要区分两次转换。在前面采用的高斯、固定协方差和相应条件独立假设下，对概率取负对数并删去与 x 无关的常数，保留了最优 x，属于等价改写。后面用<code>r(x_0+delta_x) ≈ r(x_0)+J*delta_x<\/code> 处理非线性残差，才引入局部近似。非线性问题通常还需要控制步长，不能保证一次更新就找到全局最优值。这一求解过程也可对照 <a href=\"https://ceres-solver.readthedocs.io/latest/nnls_solving.html\" target=\"_blank\" rel=\"noopener\">Ceres 的非线性最小二乘说明<\/a>。<\/p><\/section>\n<section class=\"sec\" data-sec=\"3.6.2\"><h3 id=\"s3.6.2\"><span class=\"num\">3.6.2<\/span> 用同一面墙走完“概率到状态更新”<\/h3>\n<p>沿用第 2.5.1 节的数据。平面机器人的状态是位置加朝向 <code>(x, y, theta)<\/code>；地图里有一面已知的竖直墙 <code>x = 5 m<\/code>，机器人大致朝着它。里程计给出先验，激光从扫描中拟合出墙线：<\/p>\n<pre class=\"code\"><code>墙的位置                           x = 5.00 m\n激光：墙到机器人的垂直距离 d        2.10 m，   sigma 0.10 m\n激光：墙线在机体系中的倾角 alpha    -0.03 rad，sigma 0.02 rad\n里程计先验均值 mu_0                (3.00 m, 1.00 m, 0.00 rad)\n先验标准差                         0.05 m, 0.10 m, 0.02 rad；y 与 theta 相关系数 0.6<\/code><\/pre>\n<p>假设先验与当前激光噪声独立，且都采用高斯模型。真实位姿仍然未知；算法使用的是上面的已知信息。<\/p>\n<p>第一步，把候选状态变成可比较的残差。<\/p>\n<pre class=\"code\"><code>预测墙距：h_d(x, y, theta)     = 5 - x\n预测倾角：h_alpha(x, y, theta) = -theta\n\n激光残差：r_laser = [d - h_d, alpha - h_alpha]\n                  = [2.10 - (5 - x), -0.03 + theta]\n                  = [x - 2.90, theta - 0.03]\n\n先验残差：r_prior = [x - 3.00, y - 1.00, theta - 0.00]<\/code><\/pre>\n<p>激光残差在 <code>x = 2.90 m<\/code>、<code>theta = 0.03 rad<\/code> 时为零，而且与 y 无关；先验残差在<code>(3.00, 1.00, 0.00)<\/code> 时为零。两份信息偏好的状态不同，所以需要根据不确定度进行融合。先验残差采用“候选值减先验均值”的定义，后续对它求导时保持同一符号即可。<\/p>\n<p>第二步，用高斯模型写出后验，再转成代价。<\/p>\n<pre class=\"code\"><code>p(x | z) proportional_to p(z | x)*p(x)\n\np(x | z) proportional_to exp(-F(x))\n\nF(x) = 0.5 * r_prior^T * P_0^-1 * r_prior\n     + 0.5 * r_laser^T * R^-1   * r_laser\n\nP_0^-1 = [400       0          0    ]        R^-1 = diag(100, 2500)\n         [  0     156.25    -468.75 ]\n         [  0    -468.75    3906.25 ]<\/code><\/pre>\n<p><code>P_0^-1<\/code> 的计算见第 2.5.1 节。现在可以把几个名称放回各自的位置：MAP 是“选择后验最高点”的估计准则；这里的 F(x) 是实现该准则的加权最小二乘目标；Gauss-Newton 是后面求解这个目标的方法。它们可以出现在同一次估计中。若删掉先验项，剩下的目标对应 MLE：x、theta 取 <code>2.90 m<\/code>、<code>0.03 rad<\/code>，y 则完全无法确定。<\/p>\n<p>第三步，在一个当前估计处计算残差和雅可比。<\/p>\n<p>选择先验均值 <code>x_0 = (3.00, 1.00, 0.00)<\/code> 作为本次求解的初值，按“先验 3 维、激光2 维”的顺序堆叠成 5 维残差：<\/p>\n<pre class=\"code\"><code>r(x_0) = [0, 0, 0, 0.10, -0.03]^T\n\n               x    y   theta\nJ_prior  =  [  1    0    0 ]\n            [  0    1    0 ]\n            [  0    0    1 ]\nJ_laser  =  [  1    0    0 ]\n            [  0    0    1 ]\n\nJ     = [J_prior; J_laser]               5 × 3\nOmega = blockdiag(P_0^-1, R^-1)          5 × 5<\/code><\/pre>\n<p>注意测量模型的导数是 <code>H_obs = d h_d / dx = -1<\/code>，墙距残差的导数却是<code>J = -H_obs = 1<\/code>：位置增加时，到墙距离减小，因此“实测减预测”的残差增加。这也说明必须先确定对哪个函数求导。J_laser 的 y 列全是 0，这是后面退化分析的伏笔。<\/p>\n<p>第四步，把残差变化和权重合起来，求状态增量。<\/p>\n<pre class=\"code\"><code>g = J^T*Omega*r\n  = J_prior^T*P_0^-1*[0, 0, 0]^T + J_laser^T*R^-1*[0.10, -0.03]^T\n  = [100*0.10, 0, 2500*(-0.03)]^T\n  = [10, 0, -75]^T\n\nH_GN = J^T*Omega*J = P_0^-1 + J_laser^T*R^-1*J_laser\n\n     = [500       0          0    ]\n       [  0     156.25    -468.75 ]\n       [  0    -468.75    6406.25 ]\n\nH_GN*delta_x = -g<\/code><\/pre>\n<p>x 与其余分量不耦合：<code>500*delta_x = -10<\/code>，<code>delta_x = -0.02 m<\/code>。(y, theta) 两个分量要一起解：<\/p>\n<pre class=\"code\"><code>[ 156.25   -468.75] * [delta_y    ]   [ 0]\n[-468.75   6406.25]   [delta_theta] = [75]\n\ndet = 781250\ndelta_y     = 468.75*75 / 781250 = 0.045 m\ndelta_theta = 156.25*75 / 781250 = 0.015 rad\n\nx_new = x_0 + delta_x = (2.98 m, 1.045 m, 0.015 rad)<\/code><\/pre>\n<p>g 说明当前各项残差还没有达到平衡；H_GN 把残差对状态的灵敏度与权重合在一起，决定本轮修正的尺度和各分量之间的耦合。<strong>g 的 y 分量是 0，y 却被修正了 0.045 m<\/strong>，这完全来自 H_GN 里 y 与 theta 之间的非对角项 -468.75：激光要求 theta 增大，先验又说 theta 与 y 正相关，于是 y 也跟着增大。本例的两个残差都是线性的，一阶展开精确，因此一步就到达最优值。第 3.1.1 节的地标测量是非线性的，就需要像第 3.1.4 节那样在更新后重新线性化。<\/p>\n<p>第五步，把结果代回去，检查究竟优化了什么。<\/p>\n<pre class=\"code\"><code>r_prior(x_new) = [-0.02, 0.045, 0.015]\nr_laser(x_new) = [ 0.08, -0.015]\n\nF(x_0)   = 1.625\nF(x_new) = 0.9625\n\ng_x     = 400*(-0.02) + 100*0.08                          = 0\ng_y     = 156.25*0.045 - 468.75*0.015                     = 0\ng_theta = -468.75*0.045 + 3906.25*0.015 + 2500*(-0.015)   = 0<\/code><\/pre>\n<p>最优状态处每条残差都不为零，但加权总代价已经最小。x 上先验的精度是激光的 4 倍，所以结果更接近先验均值；theta 上两者精度相同，所以取中间。不能把“优化成功”理解成“每条测量都被精确满足”。<\/p>\n<p>本例还可以区分初值与先验。初值 x_0 决定从哪里开始计算，先验均值与协方差则进入F(x)，影响什么状态最优。在这个线性例子中，只把初值改成 <code>(2.50, 0.50, 0.10)<\/code>，结果仍是 <code>(2.98, 1.045, 0.015)<\/code>；若保留初值却删除先验项，x、theta 变成 <code>2.90 m<\/code>、<code>0.03 rad<\/code>，而 y 在目标函数里根本不出现，正规方程在 y 方向奇异，y 不会被任何一项决定。把里程计结果用于初始化，并不自动等于在目标函数中加入了里程计先验。<\/p><\/section>\n<section class=\"sec\" data-sec=\"3.6.3\"><h3 id=\"s3.6.3\"><span class=\"num\">3.6.3<\/span> Hessian 怎样把优化连回不确定度和退化？<\/h3>\n<p>刚才得到的 H_GN 不只用于求增量。线性高斯时，目标可以配方成：<\/p>\n<pre class=\"code\"><code>F(x) = 0.9625 + 0.5 * (x - x_MAP)^T * H_GN * (x - x_MAP)\n\np(x | z) proportional_to exp(-0.5 * (x - x_MAP)^T * H_GN * (x - x_MAP))\n\n后验均值 = MAP 状态 = (2.98 m, 1.045 m, 0.015 rad)\n\n后验协方差 P_post = H_GN^-1 = [0.002    0        0     ]\n                              [0        0.0082   0.0006]\n                              [0        0.0006   0.0002]\n\n后验标准差 = (4.47 cm, 9.06 cm, 0.0141 rad)<\/code><\/pre>\n<p>这就回到了第 1.1.2 节最初想要的状态分布：既知道中心在哪里，也知道它有多宽。这里 x 的后验方差 <code>0.002 m^2<\/code> 与激光墙距的噪声方差 <code>0.01 m^2<\/code> 描述不同对象。在线性高斯且信息矩阵可逆的这个例子中，<code>P_post=H_GN^-1<\/code> 精确成立；非线性问题通常只能得到局部近似，其他适用条件见第 3.3.1.6 节。<\/p>\n<p>再单独看激光提供了多少信息，就能看到退化：<\/p>\n<pre class=\"code\"><code>H_laser = J_laser^T * R^-1 * J_laser\n        = [100   0      0]\n          [  0   0      0]\n          [  0   0   2500]\n\n特征值 {0, 100, 2500}<\/code><\/pre>\n<p>沿 y 方向移动既不改变墙距，也不改变墙线倾角，所以残差对 y 的导数是 0，H_laser在该方向的特征值也是 0。即使激光残差为零，这条测量也无法区分不同 y 的位置；减小激光噪声也不会凭空产生 y 方向的信息。<\/p>\n<p>y 在最终结果里仍有 9.06 cm 的标准差，而不是无穷大，是因为先验提供了 y 的信息；y 的标准差从先验的 10 cm 降到 9.06 cm，则是因为 theta 被激光定得更准了，而先验里y 与 theta 相关。所以“激光看不见 y”与“y 被修正了”并不矛盾：前者说的是 H_laser，后者说的是加上先验以后的完整 H_GN。<\/p>\n<p>因此，第 3.3.1 节顺着同一条计算链回答了一个新问题：优化能找到低代价的状态，这些测量是否也足以区分附近不同方向的候选状态？这正是后面分析走廊退化的入口。<\/p><\/section>\n<section class=\"sec\" data-sec=\"3.6.4\"><h3 id=\"s3.6.4\"><span class=\"num\">3.6.4<\/span> 白化、卡方检验、滤波和位姿更新分别接在哪里？<\/h3>\n<p>它们各自处理主线中的一个环节，先记住用途，再按需要回看推导。<\/p>\n<div class=\"tbl\"><table><thead><tr><th>概念<\/th><th>接入主线的位置<\/th><th>在本例或 SLAM 中的作用<\/th><\/tr><\/thead><tbody><tr><td>白化、马氏距离（1.6.5）<\/td><td>写出加权代价时<\/td><td>按协方差变换残差；白化后的平方长度就是原残差的平方马氏距离<\/td><\/tr><tr><td>卡方检验（1.6.6）<\/td><td>检查测量与预测是否一致时<\/td><td>在模型和协方差成立时，根据统计量判断残差是否异常；它本身不求最优位置<\/td><\/tr><tr><td>贝叶斯递推、卡尔曼滤波（5.1、1.6.10）<\/td><td>把一次融合接到时间序列上<\/td><td>上一帧后验经运动模型形成当前先验；在线性高斯条件下，KF 用均值和协方差表示完整后验<\/td><\/tr><tr><td>位姿扰动（3.1）<\/td><td>定义增量、求雅可比及写回状态时<\/td><td>使旋转更新后仍合法，并让雅可比与实际更新采用一致的坐标约定<\/td><\/tr><\/tbody><\/table><\/div>\n<p>例如，刚才最优状态处的白化残差如下。先验协方差有 y、theta 相关，要用它的Cholesky 因子白化；激光协方差是对角阵，直接除以标准差：<\/p>\n<pre class=\"code\"><code>L_prior = [0.05   0      0    ]        L_prior * L_prior^T = P_0\n          [0      0.1    0    ]\n          [0      0.012  0.016]\n\ne_prior = L_prior^-1 * [-0.02, 0.045, 0.015]^T = [-0.4, 0.45, 0.6]^T\ne_laser = [0.08/0.10, -0.015/0.02]^T              = [ 0.8, -0.75]^T\n\ne^T*e = 0.16 + 0.2025 + 0.36 + 0.64 + 0.5625 = 1.925\nF = 0.5*e^T*e = 0.9625<\/code><\/pre>\n<p>所以白化与加权是同一代价的两种写法。已经白化后使用普通平方和即可，再乘一次原来的信息矩阵会重复加权。卡方检验虽然也使用平方马氏距离，但还要求正确的分布、协方差与自由度；不能直接把上述拟合后的五个分量当作五个独立标准高斯变量。卡尔曼更新前的创新检验要使用包含预测不确定度的 S，详见第 4.1.3.5 节。<\/p>\n<p>把本例同一个先验和测量交给卡尔曼滤波，得到的后验均值仍为<code>(2.98 m, 1.045 m, 0.015 rad)<\/code>，后验协方差仍是第 3.6.3 节的 P_post。到下一帧，先用运动模型传播这份后验，再融合新的测量。这里要分清两个循环：<\/p>\n<pre class=\"code\"><code>同一帧内的非线性优化：\n更新候选状态 -&gt; 重算残差和雅可比 -&gt; 继续求解同一个目标\n\n不同帧之间的贝叶斯递推：\n上一帧后验 -&gt; 运动预测 -&gt; 当前帧先验 -&gt; 融合新测量 -&gt; 当前帧后验<\/code><\/pre>\n<p>第一种循环是在改进同一次求解，不能把每次迭代都当成获得一份独立的新测量。<\/p>\n<p>墙面例子固定了地图，只估计当前位姿。扩展到 SLAM 时，未知量还可能包含多帧位姿、速度、bias 和地图变量；先验、运动与观测约束通过因子连接相关变量，再联合求解。这对应第 2.5.1 节和 <a href=\"https://gtsam.org/tutorials/intro.html\" target=\"_blank\" rel=\"noopener\">GTSAM 因子图入门<\/a>中的后验建模方式。第 4.1 至 4.3 章进一步讨论这些信息怎样由图优化或滤波组织起来。<\/p><\/section>\n<section class=\"sec\" data-sec=\"3.6.5\"><h3 id=\"s3.6.5\"><span class=\"num\">3.6.5<\/span> 为什么单节大体看懂了，整体仍然没有串起来？<\/h3>\n<p>从本章的组织方式看，衔接困难可能来自下面几处：<\/p>\n<div class=\"tbl\"><table><thead><tr><th>容易断开的地方<\/th><th>为什么会影响串联？<\/th><th>重读时怎样补上连接？<\/th><\/tr><\/thead><tbody><tr><td>小节按疑问展开，前后依赖不总按计算顺序出现<\/td><td>第 2.1.1 节已使用 h(x) 和残差，第 2.2 节才系统解释；读者要来回补齐前提<\/td><td>先固定“状态—预测测量—残差”，再读似然与后验<\/td><\/tr><tr><td>支线推导较长<\/td><td>第 2.1.1 节展开概率记号，第 2.4 节又展开矩阵、白化和卡方，读到下一步时容易忘记最初要求什么<\/td><td>第一轮抓住每节的输入、输出和引入原因，矩阵细节在需要验证时回看<\/td><\/tr><tr><td>同一个问题换了表达形式<\/td><td><code>p(x | z)<\/code>、F(x) 和正规方程外观差别很大，容易被记成几个独立问题<\/td><td>每次转换都追问：仍在估计哪些变量？目标是否改变？这一步是等价改写还是近似？<\/td><\/tr><tr><td>不同层次的名称同时出现<\/td><td>MAP 是估计准则，最小二乘是目标形式，Gauss-Newton 是求解方法，白化是代价的表示方式<\/td><td>用“我要估计什么、如何比较、怎样算出结果”给名称定位<\/td><\/tr><tr><td>相似符号承担不同角色<\/td><td>x 可以表示候选，x_0 是当前线性化点；H_obs 是观测雅可比，H_GN 是近似 Hessian<\/td><td>给符号补上“对什么求导、属于哪个空间、什么时候计算”，并区分初值与先验<\/td><\/tr><tr><td>例子不断切换，读懂后还没有独立复算<\/td><td>一维测距、地标的距离与方位、y 与 yaw 相关的误差分别突出局部知识，但读者仍需自己拼接完整过程<\/td><td>保持同一组数据走完本节例子，再只修改一个条件，推演哪些量会变<\/td><\/tr><\/tbody><\/table><\/div>\n<p>因此，重读时可以把注意力放在每条箭头上：上一步留下了什么问题，下一步使用什么信息解决它。尤其要亲自补出“噪声为何变成权重”“权重为何还需要经过雅可比才成为状态信息”“求出的增量怎样写回状态”这几处连接。<\/p><\/section>\n<section class=\"sec\" data-sec=\"3.6.6\"><h3 id=\"s3.6.6\"><span class=\"num\">3.6.6<\/span> 用四个小改动检查是否已经连通<\/h3>\n<p>可以先读本章完整例子，再按“1.4 → 1.3 → 1.5、1.6 的主推导 → 2.1、2.2 →2.4、3.1”的依赖顺序回看，最后用第 4.1.1 节把一次估计接到下一时刻。白化和卡方的详细推导可以留到这条主线走通之后。<\/p>\n<p>下面每一题都从第 3.6.2 节的原始数据重新开始，只改一个条件。先自行推演，再看核对值；重点是说明哪些量改变、哪些量不变以及原因。<\/p>\n<div class=\"tbl\"><table><thead><tr><th>改动<\/th><th>需要追踪的关系<\/th><th>核对值<\/th><\/tr><\/thead><tbody><tr><td>墙距从 2.10 m 改成 2.20 m<\/td><td>测量改变残差，再改变 g 和估计值；本例中 J、权重与 H_GN 不变<\/td><td>在初值处 <code>g=[20, 0, -75]<\/code>，H_GN 不变；MAP 为 <code>(2.96, 1.045, 0.015)<\/code>，后验协方差不变<\/td><\/tr><tr><td>墙距标准差从 0.10 m 改成 0.05 m<\/td><td>原始残差不变，墙距权重增加，后验中心和宽度都改变<\/td><td>墙距权重变成 400；x 的 MAP 为 <code>2.95 m<\/code>，x 的后验方差为 <code>1/800=0.00125 m^2<\/code>；y、theta 不变<\/td><\/tr><tr><td>只删去先验项，初值仍取先验均值<\/td><td>初值仍可用于求导，但不再向目标函数提供约束<\/td><td>x、theta 的 MLE 为 <code>2.90 m<\/code>、<code>0.03 rad<\/code>；H_GN 变成 <code>diag(100, 0, 2500)<\/code>，y 方向奇异，MLE 不唯一<\/td><\/tr><tr><td>把先验中 y 与 theta 的相关系数从 0.6 改成 0<\/td><td>先验不再把 theta 的修正传给 y<\/td><td>theta 仍为 <code>0.015 rad<\/code>，y 停在 <code>1.00 m<\/code>，y 的后验方差仍是先验的 <code>0.01 m^2<\/code><\/td><\/tr><\/tbody><\/table><\/div>\n<p>复算时，可以每一步都写下当前已知量、待求量、采用的假设和输出。在哪一步无法继续，就回到那一步对应的小节补齐推导。<\/p><\/section>\n<section class=\"sec\" data-sec=\"3.6.7\"><h3 id=\"s3.6.7\"><span class=\"num\">3.6.7<\/span> 本章面试题与参考答案<\/h3>\n<p>先自己作答，再对照答案；答案后括号注明对应小节。<\/p>\n<h4>题目<\/h4>\n<ol><li value=\"1\">用一条链说清楚“从候选状态到更新后的估计”要经过哪些步骤。其中哪一步是等价改写，哪一步引入了近似？<\/li><li value=\"2\">MAP、加权最小二乘、Gauss-Newton、白化经常被混为一谈。它们分别处在哪个层次？删掉先验后又对应什么估计？追问：用里程计结果作为优化初值，是否等于在目标函数中加入了里程计先验？<\/li><li value=\"3\">墙面例子中，墙距测量的 <code>H_obs=-1<\/code>，而残差雅可比 <code>J=1<\/code>。为什么符号相反？面试时怎样避免这类符号错误？<\/li><li value=\"4\">墙面例子里初值处 <code>g=[10, 0, -75]^T<\/code>，y 分量为 0，解出的 <code>delta_y<\/code> 却是 <code>0.045 m<\/code>。y 的修正从哪里来？<\/li><li value=\"5\">最优状态 <code>(2.98, 1.045, 0.015)<\/code> 处，先验残差和激光残差都不为零。这说明优化没收敛吗？为什么 x 更靠近先验、theta 取在中间？<\/li><li value=\"6\">激光单独提供的信息矩阵 <code>H_laser<\/code> 的特征值是 <code>{0, 100, 2500}<\/code>，最终 y 的后验标准差却是 <code>9.06 cm<\/code> 而不是无穷大。怎样解释“激光看不见 y”和“y 被修正了”同时成立？把激光噪声调得更小能解决吗？<\/li><li value=\"7\">手算：只把墙距标准差从 <code>0.10 m<\/code> 改成 <code>0.05 m<\/code>，x 的 MAP 和后验方差变成多少？y、theta 是否变化？<\/li><li value=\"8\">已经白化的残差，再乘一次原来的信息矩阵会怎样？拟合后的 5 个白化残差平方和能否直接查 5 自由度卡方表？追问：同一帧内的迭代和帧间递推有什么区别？<\/li><\/ol>\n<h4>参考答案<\/h4>\n<p><strong>1. 主链条与等价/近似的分界<\/strong><\/p>\n<pre class=\"code\"><code>候选状态 x -&gt; 预测测量 h(x) -&gt; 残差 r(x)\n  -&gt; 噪声模型给似然，结合先验得到后验\n  -&gt; 选择 MAP；高斯条件下转成加权平方代价 F(x)\n  -&gt; 在当前估计处计算 r、J、g、H_GN\n  -&gt; 解 H_GN*delta_x = -g，更新估计\n  -&gt; 检查收敛；非线性时重新线性化<\/code><\/pre>\n<p>在高斯、固定协方差和条件独立假设下，对后验取负对数并删去与 x 无关的常数，最优 x 不变，是等价改写。用 <code>r(x_0+delta_x) ≈ r(x_0)+J*delta_x<\/code> 处理非线性残差才引入局部近似，所以非线性问题通常要迭代并控制步长，不能保证一次到全局最优。（见 3.6.1）<\/p>\n<p><strong>2. 四个名称的层次<\/strong><\/p>\n<ul><li>MAP 是估计准则：选后验最高点；<\/li><li>加权最小二乘 F(x) 是目标形式：高斯后验取负对数得到；<\/li><li>Gauss-Newton 是求解方法：线性化后解正规方程；<\/li><li>白化是代价的一种表示方式：按协方差变换残差后用普通平方和。<\/li><\/ul>\n<p>它们可以同时出现在同一次估计里。删掉先验项，剩下的目标对应 MLE；墙面例子中 x、theta 取 <code>2.90 m<\/code>、<code>0.03 rad<\/code>，y 完全无法确定。<\/p>\n<p>追问：不等于。初值 x_0 只决定从哪里开始计算、在哪里求导；先验均值和协方差进入 F(x)，才影响什么状态最优。本例是线性问题，把初值改成 <code>(2.50, 0.50, 0.10)<\/code>，结果仍是 <code>(2.98, 1.045, 0.015)<\/code>。反过来，保留先验均值作初值、却删掉先验项，y 在目标函数中不出现，<code>H_GN=diag(100, 0, 2500)<\/code> 在 y 方向奇异，y 不被任何一项决定。所以“用里程计初始化”并不自动等于“融合了里程计”。（见 3.6.2、3.6.5、3.6.6）<\/p>\n<p><strong>3. <code>H_obs<\/code> 与 <code>J<\/code> 的符号<\/strong><\/p>\n<pre class=\"code\"><code>h_d = 5 - x              =&gt;  H_obs = d h_d/dx = -1\nr_d = d - h_d = x - 2.90 =&gt;  J = d r_d/dx = -H_obs = 1<\/code><\/pre>\n<p>位置增加时预测墙距减小，“实测减预测”的残差反而增大，所以两者符号相反。避免方法：先写清楚求导对象是 <code>h(x)<\/code> 还是 <code>r(x)<\/code>，以及残差是 <code>z-h<\/code> 还是 <code>h-z<\/code>；先验残差也要固定“候选值减先验均值”的定义，后续求导保持一致。（见 3.6.2）<\/p>\n<p><strong>4. g 的 y 分量为 0，y 为什么被修正？<\/strong><\/p>\n<p>修正来自 H_GN 的非对角耦合。(y, theta) 两个分量联立：<\/p>\n<pre class=\"code\"><code>[ 156.25   -468.75] * [delta_y    ]   [ 0]\n[-468.75   6406.25]   [delta_theta] = [75]\n\ndet = 781250\ndelta_y     = 468.75*75/781250 = 0.045 m\ndelta_theta = 156.25*75/781250 = 0.015 rad<\/code><\/pre>\n<p>激光要求 theta 增大，先验又说 y 与 theta 正相关（相关系数 0.6），信息矩阵里的 <code>-468.75<\/code> 把 theta 的修正传给了 y。若把相关系数改成 0，theta 仍为 <code>0.015 rad<\/code>，y 停在 <code>1.00 m<\/code>。（见 3.6.2、3.6.6）<\/p>\n<p><strong>5. 残差不为零是否说明没收敛？<\/strong><\/p>\n<p>不说明。最优点的判据是梯度为零，而不是每条残差为零：<\/p>\n<pre class=\"code\"><code>g_x     = 400*(-0.02) + 100*0.08                         = 0\ng_y     = 156.25*0.045 - 468.75*0.015                    = 0\ng_theta = -468.75*0.045 + 3906.25*0.015 + 2500*(-0.015)  = 0\n\nF(x_0) = 1.625  -&gt;  F(x_new) = 0.9625<\/code><\/pre>\n<p>两份信息偏好不同状态，最优解是按精度加权的折中。x 上先验信息 400、激光信息 100，先验精度是激光的 4 倍，所以 x 偏向先验；theta 上先验标准差 0.02 rad 与激光倾角标准差相同，精度相等，结果取在 0 与 0.03 的中间。本例残差是线性的，一步就到最优。（见 3.6.2）<\/p>\n<p><strong>6. 激光退化与 y 的后验<\/strong><\/p>\n<pre class=\"code\"><code>H_laser = J_laser^T*R^-1*J_laser = diag(100, 0, 2500)\n\nP_post = H_GN^-1，后验标准差 = (4.47 cm, 9.06 cm, 0.0141 rad)<\/code><\/pre>\n<p>沿 y 移动既不改变墙距也不改变倾角，残差对 y 的导数为 0，H_laser 在 y 方向特征值为 0，这是“激光看不见 y”。y 的有限不确定度来自完整 H_GN 中的先验；y 从先验的 10 cm 降到 9.06 cm，是因为 theta 被激光定准了，而先验里 y 与 theta 相关。减小激光噪声只会放大 100 和 2500 两个特征值，0 乘任何权重仍是 0，不会凭空产生 y 方向信息，这就是走廊退化的雏形。（见 3.6.3）<\/p>\n<p><strong>7. 手算：墙距标准差改为 0.05 m<\/strong><\/p>\n<p>墙距权重从 100 变成 <code>1/0.05^2 = 400<\/code>，x 与其他分量不耦合：<\/p>\n<pre class=\"code\"><code>H_xx = 400(先验) + 400(激光) = 800\ng_x  = 400*0.10 = 40\ndelta_x = -40/800 = -0.05 m  =&gt;  x_MAP = 2.95 m\n\nP_post_xx = 1/800 = 0.00125 m^2<\/code><\/pre>\n<p>原始残差不变，权重变大，后验中心和宽度都变：两份信息精度相同，x 取 3.00 和 2.90 的中点。y、theta 的方程没有变，仍为 <code>1.045 m<\/code>、<code>0.015 rad<\/code>，协方差也不变。（见 3.6.6）<\/p>\n<p><strong>8. 白化、卡方与两种循环<\/strong><\/p>\n<p>白化与加权是同一代价的两种写法：<\/p>\n<pre class=\"code\"><code>F = 0.5*r^T*Omega*r = 0.5*e^T*e，e = L^-1*r<\/code><\/pre>\n<p>已经白化后再乘信息矩阵，就是重复加权，权重被平方。本例 <code>e^T*e = 1.925<\/code>，但这 5 个分量是拟合后的残差，已被估计值“吸收”了一部分自由度，不能当作 5 个独立标准高斯变量直接查表；卡方检验还要求分布、协方差和自由度都正确。卡尔曼更新前的创新检验应使用包含预测不确定度的 <code>S_k<\/code>。<\/p>\n<p>追问：同一帧内的迭代是“更新候选 -&gt; 重算残差和雅可比 -&gt; 继续求同一个目标”，不能把每次迭代当成一份新测量；帧间递推是“上一帧后验 -&gt; 运动预测 -&gt; 当前先验 -&gt; 融合新测量”。（见 3.6.4）<\/p>\n<hr><\/section>", "sections": [{"id": "3.6.1", "title": "按“上一步还缺什么”重组基础三章"}, {"id": "3.6.2", "title": "用同一面墙走完“概率到状态更新”"}, {"id": "3.6.3", "title": "Hessian 怎样把优化连回不确定度和退化？"}, {"id": "3.6.4", "title": "白化、卡方检验、滤波和位姿更新分别接在哪里？"}, {"id": "3.6.5", "title": "为什么单节大体看懂了，整体仍然没有串起来？"}, {"id": "3.6.6", "title": "用四个小改动检查是否已经连通"}, {"id": "3.6.7", "title": "本章面试题与参考答案"}]}]}, {"key": "L4", "label": "第 4 级", "title": "三种估计框架：滤波、图优化与粒子滤波", "intro": "<div class=\"callout goal\"><strong>这一级学完，你能回答<\/strong>：卡尔曼的预测和更新公式从哪里来，卡尔曼增益为什么是那个比例；g2o、GTSAM、iSAM2 分别是什么，Bayes tree 保存了什么；为什么线性高斯下 KF 与图优化等价、非线性时不等价；粒子滤波和 AMCL 怎样工作；VINS-Mono 与 ORB-SLAM 怎样用滑动窗口和边缘化控制规模。<\/div>\n<p>前三级解决的是“一次估计”。这一级把它接到时间序列上：数据一帧一帧到来，历史怎样保存或压缩。<\/p>", "chapters": [{"num": "4.1", "title": "贝叶斯递推与卡尔曼滤波", "html": "<section class=\"sec\" data-sec=\"4.1.0\"><div class=\"callout tip\"><strong>为什么现在学这一章<\/strong>：滤波的思路是：只保存当前状态的均值和协方差，每来一帧就“预测 + 更新”。本章从一维数字讲到多维 MAP 推导，再讲卡方门控放在哪一步。<\/div>\n<p>第 2.1 章只处理一次估计。真实系统每来一帧数据都要更新一次，因此还需要把“上一帧的结论”变成“这一帧的先验”。从概率角度，一次滤波只有“预测、更新”两步：<\/p>\n<pre class=\"code\"><code>上一时刻后验 p(x_(k-1) | z_1:k-1)\n        --运动模型预测--&gt;\n当前先验     p(x_k | z_1:k-1)\n        --乘当前测量似然 p(z_k | x_k)--&gt;\n当前后验     p(x_k | z_1:k)<\/code><\/pre>\n<p>标准卡尔曼滤波的特殊之处是：运动和测量都是线性的，所有噪声都是高斯的，因此上述三个分布始终是高斯分布。算法只需要保存每个高斯分布的均值和协方差，不必保存整条概率密度曲线。<\/p>\n<p>初次阅读本章可以按下面顺序：<\/p>\n<pre class=\"code\"><code>5.1：为什么可以一帧一帧递推\n  -&gt; 5.2：P 怎样随运动传播\n  -&gt; 5.3.1 至 5.3.4：P_k、S_k、K_k 是什么以及 K_k 怎样修正耦合状态\n  -&gt; 5.3.5 至 5.3.8：NIS、卡方阈值和耦合测量门控<\/code><\/pre><\/section>\n<section class=\"sec\" data-sec=\"4.1.1\"><h3 id=\"s4.1.1\"><span class=\"num\">4.1.1<\/span> 为什么滤波可以一帧一帧递推？<\/h3>\n<p>机器人运动通常采用一阶马尔可夫假设：给定上一时刻状态后，当前状态不再直接依赖更早的状态。当前测量也主要由当前状态决定：<\/p>\n<pre class=\"code\"><code>x_(k-1) ──运动模型──&gt; x_k ──测量模型──&gt; z_k<\/code><\/pre>\n<p>先根据上一时刻后验预测当前状态：<\/p>\n<pre class=\"code\"><code>p(x_k | z_1:k-1)\n= ∫ [\n    p(x_k | x_(k-1))\n    * p(x_(k-1) | z_1:k-1)\n  ] dx_(k-1)<\/code><\/pre>\n<p>这个积分只是在枚举所有可能的上一状态：<\/p>\n<ul><li>上一状态本身有多可能；<\/li><li>从它运动到当前状态有多可能；<\/li><li>对所有上一状态的贡献求和。<\/li><\/ul>\n<p>得到新测量 <code>z_k<\/code> 后，再使用贝叶斯公式更新：<\/p>\n<pre class=\"code\"><code>p(x_k | z_1:k)\nproportional_to\np(z_k | x_k) * p(x_k | z_1:k-1)<\/code><\/pre>\n<p>左边正是前面出现的 <code>p(x_k | z_1:k)<\/code>。它来自贝叶斯递推，不是卡尔曼滤波专门发明的记号。卡尔曼滤波只是在线性高斯条件下高效计算这个分布的一种方法。若系统还有已知控制输入 u，更完整的条件中也应包含 <code>u_1:k<\/code>；为突出测量，本文在概率记号里将它省略。<\/p><\/section>\n<section class=\"sec\" data-sec=\"4.1.2\"><h3 id=\"s4.1.2\"><span class=\"num\">4.1.2<\/span> 卡尔曼预测公式从哪里来？<\/h3>\n<p>先看线性运动模型：<\/p>\n<pre class=\"code\"><code>x_true_k = F_k*x_true_(k-1) + B_k*u_k + w_k<\/code><\/pre>\n<p>这是卡尔曼滤波教材中的常见写法：<\/p>\n<ul><li><code>F_k<\/code> 是把第 k-1 步状态传播到第 k 步的状态转移矩阵；有些教材把同一个矩阵记作<code>F_(k-1)<\/code>，只是下标习惯不同；<\/li><li><code>B_k<\/code> 把控制量 <code>u_k<\/code> 映射到状态空间；<\/li><li><code>w_k<\/code> 是均值为 0、协方差为 <code>Q_k<\/code> 的过程噪声。<\/li><\/ul>\n<p>这里的 <code>F_k<\/code> 是一个矩阵，不是前文的优化目标函数 <code>F(x)<\/code>。<code>x_true_k<\/code> 仍是真实但未知的状态；滤波器实际维护的是它的估计均值和协方差。<\/p>\n<p>常见资料对“预测”和“更新”有两套等价记法：<\/p>\n<div class=\"tbl\"><table><thead><tr><th>本文写法<\/th><th>条件下标写法<\/th><th>含义<\/th><\/tr><\/thead><tbody><tr><td><code>x_hat_k^-<\/code><\/td><td><code>x_hat_(k|k-1)<\/code><\/td><td>已使用截至第 k-1 步的信息，对第 k 步状态的预测<\/td><\/tr><tr><td><code>P_k^-<\/code><\/td><td><code>P_(k|k-1)<\/code><\/td><td>上述预测误差的协方差<\/td><\/tr><tr><td><code>x_hat_k^+<\/code><\/td><td><code>x_hat_(k|k)<\/code><\/td><td>再融合第 k 步测量后的后验状态<\/td><\/tr><tr><td><code>P_k^+<\/code><\/td><td><code>P_(k|k)<\/code><\/td><td>上述后验误差的协方差<\/td><\/tr><\/tbody><\/table><\/div>\n<p>上标 <code>-<\/code> 表示“测量更新前”，上标 <code>+<\/code> 表示“测量更新后”，不是负数和正数。<\/p>\n<p>假设：<\/p>\n<pre class=\"code\"><code>上一时刻的后验均值为 x_hat_(k-1)^+\n上一时刻的后验协方差为 P_(k-1)^+\nE[w_k] = 0，covariance(w_k) = Q_k<\/code><\/pre>\n<p>对运动模型取期望：<\/p>\n<pre class=\"code\"><code>x_hat_k^- = F_k*x_hat_(k-1)^+ + B_k*u_k<\/code><\/pre>\n<p>为什么过程噪声 <code>w_k<\/code> 没出现在均值公式里？因为它的均值是 0。预测误差为：<\/p>\n<pre class=\"code\"><code>e_k^-\n= x_true_k - x_hat_k^-\n\n= F_k*(x_true_(k-1) - x_hat_(k-1)^+) + w_k<\/code><\/pre>\n<p>若上一时刻状态误差与过程噪声相互独立，对误差外积取期望：<\/p>\n<pre class=\"code\"><code>P_k^-\n= E[e_k^-*(e_k^-)^T]\n\n= E[(F_k*e_(k-1)^+ + w_k)\n    *(F_k*e_(k-1)^+ + w_k)^T]\n\n= F_k*E[e_(k-1)^+*(e_(k-1)^+)^T]*F_k^T\n  + F_k*E[e_(k-1)^+*w_k^T]\n  + E[w_k*(e_(k-1)^+)^T]*F_k^T\n  + E[w_k*w_k^T]<\/code><\/pre>\n<p>独立且均值为 0 时，中间两个交叉项为 0；第一项中的期望是 <code>P_(k-1)^+<\/code>，最后一项是 <code>Q_k<\/code>，所以：<\/p>\n<pre class=\"code\"><code>P_k^- = F_k*P_(k-1)^+*F_k^T + Q_k<\/code><\/pre>\n<p>预测公式只是“旧协方差经过状态转移矩阵传播，再加上这一步新产生的过程噪声”，不是需要背诵的魔法。如果上一时刻误差与过程噪声相关，交叉项不能删除，简单公式也就不再成立。<\/p>\n<p>先用一维位置把这一步算完。上一时刻位置估计为 <code>2.80 m<\/code>，标准差为 <code>0.10 m<\/code>；轮速计报告机器人前进了 <code>0.20 m<\/code>。假设这个位移已经作为控制量写进模型，并认为本次运动额外引入的标准差是 <code>0.05 m<\/code>：<\/p>\n<pre class=\"code\"><code>x_hat_(k-1)^+ = 2.80 m\nP_(k-1)^+     = 0.10^2 = 0.0100 m^2\n\nu_k = 0.20 m\nF_k = 1\nB_k = 1\nQ_k = 0.05^2 = 0.0025 m^2<\/code><\/pre>\n<p>预测均值是：<\/p>\n<pre class=\"code\"><code>x_hat_k^-\n= 1*2.80 + 1*0.20\n= 3.00 m<\/code><\/pre>\n<p>预测方差是：<\/p>\n<pre class=\"code\"><code>P_k^-\n= 1*0.0100*1 + 0.0025\n= 0.0125 m^2<\/code><\/pre>\n<p>预测标准差为：<\/p>\n<pre class=\"code\"><code>sigma_k^- = sqrt(0.0125) approximately_equals 0.1118 m<\/code><\/pre>\n<p>注意，独立误差相加时相加的是方差，不是标准差，所以不能写成<code>0.10+0.05=0.15 m<\/code>。现在滤波器得到了一条预测：当前位置大约是 <code>3.00 m<\/code>，但仍有<code>0.1118 m<\/code> 的标准差。下一节再用新测量修正它。<\/p>\n<p>本例选择把轮速位移作为带过程不确定度的控制输入。如果某个系统改为把轮速建立成独立测量更新，也可以采用另一种模型，但不能把同一份轮速数据既放进 <code>u_k/Q_k<\/code>，又作为独立测量因子重复融合。<\/p><\/section>\n<section class=\"sec\" data-sec=\"4.1.3\"><h3 id=\"s4.1.3\"><span class=\"num\">4.1.3<\/span> 卡尔曼更新公式从哪里来？<\/h3>\n<p>更新只做一件事：比较“运动预测”和“新测量”各自有多可信，然后得到融合后的后验。不要先背卡尔曼增益，按下面顺序理解：<\/p>\n<pre class=\"code\"><code>预测状态 x_hat_k^- 和预测协方差 P_k^-\n        ↓\n新测量 z_k 和测量协方差 R_k\n        ↓\n计算实际测量与预测测量之差 nu_k\n        ↓\n最小化“偏离预测的代价 + 不符合测量的代价”\n        ↓\n得到 x_hat_k^+、P_k^+ 和 K_k<\/code><\/pre>\n<p>本节先说明各符号，再用第 4.1.2 节的一维数据手算，最后才推广到矩阵。所有推导都假设预测误差和测量噪声相互独立、均值为 0，并且服从高斯分布。<\/p>\n<h4 id=\"s4.1.3.1\"><span class=\"num\">4.1.3.1<\/span> <code>P_k、Q_k、R_k、S_k<\/code> 分别表示什么？<\/h4>\n<p>设状态有 <code>n<\/code> 维、测量有 <code>m<\/code> 维：<\/p>\n<div class=\"tbl\"><table><thead><tr><th>矩阵<\/th><th>尺寸<\/th><th>含义<\/th><\/tr><\/thead><tbody><tr><td><code>P_k^-<\/code><\/td><td><code>n × n<\/code><\/td><td>融合第 k 次测量前，状态预测误差的协方差<\/td><\/tr><tr><td><code>P_k^+<\/code><\/td><td><code>n × n<\/code><\/td><td>融合第 k 次测量后，状态后验误差的协方差<\/td><\/tr><tr><td><code>Q_k<\/code><\/td><td>在本节模型中为 <code>n × n<\/code><\/td><td>第 k 步过程噪声映射到状态后增加的不确定度<\/td><\/tr><tr><td><code>R_k<\/code><\/td><td><code>m × m<\/code><\/td><td>第 k 次传感器测量噪声的协方差<\/td><\/tr><tr><td><code>S_k<\/code><\/td><td><code>m × m<\/code><\/td><td>第 k 次创新的协方差<\/td><\/tr><tr><td><code>H_k<\/code><\/td><td><code>m × n<\/code><\/td><td>把状态误差映射到测量空间的观测矩阵或观测雅可比<\/td><\/tr><\/tbody><\/table><\/div>\n<p>预测误差和更新后的误差分别是：<\/p>\n<pre class=\"code\"><code>e_k^- = x_true_k - x_hat_k^-\ne_k^+ = x_true_k - x_hat_k^+<\/code><\/pre>\n<p>所以：<\/p>\n<pre class=\"code\"><code>P_k^- = E[e_k^-*(e_k^-)^T]\nP_k^+ = E[e_k^+*(e_k^+)^T]<\/code><\/pre>\n<p>例如状态是位置和速度：<\/p>\n<pre class=\"code\"><code>x = [position, velocity]^T\n\nP = [P_pp  P_pv]\n    [P_vp  P_vv]<\/code><\/pre>\n<p>其中：<\/p>\n<ul><li><code>P_pp<\/code> 是位置误差方差；<\/li><li><code>P_vv<\/code> 是速度误差方差；<\/li><li><code>P_pv<\/code>、<code>P_vp<\/code> 是位置误差与速度误差的交叉协方差。<\/li><\/ul>\n<p>对角线开平方得到各状态分量的标准差。非对角线不能简单理解成“另一个方差”，它表示两种误差是否倾向于一起变化。这个相关性使“只测位置”也可能间接修正速度。<\/p>\n<p>第 4.1.2 节已经推导了预测协方差：<\/p>\n<pre class=\"code\"><code>P_k^- = F_k*P_(k-1)^+*F_k^T + Q_k<\/code><\/pre>\n<p>线性测量模型写成：<\/p>\n<pre class=\"code\"><code>z_k = H_k*x_true_k + v_k\n\nE[v_k] = 0\ncovariance(v_k) = R_k<\/code><\/pre>\n<p><code>H_k*x_hat_k^-<\/code> 是滤波器根据预测状态算出的预测测量。实际测量减去预测测量叫创新：<\/p>\n<pre class=\"code\"><code>nu_k = z_k - H_k*x_hat_k^-<\/code><\/pre>\n<p>把测量模型代入创新：<\/p>\n<pre class=\"code\"><code>nu_k = H_k*(x_true_k-x_hat_k^-) + v_k\n     = H_k*e_k^- + v_k<\/code><\/pre>\n<p>这一步非常重要：创新不是只有传感器噪声。它同时包含预测状态的误差 <code>H_k*e_k^-<\/code>和测量噪声 <code>v_k<\/code>。若二者相互独立，和的协方差等于协方差之和：<\/p>\n<pre class=\"code\"><code>S_k = H_k*P_k^-*H_k^T + R_k<\/code><\/pre>\n<p>因此 <code>S_k<\/code> 同时包含“状态预测可能错多少”和“传感器自身可能错多少”。卡方检验应该使用 <code>S_k<\/code>，而不是只使用 <code>R_k<\/code>。<\/p>\n<p>非线性测量写成 <code>z_k=h(x_true_k)+v_k<\/code>。EKF 先在 <code>x_hat_k^-<\/code> 处对 h 做一阶展开，此时：<\/p>\n<pre class=\"code\"><code>预测测量 = h(x_hat_k^-)\n\nH_k = partial(h)/partial(x), evaluated at x_hat_k^-\n\nnu_k = z_k-h(x_hat_k^-)<\/code><\/pre>\n<p>这里的 <code>H_k<\/code> 是观测雅可比，不是优化中的 Hessian。本文把优化中的近似 Hessian写成 <code>H_GN<\/code> 或在局部上下文中简称 H。<\/p>\n<h4 id=\"s4.1.3.2\"><span class=\"num\">4.1.3.2<\/span> 一维卡尔曼增益为什么是这个比例？<\/h4>\n<p>继续使用第 4.1.2 节的预测结果：<\/p>\n<pre class=\"code\"><code>x_hat_k^- = 3.00 m\nP_k^-     = 0.0125 m^2<\/code><\/pre>\n<p>现在位置传感器测得 <code>3.10 m<\/code>，测量标准差为 <code>0.10 m<\/code>：<\/p>\n<pre class=\"code\"><code>z_k = 3.10 m\nR_k = 0.10^2 = 0.0100 m^2\nH_k = 1<\/code><\/pre>\n<p>因为传感器直接测位置，所以 <code>H_k=1<\/code>。先不要使用卡尔曼公式，把候选位置记为 x。预测分布要求 x 不要离 <code>3.00 m<\/code> 太远，测量似然要求 x 不要离 <code>3.10 m<\/code> 太远。高斯后验的负对数代价是：<\/p>\n<pre class=\"code\"><code>F(x)\n= 0.5*(x-x_hat_k^-)^2/P_k^-\n  + 0.5*(z_k-x)^2/R_k<\/code><\/pre>\n<p>第一项来自预测先验，第二项来自测量。对 x 求导：<\/p>\n<pre class=\"code\"><code>dF/dx\n= (x-x_hat_k^-)/P_k^-\n  - (z_k-x)/R_k<\/code><\/pre>\n<p>令导数等于 0：<\/p>\n<pre class=\"code\"><code>(x-x_hat_k^-)/P_k^-\n= (z_k-x)/R_k<\/code><\/pre>\n<p>两边同乘 <code>P_k^-*R_k<\/code>，再整理 x：<\/p>\n<pre class=\"code\"><code>R_k*(x-x_hat_k^-)\n= P_k^-*(z_k-x)\n\n(P_k^-+R_k)*x\n= R_k*x_hat_k^- + P_k^-*z_k\n\nx\n= [R_k*x_hat_k^- + P_k^-*z_k]\n  / [P_k^-+R_k]<\/code><\/pre>\n<p>把最后一行重新拆开：<\/p>\n<pre class=\"code\"><code>x\n= x_hat_k^-\n  + [P_k^-/(P_k^-+R_k)]*(z_k-x_hat_k^-)<\/code><\/pre>\n<p>方括号里的比例就是一维卡尔曼增益：<\/p>\n<pre class=\"code\"><code>K_k = P_k^-/(P_k^-+R_k)\n\nnu_k = z_k-x_hat_k^-\n\nx_hat_k^+ = x_hat_k^-+K_k*nu_k<\/code><\/pre>\n<p>这说明卡尔曼更新不是凭空规定的“加权平均”，而是高斯先验乘高斯似然后，对负对数代价求最小值的结果。代入本例数字：<\/p>\n<pre class=\"code\"><code>nu_k = 3.10-3.00 = 0.10 m\n\nK_k\n= 0.0125/(0.0125+0.0100)\napproximately_equals 0.5556\n\nx_hat_k^+\n= 3.00 + 0.5556*0.10\napproximately_equals 3.0556 m<\/code><\/pre>\n<p>后验方差从同一个二次函数的二阶导数得到。二阶导数就是后验信息量：<\/p>\n<pre class=\"code\"><code>1/P_k^+\n= 1/P_k^- + 1/R_k\n= 1/0.0125 + 1/0.0100\n= 80 + 100\n= 180 m^-2\n\nP_k^+ = 1/180 approximately_equals 0.00556 m^2\n\nsigma_k^+\n= sqrt(P_k^+)\napproximately_equals 0.0745 m<\/code><\/pre>\n<p>融合后的标准差 <code>0.0745 m<\/code> 同时小于预测的 <code>0.1118 m<\/code> 和测量的 <code>0.10 m<\/code>。这是因为两条相互独立的信息共同约束了同一个位置。<\/p>\n<figure class=\"still\"><img loading=\"lazy\" src=\"img/static/kalman-fusion.png\" alt=\"卡尔曼预测、测量与后验三条分布\"><figcaption>卡尔曼预测、测量与后验三条分布<\/figcaption><\/figure>\n<blockquote>图注：后验均值 3.0556 落在预测 3.00 与测量 3.10 之间，位置由 <code>K = P^-/(P^-+R) = 0.5556<\/code> 决定；后验标准差 0.0745 比预测和测量都小。<\/blockquote>\n<p>从增益也能看到信任关系：<code>P_k^-<\/code> 越大表示预测越不准，<code>K_k<\/code> 越接近 1；<code>R_k<\/code> 越大表示测量越不准，<code>K_k<\/code> 越接近 0。这里比较的是方差，而不是标准差。<\/p>\n<figure class=\"anim\"><div class=\"player\"><video src=\"vid/kalman_1d.mp4\" poster=\"vid/kalman_1d.jpg\" muted loop playsinline preload=\"none\" aria-label=\"动画 18：一维卡尔曼：预测变宽（方差相加），融合测量后变窄（信息相加）；创新超过门限时被卡方检验拒绝\"><\/video><\/div><figcaption><span class=\"badge\">动画 18<\/span>一维卡尔曼：预测变宽（方差相加），融合测量后变窄（信息相加）；创新超过门限时被卡方检验拒绝<\/figcaption><\/figure>\n<h4 id=\"s4.1.3.3\"><span class=\"num\">4.1.3.3<\/span> 多维卡尔曼更新怎样从 MAP 目标推导出来？<\/h4>\n<p>一维推导推广到多维后，候选状态写成：<\/p>\n<pre class=\"code\"><code>x_candidate = x_hat_k^- + delta_x_k<\/code><\/pre>\n<p>线性测量模型为：<\/p>\n<pre class=\"code\"><code>z_k = H_k*x_true_k + v_k<\/code><\/pre>\n<p>在预测状态处的创新是：<\/p>\n<pre class=\"code\"><code>nu_k = z_k-H_k*x_hat_k^-<\/code><\/pre>\n<p>候选状态对应的测量残差为：<\/p>\n<pre class=\"code\"><code>z_k-H_k*x_candidate\n= nu_k-H_k*delta_x_k<\/code><\/pre>\n<p>预测先验和测量似然都是高斯分布，因此 MAP 等价于最小化：<\/p>\n<pre class=\"code\"><code>F(delta_x_k)\n= 0.5*delta_x_k^T*(P_k^-)^-1*delta_x_k\n\n  + 0.5*(nu_k-H_k*delta_x_k)^T\n       * R_k^-1\n       * (nu_k-H_k*delta_x_k)<\/code><\/pre>\n<p>第一项惩罚候选状态过度偏离预测，第二项惩罚候选状态不能解释新测量。下面把求导过程完整写出。因为 <code>P_k^-<\/code> 和 <code>R_k<\/code> 都是对称协方差矩阵：<\/p>\n<pre class=\"code\"><code>partial/partial(delta_x_k)\n[0.5*delta_x_k^T*(P_k^-)^-1*delta_x_k]\n= (P_k^-)^-1*delta_x_k<\/code><\/pre>\n<p>测量项的导数为：<\/p>\n<pre class=\"code\"><code>partial/partial(delta_x_k)\n[0.5*(nu_k-H_k*delta_x_k)^T\n     * R_k^-1\n     * (nu_k-H_k*delta_x_k)]\n\n= -H_k^T*R_k^-1*(nu_k-H_k*delta_x_k)<\/code><\/pre>\n<p>两项相加并令导数等于 0：<\/p>\n<pre class=\"code\"><code>(P_k^-)^-1*delta_x_k\n- H_k^T*R_k^-1*(nu_k-H_k*delta_x_k)\n= 0<\/code><\/pre>\n<p>展开并整理：<\/p>\n<pre class=\"code\"><code>[(P_k^-)^-1 + H_k^T*R_k^-1*H_k]*delta_x_k\n= H_k^T*R_k^-1*nu_k<\/code><\/pre>\n<p>这就是多维 MAP 的正规方程。左侧方括号中的矩阵是后验信息矩阵：<\/p>\n<pre class=\"code\"><code>(P_k^+)^-1\n= (P_k^-)^-1 + H_k^T*R_k^-1*H_k<\/code><\/pre>\n<p>它直接表达了：<\/p>\n<pre class=\"code\"><code>后验信息 = 预测信息 + 新测量信息<\/code><\/pre>\n<p>再定义创新协方差和卡尔曼增益：<\/p>\n<pre class=\"code\"><code>S_k = H_k*P_k^-*H_k^T + R_k\n\nK_k = P_k^-*H_k^T*S_k^-1<\/code><\/pre>\n<p>于是正规方程的解可以写成：<\/p>\n<pre class=\"code\"><code>delta_x_k = K_k*nu_k\n\nx_hat_k^+ = x_hat_k^-+K_k*nu_k<\/code><\/pre>\n<p>为什么这个 <code>K_k<\/code> 确实是正规方程的解？令：<\/p>\n<pre class=\"code\"><code>A_k = (P_k^-)^-1 + H_k^T*R_k^-1*H_k<\/code><\/pre>\n<p>把 <code>K_k<\/code> 代入左侧：<\/p>\n<pre class=\"code\"><code>A_k*K_k\n= [(P_k^-)^-1 + H_k^T*R_k^-1*H_k]\n  * P_k^-*H_k^T*S_k^-1\n\n= H_k^T*S_k^-1\n  + H_k^T*R_k^-1*H_k*P_k^-*H_k^T*S_k^-1\n\n= H_k^T*R_k^-1\n  * [R_k + H_k*P_k^-*H_k^T]\n  * S_k^-1\n\n= H_k^T*R_k^-1*S_k*S_k^-1\n\n= H_k^T*R_k^-1<\/code><\/pre>\n<p>所以 <code>A_k*(K_k*nu_k)=H_k^T*R_k^-1*nu_k<\/code>，正好满足正规方程。这里没有要求读者直接相信“套用矩阵求逆引理”。<\/p>\n<p>最后推导后验协方差。由状态更新式和创新表达式：<\/p>\n<pre class=\"code\"><code>x_hat_k^+ = x_hat_k^-+K_k*nu_k\n\nnu_k = H_k*e_k^-+v_k<\/code><\/pre>\n<p>更新后的状态误差为：<\/p>\n<pre class=\"code\"><code>e_k^+\n= x_true_k-x_hat_k^+\n\n= e_k^- - K_k*(H_k*e_k^-+v_k)\n\n= (I-K_k*H_k)*e_k^- - K_k*v_k<\/code><\/pre>\n<p>对 <code>e_k^+<\/code> 的外积取期望。预测误差与测量噪声相互独立时，交叉项为 0，因此：<\/p>\n<pre class=\"code\"><code>P_k^+\n= (I-K_k*H_k)*P_k^-*(I-K_k*H_k)^T\n  + K_k*R_k*K_k^T<\/code><\/pre>\n<p>这就是 Joseph 形式。它不是额外规定出来的，而是“更新后误差的协方差”定义直接展开的结果。代入最优卡尔曼增益并做代数化简，还可以得到：<\/p>\n<pre class=\"code\"><code>P_k^+ = (I-K_k*H_k)*P_k^-<\/code><\/pre>\n<p>但简化形式对浮点误差更敏感，工程实现通常保留 Joseph 形式，以更好地保持 P 的对称性和半正定性。程序中也通常通过 Cholesky、LDLT 或 QR 求解线性方程，不应显式计算 <code>S_k^-1<\/code>、<code>R_k^-1<\/code> 或 <code>(P_k^-)^-1<\/code>。<\/p>\n<h4 id=\"s4.1.3.4\"><span class=\"num\">4.1.3.4<\/span> 为什么只测位置也可能修正速度？<\/h4>\n<p>设状态为：<\/p>\n<pre class=\"code\"><code>x = [position, velocity]^T<\/code><\/pre>\n<p>预测协方差、观测矩阵和测量方差为：<\/p>\n<pre class=\"code\"><code>P_k^- = [4.0  1.5]\n        [1.5  1.0]\n\nH_k = [1, 0]\nR_k = 1<\/code><\/pre>\n<p>传感器只直接测位置。创新协方差为：<\/p>\n<pre class=\"code\"><code>S_k = H_k*P_k^-*H_k^T + R_k = 4+1 = 5<\/code><\/pre>\n<p>卡尔曼增益为：<\/p>\n<pre class=\"code\"><code>K_k\n= P_k^-*H_k^T*S_k^-1\n\n= [4.0] / 5\n  [1.5]\n\n= [0.8]\n  [0.3]<\/code><\/pre>\n<p>若位置创新 <code>nu_k=2 m<\/code>，状态修正为：<\/p>\n<pre class=\"code\"><code>K_k*nu_k = [1.6 m, 0.6 m/s]^T<\/code><\/pre>\n<p>速度也被修正，是因为 <code>P_k^-<\/code> 中位置和速度的交叉协方差为 <code>1.5<\/code>。滤波器此前的运动模型告诉它：位置误差与速度误差倾向于一起变化。如果交叉协方差为 0，这次位置测量就不会直接修正速度。<\/p>\n<figure class=\"anim\"><div class=\"player\"><video src=\"vid/correlated_update.mp4\" poster=\"vid/correlated_update.jpg\" muted loop playsinline preload=\"none\" aria-label=\"动画 19：只测位置也能修正速度：靠的是先验协方差里的交叉项 P_pv；P_pv = 0 时速度不动\"><\/video><\/div><figcaption><span class=\"badge\">动画 19<\/span>只测位置也能修正速度：靠的是先验协方差里的交叉项 P_pv；P_pv = 0 时速度不动<\/figcaption><\/figure>\n<h4 id=\"s4.1.3.5\"><span class=\"num\">4.1.3.5<\/span> 卡方检验为什么使用 <code>nu_k^T*S_k^-1*nu_k<\/code>？<\/h4>\n<p>先问一个实际问题：创新 <code>0.5 m<\/code> 到底算大还是小？如果预测和传感器都只能精确到几米，<code>0.5 m<\/code> 很正常；如果二者都能精确到厘米，<code>0.5 m<\/code> 就非常异常。因此不能只看创新本身，还必须除以创新的标准差。<\/p>\n<p>在本节“传感器直接测一维位置、<code>H_k=1<\/code>”的情况下，第 4.1.3.1 节已经得到：<\/p>\n<pre class=\"code\"><code>nu_k = z_k-x_hat_k^-\n\nS_k = P_k^-+R_k<\/code><\/pre>\n<p>其中 <code>S_k<\/code> 是创新的方差。把创新除以自己的标准差：<\/p>\n<pre class=\"code\"><code>a_k = nu_k/sqrt(S_k)<\/code><\/pre>\n<p>在线性、高斯且模型正确时，<code>a_k<\/code> 服从标准高斯分布。标准高斯变量的平方按定义服从自由度为 1 的卡方分布，所以：<\/p>\n<pre class=\"code\"><code>NIS_k\n= a_k^2\n= nu_k^2/S_k<\/code><\/pre>\n<p>NIS 是 Normalized Innovation Squared，即归一化创新平方。继续使用第 4.1.3.2 节的数据：<\/p>\n<pre class=\"code\"><code>x_hat_k^- = 3.00 m\nP_k^-     = 0.0125 m^2\nR_k       = 0.0100 m^2\nz_k       = 3.10 m\n\nnu_k = 3.10-3.00 = 0.10 m\nS_k  = 0.0125+0.0100 = 0.0225 m^2\n\nsqrt(S_k) = 0.15 m\na_k       = 0.10/0.15 approximately_equals 0.6667\nNIS_k     = 0.6667^2 approximately_equals 0.4444<\/code><\/pre>\n<p>自由度为 1 的 95% 上限是 <code>3.841<\/code>。因为 <code>0.4444 &lt; 3.841<\/code>，这次创新与当前预测和噪声模型没有明显冲突。<\/p>\n<p>如果测量变成 <code>z_k=3.50 m<\/code>，其他条件不变：<\/p>\n<pre class=\"code\"><code>nu_k = 3.50-3.00 = 0.50 m\n\nNIS_k = 0.50^2/0.0225 approximately_equals 11.111<\/code><\/pre>\n<p><code>11.111 &gt; 3.841<\/code>，因此这次测量会被 95% 门控判为异常候选。<\/p>\n<p>为什么不能只用测量方差 <code>R_k<\/code>？因为预测本身也不是真值。假设预测标准差增大到<code>0.30 m<\/code>，仍然出现 <code>0.50 m<\/code> 的创新：<\/p>\n<pre class=\"code\"><code>P_k^- = 0.30^2 = 0.09 m^2\nR_k   = 0.10^2 = 0.01 m^2\n\n错误做法：nu_k^2/R_k\n          = 0.50^2/0.01\n          = 25\n\n正确做法：S_k = P_k^-+R_k = 0.10 m^2\n\n          NIS_k = nu_k^2/S_k\n                = 0.50^2/0.10\n                = 2.5<\/code><\/pre>\n<p>只用 <code>R_k<\/code> 会把“预测不确定”错误地算到传感器头上，并拒绝本来可能合理的测量。<\/p>\n<p>多维情况下，先对创新协方差做 Cholesky 分解：<\/p>\n<pre class=\"code\"><code>S_k = L_k*L_k^T\n\ne_white_k = L_k^-1*nu_k<\/code><\/pre>\n<p>白化后，<code>e_white_k<\/code> 的 m 个有效分量是相互独立的标准高斯变量。它们的平方和服从自由度为 m 的卡方分布：<\/p>\n<pre class=\"code\"><code>NIS_k\n= e_white_k^T*e_white_k\n= nu_k^T*S_k^-1*nu_k<\/code><\/pre>\n<p>所以 NIS 就是创新在其自身协方差下的平方马氏距离。它是无量纲数，而不是米、像素或弧度。<\/p>\n<h4 id=\"s4.1.3.6\"><span class=\"num\">4.1.3.6<\/span> 卡方阈值从哪里来？自由度怎样选择？<\/h4>\n<p>置信度 95% 的上限 q 满足：<\/p>\n<pre class=\"code\"><code>Probability(chi_square(m) &lt;= q) = 0.95<\/code><\/pre>\n<p>也就是卡方密度曲线从 0 到 q 的面积为 95%。从 0 到 q 的累计面积叫卡方分布的累计分布函数 CDF，q 是它的 95% 分位数：<\/p>\n<pre class=\"code\"><code>q = inverse_CDF(0.95, degrees_of_freedom=m)<\/code><\/pre>\n<p>这个反函数通常由统计表或数值库计算，不是从某一帧测量里算出来的。自由度 m 不同，卡方曲线不同，所以门限也不同。常用上限如下：<\/p>\n<pre class=\"code\"><code>当前卡方统计量/NIS：由当前残差或创新计算\n卡方门限：          由自由度和置信度查表或调用 inverse_CDF 得到\n判断：              当前统计量 &lt;= 门限，则不拒绝；否则判为异常候选<\/code><\/pre>\n<div class=\"tbl\"><table><thead><tr><th>有效自由度 m<\/th><th>95%上限<\/th><th>99%上限<\/th><\/tr><\/thead><tbody><tr><td>1<\/td><td>3.841<\/td><td>6.635<\/td><\/tr><tr><td>2<\/td><td>5.991<\/td><td>9.210<\/td><\/tr><tr><td>3<\/td><td>7.815<\/td><td>11.345<\/td><\/tr><tr><td>4<\/td><td>9.488<\/td><td>13.277<\/td><\/tr><tr><td>6<\/td><td>12.592<\/td><td>16.812<\/td><\/tr><tr><td>9<\/td><td>16.919<\/td><td>21.666<\/td><\/tr><\/tbody><\/table><\/div>\n<p>自由度通常取本次创新的有效维数，不是整个状态向量的维数。例如：<\/p>\n<div class=\"tbl\"><table><thead><tr><th>测量<\/th><th>状态可能有多少维<\/th><th>本次创新维数/自由度<\/th><\/tr><\/thead><tbody><tr><td>一维距离<\/td><td>15<\/td><td>1<\/td><\/tr><tr><td>二维位置<\/td><td>15<\/td><td>2<\/td><\/tr><tr><td>三维 RTK 位置<\/td><td>15<\/td><td>3<\/td><\/tr><tr><td>六维相对位姿<\/td><td>15 或更多<\/td><td>6<\/td><\/tr><\/tbody><\/table><\/div>\n<p>如果创新协方差 <code>S_k<\/code> 满秩，即使不同分量有相关性，使用完整 <code>S_k<\/code> 白化后，自由度仍是 m。如果 <code>S_k<\/code> 奇异，或者几个残差存在严格线性关系，则应删除重复约束，或只在有效子空间中计算；这时自由度取有效秩，不能机械地取向量长度。<\/p>\n<p>一维情况下，95% 标准正态区间约为 <code>[-1.96,1.96]<\/code>。把端点平方：<\/p>\n<pre class=\"code\"><code>1.96^2 approximately_equals 3.841<\/code><\/pre>\n<p>这就是一维 95% 卡方上限的直观来源。99% 上限比 95% 上限更大，因此 99% 门控更宽松、拒绝的测量更少，并不是“更严格”。还要注意：即使模型完全正确，95% 门控长期也会误拒绝约 5% 的正常样本，所以一次超限不是故障原因诊断结论。<\/p>\n<h4 id=\"s4.1.3.7\"><span class=\"num\">4.1.3.7<\/span> 耦合测量怎样做卡方检验？<\/h4>\n<p>假设二维创新与协方差为：<\/p>\n<pre class=\"code\"><code>nu_k = [0.2, -0.1]^T\n\nS_k = [0.05  0.03]\n      [0.03  0.10]<\/code><\/pre>\n<p>非对角线 <code>0.03<\/code> 表示两个创新分量相关。使用完整矩阵：<\/p>\n<pre class=\"code\"><code>先求解 S_k*w = nu_k：\n\n[0.05  0.03] [w_1] = [ 0.2]\n[0.03  0.10] [w_2]   [-0.1]\n\n解得：\n\nw approximately_equals [5.6098, -2.6829]^T\n\n然后：\n\nNIS_k\n= nu_k^T*w\n= 0.2*5.6098 + (-0.1)*(-2.6829)\napproximately_equals 1.390<\/code><\/pre>\n<p>这里的 w 就是 <code>S_k^-1*nu_k<\/code>，但程序通过解线性方程得到它，不需要显式求逆。<\/p>\n<p>如果错误地丢掉相关项，则会得到：<\/p>\n<pre class=\"code\"><code>NIS_wrong\n= 0.2^2/0.05 + (-0.1)^2/0.10\n= 0.9<\/code><\/pre>\n<p>两个结果明显不同。因为本例 <code>S_k<\/code> 满秩且创新为二维，仍使用自由度 2；95% 上限为<code>5.991<\/code>，所以 <code>1.390<\/code> 没有超过门限。<\/p>\n<p>“两个变量耦合”并不等于自由度自动减少。只要 <code>S_k<\/code> 满秩，白化后仍能得到两个独立标准高斯分量，自由度就是 2；只有存在严格线性依赖、有效秩变成 1 时，自由度才取 1。<\/p>\n<p>多个传感器若共享原始数据、共同 bias 或同一个先验，它们的创新也可能相关。此时应构造包含交叉协方差的联合 <code>S_k<\/code>，或者避免把相关测量假装成独立测量。忽略相关性通常会使滤波器过度自信，并破坏 NIS 的卡方分布假设。<\/p>\n<h4 id=\"s4.1.3.8\"><span class=\"num\">4.1.3.8<\/span> 卡方门控放在卡尔曼更新的哪一步？<\/h4>\n<p>完整顺序是：<\/p>\n<pre class=\"code\"><code>1. 预测 x_hat_k^- 和 P_k^-\n2. 计算创新 nu_k = z_k-h(x_hat_k^-)\n3. 计算观测雅可比 H_k\n4. 计算 S_k = H_k*P_k^-*H_k^T + R_k\n5. 计算 NIS_k = nu_k^T*S_k^-1*nu_k\n6. 根据创新有效维数和置信度查卡方门限\n7. 通过门限后再计算 K_k、更新 x_hat_k^+ 和 P_k^+\n8. 未通过时拒绝、降权，或转入传感器/匹配异常诊断<\/code><\/pre>\n<p>EKF 中的 <code>h<\/code> 和 <code>H_k<\/code> 来自当前预测点附近的非线性线性化，因此 NIS 只近似服从卡方分布。错误外参、时间不同步、未建模相关性、动态物体和错误数据关联都会让统计结果偏离理论分布。门控只能说明“这次测量与当前预测和噪声模型不一致”，不能单独判断到底是哪一种原因。<\/p>\n<p>还要区分 NIS 与 NEES：<\/p>\n<pre class=\"code\"><code>NIS_k  = nu_k^T*S_k^-1*nu_k\n\ne_k    = x_hat_k^+-x_true_k\nNEES_k = e_k^T*(P_k^+)^-1*e_k<\/code><\/pre>\n<p>NIS 在测量空间计算，不需要知道真实状态，自由度通常是测量维数。NEES 在状态空间检查 <code>P_k^+<\/code> 是否可信，需要真值，自由度通常是被检查状态误差的有效维数。<\/p>\n<p>单次 NIS 主要用于门控，多次 NIS 才适合判断噪声参数是否长期合理。m 维创新在模型正确时满足：<\/p>\n<pre class=\"code\"><code>expected_value(NIS_k) approximately_equals m<\/code><\/pre>\n<p>如果许多帧的 NIS 长期明显大于 m，常见原因是 <code>P_k^-<\/code> 或 <code>R_k<\/code> 设得过小、模型漏项或外点过多；长期明显小于 m，则可能是协方差设得过大。实际的一致性检验应对一段样本使用相应的卡方区间，并考虑时间相关性，不能只看某一帧是否超过 95% 上限。<\/p><\/section>\n<section class=\"sec\" data-sec=\"4.1.4\"><h3 id=\"s4.1.4\"><span class=\"num\">4.1.4<\/span> 本章面试题与参考答案<\/h3>\n<p>先自己作答，再对照答案；答案后括号注明对应小节。<\/p>\n<h4>题目<\/h4>\n<ol><li value=\"1\">贝叶斯滤波为什么可以一帧一帧递推？写出预测和更新两步的概率公式，并说明依赖了哪些假设。标准卡尔曼滤波为什么只需要保存均值和协方差？<\/li><li value=\"2\">从线性运动模型推导 <code>P_k^- = F_k*P_(k-1)^+*F_k^T + Q_k<\/code>。哪一步用到了独立性？如果上一时刻误差与过程噪声相关会怎样？<\/li><li value=\"3\">手算：上一时刻位置 <code>3.00 m<\/code>、标准差 <code>0.20 m<\/code>；控制位移 <code>0.50 m<\/code>，过程噪声标准差 <code>0.15 m<\/code>；随后位置传感器测得 <code>3.80 m<\/code>，标准差 <code>0.25 m<\/code>。求预测、增益、后验均值与标准差。追问：预测标准差为什么不是 <code>0.35 m<\/code>？<\/li><li value=\"4\">工程陷阱：轮速计的位移已经作为控制量 <code>u_k<\/code> 并配了 <code>Q_k<\/code>，能否再把同一份轮速数据作为独立测量更新一次？<\/li><li value=\"5\">创新 <code>nu_k<\/code> 由哪几部分组成？推导 <code>S_k<\/code>。为什么创新门控必须用 <code>S_k<\/code> 而不是 <code>R_k<\/code>？<\/li><li value=\"6\">不背公式，从“预测先验 + 测量似然”的 MAP 目标推出一维卡尔曼增益 <code>K_k=P_k^-/(P_k^-+R_k)<\/code>。<code>K_k<\/code> 趋近 0 和 1 各说明什么？后验方差怎样得到？<\/li><li value=\"7\">多维卡尔曼更新怎样从 MAP 目标推出？“后验信息 = 预测信息 + 新测量信息”在公式里体现在哪里？追问：怎样不借助矩阵求逆引理验证 <code>K_k=P_k^-*H_k^T*S_k^-1<\/code> 是正规方程的解？<\/li><li value=\"8\">Joseph 形式和 <code>P_k^+=(I-K_k*H_k)*P_k^-<\/code> 有什么区别？工程上为什么偏向 Joseph 形式？为什么不显式计算 <code>S_k^-1<\/code>？<\/li><li value=\"9\">手算：状态为位置和速度，<code>P_k^-=[4 2; 2 3]<\/code>，只测位置，<code>H_k=[1, 0]<\/code>，<code>R_k=4<\/code>，位置创新 <code>nu_k=1 m<\/code>。求 <code>K_k<\/code>、状态修正和 <code>P_k^+<\/code>。追问：交叉协方差为 0 时会怎样？<\/li><li value=\"10\">卡方门限从哪里来？自由度按什么取？“99% 门控比 95% 门控更严格”这句话对吗？<code>S_k<\/code> 奇异时怎么办？<\/li><li value=\"11\">陷阱题：二维创新 <code>nu_k=[0.3, -0.3]^T<\/code>，<code>S_k=[0.10 0.08; 0.08 0.10]<\/code>。分别用完整 <code>S_k<\/code> 和只用对角线计算 NIS，95% 门控结论是否相同？<\/li><li value=\"12\">卡方门控放在 EKF 更新流程的哪一步？NIS 和 NEES 有什么区别？怎样用 NIS 判断噪声参数调得是否合理？<\/li><\/ol>\n<h4>参考答案<\/h4>\n<p><strong>1. 贝叶斯递推的两步<\/strong><\/p>\n<p>一阶马尔可夫假设：给定 <code>x_(k-1)<\/code> 后，<code>x_k<\/code> 不再直接依赖更早的状态；当前测量主要由当前状态决定。于是：<\/p>\n<pre class=\"code\"><code>预测：p(x_k | z_1:k-1) = ∫ [p(x_k | x_(k-1)) * p(x_(k-1) | z_1:k-1)] dx_(k-1)\n\n更新：p(x_k | z_1:k) proportional_to p(z_k | x_k) * p(x_k | z_1:k-1)<\/code><\/pre>\n<p>积分是在枚举所有可能的上一状态：它本身多可能、从它运动过来多可能，再求和。线性运动、线性测量、高斯噪声时，先验、似然、后验始终是高斯，高斯由均值和协方差完全确定，所以卡尔曼滤波只需保存 <code>x_hat<\/code> 和 <code>P<\/code>。卡尔曼滤波是这个递推在线性高斯条件下的高效实现，不是另一套理论。（见第 4.1 章引言、4.1.1）<\/p>\n<p><strong>2. 预测协方差的推导<\/strong><\/p>\n<pre class=\"code\"><code>x_true_k = F_k*x_true_(k-1) + B_k*u_k + w_k\nx_hat_k^- = F_k*x_hat_(k-1)^+ + B_k*u_k           # w_k 均值为 0\n\ne_k^- = F_k*e_(k-1)^+ + w_k\n\nP_k^- = E[e_k^-*(e_k^-)^T]\n      = F_k*P_(k-1)^+*F_k^T\n        + F_k*E[e_(k-1)^+*w_k^T] + E[w_k*(e_(k-1)^+)^T]*F_k^T\n        + Q_k<\/code><\/pre>\n<p>上一时刻误差与过程噪声独立且均值为 0，中间两个交叉项才为 0，得到标准公式。若二者相关，交叉项不能删，简单公式不再成立。含义就是“旧协方差经状态转移传播，再加这一步新产生的过程噪声”。（见 4.1.2）<\/p>\n<p><strong>3. 手算一次完整的预测与更新<\/strong><\/p>\n<pre class=\"code\"><code>预测：x_hat_k^- = 3.00 + 0.50 = 3.50 m\n      P_k^- = 0.20^2 + 0.15^2 = 0.0400 + 0.0225 = 0.0625 m^2，sigma = 0.25 m\n\n更新：R_k = 0.25^2 = 0.0625 m^2\n      nu_k = 3.80 - 3.50 = 0.30 m\n      K_k = 0.0625/(0.0625+0.0625) = 0.5\n      x_hat_k^+ = 3.50 + 0.5*0.30 = 3.65 m\n\n      1/P_k^+ = 1/0.0625 + 1/0.0625 = 32  =&gt;  P_k^+ = 0.03125 m^2\n      sigma_k^+ approximately_equals 0.1768 m<\/code><\/pre>\n<p>预测与测量精度相同，所以取中点，后验标准差比两者都小。追问：独立误差相加的是方差，不是标准差，<code>sqrt(0.04+0.0225)=0.25 m<\/code>，写成 <code>0.20+0.15=0.35 m<\/code> 会高估预测不确定度。（见 4.1.2、4.1.3.2）<\/p>\n<p><strong>4. 同一份轮速数据能否用两次？<\/strong><\/p>\n<p>不能。一份数据只能以一种方式进入模型：要么作为控制输入并用 <code>Q_k<\/code> 描述其不确定度，要么建成独立测量更新，二选一。既放进 <code>u_k/Q_k<\/code> 又作为测量融合，相当于把同一信息算了两遍，协方差会被错误地缩小，滤波器过度自信，后续正确的测量反而更容易被门控拒掉。（见 4.1.2）<\/p>\n<p><strong>5. 创新的组成与 <code>S_k<\/code><\/strong><\/p>\n<pre class=\"code\"><code>nu_k = z_k - H_k*x_hat_k^-\n     = H_k*(x_true_k - x_hat_k^-) + v_k\n     = H_k*e_k^- + v_k\n\nS_k = H_k*P_k^-*H_k^T + R_k       # 预测误差与测量噪声独立<\/code><\/pre>\n<p>创新不只是传感器噪声，还包含预测状态本身的误差。只用 <code>R_k<\/code> 会把“预测不准”算到传感器头上。例：<code>P_k^-=0.09<\/code>、<code>R_k=0.01<\/code>、<code>nu_k=0.5<\/code>，错误算法 <code>0.25/0.01=25<\/code> 远超 3.841 被拒，正确算法 <code>S_k=0.10<\/code>，<code>NIS=2.5<\/code>，应当接受。（见 4.1.3.1、4.1.3.5）<\/p>\n<p><strong>6. 一维增益的推导<\/strong><\/p>\n<pre class=\"code\"><code>F(x) = 0.5*(x-x_hat_k^-)^2/P_k^- + 0.5*(z_k-x)^2/R_k\n\ndF/dx = (x-x_hat_k^-)/P_k^- - (z_k-x)/R_k = 0\n\nx = [R_k*x_hat_k^- + P_k^-*z_k]/(P_k^-+R_k)\n  = x_hat_k^- + [P_k^-/(P_k^-+R_k)]*(z_k-x_hat_k^-)<\/code><\/pre>\n<p>方括号就是 <code>K_k<\/code>。<code>K_k<\/code> 趋近 1 表示预测很不准（<code>P_k^-<\/code> 大），几乎完全相信测量；趋近 0 表示测量很不准（<code>R_k<\/code> 大），几乎不动预测。比较的是方差而不是标准差。后验方差来自同一个二次函数的二阶导数，即后验信息量：<\/p>\n<pre class=\"code\"><code>1/P_k^+ = 1/P_k^- + 1/R_k<\/code><\/pre>\n<p>（见 4.1.3.2）<\/p>\n<p><strong>7. 多维更新的 MAP 推导<\/strong><\/p>\n<p>令 <code>x_candidate = x_hat_k^- + delta_x_k<\/code>：<\/p>\n<pre class=\"code\"><code>F(delta_x_k) = 0.5*delta_x_k^T*(P_k^-)^-1*delta_x_k\n             + 0.5*(nu_k-H_k*delta_x_k)^T*R_k^-1*(nu_k-H_k*delta_x_k)\n\n求导置零：\n[(P_k^-)^-1 + H_k^T*R_k^-1*H_k]*delta_x_k = H_k^T*R_k^-1*nu_k<\/code><\/pre>\n<p>左侧方括号就是后验信息矩阵 <code>(P_k^+)^-1<\/code>，即预测信息加新测量信息。追问：记 <code>A_k<\/code> 为该矩阵，直接代入：<\/p>\n<pre class=\"code\"><code>A_k*K_k = H_k^T*S_k^-1 + H_k^T*R_k^-1*H_k*P_k^-*H_k^T*S_k^-1\n        = H_k^T*R_k^-1*[R_k + H_k*P_k^-*H_k^T]*S_k^-1\n        = H_k^T*R_k^-1<\/code><\/pre>\n<p>所以 <code>delta_x_k=K_k*nu_k<\/code> 满足正规方程，卡尔曼更新就是这个 MAP 问题的解。（见 4.1.3.3）<\/p>\n<p><strong>8. Joseph 形式与数值实现<\/strong><\/p>\n<p>由 <code>e_k^+ = (I-K_k*H_k)*e_k^- - K_k*v_k<\/code> 直接对外积取期望：<\/p>\n<pre class=\"code\"><code>P_k^+ = (I-K_k*H_k)*P_k^-*(I-K_k*H_k)^T + K_k*R_k*K_k^T<\/code><\/pre>\n<p>Joseph 形式是误差协方差定义的直接展开，推导中没有用到 K 最优这一条件；简化形式 <code>(I-K_k*H_k)*P_k^-<\/code> 是代入最优增益后化简得到的，对浮点误差更敏感，容易让 P 失去对称性或半正定性。工程上保留 Joseph 形式，并用 Cholesky、LDLT 或 QR 解线性方程，不显式计算 <code>S_k^-1<\/code>、<code>R_k^-1<\/code> 或 <code>(P_k^-)^-1<\/code>，以减少病态时的数值误差。（见 4.1.3.3）<\/p>\n<p><strong>9. 手算：只测位置修正速度<\/strong><\/p>\n<pre class=\"code\"><code>S_k = H_k*P_k^-*H_k^T + R_k = 4 + 4 = 8\n\nK_k = P_k^-*H_k^T*S_k^-1 = [4, 2]^T/8 = [0.5, 0.25]^T\n\nK_k*nu_k = [0.5 m, 0.25 m/s]^T\n\nP_k^+ = (I-K_k*H_k)*P_k^- = [2.0  1.0]\n                            [1.0  2.5]<\/code><\/pre>\n<p>用 Joseph 形式算出的结果相同。速度被修正、速度方差从 3 降到 2.5，都来自交叉协方差 <code>P_pv=2<\/code>：运动模型让滤波器知道位置误差与速度误差倾向于一起变化。追问：若交叉协方差为 0，<code>K_k<\/code> 的速度分量为 0，这次位置测量不会直接修正速度。（见 4.1.3.1、4.1.3.4）<\/p>\n<p><strong>10. 卡方门限与自由度<\/strong><\/p>\n<p>门限 q 是卡方分布的分位数，<code>q = inverse_CDF(0.95, m)<\/code>，由统计表或数值库给出，不是从某帧测量算出来的。自由度取本次创新的有效维数，不是状态维数：15 维状态下一维距离取 1，三维 RTK 位置取 3，六维相对位姿取 6。一维时 <code>1.96^2 approximately_equals 3.841<\/code>，就是 95% 上限的来源。<\/p>\n<p>“99% 更严格”是错的：99% 上限（m=1 时 6.635）比 95%（3.841）更大，门控更宽松，拒绝得更少。另外即使模型完全正确，95% 门控长期也会误拒约 5% 的正常样本。<code>S_k<\/code> 奇异或残差间有严格线性关系时，应删除重复约束或在有效子空间计算，自由度取有效秩。（见 4.1.3.6）<\/p>\n<p><strong>11. 陷阱题：丢掉相关项的 NIS<\/strong><\/p>\n<pre class=\"code\"><code>解 S_k*w = nu_k：\n[0.10  0.08] [w_1]   [ 0.3]\n[0.08  0.10] [w_2] = [-0.3]\nw = [15, -15]^T\n\nNIS_k    = nu_k^T*w = 0.3*15 + (-0.3)*(-15) = 9.0\nNIS_diag = 0.3^2/0.10 + 0.3^2/0.10         = 1.8\n\n95% 门限（m=2）= 5.991<\/code><\/pre>\n<p>完整计算 <code>9.0 &gt; 5.991<\/code>，判为异常候选；只用对角线 <code>1.8<\/code>，会被放行，结论相反。原因是 <code>S_k<\/code> 说两个分量强正相关、倾向同号，而这次创新一正一负，恰好落在最不可能的方向上。若创新变成 <code>[0.3, 0.3]^T<\/code>，完整 NIS 为 1.0，对角近似反而是 1.8。所以丢掉相关项既可能漏检也可能误报。<code>S_k<\/code> 满秩，自由度仍取 2，耦合不会让自由度减少。（见 4.1.3.7）<\/p>\n<p><strong>12. 门控位置、NIS 与 NEES<\/strong><\/p>\n<p>顺序：预测 <code>x_hat_k^-<\/code>、<code>P_k^-<\/code> -&gt; 计算 <code>nu_k<\/code> 和 <code>H_k<\/code> -&gt; 计算 <code>S_k<\/code> -&gt; 计算 NIS -&gt; 按有效维数和置信度查门限 -&gt; 通过后再算 <code>K_k<\/code> 并更新 -&gt; 未通过则拒绝、降权或转入异常诊断。门控必须放在更新之前，否则外点已经污染了状态。EKF 中 h 是在预测点线性化的，NIS 只近似服从卡方分布。<\/p>\n<pre class=\"code\"><code>NIS_k  = nu_k^T*S_k^-1*nu_k            测量空间，不需要真值，自由度约为测量维数\nNEES_k = e_k^T*(P_k^+)^-1*e_k          状态空间，需要真值，检查 P_k^+ 是否可信<\/code><\/pre>\n<p>单次 NIS 用于门控，多帧 NIS 用于调参：模型正确时 <code>NIS<\/code> 的均值约等于 m。长期明显大于 m，常见原因是 <code>P_k^-<\/code> 或 <code>R_k<\/code> 偏小、模型漏项或外点多；长期明显小于 m，则协方差可能设得过大。一次超限只说明“与当前预测和噪声模型不一致”，不能单独判定是外参、时间同步、动态物体还是数据关联出了错。（见 4.1.3.8）<\/p>\n<hr><\/section>", "sections": [{"id": "4.1.1", "title": "为什么滤波可以一帧一帧递推？"}, {"id": "4.1.2", "title": "卡尔曼预测公式从哪里来？"}, {"id": "4.1.3", "title": "卡尔曼更新公式从哪里来？"}, {"id": "4.1.4", "title": "本章面试题与参考答案"}]}, {"num": "4.2", "title": "图优化与因子图：g2o、GTSAM 与 iSAM2", "html": "<section class=\"sec\" data-sec=\"4.2.0\"><div class=\"callout tip\"><strong>为什么现在学这一章<\/strong>：图优化的思路相反：保留整段轨迹的所有节点和约束，一起求解。本章先手算一维位姿图和二维多传感器图，再看 g2o 与 GTSAM 怎样实现，以及 iSAM2 怎样增量更新。<\/div>\n<p>本章回答原文的“问题四”：g2o 和 iSAM2 到底有什么区别？<\/p>\n<p>第 4.1 章把历史信息压缩进当前状态的均值和协方差；本章的做法相反，它把状态和测量都保留成图中的节点与边，再联合求解。两者求的是同一个 MAP 问题，区别在于计算怎样组织——这一点到第 4.3 章再正面比较。<\/p><\/section>\n<section class=\"sec\" data-sec=\"4.2.1\"><h3 id=\"s4.2.1\"><span class=\"num\">4.2.1<\/span> 先纠正一个容易混淆的比较<\/h3>\n<p>严格地说，g2o 和 iSAM2 不是同一层级的名称：<\/p>\n<pre class=\"code\"><code>g2o     一个通用图优化软件框架\niSAM2   一个增量平滑与建图算法\nGTSAM   一个因子图软件库，其中实现了 iSAM2<\/code><\/pre>\n<p>所以更严谨的比较有两种：<\/p>\n<pre class=\"code\"><code>软件库比较：g2o 与 GTSAM\n\n求解方式比较：\ng2o 的典型批量 Gauss-Newton / LM\n与\nGTSAM 中的 iSAM2 增量优化<\/code><\/pre>\n<p>LIO-SAM 使用的是 GTSAM 中的 <code>ISAM2<\/code> 类，不是早期的原始 iSAM。本节后面说“iSAM”时，除非特别指出，都指 LIO-SAM 实际使用的 iSAM2。<\/p>\n<p>它们并不是在求两个不同答案。只要状态、测量、残差、协方差和初值相同，它们面对的仍然是同一个 MAP 或非线性最小二乘问题，主要区别在于：新测量不断到来时，怎样组织和重复利用以前的计算结果。<\/p>\n<p>本章内容较多，第一次阅读不必从所有软件细节穿过去。建议按下面顺序：<\/p>\n<pre class=\"code\"><code>先读 6.3、6.4：用一维例子理解“多条边怎样折中”\n  -&gt; 读 6.6.1 至 6.6.4：手算二维多传感器最终结果\n  -&gt; 读 6.6.7、6.6.8：看 g2o 和 GTSAM 怎样实现同一个目标\n  -&gt; 读 6.7.2、6.7.3：看 iSAM2 怎样逐次加入 RTK 和回环\n  -&gt; 最后读 6.8 至 6.10：理解 Bayes tree 和重线性化<\/code><\/pre><\/section>\n<section class=\"sec\" data-sec=\"4.2.2\"><h3 id=\"s4.2.2\"><span class=\"num\">4.2.2<\/span> 为什么它们底层在解同一个问题？<\/h3>\n<p>一个测量因子写成概率：<\/p>\n<pre class=\"code\"><code>phi_i(X) = p(z_i | X_i)<\/code><\/pre>\n<p>给定全部测量，联合后验可以分解为：<\/p>\n<pre class=\"code\"><code>p(X | Z)\nproportional_to\nprior(X) * product_over_i phi_i(X_i)<\/code><\/pre>\n<p>若噪声为高斯，对它取负对数，就得到第 2.4 节的平方残差之和。线性化后，两者都需要求：<\/p>\n<pre class=\"code\"><code>H * delta_X = -g<\/code><\/pre>\n<p>所以“图优化”和“概率因子图”不是两个互不相关的数学问题，而是对同一后验估计的不同软件抽象和计算组织。<\/p><\/section>\n<section class=\"sec\" data-sec=\"4.2.3\"><h3 id=\"s4.2.3\"><span class=\"num\">4.2.3<\/span> 建立一个可以手算的位姿图<\/h3>\n<p>为了暂时避开二维旋转，先假设机器人只沿直线运动。四个时刻的位置分别是：<\/p>\n<pre class=\"code\"><code>x_0, x_1, x_2, x_3<\/code><\/pre>\n<p>机器人从原点出发，所以固定：<\/p>\n<pre class=\"code\"><code>x_0 = 0 m<\/code><\/pre>\n<p>轮速里程计给出三次相对位移：<\/p>\n<pre class=\"code\"><code>z_01 = 1.1 m\nz_12 = 1.0 m\nz_23 = 1.1 m<\/code><\/pre>\n<p>每次测量的标准差都是：<\/p>\n<pre class=\"code\"><code>sigma_odom = 0.1 m<\/code><\/pre>\n<p>把状态画成顶点、把相对位移测量画成边：<\/p>\n<pre class=\"code\"><code>x_0 --1.1 m--&gt; x_1 --1.0 m--&gt; x_2 --1.1 m--&gt; x_3<\/code><\/pre>\n<p>每条边表示一个带噪声约束。例如第一条边希望：<\/p>\n<pre class=\"code\"><code>x_1 - x_0 approximately_equals 1.1<\/code><\/pre>\n<p>所以三条里程计边的残差分别是：<\/p>\n<pre class=\"code\"><code>r_01 = (x_1 - x_0) - 1.1\nr_12 = (x_2 - x_1) - 1.0\nr_23 =
