://docs.openvins.com/update-null.html\" target=\"_blank\" rel=\"noopener\">OpenVINS MSCKF Nullspace Projection<\/a><\/li><li><a href=\"https://docs.openvins.com/pages.html\" target=\"_blank\" rel=\"noopener\">OpenVINS 推导目录<\/a><\/li><\/ul>\n<h4 id=\"s6.3.2.3\"><span class=\"num\">6.3.2.3<\/span> 怎样阅读 OpenVINS 源码？<\/h4>\n<p>第一轮不要按文件名从头读到尾，而是跟踪一次数据链：<\/p>\n<pre class=\"code\"><code>IMU 消息进入\n  -&gt; 状态均值和协方差传播\n  -&gt; 图像进入\n  -&gt; 特征跟踪\n  -&gt; clone 当前相机位姿\n  -&gt; 收集一条多帧特征轨迹\n  -&gt; 三角化特征\n  -&gt; 构造残差、H_x 和 H_f\n  -&gt; 零空间投影\n  -&gt; 卡方门控\n  -&gt; EKF 更新\n  -&gt; 删除过旧 clone<\/code><\/pre>\n<p>每看到一个矩阵，都记录：来源、维度、坐标系、随机变量、线性化点和最终被谁使用。第一轮能把这条调用链与公式对应起来，就比记住所有类名更有价值。<\/p><\/section>\n<section class=\"sec\" data-sec=\"6.3.3\"><h3 id=\"s6.3.3\"><span class=\"num\">6.3.3<\/span> 第 8 周：VINS-Mono、预积分和滑动窗口<\/h3>\n<p>VINS-Mono 是优化式 VIO。一个简化窗口状态可写成：<\/p>\n<pre class=\"code\"><code>X\n= [\n    window poses,\n    window velocities,\n    gyro biases,\n    accelerometer biases,\n    feature inverse depths,\n    optional extrinsics,\n    optional time offset\n  ]<\/code><\/pre>\n<p>目标函数由三类信息组成：<\/p>\n<pre class=\"code\"><code>F(X)\n= prior cost\n+ sum of IMU preintegration costs\n+ sum of visual reprojection costs<\/code><\/pre>\n<p>视觉残差要求同一三维特征在多个相机中的预测像素接近实际像素；IMU 残差要求两个关键帧状态之间的变化与这段时间的 IMU 测量一致；先验残差保存被边缘化旧状态留下的信息。<\/p>\n<h4 id=\"s6.3.3.1\"><span class=\"num\">6.3.3.1<\/span> 为什么需要 IMU 预积分？<\/h4>\n<p>相邻两帧图像之间可能有几十条 IMU 数据。若优化器每修改一次起点姿态或 bias 就重新积分全部原始 IMU，计算代价很高。预积分把这段测量相对起始帧压缩为：<\/p>\n<pre class=\"code\"><code>Delta_R\nDelta_v\nDelta_p\npreintegration covariance\nJacobians with respect to bias<\/code><\/pre>\n<p>更新两端位姿或速度时，不需要重新积分；bias 相对积分基准变化较小时，可以使用保存的 bias雅可比做一阶修正，不必每次从第一条 IMU 重新积分。预积分还把许多高频 IMU 测量变成连接两个相邻导航状态的一个因子。直观例子、修正计算和重新积分的判断方法见第 5.1 章。<\/p>\n<p>参考：<\/p>\n<ul><li><a href=\"https://gtsam.org/notes/imu-factor/\" target=\"_blank\" rel=\"noopener\">GTSAM IMU Preintegration<\/a><\/li><li><a href=\"https://arxiv.org/abs/1708.03852\" target=\"_blank\" rel=\"noopener\">VINS-Mono 论文<\/a><\/li><li><a href=\"https://github.com/HKUST-Aerial-Robotics/VINS-Mono\" target=\"_blank\" rel=\"noopener\">VINS-Mono 官方仓库<\/a><\/li><\/ul>\n<p>原始 VINS-Mono 工程面向较老的 ROS 环境。第一轮应重点阅读论文、状态、残差和处理流程，不要把大量时间花在把旧工程强行移植到 ROS 2。<\/p>\n<h4 id=\"s6.3.3.2\"><span class=\"num\">6.3.3.2<\/span> 为什么需要边缘化？<\/h4>\n<p>若每来一帧就向优化问题增加一个位姿，计算量会无限增长。滑动窗口只保留有限数量状态，需要删除旧状态。但是直接删除旧状态及其残差，会把它携带的信息一起丢掉。<\/p>\n<p>在线性化后的正规方程中，将待删除变量记为 m，保留变量记为 r：<\/p>\n<pre class=\"code\"><code>[H_mm  H_mr] [delta_m] = [b_m]\n[H_rm  H_rr] [delta_r]   [b_r]<\/code><\/pre>\n<p>由第一行解出 <code>delta_m<\/code>，代入第二行，得到只关于保留变量的方程：<\/p>\n<pre class=\"code\"><code>H_prior\n= H_rr-H_rm*inverse(H_mm)*H_mr<\/code><\/pre>\n<pre class=\"code\"><code>b_prior\n= b_r-H_rm*inverse(H_mm)*b_m<\/code><\/pre>\n<p>这就是 Schur 补。旧变量被消去，但它们对保留状态提供的信息被压缩成新的先验。<\/p>\n<p>边缘化发生在线性化点处，所以后续状态改变后，这个先验不能像原始非线性测量一样随意重新线性化。这也是 First-Estimate Jacobian、线性化一致性和先验管理重要的原因。<\/p>\n<h4 id=\"s6.3.3.3\"><span class=\"num\">6.3.3.3<\/span> 滤波式 VIO 和优化式 VIO 怎样对应？<\/h4>\n<div class=\"tbl\"><table><thead><tr><th>内容<\/th><th>OpenVINS/MSCKF<\/th><th>VINS-Mono/滑动窗口<\/th><\/tr><\/thead><tbody><tr><td>主体<\/td><td>EKF 传播和更新<\/td><td>非线性最小二乘<\/td><\/tr><tr><td>历史状态<\/td><td>相机位姿 clone<\/td><td>窗口内导航状态<\/td><\/tr><tr><td>视觉特征<\/td><td>零空间投影后消去<\/td><td>逆深度进入局部优化<\/td><\/tr><tr><td>IMU<\/td><td>状态和协方差逐步传播<\/td><td>关键帧间预积分因子<\/td><\/tr><tr><td>删除旧状态<\/td><td>协方差和 clone 管理<\/td><td>边缘化形成先验<\/td><\/tr><tr><td>主要线性代数<\/td><td>Kalman gain、创新协方差<\/td><td>Hessian、梯度、Schur 补<\/td><\/tr><\/tbody><\/table><\/div>\n<p>二者不是“一个最大后验、一个不是”。在高斯噪声和相应线性化假设下，它们都在使用先验和测量估计后验，只是保存历史信息、组织线性化以及消去变量的方式不同。<\/p><\/section>\n<section class=\"sec\" data-sec=\"6.3.4\"><h3 id=\"s6.3.4\"><span class=\"num\">6.3.4<\/span> 第 9 周：标定、时间同步和 ROS 2 数据链<\/h3>\n<p>VIO 至少依赖四类标定：<\/p>\n<pre class=\"code\"><code>相机内参\n相机畸变参数\n相机—IMU 空间外参\n相机—IMU 时间偏移<\/code><\/pre>\n<h4 id=\"s6.3.4.1\"><span class=\"num\">6.3.4.1<\/span> 为什么标定误差会被误认为运动？<\/h4>\n<p>视觉预测需要把世界点依次变换到 IMU 和相机坐标，再投影到图像。若相机—IMU 旋转外参错误，系统即使使用正确 IMU 姿态，也会把点投到错误像素。优化器并不知道参数是人为写错的，只会尝试通过修改姿态、速度、bias 或地图点来解释残差，于是出现漂移和不合理状态。<\/p>\n<p>时间偏移也有类似效果。相机在 <code>t_camera<\/code> 曝光，却使用了 <code>t_camera+delta_t<\/code> 的 IMU 姿态。设备转动越快，同样的时间误差造成的像素偏差越大。因此静止实验看似正常，不代表时间同步正确。<\/p>\n<h4 id=\"s6.3.4.2\"><span class=\"num\">6.3.4.2<\/span> 真机标定应注意什么？<\/h4>\n<ul><li>尽量使用硬件时间戳和共享时钟；<\/li><li>优先选择全局快门相机；<\/li><li>标定板应覆盖图像中央、边缘和不同距离；<\/li><li>相机—IMU 联合标定需要多个方向的旋转和平移；<\/li><li>避免只有绕单轴旋转、严重模糊或曝光过度；<\/li><li>IMU 噪声密度和随机游走应来自设备数据，而不是照抄其他型号；<\/li><li>标定结果要用独立数据验证，不能只看优化器报告成功。<\/li><\/ul>\n<p>Kalibr 可以处理多相机内外参以及相机—IMU 空间、时间标定：<\/p>\n<ul><li><a href=\"https://github.com/ethz-asl/kalibr\" target=\"_blank\" rel=\"noopener\">Kalibr 官方仓库<\/a><\/li><li><a href=\"https://docs.openvins.com/gs-calibration.html\" target=\"_blank\" rel=\"noopener\">OpenVINS Sensor Calibration<\/a><\/li><\/ul>\n<h4 id=\"s6.3.4.3\"><span class=\"num\">6.3.4.3<\/span> ROS 2 中至少检查哪些字段？<\/h4>\n<pre class=\"code\"><code>image header.stamp\nimu header.stamp\nimage frame_id\nimu frame_id\nCameraInfo 中的内参和畸变模型\n角速度单位 rad/s\n加速度单位 m/s^2\n相机和 IMU 坐标轴方向\n消息频率与时间间隔 dt\nQoS 是否兼容<\/code><\/pre>\n<p>应当记录采样时间、消息到达时间和回调执行时间，而不是只打印回调频率。第 7.5.3 至 7.5.7 节给出了 QoS、时间戳、TF2、同步和 Executor 的排查方法。<\/p>\n<p>本周的通过标准是：给出一条图像和一条 IMU 消息，能够明确它们的时间基准、坐标系、单位、外参方向以及系统实际使用哪个时间戳进行状态传播和图像更新。<\/p><\/section>\n<section class=\"sec\" data-sec=\"6.3.5\"><h3 id=\"s6.3.5\"><span class=\"num\">6.3.5<\/span> 第 10 周：评估和故障诊断实验<\/h3>\n<p>最后一周不要继续添加新算法，而要主动破坏系统，观察理论能否解释结果。<\/p>\n<h4>实验一：修改视觉测量噪声<\/h4>\n<pre class=\"code\"><code>视觉噪声设得过小\n  -&gt; 系统过度相信像素观测\n  -&gt; 错误匹配和动态物体影响变大\n\n视觉噪声设得过大\n  -&gt; 视觉更新变弱\n  -&gt; 系统更依赖 IMU，长期漂移可能增大<\/code><\/pre>\n<p>同时观察重投影残差、创新协方差、门控通过率和轨迹误差，不要只观察最终轨迹。<\/p>\n<h4>实验二：修改 IMU bias 初值<\/h4>\n<p>分别修改陀螺和加速度计 bias 初值，记录初始化时间、收敛过程和最终误差。陀螺 bias 错误首先影响姿态；姿态错误又会导致重力补偿错误，最终同时影响速度和位置。<\/p>\n<h4>实验三：人为加入时间偏移<\/h4>\n<p>依次给图像时间戳加入：<\/p>\n<pre class=\"code\"><code>5 ms\n10 ms\n20 ms<\/code><\/pre>\n<p>比较缓慢运动和快速转动序列。若快速转动时误差明显放大，就能直观看到时间同步为什么是状态估计中的几何问题，而不只是 ROS 消息能否配对的问题。<\/p>\n<h4>实验四：人为修改相机—IMU 外参<\/h4>\n<p>给旋转外参加入约 1 度误差，比较：<\/p>\n<pre class=\"code\"><code>重投影残差\n初始化成功率\nbias 估计\n轨迹漂移<\/code><\/pre>\n<p>再给平移外参加入小误差，观察纯旋转和同时存在平移时的差别。<\/p>\n<h4>实验五：破坏视觉前端<\/h4>\n<p>减少特征数、关闭前后向光流检查、提高图像模糊程度或加入动态物体，记录：<\/p>\n<pre class=\"code\"><code>有效特征数量\n平均特征轨迹长度\n三角化成功率\nRANSAC 内点比例\n卡方门控通过率<\/code><\/pre>\n<p>这些中间指标能够帮助区分“前端没有产生可靠观测”和“后端没有正确利用观测”。<\/p>\n<p>最终总结应当独立回答：<\/p>\n<pre class=\"code\"><code>系统状态量是什么？\nIMU 如何传播均值和协方差？\n视觉观测模型是什么？\n重投影残差和雅可比怎样构造？\n尺度、重力、速度和 bias 怎样初始化？\n哪些方向不可观？\n滤波式与优化式 VIO 怎样保存历史信息？\n系统最常见的五种失败原因是什么？<\/code><\/pre><\/section>\n<section class=\"sec\" data-sec=\"6.3.6\"><h3 id=\"s6.3.6\"><span class=\"num\">6.3.6<\/span> 从今天开始的七天计划<\/h3>\n<h4>第一天：建立基线<\/h4>\n<ul><li>下载 EuRoC <code>MH_01_easy<\/code>；<\/li><li>跑通 OpenVINS；<\/li><li>保存轨迹、配置和完整日志。<\/li><\/ul>\n<h4>第二天：量化基线<\/h4>\n<ul><li>使用 evo 计算 APE 和 RPE；<\/li><li>记录初始化时间、特征数量和处理频率；<\/li><li>保存一份未经修改的基准结果。<\/li><\/ul>\n<h4>第三天：手算相机投影<\/h4>\n<ul><li>画出世界、IMU、相机和图像坐标系；<\/li><li>手算至少三个三维点的像素位置；<\/li><li>检查点在相机后方或深度接近零时应怎样处理。<\/li><\/ul>\n<h4>第四天：实现投影函数<\/h4>\n<ul><li>编写 <code>projectPoint()<\/code>；<\/li><li>分别改变 X、Y、Z；<\/li><li>打印归一化坐标和最终像素。<\/li><\/ul>\n<h4>第五天：验证投影雅可比<\/h4>\n<ul><li>根据偏导写出 <code>J_projection<\/code>；<\/li><li>使用中心差分计算数值雅可比；<\/li><li>比较每个矩阵元素的误差。<\/li><\/ul>\n<h4>第六天：阅读标定文件<\/h4>\n<ul><li>找出 EuRoC 的相机内参和畸变模型；<\/li><li>找出相机—IMU 外参；<\/li><li>用一个点验证外参方向，而不是只读变量名。<\/li><\/ul>\n<h4>第七天：闭卷画完整观测链<\/h4>\n<p>不看资料，独立画出：<\/p>\n<pre class=\"code\"><code>p_W\n  -&gt; T_C_W\n  -&gt; p_C\n  -&gt; normalized point\n  -&gt; predicted pixel h(x)\n  -&gt; measured pixel z\n  -&gt; residual r=z-h(x)\n  -&gt; residual Jacobian\n  -&gt; Kalman update or nonlinear optimization<\/code><\/pre>\n<p>如果每个箭头的输入、输出、坐标系和维度都能说明，就进入第 2 周。若还有一步只能背公式，继续停留在相机模型，不要急着阅读大型 VIO 源码。<\/p><\/section>\n<section class=\"sec\" data-sec=\"6.3.7\"><h3 id=\"s6.3.7\"><span class=\"num\">6.3.7<\/span> 学习时最容易走偏的地方<\/h3>\n<ol><li value=\"1\"><strong>只看论文，不做数值实验。<\/strong> 坐标方向或符号错了，文字理解很难及时暴露。<\/li><li value=\"2\"><strong>一开始同时读很多系统。<\/strong> 第一轮以 OpenVINS 为主，VINS-Mono 用来建立结构对比。<\/li><li value=\"3\"><strong>把运行成功当成理解。<\/strong> 必须能说明一条像素观测最后修改了哪些状态。<\/li><li value=\"4\"><strong>只看最终轨迹。<\/strong> 还要看特征数、视差、重投影残差、门控、bias 和处理延迟。<\/li><li value=\"5\"><strong>过早使用自己的硬件。<\/strong> 先在有真值和标定的 EuRoC 上建立基线，再进入真机。<\/li><li value=\"6\"><strong>忽略标定和时间。<\/strong> 很多看似优化算法的问题，本质是外参方向、时间戳或单位错误。<\/li><li value=\"7\"><strong>直接追逐最新融合框架。<\/strong> FAST-LIVO2、语义地图和学习式方法都建立在坐标变换、相机观测、IMU 模型和状态估计基础上；先掌握可验证的核心链路，再扩展更可靠。<\/li><\/ol>\n<p>如果只记住本章的一句话，可以记住：<\/p>\n<blockquote>VIO 的核心不是把相机和 IMU 数据放进同一个程序，而是用同一组状态同时解释惯性运动和多帧像素观测，并让每个残差、雅可比、噪声和坐标系都能够被数值验证。<\/blockquote><\/section>\n<section class=\"sec\" data-sec=\"6.3.8\"><h3 id=\"s6.3.8\"><span class=\"num\">6.3.8<\/span> 本章面试题与参考答案<\/h3>\n<p>先自己作答，再对照答案；答案后括号注明对应小节。<\/p>\n<h4>题目<\/h4>\n<ol><li value=\"1\">相机坐标系中的点 <code>p_C = [2, -1, 4]^T<\/code>，内参 <code>fx = fy = 400<\/code>、<code>cx = 320<\/code>、<code>cy = 240<\/code>，求预测像素；再说明为什么单张单目图像不能确定这个点的深度。<\/li><li value=\"2\">推导针孔投影对相机坐标点的雅可比 <code>J_projection<\/code>，并在 <code>p_C = [1, 0.5, 5]^T<\/code>、<code>fx = fy = 400<\/code> 处代入数值。深度 Z 在其中起什么作用？工程上怎样确认解析雅可比没写错？<\/li><li value=\"3\">状态保存 <code>T_W_I<\/code>，外参保存为 <code>T_I_C<\/code>，写出世界点 <code>p_W<\/code> 变换到相机坐标的公式。拿到一份标定文件里名为 <code>Tic<\/code> 的矩阵时，怎样判断它的方向？<\/li><li value=\"4\">校正后的双目 <code>f = 500 pixel<\/code>、<code>B = 0.12 m<\/code>，视差 <code>d = 15 pixel<\/code>，求深度，以及视差 1 像素误差大约带来多大的深度误差。为什么说“双目有米制尺度”不等于远处也测得准？<\/li><li value=\"5\">写出本质矩阵约束，并说明为什么两帧单目图像只能恢复平移方向。本质矩阵和基础矩阵有什么区别？<\/li><li value=\"6\">三角化为什么需要足够视差？纯旋转或平移很小时会发生什么？追问：一个特征已经被很多帧看到，是否说明它的深度可靠？<\/li><li value=\"7\">什么是重投影残差？在左扰动 <code>T_C_W_new = Exp(delta_xi)*T_C_W<\/code>、残差 <code>r = z-h<\/code> 的约定下，写出它对位姿的雅可比链及各矩阵维度。追问：换成保存 <code>T_W_C<\/code> 或残差定义为 <code>h-z<\/code>，会怎样？<\/li><li value=\"8\">Bundle Adjustment 的 Hessian 为什么是稀疏块结构？Schur 补在 BA 里消去的是什么？它与 MSCKF 的零空间投影有什么共同点和不同点？<\/li><li value=\"9\">写出陀螺仪和加速度计的简化测量模型。静止水平放置的加速度计读数为什么不是零？陀螺 bias 的一点误差为什么最终会变成位置误差？请用“roll 错 1 度、持续 10 s”估算水平位置误差的量级。<\/li><li value=\"10\">单目 VIO 为什么有可能恢复米制尺度？“接上 IMU 尺度就一定可观”这句话错在哪里？普通 VIO 中哪些自由度不可观，错误处理它们会有什么后果？<\/li><li value=\"11\">单目 VIO 初始化到底在求哪些量？初始化反复失败时，你会按什么顺序排查？<\/li><li value=\"12\">MSCKF 为什么要克隆历史相机位姿？为什么不把三维特征放进 EKF 状态？零空间投影是怎样把特征误差项消掉的？追问：一个特征被 5 个 clone 看到，投影后还剩几维残差？<\/li><li value=\"13\">VINS-Mono 为什么需要 IMU 预积分和边缘化？写出边缘化的 Schur 补公式，并用标量例子 <code>H = [[4, 2], [2, 3]]<\/code>、<code>b = [2, 1]^T<\/code>（第一个变量为待删除变量 m）算出先验。追问：边缘化以后为什么要强调线性化一致性和 FEJ？<\/li><li value=\"14\">滤波式 VIO（OpenVINS/MSCKF）和优化式 VIO（VINS-Mono）在结构上怎样一一对应？“滤波不是最大后验、优化才是”这种说法对吗？<\/li><li value=\"15\">相机—IMU 时间偏移 10 ms、设备以 90 度/秒转动时，图像上大约会产生多大的像素偏差（<code>fx = 400<\/code>）？为什么静止实验正常不代表时间同步正确？ROS 2 数据链中至少要检查哪些字段？<\/li><\/ol>\n<h4>参考答案<\/h4>\n<p><strong>1. 手算投影并说明单目深度不确定<\/strong><\/p>\n<p>先除以深度得到归一化坐标，再乘内参：<\/p>\n<pre class=\"code\"><code>x_normalized = 2/4  = 0.5\ny_normalized = -1/4 = -0.25\n\nu = 400*0.5+320    = 520\nv = 400*(-0.25)+240 = 140<\/code><\/pre>\n<p>预测像素为 <code>[520, 140]^T<\/code>。把 <code>X、Y、Z<\/code> 同乘任意正数，例如 <code>[4, -2, 8]<\/code>，<code>X/Z<\/code>、<code>Y/Z<\/code> 不变，像素也不变。所以一个像素只确定一条观测射线，单张图像无法判断点在射线的近处还是远处。实际实现还要处理点在相机后方或 Z 接近零的情况。（见 1.3.3、1.3.5、6.3.6）<\/p>\n<p><strong>2. 投影雅可比推导与数值<\/strong><\/p>\n<p>对 <code>u = fx*X/Z+cx<\/code>、<code>v = fy*Y/Z+cy<\/code> 逐项求偏导：<\/p>\n<pre class=\"code\"><code>J_projection\n= [fx/Z    0    -fx*X/Z^2]\n  [0     fy/Z   -fy*Y/Z^2]\n\n代入 p_C = [1, 0.5, 5]^T：\n= [80   0  -16]\n  [ 0  80   -8]<\/code><\/pre>\n<p>维度是 <code>2 by 3<\/code>。Z 在分母中：近处点对运动更敏感，远处点同样平移产生的像素变化更小。验证方法是写 <code>projectPoint()<\/code>，对 X、Y、Z 分别加小扰动，用中心差分逐元素比较解析与数值雅可比；不一致就不能往后走。（见 6.2.1、6.3.6）<\/p>\n<p><strong>3. 外参链和方向判断<\/strong><\/p>\n<pre class=\"code\"><code>T_C_W = inverse(T_I_C)*inverse(T_W_I)\np_C   = T_C_W*p_W<\/code><\/pre>\n<p><code>T_A_B<\/code> 表示把 B 系的点变换到 A 系，所以先用 <code>inverse(T_W_I)<\/code> 把世界点变到 IMU 系，再用 <code>inverse(T_I_C)<\/code> 变到相机系。判断 <code>Tic<\/code> 的方向不能靠变量名猜，要在文档或代码里找一条点变换公式，确认它的输入坐标系和输出坐标系；也可以拿一个已知点实际代入验证。（见 1.3.4、6.3.6 第六天）<\/p>\n<p><strong>4. 双目深度与远距离误差<\/strong><\/p>\n<pre class=\"code\"><code>Z     = f*B/d = 500*0.12/15 = 4 m\ndZ/dd = -f*B/d^2 = -60/225 approximately_equals -0.267 m/pixel<\/code><\/pre>\n<p>也就是 1 像素视差误差约带来 0.27 m 深度误差（d=14.5 与 15.5 时深度约为 4.14 m 与 3.87 m）。由于 <code>dZ/dd<\/code> 与 <code>d^2<\/code> 成反比，远处视差只有几个像素，同样的匹配误差会放大成米级误差。书中例子：<code>f = 400<\/code>、<code>B = 0.1<\/code> 时，d=20 处 1 像素约差 0.1 m，d=4 处已经差到数米。增大焦距或基线有帮助，但会带来体积、视场重叠和近距离匹配的新约束。（见 1.3.5）<\/p>\n<p><strong>5. 本质矩阵与尺度不确定<\/strong><\/p>\n<pre class=\"code\"><code>normalized_p2^T*E*normalized_p1 = 0\nE = skew(t)*R\nF = inverse(K)^T*E*inverse(K)<\/code><\/pre>\n<p>把 t 换成 <code>2*t<\/code>，得到 <code>2*E<\/code>，约束方程整体乘 2 仍为 0，所以只能恢复 R 和 t 的方向，无法区分移动 1 m 还是 2 m。E 用归一化图像坐标，F 用像素坐标，已经把内参 K 包含进去。（见 6.2.3.1、6.2.3.2）<\/p>\n<p><strong>6. 三角化与视差<\/strong><\/p>\n<p>测量有噪声，两条观测射线一般不会严格相交，三角化本身就是带误差的估计。基线太短或只有旋转时，两条射线近乎平行，很小的像素误差就会造成很大的深度变化，问题条件很差；纯旋转时根本没有时间基线。追问的答案是否定的：<\/p>\n<pre class=\"code\"><code>特征被多帧看到\n!=\n特征已经具备可靠深度<\/code><\/pre>\n<p>关键是多帧之间是否有足够平移产生视差。建议用 <code>findEssentialMat<\/code>、<code>recoverPose<\/code>、<code>triangulatePoints<\/code> 比较正常平移、只有旋转、很小平移三组数据。（见 6.2.3.3）<\/p>\n<p><strong>7. 重投影残差及其雅可比<\/strong><\/p>\n<p>残差是实际检测像素减去由候选位姿和世界点预测的像素：<\/p>\n<pre class=\"code\"><code>r(T_C_W, p_W) = z-project(T_C_W*p_W)\nF_ij = 0.5*r_ij^T*inverse(Sigma_pixel)*r_ij\n\nJ_point     = [I, -skew(p_C)]            3 by 6\nJ_residual  = -J_projection*J_point      2 by 6<\/code><\/pre>\n<p>物理链条：位姿增量改变相机系点坐标，点坐标改变预测像素，预测像素改变残差；负号来自 <code>r = z-h<\/code>。若保存 <code>T_W_C<\/code>、改用右扰动或把残差写成 <code>h-z<\/code>，雅可比形式和符号都会变，不能只抄最后一行公式，必须先确认约定。（见 6.2.4.2、6.2.4.3）<\/p>\n<p><strong>8. BA 稀疏性和 Schur 补<\/strong><\/p>\n<p>每条重投影残差只连接一个相机位姿和一个三维点，所以 Hessian 分成 <code>H_pose_pose<\/code>、<code>H_pose_point<\/code>、<code>H_point_point<\/code> 等块，其中点—点块是块对角的。地图点通常远多于位姿，Schur 补先在线性方程层面消去地图点增量，只解规模小得多的位姿方程，再回代求点。共同点是：两者都避免把大量三维特征作为最终需要求解的变量；不同点是 BA 在正规方程上做 Schur 补，MSCKF 在测量方程上左乘 <code>H_f<\/code> 的左零空间。（见 6.2.4.4、6.3.2.2）<\/p>\n<p><strong>9. IMU 测量模型与漂移链条<\/strong><\/p>\n<pre class=\"code\"><code>omega_m = omega_true+b_g+n_g\na_m     = R_I_W*(a_W-g_W)+b_a+n_a<\/code><\/pre>\n<p>加速度计测的是比力。静止水平时 <code>a_W = 0<\/code>，<code>g_W = [0, 0, -9.81]^T<\/code>，读数约为 <code>[0, 0, +9.81]^T<\/code>，不是零。陀螺 bias 积分成角度误差，角度错了就会把重力错误地旋转到水平方向，产生虚假水平加速度，再积分成速度和位置漂移。估算：<\/p>\n<pre class=\"code\"><code>roll 错 1 度 -&gt; 水平加速度误差 = 9.81*sin(1 deg) approximately_equals 0.171 m/s^2\n10 s 后速度误差 approximately_equals 1.71 m/s\n10 s 后位置误差 approximately_equals 0.5*0.171*10^2 approximately_equals 8.6 m<\/code><\/pre>\n<p>这就是只用 IMU 积分很快发散、VIO 状态必须同时包含速度和两个 bias 的原因。（见 1.3.6 至 5.1.1、6.3.5 实验二）<\/p>\n<p><strong>10. 尺度可观性与不可观自由度<\/strong><\/p>\n<p>单目视觉只能给出任意尺度的结构和平移方向；IMU 的角速度和比力带物理单位，在运动激励充分、模型和标定正确时，可以联合估计尺度、重力方向、各帧速度和两个 bias。但长时间静止、纯旋转、运动过于单一、加速度变化很小，或外参与时偏错误，都会让尺度不可观或初始化不稳定。没有绝对定位传感器时，全局绝对位置和绕重力方向的 yaw 不可观；重力只给 roll、pitch 提供参考。若算法把这些方向误当成有信息，协方差会虚假缩小，滤波器过度自信。（见 6.3.1.1、6.3.1.2）<\/p>\n<p><strong>11. 初始化求什么、怎样排查<\/strong><\/p>\n<p>单目 VIO 初始化联合估计初始姿态、陀螺 bias、米制尺度、重力方向、窗口内速度，部分情况下还有加速度计 bias，不只是给一个初始位姿。失败时逐层检查：<\/p>\n<pre class=\"code\"><code>1. 特征跟踪和视差是否足够\n2. 是否同时有平移和多方向转动\n3. 相机与 IMU 时间戳、单位、频率是否正确\n4. 相机—IMU 外参方向是否正确\n5. IMU 噪声密度与随机游走是否合理\n6. 状态和重力的坐标系约定是否一致<\/code><\/pre>\n<p>（见 6.3.1.3）<\/p>\n<p><strong>12. MSCKF 的 clone 与零空间投影<\/strong><\/p>\n<p>一个特征会被多帧看到，若状态只有当前 IMU 位姿，就无法保留“同一特征跨多帧”的约束，所以状态里保存有限个历史相机位姿 clone。若把每个三维点都放入状态，状态维数和协方差会不断增长。MSCKF 先把测量线性化，再找 <code>H_f<\/code> 的左零空间 A：<\/p>\n<pre class=\"code\"><code>r approximately_equals H_x*delta_x+H_f*delta_feature+noise\nA^T*H_f = 0\nA^T*r approximately_equals A^T*H_x*delta_x+A^T*noise<\/code><\/pre>\n<p>特征误差项被消掉，但特征对 clone 和惯性状态的约束保留下来，不是丢信息。追问：5 个 clone 各给 2 维，共 10 行；三维特征的 <code>H_f<\/code> 为 <code>10 by 3<\/code>，列满秩时左零空间维数为 <code>10-3 = 7<\/code>，投影后剩 7 维残差，然后做卡方门控和 EKF 更新。（见 6.3.2.1、6.3.2.2、6.3.2.3）<\/p>\n<p><strong>13. 预积分、边缘化和 Schur 补<\/strong><\/p>\n<p>两帧图像间有几十条 IMU，若优化器每改一次起点状态或 bias 就重新积分，代价很高。预积分把这段测量压缩成 <code>Delta_R<\/code>、<code>Delta_v<\/code>、<code>Delta_p<\/code>、协方差和对 bias 的雅可比；bias 变化小时用雅可比做一阶修正，不必重新积分，并把高频 IMU 变成连接相邻两个关键帧的一个因子。<\/p>\n<p>滑动窗口必须删旧状态，但直接删会丢信息，所以做边缘化：<\/p>\n<pre class=\"code\"><code>H_prior = H_rr-H_rm*inverse(H_mm)*H_mr\nb_prior = b_r-H_rm*inverse(H_mm)*b_m\n\n例：H_prior = 3-2*2/4 = 2\n    b_prior = 1-2*2/4 = 0<\/code><\/pre>\n<p><code>H_prior*delta_r = b_prior<\/code> 解得 <code>delta_r = 0<\/code>，与直接解完整 <code>2 by 2<\/code> 方程得到的 <code>delta_r<\/code> 一致，说明被删变量的信息被压进了先验。追问：先验是在当时的线性化点上得到的，之后状态变化了，它不能像原始非线性测量那样随便重新线性化；若同一变量在不同因子里用不同线性化点，会引入虚假信息、破坏不可观方向，所以需要 First-Estimate Jacobian 和先验管理。（见 6.3.3.1、6.3.3.2）<\/p>\n<p><strong>14. 滤波式与优化式 VIO 的对应<\/strong><\/p>\n<div class=\"tbl\"><table><thead><tr><th>内容<\/th><th>OpenVINS/MSCKF<\/th><th>VINS-Mono/滑动窗口<\/th><\/tr><\/thead><tbody><tr><td>主体<\/td><td>EKF 传播和更新<\/td><td>非线性最小二乘<\/td><\/tr><tr><td>历史状态<\/td><td>相机位姿 clone<\/td><td>窗口内导航状态<\/td><\/tr><tr><td>视觉特征<\/td><td>零空间投影后消去<\/td><td>逆深度进入局部优化<\/td><\/tr><tr><td>IMU<\/td><td>逐步传播均值和协方差<\/td><td>关键帧间预积分因子<\/td><\/tr><tr><td>删除旧状态<\/td><td>协方差和 clone 管理<\/td><td>边缘化形成先验<\/td><\/tr><tr><td>线性代数<\/td><td>Kalman gain、创新协方差<\/td><td>Hessian、梯度、Schur 补<\/td><\/tr><\/tbody><\/table><\/div>\n<p>这种说法不对。在高斯噪声和相应线性化假设下，两者都在用先验和测量估计后验，区别只在于怎样保存历史信息、组织线性化和消去变量。（见 6.3.3.3）<\/p>\n<p><strong>15. 时间偏移的像素量级与数据链检查<\/strong><\/p>\n<pre class=\"code\"><code>角度误差 = 90 deg/s*0.01 s = 0.9 deg approximately_equals 0.0157 rad\n像素偏差 approximately_equals fx*角度误差 = 400*0.0157 approximately_equals 6.3 pixel<\/code><\/pre>\n<p>（小角度、点靠近图像中心的近似。）相机在 <code>t_camera<\/code> 曝光，系统却用了 <code>t_camera+delta_t<\/code> 的 IMU 姿态，转得越快，同样的时间误差带来的像素偏差越大；静止时几乎看不出，所以静止实验正常不能证明同步正确。优化器不知道这是时偏，只会去改姿态、速度、bias 或地图点来解释残差，于是表现为漂移。建议用 5、10、20 ms 人为时偏在缓慢和快速转动序列上对比。ROS 2 中至少检查：图像和 IMU 的 <code>header.stamp<\/code> 与 <code>frame_id<\/code>、CameraInfo 中的内参和畸变模型、角速度 rad/s 和加速度 m/s^2 单位、坐标轴方向、频率与 dt、QoS 兼容性；同时记录采样时间、到达时间和回调执行时间。（见 6.3.4.1、6.3.4.3、6.3.5 实验三）<\/p>\n<hr><\/section>", "sections": [{"id": "6.3.1", "title": "第 6 周：VIO 怎样融合视觉和 IMU？"}, {"id": "6.3.2", "title": "第 7 周：OpenVINS 和 MSCKF"}, {"id": "6.3.3", "title": "第 8 周：VINS-Mono、预积分和滑动窗口"}, {"id": "6.3.4", "title": "第 9 周：标定、时间同步和 ROS 2 数据链"}, {"id": "6.3.5", "title": "第 10 周：评估和故障诊断实验"}, {"id": "6.3.6", "title": "从今天开始的七天计划"}, {"id": "6.3.7", "title": "学习时最容易走偏的地方"}, {"id": "6.3.8", "title": "本章面试题与参考答案"}]}, {"num": "6.4", "title": "端到端 SLAM：VGGT、LingBot-Map 与尺度问题", "html": "<section class=\"sec\" data-sec=\"6.4.0\"><div class=\"callout tip\"><strong>为什么现在学这一章<\/strong>：最后看前沿：Transformer 一次前向输出位姿和深度。理解了单目尺度歧义（第 1 级）和 VIO 的尺度来源（上一章）之后，就能说清它们能做什么、为什么还不能直接用于导航。<\/div>\n<p>第 1.3.5 节说明了单目一张图为什么不能确定深度，第 6.3.1.1 节说明了单目 VIO 为什么可能恢复米制尺度。本章用这两个结论分析端到端几何模型：它们能做什么，复现时要注意什么，以及为什么不能直接拿去导航。<\/p><\/section>\n<section class=\"sec\" data-sec=\"6.4.1\"><h3 id=\"s6.4.1\"><span class=\"num\">6.4.1<\/span> 一句话回答<\/h3>\n<p>VGGT 和 LingBot-Map 用 Transformer 一次前向直接输出相机位姿和深度或点图，绕开了特征匹配、三角化和 BA。但单目图像只能把几何恢复到相似变换 <code>Sim(3)<\/code>：网络训练时把尺度归一化掉了，输出的是“归一化尺度”的几何。导航需要的是带米制尺度、重力方向、可靠不确定度、全局一致且实时因果的 <code>SE(3)<\/code> 位姿，所以端到端 VO 必须和 IMU、轮速、雷达等度量传感器以及后端优化结合，才能用于导航。<\/p><\/section>\n<section class=\"sec\" data-sec=\"6.4.2\"><h3 id=\"s6.4.2\"><span class=\"num\">6.4.2<\/span> VGGT 是什么？<\/h3>\n<p>VGGT（Visual Geometry Grounded Transformer，Meta 与牛津 VGG，CVPR 2025 最佳论文）：输入 1 张到数百张无序图像，一次前向输出每张图的相机内外参、深度图、点图（每个像素在第一帧坐标系下的三维坐标）和用于跟踪的稠密特征。<\/p>\n<pre class=\"code\"><code>每张图 -&gt; DINOv2 -&gt; patch tokens\n每帧额外加 camera token 和若干 register token\n  第一帧使用不同的可学习 token，标记它为参考帧（定义世界坐标系）\n\n交替注意力，重复 24 组：\n  帧内注意力   -&gt; 整理单帧结构\n  全局注意力   -&gt; 跨所有帧所有 token，隐式完成匹配和三角化\n\n预测头：\n  camera head -&gt; 内外参\n  DPT 头      -&gt; 深度图 + 不确定度、点图 + 不确定度、跟踪特征<\/code><\/pre>\n<p>训练时以第一帧为世界系，并把真值场景按点到原点的平均距离归一化。网络学到的输出因此处在归一化尺度下。<\/p><\/section>\n<section class=\"sec\" data-sec=\"6.4.3\"><h3 id=\"s6.4.3\"><span class=\"num\">6.4.3<\/span> 复现 VGGT 时要注意什么？<\/h3>\n<ul><li>官方开源了推理代码和权重，demo 输入一组图像即可得到相机和点云；<\/li><li>显存随帧数快速增长：全局注意力对“帧数 × 每帧 token 数”做全注意力，计算量约为<code>O((N*M)^2)<\/code>，单卡一次能处理的帧数受显存和分辨率限制；<\/li><li>长序列需要分块再拼接。VGGT-Long、VGGT-SLAM 等工作解决“块与块之间怎样对齐”。VGGT-SLAM 指出，在相机未标定时块间不只是 <code>Sim(3)<\/code> 歧义，而是射影歧义，因此在<code>SL(4)<\/code> 上优化子图对齐；<\/li><li>评测时要看清楚：论文中的 ATE 通常是先做带尺度的 <code>Sim(3)<\/code> Umeyama 对齐再计算的。<\/li><\/ul><\/section>\n<section class=\"sec\" data-sec=\"6.4.4\"><h3 id=\"s6.4.4\"><span class=\"num\">6.4.4<\/span> LingBot-Map 是什么？<\/h3>\n<p>LingBot-Map（蚂蚁集团 Robbyant，arXiv:2604.14141，2026 年 4 月）是流式模型：逐帧输入、因果推理、实时输出位姿和几何，面向机器人。VGGT 则是离线批处理，所有帧一起看。<\/p>\n<p>它的核心是几何上下文注意力（Geometric Context Attention，GCA），借鉴 SLAM 的结构，把历史分成三类：<\/p>\n<div class=\"tbl\"><table><thead><tr><th>上下文<\/th><th>内容<\/th><th>对应 SLAM 中的什么<\/th><\/tr><\/thead><tbody><tr><td>锚定上下文<\/td><td>序列开头 n 帧（推理默认 8 帧）之间全注意力，后续所有帧都关注它们<\/td><td>初始化：定义世界系和尺度基准<\/td><\/tr><tr><td>位姿参考窗口<\/td><td>最近 k 帧（默认 64 帧）保留全部图像 token<\/td><td>局部 BA 的滑动窗口<\/td><\/tr><tr><td>轨迹记忆<\/td><td>窗口外的帧丢弃图像 token，每帧只留 6 个 token，并加时间编码<\/td><td>把老帧边缘化成紧凑摘要，用于长程漂移校正<\/td><\/tr><\/tbody><\/table><\/div>\n<p>窗口外每帧只占 6 个 token，而不是约 500 + 6 个。论文举例：1 万帧时缓存的 token 数从约 <code>5 × 10^6<\/code> 降到约 <code>7 × 10^4<\/code>。<\/p>\n<p>其他要点：<\/p>\n<ul><li>DINOv2-L 骨干，帧内注意力与 GCA 交替，共 24 块；<\/li><li>先用全局注意力在短多视图数据上训练基础模型，再换成 GCA 做流式训练，视角数从24 逐步增加到 320；<\/li><li>camera head 输出绝对位姿，depth head 输出深度和不确定度；<\/li><li>训练真值按锚定帧点的平均距离归一化尺度；<\/li><li>论文报告 518 × 378 输入时，H800 上约 20 FPS，RTX 4090 上约 12 FPS。<\/li><\/ul>\n<p>论文自述的局限：没有显式回环；没有测试时优化；直接模式约 3000 帧后需要切换到VO 模式（分窗口推理并用 <code>Sim(3)<\/code> 对齐窗口），窗口边界处会累积漂移。<\/p><\/section>\n<section class=\"sec\" data-sec=\"6.4.5\"><h3 id=\"s6.4.5\"><span class=\"num\">6.4.5<\/span> VGGT 与 LingBot-Map 怎样对比？<\/h3>\n<div class=\"tbl\"><table><thead><tr><th>对比项<\/th><th>VGGT<\/th><th>LingBot-Map<\/th><\/tr><\/thead><tbody><tr><td>推理方式<\/td><td>离线批处理，全局注意力<\/td><td>流式因果推理<\/td><\/tr><tr><td>长序列<\/td><td>显存爆炸，需要分块和对齐<\/td><td>GCA 压缩历史，可处理万帧级序列<\/td><\/tr><tr><td>类比 SLAM<\/td><td>一次性“全局 BA”<\/td><td>锚帧初始化 + 滑窗 + 关键帧记忆<\/td><\/tr><tr><td>尺度<\/td><td>第一帧系下的归一化尺度<\/td><td>锚帧定义的归一化尺度<\/td><\/tr><\/tbody><\/table><\/div><\/section>\n<section class=\"sec\" data-sec=\"6.4.6\"><h3 id=\"s6.4.6\"><span class=\"num\">6.4.6<\/span> 为什么端到端 VO 不能直接用于导航？<\/h3>\n<p>根本原因是单目尺度不可观（见 1.3.5 节）：把场景整体放大 <code>s<\/code> 倍、相机平移也放大<code>s<\/code> 倍，所有图像完全不变：<\/p>\n<pre class=\"code\"><code>X_c -&gt; s * X_c,  t -&gt; s * t\n像素 u = K * X_c / Z_c   不变<\/code><\/pre>\n<p>端到端网络没有突破这个物理限制，只是训练时把尺度归一化掉了；网络从数据先验“猜”出的尺度既不保证正确，也不保证跨片段一致。导航需要的是米制 <code>SE(3)<\/code> 位姿，具体问题有七个：<\/p>\n<ol><li value=\"1\"><strong>没有绝对尺度<\/strong>：规划器要知道“前方障碍物 1.2 m”，控制器要知道“速度 0.8 m/s”，而 <code>Sim(3)<\/code> 输出只能说“距离是某个未知单位的 1.2”。<\/li><li value=\"2\"><strong>尺度漂移<\/strong>：分块或分窗口推理时，每块尺度独立归一化，块间用 <code>Sim(3)<\/code> 对齐会累积尺度漂移，轨迹越走越缩或越胀。评测时带尺度的 Umeyama 对齐会掩盖这个问题：ATE 好看不等于能导航。<\/li><li value=\"3\"><strong>坐标系任意<\/strong>：世界系由第一帧或锚帧定义，没有重力方向，也没有绝对航向，无法和地图、GNSS、导航目标点对齐。<\/li><li value=\"4\"><strong>没有可靠的不确定度<\/strong>：滤波和优化能给出协方差，下游据此融合和做安全决策；网络的置信度未经标定，失效时可能“自信地错”，遇到弱纹理、反光、夜间、动态场景等分布外数据时，退化行为不可预期。<\/li><li value=\"5\"><strong>没有全局一致性机制<\/strong>：没有回环和地图复用，长时间运行漂移无界。<\/li><li value=\"6\"><strong>算力<\/strong>：需要大显存 GPU，H800 或 4090 级别才有 12 至 20 FPS；传统 VIO、LIO在 ARM 板上就能以 IMU 频率输出。<\/li><li value=\"7\"><strong>因果性<\/strong>：VGGT 是批处理，需要看完未来帧才能给出当前帧的最优解，不满足在线控制的因果要求。<\/li><\/ol><\/section>\n<section class=\"sec\" data-sec=\"6.4.7\"><h3 id=\"s6.4.7\"><span class=\"num\">6.4.7<\/span> 怎样把它变成可用于导航的系统？<\/h3>\n<ul><li><strong>融合 IMU<\/strong>：加速度计提供米制尺度和重力方向（见 6.3.1.1 节），把网络输出当作视觉相对位姿或深度观测，放进 VIO 因子图；<\/li><li><strong>融合轮速、雷达或双目基线<\/strong>：直接提供度量约束；<\/li><li><strong>度量深度模型<\/strong>给尺度先验，但仍需其他传感器校验；<\/li><li><strong>网络当前端，传统优化当后端<\/strong>：网络负责鲁棒的匹配、初值和稠密几何，后端用BA、PGO 保证一致性和度量性，这也是 MASt3R-SLAM、VGGT-SLAM 等工作的方向。<\/li><\/ul>\n<p>一句话总结：端到端模型解决“看图懂几何”，导航需要“带度量、带不确定度、全局一致、实时因果的状态估计”，两者之间缺的正是传感器融合与后端优化。第 9.5.5 节对 AI 与几何 SLAM 关系的讨论也适用于这里。<\/p><\/section>\n<section class=\"sec\" data-sec=\"6.4.8\"><h3 id=\"s6.4.8\"><span class=\"num\">6.4.8<\/span> 本章面试题与参考答案<\/h3>\n<p>先自己作答，再对照答案；答案后括号注明对应小节。<\/p>\n<h4>题目<\/h4>\n<ol><li value=\"1\">VGGT 的输入、输出和网络结构是什么？交替注意力中两种注意力各起什么作用？<\/li><li value=\"2\">复现 VGGT 时，长序列会遇到什么问题？有哪些解决思路？<\/li><li value=\"3\">LingBot-Map 的 GCA 把历史分成哪三类？分别对应 SLAM 中的什么机制？<\/li><li value=\"4\">为什么端到端单目 VO 的输出只能到相似变换？写出尺度歧义的式子。<\/li><li value=\"5\">列举端到端 VO 不能直接用于导航的至少四个原因。<\/li><li value=\"6\">为什么说“ATE 好看不等于能导航”？<\/li><li value=\"7\">怎样让端到端模型的输出可以用于导航？<\/li><\/ol>\n<h4>参考答案<\/h4>\n<p><strong>1. VGGT<\/strong><\/p>\n<p>输入一到数百张图，一次前向输出内外参、深度、点图和跟踪特征。DINOv2 提 patch token，加 camera 和 register token，24 组帧内与全局注意力交替：帧内注意力整理单帧结构，全局注意力跨帧建立对应，相当于隐式匹配和三角化。（见 6.4.2）<\/p>\n<p><strong>2. 长序列<\/strong><\/p>\n<p>全局注意力约为 <code>O((N*M)^2)<\/code>，显存随帧数快速增长。解决思路是分块再对齐，例如VGGT-Long、VGGT-SLAM；未标定时块间存在射影歧义，VGGT-SLAM 在 <code>SL(4)<\/code> 上对齐。（见 6.4.3）<\/p>\n<p><strong>3. GCA<\/strong><\/p>\n<p>锚定上下文定义世界系和尺度，对应初始化；位姿参考窗口保留最近帧的全部 token，对应滑窗局部 BA；轨迹记忆只给老帧留 6 个 token，对应把老帧边缘化成紧凑摘要。（见 6.4.4）<\/p>\n<p><strong>4. 尺度歧义<\/strong><\/p>\n<p><code>X_c -&gt; s*X_c<\/code>、<code>t -&gt; s*t<\/code> 时，像素 <code>u = K*X_c/Z_c<\/code> 不变。网络训练时把真值按平均距离归一化，输出的是归一化尺度。（见 6.4.6、1.3.5）<\/p>\n<p><strong>5. 原因<\/strong><\/p>\n<p>无绝对尺度；分块尺度漂移；坐标系任意、无重力方向；置信度未标定；无回环、漂移无界；算力要求高；批处理不满足因果性。（见 6.4.6）<\/p>\n<p><strong>6. ATE 与导航<\/strong><\/p>\n<p>论文 ATE 通常先做带尺度的 <code>Sim(3)<\/code> 对齐，尺度错误和尺度漂移的一部分被对齐吸收了；导航时没有真值可以对齐，尺度错就是距离错。（见 6.4.3、6.4.6）<\/p>\n<p><strong>7. 补救<\/strong><\/p>\n<p>融合 IMU 获得尺度和重力；融合轮速、雷达或双目；网络当前端，传统 BA、PGO 当后端保证一致性和度量性。（见 6.4.7）<\/p><\/section>", "sections": [{"id": "6.4.1", "title": "一句话回答"}, {"id": "6.4.2", "title": "VGGT 是什么？"}, {"id": "6.4.3", "title": "复现 VGGT 时要注意什么？"}, {"id": "6.4.4", "title": "LingBot-Map 是什么？"}, {"id": "6.4.5", "title": "VGGT 与 LingBot-Map 怎样对比？"}, {"id": "6.4.6", "title": "为什么端到端 VO 不能直接用于导航？"}, {"id": "6.4.7", "title": "怎样把它变成可用于导航的系统？"}, {"id": "6.4.8", "title": "本章面试题与参考答案"}]}]}, {"key": "L7", "label": "第 7 级", "title": "工程实战：退化、错层、回环与系统工程", "intro": "<div class=\"callout goal\"><strong>这一级学完，你能回答<\/strong>：长走廊退化怎样检测、检测到后怎样只更新可靠方向；BIEVR-LIO 怎样从数据里挖出约束；错层是怎样形成的、怎样找第一帧错误；回环检测的完整流程、回环后优化了哪些变量；ROS 2 中 QoS、时间戳、TF、Executor 怎样影响 SLAM；怎样把 LIO 和整条 pipeline 的内存、CPU 降下来。<\/div>\n<p>这一级是原文的“五个问题”主战场，也是面试中项目深挖最多的部分。<\/p>", "chapters": [{"num": "7.1", "title": "长走廊中激光退化怎么办", "html": "<section class=\"sec\" data-sec=\"7.1.0\"><div class=\"callout tip\"><strong>为什么现在学这一章<\/strong>：第 3 级讲过“一面墙约束不了沿墙方向”。这一章把它放到真实走廊：推导退化、用 SVD 检测、截断更新，以及轮速、IMU、视觉各能补什么。<\/div>\n<p>第 3.3.1 节说明了 Hessian 的小特征值代表某个状态方向缺少信息，本章就是这个结论在真实场景中最常见的一种表现。<\/p><\/section>\n<section class=\"sec\" data-sec=\"7.1.1\"><h3 id=\"s7.1.1\"><span class=\"num\">7.1.1<\/span> 一句话回答<\/h3>\n<p>长走廊的核心是某些运动方向缺少几何信息。先检测退化方向，只让激光修正可靠方向；弱方向交给轮速、IMU 或其他独立传感器，并增大相应协方差。仅靠当前激光匹配，不能从完全不存在的几何信息中恢复位置。<\/p><\/section>\n<section class=\"sec\" data-sec=\"7.1.2\"><h3 id=\"s7.1.2\"><span class=\"num\">7.1.2<\/span> 从点到面距离推导走廊退化<\/h3>\n<p>ICP 是 Iterative Closest Point：先为当前点寻找地图对应，再调整位姿减小对应误差，并反复迭代。点到面 ICP 使用“点偏离局部平面的距离”作为误差。<\/p>\n<p><code>p_i<\/code> 是雷达实际测到的第 i 个点。给定当前候选位姿 <code>(R_hat, t_hat)<\/code>，将它变换到地图坐标系：<\/p>\n<pre class=\"code\"><code>y_i = R_hat * p_i + t_hat<\/code><\/pre>\n<p>地图中的对应平面由平面上一点 <code>q_i<\/code> 和单位法向量 <code>n_i<\/code> 表示。在无测量噪声、无地图误差且对应关系正确的理想条件下，变换正确时 <code>y_i<\/code> 应落在平面上。平面上的任意点 y 满足：<\/p>\n<pre class=\"code\"><code>n_i^T * (y - q_i) = 0<\/code><\/pre>\n<p>先记候选点到平面的有符号距离：<\/p>\n<pre class=\"code\"><code>d_i(R_hat, t_hat)\n= n_i^T * (R_hat * p_i + t_hat - q_i)<\/code><\/pre>\n<p>理想约束是 <code>d_i = 0<\/code>。若严格沿用第 2.2 节的 <code>r=z-h<\/code>，可把 <code>z=0<\/code>、<code>h=d_i<\/code> 代入，得到 <code>r_i=-d_i<\/code>。ICP 文献和代码也常直接采用相反符号：<\/p>\n<pre class=\"code\"><code>r_i = d_i = h_i - z_i<\/code><\/pre>\n<p>本文在本节采用这个常见的正号形式。因为代价使用 <code>r_i^2<\/code>，整体翻转残差符号不会改变最优位姿；但雅可比和正规方程右端的符号必须跟着同一约定一起改变。<\/p>\n<p>这里默认 <code>n_i<\/code> 是单位向量；<code>||n_i||<\/code> 表示向量长度，否则 <code>d_i<\/code> 还要除以它才是几何距离。真实数据存在测距噪声和地图误差，所以位姿正确时残差通常也不会全部为零。<\/p>\n<p>若使用左乘小扰动：<\/p>\n<pre class=\"code\"><code>Exp(delta_theta) approximately_equals I + skew(delta_theta)\n\ny_i_new\n= (I + skew(delta_theta)) * y_i + delta_t\n= y_i + delta_theta × y_i + delta_t\n= y_i + delta_t - skew(y_i) * delta_theta<\/code><\/pre>\n<p>最后一步使用了 <code>delta_theta × y_i = -y_i × delta_theta<\/code>。代入点到面残差：<\/p>\n<pre class=\"code\"><code>r_i_new\napproximately_equals\nr_i\n+ n_i^T * delta_t\n- n_i^T * skew(y_i) * delta_theta<\/code><\/pre>\n<p>所以这一条点到面残差的雅可比是：<\/p>\n<pre class=\"code\"><code>J_i = n_i^T * [I, -skew(y_i)]<\/code><\/pre>\n<p>如果代码使用右扰动、不同坐标系或 <code>[rotation; translation]<\/code> 排列，公式会改变；雅可比必须与扰动和更新约定成套使用。<\/p>\n<p>假设二维走廊沿 x 轴延伸，两侧墙面的法向量近似为：<\/p>\n<pre class=\"code\"><code>n = [0, 1]^T 或 [0, -1]^T<\/code><\/pre>\n<p>只考虑平移：<\/p>\n<pre class=\"code\"><code>r = n_x * t_hat_x + n_y * t_hat_y + 其他项<\/code><\/pre>\n<p>于是：<\/p>\n<pre class=\"code\"><code>partial(r) / partial(t_hat_x) = n_x approximately_equals 0\npartial(r) / partial(t_hat_y) = n_y approximately_equals ±1<\/code><\/pre>\n<p>沿走廊方向改变候选平移 <code>t_hat_x<\/code>，点到墙的距离几乎不变；横向改变 <code>t_hat_y<\/code>，残差会明显变化。因此 J 中 <code>t_hat_x<\/code> 对应列接近零，H 在这个方向出现小特征值。<\/p>\n<p>这也解释了为什么 ICP 的总残差很小，纵向位置仍可能是错的：残差本来就看不见这个方向。<\/p>\n<figure class=\"still\"><img loading=\"lazy\" src=\"img/static/corridor-degeneracy.png\" alt=\"长走廊中所有墙面法向同向，纵向约束缺失\"><figcaption>长走廊中所有墙面法向同向，纵向约束缺失<\/figcaption><\/figure>\n<blockquote>图注：两侧墙的法向都接近 <code>(0, ±1)<\/code>，所以点到面残差对纵向平移的雅可比接近 0。此时总残差可以很小、卡方也能通过，但纵向位置几乎没有被约束。<\/blockquote>\n<p>航向角是否同时退化不能一概而论。若视野能看到墙端、门洞、拐角或较长的非对称结构，航向和纵向会获得额外约束；若只有理想的无限平行墙，则这些信息不存在。<\/p>\n<figure class=\"anim\"><div class=\"player\"><video src=\"vid/corridor_degeneracy.mp4\" poster=\"vid/corridor_degeneracy.jpg\" muted loop playsinline preload=\"none\" aria-label=\"动画 26：长走廊：沿走廊滑动残差始终为 0 → H = diag(0, 4)；看到门框后变为 diag(1, 4)\"><\/video><\/div><figcaption><span class=\"badge\">动画 26<\/span>长走廊：沿走廊滑动残差始终为 0 → H = diag(0, 4)；看到门框后变为 diag(1, 4)<\/figcaption><\/figure><\/section>\n<section class=\"sec\" data-sec=\"7.1.3\"><h3 id=\"s7.1.3\"><span class=\"num\">7.1.3<\/span> 怎样检测退化？<\/h3>\n<p>先按第 2.4.5 节的方法选择白化矩阵 W，使：<\/p>\n<pre class=\"code\"><code>W^T*W = Omega<\/code><\/pre>\n<p>例如 <code>Sigma=L*L^T<\/code> 时可以取 <code>W=L^-1<\/code>。残差和雅可比必须一起白化：<\/p>\n<pre class=\"code\"><code>e       = W*r\nJ_white = W*J<\/code><\/pre>\n<p>这样 <code>||e||^2=r^T*Omega*r<\/code>。本节不再重复白化和马氏距离的概率推导，只使用<code>J_white<\/code> 检查状态各方向的约束强弱。<\/p>\n<p>位姿增量中的平移单位是米，旋转单位是弧度，不能直接比较。可定义对角尺度矩阵 D：<\/p>\n<pre class=\"code\"><code>q = D * delta_x\nJ_scaled = J_white * D^-1<\/code><\/pre>\n<p>例如 D 可以用机器人尺寸或场景典型距离，把“一弧度转动造成的典型点位移”与平移放到可比较的尺度。尺度一旦定义，就应在阈值标定和运行检测中保持一致。<\/p>\n<p>再做奇异值分解（SVD）：<\/p>\n<pre class=\"code\"><code>J_scaled = U * diag(s_i) * V^T<\/code><\/pre>\n<ul><li><code>V<\/code> 的列表示尺度化状态 q 空间中的方向；<\/li><li><code>s_i<\/code> 大，说明该方向残差变化明显；<\/li><li><code>s_i<\/code> 小，说明该方向约束弱；<\/li><li>对应的 <code>H_scaled = J_scaled^T*J_scaled<\/code>，其特征值就是 <code>s_i^2<\/code>。<\/li><\/ul>\n<p>还应联合检查：<\/p>\n<ul><li>内点率和有效匹配点数量；<\/li><li>匹配点是否覆盖整个视场；<\/li><li>法向量是否只集中在一个方向；<\/li><li>激光结果与 IMU/轮速预测是否冲突；<\/li><li>弱方向是否连续多帧存在。<\/li><\/ul>\n<p>第 2.4.6 节的卡方检验和这里的退化检测不能互相替代：卡方统计量大，表示当前残差相对协方差异常，常用于发现外点或错误关联；奇异值小，表示某个状态方向缺少约束。长走廊中完全可能出现“残差很小、卡方检验通过，但纵向奇异值仍接近零”的情况。<\/p>\n<p>应使用正常、走廊、开阔和失败数据标定阈值。<code>1e-3<\/code> 之类只能作为实验起点，不能当通用标准。<\/p><\/section>\n<section class=\"sec\" data-sec=\"7.1.4\"><h3 id=\"s7.1.4\"><span class=\"num\">7.1.4<\/span> 检测到退化后怎样更新？<\/h3>\n<p>假设当前候选位姿来自 IMU 和轮速预测。沿用上一节的白化矩阵 W，白化、尺度化后的线性残差是：<\/p>\n<pre class=\"code\"><code>e = W*r\n\ne_new approximately_equals e + J_scaled * delta_q<\/code><\/pre>\n<p><code>||e_new||^2<\/code> 表示 e 的各分量平方后求和。我们希望找到使它最小的增量。因为 U、V的列是相互正交的方向，问题可以拆成每个奇异方向上的标量方程：<\/p>\n<pre class=\"code\"><code>s_i * (v_i^T * delta_q) = -u_i^T * e\n\n所以：\n\nv_i^T * delta_q = -(u_i^T * e) / s_i<\/code><\/pre>\n<p>若所有状态方向的奇异值都非零，把各方向重新组合起来就是：<\/p>\n<pre class=\"code\"><code>J_scaled = U * diag(s_i) * V^T\n\ndelta_q\n= -V * diag(1 / s_i) * U^T * e<\/code><\/pre>\n<p>如果某个 <code>s_i<\/code> 很小，<code>1/s_i<\/code> 会非常大：几乎没有信息的方向反而可能产生巨大修正。因此只保留可靠奇异值及对应的 <code>U_good<\/code>、<code>V_good<\/code>：<\/p>\n<pre class=\"code\"><code>delta_q_lidar\n= -V_good\n  * diag(1 / s_good)\n  * U_good^T\n  * e\n\ndelta_x_lidar = D^-1 * delta_q_lidar<\/code><\/pre>\n<p>这就是截断 SVD：弱方向没有被激光强行修改，因此仍保留在运动预测中。它与只在可靠子空间求解 Hessian 等价，但数值上不需要先构造<code>J_scaled^T*J_scaled<\/code>。<\/p>\n<p>更直观地说：<\/p>\n<pre class=\"code\"><code>横向、航向等有信息方向 -&gt; 接受激光修正\n走廊纵向等弱方向       -&gt; 保留运动预测<\/code><\/pre>\n<p>也可以不给弱方向完全置零，而是随奇异值连续减小激光权重，避免状态切换跳变。<\/p>\n<p>注意两种常见错误：<\/p>\n<ol><li value=\"1\">给 <code>H<\/code> 加 LM 阻尼只能让方程更好解，不代表产生了真实观测。<\/li><li value=\"2\">不能把后验协方差投影为零；弱方向应当是大方差，而不是“完全确定”。<\/li><\/ol><\/section>\n<section class=\"sec\" data-sec=\"7.1.5\"><h3 id=\"s7.1.5\"><span class=\"num\">7.1.5<\/span> 其他传感器各自能补什么？<\/h3>\n<div class=\"tbl\"><table><thead><tr><th>信息源<\/th><th>能补充的内容<\/th><th>局限<\/th><\/tr><\/thead><tbody><tr><td>轮速里程计<\/td><td>直接提供短期前进距离<\/td><td>打滑、轮径误差会累计<\/td><\/tr><tr><td>IMU<\/td><td>角速度、姿态和短时运动<\/td><td>匀速纵向位置不可长期靠二次积分获得<\/td><\/tr><tr><td>视觉<\/td><td>门牌、灯具、纹理等纵向特征<\/td><td>光照、纹理和动态遮挡影响大<\/td><\/tr><tr><td>UWB 超宽带测距 / GNSS 卫星定位<\/td><td>绝对或半绝对位置<\/td><td>基站覆盖或卫星遮挡问题<\/td><\/tr><tr><td>AprilTag / 反光柱<\/td><td>可辨识的人工锚点<\/td><td>需要改造环境<\/td><\/tr><\/tbody><\/table><\/div>\n<p>对轮式机器人，还可在真实满足时加入非完整运动约束，例如车体横向速度近似为 0。这种约束来自车辆运动学，不是为了让矩阵可逆而虚构的信息。<\/p><\/section>\n<section class=\"sec\" data-sec=\"7.1.6\"><h3 id=\"s7.1.6\"><span class=\"num\">7.1.6<\/span> 长廊中 IMU 能否完全替代激光弱方向？<\/h3>\n<p>不能。LIO 是 LiDAR-Inertial Odometry，即激光—惯性里程计。IMU 测量的是角速度和比力，不直接测位置。bias 是传感器缓慢变化的零偏；一个很小的恒定加速度偏置<code>b_a<\/code>，若暂时忽略姿态误差、初始速度误差并假设偏置方向在世界系中保持不变，经过两次积分后产生的位置误差近似为：<\/p>\n<pre class=\"code\"><code>position_error approximately_equals 0.5 * b_a * t^2<\/code><\/pre>\n<p>例如 <code>b_a = 0.02 m/s^2<\/code>，持续 10 s，仅这一项就可能产生约 1 m 误差。真实系统还有姿态误差把重力投影到水平方向的问题。<\/p>\n<p>LIO 通常在线估计：<\/p>\n<pre class=\"code\"><code>位置、速度、姿态、陀螺 bias、加速度计 bias<\/code><\/pre>\n<p>激光只有在其残差对这些状态存在灵敏度时，才能通过雅可比间接校正 bias。长廊持续直行且缺少运动激励时，部分 bias 与沿廊运动误差会耦合，不能仅靠延长优化窗口解决。<\/p>\n<p>有效措施包括：<\/p>\n<ul><li>融合轮速和符合真实车辆模型的非完整约束；<\/li><li>使用 GNSS、UWB、视觉或人工锚点；<\/li><li>允许时通过转弯等运动增加激励；<\/li><li>弱方向增大协方差，限制低置信状态入图；<\/li><li>不确定度超过安全阈值时降速、停车或重定位。<\/li><\/ul><\/section>\n<section class=\"sec\" data-sec=\"7.1.7\"><h3 id=\"s7.1.7\"><span class=\"num\">7.1.7<\/span> 长走廊中怎样融合视觉信息？<\/h3>\n<p>视觉的价值不是“相机一定比 LiDAR 准”，而是它可能看见 LiDAR 点到平面残差看不见的变化。走廊沿 x 方向时，理想平行墙的点到平面残差对 <code>t_x<\/code> 不敏感；但门框、标牌、灯具等视觉特征在连续图像中的像素位置会随着前进而变化。视觉重投影残差可写成：<\/p>\n<pre class=\"code\"><code>r_camera_ij\n= observed_pixel_ij\n  - project(T_C_W_i*P_j)<\/code><\/pre>\n<p><code>P_j<\/code> 是空间特征点，<code>T_C_W_i<\/code> 是第 i 帧相机位姿，<code>project<\/code> 是相机投影模型。若沿走廊移动会明显改变预测像素，则 <code>r_camera_ij<\/code> 对 <code>t_x<\/code> 的雅可比不再接近 0，视觉就能给 LiDAR 弱方向补充信息。<\/p>\n<p>紧耦合系统把各自的原始残差放进同一个状态估计问题：<\/p>\n<pre class=\"code\"><code>F(X)\n= F_prior\n  + sum(F_imu)\n  + sum(F_lidar)\n  + sum(F_camera)\n  + sum(F_wheel)<\/code><\/pre>\n<p>其中：<\/p>\n<pre class=\"code\"><code>F_lidar_i  = 0.5*r_lidar_i^T*Sigma_lidar_i^-1*r_lidar_i\nF_camera_j = 0.5*r_camera_j^T*Sigma_camera_j^-1*r_camera_j<\/code><\/pre>\n<p>像素残差和米制残差不能直接比较大小，必须分别按协方差白化。还要区分两种接口：<\/p>\n<ul><li>若后端接收的是扫描匹配输出的六维位姿因子，就应给它方向相关的位姿协方差：走廊纵向方差大、横向和可靠姿态方向方差小；<\/li><li>若估计器直接使用每个点到平面残差，退化方向主要由整批雅可比的近似零空间体现，不能通过随意放大单个点的测距噪声来伪造方向信息，应按第 7.1.3、7.1.4 节在可靠子空间更新。<\/li><\/ul>\n<p>这样才能保留 LiDAR 在可靠方向上的作用，让视觉、轮速或其他传感器主要补纵向。<\/p>\n<p>相机布置也决定视觉是否真的有帮助：<\/p>\n<ul><li>只看远处消失点的前视单目相机，沿光轴前进时视差可能很小；<\/li><li>广角、鱼眼、侧视或斜视相机更容易观察侧墙特征的运动；<\/li><li>双目或 RGB-D 可直接提供尺度，单目尺度要由 IMU、LiDAR 或轮速约束；<\/li><li>白墙、重复门框、强反光和弱光会让视觉同样退化，此时需要人工标志、UWB 或其他独立观测。<\/li><\/ul>\n<p>工程上还必须做好相机—IMU—LiDAR 的时间同步和外参标定，并用重投影误差、跟踪长度、特征分布和视差判断视觉质量。若视觉里程计已经融合了同一份 IMU，再把视觉输出和这份 IMU 当成独立因子加入后端，会重复计算信息；更稳妥的做法是共享原始因子，或明确建模二者的相关性。<\/p><\/section>\n<section class=\"sec\" data-sec=\"7.1.8\"><h3 id=\"s7.1.8\"><span class=\"num\">7.1.8<\/span> 一套可落地流程<\/h3>\n<pre class=\"code\"><code>1. 用 IMU 和轮速预测当前位姿\n2. 做时间同步和逐点去畸变\n3. 以预测位姿为初值做 scan-to-submap 匹配\n4. 重新计算最终残差、白化雅可比和 SVD\n5. 判断可靠方向、弱方向或整帧失败\n6. 可靠方向融合激光，弱方向使用视觉、轮速等独立信息并增大激光协方差\n7. 对视觉跟踪、创新和多传感器一致性做门控\n8. 低可信扫描不写入永久地图\n9. 连续退化时降速；不确定度超限时停车或重定位<\/code><\/pre>\n<p>扩大局部地图只有在能看到门洞、拐角或交叉口等新结构时才有帮助。扩大后仍只有两面平行墙，就没有增加纵向信息。<\/p><\/section>\n<section class=\"sec\" data-sec=\"7.1.9\"><h3 id=\"s7.1.9\"><span class=\"num\">7.1.9<\/span> 本章面试题与参考答案<\/h3>\n<p>先自己作答，再对照答案；答案后括号注明对应小节。<\/p>\n<h4>题目<\/h4>\n<ol><li value=\"1\">长走廊中 ICP 的总残差很小、卡方检验也通过了，为什么纵向位置仍可能是错的？<\/li><li value=\"2\">用左乘小扰动推导点到面残差 <code>r_i = n_i^T*(R_hat*p_i + t_hat - q_i)<\/code> 对位姿的雅可比。<\/li><li value=\"3\">二维走廊沿 x 轴，两侧墙各取两个点，法向为 <code>(0, 1)<\/code> 和 <code>(0, -1)<\/code>，只考虑平移。写出 J 和 <code>H = J^T*J<\/code>，并指出退化方向；若再看到一个法向为 <code>(1, 0)<\/code> 的门框点，H 怎样变化？<\/li><li value=\"4\">做退化检测时，为什么要先白化、再尺度化，最后才做 SVD？直接对原始 <code>J^T*J<\/code> 求特征值有什么问题？<\/li><li value=\"5\">检测到退化后怎样更新？写出截断 SVD 的解，并说明为什么不能直接用全部奇异值求逆。<\/li><li value=\"6\">追问：给 H 加 LM 阻尼让它可逆，或者把弱方向的后验协方差投影为零，这两种做法对不对？<\/li><li value=\"7\">长廊里能不能只靠 IMU 撑住纵向？若加速度计 bias 为 <code>0.01 m/s^2<\/code>，持续 30 s，仅这一项位置误差约多大？<\/li><li value=\"8\">视觉能在长走廊里补什么？前视单目、侧视或鱼眼相机效果有什么差别？融合时要注意哪些坑？<\/li><li value=\"9\">若后端只接收扫描匹配输出的六维位姿因子，退化信息应当怎样传递？若估计器直接使用逐点残差呢？<\/li><li value=\"10\">现场排查题：机器人在走廊里定位纵向“滑”了几米。你的处理流程是什么？有人建议“把局部地图范围扩大一倍”，是否有效？<\/li><\/ol>\n<h4>参考答案<\/h4>\n<p><strong>1. 残差小、卡方通过，纵向为何仍可能错？<\/strong><\/p>\n<p>走廊两侧墙法向近似 <code>(0, ±1)<\/code>，点到面残差对纵向平移的偏导近似为 0：<\/p>\n<pre class=\"code\"><code>partial(r) / partial(t_hat_x) = n_x approximately_equals 0<\/code><\/pre>\n<p>沿走廊方向改变位姿，点到墙的距离几乎不变，所以残差“看不见”这个方向；残差再小也只能说明横向和姿态对齐了。卡方统计量大表示残差相对协方差异常，用来发现外点或错误关联；奇异值小表示某方向缺少约束，二者不能互相替代。（见 7.1.2、7.1.3）<\/p>\n<p><strong>2. 推导点到面残差的雅可比。<\/strong><\/p>\n<pre class=\"code\"><code>y_i = R_hat*p_i + t_hat\nExp(delta_theta) approximately_equals I + skew(delta_theta)\n\ny_i_new = (I + skew(delta_theta))*y_i + delta_t\n        = y_i + delta_t - skew(y_i)*delta_theta\n\nr_i_new approximately_equals r_i + n_i^T*delta_t - n_i^T*skew(y_i)*delta_theta\n\nJ_i = n_i^T * [I, -skew(y_i)]<\/code><\/pre>\n<p>关键一步是 <code>delta_theta × y_i = -y_i × delta_theta<\/code>。右扰动、不同坐标系或<code>[rotation; translation]<\/code> 排列都会改变公式，雅可比必须与扰动和更新约定成套使用。（见 7.1.2）<\/p>\n<p><strong>3. 走廊小算例。<\/strong><\/p>\n<pre class=\"code\"><code>J = [ 0  1 ]\n    [ 0  1 ]\n    [ 0 -1 ]\n    [ 0 -1 ]\n\nH = J^T*J = diag(0, 4)，特征值 0 和 4<\/code><\/pre>\n<p>特征值 0 对应的方向是 <code>(1, 0)<\/code>，即沿走廊的 x 方向完全无约束。加入法向 <code>(1, 0)<\/code> 的门框点后，该点的行是 <code>[1, 0]<\/code>，H 变为 <code>diag(1, 4)<\/code>，纵向获得信息，但仍比横向弱。这就是“看到门洞、拐角才有帮助”的原因。（见 7.1.2、7.1.8）<\/p>\n<p><strong>4. 为什么先白化、再尺度化、后 SVD？<\/strong><\/p>\n<p>白化 <code>e = W*r<\/code>、<code>J_white = W*J<\/code>（<code>W^T*W = Omega<\/code>）让不同噪声的残差可比；尺度化<code>J_scaled = J_white*D^-1<\/code> 解决平移单位是米、旋转单位是弧度、不能直接比较的问题。然后：<\/p>\n<pre class=\"code\"><code>J_scaled = U*diag(s_i)*V^T\nH_scaled = J_scaled^T*J_scaled 的特征值 = s_i^2<\/code><\/pre>\n<p>直接对原始 <code>J^T*J<\/code> 求特征值，结果会随单位选择而变，阈值没有意义。尺度 D 一旦定义，标定阈值和运行检测必须一致；<code>1e-3<\/code> 这类值只是实验起点，要用正常、走廊、开阔和失败数据标定。（见 7.1.3）<\/p>\n<p><strong>5. 退化后怎样更新？<\/strong><\/p>\n<p>每个奇异方向上的解是 <code>v_i^T*delta_q = -(u_i^T*e)/s_i<\/code>。<code>s_i<\/code> 很小时 <code>1/s_i<\/code> 极大，几乎没有信息的方向反而会产生巨大修正。因此只保留可靠方向：<\/p>\n<pre class=\"code\"><code>delta_q_lidar = -V_good * diag(1/s_good) * U_good^T * e\ndelta_x_lidar = D^-1 * delta_q_lidar<\/code><\/pre>\n<p>弱方向不被激光修改，保留运动预测。它等价于只在可靠子空间求解 Hessian，但不必先构造<code>J_scaled^T*J_scaled<\/code>。也可以随奇异值连续降权，避免状态切换跳变。（见 7.1.4）<\/p>\n<p><strong>6. 追问：LM 阻尼、协方差投影为零对不对？<\/strong><\/p>\n<p>都不对。LM 阻尼只让方程更好解，并没有产生真实观测，弱方向的解仍无依据。弱方向应当是“大方差”，把后验协方差投影为零等于宣称“完全确定”，后续融合会过度信任这个错误状态。（见 7.1.4）<\/p>\n<p><strong>7. 只靠 IMU 撑纵向，误差多大？<\/strong><\/p>\n<p>IMU 不直接测位置，恒定加速度 bias 两次积分后：<\/p>\n<pre class=\"code\"><code>position_error approximately_equals 0.5 * b_a * t^2\n= 0.5 * 0.01 * 30^2\n= 4.5 m<\/code><\/pre>\n<p>这还没算姿态误差把重力投影到水平方向。长廊直行缺少激励时，bias 与沿廊运动误差耦合，不能仅靠延长优化窗口解决，需要轮速、非完整约束、GNSS/UWB/视觉/人工锚点，或通过转弯增加激励。（见 7.1.6）<\/p>\n<p><strong>8. 视觉能补什么？怎样用？<\/strong><\/p>\n<p>门框、标牌、灯具的像素位置随前进变化，所以重投影残差 <code>observed_pixel_ij -project(T_C_W_i*P_j)<\/code> 对 <code>t_x<\/code> 的雅可比不为 0，能补 LiDAR 弱方向。前视单目沿光轴前进时视差可能很小；广角、鱼眼、侧视、斜视更容易看到侧墙特征运动；单目尺度要靠 IMU、LiDAR 或轮速。坑：像素残差与米制残差必须各自按协方差白化；要做相机—IMU—LiDAR 时间同步和外参标定；视觉里程计已用过同一份 IMU 时，不能再把 VO 输出和这份 IMU 当独立因子重复加入。白墙、重复门框、弱光时视觉同样退化。（见 7.1.7）<\/p>\n<p><strong>9. 位姿因子接口和逐点残差接口怎样传递退化？<\/strong><\/p>\n<p>位姿因子接口：给方向相关的六维协方差，走廊纵向方差大、横向和可靠姿态方向方差小，不能六个自由度填同样的值。逐点残差接口：退化体现在整批雅可比的近似零空间，不能靠放大单个点的测距噪声来伪造方向信息，应按截断 SVD 在可靠子空间更新。（见 7.1.7）<\/p>\n<p><strong>10. 现场：走廊纵向滑了几米怎么处理？<\/strong><\/p>\n<pre class=\"code\"><code>1. 确认时间同步、逐点去畸变正常，排除非退化原因\n2. 以 IMU/轮速预测为初值做 scan-to-submap，重新计算白化雅可比和 SVD\n3. 判断可靠方向、弱方向或整帧失败，看法向分布、内点率、视场覆盖、是否连续多帧\n4. 可靠方向用激光，纵向交给轮速/视觉等独立信息，并增大激光在该方向的协方差\n5. 低可信扫描不写入永久地图；连续退化降速，不确定度超限停车或重定位<\/code><\/pre>\n<p>扩大局部地图只有能看到门洞、拐角、交叉口等新结构时才有效；扩大后仍只有两面平行墙，纵向信息没有增加。（见 7.1.4、7.1.5、7.1.8）<\/p>\n<hr><\/section>", "sections": [{"id": "7.1.1", "title": "一句话回答"}, {"id": "7.1.2", "title": "从点到面距离推导走廊退化"}, {"id": "7.1.3", "title": "怎样检测退化？"}, {"id": "7.1.4", "title": "检测到退化后怎样更新？"}, {"id": "7.1.5", "title": "其他传感器各自能补什么？"}, {"id": "7.1.6", "title": "长廊中 IMU 能否完全替代激光弱方向？"}, {"id": "7.1.7", "title": "长走廊中怎样融合视觉信息？"}, {"id": "7.1.8", "title": "一套可落地流程"}, {"id": "7.1.9", "title": "本章面试题与参考答案"}]}, {"num": "7.2", "title": "BIEVR-LIO：让地图看见细微几何", "html": "<section class=\"sec\" data-sec=\"7.2.0\"><div class=\"callout tip\"><strong>为什么现在学这一章<\/strong>：上一章的思路是“检测退化后屏蔽弱方向”。BIEVR-LIO 换了一个角度：很多场景并不严格退化，只是地图分辨率不够。本章介绍它的体素高度图、残差和采样策略，以及项目选型问题的答题框架。<\/div>\n<p>第 7.1 章已经推导过长走廊为什么退化、怎样检测、怎样只更新可靠方向。本章介绍一种不同的思路：BIEVR-LIO（ETH Zurich ASL，RSS 2026，arXiv:2604.14421）不把重点放在“检测并绕开退化”，而是“让地图看见原本被平均掉的细微几何”。<\/p><\/section>\n<section class=\"sec\" data-sec=\"7.2.1\"><h3 id=\"s7.2.1\"><span class=\"num\">7.2.1<\/span> 一句话回答<\/h3>\n<p>很多被认为退化的场景其实并不严格退化：隧道壁有管线、螺栓和接缝，平地有起伏。算法之所以认为它退化，是因为每个体素只存一个平面，平面内部的细节被平均掉了。BIEVR-LIO 在每个体素里存一张沿法向的高度图（bump image，分辨率 5 cm），用“点的高度减去高度图插值”作残差；高度图的梯度为平面内两个方向提供了约束，再用“按信息量采样”把计算集中到有起伏纹理的体素上。<\/p><\/section>\n<section class=\"sec\" data-sec=\"7.2.2\"><h3 id=\"s7.2.2\"><span class=\"num\">7.2.2<\/span> 先回顾：退化是什么？<\/h3>\n<p>点到平面残差只在法向上提供约束（推导见 7.1.2 节）。把所有点的贡献累加：<\/p>\n<pre class=\"code\"><code>H = Σ_i J_i^T * J_i\nJ_i = n_i^T * [ -R * skew(p_i),  I ]<\/code><\/pre>\n<p>若法向张不满三维（长走廊只有地面和两侧墙，沿走廊方向无约束；开阔平地只有地面，x、y、yaw 无约束），<code>H<\/code> 就有接近 0 的特征值，对应特征向量就是退化方向（见 3.3.1.5、7.1.3 节）。经典做法是：特征值低于阈值的方向不更新（solution remapping），或用轮速、视觉等外部传感器补约束（见 7.1.4、7.1.5 节）。这些方法都需要“检测 -&gt; 屏蔽或补偿”，补偿往往要额外传感器，系统更复杂。<\/p><\/section>\n<section class=\"sec\" data-sec=\"7.2.3\"><h3 id=\"s7.2.3\"><span class=\"num\">7.2.3<\/span> 体素凹凸高度图怎样构造？<\/h3>\n<pre class=\"code\"><code>空间 -&gt; 0.5 m 体素（Morton 码哈希，LRU 淘汰控制内存）\n每个体素累积：点的和、外积和、点数\n  -&gt; PCA 得到法向 n，作为体素局部坐标系的 z 轴\n  -&gt; 以体素平面为“像平面”，按 0.05 m 像素建一张小高度图\n每个像素存：点相对平面的高度，按距离加权平均\n  权重 = min(0.5, 1/range)，近处点权重大\n  更新后做 1 像素高斯平滑\n法向转动超过 3° -&gt; 把高度图重投影到新坐标系\n体素至少有 4 个点才初始化<\/code><\/pre>\n<p>本质是把“一个体素一个平面”升级为“一个体素一个 2.5D 高度场”，体素内的几何分辨率从 0.5 m 提高到 5 cm。<\/p><\/section>\n<section class=\"sec\" data-sec=\"7.2.4\"><h3 id=\"s7.2.4\"><span class=\"num\">7.2.4<\/span> 残差和雅可比为什么能补上平面内的方向？<\/h3>\n<p>对每个采样点，先变换到所在体素的局部坐标系，得到 <code>(x_v, y_v, z_v)<\/code>：<\/p>\n<pre class=\"code\"><code>r_i = z_v - Bilinear(I_voxel, x_v, y_v)<\/code><\/pre>\n<p><code>Bilinear<\/code> 是高度图在 <code>(x_v, y_v)<\/code> 处的双线性插值；四个邻近像素都未被观测过的点直接丢弃。<\/p>\n<p>残差对位姿的雅可比可以拆成两部分：<\/p>\n<pre class=\"code\"><code>d r / d p_v = [ -dI/dx,  -dI/dy,  1 ]<\/code><\/pre>\n<ul><li>第三项 <code>1<\/code> 沿法向，等价于点到平面；<\/li><li>前两项来自高度图的梯度，提供平面内两个方向的约束。<\/li><\/ul>\n<p>普通点到平面的雅可比在平面内方向上恒为 0；这里只要表面有凹凸起伏，梯度就不为 0，原本缺失的自由度就有了信息。求解使用 LM 和 Huber 核（<code>delta = 0.1 m<\/code>）。<\/p><\/section>\n<section class=\"sec\" data-sec=\"7.2.5\"><h3 id=\"s7.2.5\"><span class=\"num\">7.2.5<\/span> 地图感知采样怎样把计算放到有用的地方？<\/h3>\n<p>每个体素维护 MID（Mean Image Distance）：高度图上已观测像素的平均绝对高度，用来衡量“这个体素有多少起伏”。它在建图时增量维护，采样时没有额外计算。<\/p>\n<pre class=\"code\"><code>第一阶段：整帧 0.1 m 降采样\n          MID 最高的 300 个体素 -&gt; 保留其中全部点\n第二阶段：其余点再按 0.5 m 降采样<\/code><\/pre>\n<p>论文报告比均匀 0.1 m 采样少约 4 倍点数。思想是把计算预算集中在“有凹凸纹理”的地方，而在退化场景里，这些地方恰恰是唯一能提供约束的地方。<\/p><\/section>\n<section class=\"sec\" data-sec=\"7.2.6\"><h3 id=\"s7.2.6\"><span class=\"num\">7.2.6<\/span> IMU 怎样使用？它有什么局限？<\/h3>\n<p>BIEVR-LIO 是松耦合：<\/p>\n<pre class=\"code\"><code>IMU -&gt; 连续时间预积分、逐点去畸变、配准初值\n位姿 -&gt; 只由扫描到地图的配准给出，配准中不含惯性残差\n另有 10 s 滑动窗口 -&gt; 估计速度、重力和 bias，窗口内位姿固定为锚点<\/code><\/pre>\n<p>论文自述的局限，面试时说出来是加分项：<\/p>\n<ul><li>需要足够点密度填满像素，低线数或高速运动时受限；<\/li><li>需要较准确的初值，否则像素残差没有意义；<\/li><li>不用强度信息，在真正光滑的隧道（如 ENWIDE Tunnel）中仍然困难；<\/li><li>不显式检测退化；<\/li><li>不建模动态物体。<\/li><\/ul>\n<p>实验对比了 FAST-LIO2、DLIO、iG-LIO、KISS-ICP、COIN-LIO 等，FAST-LIO2 和 iG-LIO 在ENWIDE、GEODE 地铁隧道、MARS-LVIG 无特征序列上出现漂移或发散；论文没有与Point-LIO 做实验对比。<\/p><\/section>\n<section class=\"sec\" data-sec=\"7.2.7\"><h3 id=\"s7.2.7\"><span class=\"num\">7.2.7<\/span> 和其他退化处理方法怎样对比？<\/h3>\n<div class=\"tbl\"><table><thead><tr><th>方法<\/th><th>退化应对思路<\/th><\/tr><\/thead><tbody><tr><td>Zhang &amp; Singh、X-ICP<\/td><td>检测退化方向，不更新或用外部约束补<\/td><\/tr><tr><td>COIN-LIO<\/td><td>引入雷达强度图像作光度约束，需要较稠密的线束<\/td><\/tr><tr><td>BEV-LIO(LC)<\/td><td>点云投影成 BEV 图像，CNN 提特征作重投影残差，与点到平面一起进入 IEKF<\/td><\/tr><tr><td>BIEVR-LIO<\/td><td>提高体素内几何分辨率，用表面细微起伏的梯度约束平面内方向，并按信息量采样<\/td><\/tr><tr><td>第 7.1 章流程<\/td><td>检测退化后只更新可靠方向，再融合轮速、IMU、视觉<\/td><\/tr><\/tbody><\/table><\/div>\n<p>这些方法不互斥。工程上最稳妥的是：前端尽量从数据里挖出约束（BIEVR-LIO 思路），同时保留第 7.1 章的退化检测作为兜底。<\/p><\/section>\n<section class=\"sec\" data-sec=\"7.2.8\"><h3 id=\"s7.2.8\"><span class=\"num\">7.2.8<\/span> 项目中最终选了哪个 LIO 稳定运行？<\/h3>\n<blockquote>这一问涉及你本人项目的事实。下面是答题结构，括号和 <code>xx<\/code> 处必须换成自己的实测数据，不能照抄。<\/blockquote>\n<pre class=\"code\"><code>1. 结论先行\n   最终部署的是（FAST-LIO2 / Super-LIO）；Point-LIO 只在（手持剧烈运动）测试中最好，\n   但没有上车。\n\n2. 为什么 Point-LIO 没上车\n   底盘运动平稳（轮式或轨道低速），角速度远低于 IMU 量程，抗饱和优势用不上；\n   逐点更新对过程噪声敏感，在（长走廊/空旷车库）出现过（xx 次）发散且不能自恢复；\n   CPU 占用（单核 xx%）高于帧级方法。\n\n3. 为什么选它\n   目标平台上单帧耗时 P99 为 xx ms，满足实时；\n   连续运行 xx 小时，RSS 平稳无增长；\n   全部测试序列无发散，ATE 为 xx m，与最优者相当。\n\n4. 退化场景的工程兜底\n   不指望某个 LIO 本身不退化，而是加退化检测：\n   监控 H 的最小特征值和条件数、有效匹配点数、残差分布；\n   退化时降低雷达在弱方向的权重，融合轮速约束弱方向，必要时触发重定位。<\/code><\/pre><\/section>\n<section class=\"sec\" data-sec=\"7.2.9\"><h3 id=\"s7.2.9\"><span class=\"num\">7.2.9<\/span> 本章面试题与参考答案<\/h3>\n<p>先自己作答，再对照答案；答案后括号注明对应小节。<\/p>\n<h4>题目<\/h4>\n<ol><li value=\"1\">为什么点到平面配准在长走廊中会退化？用 Hessian 说明。<\/li><li value=\"2\">BIEVR-LIO 的核心论点是什么？它和“检测退化后屏蔽弱方向”的思路有什么不同？<\/li><li value=\"3\">BIEVR-LIO 的残差怎样定义？为什么它能约束平面内方向？<\/li><li value=\"4\">什么是地图感知采样？为什么在退化场景中特别有用？<\/li><li value=\"5\">BIEVR-LIO 有哪些局限？在什么场景下它仍然会失败？<\/li><li value=\"6\">项目中三个 LIO 最终选了哪一个？怎样组织这个回答？<\/li><\/ol>\n<h4>参考答案<\/h4>\n<p><strong>1. 退化<\/strong><\/p>\n<p>点到平面残差只在法向上有约束，<code>H = Σ J_i^T*J_i<\/code> 由各点法向张成。长走廊只有地面和两侧墙，法向缺沿走廊方向，<code>H<\/code> 在该方向的特征值接近 0，此方向只能靠 IMU 积分，噪声和错误匹配会在病态方向被放大。（见 7.2.2、7.1.2）<\/p>\n<p><strong>2. 核心论点<\/strong><\/p>\n<p>真实场景很少严格退化，算法“看不见”约束是因为地图分辨率不够，体素平面把细小起伏平均掉了。BIEVR-LIO 提高地图表示的分辨率，让数据本身提供约束；而经典方法是承认缺约束，然后屏蔽或用外部传感器补偿。（见 7.2.1、7.2.7）<\/p>\n<p><strong>3. 残差<\/strong><\/p>\n<p><code>r = z_v - Bilinear(I_voxel, x_v, y_v)<\/code>，即点在体素系下的高度减去高度图插值。雅可比除法向项外，还有高度图梯度 <code>-dI/dx<\/code>、<code>-dI/dy<\/code> 两项；只要表面有起伏，平面内方向就有非零信息。（见 7.2.4）<\/p>\n<p><strong>4. 地图感知采样<\/strong><\/p>\n<p>用 MID 衡量体素的起伏程度，MID 最高的体素保留全部点，其余点粗采样。退化场景中只有少数“有纹理”的体素能提供约束，把点数预算放在那里既省计算又保约束。（见 7.2.5）<\/p>\n<p><strong>5. 局限<\/strong><\/p>\n<p>需要足够点密度和较好初值；不用强度，在完全光滑的隧道中仍困难；不显式检测退化；不处理动态物体；IMU 是松耦合。（见 7.2.6）<\/p>\n<p><strong>6. 项目选型<\/strong><\/p>\n<p>先说结论，再说未选者的原因、所选者的实测证据（P99 耗时、长时间 RSS、发散次数、ATE），最后说退化兜底策略。所有数字必须来自自己的实验。（见 7.2.8）<\/p><\/section>", "sections": [{"id": "7.2.1", "title": "一句话回答"}, {"id": "7.2.2", "title": "先回顾：退化是什么？"}, {"id": "7.2.3", "title": "体素凹凸高度图怎样构造？"}, {"id": "7.2.4", "title": "残差和雅可比为什么能补上平面内的方向？"}, {"id": "7.2.5", "title": "地图感知采样怎样把计算放到有用的地方？"}, {"id": "7.2.6", "title": "IMU 怎样使用？它有什么局限？"}, {"id": "7.2.7", "title": "和其他退化处理方法怎样对比？"}, {"id": "7.2.8", "title": "项目中最终选了哪个 LIO 稳定运行？"}, {"id": "7.2.9", "title": "本章面试题与参考答案"}]}, {"num": "7.3", "title": "SLAM 出现错层怎么办", "html": "<section class=\"sec\" data-sec=\"7.3.0\"><div class=\"callout tip\"><strong>为什么现在学这一章<\/strong>：退化是“信息不存在”，错层是“错误位姿 → 错误地图 → 错误匹配”的正反馈。本章讲错层的形成、按现象定位、去畸变与外参排查、回环为什么会把地图拉坏，以及地图更新的分层策略。<\/div>\n<p>第 7.1 章的退化是“信息本来就不存在”；本章的错层则多了一层因果：错误的位姿把点云写进地图，错误的地图又成为下一帧匹配的参考。因此本章除了定位根因，还要讨论地图应当怎样更新。<\/p><\/section>\n<section class=\"sec\" data-sec=\"7.3.1\"><h3 id=\"s7.3.1\"><span class=\"num\">7.3.1<\/span> 一句话回答<\/h3>\n<p>先找到“第一帧错误”，再区分单帧/局部地图已经变形，还是局部地图清晰但全局排列错误。前者重点查时间、去畸变、外参和前端；后者重点查累计漂移、假回环、权重和后端。低可信点云不能直接永久写图。<\/p><\/section>\n<section class=\"sec\" data-sec=\"7.3.2\"><h3 id=\"s7.3.2\"><span class=\"num\">7.3.2<\/span> 错层是怎样形成的？<\/h3>\n<p>地图点通常由激光点和估计位姿共同生成：<\/p>\n<pre class=\"code\"><code>p_map_hat = T_map_lidar_hat * p_lidar<\/code><\/pre>\n<p>这里的 <code>T_map_lidar_hat<\/code> 是算法估计出来的变换，并不是真实位姿。点云本身或估计变换出错，都会让 <code>p_map_hat<\/code> 落到错误位置。<\/p>\n<p>所以两类错误都会把点放错位置：<\/p>\n<pre class=\"code\"><code>点本身或静态假设不适用：时间戳、去畸变、动态物体\n估计变换错误：外参、匹配、退化、回环、图优化<\/code><\/pre>\n<p>如果错误点立即写入地图，后续匹配又以错误地图为参考，就会形成反馈：<\/p>\n<pre class=\"code\"><code>错误位姿 -&gt; 错误点云入图 -&gt; 地图出现第二层\n         -&gt; 后续匹配靠近错误层 -&gt; 错层继续扩大<\/code><\/pre>\n<p>因此“匹配器返回了位姿”和“本帧允许永久入图”必须是两个不同判断。<\/p><\/section>\n<section class=\"sec\" data-sec=\"7.3.3\"><h3 id=\"s7.3.3\"><span class=\"num\">7.3.3<\/span> 根据现象快速定位<\/h3>\n<div class=\"tbl\"><table><thead><tr><th>现象<\/th><th>优先检查<\/th><\/tr><\/thead><tbody><tr><td>单帧点云本身弯曲<\/td><td>驱动、逐点时间、传感器数据<\/td><\/tr><tr><td>速度越快或转弯越明显<\/td><td>时间同步和运动去畸变<\/td><\/tr><tr><td>原地旋转出现固定双墙<\/td><td>时间偏移、雷达外参、杆臂<\/td><\/tr><tr><td>单个局部子地图已经重影<\/td><td>前端匹配、时间、外参、动态点<\/td><\/tr><tr><td>各子地图清晰但互相错位<\/td><td>累计漂移、长廊退化、后端<\/td><\/tr><tr><td>加入回环后地图突然折叠<\/td><td>假回环、变换方向、回环权重<\/td><\/tr><tr><td>地面出现多个高度层<\/td><td>重力初始化、IMU 偏置、旋转外参<\/td><\/tr><tr><td>优化后轨迹正确但旧墙仍在<\/td><td>地图没有根据优化位姿重建<\/td><\/tr><tr><td>静止时出现完整复制<\/td><td>重复 TF、重复数据源、重复插图<\/td><\/tr><\/tbody><\/table><\/div><\/section>\n<section class=\"sec\" data-sec=\"7.3.4\"><h3 id=\"s7.3.4\"><span class=\"num\">7.3.4<\/span> 为什么去畸变需要“逐点时刻”？<\/h3>\n<p>一帧激光不是同一瞬间生成的。点 <code>p_i<\/code> 在 <code>t_i<\/code> 时刻采样，要统一到参考时刻<code>t_ref<\/code>：<\/p>\n<pre class=\"code\"><code>p_ref\n= T_world_lidar_hat(t_ref)^-1\n  * T_world_lidar_hat(t_i)\n  * p_i<\/code><\/pre>\n<p>这个式子只是两步：先把 <code>t_i<\/code> 时刻的点变到 world，再从 world 变到参考时刻的lidar。<\/p>\n<p>实际计算使用的是 IMU、轮速或连续时间轨迹给出的估计位姿，不是真实位姿；因此轨迹估计错误、长时间外推或 IMU bias 同样会留下去畸变误差。<\/p>\n<p>若把整帧都当成同一时刻，机器人运动越快，点的位置误差越大；旋转时远处点的弧长误差尤其明显。<\/p>\n<p>应明确：<\/p>\n<ul><li>帧时间戳代表扫描开始、中间还是结束；<\/li><li>单点时间单位是秒、毫秒、微秒还是纳秒；<\/li><li>雷达、IMU、轮速是否在同一时基；<\/li><li>IMU 数据是否完整覆盖整帧扫描；<\/li><li>查询的是点采样时刻的 TF，而不是“最新 TF”。<\/li><\/ul><\/section>\n<section class=\"sec\" data-sec=\"7.3.5\"><h3 id=\"s7.3.5\"><span class=\"num\">7.3.5<\/span> 外参和变换方向怎样排查？<\/h3>\n<p>TF 是 ROS 中随时间维护坐标系关系的变换树；外参通常是传感器与机器人本体之间的固定变换。<\/p>\n<p><code>T_base_lidar<\/code> 表示“把 lidar 中的点变到 base”，而 <code>T_lidar_base<\/code> 是它的逆。命名相似，但不能混用。<\/p>\n<p>推荐用四组控制实验：<\/p>\n<ol><li value=\"1\">静止采集：排除纯传感器噪声、重复发布和静态外参问题。<\/li><li value=\"2\">慢速直行：观察平移比例和固定偏差。<\/li><li value=\"3\">原地旋转：最容易暴露时间偏移、旋转外参和杆臂错误。<\/li><li value=\"4\">正反方向看同一面墙：检查系统性偏移是否随运动方向改变。<\/li><\/ol>\n<p>固定姿态下总有相同偏差，更像外参问题；误差随速度或角速度增长，更像时间问题。<\/p><\/section>\n<section class=\"sec\" data-sec=\"7.3.6\"><h3 id=\"s7.3.6\"><span class=\"num\">7.3.6<\/span> 回环为什么会把地图拉坏？<\/h3>\n<p>回环相当于告诉后端“两段相距很远的轨迹其实在同一地点”。这个约束连接范围大，错误时影响也大。相似走廊、货架和楼层容易产生假回环。<\/p>\n<p>回环候选至少要检查：<\/p>\n<ul><li>几何重叠率和匹配点空间覆盖；<\/li><li>法向量方向和 Hessian 是否退化；<\/li><li>相对变换是否与里程计大致相容；<\/li><li>楼层、拓扑和行驶距离是否合理；<\/li><li>第一候选是否显著好于第二候选；<\/li><li>连续多帧是否支持同一回环。<\/li><\/ul>\n<p>鲁棒核能减弱离群因子的影响，但不能代替回环验证。退化回环也要使用方向相关的信息矩阵，不能六自由度都填同样大的权重。<\/p><\/section>\n<section class=\"sec\" data-sec=\"7.3.7\"><h3 id=\"s7.3.7\"><span class=\"num\">7.3.7<\/span> 推荐诊断与修复流程<\/h3>\n<pre class=\"code\"><code>1. 保存原始点云、逐点时间、IMU、轮速、TF、前后端位姿和回环\n2. 按帧号给点云着色，找到第一次出现重影的帧\n3. 看原始单帧是否变形\n4. 看去畸变后的单帧是否正常\n5. 看单个局部子地图是否清晰\n6. 比较回环前后的轨迹和残差\n7. 用静止、直行、旋转数据复现实验\n8. 修复根因后，从原始关键帧重新生成地图<\/code><\/pre>\n<p>已经融合成一个点云且没有保存关键帧、原始点云和对应位姿时，通常无法可靠地把两层自动拆开。可重建地图的数据结构，比事后点云“擦除”更重要。<\/p>\n<p>预防措施可以压缩为四条：<\/p>\n<ul><li>数据层：同步时间、标定外参、保留逐点时间。<\/li><li>前端层：退化检测、创新门控、低可信扫描拒绝入图。<\/li><li>后端层：回环多阶段验证、合理协方差、固定规范自由度。<\/li><li>地图层：保存关键帧与版本，使优化后能够重建，而不是只保存融合点云。<\/li><\/ul><\/section>\n<section class=\"sec\" data-sec=\"7.3.8\"><h3 id=\"s7.3.8\"><span class=\"num\">7.3.8<\/span> 地图在线更新为什么不能“看到一次就修改”？<\/h3>\n<p>一次观测没有区分下列情况的能力：<\/p>\n<pre class=\"code\"><code>永久结构变化\n临时车辆或行人遮挡\n本帧定位错误\n传感器漏检<\/code><\/pre>\n<p>稳妥的地图可以分层：<\/p>\n<pre class=\"code\"><code>静态先验层：稳定结构，更新很慢\n短期活动层：当前占据和动态障碍，更新很快\n变化证据层：累计“新增”或“消失”的多次观测<\/code><\/pre>\n<p>只有跨时间、跨视角反复得到一致证据，并且定位本身可信，才把变化合并到静态层。保存地图版本和关键帧来源，才能审计、回滚和重建。<\/p><\/section>\n<section class=\"sec\" data-sec=\"7.3.9\"><h3 id=\"s7.3.9\"><span class=\"num\">7.3.9<\/span> 本章面试题与参考答案<\/h3>\n<p>先自己作答，再对照答案；答案后括号注明对应小节。<\/p>\n<h4>题目<\/h4>\n<ol><li value=\"1\">错层和第 7.1 章的退化有什么本质区别？错层为什么会“越来越严重”？<\/li><li value=\"2\">拿到一张错层地图，第一步应该做什么？怎样把问题分成“前端类”和“后端类”？<\/li><li value=\"3\">现象判断：原地旋转后出现固定的双墙；地面出现多个高度层；优化后轨迹正确但旧墙还在；静止时出现完整复制。分别优先查什么？<\/li><li value=\"4\">写出逐点去畸变公式并解释。雷达扫描一帧 0.1 s，机器人以 1 rad/s 原地转，若把整帧当成同一时刻，10 m 外的点大约错多少？时间戳方面常见哪些坑？<\/li><li value=\"5\">怎样区分“外参错”和“时间偏移”？你会设计哪几组控制实验？<\/li><li value=\"6\">回环为什么能把地图拉坏？回环候选至少要验证什么？追问：已经有鲁棒核了，还需要这些验证吗？<\/li><li value=\"7\">追问：地图已经是一整个融合好的点云，没有保存关键帧和位姿，能否把两层自动拆开？应当怎样设计地图数据结构来避免这种局面？<\/li><li value=\"8\">地图在线更新时，为什么不能“看到一次变化就修改地图”？稳妥的做法是什么？<\/li><\/ol>\n<h4>参考答案<\/h4>\n<p><strong>1. 错层与退化的区别，为什么会自我放大？<\/strong><\/p>\n<p>退化是“信息本来就不存在”；错层多了一层因果反馈。地图点由 <code>p_map_hat = T_map_lidar_hat * p_lidar<\/code> 生成，点本身错（时间戳、去畸变、动态物体）或估计变换错（外参、匹配、退化、回环、图优化）都会把点放错：<\/p>\n<pre class=\"code\"><code>错误位姿 -&gt; 错误点云入图 -&gt; 地图出现第二层\n         -&gt; 后续匹配靠近错误层 -&gt; 错层继续扩大<\/code><\/pre>\n<p>所以“匹配器返回了位姿”和“本帧允许永久入图”必须是两个独立判断。（见 7.3.2）<\/p>\n<p><strong>2. 第一步做什么？怎样分类？<\/strong><\/p>\n<p>先找到“第一帧错误”：按帧号给点云着色，定位第一次出现重影的帧。然后区分：<\/p>\n<pre class=\"code\"><code>单帧或局部子地图已经变形/重影 -&gt; 查时间、去畸变、外参、前端匹配、动态点\n局部子地图清晰但全局互相错位   -&gt; 查累计漂移、长廊退化、假回环、权重、后端<\/code><\/pre>\n<p>再依次看原始单帧、去畸变后单帧、单个子地图、回环前后轨迹。（见 7.3.1、7.3.3、7.3.7）<\/p>\n<p><strong>3. 四种现象分别查什么？<\/strong><\/p>\n<pre class=\"code\"><code>原地旋转固定双墙       -&gt; 时间偏移、雷达外参、杆臂\n地面多个高度层         -&gt; 重力初始化、IMU 偏置、旋转外参\n轨迹正确但旧墙仍在     -&gt; 地图没有根据优化位姿重建\n静止时完整复制         -&gt; 重复 TF、重复数据源、重复插图<\/code><\/pre>\n<p>另外，速度越快、转弯越明显越严重，优先查时间同步和去畸变；加回环后突然折叠，查假回环、变换方向和回环权重。（见 7.3.3）<\/p>\n<p><strong>4. 逐点去畸变与误差量级。<\/strong><\/p>\n<pre class=\"code\"><code>p_ref = T_world_lidar_hat(t_ref)^-1 * T_world_lidar_hat(t_i) * p_i<\/code><\/pre>\n<p>先把 <code>t_i<\/code> 时刻的点变到 world，再从 world 变到参考时刻的 lidar。用的是估计位姿，轨迹误差、长时间外推和 IMU bias 也会残留误差。<\/p>\n<p>量级：扫描首尾相差 <code>1 rad/s * 0.1 s = 0.1 rad<\/code>，10 m 外的点弧长误差约 <code>0.1 * 10 = 1 m<\/code>，所以旋转时远处点最明显。<\/p>\n<p>常见坑：帧时间戳代表开始、中间还是结束；单点时间单位是秒、毫秒、微秒还是纳秒；雷达、IMU、轮速是否同一时基；IMU 是否完整覆盖整帧；查的是点采样时刻的 TF 而不是“最新 TF”。（见 7.3.4）<\/p>\n<p><strong>5. 外参错还是时间偏移？<\/strong><\/p>\n<p>判断规则：固定姿态下总有相同偏差，更像外参；误差随速度或角速度增长，更像时间问题。还要确认变换方向：<code>T_base_lidar<\/code> 把 lidar 点变到 base，<code>T_lidar_base<\/code> 是它的逆，不能混用。控制实验：<\/p>\n<pre class=\"code\"><code>1. 静止采集：排除传感器噪声、重复发布、静态外参问题\n2. 慢速直行：看平移比例和固定偏差\n3. 原地旋转：最容易暴露时间偏移、旋转外参和杆臂\n4. 正反方向看同一面墙：看系统性偏移是否随运动方向改变<\/code><\/pre>\n<p>（见 7.3.5）<\/p>\n<p><strong>6. 回环为什么会拉坏地图？怎样验证？<\/strong><\/p>\n<p>回环告诉后端“相距很远的两段轨迹在同一地点”，连接范围大，错了影响也大；相似走廊、货架、楼层容易产生假回环。至少验证：几何重叠率和匹配点空间覆盖；法向分布和 Hessian 是否退化；相对变换与里程计是否大致相容；楼层、拓扑、行驶距离是否合理；第一候选是否显著好于第二候选；连续多帧是否支持同一回环。<\/p>\n<p>追问：需要。鲁棒核只能减弱离群因子的影响，不能代替验证；退化回环还要用方向相关的信息矩阵，不能六自由度填同样大的权重。（见 7.3.6）<\/p>\n<p><strong>7. 融合点云能否自动拆层？怎样避免？<\/strong><\/p>\n<p>通常不能可靠拆开：没有关键帧、原始点云和对应位姿，就不知道哪些点来自哪个错误位姿。修复根因后应从原始关键帧重新生成地图。可重建的数据结构比事后“擦除”更重要。预防四层：<\/p>\n<pre class=\"code\"><code>数据层：同步时间、标定外参、保留逐点时间\n前端层：退化检测、创新门控、低可信扫描拒绝入图\n后端层：回环多阶段验证、合理协方差、固定规范自由度\n地图层：保存关键帧与版本，优化后能重建<\/code><\/pre>\n<p>（见 7.3.7）<\/p>\n<p><strong>8. 为什么不能看到一次就改地图？<\/strong><\/p>\n<p>一次观测无法区分永久结构变化、临时车辆或行人遮挡、本帧定位错误、传感器漏检。稳妥做法是分层：静态先验层（更新很慢）、短期活动层（当前占据和动态障碍，更新很快）、变化证据层（累计“新增/消失”的多次观测）。只有跨时间、跨视角反复一致，且定位本身可信，才合并到静态层；保存地图版本和关键帧来源，便于审计、回滚和重建。（见 7.3.8）<\/p>\n<hr><\/section>", "sections": [{"id": "7.3.1", "title": "一句话回答"}, {"id": "7.3.2", "title": "错层是怎样形成的？"}, {"id": "7.3.3", "title": "根据现象快速定位"}, {"id": "7.3.4", "title": "为什么去畸变需要“逐点时刻”？"}, {"id": "7.3.5", "title": "外参和变换方向怎样排查？"}, {"id": "7.3.6", "title": "回环为什么会把地图拉坏？"}, {"id": "7.3.7", "title": "推荐诊断与修复流程"}, {"id": "7.3.8", "title": "地图在线更新为什么不能“看到一次就修改”？"}, {"id": "7.3.9", "title": "本章面试题与参考答案"}]}, {"num": "7.4", "title": "回环检测与位姿图优化", "html": "<section class=\"sec\" data-sec=\"7.4.0\"><div class=\"callout tip\"><strong>为什么现在学这一章<\/strong>：错层的最大来源之一是回环。这一章补全回环检测的完整流程（检索、几何验证、一致性检验），对比 VINS-Mono、ORB-SLAM、LIO-SAM 的做法，并回答“优化的是位姿还是三维点”“误差怎样分摊到环上”。<\/div>\n<p>第 4.2.3、4.2.4 节手算过一个最小的回环位姿图，第 7.3.6 节讨论过回环为什么会把地图拉坏。本章补全回环检测的完整流程，并回答三个常被追问的问题：VIO/LIO 中有哪些回环方法，回环后优化的是关键帧位姿还是三维点，PGO 怎样把误差分摊到环上的节点。<\/p><\/section>\n<section class=\"sec\" data-sec=\"7.4.1\"><h3 id=\"s7.4.1\"><span class=\"num\">7.4.1<\/span> 一句话回答<\/h3>\n<p>回环 = 候选检索（可能来过）+ 几何验证（确实来过，相对位姿是多少）+ 一致性检验（不是偶然的假阳性）。回环后通常先做位姿图优化（PGO），只优化关键帧位姿；三维点或点云挂在参考关键帧上，随关键帧刚性更新；需要更高精度时，再以 PGO 结果为初值做全局 BA，同时优化位姿和三维点。<\/p><\/section>\n<section class=\"sec\" data-sec=\"7.4.2\"><h3 id=\"s7.4.2\"><span class=\"num\">7.4.2<\/span> 回环检测的三段式<\/h3>\n<pre class=\"code\"><code>候选检索 (Place Recognition)\n  -&gt; 几何验证 (Geometric Verification)\n  -&gt; 一致性检验\n  -&gt; 加入后端，作为回环因子<\/code><\/pre><\/section>\n<section class=\"sec\" data-sec=\"7.4.3\"><h3 id=\"s7.4.3\"><span class=\"num\">7.4.3<\/span> 候选检索有哪些方法？<\/h3>\n<div class=\"tbl\"><table><thead><tr><th>类别<\/th><th>方法<\/th><th>要点<\/th><\/tr><\/thead><tbody><tr><td>视觉词袋<\/td><td>DBoW2/DBoW3（ORB-SLAM、VINS-Mono）<\/td><td>离线训练词典树，图像变成 BoW 向量，TF-IDF 加权，倒排索引检索<\/td><\/tr><tr><td>视觉学习型<\/td><td>NetVLAD 等全局描述子<\/td><td>对光照、季节更鲁棒<\/td><\/tr><tr><td>激光距离法<\/td><td>LIO-SAM<\/td><td>在关键帧位置的 KD 树中搜半径 R 内、时间间隔足够大的历史帧；要求里程计漂移小于 R<\/td><\/tr><tr><td>激光描述子<\/td><td>Scan Context、SC++、M2DP、STD、BEVPlace、OverlapTransformer<\/td><td>Scan Context 用极坐标 bin 存最大高度，列平移匹配同时给出 yaw 初值<\/td><\/tr><\/tbody><\/table><\/div><\/section>\n<section class=\"sec\" data-sec=\"7.4.4\"><h3 id=\"s7.4.4\"><span class=\"num\">7.4.4<\/span> 几何验证和一致性检验做什么？<\/h3>\n<p><strong>几何验证<\/strong>：<\/p>\n<ul><li>视觉：特征匹配 + RANSAC，单目解 Sim3，双目或 RGB-D 解 SE3 或 PnP，要求内点数达标且内点在图像上分布开；<\/li><li>激光：用候选给的初值做 ICP/GICP，检查 fitness、重叠率和是否收敛；初值误差大时先用 FPFH + TEASER++ 等全局配准。<\/li><\/ul>\n<p><strong>一致性检验<\/strong>：<\/p>\n<ul><li>时间一致性：连续多帧都指向同一地点才接受；<\/li><li>共视一致性：ORB-SLAM 要求连续 3 个关键帧检测到与同一共视组一致的回环；<\/li><li>集合一致性：多条回环之间两两相容（见 8.3.2 节的 PCM）；<\/li><li>第 7.3.6 节列出的重叠率、Hessian 退化、楼层和行驶距离检查同样适用。<\/li><\/ul><\/section>\n<section class=\"sec\" data-sec=\"7.4.5\"><h3 id=\"s7.4.5\"><span class=\"num\">7.4.5<\/span> VINS-Mono 的回环怎样做？<\/h3>\n<pre class=\"code\"><code>每个关键帧额外提取约 500 个 FAST 角点 + BRIEF 描述子\n（与前端 KLT 跟踪点分开），存入 DBoW2 数据库\n  -&gt; 检索候选\n  -&gt; BRIEF 匹配 + 基础矩阵 RANSAC 剔除外点\n  -&gt; PnP RANSAC，内点数超过阈值才接受\n  -&gt; 重定位：回环帧作为固定位姿，匹配点作为额外视觉约束加入滑窗，立即修正当前窗口\n  -&gt; 4 自由度 PGO：只优化 x、y、z、yaw<\/code><\/pre>\n<p>为什么只优化 4 个自由度：VIO 中 roll、pitch 由重力可观，不会漂移；漂移只发生在x、y、z 和 yaw 上。<\/p><\/section>\n<section class=\"sec\" data-sec=\"7.4.6\"><h3 id=\"s7.4.6\"><span class=\"num\">7.4.6<\/span> ORB-SLAM 的回环怎样做？<\/h3>\n<pre class=\"code\"><code>DBoW2 检索 + 共视一致性检验\n  -&gt; 单目解 Sim3（同时校正尺度漂移）；双目、RGB-D、VI 下解 SE3\n  -&gt; 回环融合：融合回环两端的重复地图点，更新共视图\n               用 Sim3 校正当前关键帧及其共视邻域的位姿和地图点\n  -&gt; Essential Graph 优化：在“生成树 + 强共视边 + 回环边”组成的稀疏图上做 PGO\n  -&gt; 独立线程做全局 BA：优化所有关键帧位姿和所有地图点\n     完成后把校正传播给 GBA 期间新插入的关键帧<\/code><\/pre>\n<p>ORB-SLAM3 改进了检测（先找候选，再用共视帧验证，召回率更高），并支持多地图 Atlas的地图合并。<\/p><\/section>\n<section class=\"sec\" data-sec=\"7.4.7\"><h3 id=\"s7.4.7\"><span class=\"num\">7.4.7<\/span> LIO 系统的回环怎样做？<\/h3>\n<p>LIO-SAM、FAST-LIO-SAM、SC-LIO-SAM 等的后端结构基本一致：<\/p>\n<pre class=\"code\"><code>前端 LIO 输出关键帧位姿和点云\n后端 GTSAM 因子图：\n  里程计 BetweenFactor + GPS 因子 + 回环 BetweenFactor\n  iSAM2 增量求解\n回环：半径搜索或 Scan Context -&gt; ICP 验证（fitness 小于阈值）-&gt; 加入回环因子\n优化后：用新位姿重新拼接所有关键帧点云，得到全局地图<\/code><\/pre>\n<p>LIO-SAM 中 iSAM2 的位置见 5.2.15、5.2.16 节。<\/p><\/section>\n<section class=\"sec\" data-sec=\"7.4.8\"><h3 id=\"s7.4.8\"><span class=\"num\">7.4.8<\/span> 回环后优化了哪些变量？<\/h3>\n<div class=\"tbl\"><table><thead><tr><th>优化层级<\/th><th>优化变量<\/th><th>不优化<\/th><th>代表<\/th><\/tr><\/thead><tbody><tr><td>位姿图优化 PGO<\/td><td>只有关键帧位姿（SE3、Sim3 或 4 自由度）<\/td><td>三维点<\/td><td>VINS 回环、ORB Essential Graph、LIO-SAM<\/td><\/tr><tr><td>全局 BA<\/td><td>关键帧位姿 + 全部三维地图点<\/td><td>无<\/td><td>ORB-SLAM GBA<\/td><\/tr><tr><td>局部 BA 或滑窗<\/td><td>窗口内位姿（及速度、bias）+ 窗口内观测到的点<\/td><td>窗口外变量<\/td><td>ORB Local BA、VINS 滑窗<\/td><\/tr><\/tbody><\/table><\/div>\n<p>回环后为什么通常先做 PGO 而不是直接做 BA：<\/p>\n<ul><li><strong>规模<\/strong>：BA 的变量里三维点占绝大多数（几十万点对几千关键帧），回环需要快速响应；<\/li><li><strong>初值<\/strong>：刚检测到回环时，环上累积误差可能有几米，重投影误差在大误差下高度非线性，BA 容易陷入局部最优；PGO 残差定义在 SE3 上，非线性更温和，先把“骨架”拉回来；<\/li><li><strong>三维点怎么办<\/strong>：每个地图点挂在一个参考关键帧上，PGO 后随参考关键帧刚性变换：<\/li><\/ul>\n<pre class=\"code\"><code>p_w_new = T_w_k_new * inverse(T_w_k_old) * p_w_old<\/code><\/pre>\n<p>激光点云同理：挂在关键帧上，优化后重新拼接。<\/p>\n<ul><li>需要最高精度时，再以 PGO 结果为初值做全局 BA（ORB-SLAM 的做法）。<\/li><\/ul><\/section>\n<section class=\"sec\" data-sec=\"7.4.9\"><h3 id=\"s7.4.9\"><span class=\"num\">7.4.9<\/span> PGO 怎样优化环上的节点？<\/h3>\n<p><strong>建模<\/strong>：节点 <code>T_i<\/code> 属于 <code>SE(3)<\/code>，边是相对位姿测量 <code>T_ij_meas<\/code>（里程计边连相邻节点，回环边连远处节点），信息矩阵 <code>Omega_ij<\/code>。残差定义在李代数上（<code>Log<\/code> 的含义见 3.5.4 节）：<\/p>\n<pre class=\"code\"><code>e_ij = Log( inverse(T_ij_meas) * inverse(T_i) * T_j )      6 维\n\nF = Σ_(i,j) e_ij^T * Omega_ij * e_ij<\/code><\/pre>\n<p><strong>求解<\/strong>：按 <code>T_i &lt;- T_i * Exp(delta_xi_i)<\/code> 做 GN 或 LM：<\/p>\n<ul><li>每条边只与两个节点有关，<code>J_ij<\/code> 只有两个 6 × 6 非零块（误差小时近似为<code>-Adj(inverse(T_j)*T_i)<\/code> 和 <code>I<\/code>，严格形式还要乘右雅可比的逆）；<\/li><li><code>H = Σ J^T*Omega*J<\/code> 是块稀疏的，稀疏结构与图的邻接结构一致（逐因子累加见 4.2.5.1 节）；<\/li><li>整个图可以整体做刚体变换而代价不变，必须固定第一个节点或加先验（见 3.4.2.8 第 9 步）；<\/li><li>用稀疏 Cholesky 配合 AMD/COLAMD 重排序求解。<\/li><\/ul>\n<p><strong>误差是怎样分摊到环上的<\/strong>：里程计链累积了漂移，回环边说“<code>T_n<\/code> 其实离 <code>T_0<\/code> 很近”。优化结果是把闭合误差按各条边的不确定度沿环分摊：协方差大的边（快速转弯、退化段）吸收更多修正，协方差小的边几乎不动；若所有边权重相同，就近似均匀分配。第 4.2.4 节的一维手算例子正是这个结论的最简形式。<\/p>\n<p>这也说明协方差设置很关键：如果一条错误回环的信息矩阵设得很大，整张地图会被它拉坏（见 7.3.6 节和 8.3.2 节）。<\/p>\n<p><strong>两个变体<\/strong>：<\/p>\n<ul><li>单目：节点为 <code>Sim(3)<\/code>，残差 7 维，同时校正尺度漂移；<\/li><li>VIO：节点只取 <code>(x, y, z, yaw)<\/code>，roll、pitch 用 VIO 估计值固定，残差 4 维。<\/li><\/ul><\/section>\n<section class=\"sec\" data-sec=\"7.4.10\"><h3 id=\"s7.4.10\"><span class=\"num\">7.4.10<\/span> 本章面试题与参考答案<\/h3>\n<p>先自己作答，再对照答案；答案后括号注明对应小节。<\/p>\n<h4>题目<\/h4>\n<ol><li value=\"1\">回环检测分哪几步？每一步解决什么问题？<\/li><li value=\"2\">列举视觉和激光中常用的回环候选检索方法，并说明 LIO-SAM 半径搜索的前提。<\/li><li value=\"3\">VINS-Mono 的回环为什么只做 4 自由度 PGO？ORB-SLAM 单目回环为什么要解 Sim3？<\/li><li value=\"4\">回环后优化的是关键帧位姿，还是三维点？为什么通常先做 PGO？三维点怎样更新？<\/li><li value=\"5\">写出 PGO 的残差和目标函数。闭合误差是怎样分摊到环上各节点的？<\/li><\/ol>\n<h4>参考答案<\/h4>\n<p><strong>1. 三段式<\/strong><\/p>\n<p>候选检索回答“可能来过”；几何验证回答“确实来过，相对位姿是多少”；一致性检验排除偶然的假阳性。通过后才作为回环因子加入后端。（见 7.4.2 至 7.4.4）<\/p>\n<p><strong>2. 候选检索<\/strong><\/p>\n<p>视觉：DBoW2/DBoW3、NetVLAD 等；激光：半径搜索、Scan Context、M2DP、STD、BEVPlace等。半径搜索要求里程计漂移小于搜索半径，否则真回环根本不会成为候选。（见 7.4.3）<\/p>\n<p><strong>3. 4 自由度与 Sim3<\/strong><\/p>\n<p>VIO 中 roll、pitch 由重力可观，不漂移，所以只优化 x、y、z、yaw。单目存在尺度漂移，回环必须同时校正尺度，所以解 Sim3。（见 7.4.5、7.4.6）<\/p>\n<p><strong>4. 优化变量<\/strong><\/p>\n<p>PGO 只优化关键帧位姿；全局 BA 同时优化位姿和三维点。先做 PGO 是因为规模小、响应快，且 SE3 残差在大误差下比重投影误差更容易收敛。三维点挂在参考关键帧上，按 <code>T_w_k_new * inverse(T_w_k_old)<\/code> 刚性更新。（见 7.4.8）<\/p>\n<p><strong>5. PGO<\/strong><\/p>\n<p><code>e_ij = Log(inverse(T_ij_meas)*inverse(T_i)*T_j)<\/code>，<code>F = Σ e^T*Omega*e<\/code>。闭合误差按各边不确定度分摊，协方差大的边吸收更多修正。需要固定第一个节点消除规范自由度。（见 7.4.9、4.2.4）<\/p><\/section>", "sections": [{"id": "7.4.1", "title": "一句话回答"}, {"id": "7.4.2", "title": "回环检测的三段式"}, {"id": "7.4.3", "title": "候选检索有哪些方法？"}, {"id": "7.4.4", "title": "几何验证和一致性检验做什么？"}, {"id": "7.4.5", "title": "VINS-Mono 的回环怎样做？"}, {"id": "7.4.6", "title": "ORB-SLAM 的回环怎样做？"}, {"id": "7.4.7", "title": "LIO 系统的回环怎样做？"}, {"id": "7.4.8", "title": "回环后优化了哪些变量？"}, {"id": "7.4.9", "title": "PGO 怎样优化环上的节点？"}, {"id": "7.4.10", "title": "本章面试题与参考答案"}]}, {"num": "7.5", "title": "ROS 2 中的 SLAM 工程问题", "html": "<section class=\"sec\" data-sec=\"7.5.0\"><div class=\"callout tip\"><strong>为什么现在学这一章<\/strong>：算法正确不等于系统正确。本章从数据进入 ROS 2 讲到 Nav2 使用：接口选择、QoS、时间戳、TF2、同步、Executor、Lifecycle、参数、rosbag2，以及一套分层排查顺序。<\/div>\n<p>本仓库主要使用 ROS 2 Humble，所以本章以 Humble 可用的概念和命令为主。节点、QoS、TF2、时间戳、Executor 和生命周期等原理在后续 ROS 2 版本中也基本通用，但具体 API 仍应查当前发行版文档。<\/p><\/section>\n<section class=\"sec\" data-sec=\"7.5.1\"><h3 id=\"s7.5.1\"><span class=\"num\">7.5.1<\/span> Node、Topic、Service、Action 和 Parameter 怎样选？<\/h3>\n<p>ROS 2 把系统分成多个节点，每个节点尽量只承担一类清晰职责。通信接口的选择可以先看数据流形态：<\/p>\n<pre class=\"code\"><code>Topic\n  连续发布的数据流，发布者不等待某个订阅者回复\n  例如 PointCloud2、Imu、Odometry、TF\n\nService\n  一次请求对应一次快速回复\n  例如清除局部地图、查询状态\n\nAction\n  可持续一段时间，需要反馈、取消和最终结果的任务\n  例如 NavigateToPose\n\nParameter\n  节点配置，不是高频数据通道\n  例如体素大小、噪声参数、frame 名称<\/code><\/pre>\n<p>不要用 Service 执行几十秒才完成且需要取消的导航任务；也不要把高频 IMU 数据做成 Service。ROS 2 对三种通信接口的正式语义见<a href=\"https://docs.ros.org/en/humble/Concepts/Basic/Interfaces-Topics-Services-Actions.html\" target=\"_blank\" rel=\"noopener\">Topics、Services 和 Actions<\/a>。<\/p><\/section>\n<section class=\"sec\" data-sec=\"7.5.2\"><h3 id=\"s7.5.2\"><span class=\"num\">7.5.2<\/span> ROS 2 包为什么编译成功却 <code>ros2 run<\/code> 找不到？<\/h3>\n<p>一个 C++ ROS 2 包至少要把四层连起来：<\/p>\n<pre class=\"code\"><code>package.xml\n  声明包名、构建工具和依赖\n\nCMakeLists.txt\n  生成可执行文件或库，声明依赖并配置 install\n\ncolcon build\n  把结果放到 install 空间\n\nsource install/setup.bash\n  把新的 install 空间叠加到当前 shell 环境<\/code><\/pre>\n<p>常用流程：<\/p>\n<pre class=\"code\"><code>source /opt/ros/humble/setup.bash\ncd workspace_root\ncolcon build --symlink-install --packages-select my_package\nsource install/setup.bash\nros2 pkg prefix my_package\nros2 run my_package my_executable<\/code><\/pre>\n<p>常见原因有：<\/p>\n<ul><li><code>CMakeLists.txt<\/code> 生成了目标却没有 <code>install(TARGETS ...)<\/code>；<\/li><li>编译后没有重新 source；<\/li><li>source 了另一个工作空间；<\/li><li>overlay 顺序错误，旧包覆盖了新包；<\/li><li>包名、可执行名和节点名被当成同一个名字。<\/li><\/ul>\n<p><code>ros2 pkg prefix<\/code> 能直接告诉当前 shell 实际找到的是哪个 install 空间。<\/p><\/section>\n<section class=\"sec\" data-sec=\"7.5.3\"><h3 id=\"s7.5.3\"><span class=\"num\">7.5.3<\/span> QoS 是“通信策略”，不是简单的队列长度<\/h3>\n<p>ROS 2 基于 DDS 通信，发布者和订阅者不只要 topic 名称和消息类型相同，QoS 还必须兼容。最常见的策略是：<\/p>\n<pre class=\"code\"><code>reliability\n  best_effort   尽快送最新数据，允许丢包\n  reliable      尝试保证交付，必要时重传\n\ndurability\n  volatile        新订阅者只收到连接后的新消息\n  transient_local 发布者为后加入的订阅者保留历史样本\n\nhistory and depth\n  keep_last N   最多保留最近 N 条\n  keep_all      尽可能保留，仍受中间件资源限制<\/code><\/pre>\n<p>常见选择：<\/p>\n<pre class=\"code\"><code>高频激光和 IMU       SensorDataQoS，常用 best_effort、volatile、小队列\n速度指令和状态        通常 reliable、volatile\n静态地图或需要晚加入可见的配置   reliable、transient_local<\/code><\/pre>\n<p>一个关键兼容性问题是：<\/p>\n<pre class=\"code\"><code>publisher  = best_effort\nsubscriber = reliable<\/code><\/pre>\n<p>这组配置不兼容，可能 topic 名称存在但订阅者始终收不到数据。先用：<\/p>\n<pre class=\"code\"><code>ros2 topic info /points --verbose<\/code><\/pre>\n<p>查看发布与订阅的 QoS，不要只反复改 <code>depth<\/code>。官方定义和兼容表见<a href=\"https://docs.ros.org/en/humble/Concepts/Intermediate/About-Quality-of-Service-Settings.html\" target=\"_blank\" rel=\"noopener\">ROS 2 Humble QoS 文档<\/a>。<\/p><\/section>\n<section class=\"sec\" data-sec=\"7.5.4\"><h3 id=\"s7.5.4\"><span class=\"num\">7.5.4<\/span> 时间戳为什么比回调到达时间更重要？<\/h3>\n<p>传感器消息通常有：<\/p>\n<pre class=\"code\"><code>header.stamp<\/code><\/pre>\n<p>它应尽量表示数据被采样的时刻，而不是 ROS 2 回调开始执行的时刻。两者之间可能包含：<\/p>\n<pre class=\"code\"><code>传感器内部缓冲\n+ 驱动传输\n+ DDS 排队\n+ Executor 等待\n+ 操作系统调度<\/code><\/pre>\n<p>若用到达时间代替采样时间，LiDAR 与 IMU 的时间差会随计算负载抖动，去畸变和融合会出现系统性误差。<\/p>\n<p>还要区分：<\/p>\n<pre class=\"code\"><code>system time  操作系统时间\nsteady time  单调时间，适合计算耗时\nROS time     可由 /clock 驱动，适合仿真和 bag 回放<\/code><\/pre>\n<p>使用 <code>use_sim_time=true<\/code> 时，相互交互的节点应使用一致时钟。一部分节点使用仿真时间、另一部分使用系统时间，常会导致 TF 查询跨越巨大时间差。<\/p><\/section>\n<section class=\"sec\" data-sec=\"7.5.5\"><h3 id=\"s7.5.5\"><span class=\"num\">7.5.5<\/span> TF2 树不只是给 RViz 显示的<\/h3>\n<p>移动机器人常见 TF 主链为：<\/p>\n<pre class=\"code\"><code>map -&gt; odom -&gt; base_link -&gt; lidar\n                         -&gt; imu\n                         -&gt; camera<\/code><\/pre>\n<p>各边职责通常是：<\/p>\n<pre class=\"code\"><code>map -&gt; odom\n  全局定位或 SLAM 发布的慢校正，可因重定位或回环发生跳变\n\nodom -&gt; base_link\n  轮速、VIO 或 LIO 等发布的局部连续里程计\n\nbase_link -&gt; sensor\n  传感器安装外参，通常是静态变换<\/code><\/pre>\n<p>同一条动态 TF 边应只有一个权威发布者。若 LIO 和轮速融合器同时发布 <code>odom -&gt; base_link<\/code>，下游看到的位姿可能在两个来源之间来回跳。<\/p>\n<p>LiDAR、IMU 和相机相对机体的固定安装外参应使用静态变换发布器写入 <code>/tf_static<\/code>；随时间变化的机器人位姿才发布到 <code>/tf<\/code>。不要以高频率反复发布不变的传感器外参。<\/p>\n<p>TF2 查询：<\/p>\n<pre class=\"code\"><code>lookupTransform(target_frame, source_frame, time)<\/code><\/pre>\n<p>返回的是：<\/p>\n<pre class=\"code\"><code>T_target_source<\/code><\/pre>\n<p>也就是把 <code>source_frame<\/code> 中的数据变到 <code>target_frame<\/code>。处理一帧点云时，应尽量查询点云<code>header.stamp<\/code> 对应时刻的变换，而不是无条件查“最新 TF”。<\/p>\n<p>常见异常：<\/p>\n<pre class=\"code\"><code>LookupException       frame 不存在或名字错\nConnectivityException 两个 frame 之间没有连通路径\nExtrapolationException 请求时刻早于缓存或晚于最新 TF<\/code><\/pre>\n<p>正确思路是检查 frame 树、时钟、时间戳和 TF 发布延迟，不是一遇到异常就把查询时间改成 0。官方 TF2 教程见 <a href=\"https://docs.ros.org/en/humble/Tutorials/Intermediate/Tf2/Tf2-Main.html\" target=\"_blank\" rel=\"noopener\">ROS 2 Humble TF2<\/a>。<\/p><\/section>\n<section class=\"sec\" data-sec=\"7.5.6\"><h3 id=\"s7.5.6\"><span class=\"num\">7.5.6<\/span> LiDAR、IMU、Camera 怎样同步？<\/h3>\n<p>同步先分硬件层和软件层。<\/p>\n<pre class=\"code\"><code>硬件同步\n  PPS、触发线、共享时钟、PTP 等\n  目标是让传感器采样时刻本身位于同一时间基准\n\n软件同步\n  根据 header.stamp 从缓存中选取时间最接近的消息\n  它能配对，但无法消除不稳定的硬件时钟漂移<\/code><\/pre>\n<p><code>message_filters<\/code> 常用两类策略：<\/p>\n<pre class=\"code\"><code>ExactTime\n  时间戳严格相等才触发回调\n\nApproximateTime\n  在允许的时间窗内选择接近消息<\/code><\/pre>\n<p>时间窗过小会经常配不上，过大会把时间差很大的数据当成同时观测。队列过小会丢掉候选消息，过大则增加延迟和内存。各订阅者的 QoS 还要与数据源兼容。官方 API 和教程见<a href=\"https://docs.ros.org/en/ros2_packages/humble/api/message_filters/generated/index.html\" target=\"_blank\" rel=\"noopener\">ROS 2 Humble message_filters<\/a>。<\/p>\n<p>LIO 不应为每条 IMU 强行寻找一帧同时激光。更常见的做法是：<\/p>\n<pre class=\"code\"><code>1. 按时间戳缓存高频 IMU\n2. 一帧 LiDAR 完整后确定起止时间\n3. 取出覆盖该时间段的 IMU\n4. 进行积分、传播和逐点去畸变<\/code><\/pre><\/section>\n<section class=\"sec\" data-sec=\"7.5.7\"><h3 id=\"s7.5.7\"><span class=\"num\">7.5.7<\/span> Executor 和 Callback Group 为什么会影响 SLAM？<\/h3>\n<p>Executor 负责调度 topic、timer、service 和 action 回调。<\/p>\n<pre class=\"code\"><code>SingleThreadedExecutor\n  同一时刻只执行一个回调\n\nMultiThreadedExecutor\n  使用多个线程处理允许并行的回调<\/code><\/pre>\n<p>如果在单线程 Executor 的点云回调中进行 100 ms 优化，这 100 ms 内 IMU 回调、诊断定时器和服务回调都可能无法执行。结果是数据积压，但算法日志可能只显示“输入时好时坏”。<\/p>\n<p>Callback Group 决定回调之间是否允许并行：<\/p>\n<pre class=\"code\"><code>MutuallyExclusive\n  同组回调不同时执行\n\nReentrant\n  同组回调允许并行，代码必须自己保证线程安全<\/code><\/pre>\n<p>工程上可以让传感器回调只完成快速检查和入有界队列，由工作线程执行重的点云匹配。不要在持锁期间进行长时间计算、同步服务等待或发布可能反向触发的回调。<\/p>\n<p>官方说明见 <a href=\"https://docs.ros.org/en/humble/Concepts/Intermediate/About-Executors.html\" target=\"_blank\" rel=\"noopener\">ROS 2 Executor 文档<\/a>。<\/p><\/section>\n<section class=\"sec\" data-sec=\"7.5.8\"><h3 id=\"s7.5.8\"><span class=\"num\">7.5.8<\/span> Lifecycle Node 为什么“节点在，却没数据”？<\/h3>\n<p>受管理节点不是进程启动后就立即正常工作。典型主状态有：<\/p>\n<pre class=\"code\"><code>unconfigured\ninactive\nactive\nfinalized<\/code><\/pre>\n<p>常见职责划分：<\/p>\n<pre class=\"code\"><code>configure\n  读参数、创建资源、验证配置\n\nactivate\n  开始处理任务和对外发布有效输出\n\ndeactivate\n  停止主要处理，但保留可再激活资源\n\ncleanup\n  释放 configure 阶段创建的资源<\/code><\/pre>\n<p>所以 <code>ros2 node list<\/code> 能看到节点，不代表节点已经 active。可以查询：<\/p>\n<pre class=\"code\"><code>ros2 lifecycle get /node_name<\/code><\/pre>\n<p>Nav2 使用 lifecycle manager 按依赖顺序配置和激活节点。若某节点 configure 失败，后续节点可能也不会激活。官方状态机设计见<a href=\"https://design.ros2.org/articles/node_lifecycle.html\" target=\"_blank\" rel=\"noopener\">ROS 2 Managed Nodes<\/a>。<\/p><\/section>\n<section class=\"sec\" data-sec=\"7.5.9\"><h3 id=\"s7.5.9\"><span class=\"num\">7.5.9<\/span> Parameter 为什么在 YAML 中写了却没生效？<\/h3>\n<p>ROS 2 参数属于具体节点，不是全局共享变量。YAML 中的节点名、namespace 和 <code>ros__parameters<\/code>层级必须与实际节点匹配。先查：<\/p>\n<pre class=\"code\"><code>ros2 node list\nros2 param list /node_name\nros2 param get /node_name parameter_name\nros2 param dump /node_name<\/code><\/pre>\n<p>常见原因：<\/p>\n<ul><li>YAML 顶层写的节点名与 launch 重命名后的名字不一致；<\/li><li>节点代码没有声明该参数；<\/li><li>类型不一致，例如期望 double 却写成 integer；<\/li><li>launch 中后传入的参数覆盖了前面 YAML；<\/li><li>当前 shell 启动的是另一个 overlay 中的旧节点。<\/li><\/ul>\n<p>对外参、时间偏移和噪声等关键参数，节点应验证长度、范围、矩阵合法性和动态修改安全性，而不是收到任意值都直接生效。官方说明见<a href=\"https://docs.ros.org/en/humble/Concepts/Basic/About-Parameters.html\" target=\"_blank\" rel=\"noopener\">ROS 2 Humble Parameters<\/a>。<\/p><\/section>\n<section class=\"sec\" data-sec=\"7.5.10\"><h3 id=\"s7.5.10\"><span class=\"num\">7.5.10<\/span> rosbag2 为什么不是“录了点云就够了”？<\/h3>\n<p>一份能复现 SLAM 问题的 bag 至少要考虑：<\/p>\n<pre class=\"code\"><code>原始 LiDAR\n原始 IMU\n轮速或底盘里程计\n/tf\n/tf_static\n必要的 GNSS、相机和状态 topic\n使用仿真时间时的 /clock 策略\n与数据对应的参数、外参、版本和提交号<\/code><\/pre>\n<p>录制后先查：<\/p>\n<pre class=\"code\"><code>ros2 bag info bag_directory<\/code><\/pre>\n<p>再用低速回放验证时间戳、TF 和数据数量，不要等到现场数据被覆盖后才发现 IMU 没录到。<\/p>\n<p>rosbag2 录制和回放也受 QoS 兼容性影响。必要时可通过 YAML 覆盖指定 topic 的 reliability、durability 和 history。官方入口见<a href=\"https://docs.ros.org/en/humble/Tutorials/Ros2bag/\" target=\"_blank\" rel=\"noopener\">ROS 2 Humble rosbag2 教程<\/a>。<\/p><\/section>\n<section class=\"sec\" data-sec=\"7.5.11\"><h3 id=\"s7.5.11\"><span class=\"num\">7.5.11<\/span> Composition 和进程内通信一定更好吗？<\/h3>\n<p>将驱动、预处理和 SLAM 组件放进同一进程，配合 intra-process communication，可减少大型点云和图像的序列化与拷贝。但代价是：<\/p>\n<ul><li>一个组件崩溃可能让整个进程退出；<\/li><li>线程安全和 Callback Group 配置更复杂；<\/li><li>分析内存所有权和消息生命周期更重要；<\/li><li>多进程方式的故障隔离和独立重启更简单。<\/li><\/ul>\n<p>所以应用点云拷贝数、端到端延迟、CPU、内存和故障恢复时间做对比，不能只因为“同进程更快”就把所有节点放进一个 container。官方示例见<a href=\"https://docs.ros.org/en/humble/Tutorials/Demos/Intra-Process-Communication.html\" target=\"_blank\" rel=\"noopener\">ROS 2 Humble 进程内通信<\/a>。<\/p><\/section>\n<section class=\"sec\" data-sec=\"7.5.12\"><h3 id=\"s7.5.12\"><span class=\"num\">7.5.12<\/span> SLAM 输出怎样接入 Nav2？<\/h3>\n<p>一条典型数据链是：<\/p>\n<pre class=\"code\"><code>LiDAR/IMU/wheel drivers\n  -&gt; timestamp and frame validation\n  -&gt; synchronization and LiDAR deskew\n  -&gt; LIO or local odometry\n  -&gt; odom -&gt; base_link\n  -&gt; mapping or localization\n  -&gt; map -&gt; odom\n  -&gt; local/global costmaps\n  -&gt; planner and controller\n  -&gt; cmd_vel<\/code><\/pre>\n<p>需要维持两个不同性质：<\/p>\n<pre class=\"code\"><code>odom 坐标系\n  短时连续，适合局部控制\n  允许长期缓慢漂移\n\nmap 坐标系\n  与全局地图一致\n  重定位或回环时可相对 odom 修正<\/code><\/pre>\n<p>若把回环产生的全局跳变直接塞进 <code>odom -&gt; base_link<\/code>，局部控制器可能看到机器人瞬间跳位。常见做法是让局部里程计保持连续，由 <code>map -&gt; odom<\/code> 吸收全局修正。<\/p><\/section>\n<section class=\"sec\" data-sec=\"7.5.13\"><h3 id=\"s7.5.13\"><span class=\"num\">7.5.13<\/span> 一套从输入到输出的 ROS 2 排查顺序<\/h3>\n<p>遇到 SLAM 没输出、时好时坏或 Nav2 不动时，不要一开始就改优化参数。按下列顺序逐层检查：<\/p>\n<pre class=\"code\"><code>1. 进程和节点是否存活\n   ros2 node list\n   ros2 node info /node_name\n\n2. topic 名、类型、发布者和订阅者是否正确\n   ros2 topic list -t\n   ros2 topic info /topic --verbose\n\n3. 频率、带宽和数值是否正常\n   ros2 topic hz /topic\n   ros2 topic bw /topic\n   ros2 topic echo --once /topic\n\n4. QoS 是否兼容\n   重点看 reliability、durability、history 和 depth\n\n5. 时钟和 header.stamp 是否一致\n   计算采样时间、到达时间和回调时间的差\n\n6. TF 是否连通，请求时刻是否可用\n   ros2 run tf2_ros tf2_echo map base_link\n   ros2 run tf2_tools view_frames\n\n7. lifecycle 是否 active\n   ros2 lifecycle get /node_name\n\n8. 算法内部是否有有效匹配和健康估计\n   看有效点数、残差、NIS、退化指标和队列积压\n\n9. 输出是否使用正确 frame 和协方差\n\n10. Nav2 下游的 costmap、planner、controller 和 action 是否正常<\/code><\/pre>\n<p>这个顺序能先区分“数据没进来”、“数据时间不对”、“估计算法失败”和“下游导航没有使用输出”。<\/p><\/section>\n<section class=\"sec\" data-sec=\"7.5.14\"><h3 id=\"s7.5.14\"><span class=\"num\">7.5.14<\/span> 常见现象与根因<\/h3>\n<h4>现象一：topic 名存在，<code>echo<\/code> 没数据<\/h4>\n<p>优先检查：<\/p>\n<ul><li>发布者是否真在发布；<\/li><li>best-effort 发布者与 reliable 订阅者是否不兼容；<\/li><li>namespace 和 remap 后名称是否不同；<\/li><li>lifecycle 节点是否未 active；<\/li><li><code>ROS_DOMAIN_ID<\/code> 和 DDS 发现是否一致。<\/li><\/ul>\n<h4>现象二：TF extrapolation into the future<\/h4>\n<p>意味着请求的时刻比 TF buffer 中最新变换还晚。可能是：<\/p>\n<ul><li>传感器时钟走在 ROS 时钟前面；<\/li><li>TF 发布延迟过大；<\/li><li>一部分节点使用 <code>use_sim_time<\/code>，另一部分没有；<\/li><li>消息时间戳单位或 epoch 错误。<\/li><\/ul>\n<h4>现象三：真车在线正常，bag 回放异常<\/h4>\n<p>优先检查：<\/p>\n<ul><li>bag 是否真的录全了 IMU、TF 和静态外参；<\/li><li>回放的 QoS 是否与订阅者兼容；<\/li><li>算法使用消息时间还是 wall time；<\/li><li>回放倍速是否让回调队列积压；<\/li><li>参数、代码提交和现场版本是否一致。<\/li><\/ul>\n<h4>现象四：点云成扇形、墙变厚或转弯错层<\/h4>\n<p>优先检查：<\/p>\n<ul><li>逐点时间是否存在，单位是 s、ms、us 还是 ns；<\/li><li>LiDAR 扫描起止时间定义是否与去畸变代码一致；<\/li><li>IMU 与 LiDAR 时间偏移和外参方向是否正确；<\/li><li>该时刻 TF 是否存在，是否错用了最新 TF。<\/li><\/ul>\n<h4>现象五：位姿在两个值之间跳<\/h4>\n<p>优先使用 <code>ros2 topic info --verbose<\/code>、TF frame graph 和节点信息查看是否有两个发布者同时抢占同一Odometry topic 或同一 TF 边。然后再检查是否发生合法的 <code>map -&gt; odom<\/code> 全局校正。<\/p><\/section>\n<section class=\"sec\" data-sec=\"7.5.15\"><h3 id=\"s7.5.15\"><span class=\"num\">7.5.15<\/span> ROS 2 相关面试问题怎样回答？<\/h3>\n<p><strong>问：ROS 2 的 topic、service 和 action 最核心区别是什么？<\/strong><\/p>\n<p>答：topic 适合连续数据流；service 适合短时请求-回复；action 适合长时、可取消且需要进度反馈的任务。<\/p>\n<p><strong>问：为什么 topic 名称和类型都一样却收不到数据？<\/strong><\/p>\n<p>答：先查发布者是否正在发布，再查 QoS 兼容性、namespace/remap、lifecycle 状态、<code>ROS_DOMAIN_ID<\/code>和 DDS 发现。<\/p>\n<p><strong>问：为什么处理点云时要按消息时间查 TF？<\/strong><\/p>\n<p>答：机器人在运动，不同时刻的位姿不同。用最新 TF 处理过去点云，相当于把错误时刻的位姿应用到数据。<\/p>\n<p><strong>问：MultiThreadedExecutor 为什么不会自动让节点变快？<\/strong><\/p>\n<p>答：回调是否真能并行还由 Callback Group 决定；共享锁、单线程算法、内存带宽和数据依赖也可能是瓶颈。<\/p>\n<p><strong>问：<code>map -&gt; odom<\/code> 和 <code>odom -&gt; base_link<\/code> 为什么分开？<\/strong><\/p>\n<p>答：<code>odom -&gt; base_link<\/code> 保持短时连续供控制使用；<code>map -&gt; odom<\/code> 承担全局定位、重定位和回环校正。<\/p>\n<p><strong>问：怎样判断问题在 ROS 2 通信还是在 SLAM 算法？<\/strong><\/p>\n<p>答：先检查 topic 数据数量、频率、QoS、时间戳、TF 和队列积压。只有输入数据在时间和坐标系上都可信，才继续检查数据关联、残差、雅可比、噪声和退化。<\/p><\/section>\n<section class=\"sec\" data-sec=\"7.5.16\"><h3 id=\"s7.5.16\"><span class=\"num\">7.5.16<\/span> 一个可执行的 ROS 2 SLAM 练习顺序<\/h3>\n<pre class=\"code\"><code>第一步\n  自己写一个节点发布和订阅带 header.stamp 的消息\n\n第二步\n  改变 reliability 和 durability，用 topic info --verbose 观察兼容与不兼容\n\n第三步\n  建立 map -&gt; odom -&gt; base_link -&gt; lidar 变换链，按历史时刻查询 TF\n\n第四步\n  用 message_filters 对两个低频 topic 做精确和近似同步\n\n第五步\n  分别用单线程和多线程 Executor 运行一个故意耗时的回调，记录其他回调延迟\n\n第六步\n  录制 LiDAR、IMU、TF 和参数版本，在空工作空间中完整回放复现\n\n第七步\n  把 LIO 输出拆成连续 odom 和全局 map 校正，检查 Nav2 在重定位前后的行为<\/code><\/pre>\n<p>做完这些小实验，再去读一个大型 SLAM 或 Nav2 系统，就能把“算法问题”和“ROS 2 数据管道问题”分开诊断。<\/p><\/section>\n<section class=\"sec\" data-sec=\"7.5.17\"><h3 id=\"s7.5.17\"><span class=\"num\">7.5.17<\/span> 本章面试题与参考答案<\/h3>\n<p>（先自己作答，再对照答案；答案后括号注明对应小节。14.15 已回答过的基础问题这里不再重复，本节偏重排查和工程判断。）<\/p>\n<h4>题目<\/h4>\n<ol><li value=\"1\">同事说“清除局部地图”“查询 SLAM 状态”“导航到某个位姿”“修改体素大小”都用 Service 做，你会怎样纠正？<\/li><li value=\"2\"><code>colcon build<\/code> 成功了，<code>ros2 run<\/code> 却说找不到可执行文件，或者跑起来还是旧代码。你按什么思路排查？<\/li><li value=\"3\">静态地图 topic 在 RViz 晚打开时看不到，高频点云 topic 用 reliable 又经常积压。QoS 应该怎样选？只调 <code>depth<\/code> 为什么不解决问题？<\/li><li value=\"4\">为什么 <code>header.stamp<\/code> 要表示采样时刻而不是回调到达时刻？用到达时间会在 SLAM 里造成什么现象？<\/li><li value=\"5\">现场报 <code>ExtrapolationException<\/code>（extrapolation into the future），有人建议把查询时间改成 0。你怎么看？应该查什么？<\/li><li value=\"6\"><code>lookupTransform(target_frame, source_frame, time)<\/code> 返回的是哪个变换？LiDAR、IMU 外参应该发到哪里，为什么？<\/li><li value=\"7\">LIO 里是否应该用 <code>message_filters<\/code> 的 ApproximateTime 给每条 IMU 配一帧 LiDAR？正确的数据组织方式是什么？<\/li><li value=\"8\">单线程 Executor 下点云回调里做 100 ms 优化，会出什么问题？工程上怎样拆？<\/li><li value=\"9\">节点在 <code>ros2 node list<\/code> 里能看到，但没有任何输出；YAML 里改了参数但节点行为没变。分别怎样排查？<\/li><li value=\"10\">追问：真车在线正常，rosbag2 回放却建图异常。一份“能复现问题”的 bag 应该包含什么？回放异常先查哪些点？<\/li><li value=\"11\">Composition 加进程内通信能减少点云拷贝，是不是应该把驱动、预处理和 SLAM 全放进一个 container？<\/li><\/ol>\n<h4>参考答案<\/h4>\n<p><strong>1. Service 的误用<\/strong><\/p>\n<p>按数据流形态选接口：清除局部地图、查询状态是一次请求对应一次快速回复，用 Service 合适；导航到某个位姿要持续几十秒，需要反馈、取消和最终结果，应该用 Action（例如 <code>NavigateToPose<\/code>）；体素大小属于节点配置，应该用 Parameter，不是数据通道。反过来，高频 IMU、点云这类连续数据流用 Topic，发布者不等待订阅者回复，也不能做成 Service。（见 7.5.1）<\/p>\n<p><strong>2. 编译成功但 <code>ros2 run<\/code> 找不到<\/strong><\/p>\n<p>一个 C++ 包要把 <cod
