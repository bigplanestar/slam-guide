除它需要第二个地标、里程计或其他测量。多条测量怎样合在一起求解，第 2.3.1、2.4 节给出目标函数，第 3.1.4 节用两个地标把 Gauss-Newton 完整迭代一遍。<\/p>\n<p>多维状态时，普通导数 <code>h&#x27;(x_0)<\/code> 就换成上面这样的雅可比矩阵。下一小节专门区分观测函数、观测雅可比、残差和残差雅可比，避免后面把它们混在一起。<\/p><\/section>\n<section class=\"sec\" data-sec=\"3.1.2\"><h3 id=\"s3.1.2\"><span class=\"num\">3.1.2<\/span> <code>h(x)<\/code>、<code>H_obs<\/code>、<code>r(x)<\/code> 和 <code>J<\/code> 有什么区别？<\/h3>\n<p>先看观测模型：<\/p>\n<pre class=\"code\"><code>z = h(x) + v<\/code><\/pre>\n<p>四个量分别回答不同的问题：<\/p>\n<pre class=\"code\"><code>h(x)\n  根据候选状态 x 计算预测观测。\n\nH_obs = derivative of h(x) with respect to x\n  状态改变一点，预测观测 h(x) 会怎样改变。\n\nr(x) = z - h(x)\n  已经得到的实际观测 z 与预测观测之差。\n\nJ = derivative of r(x) with respect to x\n  状态改变一点，残差 r(x) 会怎样改变。<\/code><\/pre>\n<p>测量完成后，z 已经是固定的已知数，对状态 x 求导时有：<\/p>\n<pre class=\"code\"><code>derivative of z with respect to x = 0<\/code><\/pre>\n<p>因此，当本文定义 <code>r(x)=z-h(x)<\/code> 时：<\/p>\n<pre class=\"code\"><code>J\n= derivative of [z-h(x)] with respect to x\n= 0 - H_obs\n= -H_obs<\/code><\/pre>\n<p>在当前状态 <code>x_0<\/code> 附近，它们的一阶近似分别是：<\/p>\n<pre class=\"code\"><code>h(x_0 + delta_x)\napproximately_equals\nh(x_0) + H_obs*delta_x<\/code><\/pre>\n<pre class=\"code\"><code>r(x_0 + delta_x)\napproximately_equals\nr(x_0) + J*delta_x\n\n= r(x_0) - H_obs*delta_x<\/code><\/pre>\n<p>例如：<\/p>\n<pre class=\"code\"><code>h(x) = 2*x\nz = 5\nx_0 = 2<\/code><\/pre>\n<p>当前预测观测和残差为：<\/p>\n<pre class=\"code\"><code>h(2) = 4\nr(2) = 5-4 = 1<\/code><\/pre>\n<p>两个雅可比为：<\/p>\n<pre class=\"code\"><code>H_obs = 2\nJ = -2<\/code><\/pre>\n<p>若令 <code>delta_x=0.1<\/code>，则预测观测增加 0.2，残差减少 0.2：<\/p>\n<pre class=\"code\"><code>h(2.1) = 4.2\nr(2.1) = 5-4.2 = 0.8<\/code><\/pre>\n<p>这正是 <code>H_obs=2<\/code> 而 <code>J=-2<\/code> 的含义。如果状态有 n 维、观测有 m 维，则：<\/p>\n<pre class=\"code\"><code>h(x) and r(x) : m by 1\nH_obs and J   : m by n<\/code><\/pre>\n<p>第 3.1.1 节的地标例子里 <code>m=2<\/code>、<code>n=3<\/code>，所以 <code>H_obs<\/code> 和 <code>J<\/code> 都是 <code>2 × 3<\/code>；下面的<code>H_GN<\/code> 则是 <code>3 × 3<\/code>。<\/p>\n<p>把残差线性化后代入高斯加权平方代价：<\/p>\n<pre class=\"code\"><code>0.5\n* (r + J*delta_x)^T\n* Omega\n* (r + J*delta_x)<\/code><\/pre>\n<p>第 3.1.4 节将从这个式子推导 Gauss-Newton 方程。其近似 Hessian 为：<\/p>\n<pre class=\"code\"><code>H_GN = J^T * Omega * J<\/code><\/pre>\n<p>因为 <code>J=-H_obs<\/code>，两个负号在二次项中抵消：<\/p>\n<pre class=\"code\"><code>H_GN\n= (-H_obs)^T * Omega * (-H_obs)\n= H_obs^T * Omega * H_obs<\/code><\/pre>\n<p>因此 <code>H_obs<\/code> 不是 Hessian；它是观测函数的一阶导数。它经过转置、噪声加权和相乘，才构成观测对近似 Hessian 的贡献。<\/p>\n<p>还要注意两种常见的记号差异：<\/p>\n<ul><li>如果书中把残差定义为 <code>h(x)-z<\/code>，那么残差雅可比就是 <code>J=H_obs<\/code>。<\/li><li>有些滤波文献把观测雅可比简写成 <code>H<\/code>，有些优化文献又把 Hessian 简写成<code>H<\/code>。它们不是同一个矩阵，应先查看作者对字母的定义。<\/li><\/ul>\n<p>若 h 本来就是 <code>h(x)=5-x<\/code> 这样的线性函数，一阶展开是精确等式。若 h 是非线性函数，就要在新状态处重新计算残差和雅可比。无论选择哪种残差正负号，残差、雅可比、正规方程和状态更新都必须使用同一套约定。<\/p>\n<p>第 2.1 章得到的目标函数 <code>F(x)<\/code> 通常是非线性的，不能直接解出最优状态。本章说明怎样用雅可比把它在当前估计附近变成一个二次问题、怎样解出状态增量，以及解完之后怎样从 Hessian 判断“哪些方向还没有足够信息”。<\/p>\n<p>原文把“雅可比和海森矩阵有什么区别”单列为问题三。它本质上是本章的概念辨析，所以并入这里的第 3.1.5 节，不再单独成章。<\/p><\/section>\n<section class=\"sec\" data-sec=\"3.1.3\"><h3 id=\"s3.1.3\"><span class=\"num\">3.1.3<\/span> 雅可比为什么会出现？<\/h3>\n<p>第 3.1.1、3.1.2 节已经从观测函数推导了 <code>H_obs<\/code> 和 <code>J=-H_obs<\/code>。实际 SLAM 会把许多标量或向量残差堆叠成一个总残差向量 r。对它作同样的一阶展开：<\/p>\n<pre class=\"code\"><code>J = partial(r) / partial(x), evaluated at x = x_0\n\nr(x_0 + delta_x)\napproximately_equals\nr(x_0) + J * delta_x<\/code><\/pre>\n<p>这里的 J 默认指残差雅可比 <code>J_r<\/code>，它回答：<\/p>\n<blockquote>状态的每个分量改变一点，残差的每个分量会改变多少？<\/blockquote>\n<p>若残差有 m 维、状态有 n 维，则 J 是 <code>m × n<\/code> 矩阵。J 的第 j 列就是“第 j 个状态分量变化时，全部残差如何变化”。若代码把残差定义成 <code>h(x)-z<\/code>，J 的符号会与本文相反；残差、雅可比、正规方程和更新约定必须成套使用。<\/p><\/section>\n<section class=\"sec\" data-sec=\"3.1.4\"><h3 id=\"s3.1.4\"><span class=\"num\">3.1.4<\/span> Gauss-Newton 方程和 Hessian 怎样得到？<\/h3>\n<p>先比较下面两个看起来很像的式子：<\/p>\n<pre class=\"code\"><code>当前残差代价：r^T * Omega * r\n\nGauss-Newton 近似 Hessian：J^T * Omega * J<\/code><\/pre>\n<p><code>Omega=Sigma^-1<\/code> 的来源、它为什么是 <code>m × m<\/code> 矩阵，以及独立和相关误差的数值展开已经分别在第 2.4.2 至 2.4.5 节说明。本节只讨论：同一个残差信息怎样通过雅可比映射到状态空间。实际 SLAM 中，第 i 个因子产生 <code>m_i<\/code> 维残差，就使用自己的<code>m_i × m_i<\/code> 信息矩阵 <code>Omega_i<\/code>，不必构造覆盖全图残差的巨大稠密矩阵。<\/p>\n<p>它们具有相同的“左边转置、中间权重、右边自身”结构，但不是同一种量。还有第三个长得很像的式子 <code>J*Sigma*J^T<\/code>，方向恰好相反；三者的区别集中在第 3.4.2.5 节说明。假设状态有 n 个分量，残差有 m 个分量：<\/p>\n<pre class=\"code\"><code>x       n by 1\nr       m by 1\nOmega   m by m\nJ       m by n<\/code><\/pre>\n<p>那么：<\/p>\n<pre class=\"code\"><code>r^T * Omega * r\n\n(1 by m) * (m by m) * (m by 1)\n= 1 by 1 标量<\/code><\/pre>\n<p>它回答的是“当前候选状态产生的加权残差一共有多大”。而：<\/p>\n<pre class=\"code\"><code>J^T * Omega * J\n\n(n by m) * (m by m) * (m by n)\n= n by n 矩阵<\/code><\/pre>\n<p>它回答的是“状态沿各个方向变化时，目标函数在局部弯曲得有多快”。右边虽然没有直接写 r，但 J 是残差 <code>r(x)<\/code> 对状态 x 的导数，所以仍然来自同一个残差模型。<\/p>\n<p>两个结构相似不是巧合。状态改变 <code>delta_x<\/code> 时，一阶近似的残差变化为：<\/p>\n<pre class=\"code\"><code>delta_r approximately_equals J * delta_x<\/code><\/pre>\n<p>只看这部分残差变化产生的二次代价：<\/p>\n<pre class=\"code\"><code>delta_r^T * Omega * delta_r\n\n= (J*delta_x)^T * Omega * (J*delta_x)\n\n= delta_x^T * J^T * Omega * J * delta_x<\/code><\/pre>\n<p>因此 <code>Omega<\/code> 原本描述测量残差空间中的权重；左右乘雅可比后：<\/p>\n<pre class=\"code\"><code>H_GN = J^T * Omega * J<\/code><\/pre>\n<p>就把测量信息映射到了状态空间。<code>H_GN<\/code> 是状态增量二次项的系数矩阵。<\/p>\n<p>先把所有残差堆叠成 r，把权重组成 Omega。在线性化点附近：<\/p>\n<pre class=\"code\"><code>F(x_0 + delta_x)\napproximately_equals\n0.5\n* (r + J * delta_x)^T\n* Omega\n* (r + J * delta_x)<\/code><\/pre>\n<p>展开：<\/p>\n<pre class=\"code\"><code>F\napproximately_equals\n0.5 * r^T * Omega * r\n+ delta_x^T * J^T * Omega * r\n+ 0.5 * delta_x^T * J^T * Omega * J * delta_x<\/code><\/pre>\n<p>对 <code>delta_x<\/code> 求导并令其为 0：<\/p>\n<pre class=\"code\"><code>J^T * Omega * r\n+ J^T * Omega * J * delta_x\n= 0<\/code><\/pre>\n<p>整理得到正规方程：<\/p>\n<pre class=\"code\"><code>H_GN * delta_x = -g\n\nH_GN = J^T * Omega * J\ng    = J^T * Omega * r<\/code><\/pre>\n<p>这就是 <code>H * delta_x = -g<\/code> 的来源。三个量的作用可以直接对应起来：<\/p>\n<pre class=\"code\"><code>r^T * Omega * r\n  -&gt; 当前状态的加权残差代价，是标量\n\ng = J^T * Omega * r\n  -&gt; 目标函数的梯度；负梯度 -g 指向局部最陡下降方向\n\nH_GN = J^T * Omega * J\n  -&gt; 目标函数的局部曲率矩阵，决定各状态方向的更新尺度和耦合<\/code><\/pre>\n<p>求出增量后更新线性化点：<\/p>\n<pre class=\"code\"><code>x_0 &lt;- x_0 + delta_x<\/code><\/pre>\n<p>然后重新计算残差和雅可比，重复上述过程，直到增量或代价变化足够小。位姿包含旋转时，普通加法要换成第 3.5.1 节的 <code>Exp<\/code> 更新。<\/p>\n<p>下面用第 3.1.1 节的地标把这个过程完整走一遍。一个地标只能提供两个方程，定不住三个未知数，所以再加一个地标 <code>L_2 = (3, -4)<\/code>，与 <code>L_1 = (3, 4)<\/code> 关于 x 轴对称。机器人的真实位姿是 <code>(0.2, 0.1, 0.05)<\/code>，但算法不知道。为了看清收敛过程，这里的测量不加噪声：<\/p>\n<pre class=\"code\"><code>地标 L_1 = (3,  4)：  z_1 = (rho, phi) = (4.8010 m,  0.8981 rad)\n地标 L_2 = (3, -4)：  z_2 = (rho, phi) = (4.9649 m, -1.0216 rad)\n\nsigma_rho = 0.05 m,  sigma_phi = 0.01 rad\n每个地标的 Omega_i = diag(1/0.05^2, 1/0.01^2) = diag(400, 10000)<\/code><\/pre>\n<p>从初值 <code>x_0 = (0, 0, 0)<\/code> 出发。两个地标的预测值都是距离 5 m、方位 ±0.9273 rad，于是 4 维残差为：<\/p>\n<pre class=\"code\"><code>r(x_0) = [z_1 - h_1(x_0); z_2 - h_2(x_0)]\n       = [-0.1990, -0.0292, -0.0351, -0.0943]^T<\/code><\/pre>\n<p>残差雅可比 <code>J = -H_obs<\/code>。L_1 的 H_obs 在第 3.1.1 节算过；L_2 只是把 dy 从 4 换成-4：<\/p>\n<pre class=\"code\"><code>                  x       y      theta\nL_1  rho     [  0.6     0.8      0  ]\n     phi     [ -0.16    0.12     1  ]\nL_2  rho     [  0.6    -0.8      0  ]\n     phi     [  0.16    0.12     1  ]<\/code><\/pre>\n<p>J 是 4 × 3，大 Omega 是 <code>diag(400, 10000, 400, 10000)<\/code>，4 × 4。于是：<\/p>\n<pre class=\"code\"><code>H_GN = J^T*Omega*J = [800      0        0 ]        3 × 3\n                     [  0    800     2400 ]\n                     [  0   2400    20000 ]\n\ng = J^T*Omega*r = [-160.43, -200.62, -1234.95]^T<\/code><\/pre>\n<p>逐项核对几个元素：<\/p>\n<pre class=\"code\"><code>H_xx          = 400*(0.6^2 + 0.6^2) + 10000*(0.16^2 + 0.16^2) = 288 + 512 = 800\nH_theta_theta = 10000*(1^2 + 1^2)                             = 20000\nH_y_theta     = 10000*(0.12*1 + 0.12*1)                       = 2400<\/code><\/pre>\n<p><code>H_y_theta = 2400<\/code> 不为 0：两个地标都在前方，机器人往左平移和原地左转，都会让两个方位角朝同一侧变化，所以 y 与 theta 在局部是耦合的。解 <code>H_GN*delta_x = -g<\/code>：<\/p>\n<pre class=\"code\"><code>delta_x = (0.2005, 0.1024, 0.0495)\nx_1     = x_0 + delta_x = (0.2005, 0.1024, 0.0495)<\/code><\/pre>\n<p>二维的朝向可以直接相加（相加后把角度归一化到 (-pi, pi]），三维旋转才需要第 3.5.1 节的 Exp 更新。一步就很接近真值了。然后在 x_1 处重新计算 h、残差和雅可比，再解一次：<\/p>\n<div class=\"tbl\"><table><thead><tr><th>迭代<\/th><th>x / m<\/th><th>y / m<\/th><th>theta / rad<\/th><th>代价 F<\/th><\/tr><\/thead><tbody><tr><td>0<\/td><td>0<\/td><td>0<\/td><td>0<\/td><td>56.90<\/td><\/tr><tr><td>1<\/td><td>0.2005<\/td><td>0.1024<\/td><td>0.0495<\/td><td>0.0023<\/td><\/tr><tr><td>2<\/td><td>0.2000<\/td><td>0.1000<\/td><td>0.0500<\/td><td>1.4e-10<\/td><\/tr><\/tbody><\/table><\/div>\n<p>第一步没有一次到位，是因为初值离真值还有约 0.23 m，第 3.1.1 节表格里的线性化误差在这里起了作用；重新线性化一次以后，误差就迅速缩小。如果只保留一个地标，<code>H_GN<\/code> 的特征值是 <code>{0, 400, 10400}<\/code>，有一个零特征值，正规方程没有唯一解，对应的正是第 3.1.1 节那个“绕地标转圈”的方向。<\/p>\n<p>严格的 Hessian 是标量目标 F 对状态的二阶导数：<\/p>\n<pre class=\"code\"><code>H_exact = partial^2(F) / partial(x)^2<\/code><\/pre>\n<p>对于平方残差，它包含两部分：<\/p>\n<pre class=\"code\"><code>H_exact\n= J^T * Omega * J\n+ 与“残差 × 残差二阶导数”有关的项<\/code><\/pre>\n<p>Gauss-Newton 忽略第二部分。因此工程中常把 <code>J^T * Omega * J<\/code> 简称为 Hessian，更严谨的说法是“Gauss-Newton 近似 Hessian”。在残差较小、初值较好时，这个近似通常有效。<\/p>\n<p>Levenberg-Marquardt 会求解类似：<\/p>\n<pre class=\"code\"><code>(H_GN + lambda*D) * delta_x = -g<\/code><\/pre>\n<p><code>lambda*D<\/code> 用来限制当前步长、改善数值稳定性。它是求解策略加入的人工项，不是传感器提供的新信息。<\/p>\n<p>计算时不应显式求 <code>H^-1<\/code> 再乘 g，而应使用 Cholesky、LDLT、QR 或 SVD 解线性方程。<\/p>\n<figure class=\"anim\"><div class=\"player\"><video src=\"vid/gn_two_landmarks.mp4\" poster=\"vid/gn_two_landmarks.jpg\" muted loop playsinline preload=\"none\" aria-label=\"动画 12：两个地标的 Gauss-Newton：每步线性化、解 H·δx = -g，代价 56.90 → 0.0023 → 1e-10\"><\/video><\/div><figcaption><span class=\"badge\">动画 12<\/span>两个地标的 Gauss-Newton：每步线性化、解 H·δx = -g，代价 56.90 → 0.0023 → 1e-10<\/figcaption><\/figure><\/section>\n<section class=\"sec\" data-sec=\"3.1.5\"><h3 id=\"s3.1.5\"><span class=\"num\">3.1.5<\/span> 雅可比和 Hessian 到底差在哪里？<\/h3>\n<p>这一节回答原文的“问题三”。最短回答是：<\/p>\n<pre class=\"code\"><code>雅可比 J：状态动一点，残差会怎样变化。\nHessian H：状态沿某方向动时，总代价弯曲得有多快。<\/code><\/pre>\n<p>J 是向量残差的一阶导数；H 是标量目标函数的二阶导数。Gauss-Newton 中常用<code>J^T * Omega * J<\/code> 近似真实 Hessian，完整推导见第 3.1.3、3.1.4 节。<\/p>\n<h4 id=\"s3.1.5.1\"><span class=\"num\">3.1.5.1<\/span> 一个可手算例子<\/h4>\n<p>只有一个残差：<\/p>\n<pre class=\"code\"><code>r(x, y) = x + 2y - 3<\/code><\/pre>\n<p>分别对 x、y 求导：<\/p>\n<pre class=\"code\"><code>J = [1, 2]<\/code><\/pre>\n<p>令权重为 1，则：<\/p>\n<pre class=\"code\"><code>H_GN = J^T * J\n\nJ^T = [1, 2]^T\n\nH_GN = [1*1, 1*2]\n       [2*1, 2*2]\n\n     = [1, 2]\n       [2, 4]<\/code><\/pre>\n<p>H 的两行成比例，秩只有 1。原因很直观：一个方程不能唯一确定两个未知数。因为这个残差本身是线性的，残差的二阶导数为零，所以本例中的<code>H_GN = J^T*J<\/code> 同时也是真实 Hessian。<\/p>\n<p>方向：<\/p>\n<pre class=\"code\"><code>v = [2, -1]^T<\/code><\/pre>\n<p>满足：<\/p>\n<pre class=\"code\"><code>J * v = 1*2 + 2*(-1) = 0<\/code><\/pre>\n<p>因此从 <code>(x, y)<\/code> 沿 v 移动，残差不变。这个例子就是“不可观方向”；走廊退化只是把 x、y 换成了位姿自由度，把一个方程换成了很多几何结构相似的激光残差。<\/p>\n<h4 id=\"s3.1.5.2\"><span class=\"num\">3.1.5.2<\/span> 二者对比<\/h4>\n<div class=\"tbl\"><table><thead><tr><th>对比项<\/th><th>雅可比 J<\/th><th>Hessian H<\/th><\/tr><\/thead><tbody><tr><td>对谁求导<\/td><td>向量残差 r<\/td><td>标量代价 F<\/td><\/tr><tr><td>导数阶数<\/td><td>一阶<\/td><td>二阶<\/td><\/tr><tr><td>维度<\/td><td><code>残差维数 × 状态维数<\/code><\/td><td><code>状态维数 × 状态维数<\/code><\/td><\/tr><tr><td>直觉<\/td><td>测量对状态的灵敏度<\/td><td>代价曲率和局部信息强度<\/td><\/tr><tr><td>退化表现<\/td><td>列相关或存在零空间<\/td><td>出现零或很小的特征值<\/td><\/tr><tr><td>优化作用<\/td><td>线性化非线性残差<\/td><td>构造状态增量方程<\/td><\/tr><\/tbody><\/table><\/div><\/section>", "sections": [{"id": "3.1.1", "title": "为什么要对 h(x) 做一阶泰勒展开？"}, {"id": "3.1.2", "title": "h(x)、H_obs、r(x) 和 J 有什么区别？"}, {"id": "3.1.3", "title": "雅可比为什么会出现？"}, {"id": "3.1.4", "title": "Gauss-Newton 方程和 Hessian 怎样得到？"}, {"id": "3.1.5", "title": "雅可比和 Hessian 到底差在哪里？"}]}, {"num": "3.2", "title": "LM：给 Gauss-Newton 加上安全带", "html": "<section class=\"sec\" data-sec=\"3.2.0\"><div class=\"callout tip\"><strong>为什么现在学这一章<\/strong>：Gauss-Newton 在初值差或信息不足时会发散或无解。LM 在方程左侧加阻尼，并根据“实际下降 / 预测下降”自动调节步长。这一章原在第 29 章，提前到这里与 GN 放在一起。<\/div><\/section>\n<section class=\"sec\" data-sec=\"3.2.1\"><h3 id=\"s3.2.1\"><span class=\"num\">3.2.1<\/span> GN 和 LM 有什么区别？LM 解决了 GN 的什么问题？<\/h3>\n<h4 id=\"s3.2.1.1\"><span class=\"num\">3.2.1.1<\/span> Gauss-Newton 的问题<\/h4>\n<p>GN 方程（推导见 3.1.4 节）：<\/p>\n<pre class=\"code\"><code>J^T * Omega * J * delta_x = -J^T * Omega * r<\/code><\/pre>\n<p>它用 <code>J^T*Omega*J<\/code> 近似 Hessian，忽略了二阶项 <code>Σ r_i * Hessian(r_i)<\/code>。残差小、接近最优解时近似很好，收敛接近二次。但 GN 有三个问题：<\/p>\n<ol><li value=\"1\"><strong><\/strong><code>J^T*Omega*J<\/code> 可能奇异或病态**：规范自由度没固定（见 3.4.2.8 第 9 步）、退化场景（见第 7.1 章）、观测不足，都会使方程无解或解爆炸；<\/li><li value=\"2\"><strong>步长不受控<\/strong>：远离最优解时线性化近似失效，GN 一步可能跨过最优点，甚至让代价上升而发散；GN 本身没有任何机制保证代价下降；<\/li><li value=\"3\"><strong>大残差问题<\/strong>：残差大时被忽略的二阶项不可忽略，收敛变慢。<\/li><\/ol>\n<h4 id=\"s3.2.1.2\"><span class=\"num\">3.2.1.2<\/span> Levenberg-Marquardt<\/h4>\n<pre class=\"code\"><code>(J^T * Omega * J + lambda * D) * delta_x = -J^T * Omega * r<\/code><\/pre>\n<ul><li><code>lambda<\/code> 趋于 0 时退化为 GN，局部收敛快；<code>lambda<\/code> 很大时：<\/li><\/ul>\n<pre class=\"code\"><code>delta_x ≈ -(1/lambda) * inverse(D) * J^T * Omega * r<\/code><\/pre>\n<p>即小步长的梯度下降，稳但慢；<\/p>\n<ul><li><code>D = I<\/code> 是 Levenberg 的形式，<code>D = diag(J^T*Omega*J)<\/code> 是 Marquardt 的形式，后者对变量尺度不敏感，变量单位不同时更好；<\/li><li>从信赖域角度看，LM 等价于在 <code>||delta_x|| &lt;= radius<\/code> 的范围内最小化二次模型，<code>lambda<\/code> 是对应的拉格朗日乘子。<\/li><\/ul>\n<p><strong><code>lambda<\/code> 怎样自适应调整<\/strong>：计算增益比<\/p>\n<pre class=\"code\"><code>rho = [F(x) - F(x + delta_x)] / [L(0) - L(delta_x)]\n      实际下降量                  二次模型预测的下降量<\/code><\/pre>\n<ul><li><code>rho<\/code> 大：模型可信，接受这一步，减小 <code>lambda<\/code>，更像 GN；<\/li><li><code>rho<\/code> 小或为负：拒绝这一步，增大 <code>lambda<\/code>，缩小信赖域后重新求解。<\/li><\/ul>\n<p>常用 Nielsen 策略：<\/p>\n<pre class=\"code\"><code>接受：lambda &lt;- lambda * max(1/3, 1 - (2*rho - 1)^3),  nu &lt;- 2\n拒绝：lambda &lt;- lambda * nu,  nu &lt;- 2 * nu<\/code><\/pre>\n<figure class=\"anim\"><div class=\"player\"><video src=\"vid/gn_vs_lm.mp4\" poster=\"vid/gn_vs_lm.jpg\" muted loop playsinline preload=\"none\" aria-label=\"动画 13：从 x = 1.5 出发：GN 的二次模型在远处不可信、越跳越远；LM 加阻尼后步长受控、单调下降\"><\/video><\/div><figcaption><span class=\"badge\">动画 13<\/span>从 x = 1.5 出发：GN 的二次模型在远处不可信、越跳越远；LM 加阻尼后步长受控、单调下降<\/figcaption><\/figure>\n<h4 id=\"s3.2.1.3\"><span class=\"num\">3.2.1.3<\/span> LM 解决了什么？代价是什么？<\/h4>\n<div class=\"tbl\"><table><thead><tr><th>GN 的问题<\/th><th>LM 怎样解决<\/th><\/tr><\/thead><tbody><tr><td><code>J^T*Omega*J<\/code> 奇异或病态<\/td><td><code>lambda &gt; 0<\/code> 时左侧矩阵正定，总是可解；退化方向的步长被阻尼抑制<\/td><\/tr><tr><td>远离最优解时发散<\/td><td>通过接受或拒绝步长保证代价单调下降，自动缩小步长<\/td><\/tr><tr><td>仍需快速收敛<\/td><td>接近最优时 <code>lambda<\/code> 趋于 0，保留 GN 的快速局部收敛<\/td><\/tr><\/tbody><\/table><\/div>\n<p>代价是：被拒绝的步长要重新解一次线性方程；<code>lambda<\/code> 的调整策略影响效率。Powell Dogleg 是另一种信赖域方法：在 GN 步和最速下降步之间插值，改变信赖域半径时不需要重新解线性方程，这也是 iSAM2 可选 Dogleg 的原因。<\/p>\n<p>和 SLAM 的联系：FAST-LIO2 的迭代更新等价于对“先验 + 当前观测”做 GN（见 5.2.5 节）；Ceres 默认使用 LM，g2o 支持 GN、LM 和 Dogleg。<\/p><\/section>", "sections": [{"id": "3.2.1", "title": "GN 和 LM 有什么区别？LM 解决了 GN 的什么问题？"}]}, {"num": "3.3", "title": "Hessian、信息与可观性", "html": "<section class=\"sec\" data-sec=\"3.3.0\"><div class=\"callout tip\"><strong>为什么现在学这一章<\/strong>：解出增量之后，还要问“这个解可信吗、每个方向信息够吗”。Hessian 的曲率就是信息，小特征值对应弱约束方向。一面墙、两面墙的例子会在第 7 级的长走廊退化中再次出现。<\/div><\/section>\n<section class=\"sec\" data-sec=\"3.3.1\"><h3 id=\"s3.3.1\"><span class=\"num\">3.3.1<\/span> Hessian 为什么能反映“有没有足够信息”？<\/h3>\n<p>先给最准确的一句话：<\/p>\n<blockquote>Hessian 描述的不是“当前点的斜率有多大”，而是“状态改变时，斜率变化得有多快”。它反映的是目标函数在最优点附近的曲率。<\/blockquote>\n<p>目标函数在某个状态方向上的曲率大，说明状态稍微偏离最优值，代价就会迅速增加；测量因此能够排除这个方向上的错误状态。曲率接近 0，则表示沿该方向改变状态几乎不影响代价，很多候选状态都能同样解释测量，所以信息不足。<\/p>\n<h4 id=\"s3.3.1.1\"><span class=\"num\">3.3.1.1<\/span> 先分清斜率与曲率<\/h4>\n<p>比较两条直线：<\/p>\n<pre class=\"code\"><code>g_1(x) = 100*(x-3)\ng_2(x) = x-4<\/code><\/pre>\n<p>它们的一阶导数分别是：<\/p>\n<pre class=\"code\"><code>g_1&#x27;(x) = 100\ng_2&#x27;(x) = 1<\/code><\/pre>\n<p>因此两条直线的斜率并不一样，第一条直线更陡。但是它们的二阶导数都是 0：<\/p>\n<pre class=\"code\"><code>g_1&#x27;&#x27;(x) = 0\ng_2&#x27;&#x27;(x) = 0<\/code><\/pre>\n<p>原因是直线没有弯曲。Hessian 衡量的是曲率，所以不能直接拿两条直线在某处的函数值代替 Hessian。<\/p>\n<p>在前面的最小二乘例子中，<code>100*(x-3)<\/code> 实际上是一条代价函数的一阶导数：<\/p>\n<pre class=\"code\"><code>F_1(x)  = 50*(x-3)^2\nF_1&#x27;(x) = 100*(x-3)\nF_1&#x27;&#x27;(x)= 100<\/code><\/pre>\n<p>再与另一条代价函数比较：<\/p>\n<pre class=\"code\"><code>F_2(x)  = 0.5*(x-4)^2\nF_2&#x27;(x) = x-4\nF_2&#x27;&#x27;(x)= 1<\/code><\/pre>\n<p>在各自的最低点：<\/p>\n<pre class=\"code\"><code>F_1&#x27;(3) = 0\nF_2&#x27;(4) = 0<\/code><\/pre>\n<p>两条代价曲线在最低点的斜率都是 0，所以只看一阶导数无法判断哪个最低点更尖。它们的 Hessian 分别为：<\/p>\n<pre class=\"code\"><code>H_1 = 100\nH_2 = 1<\/code><\/pre>\n<p>现在从各自最低点向右移动相同距离 0.1：<\/p>\n<pre class=\"code\"><code>F_1(3.1) - F_1(3) = 0.5\nF_2(4.1) - F_2(4) = 0.005\n\nF_1&#x27;(3.1) = 10\nF_2&#x27;(4.1) = 0.1<\/code><\/pre>\n<p>可以看到：<code>H_1<\/code> 是 <code>H_2<\/code> 的 100 倍，所以移动相同距离后，第一条曲线的梯度增长得更快，代价也增长得更快。更准确的说法是：<\/p>\n<pre class=\"code\"><code>Hessian 大\n  -&gt; 梯度随状态变化得快\n  -&gt; 最优点附近的低代价区域较窄\n\nHessian 小\n  -&gt; 梯度随状态变化得慢\n  -&gt; 很大一片状态都具有相近代价<\/code><\/pre>\n<figure class=\"still\"><img loading=\"lazy\" src=\"img/static/curvature-hessian.png\" alt=\"两条最低点斜率均为 0 但曲率相差 100 倍的代价曲线\"><figcaption>两条最低点斜率均为 0 但曲率相差 100 倍的代价曲线<\/figcaption><\/figure>\n<blockquote>图注：一阶导数在最低点都是 0，分不出好坏；二阶导数（Hessian）差 100 倍，所以偏离同样距离时代价增长差 100 倍。这就是“曲率大 = 信息强”的来源。<\/blockquote>\n<h4 id=\"s3.3.1.2\"><span class=\"num\">3.3.1.2<\/span> 为什么曲率大可以解释为信息强？<\/h4>\n<p>一维高斯后验可以写成：<\/p>\n<pre class=\"code\"><code>p(x | measurements)\nproportional_to\nexp(\n  -0.5 * (x-mean)^2 / variance\n)<\/code><\/pre>\n<p>它对应的负对数代价为：<\/p>\n<pre class=\"code\"><code>F(x) = 0.5 * (x-mean)^2 / variance<\/code><\/pre>\n<p>连续求两次导数：<\/p>\n<pre class=\"code\"><code>F&#x27;(x)  = (x-mean) / variance\nF&#x27;&#x27;(x) = 1 / variance<\/code><\/pre>\n<p>所以在线性高斯的一维问题中：<\/p>\n<pre class=\"code\"><code>H = 1 / variance<\/code><\/pre>\n<p>这正是信息量的定义：<\/p>\n<pre class=\"code\"><code>variance 小 -&gt; 分布窄  -&gt; 状态确定 -&gt; H 大\nvariance 大 -&gt; 分布宽  -&gt; 状态模糊 -&gt; H 小<\/code><\/pre>\n<p>因此 Hessian 能反映信息强弱，不只是因为曲线“看起来像碗”，而是因为高斯负对数的二次项系数恰好等于协方差的逆。<\/p>\n<p>多维高斯后验在最优点附近写成：<\/p>\n<pre class=\"code\"><code>p(delta_x | measurements)\nproportional_to\nexp(-0.5 * delta_x^T * P^-1 * delta_x)<\/code><\/pre>\n<p>优化目标在最优点附近的二阶近似是：<\/p>\n<pre class=\"code\"><code>F(delta_x)\napproximately_equals\nF_min + 0.5 * delta_x^T * H * delta_x<\/code><\/pre>\n<p>比较两个二次项：<\/p>\n<pre class=\"code\"><code>H approximately_equals P^-1\n\nP approximately_equals H^-1<\/code><\/pre>\n<p>在线性高斯问题中这个关系是精确的；非线性 SLAM 中，它通常只是当前线性化点附近的局部近似。<\/p>\n<figure class=\"anim\"><div class=\"player\"><video src=\"vid/curvature_information.mp4\" poster=\"vid/curvature_information.jpg\" muted loop playsinline preload=\"none\" aria-label=\"动画 14：斜率都为 0，曲率差 100 倍：曲率大 → 偏一点代价就猛涨 → 方差 = 1/H 小\"><\/video><\/div><figcaption><span class=\"badge\">动画 14<\/span>斜率都为 0，曲率差 100 倍：曲率大 → 偏一点代价就猛涨 → 方差 = 1/H 小<\/figcaption><\/figure>\n<h4 id=\"s3.3.1.3\"><span class=\"num\">3.3.1.3<\/span> Hessian 怎样同时包含灵敏度和噪声？<\/h4>\n<p>第 3.1.4 节已经得到 Gauss-Newton 近似 Hessian：<\/p>\n<pre class=\"code\"><code>H_GN = J^T * Omega * J<\/code><\/pre>\n<p>它同时包含两件事：<\/p>\n<pre class=\"code\"><code>J：测量残差对状态有多敏感\nOmega：测量本身有多可信，Omega = Sigma^-1<\/code><\/pre>\n<p>对于任意状态方向 v：<\/p>\n<pre class=\"code\"><code>v^T * H_GN * v\n= (J*v)^T * Omega * (J*v)<\/code><\/pre>\n<p>这个式子可以逐步理解：<\/p>\n<pre class=\"code\"><code>沿 v 改变一点状态\n  -&gt; 残差大约改变 J*v\n  -&gt; Omega 根据测量噪声给这段残差变化加权\n  -&gt; 得到沿 v 方向的局部代价曲率<\/code><\/pre>\n<p>因此：<\/p>\n<pre class=\"code\"><code>J*v 大并且测量噪声小\n  -&gt; v^T*H*v 大\n  -&gt; 这个方向信息强\n\nJ*v 接近 0\n  -&gt; 状态沿 v 变化几乎不影响残差\n  -&gt; v^T*H*v 接近 0\n  -&gt; 这个方向信息弱<\/code><\/pre>\n<p>即使传感器的 <code>Omega<\/code> 很大，只要它对某个状态方向不敏感，也不能凭空为这个方向提供信息。<\/p>\n<h4 id=\"s3.3.1.4\"><span class=\"num\">3.3.1.4<\/span> 一面墙能约束哪些方向？<\/h4>\n<p>平面机器人的位姿为：<\/p>\n<pre class=\"code\"><code>state = [x, y, theta]^T<\/code><\/pre>\n<p>当前估计是 <code>(3, 0, 0)<\/code>。竖直墙位于 <code>x = 5 m<\/code>，法向 <code>n = (1, 0)<\/code>。激光打到墙上的每个点，在机器人自己的坐标系里都有一个坐标 <code>p = (p_x, p_y)<\/code>；机器人朝向 x 轴时，墙在正前方 2 m，所以这些点的 <code>p_x = 2<\/code>。把点变换到地图坐标系：<\/p>\n<pre class=\"code\"><code>点的地图坐标 = R(theta)*p + (x, y)\n\nR(theta) = [cos(theta)  -sin(theta)]\n           [sin(theta)   cos(theta)]<\/code><\/pre>\n<p>它应该正好落在墙上，所以“点到墙的距离”就是残差。这就是第 5.2 章 FAST-LIO2 使用的点到平面残差在二维中的样子：<\/p>\n<pre class=\"code\"><code>r(x, y, theta) = n^T * [R(theta)*p + (x, y)] - 5\n               = x + cos(theta)*p_x - sin(theta)*p_y - 5<\/code><\/pre>\n<p>对三个状态分量求导，在 <code>theta = 0<\/code> 处取值：<\/p>\n<pre class=\"code\"><code>d r / dx     = 1\nd r / dy     = 0\nd r / dtheta = -sin(theta)*p_x - cos(theta)*p_y = -p_y\n\nJ = [1, 0, -p_y]<\/code><\/pre>\n<p>三个数各有含义：<\/p>\n<ul><li>对 x 的导数是 1：机器人往墙走，点就往墙里钻；<\/li><li>对 y 的导数是 0：机器人沿墙上下移动，点仍然在墙上；<\/li><li>对 theta 的导数是 <code>-p_y<\/code>：机器人原地转身时，正前方的点（<code>p_y = 0<\/code>）几乎不动，偏在左右两侧的点却一个往墙里、一个往墙外移动。<\/li><\/ul>\n<p>若每个点的标准差为 0.1 m，则 <code>Omega = 1/0.1^2 = 100<\/code>。<strong>只用正前方一个点<\/strong> <code>p = (2, 0)<\/code> 时：<\/p>\n<pre class=\"code\"><code>J = [1, 0, 0]\n\nH_GN = J^T * 100 * J = [100  0  0]\n                       [  0  0  0]\n                       [  0  0  0]<\/code><\/pre>\n<p>只有 x 受约束。<strong>再取左右各一个点<\/strong> <code>p = (2, 1)<\/code> 和 <code>p = (2, -1)<\/code>：<\/p>\n<pre class=\"code\"><code>J = [1, 0, -1]\n    [1, 0,  1]\n\nH_GN = 100 * J^T * J = [200  0    0]\n                       [  0  0    0]\n                       [  0  0  200]<\/code><\/pre>\n<p>它表达的是：<\/p>\n<pre class=\"code\"><code>x 方向曲率 200      -&gt; 激光能约束 x（离墙多远）\ntheta 方向曲率 200  -&gt; 激光能约束 yaw（墙线在扫描里是正的还是斜的）\ny 方向曲率 0        -&gt; 激光无法约束 y（沿墙走到了哪里）<\/code><\/pre>\n<p>这与实际几何一致：机器人从 <code>(3, 0)<\/code> 沿墙移动到 <code>(3, 10)<\/code>，看到的墙线完全一样，所以仅靠这面墙无法判断 y。但它<strong>能<\/strong>判断朝向：车头一歪，墙线在扫描里就跟着歪。<\/p>\n<p>即使同一面墙上有 1000 个独立激光点，沿墙均匀分布在 <code>p_y<\/code> 从 -2 m 到 2 m 之间，理想化 Hessian 也只是：<\/p>\n<pre class=\"code\"><code>H_total approximately_equals [100000   0        0   ]\n                             [     0   0        0   ]\n                             [     0   0   133600   ]<\/code><\/pre>\n<p>x 和 yaw 的信息变得很强，y 方向仍然没有信息。测量数量多，不等于所有状态方向都有足够信息。<\/p>\n<p>如果再观察一面水平墙 <code>y = 3 m<\/code>（法向 <code>(0, 1)<\/code>，在机器人左侧 3 m），它的残差是<code>y + sin(theta)*p_x + cos(theta)*p_y - 3<\/code>，雅可比为 <code>[0, 1, p_x]<\/code>。同样取两个点<code>p = (1, 3)<\/code> 和 <code>p = (-1, 3)<\/code>：<\/p>\n<pre class=\"code\"><code>J_horizontal_wall = [0, 1,  1]\n                    [0, 1, -1]\n\nH_horizontal_wall = 100 * J^T * J = [0    0    0]\n                                    [0  200    0]\n                                    [0    0  200]<\/code><\/pre>\n<p>两面方向不同的墙提供的信息相加：<\/p>\n<pre class=\"code\"><code>H_total = [200    0     0]\n          [  0  200     0]\n          [  0    0   400]<\/code><\/pre>\n<p>现在 x、y、yaw 三个方向都受到约束。这就是单面墙、平行长廊容易退化，而墙角和多个不同方向的平面通常更容易定位的原因。<\/p>\n<figure class=\"still\"><img loading=\"lazy\" src=\"img/static/wall-information.png\" alt=\"一面墙与两面墙对 x、y、yaw 的约束对比\"><figcaption>一面墙与两面墙对 x、y、yaw 的约束对比<\/figcaption><\/figure>\n<blockquote>图注：左图只有一面竖直墙：离墙距离（x）和墙线倾角（yaw）都能测出来，但沿墙移动时看到的墙完全一样，所以 y 方向特征值为 0；即使这面墙上有一千个点也不会产生 y 方向的信息。右图再加一面法向不同的墙后，三个方向才都被约束。<\/blockquote>\n<figure class=\"anim\"><div class=\"player\"><video src=\"vid/wall_information.mp4\" poster=\"vid/wall_information.jpg\" muted loop playsinline preload=\"none\" aria-label=\"动画 15：一面墙约束 x 和 yaw，沿墙滑动看不出变化；加一面水平墙后 y 也有了信息\"><\/video><\/div><figcaption><span class=\"badge\">动画 15<\/span>一面墙约束 x 和 yaw，沿墙滑动看不出变化；加一面水平墙后 y 也有了信息<\/figcaption><\/figure>\n<h4 id=\"s3.3.1.5\"><span class=\"num\">3.3.1.5<\/span> 特征值怎样指出具体哪个方向缺信息？<\/h4>\n<p>Hessian 是矩阵，不能只比较一个数。设 q 是 H 的一个单位特征向量，对应特征值为<code>lambda<\/code>：<\/p>\n<pre class=\"code\"><code>H * q = lambda * q<\/code><\/pre>\n<p>让状态沿 q 方向移动 <code>alpha<\/code>：<\/p>\n<pre class=\"code\"><code>delta_x = alpha * q<\/code><\/pre>\n<p>局部代价增加量为：<\/p>\n<pre class=\"code\"><code>delta_F\napproximately_equals\n0.5 * delta_x^T * H * delta_x\n\n= 0.5 * lambda * alpha^2<\/code><\/pre>\n<p>所以：<\/p>\n<pre class=\"code\"><code>q          指出被检查的状态组合方向\nlambda     表示这个方向上的曲率和局部信息强度\n\nlambda 大        该方向约束强\nlambda 小        该方向弱约束\nlambda 接近 0    该方向近似不可观<\/code><\/pre>\n<p>在高斯局部近似下，这个方向上的方差约为：<\/p>\n<pre class=\"code\"><code>variance_along_q approximately_equals 1 / lambda<\/code><\/pre>\n<p>因此小特征值求逆后对应大方差。若特征值为 0，H 无法求普通逆，表示该方向没有有限的信息约束。<\/p>\n<p>第 3.1.5.1 节的 <code>r(x,y)=x+2y-3<\/code> 是另一个例子：它只有一个独立方程，却有两个未知数，所以 H 的秩只有 1，必然存在一个零特征值方向。<\/p>\n<p>第 3.3.1.4 节那面墙也可以这样看。只看一面竖直墙时 <code>H = diag(200, 0, 200)<\/code>，三个特征向量就是三个坐标轴：沿 x、yaw 的特征值都是 200，沿 y 的特征值是 0，指出的正是“沿墙方向”。特征向量不一定和坐标轴对齐：第 3.1.1 节只看一个地标时，零特征值对应的方向是 <code>(4, -3, 1)<\/code> 的单位化，它把平移和转动混在了一起。<\/p>\n<h4 id=\"s3.3.1.6\"><span class=\"num\">3.3.1.6<\/span> 在 SLAM 中怎样正确使用 Hessian？<\/h4>\n<p>Hessian 主要有四个用途：<\/p>\n<ol><li value=\"1\">与梯度一起求解 <code>H_GN*delta_x=-g<\/code>，得到本轮状态更新量；<\/li><li value=\"2\">通过特征值、奇异值或条件数检测弱约束和退化方向；<\/li><li value=\"3\">通过非对角块表达位姿、地图点和不同状态分量之间的耦合；<\/li><li value=\"4\">在条件成立时，用 <code>H^-1<\/code> 近似局部状态协方差。<\/li><\/ol>\n<p>但“Hessian 数值大”只表示当前模型认为信息很多，不保证信息真实正确。下面的问题都可能产生虚假的高置信结果：<\/p>\n<ul><li>大量点其实来自同一物理表面，却被错误地当成完全独立；<\/li><li>激光对应点或回环关联错误；<\/li><li>测量协方差设置得过小；<\/li><li>地图、外参和时间偏移被错误地当成精确真值；<\/li><li>同一传感器信息在滤波和图中被重复计算；<\/li><li>当前线性化点离真实解太远。<\/li><\/ul>\n<p>还要注意单位和尺度。位置用 m，旋转通常用 rad，直接用一个固定数值阈值比较全部Hessian 特征值可能不合理；工程上应结合状态尺度、白化方式和经验数据设定退化阈值。<\/p>\n<p>把 <code>H^-1<\/code> 当成状态协方差还有一组单独的前提，见第 3.3.2 节。<\/p>\n<p>最后还要区分两个矩阵：<\/p>\n<pre class=\"code\"><code>Omega = Sigma_measurement^-1\n  -&gt; 位于测量残差空间，描述传感器测量信息\n\nH_GN = J^T * Omega * J\n  -&gt; 位于状态空间，描述这些测量对状态各方向提供的局部信息<\/code><\/pre>\n<p>所以 Hessian 能反映“有没有足够信息”的完整原因是：雅可比先说明测量能看见哪些状态方向，信息矩阵再按测量噪声给这些方向加权，最后 <code>J^T*Omega*J<\/code> 把所有测量对状态的局部约束累积起来。<\/p><\/section>\n<section class=\"sec\" data-sec=\"3.3.2\"><h3 id=\"s3.3.2\"><span class=\"num\">3.3.2<\/span> 为什么 <code>H^-1<\/code> 不能无条件当成真实协方差？<\/h3>\n<p>第 3.3.1.2 节说明了线性高斯条件下 <code>H = P^-1<\/code>，因此很容易顺手把 <code>H^-1<\/code> 当成状态协方差。但这是一个有条件的局部近似。除了第 3.3.1.6 节列出的“信息可能是假的”几种情况以外，下面这些做法还会让 <code>H^-1<\/code> 本身失去意义：<\/p>\n<ul><li>ICP 对应点错误，或对应关系会随位姿跳变；<\/li><li>鲁棒核大量降权，等效权重已不是标定出的逆协方差；<\/li><li>使用 <code>H + lambda*I<\/code> 后把 LM 阻尼误当成传感器信息；<\/li><li>H 退化，或者位姿图没有固定首帧而存在整体平移、旋转自由度。<\/li><\/ul>\n<p>所以实际系统要同时看局部 SVD、后验协方差、创新一致性和有真值数据时的经验误差，不能只看一个矩阵。<\/p>\n<p>纯相对位姿图整体平移或旋转后，所有相对残差都不变，这叫规范自由度（gauge freedom）。通常要固定第一帧或加入绝对先验后，绝对位姿协方差才有定义。对奇异 H直接使用伪逆还可能把零空间显示成零方差，错误地表达为“完全确定”。<\/p><\/section>", "sections": [{"id": "3.3.1", "title": "Hessian 为什么能反映“有没有足够信息”？"}, {"id": "3.3.2", "title": "为什么 H^-1 不能无条件当成真实协方差？"}]}, {"num": "3.4", "title": "协方差与信息矩阵从哪里来", "html": "<section class=\"sec\" data-sec=\"3.4.0\"><div class=\"callout tip\"><strong>为什么现在学这一章<\/strong>：前面一直假设 Σ 已知。这一章回答它从哪来：样本统计、底层噪声传播、ICP 的 Hessian；为什么 Ω 必须整体求逆；测量空间的 Ω 和状态空间的 H 怎样区分。最后用一个 (x, y, yaw) 位姿图把里程计、回环、Ω 和状态协方差从头推一遍。<\/div><\/section>\n<section class=\"sec\" data-sec=\"3.4.1\"><h3 id=\"s3.4.1\"><span class=\"num\">3.4.1<\/span> 先分清四种“协方差”<\/h3>\n<div class=\"tbl\"><table><thead><tr><th>名称<\/th><th>回答的问题<\/th><\/tr><\/thead><tbody><tr><td>测量/因子协方差<\/td><td>这次传感器测量本身有多不可靠？<\/td><\/tr><tr><td>状态边缘协方差<\/td><td>融合所有信息后，某个状态还有多不确定？<\/td><\/tr><tr><td>交叉协方差<\/td><td>两个状态的误差有多相关？<\/td><\/tr><tr><td>相对位姿协方差<\/td><td>两个位姿之差有多不确定？<\/td><\/tr><\/tbody><\/table><\/div>\n<p>它们不能随意互换。一个激光因子很弱，不代表融合 IMU 和历史信息后的状态一定很弱；两个绝对位姿都不准，也不代表二者相对位姿一定不准，因为共同漂移可能相消。<\/p>\n<p>这四种协方差分别从哪里来、怎样互相变换，见下一节。<\/p><\/section>\n<section class=\"sec\" data-sec=\"3.4.2\"><h3 id=\"s3.4.2\"><span class=\"num\">3.4.2<\/span> 多维情形下，Sigma 和 Omega 究竟从哪里来？<\/h3>\n<p>前面几节一直在用 Sigma 和 Omega：第 2.4.2 节给出了它们的定义，第 2.4.4 节直接假设相关系数是 0.5，第 3.1.4 节用 Omega 组装 Hessian。但有五个问题还没有正面回答：<\/p>\n<pre class=\"code\"><code>1. 多维的 Sigma 在工程上究竟是怎么得到的？\n2. 为什么权重是 Sigma 的整体求逆，而不是每个元素各取倒数？\n3. 同一批不确定度在测量空间和状态空间之间怎样来回变换？\n4. Omega 和 H 的尺寸分别由什么决定？\n5. 换成真实的 (x, y, yaw) 位姿、里程计和回环，这些量各是什么样子？<\/code><\/pre>\n<p>本节逐一回答。结论可以先记住一条链：<\/p>\n<pre class=\"code\"><code>底层传感器噪声（通常是对角的）\n        --经雅可比传播 J*Sigma*J^T--&gt;\n这一条测量的 Sigma_i（通常不再是对角的）\n        --整体求逆--&gt;\n信息矩阵 Omega_i = Sigma_i^-1\n        --经雅可比回拉 J^T*Omega*J 并对所有测量相加--&gt;\n状态空间的信息矩阵 H\n        --求逆--&gt;\n状态协方差 P<\/code><\/pre>\n<h4 id=\"s3.4.2.1\"><span class=\"num\">3.4.2.1<\/span> Sigma 的定义，以及一个可手算的估计<\/h4>\n<p>第 2.4.2 节已经给出定义：若残差 r 是 d 维列向量，<\/p>\n<pre class=\"code\"><code>Sigma = E[(r - E[r]) * (r - E[r])^T]<\/code><\/pre>\n<p>它是 <code>d × d<\/code> 的：对角元素是各分量自己的方差，非对角元素是两个分量的交叉协方差。<\/p>\n<p>“期望”在工程上就是“对很多次重复观测求平均”。假设在同一位置反复测量同一个目标，把 5 次二维残差记录下来（单位 cm）：<\/p>\n<pre class=\"code\"><code>r_1 = ( 2,  1)\nr_2 = (-1,  0)\nr_3 = ( 0, -2)\nr_4 = ( 1,  2)\nr_5 = (-2, -1)<\/code><\/pre>\n<p>样本均值为 <code>(0, 0)<\/code>，所以直接用外积求和。逐项计算三个统计量：<\/p>\n<pre class=\"code\"><code>Σ_i r_x^2     = 4 + 1 + 0 + 1 + 4 = 10\nΣ_i r_y^2     = 1 + 0 + 4 + 4 + 1 = 10\nΣ_i r_x*r_y   = 2 + 0 + 0 + 2 + 2 = 6<\/code><\/pre>\n<p>样本协方差要除以 <code>N-1 = 4<\/code>（除以 N 会低估方差）：<\/p>\n<pre class=\"code\"><code>Sigma\n= (1/4) * [10   6]\n          [ 6  10]\n\n= [2.5  1.5] cm^2\n  [1.5  2.5]<\/code><\/pre>\n<p>相关系数为：<\/p>\n<pre class=\"code\"><code>rho_xy\n= 1.5 / sqrt(2.5*2.5)\n= 0.6<\/code><\/pre>\n<p>这个 <code>0.6<\/code> 不是假设出来的，它是数据本身带来的：<code>r_x<\/code> 偏大时 <code>r_y<\/code> 也倾向于偏大。真实标定当然需要远多于 5 组样本，并且要检查残差是否确实近似零均值、是否随距离或角度变化。<\/p>\n<p>注意两点，免得后面看混：<\/p>\n<ul><li>这 5 组数据是<strong>标定样本<\/strong>，每组 <code>r_i<\/code> 是已知真值下的测量误差，是同一个二维随机量的5 次抽样。它们不是某个优化问题里的 5 条残差，所以这里没有雅可比。<\/li><li>本例测量是二维的，状态也碰巧是二维的。两个“2”撞在一起，容易让人以为 Omega 的尺寸由状态决定；实际上 Omega 跟着测量走，第 3.4.2.7 节专门把这件事拆开讲。<\/li><\/ul>\n<h4 id=\"s3.4.2.2\"><span class=\"num\">3.4.2.2<\/span> 工程上 Sigma 的三个来源<\/h4>\n<div class=\"tbl\"><table><thead><tr><th>来源<\/th><th>做法<\/th><th>适用场合与注意事项<\/th><\/tr><\/thead><tbody><tr><td>直接统计<\/td><td>固定场景重复测量，按上一小节求样本协方差<\/td><td>最可靠，但要求有真值或可重复的参考；样本要覆盖真实工况<\/td><\/tr><tr><td>由底层量传播<\/td><td>底层噪声已知，用 <code>Sigma_out = J*Sigma_in*J^T<\/code> 推出<\/td><td>最常用；非对角项往往就是这样产生的，见下一小节<\/td><\/tr><tr><td>手册加一致性检验<\/td><td>先用数据手册的噪声密度建模，再用 NIS/NEES 校正<\/td><td>起步快，但手册值常偏乐观；必须做第 4.1.3.8 节的一致性检验<\/td><\/tr><\/tbody><\/table><\/div>\n<p>三者经常混用：先用手册值起步，再用传播公式把它换算到残差所在的量，最后用运行数据检查统计量是否符合卡方分布。<\/p>\n<p>不能做的是“为了让某组残差代价变小而随手填一个 Sigma”。协方差一旦填小，第 3.3.1.6 节说的虚假高置信就会出现，而且优化器不会报错。<\/p>\n<h4 id=\"s3.4.2.3\"><span class=\"num\">3.4.2.3<\/span> 例：极坐标测量怎样“长出”非对角项<\/h4>\n<p>第 2.4.4 节直接假设了 y 与 yaw 的相关系数 <code>0.5<\/code>。真实系统中这种非对角项通常不是传感器“自带”的，而是坐标变换产生的。二维激光雷达把极坐标换成直角坐标，就是最典型的例子。<\/p>\n<p>雷达直接测的是距离和方位角，两者的噪声通常可以认为互不相关：<\/p>\n<pre class=\"code\"><code>z_polar = [rho, phi]^T\n\nSigma_polar\n= [sigma_rho^2       0        ]\n  [     0       sigma_phi^2   ]<\/code><\/pre>\n<p>但地图和优化都在直角坐标里进行，所以要做变换：<\/p>\n<pre class=\"code\"><code>x = rho*cos(phi)\ny = rho*sin(phi)<\/code><\/pre>\n<p>这是一个非线性函数，按第 3.1.3 节的办法求雅可比：<\/p>\n<pre class=\"code\"><code>J = [dx/drho   dx/dphi]\n    [dy/drho   dy/dphi]\n\n  = [cos(phi)   -rho*sin(phi)]\n    [sin(phi)    rho*cos(phi)]<\/code><\/pre>\n<p>再用误差传播公式（推导见第 2.4.5 节的 <code>Cov(W*r)=W*Sigma*W^T<\/code>）：<\/p>\n<pre class=\"code\"><code>Sigma_cart = J * Sigma_polar * J^T<\/code><\/pre>\n<p>把 J 拆成“旋转乘缩放”可以看得更清楚：<\/p>\n<pre class=\"code\"><code>J = R(phi) * diag(1, rho)\n\nR(phi) = [cos(phi)  -sin(phi)]\n         [sin(phi)   cos(phi)]<\/code><\/pre>\n<p>因此：<\/p>\n<pre class=\"code\"><code>Sigma_cart\n= R(phi) * diag(sigma_rho^2, rho^2*sigma_phi^2) * R(phi)^T<\/code><\/pre>\n<p>这个式子本身就是答案：**直角坐标下的不确定度椭圆，长短轴分别是径向的<code>sigma_rho<\/code> 和切向的 <code>rho*sigma_phi<\/code>，整体被转到方位角 phi 的方向上。**<\/p>\n<p>代入一组典型数字。取距离 10 m、方位 30 度，<code>sigma_rho = 0.02 m<\/code>，<code>sigma_phi = 0.5 度 = 0.008727 rad<\/code>：<\/p>\n<pre class=\"code\"><code>径向 sigma = 0.02 m\n切向 sigma = 10 * 0.008727 = 0.0873 m<\/code><\/pre>\n<p>所以椭圆是一个“沿视线方向很窄、垂直视线方向很宽”的长条。展开成矩阵：<\/p>\n<pre class=\"code\"><code>cos(30度) = 0.8660,  sin(30度) = 0.5\n\nJ = [0.8660   -5.0000]\n    [0.5000    8.6603]\n\nSigma_cart\napproximately_equals\n[ 0.002204   -0.003124] m^2\n[-0.003124    0.005812]<\/code><\/pre>\n<p>相关系数为：<\/p>\n<pre class=\"code\"><code>rho_xy\n= -0.003124 / sqrt(0.002204*0.005812)\napproximately_equals -0.873<\/code><\/pre>\n<p>原始噪声完全独立，变换之后却出现了 <code>-0.873<\/code> 的强相关。把方位角换几个值，可以看到椭圆形状不变、只是转了个方向：<\/p>\n<div class=\"tbl\"><table><thead><tr><th>方位角 phi<\/th><th><code>Sigma_cart<\/code> 的 <code>rho_xy<\/code><\/th><th>椭圆长/短半轴<\/th><th>长轴方向<\/th><\/tr><\/thead><tbody><tr><td>0 度<\/td><td>0<\/td><td>0.0873 / 0.0200 m<\/td><td>90 度<\/td><\/tr><tr><td>30 度<\/td><td>-0.873<\/td><td>0.0873 / 0.0200 m<\/td><td>120 度<\/td><\/tr><tr><td>45 度<\/td><td>-0.900<\/td><td>0.0873 / 0.0200 m<\/td><td>135 度<\/td><\/tr><tr><td>90 度<\/td><td>0<\/td><td>0.0873 / 0.0200 m<\/td><td>180 度<\/td><\/tr><\/tbody><\/table><\/div>\n<p>只有当椭圆长轴正好与坐标轴平行时（0 度和 90 度），非对角项才为零。所以“x、y 误差相关”通常不代表传感器内部有什么耦合，只代表<strong>误差椭圆的方向与坐标轴不平行<\/strong>。第 2.4.4 节 y 与 yaw 之间的相关则来自另一种雅可比变换：朝向误差乘以行驶距离变成横向误差，推导见第 3.4.2.8 节。<\/p>\n<p>同样的道理也适用于别处：轮速里程计的 <code>(x, y, yaw)<\/code> 协方差、相机像素噪声传播到三维点的协方差、第 3.5.13 节的相对位姿协方差，非对角项都来自这一步雅可比变换。轮速里程计的完整推导见第 3.4.2.8 节。<\/p>\n<h4 id=\"s3.4.2.4\"><span class=\"num\">3.4.2.4<\/span> 为什么 Omega 是整体求逆，而不是逐元素取倒数<\/h4>\n<p>先回到密度。d 维零均值高斯的概率密度是：<\/p>\n<pre class=\"code\"><code>p(r)\n= 1 / sqrt((2*pi)^d * det(Sigma))\n  * exp(-0.5 * r^T * Sigma^-1 * r)<\/code><\/pre>\n<p>取负对数并丢掉与状态无关的常数（第 2.4.8 节已经做过这一步），剩下的就是：<\/p>\n<pre class=\"code\"><code>0.5 * r^T * Sigma^-1 * r<\/code><\/pre>\n<p><strong><code>Sigma^-1<\/code> 是直接从高斯密度的指数里抄下来的，不是谁规定的权重。<\/strong> 一维时<code>Sigma^-1 = 1/sigma^2<\/code>，正好退化成大家熟悉的“除以方差”；多维时它就是矩阵求逆。<\/p>\n<p>用上一小节的样本协方差验证“逐元素取倒数”为什么不对：<\/p>\n<pre class=\"code\"><code>Sigma = [2.5  1.5]\n        [1.5  2.5]\n\ndet(Sigma) = 2.5*2.5 - 1.5*1.5 = 4\n\nOmega = Sigma^-1\n      = (1/4) * [ 2.5  -1.5]\n                [-1.5   2.5]\n\n      = [ 0.625  -0.375] cm^-2\n        [-0.375   0.625]<\/code><\/pre>\n<p>而逐元素取倒数会得到：<\/p>\n<pre class=\"code\"><code>错误做法：\n[1/2.5   1/1.5]   [0.400   0.667]\n[1/1.5   1/2.5] = [0.667   0.400]<\/code><\/pre>\n<p>两者不仅数值不同，<strong>非对角项连符号都相反<\/strong>。检验哪个正确只要做一次乘法：<\/p>\n<pre class=\"code\"><code>Sigma * Omega = [1  0]      正确\n                [0  1]<\/code><\/pre>\n<p>逐元素取倒数的结果乘回去不会得到单位阵。<\/p>\n<p>非对角项变号是有物理含义的，值得单独记住：<\/p>\n<pre class=\"code\"><code>Sigma 的非对角项为正  -&gt;  两个分量倾向于同向偏\nOmega 的非对角项为负  -&gt;  同向偏的组合受到的惩罚被减小<\/code><\/pre>\n<p>这正是第 2.4.4 节数值例子的来源：那里 <code>Sigma<\/code> 中 y 与 yaw 的非对角是 <code>+0.005<\/code>，求逆后 <code>Omega<\/code> 对应的非对角是 <code>-66.667<\/code>，于是同号残差 A 的代价降到 1.333、反号残差 B 的代价升到 4.000。如果按逐元素取倒数，这个区别会完全消失。<\/p>\n<p>还有两个边界要注意：<\/p>\n<ul><li><code>Sigma<\/code> 必须正定才能求逆。若某个方向方差被设成 0，或两个残差分量完全线性相关，<code>Sigma<\/code> 奇异，此时应删除重复分量或在有效子空间里用伪逆，而不是硬求逆。<\/li><li>数值上不要显式算 <code>Sigma^-1<\/code> 再做乘法。用 Cholesky 分解 <code>Sigma = L*L^T<\/code> 之后解三角方程即可，这也正是第 2.4.5 节白化的做法。<\/li><\/ul>\n<h4 id=\"s3.4.2.5\"><span class=\"num\">3.4.2.5<\/span> Sigma 前推与 Omega 回拉：两种二次型不能互换<\/h4>\n<p>到这里出现了两个形状很像的式子，必须分清：<\/p>\n<pre class=\"code\"><code>A * Sigma * A^T      协方差前推\nA^T * Omega * A      信息回拉<\/code><\/pre>\n<p>设 <code>A<\/code> 是 <code>m × n<\/code>（m 是测量维数，n 是状态维数），关键在于<strong>中间那个矩阵属于哪个空间<\/strong>：<\/p>\n<div class=\"tbl\"><table><thead><tr><th><\/th><th><code>A * Sigma * A^T<\/code><\/th><th><code>A^T * Omega * A<\/code><\/th><\/tr><\/thead><tbody><tr><td>中间矩阵<\/td><td><code>Sigma<\/code>，<code>n × n<\/code>，状态空间<\/td><td><code>Omega<\/code>，<code>m × m<\/code>，测量空间<\/td><\/tr><tr><td>结果<\/td><td><code>m × m<\/code>，测量空间<\/td><td><code>n × n<\/code>，状态空间<\/td><\/tr><tr><td>方向<\/td><td>状态不确定度 → 测量<\/td><td>测量信息 → 状态<\/td><\/tr><tr><td>回答<\/td><td>预测的测量有多不确定<\/td><td>这些测量把状态定住了多少<\/td><\/tr><tr><td>出处<\/td><td>1.6.5、2.7.3、3.19、5.2、5.3.1<\/td><td>2.2、2.4.3、6.5.1<\/td><\/tr><\/tbody><\/table><\/div>\n<p>两者的中间矩阵维数不同，所以多数情况下<strong>连乘法都做不成<\/strong>。用第 3.3.1.4 节那面墙验证：状态是 <code>(x, y, theta)<\/code>，取墙上偏左 1 m 的那个激光点 <code>p = (2, 1)<\/code>，残差是一维的点到墙距离。<\/p>\n<pre class=\"code\"><code>J = [1, 0, -1]                    1 × 3\nOmega = 1/0.1^2 = 100             1 × 1，测量空间\nP = diag(0.01, 0.04, 0.0025)      3 × 3，状态空间（sigma = 0.1 m, 0.2 m, 0.05 rad）<\/code><\/pre>\n<p>信息回拉：<\/p>\n<pre class=\"code\"><code>J^T * Omega * J\n= [ 100   0  -100]        3 × 3\n  [   0   0     0]\n  [-100   0   100]\n\n特征值 {200, 0, 0}<\/code><\/pre>\n<p>一个点只提供一个方向的信息，它约束的是 x 与 theta 的一个组合：机器人往前挪一点、同时左转同样多，这个偏左的点可以仍然留在墙上。y 和这个组合方向都没有信息。<\/p>\n<p>协方差前推：<\/p>\n<pre class=\"code\"><code>J * P * J^T = 0.01 + 0.0025 = [0.0125]          1 × 1\n\n预测点到墙距离的 sigma = 0.112 m<\/code><\/pre>\n<p>两个结果回答的是完全不同的问题：前者说“这条测量只定住了一个方向”，后者说“我预测出来的这个距离本身有 0.112 m 的不确定度”。其中 0.1 m 来自 x；另一部分来自yaw：这个点偏在左侧 1 m，车头 0.05 rad 的不确定度会让它沿墙的法向晃动约 0.05 m。y 方向 0.2 m 的不确定度则根本没有出现在前推结果里，因为这条测量看不见 y。<\/p>\n<p>如果把 <code>Omega<\/code> 塞进前推的位置，<code>J * Omega * J^T<\/code> 会因为维数不匹配直接报错；反过来把 <code>P<\/code> 塞进回拉的位置也一样。即使 <code>A<\/code> 恰好是方阵、两个式子都能算，结果一般也不同：<\/p>\n<pre class=\"code\"><code>A = [2  1]        Omega = [4  1]\n    [0  3]                [1  9]\n\nA^T * Omega * A = [16  14]        A * Omega * A^T = [29  33]\n                  [14  91]                          [33  81]<\/code><\/pre>\n<p>迹分别是 107 和 110。有意思的是两者行列式相同（都等于<code>det(A)^2 * det(Omega) = 1260<\/code>），而且都是对称半正定的，所以<strong>不能靠对称性或行列式判断自己有没有写反<\/strong>。<\/p>\n<p>最可靠的自查是量纲。设状态是米、测量是像素，则 <code>J<\/code> 的量纲是 <code>pixel/m<\/code>：<\/p>\n<pre class=\"code\"><code>J^T * Omega * J :  (pixel/m)^2 * (1/pixel^2) = 1/m^2      状态方差的倒数\nJ * Sigma  * J^T:  (pixel/m)^2 * m^2         = pixel^2    测量的方差<\/code><\/pre>\n<p>量纲对不上，基本就是这两个写反了。<\/p>\n<p>顺带说明二者的关系：若 <code>A<\/code> 可逆，令 <code>Sigma = Omega^-1<\/code>，则<\/p>\n<pre class=\"code\"><code>(A * Sigma * A^T)^-1 = (A^-1)^T * Omega * A^-1<\/code><\/pre>\n<p>也就是说“前推再求逆”等价于用 <strong>A 的逆<\/strong> 做回拉，而不是用 A 本身。这就是随手交换转置位置会出错的根本原因。<\/p>\n<p>第 4.1.3.3 节的卡尔曼更新里两种形式会同时出现，可以对照着看：<\/p>\n<pre class=\"code\"><code>S_k = H_k * P_k^- * H_k^T + R_k                  前推，m × m，用于增益和卡方门控\n\n(P_k^+)^-1 = (P_k^-)^-1 + H_k^T * R_k^-1 * H_k   回拉，n × n，&quot;后验信息 = 预测信息 + 测量信息&quot;<\/code><\/pre>\n<h4 id=\"s3.4.2.6\"><span class=\"num\">3.4.2.6<\/span> 完整例子：两条观测怎样合成一个状态协方差<\/h4>\n<p>把前面几步串起来。机器人的位置和朝向都未知：<\/p>\n<pre class=\"code\"><code>state = [x, y, theta]^T<\/code><\/pre>\n<p>地图中有两个位置已知的地标，机器人用二维激光各观测一次。每次观测在极坐标下给出距离和方位，噪声仍取 <code>sigma_rho = 0.02 m<\/code>、<code>sigma_phi = 0.5 度<\/code>，两个地标距离都是10 m。下面在 <code>state = (0, 0, 0)<\/code> 附近线性化。<\/p>\n<p>第一步，把每条观测的协方差按第 3.4.2.3 节换算到机体系的直角坐标：<\/p>\n<pre class=\"code\"><code>Sigma_i = R(phi_i) * diag(0.02^2, (10*0.008727)^2) * R(phi_i)^T<\/code><\/pre>\n<p>第二步，整体求逆得到各自的信息矩阵：<\/p>\n<pre class=\"code\"><code>Omega_i = Sigma_i^-1          2 × 2<\/code><\/pre>\n<p>第三步，写出残差并求雅可比。把第 i 个地标在地图中的位置记为 <code>L_i<\/code>。激光测到的是地标在<strong>机器人坐标系<\/strong>里的位置，所以预测值要先平移、再转到机体系：<\/p>\n<pre class=\"code\"><code>h_i(state) = R(theta)^T * (L_i - p)          p = (x, y)\n\nr_i(state) = z_i - h_i(state)<\/code><\/pre>\n<p>对 state 求导（推导与第 3.4.2.7 节例二相同），在 <code>theta = 0<\/code>、<code>p = (0, 0)<\/code> 处：<\/p>\n<pre class=\"code\"><code>J_i = d r_i / d state = [1   0   -L_iy]          2 × 3\n                        [0   1    L_ix]<\/code><\/pre>\n<p>前两列是单位阵：机器人平移，地标在机体系里就反向平移。第三列来自朝向：机器人转过 <code>delta_theta<\/code>，10 m 外的地标在机体系里横移约 <code>10 * delta_theta<\/code>。距离越远，同样的朝向误差造成的横移越大，这个比例因子可以叫“杠杆臂”，后面还会反复出现。<\/p>\n<p>第四步，按第 3.1.4 节把信息累加到状态空间：<\/p>\n<pre class=\"code\"><code>H = Σ_i J_i^T * Omega_i * J_i          3 × 3<\/code><\/pre>\n<p>每条测量是 2 维，状态是 3 维，所以 J_i 不是方阵，Omega_i 与 H 的尺寸也不同，第3.4.2.7 节专门讨论这件事。<\/p>\n<p>第五步，求逆得到位姿的后验协方差：<\/p>\n<pre class=\"code\"><code>P = H^-1          3 × 3<\/code><\/pre>\n<p>现在比较两种几何布置。<strong>情形一：两个地标方位正交（0 度和 90 度），即<code>L_1 = (10, 0)<\/code>、<code>L_2 = (0, 10)<\/code>。<\/strong><\/p>\n<pre class=\"code\"><code>Omega_1 = [2500.0     0.0]        Omega_2 = [ 131.3     0.0]\n          [   0.0   131.3]                  [   0.0  2500.0]\n\nJ_1 = [1  0   0]                   J_2 = [1  0  -10]\n      [0  1  10]                         [0  1    0]<\/code><\/pre>\n<p>第一个地标的距离方向是 x，所以它在 x 上信息很强（2500）、在横向上很弱（131.3）；第二个地标正好相反。把两条测量拉回状态空间再相加：<\/p>\n<pre class=\"code\"><code>H = [ 2631.3       0.0   -1313.1]\n    [    0.0    2631.3    1313.1]\n    [-1313.1    1313.1   26262.5]\n\nH 的特征值 = {2486.3, 2631.3, 26407.5}，条件数 = 10.6\n\n后验 sigma_x = sigma_y = 0.0197 m\n后验 sigma_theta       = 0.0063 rad（约 0.36 度）<\/code><\/pre>\n<p>朝向的信息只来自两个地标的切向分量：<code>26262.5 = 2 * 131.3 * 10^2<\/code>。每个地标切向0.0873 m 的不确定度，除以 10 m 的杠杆臂，约为 0.0087 rad；两个地标合起来约为0.0063 rad。位置几乎不受朝向未知的影响：如果假设朝向已知、只估计 (x, y)，结果是<code>sigma_x = sigma_y = 0.0195 m<\/code>，与现在的 0.0197 m 相差无几。<\/p>\n<p><strong>情形二：两个地标方位接近（0 度和 5 度）。<\/strong><\/p>\n<pre class=\"code\"><code>H = [4982.0     205.7    -114.4]\n    [ 205.7     280.6    2621.2]\n    [-114.4    2621.2   26262.5]\n\nH 的特征值 = {9.4, 4991.0, 26524.7}，条件数 = 2816\n\n后验 sigma_x     = 0.0200 m\n后验 sigma_y     = 0.3239 m\n后验 sigma_theta = 0.0330 rad<\/code><\/pre>\n<p>观测次数完全一样，每条观测的精度也完全一样，但横向不确定度从 2 cm 涨到了 32 cm。最小特征值 9.4 对应的方向约为 <code>(-0.04, 0.99, -0.10)<\/code>：机器人向左平移，同时向右转一点，两个几乎都在正前方的地标在机体系里看起来就几乎没动。<\/p>\n<p>这里最值得注意的是<strong>朝向未知带来的差别<\/strong>。同样是情形二，如果假设朝向已知、只估计(x, y)，横向 sigma 是 0.0606 m；把朝向也放进状态以后，横向 sigma 变成 0.3239 m，差了 5 倍多。原因就是上面那个“平移加转动”的弱方向：朝向已知时，它被冻住了；朝向未知时，它就成了一个几乎不可观的方向。只用二维位置做例子，会系统性地低估这种退化。<\/p>\n<figure class=\"still\"><img loading=\"lazy\" src=\"img/static/covariance-origin.png\" alt=\"极坐标噪声传播成直角坐标椭圆，以及两个地标信息叠加的两种结果\"><figcaption>极坐标噪声传播成直角坐标椭圆，以及两个地标信息叠加的两种结果<\/figcaption><\/figure>\n<blockquote>图注：(a) 传感器的距离和方位噪声本来互不相关，经雅可比变换后在直角坐标里出现了 <code>-0.873<\/code> 的强相关，椭圆长轴垂直于视线。(b)(c) 两条观测的精度相同，只因为方位是否正交，位置后验椭圆就从近似圆变成横向拉长十几倍；虚线是假设朝向已知时的椭圆，朝向未知让情形二的横向不确定度又放大了 5 倍多。<\/blockquote>\n<p>这个例子把本节和前面几节连了起来：<\/p>\n<pre class=\"code\"><code>2.7.3  底层噪声经 J*Sigma*J^T 变成每条测量的 Sigma_i（出现非对角项）\n2.7.4  整体求逆得到 Omega_i（非对角项变号）\n2.2    经 J^T*Omega*J 回拉并相加，得到状态空间的 H\n2.4.5  看 H 的特征值，判断哪个方向信息不足\n2.4.2  在条件成立时对 H 求逆，得到状态协方差 P<\/code><\/pre>\n<p>情形二也正是第 7.1 章长走廊退化的低维版本：那里所有墙面法向几乎同向，相当于所有观测的强信息方向都重合，纵向始终补不上。区别只是走廊里的弱方向更接近完全不可观，而这里还留下了 <code>sigma_y = 0.32 m<\/code> 的有限约束。<\/p>\n<h4 id=\"s3.4.2.7\"><span class=\"num\">3.4.2.7<\/span> 维数别混：Omega 跟着测量走，H 跟着状态走<\/h4>\n<p>第 3.4.2.6 节里，每条测量 2 维、状态 3 维，<code>Omega_i<\/code> 是 2 × 2，H 是 3 × 3，两者尺寸已经不同。但如果只估计二维位置，测量是二维的，状态也恰好是二维的，<code>J_i<\/code> 还正好是单位阵，<code>Omega_i<\/code> 和 H 就不仅尺寸相同，H 还直接等于各个 <code>Omega_i<\/code> 之和。这很容易让人得出一个错误结论：<\/p>\n<pre class=\"code\"><code>错误理解：Omega 与状态量相关，状态是 n 维，Omega 就是 n × n<\/code><\/pre>\n<p>正确的对应关系是：<\/p>\n<pre class=\"code\"><code>                             维数          住在哪个空间\nOmega_i                   d_i × d_i       测量空间：第 i 条测量有几个分量\nJ_i                       d_i × n         桥：从状态空间映到测量空间\nH = Σ_i J_i^T*Omega_i*J_i   n × n         状态空间<\/code><\/pre>\n<p>也就是说，<strong>Omega 的尺寸由测量决定，真正与状态维数一致的 <code>n × n<\/code> 矩阵是 H<\/strong>。<\/p>\n<h5>先分清“标定”和“估计”<\/h5>\n<p>第 3.4.2.1 节那 5 组数据做的是<strong>标定<\/strong>：同一个二维测量在已知真值的位置重复测了 5 次，每组 <code>r_i<\/code> 是相对真值的测量误差。它们是同一个二维随机量的 5 次抽样，用来统计这个测量的 <code>Sigma<\/code>，不构成一个优化问题，所以那里也没有雅可比。<\/p>\n<p>如果改做<strong>估计<\/strong>——拿这 5 次测量去估计未知位置 <code>(x, y)<\/code>——维数是这样的：<\/p>\n<pre class=\"code\"><code>每次测量 2 维，共 5 次       -&gt;  堆叠残差 10 维\n\nJ        = [I; I; I; I; I]      10 × 2     每次测量直接观测 x、y，所以每块是 I\n大 Omega = 5 个 2×2 块的块对角    10 × 10    测量空间\nH        = J^T * Omega * J       2 × 2      状态空间<\/code><\/pre>\n<p>注意 J 是 <code>10 × 2<\/code>，不是 <code>5 × 2<\/code>：每次测量本身有两个分量，所以贡献两行。把第 3.4.2.4 节求出的单次信息矩阵代入：<\/p>\n<pre class=\"code\"><code>Omega_单次 = [ 0.625  -0.375] cm^-2\n             [-0.375   0.625]\n\nH = 5 * Omega_单次\n  = [ 3.125  -1.875] cm^-2\n    [-1.875   3.125]\n\nP = H^-1\n  = [0.5  0.3] cm^2  = Sigma_单次 / 5\n    [0.3  0.5]<\/code><\/pre>\n<p>五次独立测量的信息相加，方差缩小到五分之一，符合直觉。这里 H 又碰巧等于<code>5 * Omega_单次<\/code>，原因仍是每块 <code>J_i = I<\/code>；大 Omega 本身是 <code>10 × 10<\/code> 的。<\/p>\n<p>如果把状态换成 <code>(x, y, theta)<\/code>，这 5 次位置测量仍然是 10 维残差、10 × 10 的大Omega，只是 J 多出一列：<\/p>\n<pre class=\"code\"><code>J = [I_2  0; I_2  0; I_2  0; I_2  0; I_2  0]      10 × 3，第三列全是 0\n\nH = J^T * Omega * J = [ 3.125  -1.875   0]        3 × 3\n                      [-1.875   3.125   0]\n                      [ 0       0       0]<\/code><\/pre>\n<p>H 的第三行、第三列全是 0，求不了逆：位置测量看不见朝向，测多少次都一样。朝向必须由别的测量来提供，例如地标方位、墙线倾角或里程计。<\/p>\n<h5>用维数不相等的例子把两者拆开<\/h5>\n<p><strong>例一：墙上的一个点。测量 1 维，状态 3 维。<\/strong> 这就是第 3.3.1.4 节正前方那个点：<\/p>\n<pre class=\"code\"><code>J     = [1, 0, 0]         1 × 3\nOmega = [100]             1 × 1     只有一个点到墙距离\nH     = [100  0  0]       3 × 3\n        [  0  0  0]\n        [  0  0  0]<\/code><\/pre>\n<p>状态是三维的，Omega 却只有 <code>1 × 1<\/code>。<\/p>\n<p><strong>例二：看一个地标来定位姿。测量 2 维，状态 3 维。<\/strong><\/p>\n<p>状态是 <code>(x, y, theta)<\/code>。机器人当前估计在原点、朝向 0；地标在地图中的位置已知，为<code>L = (3, 4)<\/code>。测量是地标在机器人机体系下的二维坐标，预测值为：<\/p>\n<pre class=\"code\"><code>h(x, y, theta) = R(theta)^T * (L - p)\n\nR(theta)^T = [ cos(theta)   sin(theta)]\n             [-sin(theta)   cos(theta)]<\/code><\/pre>\n<p>对三个状态分量求导。对位置求导得到 <code>-R(theta)^T<\/code>；对朝向求导时：<\/p>\n<pre class=\"code\"><code>d R(theta)^T / d theta = [-sin(theta)   cos(theta)]\n                         [-cos(theta)  -sin(theta)]<\/code><\/pre>\n<p>在 <code>theta = 0<\/code>、<code>p = (0, 0)<\/code> 处代入：<\/p>\n<pre class=\"code\"><code>d h / d p     = -I\n\nd h / d theta = [ 0  1] * [3] = [ 4]\n                [-1  0]   [4]   [-3]<\/code><\/pre>\n<p>残差按 <code>r = z - h<\/code> 定义，所以残差雅可比取负号：<\/p>\n<pre class=\"code\"><code>J_r = [1  0  -4]          2 × 3\n      [0  1   3]<\/code><\/pre>\n<p>若测量标准差为 0.1 m，则：<\/p>\n<pre class=\"code\"><code>Omega = diag(100, 100)    2 × 2     测量是二维的\n\nH = J_r^T * Omega * J_r\n  = [ 100     0   -400]\n    [   0   100    300]   3 × 3     状态是三维的\n    [-400   300   2500]<\/code><\/pre>\n<p>H 的特征值为 <code>{0, 100, 2600}<\/code>，秩只有 2。一条二维测量最多只能提供两个方向的信息，所以三维状态必然剩下一个方向没有约束。解 <code>J_r * v = 0<\/code> 得到这个方向：<\/p>\n<pre class=\"code\"><code>v = (4, -3, 1)<\/code><\/pre>\n<p>它有很直观的物理含义：<strong>机器人绕着地标转圈<\/strong>。机器人绕 L 转过小角度 <code>d theta<\/code> 时，位置的变化是：<\/p>\n<pre class=\"code\"><code>d p = d theta * [-(p_y - L_y), p_x - L_x]\n    = d theta * [-(0 - 4), 0 - 3]\n    = d theta * (4, -3)<\/code><\/pre>\n<p>与 v 完全一致。绕地标转圈时，地标在机体系里看起来一动不动，测量分辨不出机器人到底在圆周上的哪个位置。<\/p>\n<p><strong>例三：再看一个地标。测量 4 维，状态 3 维。<\/strong> 加入第二个地标 <code>(-2, 5)<\/code>，同样求导并堆叠：<\/p>\n<pre class=\"code\"><code>J: 4 × 3      Omega: 4 × 4      H: 3 × 3\n\nH 的特征值 = {46.8, 200.0, 5553.2}，秩 = 3<\/code><\/pre>\n<p>三个方向都有了约束。对比例二和例三可以看到：<strong>测量越多，Omega 越大，H 始终是<code>3 × 3<\/code><\/strong>。<\/p>\n<h5>记忆和自查<\/h5>\n<pre class=\"code\"><code>Omega  回答：这条测量本身有多准？          测量有几维，它就几维\nH      回答：所有测量合起来把状态定住多少？  状态有几维，它就几维\nJ      是两者之间的桥                      行数 = 测量维数，列数 = 状态维数<\/code><\/pre>\n<p>检查时只看一条：在 <code>J^T * Omega * J<\/code> 里，Omega 夹在两个 J 中间，所以它的尺寸必须等于<strong>J 的行数<\/strong>，也就是测量维数。<\/p>\n<p>还有一个很有用的推论：H 的秩不会超过所有测量的总维数。测量总维数小于状态维数时（例一、例二），H 必然奇异、必然存在不可观方向。第 7.1 章的长走廊退化，就是这个代数事实在真实场景里的表现：测量点虽然很多，但它们提供的独立方向不够。<\/p>\n<h4 id=\"s3.4.2.8\"><span class=\"num\">3.4.2.8<\/span> 用 (x, y, yaw) 从头推一遍：里程计、回环、Omega 与状态协方差<\/h4>\n<p>前面各节的例子已经用 <code>(x, y, yaw)<\/code> 做状态，但每次只估计一个位姿，测量也只有一两种。真实的 SLAM 后端要同时估计多个位姿，测量既有连接相邻位姿的里程计，也有跨越很远的回环。本节用两条轮速里程计和一条激光回环组成一个最小的位姿图，把下面几件事从头推一遍：<\/p>\n<pre class=\"code\"><code>1. 一条里程计测量的 3 × 3 Sigma 从哪里来，为什么 y 和 yaw 相关\n2. 一条回环测量的 3 × 3 Sigma、Omega 从哪里来\n3. 残差、雅可比、大 Omega、H 各是多大，每一块长什么样\n4. 状态协方差 P 的两种求法：协方差前推与 H 求逆，为什么结果相同\n5. 加入回环以后 P 怎样变化，为什么回环没连到的 X_1 也变准了\n6. 为什么不能把 H 的对角块求逆当成某个位姿的协方差\n7. 首帧不固定时 H 为什么求不了逆<\/code><\/pre>\n<p>所有数字都可以手算，本节末尾附了复算脚本。<\/p>\n<h5>第 0 步：题目<\/h5>\n<p>在时刻 <code>t_k<\/code>，机器人的状态是普通位姿量；带 <code>Δ<\/code> 的量表示从 <code>t_k<\/code> 到<code>t_(k+1)<\/code> 这段时间内的里程计增量，不是另一种绝对位姿：<\/p>\n<pre class=\"code\"><code>X_k = (x_k, y_k, theta_k)        theta_k 是 t_k 时刻的 yaw，单位 rad\nwheel_k = (Δs_k, Δtheta_k)       Δs_k、Δtheta_k 属于区间 [t_k, t_(k+1)]<\/code><\/pre>\n<p>对平面轮式机器人，一个常用的中点积分近似是：<\/p>\n<pre class=\"code\"><code>x_(k+1)     ≈ x_k + Δs_k*cos(theta_k + Δtheta_k/2)\ny_(k+1)     ≈ y_k + Δs_k*sin(theta_k + Δtheta_k/2)\ntheta_(k+1) = wrap(theta_k + Δtheta_k)<\/code><\/pre>\n<p>这里 <code>Δs_k<\/code> 是区间内机器人中心沿行进方向的有符号路程，<code>Δtheta_k<\/code> 是该区间的净转角。例如理想无侧滑的差速轮机器人，左右轮在这段时间的路程为<code>Δs_L,k<\/code>、<code>Δs_R,k<\/code>，轮距为 <code>b<\/code>，则：<\/p>\n<pre class=\"code\"><code>Δs_k     = (Δs_R,k + Δs_L,k)/2\nΔtheta_k = (Δs_R,k - Δs_L,k)/b<\/code><\/pre>\n<p>中点式用中间朝向的一段直线近似弧线；有限转角时它把弧长 <code>Δs_k<\/code> 近似当成起终点位移长度，两者实际上会有差别。本例只用直行，<code>Δtheta_k=0<\/code>时没有这项近似误差。位姿图把区间运动表达在起点 <code>X_k<\/code> 的机体系中。由两个状态预测的相对位姿是：<\/p>\n<pre class=\"code\"><code>[Δx_k, Δy_k]^T = R(theta_k)^T * [x_(k+1)-x_k, y_(k+1)-y_k]^T\nΔtheta_k = wrap(theta_(k+1)-theta_k)<\/code><\/pre>\n<p>轮速里程计给出带噪声的相对测量 <code>z_(k,k+1)≈(Δx_k,Δy_k,Δtheta_k)<\/code>；位姿图残差比较测量和上面的状态预测。本手算例让两者在所选线性化点恰好相同。<\/p>\n<p>现在从原点出发，在 <code>[t_0,t_1]<\/code> 和 <code>[t_1,t_2]<\/code> 两段时间里各直行<code>Δs_0=Δs_1=1 m<\/code>，净转角均为 0，于是：<\/p>\n<pre class=\"code\"><code>X_0 = (0, 0, 0)     固定，不参与优化\nX_1 = (1, 0, 0)     线性化点（由里程计累加得到）\nX_2 = (2, 0, 0)     线性化点<\/code><\/pre>\n<p>一共三条测量，都是“从位姿 i 看位姿 j”的相对位姿，在位姿 i 的机体坐标系里表达：<\/p>\n<pre class=\"code\"><code>z_01 = (1, 0, 0)     轮速里程计  X_0 -&gt; X_1\nz_12 = (1, 0, 0)     轮速里程计  X_1 -&gt; X_2\nz_02 = (2, 0, 0)     激光回环    X_0 -&gt; X_2（X_2 处的扫描与 X_0 的关键帧匹配成功）\n\nX_0 --odom--&gt; X_1 --odom--&gt; X_2\n |                            |\n +----------- loop -----------+<\/code><\/pre>\n<p>测量值与线性化点完全一致，所有残差都是 0。这是有意的：<strong>在同一个线性化点，H 和 P只由雅可比和 Omega 决定，与测量值无关<\/strong>；测量值只影响估计出来的均值，测量互相矛盾时怎样分摊见第 4.2.4 节。这样本节可以只看不确定度。<\/p>\n<p>轨迹取直线、朝向取 0，是为了让矩阵里的数都是整数。直线时 x 与 (y, yaw) 恰好解耦，这只是直线的特例；机器人一转弯，三个分量就全部耦合，见本节后面的“变体”。<\/p>\n<p>先把维数列出来：<\/p>\n<pre class=\"code\"><code>待估状态  state_vec = (x_1, y_1, theta_1, x_2, y_2, theta_2)      n = 6\n测量      3 条，每条 3 维                                  堆叠残差 9 维\nJ         9 × 6\n大 Omega  9 × 9，由三个 3 × 3 块组成\nH、P      6 × 6<\/code><\/pre>\n<h5>第 1 步：里程计的 Sigma_odom 从哪里来<\/h5>\n<p>上面的 <code>Δs_k<\/code>、<code>Δtheta_k<\/code> 说明了时间区间里的实际里程计输入。如果直接对这两个增量的中点式传播误差，在起点机体系中有<code>Δx≈Δs*cos(Δtheta/2)<\/code>、<code>Δy≈Δs*sin(Δtheta/2)<\/code>；在本例直行的<code>Δs=1 m<\/code>、<code>Δtheta=0<\/code> 处，对 <code>(Δs,Δtheta)<\/code> 求导得到：<\/p>\n<pre class=\"code\"><code>G_wheel = [1  0   ]\n          [0  Δs/2]\n          [0  1   ]<\/code><\/pre>\n<p>这两个输入若是仅有的两个独立噪声源，<code>G_wheel*Sigma_wheel*G_wheel^T<\/code>最多秩为 2，不能直接当作可逆的三维相对位姿协方差。在直行点，侧向误差和朝向误差都只来自同一个 <code>δ(Δtheta)<\/code>，其相关系数会是 1。实际系统可以把侧滑等额外不确定度纳入模型。<\/p>\n<p>为完成下面需要 <code>Omega_odom=Sigma_odom^-1<\/code> 的位姿图手算，本步另用“先转 <code>alpha_1<\/code>、平移 <code>s<\/code>、再转 <code>alpha_2<\/code>”来<strong>等效表示同一个区间的起终点相对位姿<\/strong>，以构造一个易于手算的 3×3 测量协方差（《Probabilistic Robotics》中的里程计运动模型）。它不声称机器人实际先原地转、再直行、最后原地转。在起点机体系中，<code>s=sqrt(Δx^2+Δy^2)<\/code> 是起终点位移的长度；直行时它等于轮编码器得到的 <code>Δs_k<\/code>，转弯时一般不等于沿弧线走过的路程。<code>alpha_1<\/code> 是起始朝向到位移方向的转角，<code>alpha_2<\/code> 是位移方向到最终朝向的转角。平面旋转满足<code>R(alpha_1)*R(alpha_2)=R(alpha_1+alpha_2)<\/code>，所以净朝向变化是两次转角之和（朝向按 <code>2*pi<\/code> 周期理解）：<\/p>\n<pre class=\"code\"><code>Δx     = s * cos(alpha_1)\nΔy     = s * sin(alpha_1)\nΔtheta = alpha_1 + alpha_2<\/code><\/pre>\n<p>例如先转 <code>+30<\/code> 度，走完后再转 <code>-10<\/code> 度，位移方向是 <code>30<\/code> 度，但最终朝向只比起点多 <code>20<\/code> 度。若已知相对位姿且 <code>s&gt;0<\/code>，也可以反过来定义：<\/p>\n<pre class=\"code\"><code>s       = sqrt(Δx^2 + Δy^2)\nalpha_1 = atan2(Δy, Δx)\nalpha_2 = wrap(Δtheta - alpha_1)<\/code><\/pre>\n<p>因此，<code>Δtheta<\/code> 仍是同一时间区间的净转角，<code>alpha_1<\/code>、<code>alpha_2<\/code> 是相对位姿的一种分解；它们不是轮编码器分别测到的两个量。<code>s=0<\/code> 的纯原地旋转时，位移方向未定义，需要单独约定。为简化本例的协方差手算，假设这三个分解量的噪声互相独立。这是给位姿图示例选定的误差模型，并非只用两个轮增量就必然得到三个独立噪声；真实系统应从轮速、侧滑等误差来源建模和标定：<\/p>\n<p>下面的 <code>Sigma_u<\/code> 是等效分解量 <code>(alpha_1,s,alpha_2)<\/code> 的 3×3 假设协方差，不是上面二维 <code>wheel_k=(Δs_k,Δtheta_k)<\/code> 的协方差。<\/p>\n<pre class=\"code\"><code>sigma_alpha1 = sigma_alpha2 = 0.02 rad,    sigma_s = 0.05 m\n\nSigma_u = diag(0.02^2, 0.05^2, 0.02^2)\n        = diag(0.0004 rad^2, 0.0025 m^2, 0.0004 rad^2)<\/code><\/pre>\n<p>对 <code>(alpha_1, s, alpha_2)<\/code> 求雅可比，在本例的运动 <code>alpha_1 = 0<\/code>、<code>s = 1 m<\/code>、<code>alpha_2 = 0<\/code> 处取值：<\/p>\n<pre class=\"code\"><code>               d/d alpha_1        d/d s           d/d alpha_2\nΔx      [   -s*sin(alpha_1)    cos(alpha_1)         0     ]     [0  1  0]\nΔy      [    s*cos(alpha_1)    sin(alpha_1)         0     ]  =  [1  0  0]  = G\nΔtheta  [          1                0               1     ]     [1  0  1]<\/code><\/pre>\n<p>逐行看：前进距离 s 只影响 Δx；起步时的朝向误差 alpha_1 把机器人往侧面带偏<code>s * alpha_1<\/code>，同时原样保留在最终朝向里；结束时的朝向误差 alpha_2 只影响朝向。更明确地，令三个分解量的零均值小误差分别为<code>δα_1<\/code>、<code>δs<\/code>、<code>δα_2<\/code>。在 <code>alpha_1=0<\/code>、<code>s=1 m<\/code> 处，<code>G<\/code> 的三行表示：<\/p>\n<pre class=\"code\"><code>δ(Δx)     ≈ δs\nδ(Δy)     ≈ s*δα_1 = 1 m*δα_1\nδ(Δtheta) ≈ δα_1 + δα_2<\/code><\/pre>\n<p>第二行可以直接从 <code>Δy=s*sin(alpha_1)<\/code> 看出来。原计划是沿 x 轴走，<code>alpha_1=0<\/code>，所以原计划的 <code>Δy=s*sin(0)=0<\/code>。若距离和起步转角各有一个小误差，新的侧向位移为：<\/p>\n<pre class=\"code\"><code>新的 Δy = (s+δs)*sin(0+δα_1)\n        ≈ (s+δs)*δα_1           小角度、弧度制：sin(δα_1)≈δα_1\n        = s*δα_1 + δs*δα_1\n\nδ(Δy) = 新的 Δy - 原计划 Δy\n      ≈ s*δα_1                  忽略两个小误差相乘的二阶项 δs*δα_1<\/code><\/pre>\n<p>用雅可比写是同一件事：在 <code>alpha_1=0<\/code> 处，<code>∂Δy/∂alpha_1=s*cos(0)=s<\/code>，<code>∂Δy/∂s=sin(0)=0<\/code>，因此 <code>G<\/code> 的第二行是 <code>[s, 0, 0]<\/code>，本例 <code>s=1<\/code> 时为 <code>[1, 0, 0]<\/code>。<\/p>\n<p>几何上，长度为 <code>s<\/code> 的前进位移偏转一个小角度，侧向分量约为<code>s*δα_1<\/code>；例如 <code>s=1 m<\/code>、<code>δα_1=0.01 rad<\/code>，侧向偏差约 <code>0.01 m<\/code>。单独改变距离 <code>δs<\/code> 而角度仍为 0，机器人仍沿 x 轴走，侧向偏差为 0。若原计划的 <code>alpha_1<\/code> 不是 0，<code>δs<\/code> 对 <code>Δy<\/code> 的一阶影响则是<code>sin(alpha_1)*δs<\/code>，不能继续省略。<\/p>\n<p>本例假设三个小误差互相独立，因此不同误差相乘的期望为 0；<code>Var(δα_1)=Var(δα_2)=0.02^2=0.0004 rad^2<\/code>，<code>Var(δs)=0.05^2=0.0025 m^2<\/code>。把上面三行逐项相乘并取期望，就得到协方差矩阵。<\/p>\n<p>按第 3.4.2.3 节的传播公式：<\/p>\n<pre class=\"code\"><code>Sigma_odom = G * Sigma_u * G^T\n\n           = [0.0025   0        0     ]\n             [0        0.0004   0.0004]\n             [0        0.0004   0.0008]\n\n单位：Δx、Δy 的方差是 m^2，Δtheta 的方差是 rad^2，Δy 与 Δtheta 的协方差是 m*rad<\/code><\/pre>\n<p>这组数也能用上面的时间区间增量来理解：若中点模型取<code>Var(δΔs)=0.0025 m^2<\/code>、<code>Var(δΔtheta)=0.0008 rad^2<\/code>，仅由这两个输入得到的侧向方差是 <code>(1/2)^2*0.0008=0.0002 m^2<\/code>，侧向与角度协方差是 <code>(1/2)*0.0008=0.0004 m*rad<\/code>；再加一个独立的<code>0.0002 m^2<\/code> 侧滑方差，侧向总方差才成为这里的 <code>0.0004 m^2<\/code>。因此 <code>rho=0.707<\/code> 是本例的误差模型结果，不是“所有轮速里程计”的固定常数。<\/p>\n<p>逐项核对：<\/p>\n<pre class=\"code\"><code>Var(Δx)          = sigma_s^2                          = 0.0025\nVar(Δy)          = s^2 * sigma_alpha1^2               = 0.0004\nVar(Δtheta)      = sigma_alpha1^2 + sigma_alpha2^2    = 0.0008\nCov(Δy, Δtheta)  = s * sigma_alpha1^2                 = 0.0004\n\nrho(Δy, Δtheta)  = 0.0004 / sqrt(0.0004 * 0.0008)     = 0.707<\/code><\/pre>\n<p>非对角项可以直接从定义看出来：<\/p>\n<pre class=\"code\"><code>Cov(Δy, Δtheta)\n≈ E[(s*δα_1)*(δα_1+δα_2)]\n= s*E[δα_1^2] + s*E[δα_1*δα_2]\n= s*sigma_alpha1^2 + 0\n= 1*0.0004 = 0.0004 m*rad<\/code><\/pre>\n<p><code>Var(Δtheta)<\/code> 是两个独立角度误差的方差之和，<code>Var(Δy)<\/code> 是<code>s*δα_1<\/code> 的方差。最后按相关系数定义<code>rho=Cov(Δy,Δtheta)/sqrt(Var(Δy)*Var(Δtheta))<\/code> 代入；两段角度误差标准差相同时，<code>s&gt;0<\/code> 下也可直接化成 <code>rho=1/sqrt(2)≈0.707<\/code>。<\/p>\n<p><strong>Δy 与 Δtheta 的相关系数是 0.707，不是 0。<\/strong> 原因很具体：同一个 alpha_1 既让机器人往侧面偏，又让它的朝向偏，两个误差倾向于同号出现。第 2.4.4 节直接假设的y、yaw 相关，在这里第一次从运动模型里推了出来。<\/p>\n<p>两点工程说明：<\/p>\n<ul><li>这里的三个标准差取了固定值。真实模型里它们随运动量变化（例如直行越远 sigma_s越大），所以每条里程计边都要按自己的那段运动重新算一次 Sigma_odom。<\/li><li>不少 ROS 驱动在 <code>nav_msgs/Odometry<\/code> 里只填对角协方差（例如 diff_drive_controller的 <code>pose_covariance_diagonal<\/code> 参数），这就把 0.707 的相关性丢掉了。反过来，如果只用左、右轮两个噪声源建模，直行时 Δy 完全由 Δtheta 决定，Sigma_odom 的秩只有 2、不可逆；这时要补一个小的独立侧滑噪声，或者按第 3.4.2.4 节在有效子空间里处理。<\/li><\/ul>\n<h5>第 2 步：Omega_odom = Sigma_odom^-1<\/h5>\n<p>Δx 与另外两个分量不相关，可以单独取倒数；(Δy, Δtheta) 是一个相关的 2 × 2 块，必须按第 3.4.2.4 节整体求逆：<\/p>\n<pre class=\"code\"><code>Δx：\n1 / 0.0025 = 400\n\n(Δy, Δtheta) 块：\ndet = 0.0004*0.0008 - 0.0004^2 = 1.6e-7\n\ninv = (1 / 1.6e-7) * [ 0.0008  -0.0004]  =  [ 5000  -2500]\n                     [-0.0004   0.0004]     [-2500   2500]\n\nOmega_odom = [400       0       0]\n             [  0    5000   -2500]\n             [  0   -2500    2500]<\/code><\/pre>\n<p>验算 <code>Sigma_odom * Omega_odom = I<\/code>，例如：<\/p>\n<pre class=\"code\"><code>第 2 行 × 第 2 列：0.0004*5000 + 0.0004*(-2500) = 2 - 1 = 1\n第 3 行 × 第 2 列：0.0004*5000 + 0.0008*(-2500) = 2 - 2 = 0<\/code><\/pre>\n<p>这里再看一次第 2.4.4 节提到的现象：<strong>Omega 的对角元不等于 Sigma 对角元的倒数。<\/strong><\/p>\n<pre class=\"code\"><code>Omega_odom 的 yaw 对角元 = 2500，   而 1 / Var(Δtheta) = 1 / 0.0008 = 1250\nOmega_odom 的 y   对角元 = 5000，   而 1 / Var(Δy)     = 1 / 0.0004 = 2500<\/code><\/pre>\n<p>Omega 的对角元是<strong>条件方差<\/strong>的倒数，即“其他分量都已知时，这个分量还剩多少方差”：<\/p>\n<pre class=\"code\"><code>Var(Δy | Δtheta 已知)\n= Var(Δy) - Cov(Δy, Δtheta)^2 / Var(Δtheta)\n= 0.0004 - 0.0004^2 / 0.0008\n= 0.0002\n= 1 / 5000<\/code><\/pre>\n<p>知道了 Δtheta，就能推出 Δy 误差里由同一个 alpha_1 造成的那一部分，剩下的方差变小，对应的信息就变大。“信息矩阵的对角是条件量、协方差矩阵的对角是边缘量”这个区别，第 8 步在状态层面还会再遇到一次。<\/p>\n<p>非对角的 -2500 起什么作用，也可以直接算出来。比较两个残差，它们的 y、yaw 分量大小一样，只是 yaw 的符号相反：<\/p>\n<pre class=\"code\"><code>r_A = (0, 0.01, +0.01):   r_A^T * Omega_odom * r_A = 0.25\nr_B = (0, 0.01, -0.01):   r_B^T * Omega_odom * r_B = 1.25<\/code><\/pre>\n<p>r_A 的“侧偏与朝向同号”正是 alpha_1 误差会造成的形状，属于常见情况，代价小；r_B 与噪声结构相反，代价大 5 倍。<\/p>\n<h5>第 3 步：回环的 Sigma_loop、Omega_loop 从哪里来<\/h5>\n<p>回环测量 z_02 是扫描匹配（ICP）的输出：把 X_2 处的扫描对齐到 X_0 处的关键帧，得到相对位姿 <code>(Δx, Δy, Δtheta)<\/code>。它的不确定度来自这个匹配问题本身。ICP 也是一个小的加权最小二乘，待估的正好就是这三个量。<\/p>\n<p>设匹配上了 4 个点，它们在 X_2 机体系下的坐标为：<\/p>\n<pre class=\"code\"><code>p_1 = (2, 0),  p_2 = (-2, 0),  p_3 = (0, 2),  p_4 = (0, -2)      单位 m<\/code><\/pre>\n<p>每个点的残差是二维的，即变换后的点与 X_0 扫描中对应点 q_k 之差：<\/p>\n<pre class=\"code\"><code>e_k = R(Δtheta) * p_k + (Δx, Δy) - q_k          2 维<\/code><\/pre>\n<p>求导时先固定这一轮找到的对应点 <code>q_k<\/code>，把 <code>p_k=(p_kx,p_ky)<\/code> 看作已知扫描点。二维旋转矩阵展开后，两维残差分别为：<\/p>\n<pre class=\"code\"><code>R(Δtheta) = [cos(Δtheta)  -sin(Δtheta)]\n            [sin(Δtheta)   cos(Δtheta)]\n\ne_kx = cos(Δtheta)*p_kx - sin(Δtheta)*p_ky + Δx - q_kx\ne_ky = sin(Δtheta)*p_kx + cos(Δtheta)*p_ky + Δy - q_ky<\/code><\/pre>\n<p><code>Δx<\/code> 只使第一维增加同样的量，<code>Δy<\/code> 只使第二维增加同样的量，所以雅可比的前两列是二维单位矩阵。对角度求导：<\/p>\n<pre class=\"code\"><code>∂e_kx/∂Δtheta = -sin(Δtheta)*p_kx - cos(Δtheta)*p_ky\n∂e_ky/∂Δtheta =  cos(Δtheta)*p_kx - sin(Δtheta)*p_ky<\/code><\/pre>\n<p>在 <code>Δtheta=0<\/code> 处，<code>sin(0)=0<\/code>、<code>cos(0)=1<\/code>，因此：<\/p>\n<pre class=\"code\"><code>J_k = [1  0  -p_ky]          2 × 3\n      [0  1   p_kx]<\/code><\/pre>\n<p>直观地看，小角度旋转让点 <code>(p_kx,p_ky)<\/code> 的位置变化约为<code>(-p_ky*Δtheta, p_kx*Δtheta)<\/code>；例如 <code>p_1=(2,0)<\/code> 旋转一个很小的正角度，主要向 <code>+y<\/code> 移动约 <code>2*Δtheta<\/code>，对应第三列 <code>(0,2)<\/code>。换一个线性化角度，应在该角度代入上面的通式，不能仍直接使用 <code>(-p_ky,p_kx)<\/code>。<\/p>\n<p>每个点在每个方向的噪声取 <code>sigma_pt = 0.02 m<\/code>，即 <code>Omega_pt = 2500 * I<\/code>（2 × 2）。这个小问题的维数是：<\/p>\n<pre class=\"code\"><code>残差 4 × 2 = 8 维，大 Omega 8 × 8，J 8 × 3，H_icp 3 × 3<\/code><\/pre>\n<p>按第 3.1.4 节累加：<\/p>\n<pre class=\"code\"><code>J_k^T * J_k = [ 1        0        -p_ky          ]\n              [ 0        1         p_kx          ]\n              [-p_ky     p_kx      p_kx^2 + p_ky^2]\n\n4 个点求和 = [4  0   0]\n             [0  4   0]\n             [0  0  16]\n\nH_icp = 2500 * diag(4, 4, 16) = diag(10000, 10000, 40000)<\/code><\/pre>\n<p>H_icp 的逆就是 ICP 结果的协方差，它原样成为位姿图里这条回环测量的 Sigma：<\/p>\n<pre class=\"code\"><code>Sigma_loop = H_icp^-1 = diag(1e-4 m^2, 1e-4 m^2, 2.5e-5 rad^2)\n             sigma    = 1 cm, 1 cm, 0.005 rad（约 0.29 度）\n\nOmega_loop = H_icp    = diag(10000, 10000, 40000)<\/code><\/pre>\n<p>这个关系值得记住：<strong>下层匹配问题的 H，就是上层位姿图中这条测量的 Omega。<\/strong> 8 个点残差在 ICP 里被压缩成了一条 3 维测量，信息量没有变。<\/p>\n<p>再补充三点：<\/p>\n<ul><li>这里 Omega_loop 是对角阵，只是因为 4 个点前后左右对称。点集中在一侧时，H_icp会出现平移与旋转之间的非对角项；在长走廊里，某个方向的特征值接近 0（第 7.1 章）。<\/li><li>ICP 给出的 H 往往偏乐观（原因见第 3.3.2 节，例如对应点错误），工程上常把Sigma_loop 放大若干倍，或者干脆使用手调的固定权重。<\/li><li>回环一旦是错的，高信息量反而会把地图拉坏，所以还要配合鲁棒核和卡方门控（第 7.3.6 节）。<\/li><\/ul>\n<h5>第 4 步：残差和雅可比<\/h5>\n<p>位姿 i 到 j 的相对位姿预测值（与第 4.2.6.5 节相同）为：<\/p>\n<pre class=\"code\"><code>h_ij(X_i, X_j) = [ R(theta_i)^T * (p_j - p_i) ]\n                 [ theta_j - theta_i          ]<\/code><\/pre>\n<p>残差按位姿图的习惯取 <code>r_ij = h_ij - z_ij<\/code>。第 3.4.2.7 节用的是 <code>z - h<\/code>；符号只让 J整体变号，不影响 <code>J^T*Omega*J<\/code>。<\/p>\n<p>记 <code>dx = x_j - x_i<\/code>、<code>dy = y_j - y_i<\/code>、<code>c = cos(theta_i)<\/code>、<code>s = sin(theta_i)<\/code>，把 h展开：<\/p>\n<pre class=\"code\"><code>h_x     =  c*dx + s*dy\nh_y     = -s*dx + c*dy\nh_theta =  theta_j - theta_i<\/code><\/pre>\n<p>逐项求偏导，得到对 X_i 和 X_j 的两个 3 × 3 雅可比：<\/p>\n<pre class=\"code\"><code>A_ij = d h / d X_i = [-c   -s   -s*dx + c*dy]\n                     [ s   -c   -c*dx - s*dy]\n                     [ 0    0        -1     ]\n\nB_ij = d h / d X_j = [ c    s    0]\n                     [-s    c    0]\n                     [ 0    0    1]<\/code><\/pre>\n<p>在 <code>theta_i = 0<\/code> 处，<code>c = 1<\/code>、<code>s = 0<\/code>：<\/p>\n<pre class=\"code\"><code>A_ij = [-1   0    dy]          B_ij = I\n       [ 0  -1   -dx]\n       [ 0   0   -1 ]<\/code><\/pre>\n<p><strong>A_ij 第 2 行第 3 列的 <code>-dx<\/code> 就是第 3.4.2.6 节出现过的“杠杆臂”。<\/strong>它的含义是：位姿 i 的朝向逆时针多转 delta_theta，从 i 看过去，距离为 dx 的位姿 j就显得往右偏了 <code>dx * delta_theta<\/code>。距离越远，同样的朝向误差造成的横向偏差越大。<\/p>\n<p>代入三条边：<\/p>\n<pre class=\"code\"><code>里程计 0-&gt;1：dx = 1    A_01 = [-1 0 0; 0 -1 -1; 0 0 -1]，B_01 = I\n里程计 1-&gt;2：dx = 1    A_12 = [-1 0 0; 0 -1 -1; 0 0 -1]，B_12 = I\n回环   0-&gt;2：dx = 2    A_02 = [-1 0 0; 0 -1 -2; 0 0 -1]，B_02 = I<\/code><\/pre>\n<p>X_0 固定、不在状态里，所以 A_01 和 A_02 不进入 J。把三条边按行堆叠，得到 9 × 6 的J：<\/p>\n<pre class=\"code\"><code>               x_1  y_1  th_1   x_2  y_2  th_2\nr_01  Δx    [   1    0    0      0    0    0 ]\n      Δy    [   0    1    0      0    0    0 ]     B_01\n      Δth   [   0    0    1      0    0    0 ]\nr_12  Δx    [  -1    0    0      1    0    0 ]\n      Δy    [   0   -1   -1      0    1    0 ]     [A_12, B_12]\n      Δth   [   0    0   -1      0    0    1 ]\nr_02  Δx    [   0    0    0      1    0    0 ]\n      Δy    [   0    0    0      0    1    0 ]     B_02\n      Δth   [   0    0    0      0    0    1 ]<\/code><\/pre>\n<p>三条测量互相独立，大 Omega 是 9 × 9 的块对角阵：<\/p>\n<pre class=\"code\"><code>Omega_big = blockdiag(Omega_odom, Omega_odom, Omega_loop)\n\n           r_01                    r_12                    r_02\n     [ 400     0      0   |                       |                        ]\n     [   0  5000  -2500   |          0            |           0            ]\n     [   0 -2500   2500   |                       |                        ]\n     [--------------------+-----------------------+------------------------]\n     [                    |  400     0      0     |                        ]\n     [         0          |    0  5000  -2500     |           0            ]\n     [                    |    0 -2500   2500     |                        ]\n     [--------------------+-----------------------+------------------------]\n     [                    |                       | 10000      0       0   ]\n     [         0          |          0            |     0  10000       0   ]\n     [                    |                       |     0      0   40000   ]<\/code><\/pre>\n<p>三个块的来源完全不同：前两块由轮子的运动噪声传播而来，第三块是 ICP 的 H。它们一样大，只因为每条测量恰好都是 3 维；如果再加一条 GNSS 二维位置测量，就会多出一个2 × 2 块，Omega_big 变成 11 × 11。<\/p>\n<h5>第 5 步：H = J^T * Omega * J<\/h5>\n<p>Omega_big 是块对角的，所以 H 可以按边逐条累加。每条边只往它连接的那几个位姿对应的块里加东西：<\/p>\n<pre class=\"code\"><code>边 0-&gt;1（只连 X_1）：     (X_1, X_1) += B^T*Omega_odom*B = Omega_odom\n\n边 1-&gt;2（连 X_1、X_2）：  (X_1, X_1) += A^T*Omega_odom*A\n                          (X_1, X_2) += A^T*Omega_odom*B\n                          (X_2, X_1) += B^T*Omega_odom*A\n                          (X_2, X_2) += B^T*Omega_odom*B = Omega_odom\n\n边 0-&gt;2（只连 X_2）：     (X_2, X_2) += Omega_loop<\/code><\/pre>\n<p>需要手算的只有边 1-&gt;2 的两块（<code>A = A_12<\/code>，<code>B = I<\/code>）：<\/p>\n<pre class=\"code\"><code>A^T * Omega_odom * A = [400       0       0]\n                       [  0    5000    2500]\n                       [  0    2500    2500]\n\nA^T * Omega_odom     = [-400      0       0]\n                       [   0  -5000    2500]\n                       [   0  -2500       0]<\/code><\/pre>\n<p>先不加回环，只有两条里程计：<\/p>\n<pre class=\"code\"><code>               x_1     y_1    th_1     x_2     y_2    th_2\nH_odo =  [    800       0       0    -400       0       0 ]\n         [      0   10000       0       0   -5000    2500 ]\n         [      0       0    5000       0   -2500       0 ]\n         [   -400       0       0     400       0       0 ]\n         [      0   -5000   -2500       0    5000   -2500 ]\n         [      0    2500       0       0   -2500    2500 ]<\/code><\/pre>\n<p>加上回环，只有右下角的 (X_2, X_2) 块变化：<\/p>\n<pre class=\"code\"><code>(X_2, X_2) 块 = Omega_odom + Omega_loop = [10400       0       0]\n                                          [    0   15000   -2500]\n                                          [    0   -2500   42500]<\/code><\/pre>\n<p>H 的结构和图的结构一一对应：对角块是每个位姿自己收到的信息；(X_1, X_2) 非对角块非零，只因为有一条边连着它们。两个位姿之间没有边，对应的块就一定是 0，这就是位姿图的 H 稀疏的原因。(X_1, X_2) 块里 th_1 行、y_2 列的 -2500，是杠杆臂和 Omega_odom中 y、yaw 相关共同作用的结果：X_1 的朝向和 X_2 的横向位置被同一条边绑在了一起。<\/p>\n<h5>第 6 步：状态协方差 P 的两种求法<\/h5>\n<p><strong>路线一：协方差前推（滤波的做法）。<\/strong> 把里程计当成运动模型，一步一步往前推：<\/p>\n<pre class=\"code\"><code>X_2 = X_1 ⊕ u_12：\n\nx_2     = x_1 + cos(theta_1)*Δx - sin(theta_1)*Δy\ny_2     = y_1 + sin(theta_1)*Δx + cos(theta_1)*Δy\ntheta_2 = theta_1 + Δtheta<\/code><\/pre>\n<p>对 X_1 求导，在 <code>theta_1 = 0<\/code>、<code>u_12 = (1, 0, 0)<\/code> 处：<\/p>\n<pre class=\"code\"><code>F = d X_2 / d X_1 = [1  0  -sin(theta_1)*Δx - cos(theta_1)*Δy]     [1  0  0]\n                    [0  1   cos(theta_1)*Δx - sin(theta_1)*Δy]  =  [0  1  1]\n                    [0  0                1                   ]     [0  0  1]<\/code><\/pre>\n<p>F 第 2 行第 3 列的 1，就是前推方向上的杠杆臂：X_1 的朝向偏 delta_theta，走 1 m 后横向偏 <code>1 * delta_theta<\/code>。X_2 对测量 u_12 的雅可比是 <code>blockdiag(R(theta_1), 1)<\/code>，这里等于 I。<\/p>\n<p>X_0 固定，所以 <code>P_0 = 0<\/code>：<\/p>\n<pre class=\"code\"><code>P_1 = Sigma_odom = [0.0025   0        0     ]\n                   [0        0.0004   0.0004]\n                   [0        0.0004   0.0008]\n\nP_2 = F * P_1 * F^T + Sigma_odom\n\n    = [0.0025   0        0     ]   [0.0025   0        0     ]\n      [0        0.0020   0.0012] + [0        0.0004   0.0004]\n      [0        0.0012   0.0008]   [0        0.0004   0.0008]\n\n    = [0.0050   0        0     ]      sigma_x2   = 7.07 cm\n      [0        0.0024   0.0016]      sigma_y2   = 4.90 cm\n      [0        0.0016   0.0016]      sigma_th2  = 0.040 rad<\/code><\/pre>\n<p>y_2 的方差 0.0024 可以拆成四份，从中能看清朝向误差怎样变成横向误差：<\/p>\n<pre class=\"code\"><code>Var(y_2) = Var(y_1)                     0.0004    第一段的侧偏\n         + 2 * 1 * Cov(y_1, theta_1)    0.0008    侧偏与朝向同号，互相叠加\n         + 1^2 * Var(theta_1)           0.0008    第一段的朝向误差走 1 m 变成侧偏\n         + Var(Δy_12)                   0.0004    第二段自己的侧偏\n         = 0.0024<\/code><\/pre>\n<p>x 方向每走一段只加一份 0.0025，方差随段数线性增长；y 方向除了每段自己的侧偏，还要加上“累积朝向误差 × 已走距离”，增长得更快。直线走 N 段时，这一项大致随 N 的三次方增长。这就是轮式里程计跑久了横向漂得比纵向厉害的原因。<\/p>\n<p>前推的同时还能得到 X_1 与 X_2 的交叉协方差：<\/p>\n<pre class=\"code\"><code>P_12 = Cov(X_1, X_2) = P_1 * F^T = [0.0025   0        0     ]\n                                   [0        0.0008   0.0004]\n                                   [0        0.0012   0.0008]<\/code><\/pre>\n<p><strong>路线二：H 求逆（图优化的做法）。<\/strong> 直接对第 5 步的 H_odo 求逆，得到 6 × 6 的联合协方差：<\/p>\n<pre class=\"code\"><code>                  x_1      y_1     th_1      x_2      y_2     th_2\nP = H_odo^-1 = [0.0025   0        0        0.0025   0        0     ]\n               [0        0.0004   0.0004   0        0.0008   0.0004]\n               [0        0.0004   0.0008   0        0.0012   0.0008]\n               [0.0025   0        0        0.0050   0        0     ]\n               [0        0.0008   0.0012   0        0.0024   0.0016]\n               [0        0.0004   0.0008   0        0.0016   0.0016]<\/code><\/pre>\n<p>左上 3 × 3 块是 P_1，右下是 P_2，右上是 P_12，<strong>与路线一逐个元素相同<\/strong>。这就是第 4.3.3 节“线性高斯条件下滤波与图优化等价”的一个具体例子：第 3.4.2.5 节的 Sigma 前推和 Omega 回拉走的是两个相反的方向，最后到达的是同一个 P。<\/p>\n<p>两条路线的区别出现在回环到来的时候。路线一的滤波器通常只保留当前位姿 X_2，回环能修正 X_2，却没有办法再回头改 X_1；路线二保留了全部位姿，加一条回环只是在 H 上再加一项。<\/p>\n<h5>第 7 步：加入回环以后<\/h5>\n<p>对加了回环的 H 求逆（6 × 6），下面只列出每个位姿的 3 × 3 对角块，单位为 1e-4：<\/p>\n<pre class=\"code\"><code>P_1 = [12.745   0       0    ]        P_2 = [0.980   0       0    ]\n      [ 0       1.231   0.220]              [0       0.892   0.027]\n      [ 0       0.220   2.223]              [0       0.027   0.240]<\/code><\/pre>\n<div class=\"tbl\"><table><thead><tr><th>位姿<\/th><th>情形<\/th><th>sigma_x / cm<\/th><th>sigma_y / cm<\/th><th>sigma_yaw / rad<\/th><\/tr><\/thead><tbody><tr><td>X_1<\/td><td>仅里程计<\/td><td>5.00<\/td><td>2.00<\/td><td>0.0283<\/td><\/tr><tr><td>X_1<\/td><td>加回环<\/td><td>3.57<\/td><td>1.11<\/td><td>0.0149<\/td><\/tr><tr><td>X_2<\/td><td>仅里程计<\/td><td>7.07<\/td><td>4.90<\/td><td>0.0400<\/td><\/tr><tr><td>X_2<\/td><td>加回环<\/td><td>0.99<\/td><td>0.94<\/td><td>0.0049<\/td><\/tr><\/tbody><\/table><\/div>\n<figure class=\"still\"><img loading=\"lazy\" src=\"img/static/pose2-covariance.png\" alt=\"(x, y, yaw) 位姿图回环前后的位置与 yaw 不确定度，以及 X_2 的 y-yaw 联合椭圆\"><figcaption>(x, y, yaw) 位姿图回环前后的位置与 yaw 不确定度，以及 X_2 的 y-yaw 联合椭圆<\/figcaption><\/figure>\n<blockquote>图注：(a) 只有里程计时，X_2 的横向椭圆比 X_1 大得多，因为 X_1 的朝向误差走 1 m 后变成了横向误差；加入回环后 X_2 被钉住，没被回环直接连到的 X_1 在位置和朝向上也一起缩小。(b) 里程计让 X_2 的 y 与 yaw 强相关（0.816）；只取 H 中 X_2 的对角块求逆，得到的是灰色虚线这个偏小的条件协方差，不是真正的边缘协方差。<\/blockquote>\n<p>几点观察：<\/p>\n<ol><li value=\"1\">X_2 被回环直接钉住，不确定度接近回环自身的 (1 cm, 1 cm, 0.005 rad)。<\/li><li value=\"2\"><strong>回环根本没有连到 X_1，X_1 却也变准了。<\/strong> 信息沿着里程计边 1-&gt;2 的 J 传了回去：X_2 已经很确定，X_1 就被夹在“固定的 X_0”和“几乎确定的 X_2”之间。x 方向相当于两条 5 cm 的里程计从两头夹住，方差约为 <code>1/(400+400)<\/code>，sigma 约 3.5 cm。<\/li><li value=\"3\"><strong>X_1 的朝向也变准了（0.0283 → 0.0149 rad），虽然没有任何测量直接比较 X_1 的朝向和外部参考。<\/strong> 这又是杠杆臂：theta_1 偏了，X_2 的 y 就会跟着偏<code>1 m * delta_theta_1<\/code>；现在回环把 X_2 的 y 定到了 1 cm 以内，反过来就约束了theta_1。位置测量能约束朝向，这只有在状态同时包含位置和朝向时才看得到。<\/li><li value=\"4\">X_2 的 y 与 yaw 的相关系数从 0.816 降到 0.058。回环直接、独立地测了这两个量（Sigma_loop 是对角的），原先由里程计带来的相关几乎被冲掉了。<\/li><\/ol>\n<h5>第 8 步：H 的对角块求逆不是位姿的协方差<\/h5>\n<p>一个常见的偷懒做法是只取 H 中某个位姿的 3 × 3 对角块求逆，当成这个位姿的协方差。以只有里程计的情形为例：<\/p>\n<pre class=\"code\"><code>X_2：(H_odo 的 (X_2, X_2) 块)^-1 = Omega_odom^-1 = Sigma_odom\n     sigma = (5.00 cm, 2.00 cm, 0.0283 rad)\n     真正的 P_2（第 6 步）：sigma = (7.07 cm, 4.90 cm, 0.0400 rad)\n\nX_1：(H_odo 的 (X_1, X_1) 块)^-1 = diag(0.00125, 0.0001, 0.0002)\n     sigma = (3.54 cm, 1.00 cm, 0.0141 rad)\n     真正的 P_1：sigma = (5.00 cm, 2.00 cm, 0.0283 rad)<\/code><\/pre>\n<p>对角块求逆得到的 y 标准差只有真实值的 40% 到 50%。原因和第 2 步相同：<\/p>\n<pre class=\"code\"><code>(H_ii)^-1         条件协方差：假设其他位姿全都精确已知，X_i 还剩多少不确定度\n(H^-1) 的 ii 块   边缘协方差：其他位姿也不确定，把它们的影响都算进来以后的不确定度<\/code><\/pre>\n<p>以 X_2 为例，只看 (X_2, X_2) 块，等于假设 X_1 精确已知，于是 X_2 只剩最后一段里程计的误差，前一段积累下来的误差全被忽略了。正确做法是对整个 H 求逆再取块，或者用Schur 补把其他位姿消去（第 4.3.4 节）：<\/p>\n<pre class=\"code\"><code>P_ii = (H_ii - H_i,rest * H_rest,rest^-1 * H_rest,i)^-1<\/code><\/pre>\n<p>g2o 的 <code>computeMarginals<\/code>、GTSAM 的 <code>Marginals<\/code>、Ceres 的 <code>Covariance<\/code> 算的都是边缘协方差，不是对角块的逆。<\/p>\n<p>这一步和第 2 步是同一个规律在两个层面上的表现：<strong>协方差矩阵的对角块是边缘量，信息矩阵的对角块（求逆后）是条件量。<\/strong> 在测量层面，Omega_odom 的对角元是条件方差的倒数；在状态层面，H 的对角块求逆得到的是条件协方差。<\/p>\n<h5>第 9 步：首帧不固定时，H 为什么求不了逆<\/h5>\n<p>把 X_0 也放进状态，n = 9，H 变成 9 × 9。它的特征值里有三个 0，秩只有 6。对应的三个零空间方向是：<\/p>\n<pre class=\"code\"><code>v_1 = (1,0,0,  1,0,0,  1,0,0)      整张图沿 x 平移\nv_2 = (0,1,0,  0,1,0,  0,1,0)      整张图沿 y 平移\nv_3 = (0,0,1,  0,1,1,  0,2,1)      整张图绕原点转一个小角度<\/code><\/pre>\n<p>v_3 中各位姿的 y 分量正好等于它们的 x 坐标（0、1、2），这仍然是杠杆臂：整体旋转delta_phi 时，离原点越远的位姿横移越多。三条测量都是相对量，整张图怎样平移、旋转，它们都不变，这就是第 3.3.2 节说的规范自由度。<\/p>\n<p>处理方法有两种：<\/p>\n<ul><li>像本节这样固定 X_0（g2o 中对该顶点调用 <code>setFixed(true)<\/code>），把它从状态中去掉；<\/li><li>给 X_0 加一个先验因子，残差为 <code>r_0 = X_0 - X_0_prior<\/code>，信息矩阵为<code>Omega_prior = P_0^-1<\/code>。这正是滤波中“初始状态协方差 P_0”在图优化里的对应物。<\/li><\/ul>\n<h5>变体：转一个弯，x、y、yaw 就全部耦合<\/h5>\n<p>把第二段改成“先左转 90 度再走 1 m”，即 <code>alpha_1 = 90 度<\/code>，于是<code>X_2 = (1, 1, 90 度)<\/code>。这一段的里程计协方差变成：<\/p>\n<pre class=\"code\"><code>G&#x27; = [-1  0  0]     Sigma_odom&#x27; = G&#x27; * Sigma_u * G&#x27;^T = [ 0.0004   0       -0.0004]\n     [ 0  1  0]                                         [ 0        0.0025   0     ]\n     [ 1  0  1]                                         [-0.0004   0        0.0008]<\/code><\/pre>\n<p>同一个运动模型，只因为运动不同，相关项就从 (Δy, Δtheta) 换到了 (Δx, Δtheta)。前推时X_1 朝向误差造成的位移方向也变了：<\/p>\n<pre class=\"code\"><code>F = [1  0  -1]      X_1 的朝向偏 delta_theta，本该朝 +y 走的那 1 m 会偏向 -x\n    [0  1   0]\n    [0  0   1]\n\nP_2 = F * P_1 * F^T + Sigma_odom&#x27;\n\n    = [ 37   -4  -12]\n      [ -4   29    4]    × 1e-4\n      [-12    4   16]<\/code><\/pre>\n<p>三个分量两两相关。所以直线例子里“x 与 (y, yaw) 解耦”只是直线加朝向为 0 的巧合，不能推广。Omega、H、P 的求法完全不变，只是矩阵里不再有那么多 0。<\/p>\n<h5>从简化例子容易得出的错误结论<\/h5>\n<div class=\"tbl\"><table><thead><tr><th>容易形成的印象<\/th><th>在 (x, y, yaw) 位姿图里的实际情况<\/th><\/tr><\/thead><tbody><tr><td>Omega 的尺寸由状态决定<\/td><td>Omega 跟测量走：ICP 每个点 2 × 2，里程计和回环各 3 × 3，堆起来 9 × 9；只有 H、P 是 6 × 6<\/td><\/tr><tr><td>测量的 Sigma 是对角的，Omega 逐个取倒数即可<\/td><td>轮速里程计的 y 与 yaw 天然相关（0.707），Omega 必须整体求逆，它的对角元也不是 Sigma 对角元的倒数<\/td><\/tr><tr><td>J 常是单位阵，H 就是各 Omega 相加<\/td><td>J 里有杠杆臂 <code>-dx<\/code>，H 出现跨位姿的非对角块，不能直接相加<\/td><\/tr><tr><td>某个位姿的协方差 = H 对应对角块的逆<\/td><td>那是条件协方差，偏乐观；要对整个 H 求逆再取块，得到边缘协方差<\/td><\/tr><tr><td>回环只修正它连接的那个位姿<\/td><td>信息沿里程计边传回，中间的 X_1 在位置和朝向上都变准<\/td><\/tr><tr><td>位置只能约束位置，朝向只能约束朝向<\/td><td>通过杠杆臂，X_2 的横向位置约束了 X_1 的朝向<\/td><\/tr><tr><td>各方向的不确定度以相同速度增长<\/td><td>朝向误差被距离放大，横向误差比纵向增长得快<\/td><\/tr><tr><td>测量值决定协方差<\/td><td>在同一个线性化点，H、P 只由 J 和 Omega 决定；测量值只影响均值<\/td><\/tr><\/tbody><\/table><\/div>\n<h5>复算脚本<\/h5>\n<pre class=\"code\"><code>import numpy as np\nfrom scipy.linalg import block_diag\n\n# 第 1、2 步：里程计\nG = np.array([[0, 1, 0], [1, 0, 0], [1, 0, 1.]])\nSigma_odom = G @ np.diag([0.02**2, 0.05**2, 0.02**2]) @ G.T\nOmega_odom = np.linalg.inv(Sigma_odom)\n\n# 第 3 步：回环，ICP 的 H 就是回环的 Omega\nH_icp = np.zeros((3, 3))\nfor px, py in [(2, 0), (-2, 0), (0, 2), (0, -2)]:\n    Jk = np.array([[1, 0, -py], [0, 1, px]])\n    H_icp += Jk.T @ (2500 * np.eye(2)) @ Jk\nOmega_loop = H_icp\n\n# 第 4 步：J（X_0 固定）和大 Omega\nA = np.array([[-1, 0, 0], [0, -1, -1], [0, 0, -1.]])   # A_12，theta_1 = 0，dx = 1\nI3, Z3 = np.eye(3), np.zeros((3, 3))\nJ = np.block([[I3, Z3], [A, I3], [Z3, I3]])              # 9 x 6\nOmega_big = block_diag(Omega_odom, Omega_odom, Omega_loop)   # 9 x 9\n\n# 第 5 至 8 步\nH_odo = J[:6].T @ block_diag(Omega_odom, Omega_odom) @ J[:6]\nH = J.T @ Omega_big @ J\nfor name, HH in [(&quot;仅里程计&quot;, H_odo), (&quot;加回环&quot;, H)]:\n    P = np.linalg.inv(HH)\n    print(name, &quot;X_1 sigma:&quot;, np.sqrt(np.diag(P[:3, :3])),\n          &quot;X_2 sigma:&quot;, np.sqrt(np.diag(P[3:, 3:])))\n    print(&quot;  对角块求逆（条件协方差）X_2 sigma:&quot;,\n          np.sqrt(np.diag(np.linalg.inv(HH[3:, 3:]))))<\/code><\/pre>\n<h5>本节的记忆链<\/h5>\n<pre class=\"code\"><code>底层噪声 (alpha_1, s, alpha_2)  --G*Sigma_u*G^T--&gt;  Sigma_odom（3 × 3，y 与 yaw 相关）\n                                --整体求逆-------&gt;  Omega_odom\n\nICP 的 8 维点残差               --J^T*Omega*J----&gt;  H_icp（3 × 3）= Omega_loop\n\n每条边 r_ij = h_ij - z_ij       --求导-----------&gt;  A_ij、B_ij（含杠杆臂 -dx）--&gt; J（9 × 6）\n\nOmega_big = blockdiag(...)（9 × 9）\n                                --J^T*Omega*J----&gt;  H（6 × 6）\n                                --整体求逆-------&gt;  P（6 × 6）\n\nP 的对角块       = 边缘协方差（正确）\nH 的对角块求逆   = 条件协方差（偏乐观）<\/code><\/pre>\n<figure class=\"anim\"><div class=\"player\"><video src=\"vid/pose_covariance_loop.mp4\" poster=\"vid/pose_covariance_loop.jpg\" muted loop playsinline preload=\"none\" aria-label=\"动画 16：回环前后的不确定度：X2 大幅收缩，没有被直接连到的 X1 也通过杠杆臂变准\"><\/video><\/div><figcaption><span class=\"badge\">动画 16<\/span>回环前后的不确定度：X2 大幅收缩，没有被直接连到的 X1 也通过杠杆臂变准<\/figcaption><\/figure><\/section>\n<section class=\"sec\" data-sec=\"3.4.3\"><h3 id=\"s3.4.3\"><span class=\"num\">3.4.3<\/span> 本章面试题与参考答案<\/h3>\n<p>先自己作答，再对照答案；答案后括号注明对应小节。<\/p>\n<h4>题目<\/h4>\n<ol><li value=\"1\">从局部二次近似出发，推导 Gauss-Newton 的正规方程 <code>H_GN*delta_x = -g<\/code>，并说明 <code>r^T*Omega*r<\/code>、<code>g<\/code>、<code>H_GN<\/code> 各是什么量。追问：求出 <code>delta_x<\/code> 时为什么不应该显式计算 <code>H^-1<\/code>？<\/li><li value=\"2\">雅可比 J 和 Hessian H 有什么区别？请从求导对象、阶数、维数和退化表现四个角度回答。<\/li><li value=\"3\">为什么说 <code>J^T*Omega*J<\/code> 只是“Gauss-Newton 近似 Hessian”？它忽略了什么，什么时候这个近似比较可靠？LM 里的 <code>lambda*D<\/code> 能不能算作信息？<\/li><li value=\"4\">手算题：两个残差 <code>r_1 = x + y - 3<\/code>、<code>r_2 = x - y - 1<\/code>，信息矩阵 <code>Omega = diag(1, 4)<\/code>，从 <code>(x, y) = (0, 0)<\/code> 出发做一步 Gauss-Newton。求 <code>H_GN<\/code>、<code>g<\/code>、<code>delta_x<\/code>。追问：为什么一步就收敛？把权重改成 <code>diag(1, 1)<\/code>，解会不会变？<\/li><li value=\"5\">为什么 Hessian 的“曲率大”可以解释成“信息强”？请用一维高斯说明，并给出多维情形下 H 与 P 的关系。<\/li><li value=\"6\">机器人面对一面竖直墙 <code>x = 5 m<\/code>，用点到平面残差定位 <code>(x, y, theta)<\/code>。只用正前方一个点、用左右两个点、用墙上 1000 个点，Hessian 分别能约束哪些方向？怎样才能让 y 也可观？<\/li><li value=\"7\">怎样用 H 的特征值和特征向量判断具体哪个方向缺信息？追问：工程上能否用一个固定阈值直接比较所有特征值？<\/li><li value=\"8\">一个 2 维测量观测 3 维位姿 <code>(x, y, theta)<\/code>，例如看一个地标 <code>L = (3, 4)<\/code>，H 为什么一定奇异？零空间方向是什么，物理含义是什么？<\/li><li value=\"9\">手算题：<code>Sigma = [4 2; 2 4]<\/code>，求 <code>Omega<\/code>。为什么不能逐元素取倒数？<code>Omega<\/code> 的对角元 1/3 和 <code>Sigma<\/code> 对角元的倒数 1/4 为什么不一样？<\/li><li value=\"10\"><code>A*Sigma*A^T<\/code> 和 <code>A^T*Omega*A<\/code> 形状相似，它们有什么区别？写反了怎样快速自查？<\/li><li value=\"11\">二维激光的距离和方位噪声互不相关，为什么换到直角坐标后 x、y 误差会强相关？在 10 m 处、<code>sigma_phi = 0.5 度<\/code> 时，切向标准差约多少？<\/li><li value=\"12\">轮速里程计的 <code>Sigma_odom<\/code> 中，为什么 Δy 和 Δtheta 相关？ROS 驱动里只填对角协方差，或只用左右轮两个噪声源建模，分别会有什么问题？<\/li><li value=\"13\">有人在位姿图里取 H 中某个位姿的 3 × 3 对角块求逆，当作这个位姿的协方差。这样做错在哪里？正确做法是什么？<\/li><li value=\"14\">位姿图 <code>X_0 -&gt; X_1 -&gt; X_2<\/code> 加一条 <code>X_0 -&gt; X_2<\/code> 回环后，为什么没被回环直接连到的 X_1 也变准了，连朝向都变准了？追问：回环边的 <code>Omega_loop<\/code> 从哪里来，为什么工程上常要放大 <code>Sigma_loop<\/code>？<\/li><li value=\"15\">哪些情况下 <code>H^-1<\/code> 不能当作真实的状态协方差？首帧不固定时 H 为什么求不了逆，怎么处理？<\/li><\/ol>\n<h4>参考答案<\/h4>\n<p><strong>1. 推导正规方程，说明三个量；为什么不显式求逆<\/strong><\/p>\n<p>在线性化点 <code>x_0<\/code> 附近把残差一阶展开，代价写成二次型，展开后对 <code>delta_x<\/code> 求导并令其为 0：<\/p>\n<pre class=\"code\"><code>F(x_0 + delta_x) approximately_equals 0.5 * (r + J*delta_x)^T * Omega * (r + J*delta_x)\n  = 0.5*r^T*Omega*r + delta_x^T*J^T*Omega*r + 0.5*delta_x^T*J^T*Omega*J*delta_x\n\nd F / d delta_x = J^T*Omega*r + J^T*Omega*J*delta_x = 0\n=&gt; H_GN*delta_x = -g,   H_GN = J^T*Omega*J,   g = J^T*Omega*r<\/code><\/pre>\n<p><code>r^T*Omega*r<\/code> 是 1 × 1 标量，表示当前加权残差代价；<code>g<\/code> 是 n × 1 梯度，<code>-g<\/code> 指向最陡下降方向；<code>H_GN<\/code> 是 n × n 局部曲率矩阵，决定各方向的更新尺度和耦合。解完后更新 <code>x_0<\/code>，重新计算 r 和 J，迭代到收敛；含旋转时要用 <code>Exp<\/code> 更新。显式求逆既慢又放大数值误差，应该用 Cholesky、LDLT、QR 或 SVD 直接解线性方程。（见 3.1.4）<\/p>\n<p><strong>2. J 与 H 的区别<\/strong><\/p>\n<p>J 对向量残差 r 求一阶导，维数为“残差维数 × 状态维数”，表示状态动一点残差怎样变，也就是测量对状态的灵敏度。H 对标量代价 F 求二阶导，维数为“状态维数 × 状态维数”，表示状态沿某方向动时总代价弯曲得有多快，也就是局部信息强度。退化时，J 表现为列相关或存在零空间（<code>J*v = 0<\/code>），H 表现为零或很小的特征值。例如 <code>r = x + 2y - 3<\/code> 的 <code>J = [1, 2]<\/code>，<code>H = [1 2; 2 4]<\/code> 秩为 1，沿 <code>v = [2, -1]^T<\/code> 移动残差不变。在优化中，J 用来线性化残差，H 用来构造增量方程。（见 3.1.5、3.1.5.1、3.1.5.2）<\/p>\n<p><strong>3. 为什么是“近似” Hessian，LM 阻尼算不算信息<\/strong><\/p>\n<pre class=\"code\"><code>H_exact = J^T*Omega*J + 与“残差 × 残差二阶导数”有关的项<\/code><\/pre>\n<p>Gauss-Newton 丢掉了第二项，所以 <code>J^T*Omega*J<\/code> 严格说只是近似 Hessian。残差小、初值好、模型接近线性时，第二项很小，近似可靠；残差是线性函数时（如 <code>r = x + 2y - 3<\/code>）第二项为零，两者相等。LM 解的是 <code>(H_GN + lambda*D)*delta_x = -g<\/code>，<co
