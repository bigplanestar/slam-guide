而不是只把一段轨迹调漂亮。<\/li><\/ol>\n<p>例如：<\/p>\n<pre class=\"code\"><code>LiDAR 点面残差       r_L = 0.06 m, sigma_L = 0.03 m\n轮速前进距离残差     r_W = 0.10 m, sigma_W = 0.10 m<\/code><\/pre>\n<p>标准化以后：<\/p>\n<pre class=\"code\"><code>r_L / sigma_L = 2\nr_W / sigma_W = 1<\/code><\/pre>\n<p>虽然轮速原始残差 <code>0.10 m<\/code> 更大，但相对于自身噪声只偏离 1 个标准差；激光残差反而更异常。优化器真正比较的是这种归一化后的不一致。<\/p>\n<p>还要处理方向相关的不确定度。走廊中激光沿走廊方向弱，不能只给整帧一个标量权重；可以依据 Hessian 特征向量放大弱方向协方差。最后要检查相关性：若激光里程计已经融合某段 IMU，再把它与同一段 IMU 当成两个独立因子相乘，会重复计算信息。<\/p><\/section>\n<section class=\"sec\" data-sec=\"9.2.8\"><h3 id=\"s9.2.8\"><span class=\"num\">9.2.8<\/span> 问题八：系统在哪些环境中会退化？<\/h3>\n<div class=\"tbl\"><table><thead><tr><th>场景<\/th><th>为什么退化或失败<\/th><th>可观察指标<\/th><th>应对方法<\/th><\/tr><\/thead><tbody><tr><td>长直走廊<\/td><td>平面法向单一，沿走廊方向弱<\/td><td>Hessian 小特征值、协方差增大<\/td><td>融合轮速/视觉，方向相关降权<\/td><\/tr><tr><td>单一地面或大平面<\/td><td><code>x、y、yaw<\/code> 约束弱<\/td><td>有效法向分布集中<\/td><td>增加侧向结构或其他传感器<\/td><\/tr><tr><td>空旷、点云稀疏<\/td><td>邻域不足，平面拟合不稳定<\/td><td>有效匹配数下降<\/td><td>扩大但限制搜索、降速或拒绝入图<\/td><\/tr><tr><td>玻璃、雨雾、灰尘<\/td><td>多径、假点或回波异常<\/td><td>强度/距离异常，残差长尾<\/td><td>预处理、鲁棒核、传感器健康门控<\/td><\/tr><tr><td>大量动态物体<\/td><td>静态地图假设失效<\/td><td>同一区域残差成片增大<\/td><td>动态点过滤、短期地图<\/td><\/tr><tr><td>重复货架或相似走廊<\/td><td>容易产生错误匹配和假回环<\/td><td>多个候选得分接近<\/td><td>加强几何验证和时序一致性<\/td><\/tr><tr><td>高速转弯<\/td><td>时间偏差和去畸变误差被放大<\/td><td>墙面扭曲，误差与角速度相关<\/td><td>校准时偏、逐点去畸变<\/td><\/tr><tr><td>轮胎打滑<\/td><td>轮速不再代表本体运动<\/td><td>轮速与 IMU/LiDAR 创新冲突<\/td><td>打滑检测并增大轮速协方差<\/td><\/tr><tr><td>长时间匀速或静止<\/td><td>IMU 某些 bias/外参缺少激励<\/td><td>参数与状态强相关<\/td><td>增加激励或固定不可观参数<\/td><\/tr><\/tbody><\/table><\/div>\n<p>退化不是只有“算法崩溃”一种结果。更常见的是系统仍输出平滑轨迹，但某些方向已经没有信息。可靠系统应把这种不确定度反映到协方差和运行状态中。<\/p><\/section>\n<section class=\"sec\" data-sec=\"9.2.9\"><h3 id=\"s9.2.9\"><span class=\"num\">9.2.9<\/span> 问题九：怎样判断问题来自传感器、前端还是后端？<\/h3>\n<p>按照数据流从前往后定位，不要看到地图歪了就立即调优化器。<\/p>\n<div class=\"tbl\"><table><thead><tr><th>层级<\/th><th>先检查什么<\/th><th>典型现象<\/th><\/tr><\/thead><tbody><tr><td>传感器与驱动<\/td><td>时间戳、频率、丢包、饱和、单位、坐标轴<\/td><td>原始数据已跳变，IMU 静止不稳定<\/td><\/tr><tr><td>标定与预处理<\/td><td>外参、时偏、逐点时间、去畸变、滤波<\/td><td>转弯时双墙，速度越快越严重<\/td><\/tr><tr><td>前端匹配<\/td><td>对应点、平面质量、残差、迭代步长、Hessian<\/td><td>相邻帧已错位，局部 odom 立即跳变<\/td><\/tr><tr><td>后端图优化<\/td><td>各类因子残差、权重、回环、边缘化先验<\/td><td>前端连续，加入回环后全局轨迹突然扭曲<\/td><\/tr><tr><td>地图管理<\/td><td>入图门限、动态点、地图更新和坐标变换<\/td><td>位姿尚可但地图逐渐变厚或留下鬼影<\/td><\/tr><\/tbody><\/table><\/div>\n<p>一套可复现的诊断流程是：<\/p>\n<ol><li value=\"1\">录制原始数据、标定文件、参数和代码版本；<\/li><li value=\"2\">回放时画出各传感器时间差、频率和队列积压；<\/li><li value=\"3\">查看未去畸变与去畸变后的单帧点云；<\/li><li value=\"4\">只运行 IMU 传播，再逐个启用轮速、LiDAR、GNSS；<\/li><li value=\"5\">保存每类原始残差、白化残差、匹配数和 Hessian 特征值；<\/li><li value=\"6\">暂时关闭回环，比较前端轨迹与完整轨迹；<\/li><li value=\"7\">找到第一次明显偏离的时间，而不是只研究最终坏地图；<\/li><li value=\"8\">修改一个因素后在同一数据上回归测试。<\/li><\/ol><\/section>\n<section class=\"sec\" data-sec=\"9.2.10\"><h3 id=\"s9.2.10\"><span class=\"num\">9.2.10<\/span> 问题十：与 LIO-SAM、FAST-LIO2、Cartographer 有什么差异？<\/h3>\n<p>下面比较的是这些方法的典型公开架构，不代表所有二次开发版本。<\/p>\n<div class=\"tbl\"><table><thead><tr><th>对比项<\/th><th>FAST-LIO2<\/th><th>LIO-SAM<\/th><th>Cartographer<\/th><th>本章示例系统<\/th><\/tr><\/thead><tbody><tr><td>核心估计方式<\/td><td>迭代误差状态卡尔曼滤波<\/td><td>局部激光优化 + iSAM2 因子图<\/td><td>局部 SLAM + 子图位姿图<\/td><td>高频滤波前端 + 关键帧因子图<\/td><\/tr><tr><td>LiDAR 特征<\/td><td>原始点直接配准<\/td><td>典型实现提取边缘/平面特征<\/td><td>体素/概率栅格或混合栅格扫描匹配<\/td><td>可选择原始点或平面特征<\/td><\/tr><tr><td>地图组织<\/td><td>ikd-Tree 增量局部地图<\/td><td>关键帧局部地图<\/td><td>submap 子图<\/td><td>局部增量地图 + 全局关键帧<\/td><\/tr><tr><td>IMU 用途<\/td><td>高频传播并参与迭代更新<\/td><td>去畸变、初值、预积分因子<\/td><td>3D 中参与姿态与局部轨迹估计<\/td><td>前端传播；后端预积分因子<\/td><\/tr><tr><td>回环/全局图<\/td><td>原始方法不内置完整全局回环<\/td><td>支持回环和 GPS 因子<\/td><td>子图与轨迹节点的全局约束<\/td><td>回环、GNSS 和关键帧图<\/td><\/tr><tr><td>典型优势<\/td><td>高频、原始点利用充分、增量地图高效<\/td><td>因子结构清楚，便于加入全局约束<\/td><td>2D/3D 子图及全局闭环体系成熟<\/td><td>同时兼顾控制连续性和全局修正<\/td><\/tr><tr><td>主要复杂点<\/td><td>滤波一致性、退化和大规模全局修正<\/td><td>特征质量、两级估计和因子权重<\/td><td>参数较多，计算与子图管理复杂<\/td><td>前后端信息相关性和接口协方差<\/td><\/tr><\/tbody><\/table><\/div>\n<p>一句话区分：<\/p>\n<ul><li>FAST-LIO2 更像“高频紧耦合 LIO 前端”；<\/li><li>LIO-SAM 更突出“关键帧、IMU 预积分和增量因子图”；<\/li><li>Cartographer 更突出“局部扫描匹配、submap 和全局位姿图”；<\/li><li>示例系统有意组合实时前端与全局后端，但必须避免重复使用同一传感器信息。<\/li><\/ul>\n<p>详细的 FAST-LIO2 与 LIO-SAM 推导见第 5.2 章；g2o、iSAM2 和因子图见第 4.2 章。<\/p><\/section>\n<section class=\"sec\" data-sec=\"9.2.11\"><h3 id=\"s9.2.11\"><span class=\"num\">9.2.11<\/span> 问题十一：实际运行频率、CPU 占用和内存占用是多少？<\/h3>\n<p>这道题不能编数字。没有测量过，就明确说“当前缺少系统化统计”，随后给出补测方案。一份可复现的性能结果至少要同时说明：<\/p>\n<pre class=\"code\"><code>CPU 型号、核心数和频率\n是否使用 GPU\n编译类型和线程数\n数据集、传感器频率和点数\n地图大小与运行时长\n关键参数和软件版本<\/code><\/pre>\n<p>建议记录：<\/p>\n<div class=\"tbl\"><table><thead><tr><th>指标<\/th><th>不能只看什么<\/th><th>推荐报告方式<\/th><\/tr><\/thead><tbody><tr><td>处理频率<\/td><td>只看输入发布频率<\/td><td>实际完成帧率、丢帧数和队列长度<\/td><\/tr><tr><td>延迟<\/td><td>只报平均值<\/td><td>端到端 <code>p50/p95/p99<\/code> 延迟<\/td><\/tr><tr><td>CPU<\/td><td>只报瞬时 <code>top<\/code> 截图<\/td><td>一段完整数据的均值、峰值及各线程热点<\/td><\/tr><tr><td>内存<\/td><td>只报启动时 RSS<\/td><td>峰值 RSS 和随地图规模的增长曲线<\/td><\/tr><tr><td>实时性<\/td><td>只说“能实时”<\/td><td>单帧预算、超时比例和最长连续积压<\/td><\/tr><\/tbody><\/table><\/div>\n<p>面试中可以按下面的模板回答真实测量值：<\/p>\n<blockquote>在【CPU/核心数】上，以【LiDAR 点数和输入频率】运行【数据集或场景】；前端完成频率为【数值】Hz，端到端延迟 <code>p50/p95<\/code> 为【数值】，进程 CPU 均值/峰值为【数值】，运行【时长】后的峰值 RSS 为【数值】。主要热点是【邻近搜索/残差构造/线性求解】，地图增长到【规模】后性能变化为【数值】。<\/blockquote>\n<p>ROS 2 可结合 topic 频率/延迟统计、进程监控、<code>perf<\/code> 火焰图和长时间 rosbag 回放。重点是结果可复现，并能解释瓶颈来自算法复杂度、锁竞争、内存分配还是消息积压。<\/p><\/section>\n<section class=\"sec\" data-sec=\"9.2.12\"><h3 id=\"s9.2.12\"><span class=\"num\">9.2.12<\/span> 问题十二：如果重新设计，最想修改什么？<\/h3>\n<p>好的回答应选择一个有证据的主要问题，而不是罗列十个流行模块。以本章示例系统为例：<\/p>\n<blockquote>我最想重构前端到后端的约束接口。旧设计把前端融合位姿当成固定对角协方差的因子，同时又在后端加入同一段 IMU，既忽略了走廊弱方向，也重复计算了信息。新接口把“融合位姿初值”和“传感器约束”分开：融合位姿只提供初值；LiDAR 匹配单独输出残差统计、有效匹配数、相对位姿约束和方向相关协方差。后端再把 LiDAR 约束、原始IMU 预积分和轮速各加入一次。<\/blockquote>\n<p>可以分四步落地：<\/p>\n<ol><li value=\"1\">定义带时间范围、坐标系、协方差和数据来源标识的约束消息；<\/li><li value=\"2\">用白化雅可比或 Hessian 特征分解估计弱方向；<\/li><li value=\"3\">对退化方向增大协方差，低质量帧不进入永久地图；<\/li><li value=\"4\">用正常、走廊、打滑和假回环数据集做精度、NIS、一致性及性能回归。<\/li><\/ol>\n<p>这个回答体现的不是“会换一个更复杂的算法”，而是能根据失败证据修改系统信息流，并设计可验证的验收指标。如果自己的项目真正瓶颈是时间同步、内存增长或动态物体，也应围绕对应证据回答，而不要照搬本例。<\/p><\/section>\n<section class=\"sec\" data-sec=\"9.2.13\"><h3 id=\"s9.2.13\"><span class=\"num\">9.2.13<\/span> 十二问之间不是相互独立的<\/h3>\n<p>十二问实际构成一条排查链：<\/p>\n<pre class=\"code\"><code>使用场景决定输入输出和性能边界\n  -&gt; 输入决定状态与观测模型\n  -&gt; 观测模型决定残差和雅可比\n  -&gt; 噪声决定白化与权重\n  -&gt; 残差、雅可比和权重决定优化结果及可观性\n  -&gt; 环境与标定决定何时退化\n  -&gt; 诊断指标决定能否定位前端、后端或传感器问题\n  -&gt; 架构比较与性能数据支撑重新设计<\/code><\/pre>\n<p>面试官连续追问这些问题，通常是在检查同一个项目描述能否从使用场景一直闭环到数学模型、代码实现、实验数据和失败处理，而不是要求背十二段互不相关的标准答案。<\/p><\/section>\n<section class=\"sec\" data-sec=\"9.2.14\"><h3 id=\"s9.2.14\"><span class=\"num\">9.2.14<\/span> 本章面试题与参考答案<\/h3>\n<p>（先自己作答，再对照答案；答案后括号注明对应小节。本章题目模拟面试官围绕一个项目的连续追问，答案以本章示例系统为准，并跨章引用推导出处。）<\/p>\n<h4>题目<\/h4>\n<ol><li value=\"1\">面试官说“介绍一下你的 SLAM 项目”。你怎样用三四句话回答？为什么“我做了一个基于 FAST-LIO 的建图”不够？<\/li><li value=\"2\">追问：你的状态量里有没有外参、时间偏移和轮速尺度？是不是在线标定的变量越多越好？<\/li><li value=\"3\">请写出 LiDAR 点到平面、轮速和回环三种因子的残差，并说明每种残差最容易写错的地方。<\/li><li value=\"4\">请从噪声分布推导出你的优化目标。有了鲁棒核，是不是就不怕时间同步和外参错误了？<\/li><li value=\"5\">追问：你的雅可比是解析的还是数值的？怎样证明它是对的？数值检查通过了还可能错吗？<\/li><li value=\"6\">LiDAR 点面残差 0.06 m、sigma 0.03 m，轮速前进距离残差 0.10 m、sigma 0.10 m，哪个更异常？你的权重是怎样定的？<\/li><li value=\"7\">你的系统在哪些场景会退化？退化时系统输出什么，会不会“看起来正常”？<\/li><li value=\"8\">现场反馈“加了回环以后地图歪了”，你怎样判断问题来自传感器、前端还是后端？<\/li><li value=\"9\">你的系统和 FAST-LIO2、LIO-SAM、Cartographer 有什么区别？追问：前端已经融合了 IMU，后端又加 IMU 预积分，会不会重复？<\/li><li value=\"10\">面试官问“你们系统 CPU 占用多少、延迟多少”，但你没做过系统测量，怎么回答？如果重新设计，你最想改什么？<\/li><\/ol>\n<h4>参考答案<\/h4>\n<p><strong>1. 项目一句话介绍<\/strong><\/p>\n<p>参考回答：输入是带逐点时间的三维点云、IMU、左右轮编码器和可选 GNSS；输出是高频局部里程计、低频全局位姿、关键帧点云地图和定位质量指标；服务于轮式机器人在园区和厂房的建图定位，要求实时、连续，并能在短时激光退化时安全降级。<\/p>\n<p>“基于 FAST-LIO 做建图”信息太少：输入决定能用哪些观测，输出决定系统接口（<code>odom -&gt; base_link<\/code>、<code>map -&gt; odom<\/code>、协方差、质量指标），场景决定精度、延迟和失效策略。还应主动说明边界，例如不承诺在大面积玻璃、纯动态人群、无几何结构且无 GNSS 的环境中长期保持厘米级精度。（见 9.2.1）<\/p>\n<p><strong>2. 状态量与在线标定<\/strong><\/p>\n<p>前端状态：<code>R_W_I<\/code>、<code>p_W_I<\/code>、<code>v_W_I<\/code>、<code>b_g<\/code>、<code>b_a<\/code>，以及可固定或估计的 <code>g_W<\/code>；在线标定可再加 <code>R_I_L<\/code>、<code>t_I_L<\/code>、<code>scale_wheel<\/code>、<code>delta_t_LI<\/code>。后端关键帧保存 <code>{T_W_I_k, v_W_I_k, b_g_k, b_a_k}<\/code>，只做位姿图时也可只优化 <code>T_W_B_k<\/code>。<\/p>\n<p>不是越多越好。只有运动提供足够激励时，外参、时间偏移和 bias 才能被区分；长时间匀速或静止时它们缺少激励，不可观的标定量会与位姿互相补偿，看似收敛实际错误，此时应固定不可观参数或增加激励。回答时还要区分状态、测量、参数和地图数据四个概念。（见 9.2.2、9.2.8、7.1.6）<\/p>\n<p><strong>3. 三种因子的残差<\/strong><\/p>\n<pre class=\"code\"><code>点到平面：h_L(x) = n^T*p_W(x) + d，r_L = h_L(x) - 0\n轮速：    r_wheel = z_wheel - h_wheel(T_(k-1), T_k)，z_wheel = [delta_s, delta_yaw]^T\n回环：    r_loop = Log[Z_i_j^-1 * (T_i^-1 * T_j)]<\/code><\/pre>\n<p>易错点：点到平面这里用的是“预测减测量”，与 2.2 节的“测量减预测”相反，两种都可以，但雅可比和更新方程必须跟随同一定义；<code>p_W<\/code> 要经过外参和位姿两次变换，方向不能写反。轮速在打滑时不能保持正常小协方差，否则会把整条轨迹拉歪。回环的位姿误差不能逐元素相减，要用 <code>Log<\/code> 取局部误差；而且回环的关键不只是公式，还有候选检索、几何验证和异常抑制。每个残差都要核对坐标系、单位与分量顺序、符号与雅可比一致、协方差维度顺序一致、零残差对应几何一致。（见 9.2.3、9.2.4、7.1.2）<\/p>\n<p><strong>4. 目标函数推导与鲁棒核<\/strong><\/p>\n<p>五步：假设 <code>z_i = h_i(x) + v_i<\/code>，<code>v_i<\/code> 服从零均值、协方差 <code>Sigma_i<\/code> 的高斯；单条测量密度正比于 <code>exp[-0.5*r_i^T*Sigma_i^-1*r_i]<\/code>；给定状态后测量条件独立，联合似然为乘积；取负对数去掉常数，得到<\/p>\n<pre class=\"code\"><code>F_MLE(x) = 0.5 * Σ_i r_i^T*Sigma_i^-1*r_i\nF_MAP(x) = 0.5 * r_prior^T*Sigma_prior^-1*r_prior + F_MLE(x)<\/code><\/pre>\n<p>工程中再对每项平方马氏距离套鲁棒核 <code>rho(.)<\/code> 应对动态物体、错误关联和假回环。但鲁棒核只保护少数离群点；时间同步和外参错误是系统性误差，会让大量残差一起偏，鲁棒核既识别不了也修不好，不能替代标定和数据关联。（见 9.2.5、9.1.3、2.4）<\/p>\n<p><strong>5. 雅可比怎样验证<\/strong><\/p>\n<p>参考回答：点到平面、轮速、GNSS 因子在高频路径上且结构简单，用解析雅可比；复杂的回环位姿残差用库提供的解析或自动求导；开发阶段用中心差分逐列检查，随机生成多组位姿，特别测试接近零旋转和较大旋转；数值差分只用于验证，不放在高频生产路径。<\/p>\n<pre class=\"code\"><code>J(:,j) approximately_equals [r(x plus epsilon*e_j) - r(x minus epsilon*e_j)] / (2*epsilon)<\/code><\/pre>\n<p><code>plus/minus<\/code> 要用程序实际的流形扰动。数值检查通过仍可能错：如果预测测量本身坐标系写错，解析和数值雅可比会“一致地错”，所以还需要几何单元测试（人工扰动某方向，看残差变化是否符合直觉）。常见写错点：<code>T_A_B<\/code> 与 <code>T_B_A<\/code> 反了、左扰动推导配右扰动更新、状态排列顺序不一致、对四元数四个分量直接求导、残差从 <code>z-h<\/code> 改成 <code>h-z<\/code> 后雅可比没改符号。（见 9.2.6、9.1.4、3.5.12）<\/p>\n<p><strong>6. 权重与标准化残差<\/strong><\/p>\n<pre class=\"code\"><code>LiDAR：0.06 / 0.03 = 2 个标准差\n轮速： 0.10 / 0.10 = 1 个标准差<\/code><\/pre>\n<p>轮速原始残差更大，但相对自身噪声只偏 1 个标准差，激光反而更异常；优化器比较的就是这种归一化后的不一致，所以不能直接比较原始残差，更不能按“哪个传感器更重要”主观定权。权重 <code>Omega_i = Sigma_i^-1<\/code>，确定顺序：用静止或有真值数据估基础噪声；用标定残差估外参和时间同步不确定度；按匹配点数、平面质量、打滑、GNSS 状态在线调协方差；看白化残差、NIS 和卡方通过率是否符合预期（多帧 NIS 均值应接近测量维数）；在独立数据集上验证。走廊中还要按 Hessian 特征向量放大弱方向协方差，而不是整帧一个标量。（见 9.2.7、4.1.3.8、5.2.19）<\/p>\n<p><strong>7. 退化场景<\/strong><\/p>\n<p>长直走廊（法向单一，纵向弱）、单一地面或大平面（<code>x、y、yaw<\/code> 弱）、空旷稀疏（邻域不足）、玻璃雨雾灰尘（假点和长尾残差）、大量动态物体（静态假设失效）、重复货架和相似走廊（错误匹配、假回环）、高速转弯（时偏和去畸变误差放大）、轮胎打滑（轮速与 IMU/LiDAR 冲突）、长时间匀速或静止（bias、外参缺少激励）。<\/p>\n<p>最危险的是“看起来正常”：更常见的结果不是崩溃，而是系统仍输出平滑轨迹，但某些方向已经没有信息。可靠系统要把它反映到协方差和运行状态中：输出 Hessian 小特征值、有效匹配数等质量指标，弱方向增大协方差、低置信不入图，必要时降速、停车或请求重定位。（见 9.2.8、7.1.1、7.1.6）<\/p>\n<p><strong>8. 定位问题来自哪一层<\/strong><\/p>\n<p>按数据流从前往后查，不要看到地图歪就调优化器：<\/p>\n<pre class=\"code\"><code>传感器与驱动：原始数据已跳变、IMU 静止不稳\n标定与预处理：转弯双墙、越快越严重\n前端匹配：相邻帧已错位、局部 odom 立即跳变\n后端图优化：前端连续，加入回环后全局轨迹突然扭曲\n地图管理：位姿尚可但地图逐渐变厚或有鬼影<\/code><\/pre>\n<p>“加了回环才歪”指向后端，但仍要验证：暂时关闭回环比较前端轨迹与完整轨迹；找到第一次明显偏离的时间；检查该回环的重叠率、法向和 Hessian 是否退化、相对变换是否与里程计相容、第一候选是否显著好于第二候选；检查回环信息矩阵是否六自由度都填同样大的权重、变换方向是否写反。修改一个因素后在同一数据上回归。另外优化后轨迹对了但旧墙仍在，是地图没有按优化位姿重建。（见 9.2.9、7.3.3、7.3.6、7.3.7）<\/p>\n<p><strong>9. 与开源系统的对比；是否重复计算<\/strong><\/p>\n<p>FAST-LIO2 更像高频紧耦合 LIO 前端（迭代误差状态卡尔曼滤波、原始点配准、ikd-Tree，原始方法不含完整全局回环）；LIO-SAM 突出关键帧、IMU 预积分和 iSAM2 增量因子图（边缘/平面特征，支持回环和 GPS）；Cartographer 突出局部扫描匹配、submap 和全局位姿图；示例系统组合高频滤波前端和关键帧因子图，兼顾控制连续性和全局修正。<\/p>\n<p>追问：只要前端结果只当初值就不会重复。示例系统约定前端融合位姿只给后端提供初值，后端用 LiDAR 约束、原始 IMU 预积分和轮速各加入一次。如果把已融合 IMU 的前端位姿当成独立因子，再加同一段 IMU 预积分，就把同一信息算了两次，协方差被低估、系统过度自信。这是全文第二条红线。（见 9.2.10、9.2 章开头、4.3.6、5.2.19、0.1.1）<\/p>\n<p><strong>10. 性能数字与重新设计<\/strong><\/p>\n<p>性能题不能编数字。没测过就说“当前缺少系统化统计”，然后给补测方案：说明 CPU 型号和核心数、是否用 GPU、编译类型和线程数、数据集、传感器频率和点数、地图大小和运行时长、参数和版本；报告实际完成帧率和丢帧数、端到端 <code>p50/p95/p99<\/code> 延迟、整段数据的 CPU 均值和峰值及线程热点、峰值 RSS 及随地图增长曲线、单帧超时比例和最长积压。<\/p>\n<p>重新设计要选一个有证据的主要问题，而不是罗列流行模块。示例：重构前端到后端的约束接口，旧设计把前端融合位姿当固定对角协方差因子，又加入同一段 IMU，既忽略走廊弱方向又重复计算信息；新接口让融合位姿只做初值，LiDAR 单独输出相对约束、有效匹配数和方向相关协方差。落地四步：定义带时间范围、坐标系、协方差和来源标识的约束消息；用白化雅可比或 Hessian 特征分解估弱方向；退化方向增大协方差、低质量帧不入永久地图；用正常、走廊、打滑、假回环数据集做精度、NIS、一致性和性能回归。（见 9.2.11、9.2.12）<\/p>\n<hr><\/section>", "sections": [{"id": "9.2.1", "title": "问题一：系统输入、输出和使用场景是什么？"}, {"id": "9.2.2", "title": "问题二：状态量包含哪些变量？"}, {"id": "9.2.3", "title": "问题三：每种传感器对应什么观测模型？"}, {"id": "9.2.4", "title": "问题四：残差是怎样定义的？"}, {"id": "9.2.5", "title": "问题五：优化目标函数怎样从噪声分布推导出来？"}, {"id": "9.2.6", "title": "问题六：雅可比是解析计算还是数值计算？"}, {"id": "9.2.7", "title": "问题七：不同传感器怎样确定权重？"}, {"id": "9.2.8", "title": "问题八：系统在哪些环境中会退化？"}, {"id": "9.2.9", "title": "问题九：怎样判断问题来自传感器、前端还是后端？"}, {"id": "9.2.10", "title": "问题十：与 LIO-SAM、FAST-LIO2、Cartographer 有什么差异？"}, {"id": "9.2.11", "title": "问题十一：实际运行频率、CPU 占用和内存占用是多少？"}, {"id": "9.2.12", "title": "问题十二：如果重新设计，最想修改什么？"}, {"id": "9.2.13", "title": "十二问之间不是相互独立的"}, {"id": "9.2.14", "title": "本章面试题与参考答案"}]}, {"num": "9.3", "title": "把五个问题串成一条因果链", "html": "<section class=\"sec\" data-sec=\"9.3.0\"><div class=\"callout tip\"><strong>为什么现在学这一章<\/strong>：全书结论：几何单一 → 残差不敏感 → 信息缺失 → 退化 → 错误入图 → 错层，以及需要什么样的前端和后端。<\/div>\n<pre class=\"code\"><code>环境几何单一\n    ↓\n点到面残差对某些位姿方向不敏感\n    ↓\n雅可比出现近似零空间，Hessian 出现小特征值\n    ↓\n激光在这些方向退化，位姿不确定度增大\n    ↓\n若仍强行使用高权重并把点云永久入图\n    ↓\n地图出现漂移、双墙或错层\n    ↓\n前端需要滤波器提供连续预测和退化门控\n后端需要 g2o / GTSAM 一类求解器联合处理关键帧和回环<\/code><\/pre>\n<p>一个可靠系统最终依赖的是整条链路：<\/p>\n<ul><li>正确的时间同步、去畸变、坐标系和外参；<\/li><li>能解释来源的残差、噪声和信息矩阵；<\/li><li>用马氏距离、卡方门限或 NIS 检查残差是否与协方差模型一致；<\/li><li>白化、尺度化后的退化检测；<\/li><li>方向相关融合，而不是整帧盲目接受或拒绝；<\/li><li>不重复计算的多传感器信息；<\/li><li>经过验证的回环和合理权重；<\/li><li>低可信不入图、地图可重建、系统可降级和可重定位。<\/li><\/ul>\n<p>如果只记住一句话，可以记住：<\/p>\n<blockquote>SLAM 不是把许多公式和传感器堆在一起，而是在明确的概率假设下，用每条测量真正提供的信息去约束状态；没有提供的信息必须诚实地保留为不确定度。<\/blockquote><\/section>\n<section class=\"sec\" data-sec=\"9.3.1\"><h3 id=\"s9.3.1\"><span class=\"num\">9.3.1<\/span> 本章面试题与参考答案<\/h3>\n<p>（先自己作答，再对照答案；答案后括号注明对应小节。本章题目要求把全文五个问题串起来回答。）<\/p>\n<h4>题目<\/h4>\n<ol><li value=\"1\">串联题：请用一条因果链把“长走廊退化、雅可比与 Hessian、错层、卡尔曼滤波与图优化、g2o 与 iSAM2”五个问题连起来。<\/li><li value=\"2\">追问：在这条链上，哪一环是真正把“定位不准”变成“地图坏掉”的？应该在哪里切断？<\/li><li value=\"3\">为什么链的结尾同时需要“前端滤波器”和“后端 g2o / GTSAM 一类求解器”？只用其中一个行不行？<\/li><li value=\"4\">综合题：一个系统“优化收敛、残差很小、卡方检验通过”，但地图出现双墙。结合全文，列出至少三种可能的原因，并说明各自该看什么指标。<\/li><li value=\"5\">全文的三条红线是什么？各举一个在本文项目或示例中出现过的具体例子。<\/li><li value=\"6\">如果面试官只给你一句话的时间总结 SLAM，你怎么说？这句话怎样对应到工程上的具体做法？<\/li><\/ol>\n<h4>参考答案<\/h4>\n<p><strong>1. 五个问题的因果链<\/strong><\/p>\n<pre class=\"code\"><code>环境几何单一（长走廊，问题一）\n  -&gt; 点到面残差对某些位姿方向不敏感\n  -&gt; 雅可比出现近似零空间，Hessian 出现小特征值（问题三）\n  -&gt; 激光在这些方向退化，位姿不确定度增大\n  -&gt; 若仍强行用高权重并把点云永久入图\n  -&gt; 地图漂移、双墙或错层（问题二）\n  -&gt; 前端需要滤波器提供连续预测和退化门控，后端需要图优化联合处理关键帧和回环（问题五）\n  -&gt; 后端用 g2o 批量求解还是 iSAM2 增量求解，取决于因子到来的方式（问题四）<\/code><\/pre>\n<p>要点是：J 和 H 是诊断工具，退化是信息缺失，错层是把缺失信息当成确定信息写进地图的后果，滤波与图优化、g2o 与 iSAM2 是组织求解的方式，它们都在求同一个 MAP 问题。（见 17、0.1、7.1.2、3.1.5、7.3.2、4.3.6、4.2.12）<\/p>\n<p><strong>2. 从定位不准到地图坏掉的那一环<\/strong><\/p>\n<p>关键一环是“仍强行使用高权重并把点云永久入图”。地图点由 <code>p_map_hat = T_map_lidar_hat * p_lidar<\/code> 生成，错误位姿写进地图后，下一帧又以错误地图为参考匹配，形成“错误位姿 -&gt; 错误点云入图 -&gt; 后续匹配靠近错误层 -&gt; 错层扩大”的反馈。<\/p>\n<p>切断方法：把“匹配器返回了位姿”和“本帧允许永久入图”分成两个判断；退化方向只接受可靠方向的激光修正（截断 SVD 或连续降权），弱方向增大协方差；低可信扫描拒绝入图；保存关键帧、原始点云和位姿版本，优化后能从原始关键帧重建地图，而不是事后擦除融合点云。（见 7.3.2、7.3.7、7.1.4、17）<\/p>\n<p><strong>3. 为什么前端滤波和后端图优化都要<\/strong><\/p>\n<p>前端滤波（如 ESKF）延迟低、适合高频 IMU 传播，能给控制输出连续的 <code>odom -&gt; base_link<\/code>，并在每帧更新时做退化检测和 NIS 门控；但它把历史压缩进当前均值和协方差，非线性时无法在新轨迹上重线性化旧测量，处理大回环不便。<\/p>\n<p>后端图优化保留关键帧和原始因子，回环、GNSS 到来时可以重估历史轨迹，通过 <code>map -&gt; odom<\/code> 吸收全局修正；但它延迟高、需要好初值，也会受假回环影响。只用前端会长期漂移，只用后端则实时性和连续性不够。组合时必须避免把前端融合结果和同一份原始测量同时当独立因子。（见 17、4.3.5、4.3.6、7.5.12）<\/p>\n<p><strong>4. 收敛、残差小、卡方通过却有双墙<\/strong><\/p>\n<pre class=\"code\"><code>退化：走廊纵向没有信息，残差本来看不见该方向\n  看 Hessian 小特征值、白化尺度化后的奇异值、法向分布\n时间同步或去畸变错误：转弯时出现，速度越快越严重\n  看误差是否与角速度相关、逐点时间单位、单帧去畸变前后对比\n外参或变换方向错误：原地旋转出现固定双墙\n  看正反方向看同一面墙的偏差、四组控制实验\n假回环或回环权重过大：加入回环后地图突然折叠\n  看关闭回环前后轨迹、回环重叠率和第一/第二候选得分\n地图未按优化位姿重建：轨迹正确但旧墙仍在\n  看是否保存关键帧并重建地图<\/code><\/pre>\n<p>卡方检验只查“残差相对协方差是否异常”，查不出缺失方向；系统误差又常被错误的位姿“吸收”掉，残差照样很小。所以要先找第一帧错误，再分清单帧/局部地图已变形还是局部清晰但全局错位。（见 17、7.1.3、7.3.1、7.3.3、7.3.5、7.3.6）<\/p>\n<p><strong>5. 三条红线<\/strong><\/p>\n<pre class=\"code\"><code>1. 残差、雅可比、扰动侧和协方差必须用同一套约定\n   例：点到平面用 h-z 而 1.4 节用 z-h；左扰动雅可比配右扰动更新会出错\n2. 同一份传感器信息不能重复计入\n   例：前端已融合 IMU 的位姿当独立因子，后端又加同一段 IMU 预积分，协方差被低估\n3. “优化收敛”不等于“所有方向都有信息”\n   例：长走廊残差很小、卡方通过，纵向奇异值仍接近零；LM 阻尼让方程可解也不产生信息<\/code><\/pre>\n<p>它们分别对应三类问题：实现不自洽、信息被夸大、信息被误认为存在。（见 0.1.1、9.2.4、9.2.6、9.2.12、7.1.3、7.1.4）<\/p>\n<p><strong>6. 一句话总结 SLAM<\/strong><\/p>\n<p>SLAM 不是把许多公式和传感器堆在一起，而是在明确的概率假设下，用每条测量真正提供的信息去约束状态；没有提供的信息必须诚实地保留为不确定度。<\/p>\n<p>对应到工程：时间同步、去畸变、坐标系和外参要正确；残差、噪声和信息矩阵能解释来源；用马氏距离、卡方门限或 NIS 检查残差与协方差是否一致；白化、尺度化后做退化检测；方向相关融合，而不是整帧盲目接受或拒绝；多传感器信息不重复计算；回环经过验证且权重合理；低可信不入图，地图可重建，系统可降级和重定位。（见 17）<\/p>\n<hr><\/section>", "sections": [{"id": "9.3.1", "title": "本章面试题与参考答案"}]}, {"num": "9.4", "title": "机器人 Agent：从“会聊天”到可验证的任务系统", "html": "<section class=\"sec\" data-sec=\"9.4.0\"><div class=\"callout tip\"><strong>为什么现在学这一章<\/strong>：状态估计之上怎样搭任务系统：Observation、Tools、Planner、Executor、Verifier，以及 VIO 与 Agent 怎样通过接口结合。<\/div>\n<p>Agent 容易让人感觉抽象，是因为很多演示只展示模型生成了一个计划，却没有说明它能调用哪些工具、动作怎样执行、成功怎样验证、失败怎样恢复。本章采用一个更具体的定义：<\/p>\n<blockquote>机器人 Agent 是一个根据任务和环境状态选择有限技能、监督执行结果，并在失败时重新规划或安全退出的任务调度系统。<\/blockquote>\n<p>它不负责取代 VIO、Nav2 或电机控制。三者的频率和职责不同：<\/p>\n<pre class=\"code\"><code>VIO / LIO          100 至 200 Hz 左右\n  估计姿态、位置、速度、bias 和不确定度\n\nNav2 / 局部控制    10 至 100 Hz 左右\n  计算路径、避障并产生连续速度命令\n\n机器狗 MPC / WBC   数百至上千 Hz\n  计算接触力、身体运动和关节控制\n\nAgent              低频、事件驱动\n  理解任务、选择技能、检查结果和处理失败<\/code><\/pre>\n<p>第一阶段应通过清晰接口组合这些模块，而不是训练一个模型端到端替代整条机器人栈。<\/p><\/section>\n<section class=\"sec\" data-sec=\"9.4.1\"><h3 id=\"s9.4.1\"><span class=\"num\">9.4.1<\/span> 一个最小 Agent 由哪几部分组成？<\/h3>\n<p>把 Agent 拆成五个可以单独测试的模块，就不再神秘。<\/p>\n<h4 id=\"s9.4.1.1\"><span class=\"num\">9.4.1.1<\/span> Observation：系统向 Agent 提供什么状态？<\/h4>\n<p>不要把原始 IMU、点云和高频图像全部塞给语言模型。先由确定性模块将状态压缩成有单位、有时间戳和有坐标系的结构化信息：<\/p>\n<pre class=\"code\"><code>{\n  &quot;robot_pose&quot;: {\n    &quot;frame&quot;: &quot;map&quot;,\n    &quot;x&quot;: 2.1,\n    &quot;y&quot;: 3.4,\n    &quot;yaw&quot;: 1.57\n  },\n  &quot;localization&quot;: {\n    &quot;status&quot;: &quot;healthy&quot;,\n    &quot;position_sigma&quot;: 0.08,\n    &quot;last_update_age_ms&quot;: 32\n  },\n  &quot;battery_percent&quot;: 67,\n  &quot;navigation_state&quot;: &quot;idle&quot;,\n  &quot;visible_objects&quot;: [\n    {\n      &quot;name&quot;: &quot;fire_extinguisher&quot;,\n      &quot;confidence&quot;: 0.91\n    }\n  ]\n}<\/code><\/pre>\n<p>Agent 通常不需要直接解释完整协方差矩阵，可以由状态监控模块根据协方差、特征数、数据延迟、创新统计和算法自身诊断，将定位质量分为：<\/p>\n<pre class=\"code\"><code>healthy   可以正常执行任务\ndegraded  应减速、增加观察或尝试重定位\nlost      必须停止依赖定位的自主运动<\/code><\/pre>\n<p>这个摘要必须保留原始指标，方便事后审计，不能只有语言模型生成的一句“定位似乎正常”。<\/p>\n<h4 id=\"s9.4.1.2\"><span class=\"num\">9.4.1.2<\/span> Tools：Agent 被允许做什么？<\/h4>\n<p>第一版只开放少量明确技能：<\/p>\n<pre class=\"code\"><code>get_robot_status()\nnavigate_to_named_place(name)\nnavigate_to_pose(frame, x, y, yaw)\ncapture_image()\ndock()\nstop_robot()<\/code><\/pre>\n<p>每个工具应明确：<\/p>\n<pre class=\"code\"><code>输入参数和类型\n参数使用的坐标系与单位\n执行前置条件\n超时时间\n成功判据\n可枚举的失败原因\n是否允许取消\n是否需要人工确认<\/code><\/pre>\n<p>例如 <code>navigate_to_pose<\/code> 不应接收一个没有 frame 的裸 <code>(x,y)<\/code>，否则 Agent 无法区分这个坐标属于 map、odom 还是局部地图。<\/p>\n<h4 id=\"s9.4.1.3\"><span class=\"num\">9.4.1.3<\/span> Planner：怎样把自然语言变成计划？<\/h4>\n<p>输入：<\/p>\n<pre class=\"code\"><code>去会议室门口拍照，然后回到充电桩<\/code><\/pre>\n<p>规划器必须输出可验证的结构，而不是一段散文：<\/p>\n<pre class=\"code\"><code>{\n  &quot;steps&quot;: [\n    {\n      &quot;tool&quot;: &quot;navigate_to_named_place&quot;,\n      &quot;arguments&quot;: {&quot;name&quot;: &quot;meeting_room_door&quot;}\n    },\n    {\n      &quot;tool&quot;: &quot;capture_image&quot;,\n      &quot;arguments&quot;: {}\n    },\n    {\n      &quot;tool&quot;: &quot;dock&quot;,\n      &quot;arguments&quot;: {}\n    }\n  ]\n}<\/code><\/pre>\n<p>第一版 Planner 可以完全不使用大模型，而是读取固定 JSON 计划。执行链可靠后，再让支持结构化输出的模型生成同一种数据结构。这样能够区分“计划生成错误”和“机器人执行错误”。<\/p>\n<h4 id=\"s9.4.1.4\"><span class=\"num\">9.4.1.4<\/span> Executor：怎样真正执行计划？<\/h4>\n<p>Executor 逐步调用 ROS 2 Action 或 Service，并维护明确状态：<\/p>\n<pre class=\"code\"><code>PENDING\nRUNNING\nSUCCESS\nFAILURE\nTIMEOUT\nCANCELED<\/code><\/pre>\n<p>长时间运行并需要反馈、取消或抢占的导航、回充和机械臂任务，应优先使用 ROS 2 Action。Executor 负责等待反馈、执行超时、取消目标和保存日志，而不是让语言模型在等待期间反复猜测。<\/p>\n<p>Nav2 已使用行为树组合路径计算、路径跟随、旋转、等待、后退和清理代价地图等节点。Agent适合在行为树之上选择任务和子树，行为树负责可重复的执行与恢复。参考：<\/p>\n<ul><li><a href=\"https://docs.ros.org/en/humble/Concepts/Basic/About-Actions.html\" target=\"_blank\" rel=\"noopener\">ROS 2 Actions<\/a><\/li><li><a href=\"https://docs.nav2.org/behavior_trees/overview/nav2_specific_nodes.html\" target=\"_blank\" rel=\"noopener\">Nav2 Behavior Tree Nodes<\/a><\/li><\/ul>\n<h4 id=\"s9.4.1.5\"><span class=\"num\">9.4.1.5<\/span> Verifier：怎样知道真的成功？<\/h4>\n<p>工具返回 <code>SUCCESS<\/code> 只是一个信号，关键任务还应使用独立条件验证。例如导航结束后检查：<\/p>\n<pre class=\"code\"><code>机器人与目标的距离是否小于 0.3 m\n航向误差是否小于允许门限\n定位状态是否仍为 healthy\n机器人是否已经停止\n目标是否处于允许到达的区域<\/code><\/pre>\n<p>巡检拍照后可以检查：<\/p>\n<pre class=\"code\"><code>图像是否成功保存\n目标是否真的进入画面\n图片是否绑定采样时间和 map 位姿\n检测置信度是否满足要求<\/code><\/pre>\n<p>独立验证能够防止“动作服务器返回成功，但业务目标没有完成”。<\/p><\/section>\n<section class=\"sec\" data-sec=\"9.4.2\"><h3 id=\"s9.4.2\"><span class=\"num\">9.4.2<\/span> Agent、VIO、VLA、WM 和 WAM 分别处在哪一层？<\/h3>\n<pre class=\"code\"><code>VIO / LIO\n  估计机器人状态：我在哪里、怎样运动、状态有多不确定\n\n3D Gaussian / semantic map / scene graph\n  表示环境：物体和空间关系是什么、世界长什么样\n\nVLM\n  理解视觉和语言语义\n\nVLA\n  从视觉、语言和机器人状态直接生成动作\n\nWM\n  预测执行动作后世界可能怎样变化\n\nWAM\n  联合学习世界变化和机器人动作\n\nAgent\n  维护任务、调用工具、使用反馈、组织上述模块<\/code><\/pre>\n<p>Agent 是系统架构，不等于某一种大模型。一个 Agent 可以只使用规则、状态机和行为树；也可以把VLM、VLA 或 WM 作为其中一个模块。反过来，一个能生成动作的模型若没有权限管理、任务记忆、执行反馈和安全退出，也不一定构成完整 Agent。<\/p><\/section>\n<section class=\"sec\" data-sec=\"9.4.3\"><h3 id=\"s9.4.3\"><span class=\"num\">9.4.3<\/span> 为什么先做确定性执行器，再接大模型？<\/h3>\n<p>第一阶段的目标是：<\/p>\n<pre class=\"code\"><code>读取固定计划 JSON\n  -&gt; 校验工具名称和参数\n  -&gt; 调用 ROS 2 技能\n  -&gt; 等待反馈\n  -&gt; 验证成功条件\n  -&gt; 失败时执行有限恢复或安全停止<\/code><\/pre>\n<p>这一步主要学习：<\/p>\n<ul><li>ROS 2 Action、Service 和生命周期；<\/li><li>状态机或行为树；<\/li><li>超时、取消和抢占；<\/li><li>技能输入输出及错误码；<\/li><li>幂等性，即重复执行是否会造成额外危险；<\/li><li>完整执行日志和任务 ID；<\/li><li>故障恢复和人工接管。<\/li><\/ul>\n<p>若这一层不可靠，加入大模型只会让失败模式更难复现。执行器稳定后，大模型只替换：<\/p>\n<pre class=\"code\"><code>user_goal + summarized_state + allowed_tools\n  -&gt; structured_plan<\/code><\/pre>\n<p>模型不直接接管低层控制。<\/p><\/section>\n<section class=\"sec\" data-sec=\"9.4.4\"><h3 id=\"s9.4.4\"><span class=\"num\">9.4.4<\/span> 计划验证和安全边界<\/h3>\n<p>在执行模型生成的计划前，确定性验证器至少检查：<\/p>\n<pre class=\"code\"><code>工具是否在白名单中\n参数类型和范围是否正确\n地点是否存在\nframe 是否明确\n是否进入禁区\n电量是否足够\n定位是否健康\n任务步骤是否超过上限\n预计时间是否超过预算\n动作是否需要人工确认<\/code><\/pre>\n<p>第一版不应允许 Agent：<\/p>\n<ul><li>直接发布高频 <code>cmd_vel<\/code>；<\/li><li>直接输出机器狗关节力矩或落足点；<\/li><li>任意执行 shell 命令；<\/li><li>任意修改 ROS 2 参数和外参；<\/li><li>绕过急停、碰撞保护或速度限制；<\/li><li>在失败后无限重试；<\/li><li>把不确定的语言地点直接当成可信地图坐标。<\/li><\/ul>\n<p>语言模型负责提出高层意图，实时控制和最终安全边界由确定性软件和硬件承担。<\/p><\/section>\n<section class=\"sec\" data-sec=\"9.4.5\"><h3 id=\"s9.4.5\"><span class=\"num\">9.4.5<\/span> 反馈和重新规划怎样形成闭环？<\/h3>\n<p>例如原计划为：<\/p>\n<pre class=\"code\"><code>去会议室<\/code><\/pre>\n<p>执行结果可能是：<\/p>\n<pre class=\"code\"><code>{\n  &quot;tool&quot;: &quot;navigate_to_named_place&quot;,\n  &quot;status&quot;: &quot;failure&quot;,\n  &quot;reason&quot;: &quot;path_blocked&quot;,\n  &quot;attempt&quot;: 1\n}<\/code><\/pre>\n<p>Agent 可以选择有限集合中的下一步：<\/p>\n<pre class=\"code\"><code>等待障碍物离开\n查询备用入口\n重新规划一次\n跳过当前巡检点\n请求人工处理\n终止任务并返回安全点<\/code><\/pre>\n<p>系统必须限制最大重试次数、总任务时间、模型调用次数和允许使用的恢复技能。若每次失败都把完整历史原样塞回模型，任务可能越来越长且不可控；应保存结构化摘要和关键证据。<\/p>\n<p>SayCan 的核心思想是同时评估“某个技能对任务是否有用”和“机器人当前状态下是否有能力完成”，而不是只根据语言合理性选择动作。参考 <a href=\"https://say-can.github.io/\" target=\"_blank\" rel=\"noopener\">SayCan<\/a>。<\/p><\/section>\n<section class=\"sec\" data-sec=\"9.4.6\"><h3 id=\"s9.4.6\"><span class=\"num\">9.4.6<\/span> 空间记忆怎样从 YAML 逐步升级？<\/h3>\n<p>第一版不需要 3D 场景图，可以使用一个有版本和坐标系的地点表：<\/p>\n<pre class=\"code\"><code>meeting_room_door:\n  frame: map\n  x: 3.2\n  y: 5.1\n  yaw: 1.57\n\ncharging_station:\n  frame: map\n  x: 0.5\n  y: 0.8\n  yaw: 3.14<\/code><\/pre>\n<p>第二步加入对象实例：<\/p>\n<pre class=\"code\"><code>对象 ID\n类别和文本描述\nmap 坐标与不确定度\n所属房间\n最后观测时间\n检测置信度\n可执行操作<\/code><\/pre>\n<p>第三步增加空间关系：<\/p>\n<pre class=\"code\"><code>fire_extinguisher_3 located_in room_A\ndoor_2 connects room_A and corridor_1\ncharging_station_1 near wall_4<\/code><\/pre>\n<p>再向后才需要开放词汇地图或三维场景图。VLMaps 将视觉语言特征融合到几何地图，使自然语言目标能够定位到地图；ConceptGraphs 将对象及其关系组织成开放词汇三维场景图：<\/p>\n<ul><li><a href=\"https://vlmaps.github.io/\" target=\"_blank\" rel=\"noopener\">VLMaps<\/a><\/li><li><a href=\"https://concept-graphs.github.io/\" target=\"_blank\" rel=\"noopener\">ConceptGraphs<\/a><\/li><\/ul>\n<p>无论使用哪种语义表示，几何位置仍要来自可靠相机位姿、VIO/LIO 和坐标变换。语义名称相似不等于空间位置可信。<\/p><\/section>\n<section class=\"sec\" data-sec=\"9.4.7\"><h3 id=\"s9.4.7\"><span class=\"num\">9.4.7<\/span> VIO 和 Agent 怎样通过接口结合？<\/h3>\n<p>VIO 不应把每条 IMU 数据交给 Agent，Agent 也不参与 VIO 的每次卡尔曼更新。合适接口是：<\/p>\n<pre class=\"code\"><code>Camera + IMU\n  -&gt; VIO\n  -&gt; odom -&gt; base_link\n  -&gt; pose, velocity, covariance, status\n\nSLAM / global localization\n  -&gt; map -&gt; odom\n\nsemantic memory\n  -&gt; named object or place in map\n\nAgent\n  -&gt; query state and semantic target\n  -&gt; call Nav2\n  -&gt; monitor localization quality and execution result<\/code><\/pre>\n<p>可以为 Agent 提供只读工具：<\/p>\n<pre class=\"code\"><code>get_localization_health()<\/code><\/pre>\n<p>返回结构示例：<\/p>\n<pre class=\"code\"><code>{\n  &quot;status&quot;: &quot;degraded&quot;,\n  &quot;position_sigma&quot;: 0.82,\n  &quot;yaw_sigma&quot;: 0.21,\n  &quot;tracked_features&quot;: 17,\n  &quot;last_update_age_ms&quot;: 230,\n  &quot;reason_codes&quot;: [&quot;low_feature_count&quot;, &quot;high_update_delay&quot;]\n}<\/code><\/pre>\n<p>确定性安全策略可以先写成：<\/p>\n<pre class=\"code\"><code>healthy\n  -&gt; 正常导航\n\ndegraded\n  -&gt; 限速、增加观察、缩短任务或尝试重定位\n\nlost\n  -&gt; 停止依赖全局定位的自主运动\n  -&gt; 执行预定义重定位流程\n  -&gt; 失败后请求人工接管<\/code><\/pre>\n<p>Agent 可以在允许范围内选择恢复方案，但 <code>lost<\/code> 时的停车动作不应等待语言模型决定。<\/p>\n<h4>一个具体巡检闭环<\/h4>\n<p>用户任务：<\/p>\n<pre class=\"code\"><code>去 A 区检查消防栓，定位不可靠时停止，拍照后回到充电桩。<\/code><\/pre>\n<p>执行链：<\/p>\n<pre class=\"code\"><code>1. 查询电量、定位状态和当前任务状态\n2. 查询 A 区消防栓对象及其 map 位姿\n3. 检查目标置信度和可达性\n4. 调用 NavigateToPose\n5. 持续监控 Nav2 反馈和定位质量\n6. 到达后验证距离、姿态和目标是否在画面中\n7. 保存图片、采样时间和 map 位姿\n8. 调用 dock 或 return_home\n9. 输出成功、失败点和证据链接<\/code><\/pre>\n<p>这就是 VIO 与 Agent 的实际结合：VIO 提供可度量的状态和质量，Agent 使用它决定任务是否能继续，而不是把二者强行训练成一个黑盒网络。<\/p><\/section>\n<section class=\"sec\" data-sec=\"9.4.8\"><h3 id=\"s9.4.8\"><span class=\"num\">9.4.8<\/span> 机器狗 Agent 应该控制到哪一层？<\/h3>\n<p>适合 Agent 决定的是：<\/p>\n<pre class=\"code\"><code>去哪个区域\n选择普通行走、爬楼梯还是低姿态技能\n是否因电量或定位退化而回撤\n巡检哪些目标\n失败后更换路线还是请求人工处理<\/code><\/pre>\n<p>不适合语言模型直接输出的是：<\/p>\n<pre class=\"code\"><code>每个关节的实时力矩\n每只脚的高频落足位置\n实时接触力\n高频速度闭环<\/code><\/pre>\n<p>推荐分层：<\/p>\n<pre class=\"code\"><code>Agent\n  选择“去二楼检查配电柜”及可用技能\n\n全局规划器\n  计算经过哪些区域\n\n地形和可通行性规划器\n  判断坡度、台阶、缝隙和身体碰撞\n\n运动技能层\n  walk、climb_stairs、stand、recover\n\nMPC / WBC / RL locomotion policy\n  产生实时身体和关节控制\n\n硬件安全层\n  处理限位、过流、跌倒保护和急停<\/code><\/pre>\n<p>上层 Agent 可以切换经过验证的运动技能，但不能绕过低层控制器的物理约束。<\/p><\/section>\n<section class=\"sec\" data-sec=\"9.4.9\"><h3 id=\"s9.4.9\"><span class=\"num\">9.4.9<\/span> 十二周 VIO 与 Agent 联合学习路线<\/h3>\n<p>按每周约 10 小时安排。前八周建议 VIO 占 70%，Agent 占 30%；最后四周进行系统集成，两条线各占一半。<\/p>\n<div class=\"tbl\"><table><thead><tr><th>周数<\/th><th>VIO 主线<\/th><th>Agent 支线<\/th><th>验收结果<\/th><\/tr><\/thead><tbody><tr><td>1<\/td><td>相机投影和解析雅可比<\/td><td>定义六个工具接口<\/td><td>投影数值测试和工具说明<\/td><\/tr><tr><td>2<\/td><td>光流和特征跟踪<\/td><td>模拟工具与固定计划执行器<\/td><td>固定 JSON 计划可以执行<\/td><\/tr><tr><td>3<\/td><td>对极几何和三角化<\/td><td>封装 ROS 2 Action<\/td><td>能导航并读取反馈<\/td><\/tr><tr><td>4<\/td><td>PnP 和重投影优化<\/td><td>超时、取消和计划验证<\/td><td>非法计划会被拒绝<\/td><\/tr><tr><td>5<\/td><td>IMU 测量和离散积分<\/td><td>接入结构化模型输出<\/td><td>自然语言变成合法 JSON<\/td><\/tr><tr><td>6<\/td><td>误差状态和协方差<\/td><td>执行反馈和有限重试<\/td><td>失败后能恢复或停止<\/td><\/tr><tr><td>7<\/td><td>OpenVINS 数据链<\/td><td>地点 YAML 和任务记忆<\/td><td>能导航到命名地点<\/td><\/tr><tr><td>8<\/td><td>EuRoC、APE、RPE<\/td><td>Agent 日志和任务指标<\/td><td>两条链分别可重复运行<\/td><\/tr><tr><td>9<\/td><td>VIO 输出接入 ROS 2<\/td><td>定位质量查询工具<\/td><td>Agent 能识别定位退化<\/td><\/tr><tr><td>10<\/td><td>TF 与 map/odom 联调<\/td><td>Agent 调用 Nav2<\/td><td>定位正常时完成任务<\/td><\/tr><tr><td>11<\/td><td>制造遮挡、模糊或时间偏移<\/td><td>故障恢复与安全停止<\/td><td>定位失效时不继续盲走<\/td><\/tr><tr><td>12<\/td><td>综合数据和误差分析<\/td><td>完整巡检任务<\/td><td>生成带位姿和证据的报告<\/td><\/tr><\/tbody><\/table><\/div>\n<p>如果某周没有达到验收标准，应延长当前阶段，不要因为日历进入下一周。Agent 和 VIO 都属于强依赖接口一致性的系统：前一层坐标、时间或状态不清楚，后一层功能越多，调试越困难。<\/p><\/section>\n<section class=\"sec\" data-sec=\"9.4.10\"><h3 id=\"s9.4.10\"><span class=\"num\">9.4.10<\/span> 第一周怎样开始？<\/h3>\n<h4>VIO 部分<\/h4>\n<ol><li value=\"1\">在 EuRoC <code>MH_01_easy<\/code> 上跑通 OpenVINS；<\/li><li value=\"2\">保存 APE、RPE、初始化时间和运行配置；<\/li><li value=\"3\">编写一个三维点投影函数；<\/li><li value=\"4\">推导投影雅可比；<\/li><li value=\"5\">使用中心差分逐元素验证雅可比。<\/li><\/ol>\n<h4>Agent 部分<\/h4>\n<p>先不安装复杂 Agent 框架，也不接语言模型。完成：<\/p>\n<ol><li value=\"1\">写出六个工具的名称、输入、输出和成功条件；<\/li><li value=\"2\">使用假数据实现 <code>get_robot_status()<\/code>；<\/li><li value=\"3\">用固定 JSON 表示一个三步任务；<\/li><li value=\"4\">写一个按顺序执行并打印结果的 Executor；<\/li><li value=\"5\">遇到不存在的工具、缺少参数或超时必须明确失败；<\/li><li value=\"6\">为每一步记录任务 ID、开始时间、结束时间和结果。<\/li><\/ol>\n<p>最小执行流程：<\/p>\n<pre class=\"code\"><code>读取固定计划\n  -&gt; 验证工具名称\n  -&gt; 验证参数\n  -&gt; 执行第一步\n  -&gt; 检查结果\n  -&gt; 成功后执行下一步\n  -&gt; 失败后停止并输出结构化原因<\/code><\/pre>\n<p>当这套固定流程连续运行稳定后，再让模型负责生成同一格式的计划。<\/p><\/section>\n<section class=\"sec\" data-sec=\"9.4.11\"><h3 id=\"s9.4.11\"><span class=\"num\">9.4.11<\/span> 怎样量化 Agent 是否真的进步？<\/h3>\n<p>不要用“回答看起来更聪明”作为唯一指标。至少记录：<\/p>\n<pre class=\"code\"><code>任务成功率\n计划解析成功率\n非法工具调用比例\n参数验证失败比例\n平均任务时长\n平均重规划次数\n导航成功率\n超时和取消是否生效\n定位退化时的安全停止率\n人工接管次数\n同一任务重复执行的一致性<\/code><\/pre>\n<p>建立固定测试集，例如 20 条任务：<\/p>\n<pre class=\"code\"><code>10 条正常任务\n3 条不存在地点的任务\n2 条参数不完整的任务\n2 条低电量任务\n2 条路径不可达任务\n1 条定位丢失任务<\/code><\/pre>\n<p>每次更换模型、提示词、工具说明或执行策略后都运行同一测试集。只有成功率、非法调用和安全指标可重复改善，才算系统进步。<\/p><\/section>\n<section class=\"sec\" data-sec=\"9.4.12\"><h3 id=\"s9.4.12\"><span class=\"num\">9.4.12<\/span> Agent 学习中最容易走偏的地方<\/h3>\n<ol><li value=\"1\"><strong>先学框架，后想任务。<\/strong> Agent 框架变化很快，Observation、Tool、Executor 和 Verifier才是可迁移能力。<\/li><li value=\"2\"><strong>让模型直接控制实时运动。<\/strong> 高层推理延迟不稳定，也不能替代控制器安全约束。<\/li><li value=\"3\"><strong>没有结构化输出。<\/strong> 自然语言计划难以验证、执行和重放。<\/li><li value=\"4\"><strong>没有成功判据。<\/strong> 工具调用结束不代表业务目标完成。<\/li><li value=\"5\"><strong>没有失败分类。<\/strong> <code>failed<\/code> 应拆成不可达、超时、定位丢失、目标不存在和权限不足等原因。<\/li><li value=\"6\"><strong>没有坐标系和时间。<\/strong> 语义对象只有名字、没有 frame、位姿、时间和置信度，就不能可靠导航。<\/li><li value=\"7\"><strong>一开始做多 Agent。<\/strong> 先让一个 Agent、一个机器人和六个技能形成闭环，再考虑协作。<\/li><li value=\"8\"><strong>追求端到端而跳过基础。<\/strong> Agent 依赖 VIO/LIO、地图、路径规划和控制提供可信工具；下层不可靠，上层推理无法修复物理状态。<\/li><\/ol>\n<p>可以把本章的核心压缩成：<\/p>\n<pre class=\"code\"><code>可靠机器人 Agent\n= 有限技能集合\n+ 结构化计划\n+ 确定性执行器\n+ 结果验证器\n+ 反馈和有限恢复\n+ 安全边界\n+ 可审计日志<\/code><\/pre>\n<p>先做到这一步，Agent 就不再是“虚无缥缈的智能”，而是一个能够测试、统计、回放和逐步改进的机器人软件系统。<\/p><\/section>\n<section class=\"sec\" data-sec=\"9.4.13\"><h3 id=\"s9.4.13\"><span class=\"num\">9.4.13<\/span> 本章面试题与参考答案<\/h3>\n<p>先自己作答，再对照答案；答案后括号注明对应小节。<\/p>\n<h4>题目<\/h4>\n<ol><li value=\"1\">本章怎样定义机器人 Agent？它和 VIO/LIO、Nav2、机器狗 MPC/WBC 在频率和职责上怎样分工？<\/li><li value=\"2\">一个最小 Agent 由哪五个模块组成？给 Agent 的 Observation 为什么不能是原始 IMU、点云和图像？定位质量应当怎样表达？<\/li><li value=\"3\">设计一个工具接口时必须说明哪些内容？为什么 <code>navigate_to_pose<\/code> 不能接收没有 frame 的裸 <code>(x, y)<\/code>？<\/li><li value=\"4\">为什么第一版 Planner 可以完全不用大模型、只读固定 JSON 计划？接入大模型后，模型具体替换的是哪一段？<\/li><li value=\"5\">Executor 应维护哪些状态？导航、回充这类任务为什么优先用 ROS 2 Action 而不是 Service？Agent 与 Nav2 行为树的边界在哪里？<\/li><li value=\"6\">动作服务器返回 <code>SUCCESS<\/code>，为什么还需要独立的 Verifier？以导航和巡检拍照为例说明要验证什么。<\/li><li value=\"7\">模型生成的计划在执行前要经过哪些确定性检查？第一版不应允许 Agent 做哪些事？追问：定位状态变为 <code>lost<\/code> 时，停车要不要等模型决定？<\/li><li value=\"8\">导航返回 <code>path_blocked<\/code> 后，怎样设计反馈和重新规划闭环才不会失控？SayCan 的核心思想是什么？<\/li><li value=\"9\">VIO 与 Agent 应通过什么接口结合？请描述“去 A 区检查消防栓，定位不可靠时停止，拍照后回到充电桩”的完整执行链。<\/li><li value=\"10\">机器狗场景下，Agent 应该控制到哪一层？怎样量化一个 Agent 是否真的进步，而不是“看起来更聪明”？<\/li><\/ol>\n<h4>参考答案<\/h4>\n<p><strong>1. Agent 的定义和分层<\/strong><\/p>\n<p>机器人 Agent 是根据任务和环境状态选择有限技能、监督执行结果，并在失败时重新规划或安全退出的任务调度系统，不负责取代状态估计、导航或电机控制：<\/p>\n<pre class=\"code\"><code>VIO / LIO         100 至 200 Hz 左右   估计姿态、位置、速度、bias 和不确定度\nNav2 / 局部控制   10 至 100 Hz 左右    路径、避障、连续速度命令\nMPC / WBC         数百至上千 Hz        接触力、身体运动和关节控制\nAgent             低频、事件驱动       理解任务、选技能、检查结果、处理失败<\/code><\/pre>\n<p>Agent 是系统架构，不等于某个大模型；可以只用规则、状态机和行为树，也可以把 VLM、VLA 或 WM 作为其中一个模块。（见 9.4 章引言、9.4.2）<\/p>\n<p><strong>2. 五个模块与 Observation<\/strong><\/p>\n<p>五个可单独测试的模块是 Observation、Tools、Planner、Executor、Verifier。原始高频数据塞给语言模型既贵又不可解释，应由确定性模块压缩成有单位、有时间戳、有坐标系的结构化状态，例如带 <code>frame: map<\/code> 的位姿、电量、导航状态和可见对象。定位质量由状态监控模块根据协方差、特征数、数据延迟、创新统计和算法诊断分为 <code>healthy<\/code>、<code>degraded<\/code>、<code>lost<\/code> 三级，并且必须保留 <code>position_sigma<\/code>、<code>last_update_age_ms<\/code> 等原始指标供事后审计，不能只有一句模型生成的“定位似乎正常”。（见 9.4.1.1）<\/p>\n<p><strong>3. 工具接口要素<\/strong><\/p>\n<p>每个工具要写清：输入参数和类型、坐标系与单位、执行前置条件、超时时间、成功判据、可枚举的失败原因、是否允许取消、是否需要人工确认。第一版只开放少量技能，如 <code>get_robot_status()<\/code>、<code>navigate_to_named_place(name)<\/code>、<code>navigate_to_pose(frame, x, y, yaw)<\/code>、<code>capture_image()<\/code>、<code>dock()<\/code>、<code>stop_robot()<\/code>。裸 <code>(x, y)<\/code> 无法区分属于 map、odom 还是局部地图，同一组数字在不同 frame 下指向完全不同的位置，会直接变成导航到错误地点。（见 9.4.1.2）<\/p>\n<p><strong>4. 先确定性执行器，再接模型<\/strong><\/p>\n<p>固定 JSON 计划能把“计划生成错误”和“机器人执行错误”分开。若执行层本身不可靠，加上大模型只会让失败更难复现。第一阶段要把 Action/Service、状态机或行为树、超时/取消/抢占、错误码、幂等性、任务 ID 日志、人工接管做稳。之后模型只替换：<\/p>\n<pre class=\"code\"><code>user_goal + summarized_state + allowed_tools\n  -&gt; structured_plan<\/code><\/pre>\n<p>输出格式与固定计划相同，模型不直接接管低层控制。（见 9.4.1.3、9.4.3）<\/p>\n<p><strong>5. Executor 状态与 Action<\/strong><\/p>\n<p>Executor 维护 <code>PENDING<\/code>、<code>RUNNING<\/code>、<code>SUCCESS<\/code>、<code>FAILURE<\/code>、<code>TIMEOUT<\/code>、<code>CANCELED<\/code>，负责等待反馈、执行超时、取消目标和保存日志，不能让语言模型在等待期间反复猜测。导航、回充、机械臂等长时任务需要中途反馈、取消和抢占，这正是 ROS 2 Action 提供而 Service 不提供的能力。Nav2 已用行为树组合路径计算、跟随、旋转、等待、后退和清理代价地图等节点；Agent 适合在行为树之上选择任务和子树，可重复的执行与恢复交给行为树。（见 9.4.1.4）<\/p>\n<p><strong>6. 独立验证<\/strong><\/p>\n<p>工具返回 <code>SUCCESS<\/code> 只是一个信号，业务目标可能并未完成。导航后检查：到目标距离是否小于 0.3 m、航向误差是否在门限内、定位是否仍为 <code>healthy<\/code>、机器人是否已停止、目标是否在允许到达的区域。拍照后检查：图像是否保存成功、目标是否真的进入画面、图片是否绑定采样时间和 map 位姿、检测置信度是否满足要求。（见 9.4.1.5）<\/p>\n<p><strong>7. 计划验证和安全边界<\/strong><\/p>\n<p>执行前的确定性检查：<\/p>\n<pre class=\"code\"><code>工具是否在白名单中      参数类型和范围\n地点是否存在            frame 是否明确\n是否进入禁区            电量是否足够\n定位是否健康            步骤数是否超上限\n预计时间是否超预算      是否需要人工确认<\/code><\/pre>\n<p>第一版不允许 Agent 直接发布高频 <code>cmd_vel<\/code>、输出关节力矩或落足点、任意执行 shell、任意改 ROS 2 参数和外参、绕过急停/碰撞保护/限速、失败后无限重试、把不确定的语言地点当作可信坐标。追问：不应等待。<code>lost<\/code> 时停止依赖全局定位的自主运动，是确定性安全策略直接执行的；之后跑预定义重定位流程，失败再请求人工接管。Agent 只能在允许范围内选择恢复方案。（见 9.4.4、9.4.7）<\/p>\n<p><strong>8. 反馈与重新规划<\/strong><\/p>\n<p>执行结果要结构化返回，例如 <code>{&quot;status&quot;: &quot;failure&quot;, &quot;reason&quot;: &quot;path_blocked&quot;, &quot;attempt&quot;: 1}<\/code>，Agent 只从有限集合中选下一步：等待障碍离开、查询备用入口、重新规划一次、跳过当前点、请求人工、终止并返回安全点。系统必须限制最大重试次数、总任务时间、模型调用次数和可用恢复技能；也不要把完整历史原样塞回模型，而是保存结构化摘要和关键证据。SayCan 的核心是同时评估技能“对任务是否有用”和“当前状态下能否完成”，而不是只看语言上是否合理。（见 9.4.5）<\/p>\n<p><strong>9. VIO 与 Agent 的接口和巡检闭环<\/strong><\/p>\n<p>VIO 不把每条 IMU 交给 Agent，Agent 也不参与每次卡尔曼更新。VIO 输出 <code>odom -&gt; base_link<\/code> 以及位姿、速度、协方差和状态；SLAM 或全局定位给 <code>map -&gt; odom<\/code>；语义记忆给出 map 中的命名对象；Agent 通过只读工具 <code>get_localization_health()<\/code> 查询 <code>status<\/code>、<code>position_sigma<\/code>、<code>yaw_sigma<\/code>、<code>tracked_features<\/code>、<code>reason_codes<\/code> 等，再调用 Nav2。巡检闭环：<\/p>\n<pre class=\"code\"><code>1. 查询电量、定位状态和当前任务状态\n2. 查询 A 区消防栓对象及其 map 位姿\n3. 检查目标置信度和可达性\n4. 调用 NavigateToPose\n5. 持续监控 Nav2 反馈和定位质量\n6. 到达后验证距离、姿态和目标是否在画面中\n7. 保存图片、采样时间和 map 位姿\n8. 调用 dock 或 return_home\n9. 输出成功、失败点和证据链接<\/code><\/pre>\n<p>VIO 提供可度量的状态和质量，Agent 用它决定任务能否继续，二者不应被强行训练成一个黑盒。（见 9.4.7）<\/p>\n<p><strong>10. 机器狗控制边界与量化指标<\/strong><\/p>\n<p>Agent 适合决定去哪个区域、选普通行走/爬楼梯/低姿态技能、是否因电量或定位退化回撤、巡检哪些目标、失败后换路线还是求助；不适合输出关节实时力矩、高频落足位置、实时接触力和高频速度闭环。分层是 Agent、全局规划器、地形可通行性规划器、运动技能层、MPC/WBC/RL 策略、硬件安全层，上层只能切换经过验证的技能，不能绕过低层物理约束。<\/p>\n<p>量化上至少记录任务成功率、计划解析成功率、非法工具调用比例、参数验证失败比例、平均任务时长、重规划次数、导航成功率、超时和取消是否生效、定位退化时的安全停止率、人工接管次数和重复执行一致性。用固定测试集（如 10 条正常、3 条不存在地点、2 条参数不完整、2 条低电量、2 条路径不可达、1 条定位丢失），每次换模型、提示词、工具说明或执行策略都重跑，只有成功率、非法调用和安全指标可重复改善才算进步。（见 9.4.8、9.4.11）<\/p>\n<hr><\/section>", "sections": [{"id": "9.4.1", "title": "一个最小 Agent 由哪几部分组成？"}, {"id": "9.4.2", "title": "Agent、VIO、VLA、WM 和 WAM 分别处在哪一层？"}, {"id": "9.4.3", "title": "为什么先做确定性执行器，再接大模型？"}, {"id": "9.4.4", "title": "计划验证和安全边界"}, {"id": "9.4.5", "title": "反馈和重新规划怎样形成闭环？"}, {"id": "9.4.6", "title": "空间记忆怎样从 YAML 逐步升级？"}, {"id": "9.4.7", "title": "VIO 和 Agent 怎样通过接口结合？"}, {"id": "9.4.8", "title": "机器狗 Agent 应该控制到哪一层？"}, {"id": "9.4.9", "title": "十二周 VIO 与 Agent 联合学习路线"}, {"id": "9.4.10", "title": "第一周怎样开始？"}, {"id": "9.4.11", "title": "怎样量化 Agent 是否真的进步？"}, {"id": "9.4.12", "title": "Agent 学习中最容易走偏的地方"}, {"id": "9.4.13", "title": "本章面试题与参考答案"}]}, {"num": "9.5", "title": "从 LiDAR SLAM 向多模态机器人感知发展", "html": "<section class=\"sec\" data-sec=\"9.5.0\"><div class=\"callout tip\"><strong>为什么现在学这一章<\/strong>：最后讨论方向：T 型能力、分阶段项目、暂时不要做什么，以及怎样看待 LiDAR SLAM 与 AI 的关系。<\/div>\n<p>第 6.1、9.4 章给出了两条具体路线，本章回答更上层的问题：几何定位这条主线应当怎样向视觉、语义和任务层扩展，以及哪些内容第一轮不要做。<\/p><\/section>\n<section class=\"sec\" data-sec=\"9.5.1\"><h3 id=\"s9.5.1\"><span class=\"num\">9.5.1<\/span> 推荐的总体方向<\/h3>\n<p>不建议完全放弃 LiDAR SLAM，转去追逐单一视觉大模型。更合理的方向是：<\/p>\n<pre class=\"code\"><code>几何定位与建图\n  + 多传感器融合\n  + 视觉语义感知\n  + 时空地图/场景图\n  + 导航或操作任务<\/code><\/pre>\n<p>可以把能力做成 T 型：纵向继续深入机器人状态估计和系统可靠性，横向补视觉、AI 和任务层。<\/p>\n<p>纵向底座包括：<\/p>\n<ul><li>LiDAR、IMU、轮速的紧耦合与退化处理；<\/li><li>时间同步、内外参标定和运动畸变；<\/li><li>ESKF、非线性优化、因子图和协方差一致性；<\/li><li>ROS 2、Nav2、数据回放、性能分析和故障诊断。<\/li><\/ul>\n<p>横向扩展包括：<\/p>\n<ul><li>相机模型、投影、双目/RGB-D 和多视几何；<\/li><li>目标检测、语义/实例分割和多目标跟踪；<\/li><li>PyTorch 推理，以及 ONNX/TensorRT 等部署工具；<\/li><li>三维语义融合、对象级数据关联和动态生命周期；<\/li><li>开放词汇特征、场景图、语言导航和任务规划。<\/li><\/ul>\n<p>目标不是先训练一个新的基础模型，而是能够：<\/p>\n<pre class=\"code\"><code>使用现成视觉模型\n  -&gt; 把结果可靠地放进统一三维坐标系\n  -&gt; 维护跨帧、可更新、带不确定度的地图\n  -&gt; 让机器人用它完成任务<\/code><\/pre><\/section>\n<section class=\"sec\" data-sec=\"9.5.2\"><h3 id=\"s9.5.2\"><span class=\"num\">9.5.2<\/span> 分四个阶段学习和做项目<\/h3>\n<p>第一阶段：相机几何和传感器标定。<\/p>\n<pre class=\"code\"><code>学习：针孔模型、畸变、内参、外参、深度和时间同步\n项目：把 RGB-D 或相机+LiDAR 颜色正确投影到 SLAM 点云\n验收：不同距离和视角下没有明显重影，并给出外参/时偏误差分析<\/code><\/pre>\n<p>第二阶段：固定类别三维语义融合。<\/p>\n<pre class=\"code\"><code>学习：检测、语义分割、实例分割、跟踪和像素到三维投影\n项目：选择人、门、货架、托盘、充电桩等 4 至 6 类\n验收：对象位置误差、分类准确率、多帧稳定性和运行频率都有记录<\/code><\/pre>\n<p>第三阶段：让 Nav2 或任务系统真正使用语义。<\/p>\n<pre class=\"code\"><code>项目一：人进入动态层，危险区进入禁行层，门口触发减速\n项目二：查询充电桩或设备位置，生成安全停靠位姿并导航\n验收：报告任务成功率、误触发率、规划失败率和端到端延迟<\/code><\/pre>\n<p>第四阶段：开放词汇和对象级场景图。<\/p>\n<pre class=\"code\"><code>增加：文本查询、embedding、实例关联、房间—对象关系和长期变化\n演示：“去走廊尽头的红色灭火器旁边”\n流程：文本查询 -&gt; 对象坐标 -&gt; 安全停靠点 -&gt; Nav2 规划与执行<\/code><\/pre>\n<p>每一阶段都应有可运行程序、rosbag、参数、评估脚本和失败案例。只展示一段效果视频，不足以证明系统稳定。<\/p><\/section>\n<section class=\"sec\" data-sec=\"9.5.3\"><h3 id=\"s9.5.3\"><span class=\"num\">9.5.3<\/span> 一个适合作为主线的完整项目<\/h3>\n<p>可以选择仓库、办公楼或巡检场景，完成下面的闭环：<\/p>\n<pre class=\"code\"><code>FAST-LIO2/LIO-SAM 提供 map 位姿\n  -&gt; 相机识别人、门、货架、托盘和充电桩\n  -&gt; 深度或 LiDAR 把掩码投影到三维\n  -&gt; 对象关联和多帧置信度融合\n  -&gt; 静态、动态和待确认对象分层维护\n  -&gt; 发布 Nav2 代价层和对象查询接口\n  -&gt; 完成对象导航、区域限速或巡检任务<\/code><\/pre>\n<p>建议同时评估：<\/p>\n<div class=\"tbl\"><table><thead><tr><th>层级<\/th><th>指标<\/th><\/tr><\/thead><tbody><tr><td>几何定位<\/td><td>ATE、RPE、重定位成功率、退化方向协方差<\/td><\/tr><tr><td>视觉感知<\/td><td>Precision、Recall、mIoU、跟踪 ID 切换<\/td><\/tr><tr><td>语义地图<\/td><td>对象位置误差、重复对象率、错误持久化率、变化检测延迟<\/td><\/tr><tr><td>机器人任务<\/td><td>导航成功率、误入禁区次数、目标停靠误差<\/td><\/tr><tr><td>工程性能<\/td><td>帧率、端到端延迟、CPU/GPU、显存和长期内存增长<\/td><\/tr><\/tbody><\/table><\/div>\n<p>这个项目同时覆盖 SLAM、视觉 AI、三维感知、ROS 2 和导航，比单独复现一个新网络或一个 SLAM 数据集排名更能体现完整能力。<\/p><\/section>\n<section class=\"sec\" data-sec=\"9.5.4\"><h3 id=\"s9.5.4\"><span class=\"num\">9.5.4<\/span> 学习时暂时不要做什么？<\/h3>\n<ul><li>不要一开始训练大型视觉语言模型；先学会正确使用、评估和部署已有模型。<\/li><li>不要先做“任意文本都能理解”的演示；先把少量固定类别做稳定。<\/li><li>不要只生成彩色语义点云；至少实现一个真正使用语义的导航或巡检功能。<\/li><li>不要让低置信语义直接进入永久地图或反向修改 SLAM 位姿。<\/li><li>不要忽略数据集、时延、显存、误检和降级策略，只比较模型离线精度。<\/li><li>不要为了使用 AI 而重复计算已有传感器信息或破坏几何估计的一致性。<\/li><\/ul><\/section>\n<section class=\"sec\" data-sec=\"9.5.5\"><h3 id=\"s9.5.5\"><span class=\"num\">9.5.5<\/span> 怎样看待 LiDAR SLAM 与 AI 的关系？<\/h3>\n<p>纯粹复现扫描匹配算法的方向可能较窄，但几何基础并没有因视觉基础模型出现而失效。AI 模型可以判断图像中像什么，却不能自动保证：<\/p>\n<pre class=\"code\"><code>对象位于正确的 map 坐标\n外参和时间戳正确\n多帧看到的是同一个实例\n地图漂移后对象能够一起修正\n动态物体不会污染静态地图\n模型失效时机器人仍然安全<\/code><\/pre>\n<p>这些问题需要几何、概率估计、软件系统和 AI 共同解决。因而更有延展性的定位不是“只做激光 SLAM”或“只做大模型”，而是“机器人多模态空间感知与长期自主系统”。<\/p><\/section>\n<section class=\"sec\" data-sec=\"9.5.6\"><h3 id=\"s9.5.6\"><span class=\"num\">9.5.6<\/span> 本章面试题与参考答案<\/h3>\n<p>先自己作答，再对照答案；答案后括号注明对应小节。<\/p>\n<h4>题目<\/h4>\n<ol><li value=\"1\">做 LiDAR SLAM 的人向多模态感知发展，本章推荐的总体方向是什么？什么叫“T 型能力”，纵向和横向分别包括什么？<\/li><li value=\"2\">第一阶段项目“把 RGB-D 或相机颜色投影到 SLAM 点云”，验收时出现重影，可能是哪些原因？怎样区分？<\/li><li value=\"3\">固定类别三维语义融合要做哪些步骤？为什么本章建议先做 4 至 6 类固定类别，而不是一开始就做开放词汇？<\/li><li value=\"4\">描述一个“语义地图真正被导航使用”的完整项目闭环，并分层列出应当评估的指标。追问：只展示一段彩色语义点云视频为什么不够？<\/li><li value=\"5\">语义结果能不能直接写入永久地图或用来修正 SLAM 位姿？为什么？<\/li><li value=\"6\">有人说“视觉大模型出来了，几何 SLAM 就没用了”，你怎样回答？<\/li><\/ol>\n<h4>参考答案<\/h4>\n<p><strong>1. 总体方向与 T 型能力<\/strong><\/p>\n<p>不建议放弃 LiDAR SLAM 去追单一视觉大模型，而是沿着：<\/p>\n<pre class=\"code\"><code>几何定位与建图\n  + 多传感器融合\n  + 视觉语义感知\n  + 时空地图/场景图\n  + 导航或操作任务<\/code><\/pre>\n<p>纵向底座：LiDAR、IMU、轮速紧耦合与退化处理；时间同步、内外参标定和运动畸变；ESKF、非线性优化、因子图和协方差一致性；ROS 2、Nav2、回放、性能分析和故障诊断。横向扩展：相机模型与多视几何，检测、分割和多目标跟踪，PyTorch 与 ONNX/TensorRT 部署，三维语义融合与对象级关联，开放词汇、场景图和任务规划。目标是用现成视觉模型，把结果可靠地放进统一三维坐标系，维护可更新、带不确定度的地图，让机器人用它完成任务。（见 9.5.1）<\/p>\n<p><strong>2. 颜色投影重影的排查<\/strong><\/p>\n<p>颜色投影要经过：点云从 map 或 LiDAR 系变到相机系、再用内参和畸变投影到像素、按时间取对应图像。重影通常来自：<\/p>\n<pre class=\"code\"><code>相机—LiDAR 或相机—IMU 外参错误\n内参或畸变模型不对\n图像与点云时间戳不对齐（时间偏移）\n点云运动畸变未补偿\nSLAM 位姿本身漂移<\/code><\/pre>\n<p>区分方法：外参错误在静止和运动时都有固定方向的偏移；时间偏移只在运动、尤其快速转动时才明显，静止时几乎消失；位姿漂移表现为同一物体在不同时段投影不一致。验收要求在不同距离和视角下都没有明显重影，并给出外参和时偏的误差分析。（见 9.5.2、6.3.4.1）<\/p>\n<p><strong>3. 固定类别三维语义融合<\/strong><\/p>\n<p>步骤是：检测、语义或实例分割、跟踪，再用深度或 LiDAR 把像素或掩码投影到三维，接着做对象关联和多帧置信度融合，把对象分为静态、动态和待确认分层维护。先做人、门、货架、托盘、充电桩等 4 至 6 类，是因为固定类别才能把对象位置误差、分类准确率、多帧稳定性和运行频率量化记录下来，把系统做稳；“任意文本都能理解”的演示在基础链路不稳时无法评估，也不能说明系统可靠。开放词汇、embedding 和场景图放在第四阶段。（见 9.5.2、9.5.3、9.5.4）<\/p>\n<p><strong>4. 完整项目闭环与分层指标<\/strong><\/p>\n<pre class=\"code\"><code>FAST-LIO2/LIO-SAM 提供 map 位姿\n  -&gt; 相机识别人、门、货架、托盘和充电桩\n  -&gt; 深度或 LiDAR 把掩码投影到三维\n  -&gt; 对象关联和多帧置信度融合\n  -&gt; 静态、动态和待确认对象分层维护\n  -&gt; 发布 Nav2 代价层和对象查询接口\n  -&gt; 完成对象导航、区域限速或巡检任务<\/code><\/pre>\n<div class=\"tbl\"><table><thead><tr><th>层级<\/th><th>指标<\/th><\/tr><\/thead><tbody><tr><td>几何定位<\/td><td>ATE、RPE、重定位成功率、退化方向协方差<\/td><\/tr><tr><td>视觉感知<\/td><td>Precision、Recall、mIoU、跟踪 ID 切换<\/td><\/tr><tr><td>语义地图<\/td><td>对象位置误差、重复对象率、错误持久化率、变化检测延迟<\/td><\/tr><tr><td>机器人任务<\/td><td>导航成功率、误入禁区次数、目标停靠误差<\/td><\/tr><tr><td>工程性能<\/td><td>帧率、端到端延迟、CPU/GPU、显存和长期内存增长<\/td><\/tr><\/tbody><\/table><\/div>\n<p>追问：彩色语义点云只说明“看起来标上了”，没有证明语义被机器人使用，也没有稳定性证据。至少要实现一个真正使用语义的功能，例如人进入动态层、危险区进入禁行层、门口减速，并提供可运行程序、rosbag、参数、评估脚本和失败案例。（见 9.5.2、9.5.3、9.5.4）<\/p>\n<p><strong>5. 低置信语义的使用边界<\/strong><\/p>\n<p>不能。低置信语义可能是误检或动态物体，直接进入永久地图会被持久化成错误对象，反向修改 SLAM 位姿则会用不可靠信息破坏几何估计的一致性。应先多帧融合置信度，放入“待确认”层，确认后再持久化；几何位置仍由可靠的位姿和坐标变换决定。同时还要考虑时延、显存、误检和降级策略，而不是只比较模型离线精度。（见 9.5.3、9.5.4）<\/p>\n<p><strong>6. LiDAR SLAM 与 AI 的关系<\/strong><\/p>\n<p>纯粹复现扫描匹配算法的方向可能变窄，但几何基础没有失效。AI 模型能判断图像里“像什么”，却不能自动保证：<\/p>\n<pre class=\"code\"><code>对象位于正确的 map 坐标\n外参和时间戳正确\n多帧看到的是同一个实例\n地图漂移后对象能够一起修正\n动态物体不会污染静态地图\n模型失效时机器人仍然安全<\/code><\/pre>\n<p>这些问题要靠几何、概率估计、软件系统和 AI 共同解决。更有延展性的定位是“机器人多模态空间感知与长期自主系统”，而不是只做激光 SLAM 或只做大模型。（见 9.5.5）<\/p>\n<hr><\/section>", "sections": [{"id": "9.5.1", "title": "推荐的总体方向"}, {"id": "9.5.2", "title": "分四个阶段学习和做项目"}, {"id": "9.5.3", "title": "一个适合作为主线的完整项目"}, {"id": "9.5.4", "title": "学习时暂时不要做什么？"}, {"id": "9.5.5", "title": "怎样看待 LiDAR SLAM 与 AI 的关系？"}, {"id": "9.5.6", "title": "本章面试题与参考答案"}]}]}, {"key": "LA", "label": "附录", "title": "附录", "intro": "", "chapters": [{"num": "A", "title": "动画索引", "html": "<section class=\"sec\" data-sec=\"A.0\"><div class=\"tbl\"><table><thead><tr><th>编号<\/th><th>所在小节<\/th><th>演示内容<\/th><\/tr><\/thead><tbody><tr><td>1<\/td><td>1.3.2 相机的实际测量是像素<\/td><td>三个坐标系逐步出现<\/td><\/tr><tr><td>2<\/td><td>1.3.3 从相机三维点推到像素<\/td><td>从相机三维点推到像素<\/td><\/tr><tr><td>3<\/td><td>1.3.3 从相机三维点推到像素<\/td><td>单目尺度歧义<\/td><\/tr><tr><td>4<\/td><td>1.3.5 单目相机和双目相机有什么根本区别？<\/td><td>双目三角化<\/td><\/tr><tr><td>5<\/td><td>1.3.5 单目相机和双目相机有什么根本区别？<\/td><td>双目 Z = fB/d<\/td><\/tr><tr><td>6<\/td><td>1.3.8 加速度计测量模型<\/td><td>roll 估错 1°<\/td><\/tr><tr><td>7<\/td><td>1.3.9 FAST-LIO2：为什么要做点云去畸变？<\/td><td>旋转中扫描一圈<\/td><\/tr><tr><td>8<\/td><td>1.4.4 什么是重采样？<\/td><td>一维粒子滤波<\/td><\/tr><tr><td>9<\/td><td>2.1.1 概率密度、似然、MLE、后验和 MAP 有什么关系？<\/td><td>同一张 p(z<\/td><\/tr><tr><td>10<\/td><td>2.1.1 概率密度、似然、MLE、后验和 MAP 有什么关系？<\/td><td>似然 × 先验 = 后验<\/td><\/tr><tr><td>11<\/td><td>2.4.5 白化、马氏距离和加权最小二乘是什么关系？<\/td><td>相关性让误差椭圆倾斜<\/td><\/tr><tr><td>12<\/td><td>3.1.4 Gauss-Newton 方程和 Hessian 怎样得到？<\/td><td>两个地标的 Gauss-Newton<\/td><\/tr><tr><td>13<\/td><td>3.2.1 GN 和 LM 有什么区别？LM 解决了 GN 的什么问题？<\/td><td>从 x = 1.5 出发<\/td><\/tr><tr><td>14<\/td><td>3.3.1 Hessian 为什么能反映“有没有足够信息”？<\/td><td>斜率都为 0，曲率差 100 倍<\/td><\/tr><tr><td>15<\/td><td>3.3.1 Hessian 为什么能反映“有没有足够信息”？<\/td><td>一面墙约束 x 和 yaw，沿墙滑动看不出变化；加一面水平墙后 y 也有了信息<\/td><\/tr><tr><td>16<\/td><td>3.4.2 多维情形下，Sigma 和 Omega 究竟从哪里来？<\/td><td>回环前后的不确定度<\/td><\/tr><tr><td>17<\/td><td>3.5.7 用一个二维例子看出左右扰动的差别<\/td><td>同一个增量<\ const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const TAGS = {key:"重点", question:"疑问", insight:"心得"};
const LS_NOTES = "slam-guide-notes-v1", LS_DONE = "slam-guide-done-v1", LS_LAST = "slam-guide-last-v1";

const chapters = [];
DATA.levels.forEach(lv => lv.chapters.forEach(c => { c.level = lv; chapters.push(c); }));
const byNum = new Map(chapters.map(c => [c.num, c]));
const studyChapters = chapters.filter(c => c.level.key !== "LA");
$("#prog").innerHTML = `已学 <b>0</b>/${studyChapters.length} 章`;

/* ---------------- storage: this browser (localStorage) ---------------- */
const Store = {
  notes: new Map(), done: new Set(),
  read() {
    try { const a = JSON.parse(localStorage.getItem(LS_NOTES) || "[]"); this.notes = new Map(a.map(n => [n.id, n])); } catch { this.notes = new Map(); }
    let d = []; try { d = JSON.parse(localStorage.getItem(LS_DONE) || "[]"); } catch {}
    this.done = new Set(d);
  },
  write() {
    try {
      localStorage.setItem(LS_NOTES, JSON.stringify([...this.notes.values()]));
      localStorage.setItem(LS_DONE, JSON.stringify([...this.done]));
    } catch { toast("没有保存成功：浏览器禁止了本地存储（例如无痕模式）。"); }
  },
  async saveNote(n) { this.notes.set(n.id, n); this.write(); refreshAll(); },
  async deleteNote(id) { this.notes.delete(id); this.write(); refreshAll(); },
  async setDone(num, flag) { flag ? this.done.add(num) : this.done.delete(num); this.write(); refreshAll(); }
};
Store.read();

/* ---------------- navigation ---------------- */
let view = {kind: "level", key: "L0"};
let openLevels = new Set(["L0"]);
function notesIn(num) { let k = 0; for (const n of Store.notes.values()) if (n.chapter === num) k++; return k; }

function renderNav() {
  const cur = view.kind === "chapter" ? view.num : null;
  const curLevel = view.kind === "chapter" ? byNum.get(view.num).level.key : view.key;
  $("#nav").innerHTML = DATA.levels.map(lv => {
    const total = lv.chapters.length, done = lv.chapters.filter(c => Store.done.has(c.num)).length;
    const isStudy = lv.key !== "LA";
    const open = openLevels.has(lv.key) || lv.key === curLevel;
    const tag = isStudy ? lv.key.slice(1) : "附";
    const cls = ["lv", isStudy && done === total ? "done" : "", lv.key === curLevel ? "cur" : ""].join(" ");
    return `<div class="${cls}">
      <span class="lv-tag" aria-hidden="true">${tag}</span>
      <button class="lv-head" data-level="${lv.key}" aria-expanded="${open}">
        <span class="lv-name">${esc(lv.title)}<span class="lv-meta">${isStudy ? `${done}/${total} 章已学` : `${total} 部分`}</span></span>
      </button>
      ${open ? `<ul>${lv.chapters.map(c => {
        const nc = notesIn(c.num);
        return `<li><a href="#c${c.num}" class="${c.num === cur ? "cur" : ""}"><span class="n">${c.num}</span><span>${esc(c.title)}</span>
          ${nc ? `<span class="nc" title="${nc} 条笔记">✎${nc}</span>` : ""}${Store.done.has(c.num) ? `<span class="ck" aria-label="已学完">✓</span>` : ""}</a></li>`;
      }).join("")}</ul>` : ""}
    </div>`;
  }).join("");
}
$("#nav").addEventListener("click", e => {
  const h = e.target.closest(".lv-head");
  if (h) {
    const k = h.dataset.level;
    if (openLevels.has(k)) openLevels.delete(k); else openLevels.add(k);
    if (location.hash !== "#" + k) location.hash = "#" + k; else renderNav();
    return;
  }
  if (e.target.closest("a") && matchMedia("(max-width:860px)").matches) $("#nav").hidden = true;
});

function renderLevel(key) {
  const lv = DATA.levels.find(l => l.key === key) || DATA.levels[0];
  openLevels.add(lv.key);
  const cards = lv.chapters.map(c => {
    const nc = notesIn(c.num);
    return `<a class="card" href="#c${c.num}"><span class="n">${c.num}</span><span class="t">${esc(c.title)}</span>
      <span class="m">${c.sections.length} 节${nc ? ` · ${nc} 条笔记` : ""}${Store.done.has(c.num) ? " · 已学完 ✓" : ""}</span></a>`;
  }).join("");
  $("#read").innerHTML = `<div class="crumb"><a href="#L0">指南</a><span>›</span><span>${esc(lv.label)}</span></div>
    <div class="level-hero"><div class="step">${lv.key === "LA" ? "APPENDIX" : "LEVEL " + lv.key.slice(1) + " / 9"}</div>
    <h1 class="ch" style="margin-bottom:0">${esc(lv.title)}</h1></div>
    <div class="intro">${lv.intro}</div>
    <h3 style="margin-top:28px">本级章节</h3><div class="cards">${cards}</div>`;
}

function renderChapter(num) {
  const c = byNum.get(num); if (!c) return renderLevel("L0");
  const idx = chapters.indexOf(c), prev = chapters[idx - 1], next = chapters[idx + 1];
  const isDone = Store.done.has(num);
  $("#read").innerHTML = `<div class="crumb"><a href="#L0">指南</a><span>›</span><a href="#${c.level.key}">${esc(c.level.label)}　${esc(c.level.title)}</a></div>

      ${c.level.key !== "LA" ? `<button class="btn ${isDone ? "done" : "primary"}" id="doneBtn">${isDone ? "✓ 本章已学完（点此取消）" : "标记本章已学完"}</button>` : "<span></span>"}
      <span style="display:flex;gap:8px;flex-wrap:wrap">
        ${prev ? `<a class="btn" href="#c${prev.num}">← ${prev.num} ${esc(prev.title)}</a>` : ""}
        ${next ? `<a class="btn" href="#c${next.num}">${next.num} ${esc(next.title)} →</a>` : ""}
      </span>
    </div>`;
  if (playerIO) playerIO.disconnect();
  decorateSections();
  initPlayers($("#chBody"));
}

function decorateSections() {
  document.querySelectorAll("#chBody section.sec").forEach(sec => {
    const h = sec.querySelector(":scope > h3");
    if (!h) return;
    const id = sec.dataset.sec, k = [...Store.notes.values()].filter(n => n.sec === id).length;

    span.className = "sec-tools";
    span.innerHTML = `<button class="note-btn${k ? " has" : ""}" data-sec="${id}" title="为这一节记笔记">✎ ${k ? k + " 条笔记" : "笔记"}</button>`;

}

  for (const n of Store.notes.values()) {
    if (view.kind !== "chapter" || n.chapter !== view.num || !n.quote) continue;
    const sec = body.querySelector(`section.sec[data-sec="${CSS.escape(n.sec)}"]`); if (!sec) continue;
    const needle = n.quote.length > 80 ? n.quote.slice(0, 80) : n.quote;
    const tw = document.createTreeWalker(sec, NodeFilter.SHOW_TEXT, {acceptNode: t => t.parentElement.closest("button,mark") ? 2 : 1});
    let t;
    while ((t = tw.nextNode())) {
      const i = t.data.indexOf(needle);
      if (i < 0) continue;
      const r = document.createRange(); r.setStart(t, i); r.setEnd(t, i + needle.length);
      const m = document.createElement("mark"); m.className = "hl"; m.dataset.note = n.id; m.title = "查看这条笔记";
      try { r.surroundContents(m); } catch {}
      break;
    }
  }
}
$("#read").addEventListener("click", e => {
  const b = e.target.closest(".note-btn");
  if (b) { const c = byNum.get(view.num); const s = c.sections.find(x => x.id === b.dataset.sec); openComposer({sec: b.dataset.sec, secTitle: s ? s.title : ""}); return; }
  const m = e.target.closest("mark.hl");
  if (m) { openNotes("chapter"); const el = document.getElementById("note-" + m.dataset.note); if (el) { el.scrollIntoView({block: "center"}); el.animate?.([{outline: "2px solid var(--accent)"}, {outline: "2px solid transparent"}], 1200); } return; }
  if (e.target.id === "doneBtn") Store.setDone(view.num, !Store.done.has(view.num));
});

/* ---------------- animation players (MP4, 8 frames per second) ---------------- */
const FRAME = 1 / 8;
const ICON = {
  play: '<svg viewBox="0 0 16 16"><path d="M4 2.5v11l9-5.5z"/></svg>',
  pause: '<svg viewBox="0 0 16 16"><path d="M3.5 2.5h3v11h-3zM9.5 2.5h3v11h-3z"/></svg>',
  prev: '<svg viewBox="0 0 16 16"><path d="M2.5 2.5h2v11h-2zM13.5 2.5v11L5.5 8z"/></svg>',
  next: '<svg viewBox="0 0 16 16"><path d="M11.5 2.5h2v11h-2zM2.5 2.5v11l8-5.5z"/></svg>'
};
const reduceMotion = matchMedia("(prefers-reduced-motion: reduce)").matches;
const playerIO = "IntersectionObserver" in window ? new IntersectionObserver(entries => entries.forEach(e => {
  const p = e.target, v = p.querySelector("video");
  if (e.isIntersecting) {
    if (v.preload === "none") v.preload = "auto";
    if (!p.dataset.userPaused && !reduceMotion) v.play().catch(() => {});
  } else if (!v.paused) v.pause();
}), {rootMargin: "120px 0px", threshold: 0.3}) : null;

function initPlayers(root) {
  root.querySelectorAll(".player").forEach(p => {
    const v = p.querySelector("video");
    v.muted = true;
    const wrap = document.createElement("div");
    wrap.className = "vwrap";
    v.before(wrap);
    wrap.appendChild(v);
    const big = document.createElement("button");
    big.className = "bigplay";
    big.setAttribute("aria-label", "播放动画");
    big.innerHTML = `<span>${ICON.play}点击播放动画</span>`;
    wrap.appendChild(big);
    const bar = document.createElement("div");
    bar.className = "pctl";
    bar.innerHTML = `<button class="pp" aria-label="播放">${ICON.play}</button>
      <button class="pv" aria-label="上一帧" title="上一帧（会暂停）">${ICON.prev}</button>
      <button class="nx" aria-label="下一帧" title="下一帧（会暂停）">${ICON.next}</button>
      <input class="seek" type="range" min="0" max="1000" value="0" aria-label="播放进度">
      <span class="tm">0.0 / 0.0 秒</span>
      <button class="sp" aria-label="慢放" title="0.5 倍速慢放">0.5×</button>`;
    p.appendChild(bar);
    const pp = bar.querySelector(".pp"), seek = bar.querySelector(".seek"), tm = bar.querySelector(".tm"), sp = bar.querySelector(".sp");
    const sync = () => {
      big.hidden = !v.paused || v.currentTime > 0.05 || !!p.dataset.userPaused;
      pp.innerHTML = v.paused ? ICON.play : ICON.pause;
      pp.setAttribute("aria-label", v.paused ? "播放" : "暂停");
      if (v.duration) {
        seek.value = Math.round(v.currentTime / v.duration * 1000);
        tm.textContent = `${v.currentTime.toFixed(1)} / ${v.duration.toFixed(1)} 秒`;
      }
    };
    ["timeupdate", "play", "pause", "loadedmetadata", "seeked"].forEach(ev => v.addEventListener(ev, sync));
    const toggle = () => {
      if (v.paused) { delete p.dataset.userPaused; if (v.preload === "none") v.preload = "auto"; v.play().catch(() => {}); }
      else { p.dataset.userPaused = "1"; v.pause(); }
    };
    pp.addEventListener("click", toggle);
    v.addEventListener("click", toggle);
    big.addEventListener("click", toggle);
    sync();
    const step = d => {
      p.dataset.userPaused = "1"; v.pause();
      if (v.preload === "none") v.preload = "auto";
      const end = (v.duration || 0) - FRAME / 2;
      v.currentTime = Math.min(Math.max(0, v.currentTime + d * FRAME), Math.max(0, end));
    };
    bar.querySelector(".pv").addEventListener("click", () => step(-1));
    bar.querySelector(".nx").addEventListener("click", () => step(1));
    seek.addEventListener("input", () => {
      if (!v.duration) return;
      p.dataset.userPaused = "1"; v.pause();
      v.currentTime = seek.value / 1000 * v.duration;
    });
    sp.addEventListener("click", () => {
      const slow = v.playbackRate === 1;
      v.playbackRate = slow ? 0.5 : 1;
      sp.classList.toggle("on", slow);
      sp.setAttribute("aria-pressed", String(slow));
    });
    if (playerIO) playerIO.observe(p);
    else if (!reduceMotion) { v.preload = "auto"; v.play().catch(() => {}); }
  });
}

/* ---------------- routing ---------------- */
function route() {
  const h = decodeURIComponent(location.hash.slice(1));
  let target = null;
  if (/^c[\d.A-Z]+$/.test(h) && byNum.has(h.slice(1))) view = {kind: "chapter", num: h.slice(1)};
  else if (/^s\d+(\.\d+)+$/.test(h)) {
    const parts = h.slice(1).split("."); const num = parts[0] + "." + parts[1];
    if (byNum.has(num)) { view = {kind: "chapter", num}; target = h; }
  } else if (/^L(\d|A)$/.test(h)) view = {kind: "level", key: h};
  else if (!h) {
    let last = null; try { last = localStorage.getItem(LS_LAST); } catch {}
    if (last && byNum.has(last)) view = {kind: "chapter", num: last}; else view = {kind: "level", key: "L0"};
  }
  if (view.kind === "chapter") { renderChapter(view.num); try { localStorage.setItem(LS_LAST, view.num); } catch {} }
  else renderLevel(view.key);
  renderNav(); renderNotes(); updateCounts();
  const el = target && document.getElementById(target);
  if (el) el.scrollIntoView({block: "start"}); else window.scrollTo(0, 0);
}
window.addEventListener("hashchange", route);

/* ---------------- notes panel ---------------- */
let tab = "chapter", composer = null, confirmDel = null;
function openNotes(t) {
  if (t) tab = t;
  $("#notes").hidden = false; $("#shell").classList.add("with-notes");
  if (matchMedia("(max-width:860px)").matches) $("#nav").hidden = true;
  renderNotes();
}
function closeNotes() { $("#notes").hidden = true; $("#shell").classList.remove("with-notes"); }
$("#notesBtn").addEventListener("click", () => $("#notes").hidden ? openNotes() : closeNotes());
$("#closeNotes").addEventListener("click", closeNotes);
$("#tabCh").addEventListener("click", () => { tab = "chapter"; renderNotes(); });
$("#tabAll").addEventListener("click", () => { tab = "all"; renderNotes(); });
$("#nq").addEventListener("input", () => renderNotes());

function openComposer(o) {
  if (view.kind !== "chapter") return;
  composer = {id: o.id || null, sec: o.sec, secTitle: o.secTitle || "", quote: o.quote || "", text: o.text || "", tag: o.tag || "key"};
  tab = "chapter"; openNotes();
  setTimeout(() => { const ta = $("#cText"); if (ta) { ta.focus(); ta.setSelectionRange(ta.value.length, ta.value.length); } }, 30);
}
function sortKey(n) { return n.sec.split(".").map(x => x.padStart(4, "0")).join(".") + "|" + String(n.created).padStart(15, "0"); }
function renderNotes() {
  $("#tabCh").setAttribute("aria-selected", tab === "chapter"); $("#tabAll").setAttribute("aria-selected", tab === "all");
  const q = $("#nq").value.trim().toLowerCase();
  let list = [...Store.notes.values()];
  if (tab === "chapter") list = view.kind === "chapter" ? list.filter(n => n.chapter === view.num) : [];
  if (q) list = list.filter(n => (n.text + " " + n.quote + " " + n.secTitle + " " + (TAGS[n.tag] || "")).toLowerCase().includes(q));
  list.sort((a, b) => sortKey(a) < sortKey(b) ? -1 : 1);
  let h = "";
  if (composer) {
    h += `<div class="composer">
      <div class="where">${composer.id ? "编辑笔记" : "新笔记"} · ${esc(composer.sec)} ${esc(composer.secTitle)}</div>
      ${composer.quote ? `<div class="q">${esc(composer.quote)}</div>` : ""}
      <textarea id="cText" placeholder="写下你的理解、疑问或要记住的结论…">${esc(composer.text)}</textarea>
      <div class="tagpick">${Object.entries(TAGS).map(([k, v]) => `<button class="t-${k}" data-tag="${k}" aria-pressed="${composer.tag === k}">${v}</button>`).join("")}</div>
      <div class="row"><button class="btn" id="cCancel">取消</button><button class="btn primary" id="cSave">保存</button></div></div>`;
  }
  if (!list.length && !composer) {
    h += `<div class="empty">${tab === "chapter" && view.kind !== "chapter" ? "打开任意一章后，这里会显示该章的笔记。" :
      q ? "没有找到匹配的笔记。" :
      "还没有笔记。两种记法：<br>① 点小节标题旁的 <b>✎ 笔记</b>；<br>② 在正文中选中一段文字，点出现的 <b>＋ 记笔记</b>，这段文字会被高亮并引用到笔记里。"}</div>`;
  }
  let lastCh = null;
  for (const n of list) {
    if (tab === "all" && n.chapter !== lastCh) { const c = byNum.get(n.chapter); h += `<div class="group-h">${esc(n.chapter)} ${esc(c ? c.title : "")}</div>`; lastCh = n.chapter; }
    const d = new Date(n.updated || n.created);
    h += `<div class="note" id="note-${esc(n.id)}">
      <button class="where" data-go="${esc(n.sec)}">${esc(n.sec)} ${esc(n.secTitle)}</button>
      ${n.quote ? `<div class="q">${esc(n.quote)}</div>` : ""}
      ${n.text ? `<div class="txt">${esc(n.text)}</div>` : ""}
      <div class="foot"><span class="chip t-${esc(n.tag)}">${TAGS[n.tag] || "笔记"}</span><span>${d.toLocaleDateString("zh-CN")} ${d.toLocaleTimeString("zh-CN", {hour: "2-digit", minute: "2-digit"})}</span>
        <span class="sp"><button data-edit="${esc(n.id)}">编辑</button><button data-del="${esc(n.id)}" class="${confirmDel === n.id ? "warn" : ""}">${confirmDel === n.id ? "确认删除" : "删除"}</button></span></div></div>`;
  }
  $("#nbody").innerHTML = h;
}
$("#nbody").addEventListener("click", async e => {
  const t = e.target;
  if (t.id === "cCancel") { composer = null; renderNotes(); return; }
  if (t.dataset.tag && composer) { composer.text = $("#cText").value; composer.tag = t.dataset.tag; renderNotes(); return; }
  if (t.id === "cSave" && composer) {
    const text = $("#cText").value.trim();
    if (!text && !composer.quote) { toast("先写点内容再保存。"); return; }
    const old = composer.id ? Store.notes.get(composer.id) : null;
    const now = Date.now();
    const n = {kind: "note", id: composer.id || ("n-" + now.toString(36) + "-" + Math.random().toString(36).slice(2, 7)),
      chapter: view.num, sec: composer.sec, secTitle: composer.secTitle, quote: composer.quote, text, tag: composer.tag,
      created: old ? old.created : now, updated: now};
    composer = null; await Store.saveNote(n); toast(old ? "笔记已更新" : "笔记已保存"); return;
  }
  if (t.dataset.edit) { const n = Store.notes.get(t.dataset.edit); if (!n) return;
    if (view.num !== n.chapter) location.hash = "#c" + n.chapter;
    setTimeout(() => openComposer(n), 0); return; }
  if (t.dataset.del) {
    if (confirmDel === t.dataset.del) { confirmDel = null; await Store.deleteNote(t.dataset.del); toast("笔记已删除"); }
    else { confirmDel = t.dataset.del; renderNotes(); setTimeout(() => { if (confirmDel === t.dataset.del) { confirmDel = null; renderNotes(); } }, 4000); }
    return;
  }
  if (t.dataset.go) { location.hash = "#s" + t.dataset.go; if (matchMedia("(max-width:1180px)").matches) closeNotes(); return; }
});

/* ---------------- select text -> note ---------------- */
const selBtn = $("#selBtn");
let selInfo = null;
function onSelection() {
  const s = getSelection();
  const text = s ? s.toString().replace(/\s+/g, " ").trim() : "";
  const body = $("#chBody");
  if (!text || text.length < 2 || !body || !s.rangeCount || !body.contains(s.anchorNode)) { selBtn.hidden = true; selInfo = null; return; }
  const el = s.anchorNode.nodeType === 1 ? s.anchorNode : s.anchorNode.parentElement;
  const sec = el.closest("section.sec"); if (!sec) { selBtn.hidden = true; return; }
  const c = byNum.get(view.num); const st = c.sections.find(x => x.id === sec.dataset.sec);
  selInfo = {sec: sec.dataset.sec, secTitle: st ? st.title : c.title, quote: text.slice(0, 300)};
  const r = s.getRangeAt(0).getBoundingClientRect();
  selBtn.hidden = false;
  const w = selBtn.offsetWidth || 96;
  selBtn.style.left = Math.max(8, Math.min(window.innerWidth - w - 8, r.left + r.width / 2 - w / 2)) + "px";
  selBtn.style.top = Math.min(window.innerHeight - 44, r.bottom + 8) + "px";
}
document.addEventListener("mouseup", e => { if (!e.target.closest("#selBtn")) setTimeout(onSelection, 0); });
document.addEventListener("keyup", e => { if (e.shiftKey) onSelection(); });
document.addEventListener("selectionchange", () => { const s = getSelection(); if (!s || s.isCollapsed) { selBtn.hidden = true; } });
document.addEventListener("touchend", () => setTimeout(onSelection, 250));
selBtn.addEventListener("mousedown", e => e.preventDefault());
selBtn.addEventListener("click", () => { if (selInfo) { openComposer(selInfo); getSelection().removeAllRanges(); selBtn.hidden = true; } });
window.addEventListener("scroll", () => { if (!selBtn.hidden) onSelection(); }, {passive: true});

/* ---------------- export ---------------- */
function notesMarkdown() {
  const list = [...Store.notes.values()].sort((a, b) => (a.chapter + sortKey(a)) < (b.chapter + sortKey(b)) ? -1 : 1);
  const chapOrder = n => chapters.findIndex(c => c.num === n.chapter);
  list.sort((a, b) => chapOrder(a) - chapOrder(b) || (sortKey(a) < sortKey(b) ? -1 : 1));
  let md = `# SLAM 阶梯式学习指南 · 我的笔记\n\n导出时间：${new Date().toLocaleString("zh-CN")}，共 ${list.length} 条\n`;
  let lastCh = null, lastSec = null;
  for (const n of list) {
    if (n.chapter !== lastCh) { const c = byNum.get(n.chapter); md += `\n## ${n.chapter} ${c ? c.title : ""}\n`; lastCh = n.chapter; lastSec = null; }
    if (n.sec !== lastSec) { md += `\n### ${n.sec} ${n.secTitle}\n`; lastSec = n.sec; }
    md += `\n- **${TAGS[n.tag] || "笔记"}**${n.quote ? `\n  > ${n.quote.replace(/\n/g, " ")}` : ""}${n.text ? `\n  ${n.text.replace(/\n/g, "\n  ")}` : ""}\n`;
  }
  return md;
}
$("#exportBtn").addEventListener("click", () => {
  const m = $("#exMenu"); m.hidden = !m.hidden; $("#exportBtn").setAttribute("aria-expanded", String(!m.hidden));
});
async function saveFile(name, text) {
  try {
    const url = URL.createObjectURL(new Blob([text], {type: "text/plain;charset=utf-8"}));
    const a = document.createElement("a"); a.href = url; a.download = name; document.body.appendChild(a); a.click();
    setTimeout(() => { URL.revokeObjectURL(url); a.remove(); }, 1500);
    toast("已开始下载 " + name);
  } catch { showExportBox(text); }
}
function backupJson() {
  return JSON.stringify({app: "slam-guide", version: 1, exported: new Date().toISOString(),
    notes: [...Store.notes.values()], done: [...Store.done]}, null, 1);
}
$("#exMenu").addEventListener("click", e => {
  const k = e.target.dataset.ex; if (!k) return;
  $("#exMenu").hidden = true; $("#exportBtn").setAttribute("aria-expanded", "false");
  const day = new Date().toISOString().slice(0, 10);
  if (k === "md") { if (!Store.notes.size) { toast("还没有笔记可以导出。"); return; } saveFile(`SLAM学习笔记-${day}.md`, notesMarkdown()); }
  if (k === "backup") saveFile(`SLAM学习笔记备份-${day}.json`, backupJson());
  if (k === "restore") $("#restoreFile").click();
});
$("#restoreFile").addEventListener("change", async e => {
  const f = e.target.files && e.target.files[0]; e.target.value = ""; if (!f) return;
  let data; try { data = JSON.parse(await f.text()); } catch { toast("这个文件不是有效的笔记备份。"); return; }
  if (!data || data.app !== "slam-guide" || !Array.isArray(data.notes)) { toast("这个文件不是本指南导出的备份。"); return; }
  let added = 0;
  for (const n of data.notes) {
    if (!n || n.kind !== "note" || typeof n.id !== "string" || !/^[\w.~:@+-]{1,80}$/.test(n.id)) continue;
    const cur = Store.notes.get(n.id);
    if (!cur || (n.updated || 0) > (cur.updated || 0)) { await Store.saveNote(n); added++; }
  }
  for (const num of (Array.isArray(data.done) ? data.done : [])) if (byNum.has(num) && !Store.done.has(num)) await Store.setDone(num, true);
  toast(added ? `已恢复 ${added} 条笔记` : "备份里的笔记这里都已经有了");
});
function showExportBox(md) {
  const scrim = document.createElement("div"); scrim.className = "scrim";
  const box = document.createElement("div"); box.className = "exportbox";
  box.innerHTML = `<b>导出笔记（Markdown）</b><textarea id="exportText" readonly></textarea>
    <div style="display:flex;gap:8px;justify-content:flex-end"><button class="btn" id="exClose">关闭</button><button class="btn primary" id="exCopy">复制全部</button></div>`;
  document.body.append(scrim, box);
  box.querySelector("#exportText").value = md;
  const close = () => { scrim.remove(); box.remove(); };
  scrim.onclick = close; box.querySelector("#exClose").onclick = close;
  box.querySelector("#exCopy").onclick = () => {
    const ta = box.querySelector("#exportText");
    navigator.clipboard?.writeText(md).then(() => toast("已复制到剪贴板"), () => { ta.focus(); ta.select(); toast("已选中全部文字，按 Ctrl+C 复制"); });
  };
}

/* ---------------- search ---------------- */
let index = null;
function buildIndex() {
  index = [];
  const dp = new DOMParser();
  for (const c of chapters) {
    const doc = dp.parseFromString(`<div>${c.html}</div>`, "text/html");
    doc.querySelectorAll("section.sec").forEach(s => {
      const st = c.sections.find(x => x.id === s.dataset.sec);
      index.push({num: c.num, sec: s.dataset.sec, title: st ? `${st.id} ${st.title}` : `${c.num} ${c.title}`, text: s.textContent.replace(/\s+/g, " ")});
    });
  }
}
let searchTimer = null;
$("#q").addEventListener("input", () => { clearTimeout(searchTimer); searchTimer = setTimeout(doSearch, 180); });
$("#q").addEventListener("focus", () => { if ($("#q").value.trim()) doSearch(); });
function doSearch() {
  const q = $("#q").value.trim(), box = $("#results");
  if (q.length < 1) { box.hidden = true; return; }
  if (!index) buildIndex();
  const ql = q.toLowerCase(), hits = [];
  for (const it of index) {
    const i = it.text.toLowerCase().indexOf(ql), ti = it.title.toLowerCase().indexOf(ql);
    if (i < 0 && ti < 0) continue;
    hits.push({it, i, score: ti >= 0 ? 0 : 1});
    if (hits.length > 200) break;
  }
  hits.sort((a, b) => a.score - b.score);
  const mark = s => esc(s).replace(new RegExp(q.replace(/[.*+?^${}()|[\]\\]/g, "\\$&").replace(/&/g, "&amp;").replace(/</g, "&lt;"), "gi"), m => `<mark>${m}</mark>`);
  box.innerHTML = hits.length ? hits.slice(0, 40).map(h => {
    const a = Math.max(0, h.i - 30), snip = h.i >= 0 ? (a ? "…" : "") + h.it.text.slice(a, h.i + q.length + 50) + "…" : "";
    return `<button data-go="${h.it.sec}"><div class="r-t">${mark(h.it.title)}</div>${snip ? `<div class="r-s">${mark(snip)}</div>` : ""}</button>`;
  }).join("") + (hits.length > 40 ? `<div class="r-s" style="padding:6px 10px">还有 ${hits.length - 40} 处匹配，换个更具体的词试试</div>` : "")
    : `<div class="r-s" style="padding:8px 10px">没有找到“${esc(q)}”</div>`;
  box.hidden = false;
}
$("#results").addEventListener("click", e => {
  const b = e.target.closest("button[data-go]"); if (!b) return;
  const id = b.dataset.go; $("#results").hidden = true;
  location.hash = id.split(".").length >= 3 && !id.endsWith(".0") ? "#s" + id : "#c" + id.split(".").slice(0, 2).join(".");
});
document.addEventListener("click", e => { if (!e.target.closest(".search")) $("#results").hidden = true; });
document.addEventListener("keydown", e => { if (e.key === "Escape") { $("#results").hidden = true; if (!$("#notes").hidden && matchMedia("(max-width:1180px)").matches) closeNotes(); } });

/* ---------------- misc ---------------- */
$("#menuBtn").addEventListener("click", () => { $("#nav").hidden = !$("#nav").hidden; });
if (matchMedia("(max-width:860px)").matches) $("#nav").hidden = true;
let toastTimer = null;
function toast(msg) {
  let t = document.querySelector(".toast"); if (!t) { t = document.createElement("div"); t.className = "toast"; t.setAttribute("role", "status"); document.body.appendChild(t); }
  t.textContent = msg; t.hidden = false; clearTimeout(toastTimer); toastTimer = setTimeout(() => { t.hidden = true; }, 2600);
}
function updateCounts() {
  $("#noteCount").textContent = Store.notes.size;
  const d = studyChapters.filter(c => Store.done.has(c.num)).length;
  $("#prog").innerHTML = `已学 <b>${d}</b>/${studyChapters.length} 章`;
}
function refreshAll() {
  updateCounts(); renderNav(); renderNotes();
  if (view.kind === "chapter") {
    document.querySelectorAll("#chBody .sec-tools").forEach(x => x.remove());
    decorateSections();
    const b = $("#doneBtn"); if (b) { const d = Store.done.has(view.num); b.className = "btn " + (d ? "done" : "primary"); b.textContent = d ? "✓ 本章已学完（点此取消）" : "标记本章已学完"; }
  } else renderLevel(view.key);
}
route();
</script>
