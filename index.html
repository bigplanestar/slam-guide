(x_3 - x_2) - 1.1<\/code><\/pre>\n<p>标准差是 0.1 m，所以方差和信息量为：<\/p>\n<pre class=\"code\"><code>variance_odom    = 0.1^2 = 0.01 m^2\ninformation_odom = 1 / 0.01 = 100<\/code><\/pre>\n<p>只有这三条边时，可以让三个残差同时为 0，因此最优位置是：<\/p>\n<pre class=\"code\"><code>x_0 = 0.0 m\nx_1 = 1.1 m\nx_2 = 2.1 m\nx_3 = 3.2 m<\/code><\/pre>\n<p>现在机器人在 <code>x_3<\/code> 重新观察到起点附近的固定标志。激光回环匹配认为起点到终点的距离是 3.0 m，标准差是 0.05 m：<\/p>\n<pre class=\"code\"><code>z_loop     = 3.0 m\nsigma_loop = 0.05 m<\/code><\/pre>\n<p>回环边连接 <code>x_0<\/code> 与 <code>x_3<\/code>：<\/p>\n<pre class=\"code\"><code>+------------------- 3.0 m -------------------+\n|                                             |\nx_0 --1.1--&gt; x_1 --1.0--&gt; x_2 --1.1--&gt; x_3  |\n|                                             |\n+---------------------------------------------+<\/code><\/pre>\n<p>回环残差为：<\/p>\n<pre class=\"code\"><code>r_loop = (x_3 - x_0) - 3.0<\/code><\/pre>\n<p>里程计累计得到 3.2 m，回环却测得 3.0 m，二者相差 0.2 m。现在不可能再让四条残差同时为 0，优化器只能根据各自的噪声寻找折中。<\/p>\n<p>完整目标函数是：<\/p>\n<pre class=\"code\"><code>F(x_1, x_2, x_3)\n= 0.5 * [\n    ((x_1-x_0)-1.1)^2 / 0.1^2\n  + ((x_2-x_1)-1.0)^2 / 0.1^2\n  + ((x_3-x_2)-1.1)^2 / 0.1^2\n  + ((x_3-x_0)-3.0)^2 / 0.05^2\n  ]<\/code><\/pre>\n<p>也可以写成信息量形式：<\/p>\n<pre class=\"code\"><code>F\n= 0.5 * [\n    100 * r_01^2\n  + 100 * r_12^2\n  + 100 * r_23^2\n  + 400 * r_loop^2\n  ]<\/code><\/pre>\n<p>回环的信息量是 400，单条里程计的信息量是 100。这不是说“回环一定正确”，而是说我们通过标准差声明：在这个例子中，回环比单次里程计更可信。<\/p><\/section>\n<section class=\"sec\" data-sec=\"4.2.4\"><h3 id=\"s4.2.4\"><span class=\"num\">4.2.4<\/span> 一步一步算出加入回环后的结果<\/h3>\n<p>三条里程计的标准差相同。平方误差在相同权重下倾向于把总修正平均分给三段，令每段都增加同一个修正量 c：<\/p>\n<pre class=\"code\"><code>x_1 - x_0 = 1.1 + c\nx_2 - x_1 = 1.0 + c\nx_3 - x_2 = 1.1 + c<\/code><\/pre>\n<p>于是：<\/p>\n<pre class=\"code\"><code>r_01 = r_12 = r_23 = c\n\nx_3 = 3.2 + 3*c\n\nr_loop\n= x_3 - 3.0\n= 0.2 + 3*c<\/code><\/pre>\n<p>代回目标函数：<\/p>\n<pre class=\"code\"><code>F(c)\n= 0.5 * [\n    3*c^2 / 0.1^2\n  + (0.2+3*c)^2 / 0.05^2\n  ]<\/code><\/pre>\n<p>对 c 求导并令导数等于 0：<\/p>\n<pre class=\"code\"><code>dF/dc\n= 3*c / 0.01\n  + 3*(0.2+3*c) / 0.0025\n= 0<\/code><\/pre>\n<p>整理：<\/p>\n<pre class=\"code\"><code>300*c + 1200*(0.2+3*c) = 0\n\n3900*c + 240 = 0\n\nc = -240 / 3900\n  approximately_equals -0.06154 m<\/code><\/pre>\n<p>所以三段优化后的相对位移是：<\/p>\n<pre class=\"code\"><code>x_1 - x_0 = 1.03846 m\nx_2 - x_1 = 0.93846 m\nx_3 - x_2 = 1.03846 m<\/code><\/pre>\n<p>对应位置为：<\/p>\n<pre class=\"code\"><code>x_0 = 0.00000 m\nx_1 = 1.03846 m\nx_2 = 1.97692 m\nx_3 = 3.01538 m<\/code><\/pre>\n<p>最终每条里程计残差约为 <code>-0.06154 m<\/code>，回环残差约为 <code>+0.01538 m<\/code>。<\/p>\n<figure class=\"still\"><img loading=\"lazy\" src=\"img/static/posegraph-loop.png\" alt=\"加入回环前后的四节点位姿图\"><figcaption>加入回环前后的四节点位姿图<\/figcaption><\/figure>\n<blockquote>图注：回环没有把 x3 直接改成 3.00，而是把 0.2 m 的冲突按信息量分摊：三条里程计各退 0.0615 m，回环自己也留下 0.0154 m 残差。<\/blockquote>\n<p>为什么没有强行得到 <code>x_3=3.0 m<\/code>？因为回环也有噪声，不是绝对真值。最优结果同时照顾了三条里程计和一条回环。如果把回环标准差改成 0.5 m，它的信息量会从 400降到 4，优化结果就会更靠近里程计累计的 3.2 m。<\/p>\n<p>真正决定结果的不是“这条边叫回环还是里程计”，而是残差与协方差共同形成的加权代价。<\/p>\n<figure class=\"anim\"><div class=\"player\"><video src=\"vid/posegraph_loop.mp4\" poster=\"vid/posegraph_loop.jpg\" muted loop playsinline preload=\"none\" aria-label=\"动画 20：一维位姿图按信息量折中到 3.01538；二维轨迹的回环把闭合误差沿整个环分摊\"><\/video><\/div><figcaption><span class=\"badge\">动画 20<\/span>一维位姿图按信息量折中到 3.01538；二维轨迹的回环把闭合误差沿整个环分摊<\/figcaption><\/figure><\/section>\n<section class=\"sec\" data-sec=\"4.2.5\"><h3 id=\"s4.2.5\"><span class=\"num\">4.2.5<\/span> g2o 怎样表达并求解这个例子？<\/h3>\n<p>在 g2o 的常见建模方式中：<\/p>\n<pre class=\"code\"><code>Vertex    保存待估计变量\nEdge      保存测量、残差模型、雅可比和信息矩阵\nOptimizer 保存整张图并调用求解器<\/code><\/pre>\n<p>上面的例子可对应为：<\/p>\n<pre class=\"code\"><code>Vertex x_0    初值 0.0，固定不优化\nVertex x_1    初值 1.1\nVertex x_2    初值 2.1\nVertex x_3    初值 3.2\n\nEdge x_0-x_1    measurement=1.1    information=100\nEdge x_1-x_2    measurement=1.0    information=100\nEdge x_2-x_3    measurement=1.1    information=100\nEdge x_0-x_3    measurement=3.0    information=400<\/code><\/pre>\n<p>固定 <code>x_0<\/code> 是为了消除整体平移自由度。如果所有位置同时加 10 m，相对位移残差完全不变；不固定参考点，图只能确定相对位置，不能确定唯一的绝对位置。<\/p>\n<p>g2o 的调用过程可简化为：<\/p>\n<pre class=\"code\"><code>optimizer.addVertex(x_0)\noptimizer.addVertex(x_1)\noptimizer.addVertex(x_2)\noptimizer.addVertex(x_3)\n\noptimizer.addEdge(edge_01)\noptimizer.addEdge(edge_12)\noptimizer.addEdge(edge_23)\noptimizer.addEdge(edge_loop)\n\noptimizer.initializeOptimization()\noptimizer.optimize(number_of_iterations)<\/code><\/pre>\n<p>每次非线性迭代内部大致执行：<\/p>\n<pre class=\"code\"><code>1. 每条 Edge 根据当前 Vertex 计算残差 r_i\n2. 每条 Edge 计算雅可比 J_i\n3. 累加稀疏 Hessian 和梯度\n\n   H += J_i^T * Omega_i * J_i\n   g += J_i^T * Omega_i * r_i\n\n4. 求解 H * delta_X = -g\n5. 用 delta_X 更新全部活动 Vertex\n6. 残差仍较大时，重新线性化并继续迭代<\/code><\/pre>\n<p>这个一维例子本身是线性的，一次线性求解即可得到最优解。实际 Pose2、Pose3、视觉重投影和激光匹配包含旋转或投影，是非线性的，所以通常需要多次迭代。<\/p>\n<p>g2o 的官方二维 SLAM 教程采用相同结构：添加 <code>VertexSE2<\/code> 和 <code>EdgeSE2<\/code>，为边设置测量和信息矩阵，固定第一个位姿，然后运行 Gauss-Newton。参见<a href=\"https://github.com/RainerKuemmerle/g2o/blob/master/g2o/examples/tutorial_slam2d/tutorial_slam2d.cpp\" target=\"_blank\" rel=\"noopener\">g2o 官方 tutorial_slam2d<\/a>。<\/p>\n<h4 id=\"s4.2.5.1\"><span class=\"num\">4.2.5.1<\/span> 为什么 Hessian 和梯度可以逐因子累加？<\/h4>\n<p>先解释代码中的 <code>+=<\/code>。它不是某个特殊矩阵运算，只是下面两句的缩写：<\/p>\n<pre class=\"code\"><code>H = H + 当前因子对 H 的贡献\ng = g + 当前因子对 g 的贡献<\/code><\/pre>\n<p>为什么每条边都能单独计算贡献再相加？从总目标函数开始。假设图中共有 N 个因子：<\/p>\n<pre class=\"code\"><code>F(X)\n= 0.5 * sum_i_from_1_to_N [\n    r_i(X)^T * Omega_i * r_i(X)\n  ]<\/code><\/pre>\n<p>这里第 i 个因子只负责自己的一项代价。之所以是求和，是因为在给定状态后把各测量建模为条件独立时，联合似然是各似然相乘；取负对数后，乘法变成加法。即使先不谈概率，只要总目标被设计成各项误差之和，下面的求导仍然成立。<\/p>\n<p>在当前估计 X 附近求一个小修正 <code>delta_X<\/code>。第 i 个残差作一阶展开：<\/p>\n<pre class=\"code\"><code>r_i(X boxplus delta_X)\napproximately_equals\nr_i + J_i*delta_X<\/code><\/pre>\n<p>其中 <code>r_i<\/code> 和 <code>J_i<\/code> 都在当前 X 处计算。把它代入第 i 项代价：<\/p>\n<pre class=\"code\"><code>F_i(delta_X)\napproximately_equals\n0.5\n* (r_i+J_i*delta_X)^T\n* Omega_i\n* (r_i+J_i*delta_X)<\/code><\/pre>\n<p>像普通平方公式一样展开，但保留矩阵乘法顺序：<\/p>\n<pre class=\"code\"><code>F_i(delta_X)\napproximately_equals\n0.5 * [\n    r_i^T*Omega_i*r_i\n  + r_i^T*Omega_i*J_i*delta_X\n  + delta_X^T*J_i^T*Omega_i*r_i\n  + delta_X^T*J_i^T*Omega_i*J_i*delta_X\n]<\/code><\/pre>\n<p>中间两项都是 <code>1 × 1<\/code> 标量，并且 Omega 为对称信息矩阵，所以二者相等：<\/p>\n<pre class=\"code\"><code>r_i^T*Omega_i*J_i*delta_X\n= delta_X^T*J_i^T*Omega_i*r_i<\/code><\/pre>\n<p>因此：<\/p>\n<pre class=\"code\"><code>F_i(delta_X)\napproximately_equals\nconstant_i\n+ delta_X^T * (J_i^T*Omega_i*r_i)\n+ 0.5*delta_X^T\n      * (J_i^T*Omega_i*J_i)\n      * delta_X<\/code><\/pre>\n<p>现在把全部 N 个因子加起来：<\/p>\n<pre class=\"code\"><code>F(delta_X)\napproximately_equals\nconstant\n+ delta_X^T\n  * sum_i [J_i^T*Omega_i*r_i]\n+ 0.5*delta_X^T\n  * sum_i [J_i^T*Omega_i*J_i]\n  * delta_X<\/code><\/pre>\n<p>与二次函数的标准形式比较：<\/p>\n<pre class=\"code\"><code>F(delta_X)\napproximately_equals\nconstant + g^T*delta_X + 0.5*delta_X^T*H_GN*delta_X<\/code><\/pre>\n<p>就可以直接读出：<\/p>\n<pre class=\"code\"><code>g    = sum_i [J_i^T * Omega_i * r_i]\n\nH_GN = sum_i [J_i^T * Omega_i * J_i]<\/code><\/pre>\n<p>这就是程序逐边执行下面两行的来源：<\/p>\n<pre class=\"code\"><code>H += J_i^T * Omega_i * J_i\ng += J_i^T * Omega_i * r_i<\/code><\/pre>\n<p>对二次近似关于 <code>delta_X<\/code> 求导：<\/p>\n<pre class=\"code\"><code>derivative(F, delta_X)\n= g + H_GN*delta_X<\/code><\/pre>\n<p>令导数为 0，得到 Gauss-Newton 正规方程：<\/p>\n<pre class=\"code\"><code>H_GN * delta_X = -g<\/code><\/pre>\n<p>这里的 g 是当前目标函数的一阶梯度。它指出当前状态附近代价增大的方向；<code>-g<\/code> 指向局部下降方向。<code>H_GN<\/code> 则描述不同状态方向上的局部曲率和耦合，负责把梯度转换成尺度合适的状态修正。<\/p>\n<h5>为什么这里通常写“近似 Hessian”？<\/h5>\n<p>若残差是非线性的，真正 Hessian 还包含残差二阶导数产生的项。对一条标量残差可以概括为：<\/p>\n<pre class=\"code\"><code>H_exact_i\n= J_i^T*Omega_i*J_i\n  + 与 r_i*second_derivative(r_i) 有关的项<\/code><\/pre>\n<p>Gauss-Newton 忽略第二项，所以代码里通常累加的是：<\/p>\n<pre class=\"code\"><code>H_GN = sum_i J_i^T*Omega_i*J_i<\/code><\/pre>\n<p>当残差函数是线性的，残差二阶导数为 0，<code>H_GN<\/code> 就是真 Hessian；当已经接近正确解、残差较小时，这个近似通常也比较好。初值很差或非线性很强时，LM 通过增加阻尼让更新更保守。<\/p>\n<h5>为什么称为“稀疏” Hessian？<\/h5>\n<p>全局状态可能包含很多位姿：<\/p>\n<pre class=\"code\"><code>X = [x_0, x_1, x_2, ..., x_1000]<\/code><\/pre>\n<p>但一条普通里程计边只连接相邻的 <code>x_i、x_j<\/code>，残差只依赖这两个变量。它的全局雅可比可以想成：<\/p>\n<pre class=\"code\"><code>J_factor\n= [0 ... J_i ... 0 ... J_j ... 0]<\/code><\/pre>\n<p>除了与两个相连顶点对应的块，其余列全是 0。因此这条二元边只会修改 H 的四个块：<\/p>\n<pre class=\"code\"><code>H_ii += J_i^T * Omega * J_i\nH_ij += J_i^T * Omega * J_j\nH_ji += J_j^T * Omega * J_i\nH_jj += J_j^T * Omega * J_j<\/code><\/pre>\n<p>梯度也只修改两个块：<\/p>\n<pre class=\"code\"><code>g_i += J_i^T * Omega * r\ng_j += J_j^T * Omega * r<\/code><\/pre>\n<p>RTK 这类只连接一个位姿的一元因子，只修改对应对角块。若 <code>x_0<\/code> 与 <code>x_1000<\/code> 之间没有直接因子，H 中对应块通常就是 0；加入首尾回环以后，该非对角块才变成非零。<\/p>\n<p>所以“稀疏”不是说每个小矩阵里的数字很小，而是说全局大矩阵的大多数块根本没有数据、等于 0。g2o 不需要先构造一个巨大的稠密 J，再做完整矩阵乘法；每条 Edge直接把自己的小矩阵贡献加到全局稀疏块中。<\/p>\n<p>求解 H 时做 Cholesky 或其他消元可能产生新的非零块，称为 fill-in。H 原始稀疏结构主要由因子图连接关系决定，求解时的 fill-in 多少还受变量排序影响。<\/p>\n<h5>两条边怎样一步一步累加：一个数值例子<\/h5>\n<p>固定 <code>x_0=0<\/code>，只优化：<\/p>\n<pre class=\"code\"><code>X = [x_1, x_2]^T<\/code><\/pre>\n<p>两条里程计测量为：<\/p>\n<pre class=\"code\"><code>z_01 = 1.1 m\nz_12 = 1.0 m\nsigma = 0.1 m\nomega = 1/0.1^2 = 100<\/code><\/pre>\n<p>假设本轮迭代开始时：<\/p>\n<pre class=\"code\"><code>x_1 = 1.0 m\nx_2 = 2.2 m<\/code><\/pre>\n<p>第一条边：<\/p>\n<pre class=\"code\"><code>r_01 = x_1-1.1 = -0.1\nJ_01 = [1, 0]<\/code><\/pre>\n<p>它贡献：<\/p>\n<pre class=\"code\"><code>H_01\n= J_01^T*100*J_01\n\n= [100  0]\n  [  0  0]\n\ng_01\n= J_01^T*100*r_01\n\n= [-10]\n  [  0]<\/code><\/pre>\n<p>第二条边：<\/p>\n<pre class=\"code\"><code>r_12\n= (x_2-x_1)-1.0\n= (2.2-1.0)-1.0\n= 0.2\n\nJ_12 = [-1, 1]<\/code><\/pre>\n<p>它贡献：<\/p>\n<pre class=\"code\"><code>H_12\n= J_12^T*100*J_12\n\n= [ 100  -100]\n  [-100   100]\n\ng_12\n= J_12^T*100*r_12\n\n= [-20]\n  [ 20]<\/code><\/pre>\n<p>逐边累加以后：<\/p>\n<pre class=\"code\"><code>H\n= H_01 + H_12\n\n= [ 200  -100]\n  [-100   100]\n\ng\n= g_01 + g_12\n\n= [-30]\n  [ 20]<\/code><\/pre>\n<p>求解：<\/p>\n<pre class=\"code\"><code>H*delta_X = -g\n\n[ 200  -100] [delta_x_1]   [ 30]\n[-100   100] [delta_x_2] = [-20]<\/code><\/pre>\n<p>得到：<\/p>\n<pre class=\"code\"><code>delta_x_1 =  0.1 m\ndelta_x_2 = -0.1 m<\/code><\/pre>\n<p>更新状态：<\/p>\n<pre class=\"code\"><code>x_1_new = 1.0+0.1 = 1.1 m\nx_2_new = 2.2-0.1 = 2.1 m<\/code><\/pre>\n<p>重新计算两条残差：<\/p>\n<pre class=\"code\"><code>r_01_new = 1.1-1.1 = 0\nr_12_new = (2.1-1.1)-1.0 = 0<\/code><\/pre>\n<p>因为这个小例子的残差是线性的，一次求解就到达最优解。Pose2、Pose3 和激光点到面残差包含旋转，更新后 J 会变化，所以要重新遍历各因子，再次累加新的 H 和 g。<\/p>\n<h5>白化以后为什么是同一套累加？<\/h5>\n<p>若：<\/p>\n<pre class=\"code\"><code>Sigma_i = L_i*L_i^T<\/code><\/pre>\n<p>定义白化残差和白化雅可比：<\/p>\n<pre class=\"code\"><code>e_i = L_i^-1*r_i\nA_i = L_i^-1*J_i<\/code><\/pre>\n<p>那么：<\/p>\n<pre class=\"code\"><code>H_i = A_i^T*A_i\n    = J_i^T*Sigma_i^-1*J_i\n\ng_i = A_i^T*e_i\n    = J_i^T*Sigma_i^-1*r_i<\/code><\/pre>\n<p>因此“先白化后做普通最小二乘”和“直接用 Omega 做加权最小二乘”仍然产生相同的H 与 g。GTSAM 常从白化后的 Gaussian factor 角度组织计算；它也可以直接用 QR或多前沿（multifrontal）消元，而不一定显式生成一张完整 H，但数学上对应的局部因子贡献相同。<\/p>\n<p>若使用鲁棒核，离群因子还会根据当前平方马氏距离获得额外的有效权重。此时每轮的H、g 不仅随雅可比变化，也可能随鲁棒权重变化。<\/p>\n<h4 id=\"s4.2.5.2\"><span class=\"num\">4.2.5.2<\/span> g2o 具体怎样组装出 H 和 b？<\/h4>\n<p>前面虽然说明了 g2o 的调用流程，但还没有把它内部构造的矩阵真正算出来。现在继续使用同一个一维例子，并把固定的 <code>x_0=0<\/code> 从未知变量中去掉。待求状态向量为：<\/p>\n<p>先避免混淆 g 和 b。在增量形式中：<\/p>\n<pre class=\"code\"><code>g = J^T*Omega*r\nH*delta_X = -g<\/code><\/pre>\n<p>而对线性残差 <code>r=A*X-z<\/code>：<\/p>\n<pre class=\"code\"><code>g = A^T*Omega*(A*X-z)\n  = H*X-b\n\nb = A^T*Omega*z<\/code><\/pre>\n<p>因此直接求 <code>H*X=b<\/code> 是线性问题的绝对状态写法；在当前 X 附近求增量时，右侧是：<\/p>\n<pre class=\"code\"><code>-g = b-H*X<\/code><\/pre>\n<p>二者是同一个正规方程的不同写法，不能把 b 和 g 当成同一个向量。<\/p>\n<pre class=\"code\"><code>X = [x_1, x_2, x_3]^T<\/code><\/pre>\n<p>四条边的残差可以逐行写成：<\/p>\n<pre class=\"code\"><code>r_01   = [ 1,  0,  0] * X - 1.1\nr_12   = [-1,  1,  0] * X - 1.0\nr_23   = [ 0, -1,  1] * X - 1.1\nr_loop = [ 0,  0,  1] * X - 3.0<\/code><\/pre>\n<p>把四行合起来：<\/p>\n<pre class=\"code\"><code>r = A * X - z\n\n    [ 1   0   0 ]           [1.1]\nA = [-1   1   0 ]       z = [1.0]\n    [ 0  -1   1 ]           [1.1]\n    [ 0   0   1 ]           [3.0]<\/code><\/pre>\n<p>前三条里程计边的信息量是 100，回环边的信息量是 400，所以：<\/p>\n<pre class=\"code\"><code>Omega = diag(100, 100, 100, 400)<\/code><\/pre>\n<p>目标函数为：<\/p>\n<pre class=\"code\"><code>F(X)\n= 0.5 * (A*X-z)^T * Omega * (A*X-z)<\/code><\/pre>\n<p>对 X 求导：<\/p>\n<pre class=\"code\"><code>dF/dX\n= A^T * Omega * (A*X-z)<\/code><\/pre>\n<p>令导数等于 0：<\/p>\n<pre class=\"code\"><code>A^T * Omega * A * X\n= A^T * Omega * z<\/code><\/pre>\n<p>定义：<\/p>\n<pre class=\"code\"><code>H = A^T * Omega * A\nb = A^T * Omega * z<\/code><\/pre>\n<p>逐项相乘后得到：<\/p>\n<pre class=\"code\"><code>    [ 200  -100     0 ]\nH = [-100   200  -100 ]\n    [   0  -100   500 ]\n\n    [  10]\nb = [ -10]\n    [1310]<\/code><\/pre>\n<p>于是 g2o 在这个线性例子中要求解：<\/p>\n<pre class=\"code\"><code>[ 200  -100     0 ] [x_1]   [  10]\n[-100   200  -100 ] [x_2] = [ -10]\n[   0  -100   500 ] [x_3]   [1310]<\/code><\/pre>\n<p>把三行分别除以合适的系数，可以改写成：<\/p>\n<pre class=\"code\"><code>2*x_1 - x_2             = 0.1\nx_1 - 2*x_2 + x_3       = 0.1\n       -x_2 + 5*x_3     = 13.1<\/code><\/pre>\n<p>第一行给出：<\/p>\n<pre class=\"code\"><code>x_2 = 2*x_1 - 0.1<\/code><\/pre>\n<p>把它代入第二行：<\/p>\n<pre class=\"code\"><code>x_3 = 3*x_1 - 0.1<\/code><\/pre>\n<p>再代入第三行：<\/p>\n<pre class=\"code\"><code>-(2*x_1-0.1) + 5*(3*x_1-0.1) = 13.1\n\n13*x_1 = 13.5\n\nx_1 = 1.03846<\/code><\/pre>\n<p>所以：<\/p>\n<pre class=\"code\"><code>x_1 = 1.03846 m\nx_2 = 1.97692 m\nx_3 = 3.01538 m<\/code><\/pre>\n<p>这和第 4.2.4 节用修正量 c 算出的结果完全相同。<\/p>\n<p>本例的残差是线性的，所以可以直接求 <code>H*X=b<\/code>。真实 g2o 位姿图是非线性的，它会在当前估计处线性化，并求状态增量：<\/p>\n<pre class=\"code\"><code>H * delta_X = -g<\/code><\/pre>\n<p>二者没有矛盾：在线性例子中直接求 X；在非线性问题中，每次只求当前状态附近的<code>delta_X<\/code>，更新状态后再次线性化。<\/p><\/section>\n<section class=\"sec\" data-sec=\"4.2.6\"><h3 id=\"s4.2.6\"><span class=\"num\">4.2.6<\/span> 二维位姿边比一维例子多了什么？<\/h3>\n<p>二维位姿包含：<\/p>\n<pre class=\"code\"><code>T_i = [position_x_i, position_y_i, yaw_i]<\/code><\/pre>\n<p>里程计测量是从位姿 i 到位姿 j 的相对位姿：<\/p>\n<pre class=\"code\"><code>Z_i_j = [relative_x, relative_y, relative_yaw]<\/code><\/pre>\n<p>状态预测出的相对位姿是：<\/p>\n<pre class=\"code\"><code>T_predict_i_j = T_i^-1 * T_j<\/code><\/pre>\n<p>边的残差可概括成：<\/p>\n<pre class=\"code\"><code>e_i_j\n= Log(\n    Z_i_j^-1 * T_i^-1 * T_j\n  )<\/code><\/pre>\n<p><code>Log<\/code> 把相对位姿误差变成三维小量：<\/p>\n<pre class=\"code\"><code>e_i_j = [error_x, error_y, error_yaw]^T<\/code><\/pre>\n<p>对应协方差和信息矩阵都是 <code>3 x 3<\/code>。三维 Pose3 的位姿误差是六维，信息矩阵通常是<code>6 x 6<\/code>。所以 <code>.g2o<\/code> 文件中的边不仅要保存测量，还要保存信息矩阵，用来说明测量有多可信、不同误差分量是否相关。参见<a href=\"https://github.com/RainerKuemmerle/g2o/wiki/file-format\" target=\"_blank\" rel=\"noopener\">g2o 官方文件格式说明<\/a>。<\/p>\n<h4 id=\"s4.2.6.1\"><span class=\"num\">4.2.6.1<\/span> 二维多传感器例子：先把题目画清楚<\/h4>\n<p>先说明名称：<code>g2o<\/code> 最后一个字符是英文字母 o，不是数字 0；有时会被误写成 <code>g20<\/code>。<\/p>\n<p>现在建立一个包含轮速里程计、激光里程计、RTK 和回环的二维例子。机器人有三个位姿：<\/p>\n<pre class=\"code\"><code>X_0 = (x_0, y_0, theta_0)\nX_1 = (x_1, y_1, theta_1)\nX_2 = (x_2, y_2, theta_2)<\/code><\/pre>\n<p>固定起点：<\/p>\n<pre class=\"code\"><code>X_0 = (0, 0, 0)<\/code><\/pre>\n<p>这样可以消除整张相对位姿图同时平移或旋转的规范自由度。为了先把矩阵手算清楚，暂时在 <code>theta_0=theta_1=theta_2=0<\/code> 附近线性化。此时机器人局部坐标系与世界坐标系方向一致，二维相对平移可以先按 x、y 分别求解。第 4.2.6.5 节再把 yaw 加回来。<\/p>\n<p>四类传感器给出下面的测量：<\/p>\n<div class=\"tbl\"><table><thead><tr><th>因子<\/th><th>x 测量/m<\/th><th>y 测量/m<\/th><th><code>sigma_x<\/code>/m<\/th><th><code>sigma_y<\/code>/m<\/th><\/tr><\/thead><tbody><tr><td>轮速 <code>0 -&gt; 1<\/code><\/td><td>1.10<\/td><td>0.00<\/td><td>0.10<\/td><td>0.30<\/td><\/tr><tr><td>轮速 <code>1 -&gt; 2<\/code><\/td><td>1.00<\/td><td>0.10<\/td><td>0.10<\/td><td>0.30<\/td><\/tr><tr><td>激光里程计 <code>0 -&gt; 1<\/code><\/td><td>1.00<\/td><td>0.05<\/td><td>0.05<\/td><td>0.05<\/td><\/tr><tr><td>激光里程计 <code>1 -&gt; 2<\/code><\/td><td>1.02<\/td><td>-0.02<\/td><td>0.05<\/td><td>0.05<\/td><\/tr><tr><td>RTK 对 <code>X_2<\/code> 的绝对位置<\/td><td>2.04<\/td><td>0.03<\/td><td>0.10<\/td><td>0.10<\/td><\/tr><tr><td>回环 <code>0 -&gt; 2<\/code><\/td><td>2.00<\/td><td>0.00<\/td><td>0.05<\/td><td>0.05<\/td><\/tr><\/tbody><\/table><\/div>\n<p>这个例子故意让测量略有矛盾，因为真实传感器不会完全一致。轮式里程计对前进方向比较准确，对侧向移动很弱，所以这里给 y 方向更大的标准差。激光里程计两个方向都设为 <code>0.05 m<\/code>。这只是教学数值，真实协方差必须由标定和运行数据确定。另外，这里把轮速的 x、y 分开给了对角标准差；真实轮速里程计的 <code>(x, y, yaw)<\/code> 协方差在侧向与航向之间通常有很强的相关，推导见第 3.4.2.8 节。<\/p>\n<p>表中的轮速二维位移是编码器经过车辆运动模型积分得到的相对 Pose2，不表示车轮直接测到了侧向速度；侧向结果依赖模型，因此给了较大的不确定度。<\/p>\n<p>还要先声明一个统计假设：下面暂时把各因子视为条件独立。如果“激光里程计”内部已经融合了同一份轮速，再把两者当独立因子加入，会重复计算信息；这种情况下需要建模交叉相关性，或者只加入未重复的信息。<\/p>\n<h4 id=\"s4.2.6.2\"><span class=\"num\">4.2.6.2<\/span> 每种传感器怎样变成残差？<\/h4>\n<p>先只写二维位置：<\/p>\n<pre class=\"code\"><code>p_i = [x_i, y_i]^T<\/code><\/pre>\n<p>轮速里程计的相对位置残差为：<\/p>\n<pre class=\"code\"><code>r_w_01 = (p_1-p_0) - z_w_01\nr_w_12 = (p_2-p_1) - z_w_12<\/code><\/pre>\n<p>激光里程计同样约束相邻位姿：<\/p>\n<pre class=\"code\"><code>r_l_01 = (p_1-p_0) - z_l_01\nr_l_12 = (p_2-p_1) - z_l_12<\/code><\/pre>\n<p>RTK 直接约束第二个位置：<\/p>\n<pre class=\"code\"><code>r_rtk_2 = p_2 - z_rtk_2<\/code><\/pre>\n<p>回环给出起点到第二个位姿的相对位置。因为 <code>p_0<\/code> 已固定为 0：<\/p>\n<pre class=\"code\"><code>r_loop_02\n= (p_2-p_0) - z_loop_02\n= p_2 - z_loop_02<\/code><\/pre>\n<p>四类信息矩阵为：<\/p>\n<pre class=\"code\"><code>Omega_wheel = diag(1/0.10^2, 1/0.30^2)\n            = diag(100, 11.111)\n\nOmega_lidar = diag(1/0.05^2, 1/0.05^2)\n            = diag(400, 400)\n\nOmega_rtk   = diag(100, 100)\n\nOmega_loop  = diag(400, 400)<\/code><\/pre>\n<p>为了能够分开手算 x、y，这里暂时使用对角协方差。真实 Pose2 的平移与 yaw 误差可能相关，此时应使用完整 <code>3 × 3<\/code> 协方差；g2o 和 GTSAM 仍按同一个 <code>r^T*Sigma^-1*r<\/code>处理，只是 x、y、yaw 不再能拆成三道独立标量题。<\/p>\n<p>完整目标函数是：<\/p>\n<pre class=\"code\"><code>F(X)\n= 0.5 * [\n    r_w_01^T    * Omega_wheel * r_w_01\n  + r_w_12^T    * Omega_wheel * r_w_12\n  + r_l_01^T    * Omega_lidar * r_l_01\n  + r_l_12^T    * Omega_lidar * r_l_12\n  + r_rtk_2^T   * Omega_rtk   * r_rtk_2\n  + r_loop_02^T * Omega_loop  * r_loop_02\n]<\/code><\/pre>\n<p>“轮速、激光、RTK、回环一起优化”并不是按照名称依次投票，而是把每种测量都变成残差，再按各自协方差加权，最后共同最小化一个目标函数。<\/p>\n<h4 id=\"s4.2.6.3\"><span class=\"num\">4.2.6.3<\/span> 先手算 x 方向的最终结果<\/h4>\n<p>固定 <code>x_0=0<\/code>，待求向量为：<\/p>\n<pre class=\"code\"><code>X_x = [x_1, x_2]^T<\/code><\/pre>\n<p>三种连接方式在 x 方向对应三种雅可比行：<\/p>\n<pre class=\"code\"><code>第一段相对因子：x_1              -&gt; A_01  = [ 1, 0]\n第二段相对因子：x_2-x_1          -&gt; A_12  = [-1, 1]\nRTK 或首尾回环：x_2              -&gt; A_abs = [ 0, 1]<\/code><\/pre>\n<p>每条标量因子 <code>A_i*X_x-z_i<\/code> 对正规方程的贡献为：<\/p>\n<pre class=\"code\"><code>H_i = A_i^T * omega_i * A_i\nb_i = A_i^T * omega_i * z_i<\/code><\/pre>\n<p>把所有轮速、激光、RTK 和回环贡献相加：<\/p>\n<pre class=\"code\"><code>H = sum_i H_i\nb = sum_i b_i<\/code><\/pre>\n<p>这正是 g2o 和 GTSAM 在线性化后分别由 Edge 或 Factor 完成的矩阵组装过程。<\/p>\n<p>x 方向的目标函数展开为：<\/p>\n<pre class=\"code\"><code>F_x\n= 0.5 * [\n    100*(x_1-1.10)^2\n  + 100*((x_2-x_1)-1.00)^2\n  + 400*(x_1-1.00)^2\n  + 400*((x_2-x_1)-1.02)^2\n  + 100*(x_2-2.04)^2\n  + 400*(x_2-2.00)^2\n]<\/code><\/pre>\n<p>把同类系数先合并。两条相邻边的总信息量都是：<\/p>\n<pre class=\"code\"><code>a_x = 100+400 = 500<\/code><\/pre>\n<p>绝对终点约束的总信息量是：<\/p>\n<pre class=\"code\"><code>b_x = 100+400 = 500<\/code><\/pre>\n<p>测量乘权重后的三个量为：<\/p>\n<pre class=\"code\"><code>d_01_x = 100*1.10 + 400*1.00 = 510\nd_12_x = 100*1.00 + 400*1.02 = 508\nd_abs_x = 100*2.04 + 400*2.00 = 1004<\/code><\/pre>\n<p>对 <code>x_1、x_2<\/code> 求导并令导数为 0，得到线性正规方程：<\/p>\n<pre class=\"code\"><code>H_x * X_x = b_vector_x\n\n[1000  -500] [x_1]   [   2]\n[-500  1000] [x_2] = [1512]<\/code><\/pre>\n<p>右侧为什么第一项是 2？因为第一段测量希望把 <code>x_1<\/code> 向前推，而第二段测量以<code>x_2-x_1<\/code> 的形式对 <code>x_1<\/code> 带负号：<\/p>\n<pre class=\"code\"><code>b_vector_x\n= [d_01_x-d_12_x,\n   d_12_x+d_abs_x]^T\n\n= [510-508, 508+1004]^T\n\n= [2, 1512]^T<\/code><\/pre>\n<p>解这两个联立方程：<\/p>\n<pre class=\"code\"><code>x_1 approximately_equals 1.01067 m\nx_2 approximately_equals 2.01733 m<\/code><\/pre>\n<p>结果没有等于任何一条原始测量，而是所有加权残差的折中。激光的单轴信息量 400大于轮速的 100，所以相邻位移更靠近激光；终点回环的信息量 400 大于 RTK 的 100，所以 <code>x_2<\/code> 更靠近 2.00 m，但相邻里程计仍把它稍微向前拉到 2.01733 m。<\/p>\n<h4 id=\"s4.2.6.4\"><span class=\"num\">4.2.6.4<\/span> 再手算 y 方向<\/h4>\n<p>待求向量为：<\/p>\n<pre class=\"code\"><code>X_y = [y_1, y_2]^T<\/code><\/pre>\n<p>轮速 y 方向信息量只有：<\/p>\n<pre class=\"code\"><code>1/0.30^2 approximately_equals 11.111<\/code><\/pre>\n<p>而激光是 400，所以：<\/p>\n<pre class=\"code\"><code>a_y = 11.111+400 = 411.111\nb_y = 100+400 = 500<\/code><\/pre>\n<p>加权测量为：<\/p>\n<pre class=\"code\"><code>d_01_y = 11.111*0.00 + 400*0.05\n       = 20.000\n\nd_12_y = 11.111*0.10 + 400*(-0.02)\n       approximately_equals -6.889\n\nd_abs_y = 100*0.03 + 400*0.00\n        = 3.000<\/code><\/pre>\n<p>正规方程为：<\/p>\n<pre class=\"code\"><code>[ 822.222  -411.111] [y_1]   [26.889]\n[-411.111   911.111] [y_2] = [-3.889]<\/code><\/pre>\n<p>解得：<\/p>\n<pre class=\"code\"><code>y_1 approximately_equals 0.03947 m\ny_2 approximately_equals 0.01354 m<\/code><\/pre>\n<p>最终二维位置是：<\/p>\n<pre class=\"code\"><code>p_0 = (0.00000, 0.00000) m\np_1 = (1.01067, 0.03947) m\np_2 = (2.01733, 0.01354) m<\/code><\/pre>\n<p>这个手算结果已经展示了三个关键事实：<\/p>\n<ol><li value=\"1\">同一个状态可以同时被相对测量和绝对测量约束；<\/li><li value=\"2\">标准差较小的因子贡献更大的 Hessian，因此对结果影响更大；<\/li><li value=\"3\">相邻因子把 <code>p_1、p_2<\/code> 耦合起来，所以终点的 RTK 和回环也会间接修改历史位置<code>p_1<\/code>。<\/li><\/ol>\n<h4 id=\"s4.2.6.5\"><span class=\"num\">4.2.6.5<\/span> 加入 yaw 后为什么变成非线性问题？<\/h4>\n<p>真实二维位姿为：<\/p>\n<pre class=\"code\"><code>X_i = (p_i, theta_i)<\/code><\/pre>\n<p>相对位姿测量中的平移通常在第 i 个机器人坐标系表达。候选位姿预测的相对平移为：<\/p>\n<pre class=\"code\"><code>delta_p_predict\n= R(theta_i)^T * (p_j-p_i)<\/code><\/pre>\n<p>相对 yaw 为：<\/p>\n<pre class=\"code\"><code>delta_theta_predict = wrap(theta_j-theta_i)<\/code><\/pre>\n<p>所以完整 Pose2 相对残差可以写成：<\/p>\n<pre class=\"code\"><code>r_i_j = [\n  R(theta_i)^T*(p_j-p_i) - delta_p_measured\n  wrap(theta_j-theta_i-delta_theta_measured)\n]<\/code><\/pre>\n<p><code>R(theta_i)<\/code> 中含有 <code>sin(theta_i)<\/code> 和 <code>cos(theta_i)<\/code>，因此位置和 yaw 不再能永久分开求解。优化器要在当前估计处计算雅可比：<\/p>\n<pre class=\"code\"><code>r(X boxplus delta_X)\napproximately_equals\nr(X) + J*delta_X<\/code><\/pre>\n<p>然后求：<\/p>\n<pre class=\"code\"><code>(J^T*Omega*J) * delta_X\n= -J^T*Omega*r<\/code><\/pre>\n<p>再通过 SE(2) 的位姿更新把 <code>delta_X<\/code> 加到当前估计上，并重新计算残差、数据关联和雅可比。<\/p>\n<p>例如再给出 yaw 测量：<\/p>\n<pre class=\"code\"><code>轮速 0-&gt;1:  0.020 rad, sigma=0.020 rad\n轮速 1-&gt;2: -0.010 rad, sigma=0.020 rad\n激光 0-&gt;1:  0.010 rad, sigma=0.010 rad\n激光 1-&gt;2:  0.000 rad, sigma=0.010 rad\n回环 0-&gt;2:  0.000 rad, sigma=0.010 rad<\/code><\/pre>\n<p>若暂时只对小角度 yaw 作线性求解，可得到：<\/p>\n<pre class=\"code\"><code>theta_1 approximately_equals 0.00892 rad\ntheta_2 approximately_equals 0.00385 rad<\/code><\/pre>\n<p>也就是约 <code>0.511<\/code> 度和 <code>0.220<\/code> 度。完整 Pose2 求解会用这些新角度重新旋转相对平移，继续迭代到状态修正足够小。<\/p>\n<h4 id=\"s4.2.6.6\"><span class=\"num\">4.2.6.6<\/span> Hessian 中怎样同时体现几何灵敏度和传感器噪声？<\/h4>\n<p>对每个因子：<\/p>\n<pre class=\"code\"><code>H_i = J_i^T * Omega_i * J_i\ng_i = J_i^T * Omega_i * r_i<\/code><\/pre>\n<p>再累加：<\/p>\n<pre class=\"code\"><code>H = sum_i H_i\ng = sum_i g_i<\/code><\/pre>\n<p>其中 <code>J_i<\/code> 表示状态变化会使该因子残差改变多少，<code>Omega_i=Sigma_i^-1<\/code> 表示这种残差变化相对于噪声有多显著。也可以对白化雅可比：<\/p>\n<pre class=\"code\"><code>J_white_i = L_i^-1 * J_i\n\nH_i = J_white_i^T * J_white_i<\/code><\/pre>\n<p>所以 Hessian 累加的是“以标准差为单位的灵敏度平方”。在本例 y 方向：<\/p>\n<pre class=\"code\"><code>轮速信息量 = 11.111\n激光信息量 = 400<\/code><\/pre>\n<p>即使两个因子的几何雅可比相同，激光对 Hessian 的贡献也是轮速的 36 倍。反过来，如果某个状态方向满足 <code>J_i*v=0<\/code>，把噪声设得再小也不能创造该方向的几何信息。<\/p>\n<h4 id=\"s4.2.6.7\"><span class=\"num\">4.2.6.7<\/span> g2o 怎样优化这个二维多传感器图？<\/h4>\n<p>g2o 用顶点保存状态、用边保存残差。这个例子可建模为：<\/p>\n<pre class=\"code\"><code>VertexSE2 X_0    fixed=true\nVertexSE2 X_1    initial estimate\nVertexSE2 X_2    initial estimate\n\nrelative edge X_0-X_1    wheel measurement + 3x3 information\nrelative edge X_1-X_2    wheel measurement + 3x3 information\nrelative edge X_0-X_1    lidar measurement + 3x3 information\nrelative edge X_1-X_2    lidar measurement + 3x3 information\nunary position edge X_2  RTK measurement + 2x2 information\nrelative edge X_0-X_2    loop measurement + 3x3 information<\/code><\/pre>\n<p>同一对顶点可以同时存在轮速边和激光边，因为它们代表不同测量。RTK 只测 x、y 时，适合使用只返回二维位置残差的一元边；不能为了凑成 Pose2 而虚构一个很精确的 yaw。<\/p>\n<p>g2o 的典型批量优化步骤为：<\/p>\n<pre class=\"code\"><code>1. 用轮速或激光积分给 X_1、X_2 初值\n2. 每条边用当前顶点计算预测测量\n3. 计算原始残差 r_i\n4. 用信息矩阵和可选鲁棒核对白化/缩放残差\n5. 计算边对相连顶点的雅可比 J_i\n6. 把 J_i^T*Omega_i*J_i 累加到稀疏 H 的对应块\n7. 把 J_i^T*Omega_i*r_i 累加到 g\n8. 固定 X_0 后求解 H*delta_X=-g\n9. 用 SE(2) 更新活动顶点\n10. LM 根据代价是否下降调整阻尼，并重新线性化\n11. 状态增量或代价变化足够小时停止<\/code><\/pre>\n<p>第 4.2.6.3、4.2.6.4 节的线性位置例子中，J 是常数，一次求解即可得到最终位置。完整Pose2 中 J 随 yaw 改变，所以需要多轮。RTK 与回环还应先经过坐标系、时间、RTK状态和几何一致性检查；尤其回环通常要使用鲁棒核，避免一个假回环拉坏整张图。<\/p>\n<h4 id=\"s4.2.6.8\"><span class=\"num\">4.2.6.8<\/span> GTSAM 批量优化怎样得到同一个结果？<\/h4>\n<p>GTSAM 使用不同的软件名称表达同一数学问题：<\/p>\n<pre class=\"code\"><code>X(0), X(1), X(2)       变量 Key\nValues                 位姿初值\nPriorFactor            起点先验\nBetweenFactor&lt;Pose2&gt;   轮速、激光和回环相对位姿因子\n位置因子               二维 RTK 约束\nNoiseModel             每个因子的协方差或标准差\nNonlinearFactorGraph   全部非线性因子<\/code><\/pre>\n<p>二维 Pose2 的 RTK 可以使用自定义二维位置因子；三维 Pose3 系统可以使用合适的 GNSS位置因子并处理天线杆臂。关键是残差只约束传感器真正测到的分量。<\/p>\n<p>批量 Gauss-Newton 或 LM 的过程是：<\/p>\n<pre class=\"code\"><code>NonlinearFactorGraph + Values\n  -&gt; 每个因子在当前 Values 处线性化\n  -&gt; 得到白化后的 GaussianFactorGraph\n  -&gt; 按变量顺序做稀疏消元或矩阵分解\n  -&gt; 回代求 delta_X\n  -&gt; 在 Pose2 流形上更新 Values\n  -&gt; 重新线性化，直到收敛<\/code><\/pre>\n<p>因此，若 g2o 与 GTSAM 使用完全相同的：<\/p>\n<pre class=\"code\"><code>状态定义\n残差正负和坐标系\n协方差及相关项\n鲁棒核\n初值\n线性化方式和停止条件<\/code><\/pre>\n<p>它们应收敛到同一个局部最优解。第 4.2.6.3、4.2.6.4 节的线性例子中，两者都会解同一组正规方程，得到：<\/p>\n<pre class=\"code\"><code>p_1 approximately_equals (1.01067, 0.03947) m\np_2 approximately_equals (2.01733, 0.01354) m<\/code><\/pre>\n<p>g2o 更直接暴露 Vertex、Edge、信息矩阵和稀疏优化器；GTSAM 更强调概率因子、噪声模型、变量消元和边缘概率。GTSAM 也可以批量优化，iSAM2 才是下一节讨论的增量组织方式。<\/p><\/section>\n<section class=\"sec\" data-sec=\"4.2.7\"><h3 id=\"s4.2.7\"><span class=\"num\">4.2.7<\/span> iSAM2 怎样表达同一个例子？<\/h3>\n<p>在 GTSAM/iSAM2 中，常见对象是：<\/p>\n<pre class=\"code\"><code>Key         变量的唯一编号，例如 X(0)、X(1)\nValues      各变量的当前估计或新变量初值\nFactor      连接变量的概率约束\nNoiseModel  因子的噪声模型，负责协方差和白化\nISAM2       保存因子、线性化点和 Bayes tree，进行增量更新<\/code><\/pre>\n<p>两套名称可大致对应为：<\/p>\n<div class=\"tbl\"><table><thead><tr><th>同一个数学对象<\/th><th>g2o 常见名称<\/th><th>GTSAM/iSAM2 常见名称<\/th><\/tr><\/thead><tbody><tr><td>待估计位姿<\/td><td>Vertex<\/td><td>Key 加 Values 中的值<\/td><\/tr><tr><td>相对位姿测量<\/td><td>Edge<\/td><td>BetweenFactor<\/td><\/tr><tr><td>初始绝对约束<\/td><td>固定首顶点或先验边<\/td><td>PriorFactor<\/td><\/tr><tr><td>测量可信度<\/td><td>Information matrix<\/td><td>NoiseModel<\/td><\/tr><tr><td>非线性问题容器<\/td><td>SparseOptimizer<\/td><td>NonlinearFactorGraph<\/td><\/tr><\/tbody><\/table><\/div>\n<p>iSAM2 的关键不是简单地更换名称，而是允许把数据分批送入。<\/p>\n<p>第一次只加入起点：<\/p>\n<pre class=\"code\"><code>new_factors = [PriorFactor(x_0 = 0)]\nnew_values  = [initial x_0 = 0]\n\nisam.update(new_factors, new_values)<\/code><\/pre>\n<p>走到下一时刻，只提交新变量和新边：<\/p>\n<pre class=\"code\"><code>new_factors = [BetweenFactor(x_0, x_1, measurement=1.1)]\nnew_values  = [initial x_1 = 1.1]\n\nisam.update(new_factors, new_values)<\/code><\/pre>\n<p>后续继续增加：<\/p>\n<pre class=\"code\"><code>update 3:\n  new factor = BetweenFactor(x_1, x_2, 1.0)\n  new value  = initial x_2\n\nupdate 4:\n  new factor = BetweenFactor(x_2, x_3, 1.1)\n  new value  = initial x_3<\/code><\/pre>\n<p>检测到回环时，<code>x_0<\/code> 和 <code>x_3<\/code> 已经存在，所以只增加因子，不重复插入变量：<\/p>\n<pre class=\"code\"><code>new_factors = [BetweenFactor(x_0, x_3, measurement=3.0)]\nnew_values  = []\n\nisam.update(new_factors, new_values)<\/code><\/pre>\n<p>GTSAM 官方示例同样将新因子和新变量初值分批传给 <code>update()<\/code>，参见<a href=\"https://borglab.github.io/gtsam/isam2/\" target=\"_blank\" rel=\"noopener\">GTSAM iSAM2 官方文档<\/a>。<\/p>\n<h4 id=\"s4.2.7.1\"><span class=\"num\">4.2.7.1<\/span> 每次调用 <code>isam.update()<\/code> 后，数值怎样变化？<\/h4>\n<p>为了和 g2o 的手算结果严格一致，下面把起点先验看成无限强，也就是直接认为<code>x_0=0<\/code>。实际 GTSAM 程序通常使用标准差很小但不为 0 的 <code>PriorFactor<\/code>，避免使用真正的无限权重。<\/p>\n<p>第一次更新只加入起点：<\/p>\n<pre class=\"code\"><code>输入：prior(x_0 = 0)\n\n输出：\nx_0 = 0.0<\/code><\/pre>\n<p>第二次更新加入 <code>x_0<\/code> 到 <code>x_1<\/code> 的里程计因子：<\/p>\n<pre class=\"code\"><code>输入：x_1 - x_0 approximately_equals 1.1\n\n输出：\nx_0 = 0.0\nx_1 = 1.1<\/code><\/pre>\n<p>第三次更新加入 <code>x_1<\/code> 到 <code>x_2<\/code> 的因子：<\/p>\n<pre class=\"code\"><code>输入：x_2 - x_1 approximately_equals 1.0\n\n输出：\nx_0 = 0.0\nx_1 = 1.1\nx_2 = 2.1<\/code><\/pre>\n<p>第四次更新加入 <code>x_2<\/code> 到 <code>x_3<\/code> 的因子：<\/p>\n<pre class=\"code\"><code>输入：x_3 - x_2 approximately_equals 1.1\n\n输出：\nx_0 = 0.0\nx_1 = 1.1\nx_2 = 2.1\nx_3 = 3.2<\/code><\/pre>\n<p>到这里，三条里程计残差都能等于 0。第五次更新只加入回环因子：<\/p>\n<pre class=\"code\"><code>输入：x_3 - x_0 approximately_equals 3.0\n\n这一次没有新状态：\nnew_values = []<\/code><\/pre>\n<p>iSAM2 将回环因子合并到已经保存的系统中。这个一维例子是线性的，雅可比不会随状态变化，所以不需要处理非线性重线性化误差。更新后得到：<\/p>\n<pre class=\"code\"><code>x_0 = 0.00000 m\nx_1 = 1.03846 m\nx_2 = 1.97692 m\nx_3 = 3.01538 m<\/code><\/pre>\n<p>可以把完整过程汇总为：<\/p>\n<div class=\"tbl\"><table><thead><tr><th>iSAM2 更新<\/th><th>新加入的内容<\/th><th>更新后的关键结果<\/th><\/tr><\/thead><tbody><tr><td>update 1<\/td><td>起点先验<\/td><td><code>x_0=0.0<\/code><\/td><\/tr><tr><td>update 2<\/td><td>里程计因子 0-1、新变量 <code>x_1<\/code><\/td><td><code>x_1=1.1<\/code><\/td><\/tr><tr><td>update 3<\/td><td>里程计因子 1-2、新变量 <code>x_2<\/code><\/td><td><code>x_2=2.1<\/code><\/td><\/tr><tr><td>update 4<\/td><td>里程计因子 2-3、新变量 <code>x_3<\/code><\/td><td><code>x_3=3.2<\/code><\/td><\/tr><tr><td>update 5<\/td><td>回环因子 0-3，没有新变量<\/td><td><code>x_3=3.01538<\/code>，历史 <code>x_1<\/code>、<code>x_2<\/code> 也被修正<\/td><\/tr><\/tbody><\/table><\/div>\n<p>iSAM2 最后得到的数值为什么和 g2o 相同？因为两者使用了同一组残差和权重，最终都在求第 4.2.3 节的同一个目标函数。iSAM2 并没有改变最优解的定义，它改变的是计算过程：<\/p>\n<pre class=\"code\"><code>g2o 典型批量方式：\n拿整张活动图重新组装并求解\n\niSAM2：\n保存以前的 Bayes tree，加入新因子后只重新处理受影响的部分<\/code><\/pre>\n<p>在这个四节点回环例子中，回环连接了链的首尾，相关路径覆盖了整条短链，所以可以复用的部分并不多。若图中有很多互不相关的分支，或者只在轨迹尾部增加普通里程计因子，iSAM2 才更容易体现局部更新和复用的优势。<\/p>\n<h4 id=\"s4.2.7.2\"><span class=\"num\">4.2.7.2<\/span> 二维多传感器例子怎样逐次增量更新？<\/h4>\n<p>现在把第 4.2.6 节的同一组二维数据按到达顺序交给 iSAM2。由于手算部分是线性位置模型，下面每次更新都可以看成精确增量求解；完整 Pose2 中还会受到重线性化阈值的影响。<\/p>\n<p>第一次更新：加入起点先验和新变量 <code>X_0<\/code>。<\/p>\n<pre class=\"code\"><code>new_factors:\n  prior(X_0 = (0,0,0))\n\nnew_values:\n  initial X_0\n\n结果：\n  p_0 = (0,0)<\/code><\/pre>\n<p>第二次更新：机器人到达 <code>X_1<\/code>，同时加入轮速和激光的 <code>0-&gt;1<\/code> 相对因子。<code>X_1<\/code> 是新变量，因此必须提供初值；<code>X_0<\/code> 已存在，不能再次放入 <code>new_values<\/code>。<\/p>\n<pre class=\"code\"><code>new_factors:\n  wheel between(X_0, X_1)\n  lidar between(X_0, X_1)\n\nnew_values:\n  initial X_1<\/code><\/pre>\n<p>x 方向是两个测量的加权平均：<\/p>\n<pre class=\"code\"><code>x_1\n= (100*1.10 + 400*1.00) / (100+400)\n= 1.02000 m<\/code><\/pre>\n<p>y 方向为：<\/p>\n<pre class=\"code\"><code>y_1\n= (11.111*0.00 + 400*0.05) / (11.111+400)\napproximately_equals 0.04865 m<\/code><\/pre>\n<p>所以：<\/p>\n<pre class=\"code\"><code>p_1 approximately_equals (1.02000, 0.04865) m<\/code><\/pre>\n<p>第三次更新：到达 <code>X_2<\/code>，增加两条 <code>1-&gt;2<\/code> 因子和新变量初值：<\/p>\n<pre class=\"code\"><code>new_factors:\n  wheel between(X_1, X_2)\n  lidar between(X_1, X_2)\n\nnew_values:\n  initial X_2<\/code><\/pre>\n<p>第二段的加权相对位移为：<\/p>\n<pre class=\"code\"><code>delta_x_12 = (100*1.00 + 400*1.02) / 500\n           = 1.01600 m\n\ndelta_y_12\n= (11.111*0.10 + 400*(-0.02)) / 411.111\napproximately_equals -0.01676 m<\/code><\/pre>\n<p>此时尚无绝对终点约束，因此：<\/p>\n<pre class=\"code\"><code>p_2\n= p_1 + (delta_x_12, delta_y_12)\n\napproximately_equals\n(2.03600, 0.03189) m<\/code><\/pre>\n<p>第四次更新：RTK 数据到达。<code>X_2<\/code> 已存在，所以只加入因子：<\/p>\n<pre class=\"code\"><code>new_factors:\n  RTK position factor on X_2\n\nnew_values:\n  empty<\/code><\/pre>\n<p>联合重新求解后：<\/p>\n<pre class=\"code\"><code>p_1 approximately_equals (1.02057, 0.04834) m\np_2 approximately_equals (2.03714, 0.03127) m<\/code><\/pre>\n<p>RTK 直接连接 <code>X_2<\/code>，却也轻微修改了 <code>X_1<\/code>。原因是相邻里程计因子使 <code>X_1<\/code> 和<code>X_2<\/code> 相关；这与第 4.1.3.4 节“只测位置也能通过 P 的交叉协方差修正速度”是同一种信息传播现象，只是图优化把相关性保留在稀疏因子和消元结构中。<\/p>\n<p>第五次更新：回环确认后，加入 <code>X_0-&gt;X_2<\/code> 因子，不增加新变量：<\/p>\n<pre class=\"code\"><code>new_factors:\n  loop between(X_0, X_2)\n\nnew_values:\n  empty<\/code><\/pre>\n<p>更新后的线性位置结果就是第 4.2.6 节的批量最优解：<\/p>\n<pre class=\"code\"><code>p_1 approximately_equals (1.01067, 0.03947) m\np_2 approximately_equals (2.01733, 0.01354) m<\/code><\/pre>\n<p>加入第 4.2.6.5 节的 yaw 测量，并在小角度近似下求解，还得到：<\/p>\n<pre class=\"code\"><code>theta_1 approximately_equals 0.00892 rad\ntheta_2 approximately_equals 0.00385 rad<\/code><\/pre>\n<p>把位置过程汇总如下：<\/p>\n<div class=\"tbl\"><table><thead><tr><th>update<\/th><th>新增内容<\/th><th><code>p_1<\/code>/m<\/th><th><code>p_2<\/code>/m<\/th><\/tr><\/thead><tbody><tr><td>1<\/td><td><code>X_0<\/code> 先验<\/td><td>尚不存在<\/td><td>尚不存在<\/td><\/tr><tr><td>2<\/td><td><code>X_1<\/code>、轮速01、激光01<\/td><td><code>(1.02000,0.04865)<\/code><\/td><td>尚不存在<\/td><\/tr><tr><td>3<\/td><td><code>X_2<\/code>、轮速12、激光12<\/td><td><code>(1.02000,0.04865)<\/code><\/td><td><code>(2.03600,0.03189)<\/code><\/td><\/tr><tr><td>4<\/td><td>RTK 位置因子<\/td><td><code>(1.02057,0.04834)<\/code><\/td><td><code>(2.03714,0.03127)<\/code><\/td><\/tr><tr><td>5<\/td><td>首尾回环因子<\/td><td><code>(1.01067,0.03947)<\/code><\/td><td><code>(2.01733,0.01354)<\/code><\/td><\/tr><\/tbody><\/table><\/div>\n<p>这张表中的每一行都不是“把新测量覆盖到状态上”。每次 <code>update()<\/code> 都是在此前全部因子和新因子共同定义的目标函数下更新后验，只是 iSAM2 复用旧的消元结果，不必像典型批量方法那样每次从空白开始处理整张图。<\/p>\n<h4 id=\"s4.2.7.3\"><span class=\"num\">4.2.7.3<\/span> RTK 和回环对 Bayes tree 的影响有什么不同？<\/h4>\n<p>假设变量消元以后，链式图大致形成：<\/p>\n<pre class=\"code\"><code>X_0 conditional on X_1\n  -&gt; X_1 conditional on X_2\n       -&gt; X_2 root<\/code><\/pre>\n<p>新 RTK 因子只连接最新的 <code>X_2<\/code>。它通常首先修改靠近 <code>X_2<\/code> 的根部信息；之后通过回代，<code>X_1<\/code> 的估计值也可以改变。这里要区分：<\/p>\n<pre class=\"code\"><code>重新消元/重新分解哪些部分\n与\n回代后哪些变量数值发生变化<\/code><\/pre>\n<p>前者可能是局部的，后者可以沿条件关系传播。<\/p>\n<p>回环因子同时连接很早的 <code>X_0<\/code> 和最新的 <code>X_2<\/code>。iSAM2 需要在 Bayes tree 中找到这两个变量相关的 cliques，拆下它们之间受影响的区域，把新回环与相关旧因子一起重新消元，再把没有受影响的子树接回去。短链中几乎整条链都受影响；数千节点的大图中，影响范围取决于图结构和变量排序。<\/p>\n<p>因此 iSAM2 不能理解成：<\/p>\n<pre class=\"code\"><code>错误理解：每次永远只计算新节点<\/code><\/pre>\n<p>更准确的说法是：<\/p>\n<pre class=\"code\"><code>保存旧 Bayes tree 和线性化点\n  -&gt; 找到新因子影响的区域\n  -&gt; 按需重线性化和重新消元该区域\n  -&gt; 复用未受影响的分解结构\n  -&gt; 回代得到新的全局估计<\/code><\/pre>\n<p>对于非线性 Pose2/Pose3 因子，若某些变量相对旧线性化点移动超过阈值，即使没有直接连接新因子，也可能被标记为重新线性化。大回环、差初值或过小阈值都会扩大单次更新代价；所以“增量”表示尽可能复用计算，并不保证每次都是固定的小计算量。<\/p><\/section>\n<section class=\"sec\" data-sec=\"4.2.8\"><h3 id=\"s4.2.8\"><span class=\"num\">4.2.8<\/span> Bayes tree 到底保存了什么？<\/h3>\n<p>仍看线性化后的位姿链：<\/p>\n<pre class=\"code\"><code>prior(x_0)\nedge(x_0, x_1)\nedge(x_1, x_2)\nedge(x_2, x_3)<\/code><\/pre>\n<p>消去 <code>x_0<\/code> 时，可以得到：<\/p>\n<pre class=\"code\"><code>一个条件关系 p(x_0 | x_1)\n一个继续作用在 x_1 上的新因子<\/code><\/pre>\n<p>再消去 <code>x_1<\/code>：<\/p>\n<pre class=\"code\"><code>得到 p(x_1 | x_2)\n并把剩余信息传给 x_2<\/code><\/pre>\n<p>依次进行，联合分布可组织成：<\/p>\n<pre class=\"code\"><code>p(x_0, x_1, x_2, x_3 | measurements)\n\n= p(x_0 | x_1)\n  * p(x_1 | x_2)\n  * p(x_2 | x_3)\n  * p(x_3)<\/code><\/pre>\n<p>这与对稀疏线性系统做 QR 或 Cholesky 分解，是同一计算的概率解释。<\/p>\n<p>Bayes tree 把这些条件关系按 clique（团）组织起来。clique 不是地图中的一个房间，也不是普通轨迹节点，而是一组已经消元的变量，以及这些变量仍依赖的分隔变量。树的形状由因子连接关系和变量消元顺序共同决定。<\/p>\n<p>iSAM2 保存这棵树，相当于保存上一次线性化系统的稀疏分解结果。新因子到来后，它大致执行：<\/p>\n<pre class=\"code\"><code>1. 找到新因子连接的变量\n2. 在 Bayes tree 中找到受影响的 cliques\n3. 暂时取下受影响区域\n4. 加入新因子，对这部分重新排序、线性化和消元\n5. 把未受影响的子树接回去\n6. 回代得到更新后的状态<\/code><\/pre>\n<p>如果只在轨迹末尾加入：<\/p>\n<pre class=\"code\"><code>edge(x_3, x_4)<\/code><\/pre>\n<p>通常主要影响靠近新变量的树结构，前面许多已经计算好的条件关系可以复用。即使条件关系被复用，早期状态的数值仍可能在回代时变化；“不重新消元”不等于“状态数值永远不更新”。<\/p>\n<p>如果加入跨越很远的回环：<\/p>\n<pre class=\"code\"><code>edge(x_0, x_1000)<\/code><\/pre>\n<p>它同时连接很早和很晚的变量，两者相关路径上的较大区域可能都受影响。因此 iSAM2不是“每次只计算新增节点”，大回环仍可能带来明显耗时。<\/p>\n<p>iSAM2 的核心就是利用 Bayes tree 支持增量重排序和按需重新线性化，参见<a href=\"https://www.cs.cmu.edu/~kaess/pub/Kaess12ijrr.pdf\" target=\"_blank\" rel=\"noopener\">iSAM2 原论文<\/a>。<\/p><\/section>\n<section class=\"sec\" data-sec=\"4.2.9\"><h3 id=\"s4.2.9\"><span class=\"num\">4.2.9<\/span> 为什么还需要重新线性化？<\/h3>\n<p>若因子是非线性的，它在当前估计附近被近似为：<\/p>\n<pre class=\"code\"><code>r(x boxplus delta_x)\napproximately_equals\nr(x) + J * delta_x<\/code><\/pre>\n<p>当状态已经从原线性化点移动很远，旧的 J 就不再准确。批量 Gauss-Newton 通常每轮都对全部活动因子重新计算残差和雅可比。<\/p>\n<p>iSAM2 为节省计算，不一定在每次更新中重新线性化全部变量。它检查变量相对旧线性化点的变化，达到阈值的变量及相关部分才需要重新线性化。常见参数包括：<\/p>\n<pre class=\"code\"><code>relinearizeThreshold    变化超过多大才重新线性化\nrelinearizeSkip         每隔多少次 update 检查一次<\/code><\/pre>\n<p>阈值过小，结果更接近频繁批量重算，但计算量增加；阈值过大，速度更快，却可能长期使用已经不准确的雅可比。<\/p>\n<p>在线性高斯问题中，不存在非线性重线性化误差，增量求解与批量求解应得到同一个后验。在非线性问题中，二者可能因为线性化点、重线性化阈值、变量排序和停止条件不同而有少量差异。<\/p><\/section>\n<section class=\"sec\" data-sec=\"4.2.10\"><h3 id=\"s4.2.10\"><span class=\"num\">4.2.10<\/span> g2o 与 iSAM2 怎样处理同一个新回环？<\/h3>\n<p>假设系统已经有 1000 个关键帧，现在新增一个连接 <code>x_1000<\/code> 和 <code>x_20<\/code> 的回环。<\/p>\n<p>g2o 的典型批量流程是：<\/p>\n<pre class=\"code\"><code>把回环 Edge 加入已有 SparseOptimizer\n  -&gt; initializeOptimization\n  -&gt; 对活动图重新计算残差和雅可比\n  -&gt; 重新组装稀疏 H 和 g\n  -&gt; 求解并更新活动变量\n  -&gt; 继续若干轮非线性迭代<\/code><\/pre>\n<p>它仍会利用稀疏矩阵，只保存和计算实际存在的非零块；“批量”不等于使用稠密矩阵。<\/p>\n<p>iSAM2 的典型流程是：<\/p>\n<pre class=\"code\"><code>把新回环 Factor 交给 update\n  -&gt; 在 Bayes tree 中标记 x_1000、x_20 及受影响区域\n  -&gt; 只拆下需要重新处理的 cliques\n  -&gt; 将回环与相关旧因子一起重新消元\n  -&gt; 接回未受影响的子树\n  -&gt; 回代并按阈值重新线性化<\/code><\/pre>\n<p>因此 iSAM2 的优势是复用以前的分解结果，并不是使用了不同的残差函数。<\/p>\n<p>也不能绝对地说 g2o 只能离线。g2o 可以不断增加顶点和边，也可以只选择部分活动顶点；只是它最常见的接口和使用思路是通用批量图优化，而 iSAM2 从算法设计上就围绕持续到来的新变量和新因子组织计算。<\/p><\/section>\n<section class=\"sec\" data-sec=\"4.2.11\"><h3 id=\"s4.2.11\"><span class=\"num\">4.2.11<\/span> LIO-SAM 中 iSAM2 到底用在了哪里？<\/h3>\n<p>LIO-SAM 需要分清“激光局部匹配”和“因子图后端”。<\/p>\n<p>第一层，当前激光帧与局部地图匹配：<\/p>\n<pre class=\"code\"><code>点到线残差 + 点到面残差\n  -&gt; 在 mapOptmization.cpp 中做局部迭代\n  -&gt; 得到当前关键帧位姿<\/code><\/pre>\n<p>这里不是把每一个激光点直接交给 iSAM2。<\/p>\n<p>第二层，把局部匹配结果压缩成关键帧之间的相对位姿因子：<\/p>\n<pre class=\"code\"><code>LiDAR odometry factor\n  + GPS factor（可选）\n  + loop factor（检测到回环时）\n  -&gt; 交给长期 ISAM2 位姿图<\/code><\/pre>\n<p>当新回环到来时，iSAM2 可以修改多个历史关键帧，所以全局轨迹和地图能够被拉回一致。<\/p>\n<p>此外，<code>imuPreintegration.cpp<\/code> 中还有一个服务于高频惯性状态估计的 ISAM2 图，它处理：<\/p>\n<pre class=\"code\"><code>pose\nvelocity\nIMU bias\nIMU preintegration factor\nLiDAR pose correction factor<\/code><\/pre>\n<p>所以 LIO-SAM 不是把所有数据放进一张图，而是在局部激光匹配、长期位姿图和 IMU预积分图之间分层处理。具体实现可参考：<\/p>\n<ul><li><a href=\"https://github.com/TixiaoShan/LIO-SAM/blob/master/src/mapOptmization.cpp\" target=\"_blank\" rel=\"noopener\">LIO-SAM <code>mapOptmization.cpp<\/code><\/a><\/li><li><a href=\"https://github.com/TixiaoShan/LIO-SAM/blob/master/src/imuPreintegration.cpp\" target=\"_blank\" rel=\"noopener\">LIO-SAM <code>imuPreintegration.cpp<\/code><\/a><\/li><\/ul><\/section>\n<section class=\"sec\" data-sec=\"4.2.12\"><h3 id=\"s4.2.12\"><span class=\"num\">4.2.12<\/span> 最后怎样选择？<\/h3>\n<div class=\"tbl\"><table><thead><tr><th>问题<\/th><th>g2o 的典型批量用法<\/th><th>GTSAM iSAM2<\/th><\/tr><\/thead><tbody><tr><td>数学目标<\/td><td>稀疏非线性最小二乘 / MAP<\/td><td>同样的稀疏非线性最小二乘 / MAP<\/td><\/tr><tr><td>基本对象<\/td><td>Vertex、Edge、Information<\/td><td>Key、Values、Factor、NoiseModel<\/td><\/tr><tr><td>新测量到来<\/td><td>加入图后再次优化活动图<\/td><td>向 <code>update()<\/code> 提交新因子和新变量初值<\/td><\/tr><tr><td>历史计算复用<\/td><td>取决于求解器和工程组织；典型批量流程较少复用非线性求解过程<\/td><td>Bayes tree 明确保留已有分解结构<\/td><\/tr><tr><td>重线性化<\/td><td>批量迭代通常处理全部活动因子<\/td><td>根据阈值和受影响区域选择性处理<\/td><\/tr><tr><td>大回环<\/td><td>重新优化活动图<\/td><td>可能影响较大树区域，也会变慢<\/td><\/tr><tr><td>常见适用方式<\/td><td>批量位姿图、BA、已有 Vertex/Edge 系统<\/td><td>在线关键帧、持续增加因子、增量平滑<\/td><\/tr><\/tbody><\/table><\/div>\n<p>系统每隔几秒才进行一次小规模位姿图优化时，g2o 的批量方式通常已经足够直接。关键帧和传感器因子持续到来，并希望频繁更新整条轨迹时，iSAM2 的增量结构更合适。<\/p>\n<p>无论使用哪一种，都必须正确处理：<\/p>\n<ul><li>测量模型和坐标系方向；<\/li><li>每条边或因子的协方差；<\/li><li>非线性优化初值；<\/li><li>错误数据关联和假回环；<\/li><li>未固定参考系造成的自由度；<\/li><li>重复使用同一传感器信息造成的相关性。<\/li><\/ul>\n<p>官方资料：<\/p>\n<ul><li><a href=\"https://github.com/RainerKuemmerle/g2o/blob/master/doc/g2o.tex\" target=\"_blank\" rel=\"noopener\">g2o 框架文档<\/a><\/li><li><a href=\"https://github.com/RainerKuemmerle/g2o/blob/master/g2o/examples/tutorial_slam2d/tutorial_slam2d.cpp\" target=\"_blank\" rel=\"noopener\">g2o 官方二维 SLAM 示例<\/a><\/li><li><a href=\"https://gtsam.org/tutorials/intro.html\" target=\"_blank\" rel=\"noopener\">GTSAM 因子图入门<\/a><\/li><li><a href=\"https://borglab.github.io/gtsam/isam2/\" target=\"_blank\" rel=\"noopener\">GTSAM iSAM2 官方文档<\/a><\/li><li><a href=\"https://www.cs.cmu.edu/~kaess/pub/Kaess12ijrr.pdf\" target=\"_blank\" rel=\"noopener\">iSAM2 原论文<\/a><\/li><\/ul><\/section>\n<section class=\"sec\" data-sec=\"4.2.13\"><h3 id=\"s4.2.13\"><span class=\"num\">4.2.13<\/span> 本章面试题与参考答案<\/h3>\n<p>（先自己作答，再对照答案；答案后括号注明对应小节。）<\/p>\n<h4>题目<\/h4>\n<ol><li value=\"1\">面试官问“g2o 和 iSAM2 有什么区别”，这个问题本身有什么不严谨之处？二者会不会求出不同的答案？<\/li><li value=\"2\">从概率因子图出发，推导出图优化每轮要解的线性方程 <code>H_GN*delta_X = -g<\/code>。为什么代码里的 H 通常叫“近似 Hessian”？<\/li><li value=\"3\">一维位姿图：<code>x_0=0<\/code> 固定，三条里程计 1.1、1.0、1.1 m（sigma=0.1 m），回环 <code>x_3-x_0=3.0 m<\/code>（sigma=0.05 m）。求优化后的 <code>x_1、x_2、x_3<\/code>，并解释为什么 <code>x_3<\/code> 不等于 3.0 m。<\/li><li value=\"4\">追问：同一题中把回环标准差改成 0.5 m，<code>x_3<\/code> 变成多少？这说明了什么？<\/li><li value=\"5\">追问：若初值直接取里程计积分 <code>(1.1, 2.1, 3.2)<\/code>，写出这一点处的梯度 g，并说明一次 Gauss-Newton 步能否到达最优。<\/li><li value=\"6\">为什么 H 和 g 可以逐条边 <code>+=<\/code> 累加？一条连接 <code>x_i、x_j<\/code> 的二元边会改动全局 H 的哪些块？“稀疏”和 fill-in 分别指什么？<\/li><li value=\"7\">陷阱题：正规方程写成 <code>H*X=b<\/code> 和 <code>H*delta_X=-g<\/code>，b 和 g 是同一个向量吗？<\/li><li value=\"8\">为什么位姿图必须固定第一个位姿或加先验？不固定会出现什么数学现象？<\/li><li value=\"9\">二维例子中轮速 y 方向 sigma=0.30 m、激光 sigma=0.05 m，它们对 Hessian 的贡献差多少倍？如果某方向几何上不可观，能否靠把噪声设小来“补救”？<\/li><li value=\"10\">工程题：RTK 只测 x、y，你会怎样建因子？如果激光里程计内部已经融合了轮速，再把两者都作为独立因子加入会有什么问题？<\/li><li value=\"11\">一维例子一次线性求解就结束，为什么真实 Pose2/Pose3 位姿图要多次迭代？写出 Pose2 相对位姿残差。<\/li><li value=\"12\">iSAM2 中新到一个回环，<code>update()<\/code> 的 new_factors 和 new_values 分别放什么？RTK 只连接最新的 <code>X_2<\/code>，为什么 <code>X_1<\/code> 的估计也会变？<\/li><li value=\"13\">Bayes tree 保存的是什么？“iSAM2 每次只计算新节点”这个说法错在哪里？<\/li><li value=\"14\">iSAM2 的 <code>relinearizeThreshold<\/code> 调大、调小各有什么后果？什么条件下增量结果和批量结果严格相同？<\/li><li value=\"15\">LIO-SAM 里 iSAM2 用在哪几处？工程上什么时候选 g2o 批量优化，什么时候选 iSAM2？<\/li><\/ol>\n<h4>参考答案<\/h4>\n<p><strong>1. g2o 与 iSAM2 的比较为什么不严谨？<\/strong><\/p>\n<p>两者不在同一层级：g2o 是通用图优化软件框架，iSAM2 是增量平滑算法，GTSAM 才是与 g2o 同层的因子图库。严谨的比较是“g2o 与 GTSAM”（软件库），或“g2o 典型批量 GN/LM 与 GTSAM 中的 iSAM2 增量优化”（求解方式）。<\/p>\n<p>只要状态、测量、残差、协方差、鲁棒核和初值相同，二者面对的是同一个 MAP / 非线性最小二乘问题，应收敛到同一个局部最优；区别在于新测量不断到来时，怎样组织和复用以前的计算。（见 4.2.1、4.2.2、4.2.6.8）<\/p>\n<p>**2. 从因子图推导 <code>H_GN*delta_X = -g<\/code><strong><\/strong><\/p>\n<pre class=\"code\"><code>p(X | Z) proportional_to prior(X) * product_over_i phi_i(X_i)\n高斯噪声取负对数：F(X) = 0.5 * sum_i r_i^T*Omega_i*r_i\n一阶展开：r_i(X boxplus delta_X) approximately_equals r_i + J_i*delta_X\n代入并求和：F approximately_equals const + g^T*delta_X + 0.5*delta_X^T*H_GN*delta_X\ng    = sum_i J_i^T*Omega_i*r_i\nH_GN = sum_i J_i^T*Omega_i*J_i\n对 delta_X 求导令其为 0：H_GN*delta_X = -g<\/code><\/pre>\n<p>叫“近似”是因为真 Hessian 还包含与 <code>r_i*second_derivative(r_i)<\/code> 有关的项，Gauss-Newton 把它忽略了。残差线性时二阶导为 0，<code>H_GN<\/code> 就是真 Hessian；接近最优、残差较小时近似也较好；初值差、非线性强时由 LM 增加阻尼让更新更保守。（见 4.2.2、4.2.5.1）<\/p>\n<p><strong>3. 一维回环手算<\/strong><\/p>\n<p>令三段各修正同一个量 c（等权时平方误差倾向平均分摊）：<\/p>\n<pre class=\"code\"><code>r_01 = r_12 = r_23 = c,   r_loop = 0.2 + 3*c\nF(c) = 0.5 * [3*c^2/0.01 + (0.2+3*c)^2/0.0025]\ndF/dc = 300*c + 1200*(0.2+3*c) = 0  -&gt;  c = -240/3900 approximately_equals -0.06154\nx_1 = 1.03846,  x_2 = 1.97692,  x_3 = 3.01538  (m)<\/code><\/pre>\n<p>回环也有噪声，不是绝对真值。0.2 m 的冲突按信息量分摊：三条里程计各退 0.0615 m，回环自己留下约 0.0154 m 残差。决定结果的是残差与协方差形成的加权代价，而不是边的名字。（见 4.2.3、4.2.4）<\/p>\n<p><strong>4. 追问：回环 sigma 改为 0.5 m<\/strong><\/p>\n<p>回环信息量从 400 降到 4：<\/p>\n<pre class=\"code\"><code>dF/dc = 300*c + 3*4*(0.2+3*c) = 336*c + 2.4 = 0\nc approximately_equals -0.00714\nx_3 = 3.2 + 3*c approximately_equals 3.1786 m<\/code><\/pre>\n<p>结果明显靠近里程计累计的 3.2 m。说明协方差设置直接决定“谁听谁的”：回环协方差给得过小，会让一个不太准的回环强行拉动整条轨迹；给得过大，正确回环又拉不动。（见 4.2.4）<\/p>\n<p><strong>5. 追问：从里程计初值做一步 Gauss-Newton<\/strong><\/p>\n<p>在 <code>(1.1, 2.1, 3.2)<\/code> 处三条里程计残差都为 0，只有回环残差 <code>r_loop = 0.2<\/code>，其雅可比只在 <code>x_3<\/code> 列为 1：<\/p>\n<pre class=\"code\"><code>g = [0, 0, 400*0.2]^T = [0, 0, 80]^T\nH 与 6.5.2 相同：[[200,-100,0],[-100,200,-100],[0,-100,500]]\ndelta_X = -H^-1*g approximately_equals [-0.0615, -0.1231, -0.1846]^T\nX_new approximately_equals [1.0385, 1.9769, 3.0154]^T<\/code><\/pre>\n<p>因为残差是线性的，J 不随状态变化，一步即到最优，与 6.4 结果相同。梯度只在 <code>x_3<\/code> 非零，但 H 的非对角耦合把修正传播到了 <code>x_1、x_2<\/code>。（见 4.2.5.1、4.2.5.2）<\/p>\n<p><strong>6. 逐因子累加、二元边影响的块、稀疏与 fill-in<\/strong><\/p>\n<p>总代价是各因子代价之和（条件独立时似然相乘，取负对数变加法），二次近似也是各项之和，所以 <code>g<\/code>、<code>H_GN<\/code> 天然是逐因子贡献之和，程序就逐边执行 <code>H += J_i^T*Omega_i*J_i<\/code>、<code>g += J_i^T*Omega_i*r_i<\/code>。<\/p>\n<p>二元边的全局雅可比除 i、j 两列块外全为 0，只改 H 的四个块和 g 的两个块：<\/p>\n<pre class=\"code\"><code>H_ii += J_i^T*Omega*J_i    H_ij += J_i^T*Omega*J_j\nH_ji += J_j^T*Omega*J_i    H_jj += J_j^T*Omega*J_j\ng_i  += J_i^T*Omega*r      g_j  += J_j^T*Omega*r<\/code><\/pre>\n<p>一元因子（如 RTK）只改对角块。“稀疏”指全局大矩阵的多数块根本不存在（为 0），不是数字小；<code>x_0<\/code> 与 <code>x_1000<\/code> 之间只有加了回环才出现非零非对角块。fill-in 是 Cholesky/消元时产生的新非零块，数量受变量排序影响。（见 4.2.5.1）<\/p>\n<p><strong>7. 陷阱：b 和 g 是不是同一个向量？<\/strong><\/p>\n<p>不是。对线性残差 <code>r = A*X - z<\/code>：<\/p>\n<pre class=\"code\"><code>g = A^T*Omega*(A*X - z) = H*X - b\nb = A^T*Omega*z<\/code><\/pre>\n<p><code>H*X = b<\/code> 是线性问题直接求绝对状态的写法；<code>H*delta_X = -g<\/code> 是在当前 X 附近求增量，右侧 <code>-g = b - H*X<\/code>。两者是同一个正规方程的不同写法，把 b 当成 g 会得到完全错误的增量。非线性位姿图只能用增量形式反复线性化。（见 4.2.5.2）<\/p>\n<p><strong>8. 为什么要固定首位姿？<\/strong><\/p>\n<p>相对位姿残差对整体平移（二维/三维还有整体旋转）不变：所有位置同时加 10 m，残差完全不变。这叫规范（gauge）自由度。数学上表现为 H 奇异：一维例子若不固定 <code>x_0<\/code>，4 个变量的 H 秩只有 3，零空间就是“整体平移”方向，线性求解失败或结果随意漂。<\/p>\n<p>解决办法：g2o 中把首顶点 <code>fixed=true<\/code>，GTSAM 中加标准差很小的 <code>PriorFactor<\/code>；有 RTK 等绝对因子时它们也能锚定全局参考。（见 4.2.5、4.2.6.1、4.2.7.1）<\/p>\n<p><strong>9. 信息量倍数与不可观方向<\/strong><\/p>\n<pre class=\"code\"><code>轮速 y：1/0.30^2 approximately_equals 11.111\n激光 y：1/0.05^2 = 400\n400 / 11.111 = 36<\/code><\/pre>\n<p>几何雅可比相同时，激光对 Hessian 的贡献是轮速的 36 倍；Hessian 累加的是“以标准差为单位的灵敏度平方” <code>J_white^T*J_white<\/code>。<\/p>\n<p>但若某方向满足 <code>J_i*v = 0<\/code>（几何上该因子对这个方向完全不敏感），<code>J^T*Omega*J<\/code> 在 v 方向仍为 0，噪声设得再小也造不出信息。退化走廊里沿轴向不可观，只能靠其他传感器（如轮速、IMU）在该方向提供约束，而不是把激光协方差调小。（见 4.2.6.6）<\/p>\n<p><strong>10. RTK 因子建模与重复计信息<\/strong><\/p>\n<p>RTK 只测位置，就用只返回二维（或三维）位置残差的一元因子，信息矩阵 2x2；不能为了凑成 Pose2 虚构一个很精确的 yaw，否则会凭空给航向加约束。三维系统还要处理天线杆臂，并先做坐标系、时间、RTK 解状态和几何一致性检查。<\/p>\n<p>若激光里程计内部已融合同一份轮速，再把两者当条件独立因子加入，同一信息被计两次，协方差被低估、系统过度自信。应建模交叉相关，或只加入未重复的那部分信息。（见 4.2.6.1、4.2.6.7、4.2.6.8）<\/p>\n<p><strong>11. 为什么 Pose2/Pose3 要多次迭代？<\/strong><\/p>\n<pre class=\"code\"><code>e_i_j = Log(Z_i_j^-1 * T_i^-1 * T_j)\n展开为：\nr_i_j = [ R(theta_i)^T*(p_j - p_i) - delta_p_measured\n          wrap(theta_j - theta_i - delta_theta_measured) ]<\/code><\/pre>\n<p><code>R(theta_i)<\/code> 含 <code>sin<\/code>、<code>cos<\/code>，残差对状态非线性，J 随 yaw 变化，位置与航向不能永久拆开求。每轮要在当前估计处重新计算残差和雅可比，求 <code>(J^T*Omega*J)*delta_X = -J^T*Omega*r<\/code>，再在 SE(2) 流形上 <code>boxplus<\/code> 更新，直到增量或代价变化足够小。角度还要 wrap，避免 2*pi 跳变造成巨大假残差。（见 4.2.6、4.2.6.5）<\/p>\n<p><strong>12. iSAM2 加回环时提交什么？RTK 为何改到 <code>X_1<\/code>？<\/strong><\/p>\n<p>回环连接的变量都已存在，所以只提交因子，不提交变量：<\/p>\n<pre class=\"code\"><code>new_factors = [BetweenFactor(X_0, X_2, loop)]\nnew_values  = []<\/code><\/pre>\n<p>常见错误是把已存在的 Key 再放进 new_values（会报重复键），或给新变量忘了给初值。<\/p>\n<p>RTK 只连 <code>X_2<\/code>，但相邻里程计因子使 <code>X_1、X_2<\/code> 相关；联合求解后信息沿因子传回 <code>X_1<\/code>。例子中 RTK 到达后 <code>p_1<\/code> 从 <code>(1.02000, 0.04865)<\/code> 变为 <code>(1.02057, 0.04834)<\/code>。这与 KF 中“只测位置也能经交叉协方差修正速度”是同一现象。每次 <code>update()<\/code> 都是在全部旧因子加新因子定义的目标下更新后验，不是用新测量覆盖状态。（见 4.2.7、4.2.7.2）<\/p>\n<p><strong>13. Bayes tree 保存什么？“只算新节点”错在哪里？<\/strong><\/p>\n<p>按顺序消元时，联合分布被分解为条件密度的乘积：<\/p>\n<pre class=\"code\"><code>p(x_0,x_1,x_2,x_3 | Z) = p(x_0|x_1) * p(x_1|x_2) * p(x_2|x_3) * p(x_3)<\/code><\/pre>\n<p>这是稀疏 QR/Cholesky 分解的概率解释。Bayes tree 把这些条件关系按 clique（已消元变量加其分隔变量）组织成树，相当于保存上一次线性化系统的分解结果。<\/p>\n<p>新因子到来时，iSAM2 找到受影响的 cliques、拆下、与相关旧因子一起重新排序/线性化/消元，再接回未受影响子树并回代。所以要区分“重新消元的区域”与“回代后数值变化的变量”：前者可以是局部的，后者可沿条件关系传到很早的状态。像 <code>edge(x_0, x_1000)<\/code> 这种跨度大的回环会波及大片树区域，单次更新仍可能明显耗时。（见 4.2.7.3、4.2.8）<\/p>\n<p><strong>14. 重线性化阈值与增量/批量一致性<\/strong><\/p>\n<p>iSAM2 不是每次都重线性化全部变量，只对相对旧线性化点变化超过 <code>relinearizeThreshold<\/code> 的变量及相关部分处理，<code>relinearizeSkip<\/code> 控制多久检查一次。<\/p>\n<pre class=\"code\"><code>阈值过小：接近频繁批量重算，结果准但计算量大\n阈值过大：更快，但可能长期使用不准确的雅可比<\/code><\/pre>\n<p>线性高斯问题不存在重线性化误差，增量与批量得到同一个后验（6.7.1 的一维例子 update 5 后正是 g2o 的解）。非线性问题中，两者可能因线性化点、阈值、变量排序和停止条件不同而有少量差异。（见 4.2.9、4.2.7.1）<\/p>\n<p><strong>15. LIO-SAM 中的 iSAM2 与工程选型<\/strong><\/p>\n<p>LIO-SAM 分层：<code>mapOptmization.cpp<\/code> 里当前帧对局部地图做点到线/点到面的局部迭代匹配，这一步不进 iSAM2；匹配结果压缩为关键帧间的 LiDAR odometry 因子，加上可选 GPS 因子和回环因子送入长期 ISAM2 位姿图；<code>imuPreintegration.cpp<\/code> 另有一张服务高频惯性估计的 ISAM2 图，处理 pose、velocity、IMU bias、预积分因子和 LiDAR 位姿修正因子。<\/p>\n<p>选型：每隔几秒做一次小规模位姿图优化、或已有 Vertex/Edge 系统、做 BA，g2o 批量方式足够直接；关键帧和传感器因子持续到来、希望频繁更新整条轨迹时，iSAM2 的增量结构更合适。无论哪种，测量模型与坐标系、协方差、初值、假回环（鲁棒核）、规范自由度和重复信息都必须正确处理，这些比换库影响更大。（见 4.2.10、4.2.11、4.2.12）<\/p>\n<hr><\/section>", "sections": [{"id": "4.2.1", "title": "先纠正一个容易混淆的比较"}, {"id": "4.2.2", "title": "为什么它们底层在解同一个问题？"}, {"id": "4.2.3", "title": "建立一个可以手算的位姿图"}, {"id": "4.2.4", "title": "一步一步算出加入回环后的结果"}, {"id": "4.2.5", "title": "g2o 怎样表达并求解这个例子？"}, {"id": "4.2.6", "title": "二维位姿边比一维例子多了什么？"}, {"id": "4.2.7", "title": "iSAM2 怎样表达同一个例子？"}, {"id": "4.2.8", "title": "Bayes tree 到底保存了什么？"}, {"id": "4.2.9", "title": "为什么还需要重新线性化？"}, {"id": "4.2.10", "title": "g2o 与 iSAM2 怎样处理同一个新回环？"}, {"id": "4.2.11", "title": "LIO-SAM 中 iSAM2 到底用在了哪里？"}, {"id": "4.2.12", "title": "最后怎样选择？"}, {"id": "4.2.13", "title": "本章面试题与参考答案"}]}, {"num": "4.3", "title": "滤波与图优化：关系、取舍与组合", "html": "<section class=\"sec\" data-sec=\"4.3.0\"><div class=\"callout tip\"><strong>为什么现在学这一章<\/strong>：把前两章并起来看：两者在求同一个后验，区别在于历史信息怎样保存、能否重新线性化。原第 29 章“定位建图分开时怎么选”“滤波与优化的优劣”也合并到这里。<\/div>\n<p>本章回答原文的“问题五”：卡尔曼滤波和图优化有什么区别？原理一致吗？第 4.1 章推导了滤波，第 4.2 章推导了图优化，现在把两条线并起来看。<\/p><\/section>\n<section class=\"sec\" data-sec=\"4.3.1\"><h3 id=\"s4.3.1\"><span class=\"num\">4.3.1<\/span> 一句话回答<\/h3>\n<p>两者都在求“给定测量后的状态后验”。卡尔曼滤波通常把历史信息压缩成当前状态的均值和协方差；图优化通常保留一段或全部历史状态联合求解。在线性高斯、模型和数据完全相同时，KF（Kalman Filter，卡尔曼滤波）当前状态结果与完整图的当前边缘结果等价；非线性时，因为线性化和边缘化策略不同，结果通常不完全相同。<\/p>\n<p>本章的顺序是：先看图优化在做什么（7.2），再看二者为什么等价（7.3）、“消去旧状态”在代数上是什么（7.4）、非线性时为什么分岔（7.5），最后看工程上怎样组合（7.6）。<\/p><\/section>\n<section class=\"sec\" data-sec=\"4.3.2\"><h3 id=\"s4.3.2\"><span class=\"num\">4.3.2<\/span> 图优化在做什么？<\/h3>\n<p>图优化保留状态序列：<\/p>\n<pre class=\"code\"><code>X = [x_0, x_1, ..., x_k]<\/code><\/pre>\n<p>根据马尔可夫假设，后验可分解为：<\/p>\n<pre class=\"code\"><code>p(X | Z)\nproportional_to\np(x_0)\n* ∏_i p(x_i | x_(i-1), u_i)\n* ∏_j p(z_j | X_j)<\/code><\/pre>\n<p>这里 <code>X_j<\/code> 表示第 j 个测量所连接的那一小组状态：普通定位观测可能只连接 <code>x_i<\/code>，回环则通常同时连接两个历史位姿。<\/p>\n<p>取负对数并假设高斯噪声，就得到：<\/p>\n<pre class=\"code\"><code>总目标\n= 初始状态先验残差\n  + 所有相邻状态的运动残差\n  + 所有传感器测量残差\n  + 所有回环残差<\/code><\/pre>\n<p>图中的变量节点是 <code>x_i<\/code>，因子就是上面每一项概率约束。最小化总代价，就是寻找整段轨迹的 MAP 解。<\/p><\/section>\n<section class=\"sec\" data-sec=\"4.3.3\"><h3 id=\"s4.3.3\"><span class=\"num\">4.3.3<\/span> 为什么说线性高斯条件下二者等价？<\/h3>\n<p>第 4.1.3 节已经表明，一次 KF 更新就是在最小化：<\/p>\n<pre class=\"code\"><code>先验平方残差 + 当前测量平方残差<\/code><\/pre>\n<p>卡尔曼滤波每到一个时刻，就把旧状态消去，只保留它对当前状态形成的高斯先验。批量图则暂时保留所有状态，最后联合求解。在线性高斯条件下，变量消元是精确的，不同计算顺序不会改变最终高斯分布，因此：<\/p>\n<pre class=\"code\"><code>标准 KF 在 k 时刻的当前后验\n= 只使用截至 k 时刻测量的完整线性因子图中，x_k 的边缘后验<\/code><\/pre>\n<p>需要注意：完整图优化对应“平滑”，会利用未来测量修正历史状态；普通 KF 只输出当前过滤结果。比较同一个时刻时，必须说明是过滤结果还是平滑结果。<\/p>\n<figure class=\"anim\"><div class=\"player\"><video src=\"vid/kf_vs_graph.mp4\" poster=\"vid/kf_vs_graph.jpg\" muted loop playsinline preload=\"none\" aria-label=\"动画 21：同一组数据：KF 只能改当前 x3，图优化让整条轨迹回弹；两者 x3 的均值和方差完全一样\"><\/video><\/div><figcaption><span class=\"badge\">动画 21<\/span>同一组数据：KF 只能改当前 x3，图优化让整条轨迹回弹；两者 x3 的均值和方差完全一样<\/figcaption><\/figure><\/section>\n<section class=\"sec\" data-sec=\"4.3.4\"><h3 id=\"s4.3.4\"><span class=\"num\">4.3.4<\/span> Schur 补为什么代表“消去旧状态”？<\/h3>\n<p>把正规方程写成 <code>H*delta = eta<\/code>，其中 <code>eta = -g<\/code>。再分成准备删除的旧变量 a 和需要保留的变量 b：<\/p>\n<pre class=\"code\"><code>[H_aa  H_ab] [delta_a] = [eta_a]\n[H_ba  H_bb] [delta_b]   [eta_b]<\/code><\/pre>\n<p>第一行给出：<\/p>\n<pre class=\"code\"><code>delta_a = H_aa^-1 * (eta_a - H_ab * delta_b)<\/code><\/pre>\n<p>代入第二行：<\/p>\n<pre class=\"code\"><code>(H_bb - H_ba * H_aa^-1 * H_ab) * delta_b\n= eta_b - H_ba * H_aa^-1 * eta_a<\/code><\/pre>\n<p>括号中的新矩阵就是 Schur 补。旧变量虽然被删除，它对 b 的约束已经被压缩进新的信息矩阵和信息向量。卡尔曼递推和滑动窗口边缘化都可以从这个角度理解。<\/p>\n<p>代码中同样不应显式计算 <code>H_aa^-1<\/code>，而应通过线性求解完成这些乘积。<\/p><\/section>\n<section class=\"sec\" data-sec=\"4.3.5\"><h3 id=\"s4.3.5\"><span class=\"num\">4.3.5<\/span> 非线性时为什么不再完全相同？<\/h3>\n<p>EKF（Extended Kalman Filter，扩展卡尔曼滤波）通常在当前预测点线性化一次，然后把结果压缩进均值和协方差；旧的非线性测量删除后，无法在新的历史轨迹上重新计算雅可比。<\/p>\n<p>全图或固定窗口优化会保留活动范围内的原始非线性因子，可以：<\/p>\n<pre class=\"code\"><code>线性化 -&gt; 求增量 -&gt; 更新状态 -&gt; 再线性化<\/code><\/pre>\n<p>因此大回环到来后，图优化更适合重新调整历史轨迹。但它也需要好初值，也会受到假回环、局部最优和固定窗口边缘化线性化点的影响。<\/p><\/section>\n<section class=\"sec\" data-sec=\"4.3.6\"><h3 id=\"s4.3.6\"><span class=\"num\">4.3.6<\/span> 工程上为什么常把两者组合？<\/h3>\n<pre class=\"code\"><code>IMU / 轮速 ──&gt; 高频 ESKF ──&gt; 连续 odom -&gt; base_link\n                         \\\n激光 / GNSS / 回环 ───────&gt; 低频因子图 ──&gt; map -&gt; odom 修正<\/code><\/pre>\n<p>ESKF 是误差状态卡尔曼滤波：名义状态负责表示当前位姿、速度等物理量，卡尔曼滤波主要估计名义状态附近的小误差。它特别适合高频 IMU 传播。<\/p>\n<p>在 ROS 坐标系约定中，<code>base_link<\/code> 通常表示机器人本体，<code>odom<\/code> 是连续但会漂移的局部坐标系，<code>map<\/code> 是经过全局定位或回环修正的地图坐标系。因此全局修正常放在<code>map -&gt; odom<\/code>，避免直接让控制所用的局部轨迹发生跳变。<\/p>\n<p>这套组合利用 ESKF 承担高频、低延迟传播，用因子图处理关键帧、多传感器和全局回环。<\/p>\n<p>最重要的陷阱是重复计算同一信息。例如 ESKF 已融合某帧激光，又把 ESKF 输出和同一激光同时作为独立因子加入图，会低估协方差并造成系统过度自信。<\/p><\/section>\n<section class=\"sec\" data-sec=\"4.3.7\"><h3 id=\"s4.3.7\"><span class=\"num\">4.3.7<\/span> 滤波法和优化法有什么区别？各自优劣是什么？<\/h3>\n<p>第 4.3 章已经说明了线性高斯条件下二者等价，以及非线性时为什么分岔。这里从选型角度总结。<\/p>\n<h4 id=\"s4.3.7.1\"><span class=\"num\">4.3.7.1<\/span> 本质区别：马尔可夫假设和线性化次数<\/h4>\n<ul><li><strong>滤波<\/strong>（EKF、ESKF、IEKF、MSCKF、UKF、粒子滤波）：只估计当前状态<code>p(x_k | z_1:k)<\/code>，历史状态被边缘化掉；每个测量在到达时线性化一次，之后其信息固化在协方差中，不能再根据更好的估计重新线性化。<\/li><li><strong>优化<\/strong>（BA、PGO、滑动窗口、因子图平滑）：估计一段或全部轨迹的 MAP <code>p(x_0:k | z_1:k)<\/code>，残差可以反复重新线性化。<\/li><\/ul>\n<p>统一视角：<\/p>\n<pre class=\"code\"><code>IEKF            ≈ 对“先验 + 当前测量”做 GN       窗口大小为 1 的优化\n滑窗 + 边缘化   = 固定滞后平滑                   窗口大小为 N\n全量 BA、iSAM2  = 完全平滑<\/code><\/pre>\n<p>滤波是优化的特例，滑动窗口优化介于两者之间。<\/p>\n<h4 id=\"s4.3.7.2\"><span class=\"num\">4.3.7.2<\/span> 优劣对比<\/h4>\n<div class=\"tbl\"><table><thead><tr><th>维度<\/th><th>滤波<\/th><th>优化<\/th><\/tr><\/thead><tbody><tr><td>精度<\/td><td>线性化误差累积，强非线性下较差<\/td><td>反复重线性化，精度更高；Strasdat 等 2010 年的“Why filter?”指出同等算力下 BA 更优<\/td><\/tr><tr><td>计算量<\/td><td>低且恒定；EKF-SLAM 带路标时为平方级；MSCKF 把特征移出状态<\/td><td>较高，但可利用稀疏性，滑窗可控<\/td><\/tr><tr><td>延迟和频率<\/td><td>低延迟，可高频输出<\/td><td>求解有延迟，常需配合 IMU 预测输出高频位姿<\/td><\/tr><tr><td>一致性<\/td><td>EKF 存在可观性不一致：不可观方向被错误地“变可观”，协方差过度自信；需要 FEJ、OC-EKF 或不变 EKF 修正<\/td><td>全量优化无此问题；滑窗边缘化同样需要 FEJ（见 4.5.2）<\/td><\/tr><tr><td>外点处理<\/td><td>融合了错误测量就无法撤回<\/td><td>鲁棒核、可撤销因子、GNC、开关约束（见 8.3.2）<\/td><\/tr><tr><td>回环和全局一致<\/td><td>困难，历史已被边缘化<\/td><td>天然支持 PGO 和全局 BA<\/td><\/tr><tr><td>延迟和乱序测量<\/td><td>需要状态回溯和重新传播<\/td><td>因子图中直接插入对应时刻的因子<\/td><\/tr><tr><td>不确定度输出<\/td><td>协方差直接可得<\/td><td>需额外计算边缘协方差（<code>H<\/code> 逆的对角块），代价较高（见 3.3.2 节）<\/td><\/tr><tr><td>实现与调参<\/td><td>相对简单，参数含义直观<\/td><td>复杂：边缘化、因子设计、求解器配置<\/td><\/tr><\/tbody><\/table><\/div>\n<h4 id=\"s4.3.7.3\"><span class=\"num\">4.3.7.3<\/span> 典型系统和选型原则<\/h4>\n<pre class=\"code\"><code>滤波：MSCKF/OpenVINS、ROVIO、FAST-LIO2、Point-LIO、Super-LIO、AMCL\n优化：ORB-SLAM、VINS-Mono/Fusion、OKVIS、DSO、LIO-SAM、Cartographer 后端\n混合：前端滤波保证实时 + 后端图优化负责回环和全局一致，例如 FAST-LIO2 + PGO 后端<\/code><\/pre>\n<ul><li>资源受限、高频实时、不需要回环：滤波，IESKF 已足够好，FAST-LIO 系列就是证明；<\/li><li>需要高精度、回环、全局一致、多传感器异步：优化，滑窗前端 + 图优化后端；<\/li><li>实际系统几乎都是“前端滤波或滑窗 + 后端图优化”。“滤波还是优化”更多是时间尺度上的分工，而不是二选一（见 4.3.6 节）。<\/li><\/ul><\/section>\n<section class=\"sec\" data-sec=\"4.3.8\"><h3 id=\"s4.3.8\"><span class=\"num\">4.3.8<\/span> 定位和建图如果分开优化，选图优化还是滤波？<\/h3>\n<h4 id=\"s4.3.8.1\"><span class=\"num\">4.3.8.1<\/span> 分开以后，两个问题的性质变了<\/h4>\n<ul><li><strong>建图<\/strong>：离线或在后台运行，要求全局一致（回环、多会话融合），变量多，可以接受延迟。图优化（PGO、BA，批量或 iSAM2）是不二之选：能重新线性化、能撤销错误回环、能处理大量约束。<\/li><li><strong>在已知地图中定位<\/strong>：地图固定，不再是状态变量。滤波在 SLAM 中的主要缺陷——状态随路标增长、路标与位姿的相关性难维护、线性化误差长期累积——大部分消失了；状态维度恒定（位姿、速度、bias），问题变成马尔可夫、维度固定、实时性要求高的状态估计。<\/li><\/ul>\n<h4 id=\"s4.3.8.2\"><span class=\"num\">4.3.8.2<\/span> 定位端怎样选？<\/h4>\n<div class=\"tbl\"><table><thead><tr><th>方案<\/th><th>适用场景<\/th><\/tr><\/thead><tbody><tr><td>ESKF 或 IEKF：配准结果作测量，IMU 预测<\/td><td>首选：计算量小、延迟低、可按 IMU 频率输出；IEKF 迭代能处理配准的非线性<\/td><\/tr><tr><td>粒子滤波（AMCL 等，见第 4.4 章）<\/td><td>2D 栅格地图，需要全局定位和绑架恢复，后验多峰<\/td><\/tr><tr><td>固定滞后平滑（滑动窗口优化）<\/td><td>多传感器、测量有延迟和乱序（GNSS 迟到、视觉处理慢），或需要更强的外点处理和重线性化<\/td><\/tr><\/tbody><\/table><\/div>\n<p>推荐回答：<strong>建图用图优化，定位以滤波（ESKF/IEKF）为主<\/strong>；传感器多、存在延迟或乱序测量、需要鲁棒处理配准偶发失败时，定位端用小窗口的固定滞后平滑。理由有三点：<\/p>\n<ol><li value=\"1\">地图固定后，滤波“只线性化一次、不一致”的缺陷被大大削弱，而它在计算量和延迟上优势明显；<\/li><li value=\"2\">配准本身已经是“当前帧对地图做优化”，外层再套一层图优化收益有限；<\/li><li value=\"3\">定位需要向导航和融合模块输出协方差，滤波天然提供。<\/li><\/ol>\n<p>补充：分开后要考虑地图更新。定位端发现大面积不一致（配准分数下降、残差分布变化）时，记录数据回传；建图端用图优化做增量地图更新（多会话合并，见 8.3.3 节），再下发新版本地图。地图不能“看到一次就修改”（见 7.3.8 节）。<\/p><\/section>\n<section class=\"sec\" data-sec=\"4.3.9\"><h3 id=\"s4.3.9\"><span class=\"num\">4.3.9<\/span> 本章面试题与参考答案<\/h3>\n<p>（先自己作答，再对照答案；答案后括号注明对应小节。）<\/p>\n<h4>题目<\/h4>\n<ol><li value=\"1\">卡尔曼滤波和图优化原理一致吗？在什么条件下严格等价？比较两者结果时最容易漏掉哪个前提？<\/li><li value=\"2\">手算：沿用第 4.2.3 节一维例子，只用里程计时 <code>x_3<\/code> 的方差是多少？若像 KF 那样把回环当作对 <code>x_3<\/code> 的一次测量来融合，<code>x_3<\/code> 的均值和标准差是多少？与图优化结果比较。<\/li><li value=\"3\">追问：上一题中 KF 式融合能修正 <code>x_1、x_2<\/code> 吗？图优化为什么可以？<\/li><li value=\"4\">推导 Schur 补为什么等价于“消去旧状态”，并用第 4.2.5.2 节的 3x3 系统消去 <code>x_1<\/code> 验证。<\/li><li value=\"5\">实现 Schur 补或滑动窗口边缘化时有哪些工程注意点？<\/li><li value=\"6\">非线性系统中，EKF 和图优化为什么会给出不同结果？图优化是不是一定更好？<\/li><li value=\"7\">为什么工程上常把 ESKF 和因子图组合？全局修正为什么放在 <code>map -&gt; odom<\/code>？这种组合最容易踩的坑是什么？<\/li><\/ol>\n<h4>参考答案<\/h4>\n<p><strong>1. 原理是否一致、等价条件与易漏前提<\/strong><\/p>\n<p>两者都在求给定测量后的状态后验。KF 把历史压缩成当前状态的均值和协方差；图优化保留一段或全部历史状态联合求解。在线性高斯、模型和数据完全相同时，变量消元是精确的，计算顺序不改变最终高斯分布：<\/p>\n<pre class=\"code\"><code>标准 KF 在 k 时刻的当前后验\n= 只使用截至 k 时刻测量的完整线性因子图中 x_k 的边缘后验<\/code><\/pre>\n<p>易漏前提是“过滤”与“平滑”的区别：完整图会用未来测量修正历史状态，普通 KF 只给当前过滤结果。比较某个历史时刻时必须说明是过滤结果还是平滑结果。（见 4.3.1、4.3.3）<\/p>\n<p><strong>2. 手算：KF 式融合回环<\/strong><\/p>\n<p>只用里程计，三段独立相加：<\/p>\n<pre class=\"code\"><code>Var(x_3) = 3 * 0.1^2 = 0.03,  信息量 1/0.03 approximately_equals 33.33\n融合回环测量 x_3 = 3.0, sigma 0.05, 信息量 400：\nx_3 = (33.33*3.2 + 400*3.0) / (33.33 + 400) approximately_equals 3.01538 m\nVar = 1 / 433.33 approximately_equals 0.002308,  sigma approximately_equals 0.0480 m<\/code><\/pre>\n<p>图优化求 H 的逆，<code>x_3<\/code> 对应对角元同样是 0.002308，均值同为 3.01538 m。这正是“KF 当前后验 = 完整图中 x_k 的边缘后验”的数值体现。（见 4.3.3、4.2.4、4.2.5.2）<\/p>\n<p><strong>3. 追问：历史状态能否被修正？<\/strong><\/p>\n<p>若 KF 只保留当前状态，<code>x_1、x_2<\/code> 在前面各步已被消去，回环到来时无法再改它们，只能修正 <code>x_3<\/code>。图优化保留全部状态和因子，回环通过里程计因子的耦合把修正分摊回去，得到 <code>x_1=1.03846、x_2=1.97692<\/code>，这就是平滑。<\/p>\n<p>KF 若想修正历史，要把历史状态增广进状态向量（或另做 RTS 平滑），代价随之上升，本质上又回到了图/平滑的做法。（见 4.3.3、4.3.5）<\/p>\n<p><strong>4. Schur 补推导与数值验证<\/strong><\/p>\n<pre class=\"code\"><code>[H_aa  H_ab] [delta_a]   [eta_a]\n[H_ba  H_bb] [delta_b] = [eta_b]\n第一行：delta_a = H_aa^-1*(eta_a - H_ab*delta_b)\n代入第二行：\n(H_bb - H_ba*H_aa^-1*H_ab)*delta_b = eta_b - H_ba*H_aa^-1*eta_a<\/code><\/pre>\n<p>旧变量 a 被删除，但它对 b 的约束被压缩进新的信息矩阵和信息向量。用 6.5.2 的系统（<code>H*X=b<\/code> 形式）消去 <code>x_1<\/code>（<code>H_aa=200<\/code>，<code>H_ba=[-100,0]^T<\/code>）：<\/p>\n<pre class=\"code\"><code>H_new = [[200,-100],[-100,500]] - [[50,0],[0,0]] = [[150,-100],[-100,500]]\nb_new = [-10, 1310] - [-100,0]*(10/200) = [-5, 1310]\n解得 x_2 approximately_equals 1.97692, x_3 approximately_equals 3.01538<\/code><\/pre>\n<p>与不消元的结果完全一致。KF 递推、滑动窗口边缘化都可以这样理解。（见 4.3.4、4.2.5.2）<\/p>\n<p><strong>5. Schur 补的工程注意点<\/strong><\/p>\n<ul><li>不要显式计算 <code>H_aa^-1<\/code>，用 Cholesky 等线性求解得到 <code>H_aa^-1*H_ab<\/code> 与 <code>H_aa^-1*eta_a<\/code>，数值更稳也更省。<\/li><li><code>H_ba*H_aa^-1*H_ab<\/code> 会在所有与 a 相连的保留变量之间产生新的耦合块，边缘化后的先验通常比原来更稠密，影响后续稀疏性。<\/li><li>边缘化在非线性问题里把当时的线性化点固化进先验，之后这些量不能再重线性化，这就是 7.5 所说“固定窗口边缘化线性化点”的影响。（见 4.3.4、4.3.5）<\/li><\/ul>\n<p><strong>6. 非线性时为何不同？图优化一定更好吗？<\/strong><\/p>\n<p>EKF 通常在当前预测点线性化一次，然后把结果压缩进均值和协方差；旧的非线性测量被删除后，无法在新的历史轨迹上重新计算雅可比，线性化误差被永久保留。全图或固定窗口优化保留原始非线性因子，可以“线性化 -&gt; 求增量 -&gt; 更新 -&gt; 再线性化”，大回环到来后更适合重新调整历史轨迹。<\/p>\n<p>但图优化不是无条件更好：它同样需要好初值，会陷入局部最优，会被假回环拉坏，固定窗口边缘化也有线性化点问题，内存和求解成本也更高。（见 4.3.5）<\/p>\n<p><strong>7. ESKF + 因子图组合、<code>map -&gt; odom<\/code> 与重复计信息<\/strong><\/p>\n<pre class=\"code\"><code>IMU / 轮速 -&gt; 高频 ESKF -&gt; 连续 odom -&gt; base_link\n激光 / GNSS / 回环 -&gt; 低频因子图 -&gt; map -&gt; odom 修正<\/code><\/pre>\n<p>ESKF 用名义状态表示物理量、滤波器只估小误差，适合高频低延迟的 IMU 传播；因子图处理关键帧、多传感器和全局回环。<code>odom<\/code> 是连续但会漂的局部坐标系，把全局修正放在 <code>map -&gt; odom<\/code>，控制所用的 <code>odom -&gt; base_link<\/code> 就不会因回环而跳变。<\/p>\n<p>最大陷阱是重复计算同一信息：ESKF 已融合某帧激光，又把 ESKF 输出和同一激光同时作为独立因子加入图，会低估协方差、系统过度自信。（见 4.3.6）<\/p>\n<hr><\/section>\n<section class=\"sec\" data-sec=\"4.3.10\"><h3 id=\"s4.3.10\"><span class=\"num\">4.3.10<\/span> 补充面试题：GN 与 LM、定位建图分开、滤波与优化<\/h3>\n<p>先自己作答，再对照答案；答案后括号注明对应小节。<\/p>\n<h4>题目<\/h4>\n<ol><li value=\"1\">GN 忽略了 Hessian 的哪一项？什么情况下这个近似好，什么情况下不好？<\/li><li value=\"2\">GN 有哪些问题？LM 分别怎样解决？<\/li><li value=\"3\">LM 中 <code>lambda<\/code> 的大小分别对应什么行为？增益比 <code>rho<\/code> 怎样用于调整 <code>lambda<\/code>？<\/li><li value=\"4\">Dogleg 相比 LM 有什么优势？<\/li><li value=\"5\">如果定位和建图分开，建图端和定位端分别选什么？为什么地图固定后滤波的缺陷被削弱了？<\/li><li value=\"6\">滤波和优化的本质区别是什么？为什么说“滤波是窗口大小为 1 的优化”？<\/li><li value=\"7\">从精度、一致性、外点处理、回环和延迟测量几个角度比较滤波和优化。<\/li><\/ol>\n<h4>参考答案<\/h4>\n<p><strong>1. GN 近似<\/strong><\/p>\n<p>忽略二阶项 <code>Σ r_i * Hessian(r_i)<\/code>。残差小、接近最优解时近似很好；残差大或远离最优解时近似差。（见 3.2.1.1、3.1.4）<\/p>\n<p><strong>2. GN 的问题与 LM<\/strong><\/p>\n<p>矩阵奇异或病态、步长不受控导致发散、大残差时收敛慢。LM 加阻尼使矩阵正定，并通过接受或拒绝步长保证代价下降，接近最优时退化为 GN 保持快速收敛。（见 3.2.1.3）<\/p>\n<p><strong>3. lambda 与 rho<\/strong><\/p>\n<p><code>lambda<\/code> 小像 GN，<code>lambda<\/code> 大像小步长梯度下降。<code>rho<\/code> 等于实际下降比预测下降：<code>rho<\/code>大则接受步长并减小 <code>lambda<\/code>，<code>rho<\/code> 小或为负则拒绝并增大 <code>lambda<\/code>。（见 3.2.1.2）<\/p>\n<p><strong>4. Dogleg<\/strong><\/p>\n<p>在 GN 步和最速下降步之间插值，调整信赖域半径时不必重新解线性方程，被拒绝步长的代价更低，适合 iSAM2 这样的增量求解。（见 3.2.1.3）<\/p>\n<p><strong>5. 分开后的选择<\/strong><\/p>\n<p>建图用图优化，需要全局一致、回环和可撤销约束；定位以 ESKF/IEKF 为主，延迟乱序或需要强外点处理时用固定滞后平滑。地图固定后不再是状态变量，状态维度恒定，路标相关性和长期线性化误差的问题大部分消失。（见 4.3.8）<\/p>\n<p><strong>6. 本质区别<\/strong><\/p>\n<p>滤波只估计当前状态，每个测量只线性化一次；优化估计一段轨迹，可反复重新线性化。IEKF对“先验 + 当前测量”做 GN 迭代，相当于窗口为 1 的优化。（见 4.3.7.1、4.3.5）<\/p>\n<p><strong>7. 对比<\/strong><\/p>\n<p>优化精度更高，可重新线性化；滤波存在可观性不一致，需要 FEJ 等修正；优化能用鲁棒核和可撤销因子处理外点，滤波融合错误测量后无法撤回；优化天然支持回环和乱序测量；滤波延迟低、协方差直接可得。（见 4.3.7.2）<\/p><\/section>", "sections": [{"id": "4.3.1", "title": "一句话回答"}, {"id": "4.3.2", "title": "图优化在做什么？"}, {"id": "4.3.3", "title": "为什么说线性高斯条件下二者等价？"}, {"id": "4.3.4", "title": "Schur 补为什么代表“消去旧状态”？"}, {"id": "4.3.5", "title": "非线性时为什么不再完全相同？"}, {"id": "4.3.6", "title": "工程上为什么常把两者组合？"}, {"id": "4.3.7", "title": "滤波法和优化法有什么区别？各自优劣是什么？"}, {"id": "4.3.8", "title": "定位和建图如果分开优化，选图优化还是滤波？"}, {"id": "4.3.9", "title": "本章面试题与参考答案"}, {"id": "4.3.10", "title": "补充面试题：GN 与 LM、定位建图分开、滤波与优化"}]}, {"num": "4.4", "title": "粒子滤波与 AMCL（深入）", "html": "<section class=\"sec\" data-sec=\"4.4.0\"><div class=\"callout tip\"><strong>为什么现在学这一章<\/strong>：第 1 级用直觉认识了粒子；这一章补上推导和工程：权重更新来自贝叶斯滤波的哪一步、为什么不是每次都重采样、AMCL 的激光似然和全局定位。<\/div><\/section>\n<section class=\"sec\" data-sec=\"4.4.1\"><h3 id=\"s4.4.1\"><span class=\"num\">4.4.1<\/span> 粒子滤波来自贝叶斯滤波的哪一步？<\/h3>\n<p>递归贝叶斯滤波有两步。<\/p>\n<p>预测：<\/p>\n<pre class=\"code\"><code>previous_posterior\n  --motion model and control--&gt;\ncurrent_prior<\/code><\/pre>\n<p>更新：<\/p>\n<pre class=\"code\"><code>current_posterior\nproportional_to\nmeasurement_likelihood * current_prior<\/code><\/pre>\n<p>粒子滤波没有改变贝叶斯公式，只是用采样来近似很难解析计算的概率分布：<\/p>\n<pre class=\"code\"><code>预测分布   用“让每个粒子按运动模型随机移动”近似\n测量更新   用“给每个粒子乘上测量似然”完成\n后验集中   用“按权重重采样”完成<\/code><\/pre>\n<p>为什么权重更新是“旧权重乘测量似然”？先把连续状态想成几个候选位置。上一时刻的权重 <code>w_i_old<\/code> 表示第 i 个候选在预测后占有多少先验份额；当前测量在该候选下出现的可能程度是：<\/p>\n<pre class=\"code\"><code>likelihood_i = p(z_k given x_i)<\/code><\/pre>\n<p>贝叶斯公式说“后验正比于似然乘先验”，所以每个候选的未归一化后验份额为：<\/p>\n<pre class=\"code\"><code>w_i_unnormalized\n= likelihood_i*w_i_old<\/code><\/pre>\n<p>这些数还不一定加起来等于 1，因此最后除以全部候选权重之和：<\/p>\n<pre class=\"code\"><code>w_i_new\n= w_i_unnormalized\n  / sum_of_all_unnormalized_weights<\/code><\/pre>\n<p>运动模型按其噪声分布传播粒子，是在用样本近似预测步骤；上面两行权重计算则是在样本上完成测量更新。这就是粒子滤波的两部分怎样对应贝叶斯滤波，而不是凭经验给粒子打分。<\/p><\/section>\n<section class=\"sec\" data-sec=\"4.4.2\"><h3 id=\"s4.4.2\"><span class=\"num\">4.4.2<\/span> 一次完整粒子滤波的步骤<\/h3>\n<p>对第 k 时刻：<\/p>\n<pre class=\"code\"><code>1. 上一时刻有 N 个带权粒子\n\n2. 对每个粒子按运动模型采样\n   x_i_new = sample_motion(x_i_old, control, motion_noise)\n\n3. 对每个新粒子计算测量似然\n   likelihood_i = p(z_k given x_i_new)\n\n4. 更新权重\n   weight_i_new = weight_i_old * likelihood_i\n\n5. 归一化权重\n   normalized_weight_i = weight_i_new / sum_of_all_weights\n\n6. 必要时按归一化权重重采样\n\n7. 输出加权均值、最大权重粒子或主要粒子簇<\/code><\/pre>\n<p>本章采用最常见的 bootstrap/SIR 粒子滤波：直接用运动模型作为采样分布。在这个前提下，第 4 步才简化为“旧权重乘测量似然”。更一般的序贯重要性采样若使用其他提议分布，权重中还要包含目标分布与提议分布的修正比值，不能照抄这个简式。<\/p>\n<p>若输出二维位姿的加权均值，<code>x<\/code> 和 <code>y<\/code> 可以直接加权平均，角度却不能直接平均。例如<code>179 degree<\/code> 和 <code>-179 degree<\/code> 的平均方向应接近 180 度，而不是 0 度。航向角应通过加权的正弦、余弦或主要粒子簇计算。<\/p><\/section>\n<section class=\"sec\" data-sec=\"4.4.3\"><h3 id=\"s4.4.3\"><span class=\"num\">4.4.3<\/span> 为什么不是每次都重采样？<\/h3>\n<p>频繁重采样会让少数高权粒子被反复复制，低权但仍可能正确的假设过早消失。这叫粒子贫化。可以用有效粒子数判断权重是否过度集中：<\/p>\n<pre class=\"code\"><code>N_eff = 1 / (w_1^2 + w_2^2 + ... + w_N^2)<\/code><\/pre>\n<p>若所有粒子权重都是 <code>1/N<\/code>：<\/p>\n<pre class=\"code\"><code>N_eff = N<\/code><\/pre>\n<p>若几乎只剩一个粒子有权重：<\/p>\n<pre class=\"code\"><code>N_eff approximately_equals 1<\/code><\/pre>\n<p>工程中可以在 <code>N_eff<\/code> 低于阈值时才重采样。重采样后还可通过运动噪声、少量随机粒子或 roughening 保留多样性，但噪声不能大到让已收敛的位置持续抖动。<\/p><\/section>\n<section class=\"sec\" data-sec=\"4.4.4\"><h3 id=\"s4.4.4\"><span class=\"num\">4.4.4<\/span> AMCL 怎样把粒子滤波用在 ROS 2 导航中？<\/h3>\n<p>AMCL 的目标是：<\/p>\n<blockquote>已经有一张二维占据栅格地图时，使用轮速里程计和二维激光持续估计机器人在地图中的<code>[x,y,yaw]<\/code>。<\/blockquote>\n<p>它不是建图算法。其主线是：<\/p>\n<pre class=\"code\"><code>odom 增量\n  -&gt; 让每个粒子按运动模型移动\n  -&gt; 在每个粒子位姿下预测激光与地图的匹配程度\n  -&gt; 根据激光似然更新权重\n  -&gt; 必要时重采样\n  -&gt; 估计 map 到 odom 的校正变换<\/code><\/pre>\n<p><code>odom -&gt; base_link<\/code> 由里程计系统提供，AMCL 通过 <code>map -&gt; odom<\/code> 把局部连续但会漂移的 odom坐标系对齐到全局地图。<\/p>\n<p>Nav2 中 AMCL 的运动模型、激光模型、粒子数和 frame 参数可对照<a href=\"https://docs.nav2.org/rolling/configuration_and_development/configuration_guide/others/configuring_amcl/\" target=\"_blank\" rel=\"noopener\">Nav2 AMCL 官方配置说明<\/a>。<\/p><\/section>\n<section class=\"sec\" data-sec=\"4.4.5\"><h3 id=\"s4.4.5\"><span class=\"num\">4.4.5<\/span> AMCL 的激光似然怎样理解？<\/h3>\n<p>以 likelihood field 思路为例，对每个粒子：<\/p>\n<pre class=\"code\"><code>1. 用粒子位姿把一束激光终点变换到 map\n\n2. 查询该终点离地图中最近障碍物有多远\n\n3. 距离越小，这束激光在该粒子下的似然越高\n\n4. 组合多束激光的似然，得到该粒子的测量权重<\/code><\/pre>\n<p>这与点云匹配的核心思想相似：都在问“候选位姿能否让传感器观测和地图对齐”。区别是粒子滤波同时评估很多个离散候选位姿，高斯-牛顿则在一个当前候选位姿附近连续求增量。<\/p><\/section>\n<section class=\"sec\" data-sec=\"4.4.6\"><h3 id=\"s4.4.6\"><span class=\"num\">4.4.6<\/span> 全局定位和跟踪定位为什么所需粒子数不同？<\/h3>\n<p>跟踪定位时，已知机器人大约在上一时刻位置附近，粒子只需覆盖一个小范围。全局定位时，粒子要覆盖整张地图的可行位置和多个朝向，需要更多粒子、更多激光证据和更长收敛时间。<\/p>\n<p>自适应粒子方法的思路是：<\/p>\n<pre class=\"code\"><code>不确定性大、分布范围广   -&gt; 使用更多粒子\n已经收敛、分布范围小     -&gt; 使用更少粒子<\/code><\/pre>\n<p>但粒子少不等于精度自动足够，仍要用重定位成功率、轨迹误差和 CPU 实测。<\/p><\/section>\n<section class=\"sec\" data-sec=\"4.4.7\"><h3 id=\"s4.4.7\"><span class=\"num\">4.4.7<\/span> 权重全部变成 0 怎么办？<\/h3>\n<p>多条测量似然相乘时，很多小数连乘容易产生数值下溢。例如：<\/p>\n<pre class=\"code\"><code>0.001 * 0.001 * ... * 0.001<\/code><\/pre>\n<p>乘很多次后在浮点数中可能变成 0。常见办法是使用对数权重：<\/p>\n<pre class=\"code\"><code>log_weight_i\n= old_log_weight_i\n  + log_likelihood_i<\/code><\/pre>\n<p>归一化前先减去最大对数权重：<\/p>\n<pre class=\"code\"><code>shifted_i = log_weight_i-max_log_weight\nweight_i  = exp(shifted_i)<\/code><\/pre>\n<p>然后再除以权重总和。如果不是数值下溢，而是所有粒子的测量似然真的都极低，则可能是：<\/p>\n<ul><li>机器人被绑架或初始位置错误；<\/li><li>地图与环境已经严重不符；<\/li><li>激光坐标系、时间戳或量程单位错误；<\/li><li>观测模型过于自信。<\/li><\/ul>\n<p>此时应触发全局重定位或故障处理，不应只强行把全部权重改成相等后继续运行。<\/p><\/section>\n<section class=\"sec\" data-sec=\"4.4.8\"><h3 id=\"s4.4.8\"><span class=\"num\">4.4.8<\/span> 粒子滤波、卡尔曼滤波和图优化怎样区分？<\/h3>\n<div class=\"tbl\"><table><thead><tr><th>方法<\/th><th>怎样表示不确定性<\/th><th>主要优势<\/th><th>主要局限<\/th><th>常见用途<\/th><\/tr><\/thead><tbody><tr><td>卡尔曼滤波<\/td><td>均值和协方差<\/td><td>高维连续状态中高效<\/td><td>通常只保留单个近似高斯<\/td><td>LIO、状态估计<\/td><\/tr><tr><td>粒子滤波<\/td><td>带权离散样本<\/td><td>能表示非高斯和多峰<\/td><td>高维状态需要大量粒子<\/td><td>AMCL、全局定位<\/td><\/tr><tr><td>图优化<\/td><td>保留多个状态和因子<\/td><td>能利用回环重新修正历史<\/td><td>内存和求解成本更高<\/td><td>全局 SLAM、平滑<\/td><\/tr><\/tbody><\/table><\/div>\n<p>三者不一定互斥。例如局部 LIO 可以使用卡尔曼滤波，全局重定位使用粒子或候选检索，关键帧和回环再使用因子图优化。<\/p><\/section>\n<section class=\"sec\" data-sec=\"4.4.9\"><h3 id=\"s4.4.9\"><span class=\"num\">4.4.9<\/span> 粒子滤波最容易答错的面试问题<\/h3>\n<p><strong>问：权重是机器人在该粒子位置的后验概率吗？<\/strong><\/p>\n<p>答：在离散粒子近似中，归一化权重表示该样本对后验积分的相对贡献；不能把连续空间中“某一个精确点的概率”直接理解成该权重。<\/p>\n<p><strong>问：为什么重采样后权重又相等？<\/strong><\/p>\n<p>答：因为旧权重已经变成各粒子被复制的次数；新样本集是对旧带权分布的无权近似。<\/p>\n<p><strong>问：粒子滤波是否一定比 EKF 准？<\/strong><\/p>\n<p>答：不是。后验接近单峰高斯且状态维度高时，EKF 往往更高效，有限粒子反而可能采样不足。<\/p>\n<p><strong>问：AMCL 为什么还需要 odom？<\/strong><\/p>\n<p>答：激光不是连续高频运动控制。odom 提供两帧之间的运动预测，激光与地图匹配再修正全局位置。<\/p><\/section>\n<section class=\"sec\" data-sec=\"4.4.10\"><h3 id=\"s4.4.10\"><span class=\"num\">4.4.10<\/span> 本章的最短记忆链<\/h3>\n<pre class=\"code\"><code>后验可能多峰\n  -&gt; 用多个带权粒子表示\n  -&gt; 运动模型让粒子传播\n  -&gt; 测量似然给粒子打分\n  -&gt; 权重归一化\n  -&gt; N_eff 判断是否需要重采样\n  -&gt; 高权粒子被多复制，低权粒子逐渐消失\n  -&gt; 保留多样性，防止粒子贫化\n  -&gt; AMCL 用这套方法在已知二维地图中定位<\/code><\/pre><\/section>\n<section class=\"sec\" data-sec=\"4.4.11\"><h3 id=\"s4.4.11\"><span class=\"num\">4.4.11<\/span> 本章面试题与参考答案<\/h3>\n<p>（先自己作答，再对照答案；答案后括号注明对应小节。）<\/p>\n<h4>题目<\/h4>\n<ol><li value=\"1\">什么场景下卡尔曼滤波不够用、需要粒子滤波？反过来，为什么 FAST-LIO2 这类高维 LIO 不用粒子滤波？<\/li><li value=\"2\">推导 bootstrap/SIR 粒子滤波中“新权重 = 旧权重 * 测量似然”的来源。若不用运动模型作提议分布，这个简式还成立吗？<\/li><li value=\"3\">手算：第 1.4.3 节 5 个粒子 <code>[1, 2, 2.5, 4, 5] m<\/code>、归一化权重约 <code>[0.0053, 0.0651, 0.1563, 0.4813, 0.2919]<\/code>，求加权均值位置和有效粒子数 <code>N_eff<\/code>。<\/li><li value=\"4\">追问：同一组权重做系统重采样，若起始随机偏移使抽样位置为 <code>[0.05, 0.25, 0.45, 0.65, 0.85]<\/code>，重采样结果是什么？和第 1.4.4 节的结果为什么不同？<\/li><li value=\"5\">为什么不每一步都重采样？粒子贫化怎样缓解，缓解时又要注意什么？<\/li><li value=\"6\">陷阱题：两个等权粒子航向分别为 179 度和 -179 度，输出航向应是多少？直接算术平均会得到什么？<\/li><li value=\"7\">运行中所有粒子权重都变成 0，你怎样排查和处理？请给出对数权重的数值示例。<\/li><li value=\"8\">AMCL 的输入输出和主流程是什么？likelihood field 激光模型怎样给粒子打分？全局定位和跟踪定位的粒子数为什么不同？<\/li><li value=\"9\">粒子滤波、卡尔曼滤波、图优化分别怎样表示不确定性？在一个真实系统里怎样组合？<\/li><\/ol>\n<h4>参考答案<\/h4>\n<p><strong>1. 何时需要粒子滤波、为什么高维 LIO 不用<\/strong><\/p>\n<p>KF 用一个高斯（均值加协方差）近似后验，只能表达单峰。刚启动完全不知道位置、多条几乎一样的走廊、机器人被绑架、非线性和障碍物导致后验明显偏斜或多峰时，一个高斯无法同时表示“可能在东走廊也可能在西走廊”，粒子滤波用带权样本可以保留多种假设。<\/p>\n<p>但粒子要覆盖状态空间，维度增加时所需粒子数快速增长（维数灾难）。<code>[x, y, yaw]<\/code> 三维定位很实用；位姿、速度、零偏、外参全部粒子化通常不合算，所以 FAST-LIO2 用迭代误差状态卡尔曼滤波，二维导航定位才常用 AMCL。（见 1.4.1、1.4.5）<\/p>\n<p><strong>2. 权重更新的来源与适用条件<\/strong><\/p>\n<p>递归贝叶斯滤波：预测步用运动模型得到先验，更新步 <code>posterior proportional_to likelihood * prior<\/code>。bootstrap/SIR 让每个粒子按运动模型采样，样本本身就近似了预测先验，旧权重 <code>w_i_old<\/code> 是该样本的先验份额，于是：<\/p>\n<pre class=\"code\"><code>w_i_unnormalized = p(z_k | x_i) * w_i_old\nw_i_new = w_i_unnormalized / sum_j w_j_unnormalized<\/code><\/pre>\n<p>这个简式只在“提议分布 = 运动模型”时成立。一般的序贯重要性采样若用其他提议分布，权重还要乘上目标分布与提议分布的修正比值，不能照抄。（见 4.4.1、4.4.2）<\/p>\n<p><strong>3. 手算：加权均值与 <code>N_eff<\/code><\/strong><\/p>\n<pre class=\"code\"><code>加权均值 = 0.0053*1 + 0.0651*2 + 0.1563*2.5 + 0.4813*4 + 0.2919*5\n         approximately_equals 3.911 m\nsum w_i^2 approximately_equals 0.3456\nN_eff = 1 / sum w_i^2 approximately_equals 2.89<\/code><\/pre>\n<p>5 个粒子的有效数只剩约 2.9，说明权重已明显集中在 <code>x=4、x=5<\/code> 两个粒子上，若阈值取 <code>N/2 = 2.5<\/code> 还不必重采样，取更高阈值则会触发。注意加权均值 3.91 m 不等于最大权重粒子 4 m，多峰时均值甚至可能落在两个峰之间的不可能位置，此时应输出主要粒子簇。（见 1.4.3、4.4.3、4.4.2）<\/p>\n<p><strong>4. 追问：换一个起始偏移的系统重采样<\/strong><\/p>\n<p>累积权重约为：<\/p>\n<pre class=\"code\"><code>[0.0053, 0.0705, 0.2267, 0.7081, 1.0000]\n0.05 -&gt; 首个大于它的是 0.0705 -&gt; x=2\n0.25 -&gt; 0.7081 -&gt; x=4\n0.45 -&gt; 0.7081 -&gt; x=4\n0.65 -&gt; 0.7081 -&gt; x=4\n0.85 -&gt; 1.0000 -&gt; x=5\n结果：[2, 4, 4, 4, 5]<\/code><\/pre>\n<p>第 1.4.4 节用 <code>[0.1, ..., 0.9]<\/code> 得到 <code>[2.5, 4, 4, 4, 5]<\/code>。系统重采样只在起点处抽一个随机数，其余位置等间隔 1/N，所以结果随起点变化；但每个粒子被复制的期望次数都等于 <code>N*w_i<\/code>，<code>x=4<\/code> 在两种偏移下都被复制 3 次（<code>5*0.4813 approximately_equals 2.4<\/code>）。重采样后权重重置为 <code>1/N<\/code>，概率已编码在复制次数里。（见 1.4.4）<\/p>\n<p><strong>5. 为什么不每步重采样、怎样防贫化<\/strong><\/p>\n<p>频繁重采样会让少数高权粒子被反复复制，低权但可能正确的假设过早消失，这就是粒子贫化；而且测量信息不多时重采样只会徒增随机性。常用做法是 <code>N_eff<\/code> 低于阈值才重采样：<\/p>\n<pre class=\"code\"><code>N_eff = 1 / (w_1^2 + ... + w_N^2)\n全部等权 -&gt; N_eff = N；几乎只剩一个 -&gt; N_eff approximately_equals 1<\/code><\/pre>\n<p>重采样后可用运动噪声、少量随机粒子或 roughening 保持多样性，但注入的噪声不能大到让已收敛的位置持续抖动。（见 4.4.3）<\/p>\n<p><strong>6. 陷阱：航向平均<\/strong><\/p>\n<p>直接算术平均 <code>(179 + (-179)) / 2 = 0<\/code> 度，方向完全反了。应做圆周平均：<\/p>\n<pre class=\"code\"><code>theta_mean = atan2(sum_i w_i*sin(theta_i), sum_i w_i*cos(theta_i))\n           = atan2(0, -0.9998) = 180 度<\/code><\/pre>\n<p>x、y 可以直接加权平均，航向角必须用加权的正弦、余弦或取主要粒子簇的方向。（见 4.4.2）<\/p>\n<p><strong>7. 权重全为 0 的排查与处理<\/strong><\/p>\n<p>先区分数值下溢和真实失配。多束激光似然连乘，例如 <code>0.001<\/code> 连乘很多次会下溢成 0；<code>exp(-1000)<\/code> 在双精度中也直接是 0。用对数权重：<\/p>\n<pre class=\"code\"><code>log_w = [-1000, -1001, -1005]\n减去最大值：shifted = [0, -1, -5]\nexp -&gt; [1, 0.3679, 0.0067]，归一化 approximately_equals [0.7275, 0.2676, 0.0049]<\/code><\/pre>\n<p>若不是下溢，而是所有粒子似然真的都极低，要查：机器人被绑架或初始位姿错、地图与环境严重不符、激光坐标系/时间戳/量程单位错、观测模型过于自信。此时应触发全局重定位或故障处理，不能简单把权重全改成相等后继续跑。（见 4.4.7）<\/p>\n<p><strong>8. AMCL 主流程、激光模型与粒子数<\/strong><\/p>\n<p>AMCL 是在已知二维占据栅格地图中的定位算法，不是建图算法：<\/p>\n<pre class=\"code\"><code>odom 增量 -&gt; 粒子按运动模型移动\n  -&gt; 每个粒子位姿下评估激光与地图的匹配\n  -&gt; 按激光似然更新权重 -&gt; 必要时重采样\n  -&gt; 输出 map -&gt; odom 校正（odom -&gt; base_link 由里程计提供）<\/code><\/pre>\n<p>likelihood field：用粒子位姿把每束激光终点变换到 map，查询它到最近障碍物的距离，距离越小似然越高，组合多束激光得到该粒子权重。它和点云匹配问的是同一件事，区别是粒子滤波同时评估很多离散候选，高斯-牛顿在一个候选附近连续求增量。<\/p>\n<p>跟踪定位只需覆盖上一位置附近小范围；全局定位要覆盖整张地图和多个朝向，需要更多粒子、更多激光证据和更长收敛时间。自适应粒子方法按分布范围增减粒子，但粒子少不等于精度够，仍要用重定位成功率、轨迹误差和 CPU 实测。（见 4.4.4、4.4.5、4.4.6）<\/p>\n<p><strong>9. 三种方法的区分与组合<\/strong><\/p>\n<pre class=\"code\"><code>卡尔曼滤波：均值 + 协方差；高维连续状态高效；只保留单个近似高斯；LIO、状态估计\n粒子滤波：  带权离散样本；能表示非高斯和多峰；高维需大量粒子；AMCL、全局定位\n图优化：    保留多个状态和因子；能用回环修正历史；内存和求解成本高；全局 SLAM、平滑<\/code><\/pre>\n<p>三者不互斥：局部 LIO 用卡尔曼滤波提供高频连续位姿，全局重定位用粒子或候选检索解决多峰初始化，关键帧和回环再交给因子图优化。（见 4.4.8）<\/p>\n<hr><\/section>", "sections": [{"id": "4.4.1", "title": "粒子滤波来自贝叶斯滤波的哪一步？"}, {"id": "4.4.2", "title": "一次完整粒子滤波的步骤"}, {"id": "4.4.3", "title": "为什么不是每次都重采样？"}, {"id": "4.4.4", "title": "AMCL 怎样把粒子滤波用在 ROS 2 导航中？"}, {"id": "4.4.5", "title": "AMCL 的激光似然怎样理解？"}, {"id": "4.4.6", "title": "全局定位和跟踪定位为什么所需粒子数不同？"}, {"id": "4.4.7", "title": "权重全部变成 0 怎么办？"}, {"id": "4.4.8", "title": "粒子滤波、卡尔曼滤波和图优化怎样区分？"}, {"id": "4.4.9", "title": "粒子滤波最容易答错的面试问题"}, {"id": "4.4.10", "title": "本章的最短记忆链"}, {"id": "4.4.11", "title": "本章面试题与参考答案"}]}, {"num": "4.5", "title": "滑动窗口与边缘化：VINS-Mono 与 ORB-SLAM", "html": "<section class=\"sec\" data-sec=\"4.5.0\"><div class=\"callout tip\"><strong>为什么现在学这一章<\/strong>：图优化保留全部历史会越来越慢。滑动窗口只保留最近的状态，用 Schur 补把旧状态“边缘化”成先验。本章讲边缘化的两个副作用、FEJ，以及 VINS-Mono 和 ORB-SLAM 的不同取舍。<\/div>\n<p>第 4.3.4 节和第 6.3.3.2 节已经推导过 Schur 补和边缘化先验。本章在此基础上回答：边缘化有哪些副作用，VINS-Mono 的两种边缘化策略怎样选，ORB-SLAM 为什么本质上是“固定”而不是“边缘化”。<\/p><\/section>\n<section class=\"sec\" data-sec=\"4.5.1\"><h3 id=\"s4.5.1\"><span class=\"num\">4.5.1<\/span> 一句话回答<\/h3>\n<p>VINS-Mono 用时间连续的滑动窗口，删除旧帧时用 Schur 补把信息压缩成先验，根据次新帧是否为关键帧，选择“边缘化最老帧”或“丢弃次新帧”；ORB-SLAM 用共视图邻域做局部 BA，窗口外但能看到局部地图点的关键帧只是固定不动，信息靠持久的全局地图、回环和全局 BA保留，而不是靠先验。<\/p><\/section>\n<section class=\"sec\" data-sec=\"4.5.2\"><h3 id=\"s4.5.2\"><span class=\"num\">4.5.2<\/span> 边缘化有哪两个副作用？<\/h3>\n<p>Schur 补的形式见 6.3.3.2 节：<\/p>\n<pre class=\"code\"><code>H_prior = H_rr - H_rm * inverse(H_mm) * H_mr\nb_prior = b_r  - H_rm * inverse(H_mm) * b_m<\/code><\/pre>\n<p><strong>副作用一：填充（fill-in）<\/strong>。<code>H_rm*inverse(H_mm)*H_mr<\/code> 是稠密块：被边缘化变量所连接的所有保留变量之间都会产生连接，稀疏性被破坏。所以 VINS 边缘化老帧时，要控制有多少路标一起被边缘化，或者丢弃部分观测。<\/p>\n<p><strong>副作用二：线性化点固定<\/strong>。先验是在边缘化时刻的线性化点算出的，之后保留变量的估计会变，但先验的雅可比不再变。如果其他因子用新的线性化点算雅可比，不同因子的雅可比就是在不同点求的，会引入虚假信息，让本来不可观的方向（例如全局 yaw）“变得可观”，估计过度自信、不一致。<\/p>\n<p>解决办法是 FEJ（First-Estimate Jacobian）：与先验相连的变量始终用第一次估计值计算雅可比。OKVIS、DSO、Basalt 采用了 FEJ；VINS-Mono 没有严格使用，而是用一阶近似更新先验的梯度：<\/p>\n<pre class=\"code\"><code>b_prior_new = b_prior - H_prior * delta_x<\/code><\/pre>\n<p>其中 <code>delta_x<\/code> 是保留变量相对边缘化时线性化点的变化量。<\/p>\n<figure class=\"anim\"><div class=\"player\"><video src=\"vid/schur_marginalization.mp4\" poster=\"vid/schur_marginalization.jpg\" muted loop playsinline preload=\"none\" aria-label=\"动画 22：Schur 补的几何意义：对每个保留变量 r，先把旧变量 m 取到最优，剩下的就是 r 上的先验\"><\/video><\/div><figcaption><span class=\"badge\">动画 22<\/span>Schur 补的几何意义：对每个保留变量 r，先把旧变量 m 取到最优，剩下的就是 r 上的先验<\/figcaption><\/figure>\n<figure class=\"anim\"><div class=\"player\"><video src=\"vid/sliding_window_fillin.mp4\" poster=\"vid/sliding_window_fillin.jpg\" muted loop playsinline preload=\"none\" aria-label=\"动画 23：滑动窗口边缘化最老帧：它连接的变量之间产生稠密先验（填充），稀疏结构变稠\"><\/video><\/div><figcaption><span class=\"badge\">动画 23<\/span>滑动窗口边缘化最老帧：它连接的变量之间产生稠密先验（填充），稀疏结构变稠<\/figcaption><\/figure><\/section>\n<section class=\"sec\" data-sec=\"4.5.3\"><h3 id=\"s4.5.3\"><span class=\"num\">4.5.3<\/span> 先验怎样放进 Ceres？<\/h3>\n<p>Ceres 需要的是残差和雅可比，而不是 <code>H<\/code> 和 <code>b<\/code>。VINS 对先验做特征分解：<\/p>\n<pre class=\"code\"><code>H_prior = V * S * V^T\n\nJ_prior = sqrt(S) * V^T\nr_prior = inverse(sqrt(S)) * V^T * b_prior<\/code><\/pre>\n<p>这样 <code>J_prior^T * J_prior = H_prior<\/code>，再作为一个 <code>MarginalizationFactor<\/code> 加入问题。实现中会把很小的特征值置零，避免数值问题。<\/p><\/section>\n<section class=\"sec\" data-sec=\"4.5.4\"><h3 id=\"s4.5.4\"><span class=\"num\">4.5.4<\/span> VINS-Mono 的窗口里有什么？<\/h3>\n<pre class=\"code\"><code>窗口大小 10，再加当前帧\n每帧：p、q、v、b_a、b_g\n另有：相机—IMU 外参、时间偏移 t_d\n特征点：逆深度，每个特征一个标量，锚定在首次观测帧\n\n残差：\n  IMU 预积分残差（第 12 章）\n  视觉重投影残差（18.7.2）\n  边缘化先验残差\n  回环重定位残差（23.5）<\/code><\/pre><\/section>\n<section class=\"sec\" data-sec=\"4.5.5\"><h3 id=\"s4.5.5\"><span class=\"num\">4.5.5<\/span> VINS-Mono 的两种边缘化策略怎样选？<\/h3>\n<p>新帧加入后，判断次新帧（second newest）是否为关键帧：次新帧与上一关键帧之间的平均视差是否超过阈值，或跟踪点数是否过少。<\/p>\n<pre class=\"code\"><code>次新帧是关键帧 -&gt; MARGIN_OLD：边缘化最老帧\n  - 最老帧的位姿、速度、bias\n  - 以最老帧为锚点的特征点逆深度\n  - 最老帧与第二帧之间的 IMU 预积分因子\n  -&gt; 用 Schur 补生成先验；其余特征的锚点转移到下一帧\n\n次新帧不是关键帧 -&gt; MARGIN_SECOND_NEW：丢弃次新帧\n  - 次新帧的视觉观测直接丢弃，不做 Schur 补\n  - IMU 不丢：把次新帧前后两段预积分合并，保持 IMU 约束链连续<\/code><\/pre>\n<p>为什么次新帧“丢弃”而不是“边缘化”：它和当前帧太相似，视觉信息高度冗余；若边缘化它的视觉观测，会把它连接的大量路标变成稠密先验，带来 fill-in。丢掉的损失很小，是精度、稀疏性和效率的折中。<\/p>\n<p>这套机制还有一个目的：静止或低速时，窗口不会被一串几乎相同的帧填满，从而保证窗口内有足够视差用于三角化（见 6.2.3.3 节）。<\/p><\/section>\n<section class=\"sec\" data-sec=\"4.5.6\"><h3 id=\"s4.5.6\"><span class=\"num\">4.5.6<\/span> ORB-SLAM 为什么是“固定”而不是“边缘化”？<\/h3>\n<p>纯视觉 ORB-SLAM 没有经典意义上的滑窗边缘化，它的局部 BA 是：<\/p>\n<pre class=\"code\"><code>优化变量：当前关键帧 + 共视图中的邻居关键帧 + 它们看到的全部地图点\n固定变量：能看到这些地图点、但不在共视集合中的关键帧\n          参与残差计算，位姿不动<\/code><\/pre>\n<p>窗口不是“时间上最近的 N 帧”，而是“共视图上的邻域”，即空间局部性。<\/p>\n<div class=\"tbl\"><table><thead><tr><th>对比项<\/th><th>边缘化（VINS、OKVIS）<\/th><th>固定（ORB-SLAM）<\/th><\/tr><\/thead><tbody><tr><td>移出变量的信息<\/td><td>以稠密先验保留<\/t
