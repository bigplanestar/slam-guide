e>package.xml<\/code>、<code>CMakeLists.txt<\/code>、<code>colcon build<\/code>、<code>source install/setup.bash<\/code> 四层连起来。常见原因：<\/p>\n<pre class=\"code\"><code>CMakeLists.txt 生成了目标却没有 install(TARGETS ...)\n编译后没有重新 source\nsource 了另一个工作空间，或 overlay 顺序错误，旧包覆盖新包\n把包名、可执行名和节点名当成同一个名字<\/code><\/pre>\n<p>先用 <code>ros2 pkg prefix my_package<\/code> 看当前 shell 实际找到的是哪个 install 空间；跑起来是旧代码时，这一步通常就能看出是另一个 overlay 的旧节点。（见 7.5.2、7.5.9）<\/p>\n<p><strong>3. QoS 怎样选<\/strong><\/p>\n<p>QoS 是通信策略，不只是队列长度：<\/p>\n<pre class=\"code\"><code>高频激光和 IMU          SensorDataQoS：best_effort、volatile、小队列\n速度指令和状态           reliable、volatile\n静态地图、晚加入需可见   reliable、transient_local<\/code><\/pre>\n<p>晚打开 RViz 看不到地图，是 durability 问题：volatile 下新订阅者只收到连接后的新消息，地图如果只发一次就永远收不到，需要发布端和订阅端都用 transient_local。高频点云用 reliable 会重传，网络差时反而积压。另外 best_effort 发布者配 reliable 订阅者不兼容，topic 名存在却收不到数据。这些都不是 <code>depth<\/code> 能解决的，应先用 <code>ros2 topic info /points --verbose<\/code> 看两端的 QoS。（见 7.5.3）<\/p>\n<p><strong>4. 采样时间与到达时间<\/strong><\/p>\n<p>从采样到回调执行之间隔着传感器内部缓冲、驱动传输、DDS 排队、Executor 等待和操作系统调度，这段延迟随负载抖动。用到达时间代替采样时间，LiDAR 与 IMU 的相对时间差会跟着计算负载变化，去畸变和融合就会出现系统性误差，常见表现是点云成扇形、墙变厚、转弯时错层，而且“负载高时更差”。还要区分 system time、steady time（算耗时）和 ROS time（可由 <code>/clock<\/code> 驱动，用于仿真和回放）。（见 7.5.4、7.5.14 现象四）<\/p>\n<p><strong>5. extrapolation into the future<\/strong><\/p>\n<p>意思是请求时刻比 TF buffer 中最新的变换还晚。把查询时间改成 0（取最新 TF）只是掩盖问题：机器人在运动，这等于用错误时刻的位姿处理这帧数据。应查：<\/p>\n<pre class=\"code\"><code>传感器时钟是否走在 ROS 时钟前面\nTF 发布延迟是否过大\n是否一部分节点 use_sim_time=true，另一部分没有\n消息时间戳的单位或 epoch 是否错误<\/code><\/pre>\n<p>也可以适当等待 TF 到达（带超时的查询），而不是放弃时间一致性。（见 7.5.5、7.5.14 现象二）<\/p>\n<p><strong>6. lookupTransform 的方向与外参发布<\/strong><\/p>\n<p>返回 <code>T_target_source<\/code>，即把 <code>source_frame<\/code> 中的数据变换到 <code>target_frame<\/code>。例如 <code>lookupTransform(&quot;base_link&quot;, &quot;lidar&quot;, t)<\/code> 得到 <code>T_base_link_lidar<\/code>，可以把点云从 lidar 系变到 base_link 系。<\/p>\n<p>LiDAR、IMU、相机相对机体的固定安装外参应由静态变换发布器写入 <code>/tf_static<\/code>；只有随时间变化的机器人位姿才发到 <code>/tf<\/code>。不要高频反复发布不变的外参，既浪费带宽，也容易出现两个发布者、时间戳不一致等问题。（见 7.5.5）<\/p>\n<p><strong>7. LIO 的 IMU 与 LiDAR 组织<\/strong><\/p>\n<p>不应该。ApproximateTime 适合两个低频 topic 按时间窗配对（窗太小配不上，太大会把时间差很大的数据当成同时观测）。LIO 需要的是一帧 LiDAR 时间段内的全部 IMU：<\/p>\n<pre class=\"code\"><code>1. 按时间戳缓存高频 IMU\n2. 一帧 LiDAR 完整后确定起止时间\n3. 取出覆盖该时间段的 IMU\n4. 进行积分、传播和逐点去畸变<\/code><\/pre>\n<p>另外软件同步只能配对，消除不了硬件时钟漂移；要让采样时刻本身在同一时间基准，需要 PPS、触发线、共享时钟或 PTP 等硬件同步。（见 7.5.6）<\/p>\n<p><strong>8. 单线程 Executor 下的长回调<\/strong><\/p>\n<p>SingleThreadedExecutor 同一时刻只执行一个回调，这 100 ms 内 IMU 回调、诊断定时器、服务回调都执行不了，数据积压，日志上只表现为“输入时好时坏”。拆法：<\/p>\n<pre class=\"code\"><code>传感器回调只做快速检查，放入有界队列\n由工作线程做重的点云匹配和优化\n按需要用 MultiThreadedExecutor + Callback Group 让回调并行\n不在持锁期间做长时间计算、同步等待服务或发布可能反向触发的回调<\/code><\/pre>\n<p>Reentrant 组允许同组并行，代码要自己保证线程安全；MutuallyExclusive 组内回调不会同时执行。（见 7.5.7）<\/p>\n<p><strong>9. 节点在却没数据；参数没生效<\/strong><\/p>\n<p>节点在却没数据：若是 Lifecycle Node，进程启动不等于 active，状态可能停在 unconfigured 或 inactive，用 <code>ros2 lifecycle get /node_name<\/code> 查。Nav2 由 lifecycle manager 按依赖顺序配置激活，前面某个节点 configure 失败，后面的也不会激活。<\/p>\n<p>参数没生效：参数属于具体节点，先用 <code>ros2 param get<\/code> 或 <code>ros2 param dump<\/code> 看节点实际拿到的值。常见原因是 YAML 顶层节点名、namespace 或 <code>ros__parameters<\/code> 层级与 launch 重命名后的实际节点不一致、代码没有声明该参数、类型不一致（期望 double 却写成 integer）、launch 后传参数覆盖了 YAML、运行的是另一个 overlay 的旧节点。关键参数（外参、时间偏移、噪声）节点应自己校验长度、范围和矩阵合法性。（见 7.5.8、7.5.9）<\/p>\n<p><strong>10. 追问：bag 回放异常<\/strong><\/p>\n<p>一份能复现问题的 bag 至少包含：原始 LiDAR、原始 IMU、轮速或底盘里程计、<code>/tf<\/code>、<code>/tf_static<\/code>、必要的 GNSS/相机/状态 topic、使用仿真时间时的 <code>/clock<\/code> 策略，以及对应的参数、外参、代码版本和提交号。录完先 <code>ros2 bag info<\/code>，再低速回放验证时间戳、TF 和消息数量。<\/p>\n<p>回放异常先查：是否真的录全了 IMU、TF 和静态外参；回放 QoS 与订阅者是否兼容（可用 YAML 覆盖 QoS）；算法用的是消息时间还是 wall time；回放倍速是否让回调队列积压；参数、代码提交和现场版本是否一致。（见 7.5.10、7.5.14 现象三）<\/p>\n<p><strong>11. 是否全部放进一个 container<\/strong><\/p>\n<p>不一定。同进程加 intra-process communication 能减少大型点云和图像的序列化与拷贝，但代价是一个组件崩溃可能让整个进程退出，线程安全和 Callback Group 配置更复杂，内存所有权和消息生命周期更难分析；多进程的故障隔离和独立重启更简单。应实测点云拷贝数、端到端延迟、CPU、内存和故障恢复时间再决定，不能只因为“同进程更快”就全放进去。（见 7.5.11）<\/p>\n<hr><\/section>", "sections": [{"id": "7.5.1", "title": "Node、Topic、Service、Action 和 Parameter 怎样选？"}, {"id": "7.5.2", "title": "ROS 2 包为什么编译成功却 ros2 run 找不到？"}, {"id": "7.5.3", "title": "QoS 是“通信策略”，不是简单的队列长度"}, {"id": "7.5.4", "title": "时间戳为什么比回调到达时间更重要？"}, {"id": "7.5.5", "title": "TF2 树不只是给 RViz 显示的"}, {"id": "7.5.6", "title": "LiDAR、IMU、Camera 怎样同步？"}, {"id": "7.5.7", "title": "Executor 和 Callback Group 为什么会影响 SLAM？"}, {"id": "7.5.8", "title": "Lifecycle Node 为什么“节点在，却没数据”？"}, {"id": "7.5.9", "title": "Parameter 为什么在 YAML 中写了却没生效？"}, {"id": "7.5.10", "title": "rosbag2 为什么不是“录了点云就够了”？"}, {"id": "7.5.11", "title": "Composition 和进程内通信一定更好吗？"}, {"id": "7.5.12", "title": "SLAM 输出怎样接入 Nav2？"}, {"id": "7.5.13", "title": "一套从输入到输出的 ROS 2 排查顺序"}, {"id": "7.5.14", "title": "常见现象与根因"}, {"id": "7.5.15", "title": "ROS 2 相关面试问题怎样回答？"}, {"id": "7.5.16", "title": "一个可执行的 ROS 2 SLAM 练习顺序"}, {"id": "7.5.17", "title": "本章面试题与参考答案"}]}, {"num": "7.6", "title": "LIO 与整条 pipeline 的内存、CPU 优化", "html": "<section class=\"sec\" data-sec=\"7.6.0\"><div class=\"callout tip\"><strong>为什么现在学这一章<\/strong>：最后是性能：先测量再优化，区分“常驻大”和“持续增长”，从无界容器、地图结构、点数、近邻搜索一直优化到可视化和调度。<\/div>\n<p>第 9.2.11 节问的是“运行频率、CPU 和内存是多少”。本章回答下一个追问：项目里怎样把它们降下来。<\/p><\/section>\n<section class=\"sec\" data-sec=\"7.6.1\"><h3 id=\"s7.6.1\"><span class=\"num\">7.6.1<\/span> 一句话回答<\/h3>\n<p>先测量再优化：用 RSS 长时间曲线区分“常驻内存大”和“内存随时间增长”，用线程级CPU 和火焰图找热点；内存上消除无界容器、限制地图规模和点类型大小、减少拷贝；CPU 上先减少点数，再优化近邻搜索和迭代次数，最后处理 pipeline 中的可视化、序列化和调度。<\/p><\/section>\n<section class=\"sec\" data-sec=\"7.6.2\"><h3 id=\"s7.6.2\"><span class=\"num\">7.6.2<\/span> 为什么必须先测量？<\/h3>\n<div class=\"tbl\"><table><thead><tr><th>对象<\/th><th>工具<\/th><th>看什么<\/th><\/tr><\/thead><tbody><tr><td>内存<\/td><td><code>/proc/&lt;pid&gt;/status<\/code> 中的 VmRSS、VmHWM，<code>smem<\/code> 的 PSS<\/td><td>长时间 RSS 曲线的斜率，而不是某一时刻的值<\/td><\/tr><tr><td>内存热点<\/td><td><code>heaptrack<\/code>、<code>valgrind --tool=massif<\/code><\/td><td>哪段代码在持续分配<\/td><\/tr><tr><td>CPU<\/td><td><code>top -H<\/code>、<code>pidstat -t<\/code><\/td><td>哪个线程占用高<\/td><\/tr><tr><td>CPU 热点<\/td><td><code>perf record -g<\/code> + 火焰图<\/td><td>哪个函数占用高<\/td><\/tr><tr><td>时延<\/td><td>模块内打时间戳<\/td><td>单帧耗时 P50、P99<\/td><\/tr><\/tbody><\/table><\/div>\n<p>先分类，再动手：常驻内存大，通常是地图或数据结构选型问题；内存随时间增长，通常是无界容器；CPU 峰值高，通常是算法计算量；CPU 底噪高，通常是序列化、拷贝和可视化。<\/p><\/section>\n<section class=\"sec\" data-sec=\"7.6.3\"><h3 id=\"s7.6.3\"><span class=\"num\">7.6.3<\/span> LIO 内部怎样省内存？<\/h3>\n<div class=\"tbl\"><table><thead><tr><th>问题<\/th><th>根因<\/th><th>做法<\/th><\/tr><\/thead><tbody><tr><td>路径消息无界增长<\/td><td>FAST-LIO 每帧向 <code>nav_msgs/Path<\/code> 追加位姿且不清理，每次发布还要序列化整条路径<\/td><td>只保留最近 N 个位姿，或关闭路径发布<\/td><\/tr><tr><td>PCD 保存缓存<\/td><td>开启 <code>pcd_save_en<\/code> 后，每帧点云都累加到内存缓存<\/td><td>部署时关闭；建图时按间隔分段落盘并清空<\/td><\/tr><tr><td>地图无界增长<\/td><td>全局地图一直累积<\/td><td>只维护局部地图：ikd-Tree 局部立方体并删除移出区域；或哈希体素 + LRU 淘汰（Faster-LIO 的 iVox、Super-LIO 的 OctVox）<\/td><\/tr><tr><td>地图过密<\/td><td>每个体素点数没有上限<\/td><td>地图降采样；OctVox 式每体素代表点数硬上限<\/td><\/tr><tr><td>点类型臃肿<\/td><td><code>PointXYZINormal<\/code> 约 48 字节，<code>PointXYZI<\/code> 约 32 字节（含对齐）<\/td><td>内部使用紧凑结构，只在发布边界转换<\/td><\/tr><tr><td>缓冲队列无界<\/td><td>处理慢于输入时，雷达和 IMU 缓冲无限堆积<\/td><td>有界队列 + 丢最老帧，并计数告警<\/td><\/tr><tr><td>点云拷贝<\/td><td>按值传递点云，ROS 消息与 PCL 来回转换<\/td><td>用共享指针和 <code>std::move<\/code> 传递；预分配；ROS 2 进程内零拷贝（见 7.5.11 节）<\/td><\/tr><tr><td>后端关键帧点云<\/td><td>所有关键帧点云常驻内存<\/td><td>降采样后落盘，按需加载；或量化压缩<\/td><\/tr><tr><td>释放后 RSS 不降<\/td><td>glibc 多线程 malloc arena 碎片<\/td><td><code>MALLOC_ARENA_MAX=2<\/code>、周期性 <code>malloc_trim(0)<\/code>，或换 jemalloc、tcmalloc<\/td><\/tr><\/tbody><\/table><\/div><\/section>\n<section class=\"sec\" data-sec=\"7.6.4\"><h3 id=\"s7.6.4\"><span class=\"num\">7.6.4<\/span> LIO 内部怎样省 CPU？<\/h3>\n<ol><li value=\"1\"><strong>减少点数<\/strong>，收益最大，最先做：隔点采样、去掉近距离车体点、最大距离裁剪、体素降采样。BIEVR-LIO 和 Super-LIO 的思路是按信息量采样，而不是均匀采样（见 7.2.5 节）。<\/li><li value=\"2\"><strong>近邻搜索<\/strong>通常是最大热点：KD 树换哈希体素在 ARM 上效果明显（Super-LIO 报告Orin NX 上单帧从约 41 ms 降到约 10 ms）；搜索并行化（OpenMP 或 TBB）。<\/li><li value=\"3\"><strong>迭代次数<\/strong>：最大迭代次数从 4 降到 2 或 3，配合收敛判据提前退出；运动平稳的机器人往往两次就收敛。<\/li><li value=\"4\"><strong>地图维护异步化<\/strong>：地图增删和发布放到独立线程，不阻塞状态估计主循环。<\/li><li value=\"5\"><strong>数值实现<\/strong>：Eigen 固定尺寸矩阵，热循环内不动态分配；编译开启 <code>-O3<\/code> 和目标架构选项，并定义 <code>NDEBUG<\/code>。<\/li><li value=\"6\"><strong>调度<\/strong>：大小核 SoC（RK3588 为 4 个 A76 + 4 个 A55）上把 LIO 主线程绑到大核，可视化和日志放小核；Executor 与回调组的影响见 7.5.7 节。<\/li><\/ol><\/section>\n<section class=\"sec\" data-sec=\"7.6.5\"><h3 id=\"s7.6.5\"><span class=\"num\">7.6.5<\/span> 整条 pipeline 怎样优化？<\/h3>\n<ol><li value=\"1\"><strong>可视化按需发布<\/strong>：发布前检查订阅者数量，没人订阅就不转换不发布；发布的点云再降采样；全分辨率配准点云只在调试时打开。序列化和 DDS 传输常常是 CPU 底噪的大头。<\/li><li value=\"2\"><strong>传输<\/strong>：大消息走共享内存传输，同进程组件化零拷贝；QoS 用较小的 <code>KEEP_LAST<\/code>深度，避免历史缓存占内存（见 7.5.3 节）。<\/li><li value=\"3\"><strong>驱动侧预处理<\/strong>：在雷达驱动节点内就做裁剪和降采样，减少所有下游订阅者的负担。<\/li><li value=\"4\"><strong>合并重复计算<\/strong>：定位、避障、建图都在做同样的去畸变和降采样时，合并为一个共享预处理节点。<\/li><li value=\"5\"><strong>日志与录包<\/strong>：生产环境降低日志级别，避免高频打印；录包启用压缩并限制话题。<\/li><li value=\"6\"><strong>系统级兜底<\/strong>：systemd 的 <code>MemoryMax=<\/code> 或 cgroup 限制单进程内存，配合看门狗，防止一个模块失控拖死整机。<\/li><\/ol><\/section>\n<section class=\"sec\" data-sec=\"7.6.6\"><h3 id=\"s7.6.6\"><span class=\"num\">7.6.6<\/span> 面试时怎样讲？<\/h3>\n<pre class=\"code\"><code>发现：长时间 RSS 曲线线性增长\n定位：heaptrack 指向路径消息和 PCD 缓存两个无界容器\n修复：限长、落盘；RSS 稳定在 xx MB\nCPU：火焰图显示近邻搜索和点云转换占大头\n      -&gt; 调整降采样参数、可视化按需发布、主线程绑大核\n结果：单帧 P99 从 xx ms 降到 xx ms，CPU 从 xx% 降到 xx%<\/code><\/pre>\n<p><code>xx<\/code> 必须换成自己的实测数字。“先发现、再定位、再修复、最后量化验证”的叙述比罗列技巧更有说服力。<\/p><\/section>\n<section class=\"sec\" data-sec=\"7.6.7\"><h3 id=\"s7.6.7\"><span class=\"num\">7.6.7<\/span> 本章面试题与参考答案<\/h3>\n<p>先自己作答，再对照答案；答案后括号注明对应小节。<\/p>\n<h4>题目<\/h4>\n<ol><li value=\"1\">内存占用高时，怎样区分“常驻大”和“持续增长”？各自通常是什么原因？<\/li><li value=\"2\">FAST-LIO 长时间运行内存增长，最常见的两个无界容器是什么？怎样修复？<\/li><li value=\"3\">哈希体素加 LRU 为什么比全局 KD 树更省内存、在 ARM 上更快？<\/li><li value=\"4\">LIO 的 CPU 优化应按什么顺序做？为什么“减少点数”排第一？<\/li><li value=\"5\">pipeline 层面，哪些 CPU 消耗不在算法本身？怎样减少？<\/li><\/ol>\n<h4>参考答案<\/h4>\n<p><strong>1. 分类<\/strong><\/p>\n<p>看长时间 RSS 曲线的斜率：斜率为 0 但值大，是地图或数据结构选型问题；斜率持续为正，是无界容器或泄漏。用 heaptrack 或 massif 定位分配点。（见 7.6.2）<\/p>\n<p><strong>2. 无界容器<\/strong><\/p>\n<p>路径消息每帧追加不清理；开启 PCD 保存后每帧点云累加到内存。前者限长或关闭，后者部署时关闭、建图时分段落盘。（见 7.6.3）<\/p>\n<p><strong>3. 哈希体素<\/strong><\/p>\n<p>只保留局部或最近访问的体素，地图规模有界；每体素点数有上限；O(1) 定位体素，无需树的重平衡，访存局部性更好。（见 7.6.3、5.3.5）<\/p>\n<p><strong>4. 顺序<\/strong><\/p>\n<p>先减少点数，再优化近邻搜索、迭代次数和地图维护，最后做数值实现和调度。点数决定搜索、残差和雅可比的计算量，减少点数对所有后续步骤都生效。（见 7.6.4）<\/p>\n<p><strong>5. pipeline<\/strong><\/p>\n<p>可视化转换与发布、序列化和 DDS 传输、重复的预处理、日志。对策是按订阅发布、降采样发布、共享内存或零拷贝、驱动侧预处理、合并重复计算、降低日志级别。（见 7.6.5）<\/p><\/section>", "sections": [{"id": "7.6.1", "title": "一句话回答"}, {"id": "7.6.2", "title": "为什么必须先测量？"}, {"id": "7.6.3", "title": "LIO 内部怎样省内存？"}, {"id": "7.6.4", "title": "LIO 内部怎样省 CPU？"}, {"id": "7.6.5", "title": "整条 pipeline 怎样优化？"}, {"id": "7.6.6", "title": "面试时怎样讲？"}, {"id": "7.6.7", "title": "本章面试题与参考答案"}]}]}, {"key": "L8", "label": "第 8 级", "title": "地图与大规模后端（进阶）", "intro": "<div class=\"callout goal\"><strong>这一级学完，你能回答<\/strong>：语义地图有哪些表示层次、怎样一步步建立；怎样用 NeRF / 3DGS 压缩地图、用射线法擦除动态伪影、用气压计和楼层拓扑锁定 Z 轴、把 2D 语义概率地投影到 3D；PGO 规模无限增长时怎样用节点稀疏化和 iSAM2 维持计算量；怎样设计鲁棒后端免疫假回环；多会话轨迹怎样对齐；怎样为 SLAM 的块稀疏结构设计预条件子。<\/div>\n<p>这一级面向城市级、长期运行的系统，需要前面所有级别的基础。<\/p>", "chapters": [{"num": "8.1", "title": "语义地图：从几何地图到对象与场景图", "html": "<section class=\"sec\" data-sec=\"8.1.0\"><div class=\"callout tip\"><strong>为什么现在学这一章<\/strong>：先回答“这是什么”：语义地图有哪些层次、怎样从检测和分割一步步建出来、工业界怎样用、开放词汇地图多了什么，以及项目中是否值得做。<\/div>\n<p>前面各章处理的都是几何量：位姿、点、平面和协方差。本章讨论在几何地图之上再加一层“这是什么”的信息，以及它在什么条件下才真正产生工程价值。<\/p><\/section>\n<section class=\"sec\" data-sec=\"8.1.1\"><h3 id=\"s8.1.1\"><span class=\"num\">8.1.1<\/span> 先从几何地图和语义地图的区别说起<\/h3>\n<p>普通几何地图主要回答：<\/p>\n<pre class=\"code\"><code>哪里可以通行？\n哪里存在障碍物？\n障碍物离机器人多远？<\/code><\/pre>\n<p>例如二维占据栅格只需要把格子分成空闲、占用和未知。语义地图还要回答：<\/p>\n<pre class=\"code\"><code>这里是什么物体或区域？\n它是静态的还是会移动？\n机器人应该怎样对待它？\n它属于哪个房间，与其他物体是什么关系？\n它是否已经移动、消失或被替换？<\/code><\/pre>\n<p>同一个占用区域，几何地图只知道“这里有障碍物”，语义地图可能进一步知道：<\/p>\n<pre class=\"code\"><code>墙       -&gt; 长期静态，可以进入永久地图\n人       -&gt; 动态障碍，不应写进静态地图\n门       -&gt; 可能可通过，但需要判断开闭状态\n托盘     -&gt; 可能被搬走，需要维护对象生命周期\n充电桩   -&gt; 可以作为导航和对接目标\n灭火器   -&gt; 可以作为巡检对象<\/code><\/pre>\n<p>所以语义地图不是给点云涂上类别颜色就结束了。只有当导航器、任务规划器、巡检模块或机械臂真正读取并使用这些信息时，语义地图才产生系统价值。<\/p>\n<p>还要区分三个容易混用的名称：<\/p>\n<div class=\"tbl\"><table><thead><tr><th>名称<\/th><th>语义是否反过来影响位姿<\/th><th>主要目标<\/th><\/tr><\/thead><tbody><tr><td>语义建图 semantic mapping<\/td><td>不一定<\/td><td>使用已有位姿，把类别或对象放进地图<\/td><\/tr><tr><td>语义 SLAM semantic SLAM<\/td><td>会<\/td><td>语义还参与数据关联、定位或回环<\/td><\/tr><tr><td>场景图/机器人世界模型<\/td><td>通常建立在前两者之上<\/td><td>保存对象、房间、关系、时间和任务属性<\/td><\/tr><\/tbody><\/table><\/div>\n<p>初学者应该先做第一种。先让几何 SLAM 提供可靠位姿，再建立语义层；不要一开始就让不稳定的识别结果反过来修改位姿。<\/p><\/section>\n<section class=\"sec\" data-sec=\"8.1.2\"><h3 id=\"s8.1.2\"><span class=\"num\">8.1.2<\/span> 语义地图有哪些表示层次？<\/h3>\n<div class=\"tbl\"><table><thead><tr><th>表示<\/th><th>保存的内容<\/th><th>典型用途<\/th><th>工程复杂度<\/th><\/tr><\/thead><tbody><tr><td>二维区域/兴趣点<\/td><td>房间、禁行区、慢行区、充电点<\/td><td>区域导航和行为切换<\/td><td>低<\/td><\/tr><tr><td>语义代价地图<\/td><td>每类地形或对象对应的通行代价<\/td><td>避障、限速、可通行性<\/td><td>低到中<\/td><\/tr><tr><td>三维语义点云、体素或网格<\/td><td>几何表面及每处类别概率<\/td><td>巡检、三维理解、数字孪生<\/td><td>中<\/td><\/tr><tr><td>对象级实例地图<\/td><td><code>door_3<\/code>、<code>pallet_7<\/code> 等对象及其位置<\/td><td>找物、操作、变化检测<\/td><td>中到高<\/td><\/tr><tr><td>三维场景图<\/td><td>房间、对象及“包含、邻接、支撑”等关系<\/td><td>高层任务和空间推理<\/td><td>高<\/td><\/tr><tr><td>开放词汇地图<\/td><td>可与任意文本比较的视觉语言特征<\/td><td>语言查询和开放类别导航<\/td><td>高<\/td><\/tr><\/tbody><\/table><\/div>\n<p>这些层次不是越高越好。Nav2 的二维代价地图已经允许传感器或 AI 输出通过插件影响规划，也能用过滤器表达禁行、限速等空间规则；这是比较直接的工程落点。<a href=\"https://docs.nav2.org/rolling/configuration_and_development/configuration_guide/core_servers/costmap_2d/\" target=\"_blank\" rel=\"noopener\">Nav2 Costmap2D 官方文档<\/a><\/p>\n<p>三维方向上，<a href=\"https://github.com/MIT-SPARK/Kimera-Semantics\" target=\"_blank\" rel=\"noopener\">Kimera-Semantics<\/a>展示了从图像语义和深度构建实时三维几何—语义网格；<a href=\"https://github.com/mit-spark/hydra\" target=\"_blank\" rel=\"noopener\">Hydra<\/a>进一步构建包含地点、房间和对象的三维场景图。它们适合用来理解系统组成，不代表项目一开始就必须复现完整框架。<\/p><\/section>\n<section class=\"sec\" data-sec=\"8.1.3\"><h3 id=\"s8.1.3\"><span class=\"num\">8.1.3<\/span> 一张语义地图怎样一步一步建立？<\/h3>\n<p>先确定下游要读什么，再决定怎样建图。工业现场常见两条入口：已有稳定二维地图时，由现场人员在地图上标注禁行区、限速区、工位和充电点；需要机器人发现、查询或追踪物体时，再增加相机识别和三维融合。前一种也属于语义地图，不要求先训练分割模型。<\/p>\n<p>需要自动生成对象地图时，一条可实施的数据流是：<\/p>\n<pre class=\"code\"><code>LiDAR/视觉 SLAM 提供机器人位姿\n  -&gt; 相机检测或分割图像\n  -&gt; 用 RGB-D、双目或 LiDAR 找到像素深度\n  -&gt; 把语义像素投影到三维\n  -&gt; 用同一时刻的位姿把三维结果变换到 map 坐标系\n  -&gt; 跨帧关联同一个对象\n  -&gt; 融合类别、位置和时间信息\n  -&gt; 保存可重建的观测，并输出区域规则、对象数据库或场景图<\/code><\/pre>\n<p>假设图像像素 <code>(u,v)<\/code> 已去畸变，<code>d<\/code> 是沿相机光轴的深度（不是斜距），相机内参矩阵为 K。先把它恢复成相机坐标系中的三维点：<\/p>\n<pre class=\"code\"><code>p_C = d*K^-1*[u,v,1]^T<\/code><\/pre>\n<p>再使用相机外参和 SLAM 位姿变换到地图坐标系：<\/p>\n<pre class=\"code\"><code>p_M = T_M_B*T_B_C*p_C<\/code><\/pre>\n<p><code>p_C<\/code> 是三维欧氏坐标，应用 4×4 位姿矩阵时把它写成齐次形式 <code>[p_C;1]<\/code>。其中：<\/p>\n<ul><li><code>T_B_C<\/code> 把相机坐标系中的点变换到机器人本体坐标系；<\/li><li><code>T_M_B<\/code> 是 SLAM 给出的机器人在地图中的位姿；<\/li><li><code>p_M<\/code> 是当前地图版本下计算出的三维位置。<\/li><\/ul>\n<p>因此，二维模型识别出“灭火器”并不等于机器人已经知道灭火器在哪里。相机内参、相机—机器人外参、深度、时间同步和 SLAM 位姿中的任意一项错误，都会让语义对象投影到错误位置。<\/p>\n<p>真正落地时，可以按下面六步建立并维护地图：<\/p>\n<ol><li value=\"1\"><strong>定数据契约。<\/strong> 明确要识别的类别、区域或对象 ID，以及消费者需要的字段。例如导航要 <code>polygon + 通行规则<\/code>，巡检要 <code>设备 ID + 位姿 + 拍照视角<\/code>，对接要<code>充电桩 ID + 停靠位姿<\/code>。统一 <code>map<\/code> 坐标系、时间戳、地图版本和类别名称。<\/li><li value=\"2\"><strong>先完成几何底图。<\/strong> 采集 LiDAR/IMU/轮速或视觉数据，完成标定、时间同步、SLAM、回环和定位验收；保存关键帧的原始观测及优化后的位姿。二维区域规则可以直接在底图上人工标注；对象地图才需要后续自动感知步骤。<\/li><li value=\"3\"><strong>生成带位置的语义观测。<\/strong> 对图像做检测、语义分割或实例分割；用有效深度反投影。若深度来自 LiDAR，要先把点按外参投到图像，检查视野、遮挡和时间差，再给对应的三维点赋标签，不能把整束点云都归给一个图像框。<\/li><li value=\"4\"><strong>跨帧关联并融合。<\/strong> 用类别、三维距离、包围盒重叠和视觉特征寻找同一实例，保留匹配不确定时的“待确认”状态。结合深度质量、视角和置信度更新类别分布与位置；重复看到的货架应合并为一个 ID，遮挡后的新检测不能立刻生成永久对象。<\/li><li value=\"5\"><strong>分层维护和重建。<\/strong> 墙、固定设备进入长期层；人、车辆进入短期动态层；托盘等可移动物体先留在变化证据层。保存对象与来源关键帧的关联、相机系观测和地图版本。回环改变 <code>T_M_B<\/code> 后，重新投影这些观测并关联对象，再重建受影响的语义层；只保存一次融合后的 <code>p_M<\/code>，对象就会留在旧地图位置。人工标注的区域也应绑定底图版本；底图重建后复核区域边界。<\/li><li value=\"6\"><strong>发布并验证消费者。<\/strong> 把区域多边形转成导航过滤器所需的掩码，把命名对象送入查询或巡检数据库。用回放和现场任务检查定位误差、对象重复率、误检持久化、变化更新延迟，以及禁行、限速、对接和巡检任务是否按规则执行。<\/li><\/ol>\n<p>一张地图可以同时有不同更新时间：人工审核的禁行区较稳定，静态设备按确认结果更新，人车等动态物体按短时观测更新。语义检测失败时，不能让过期的人车位置冒充实时障碍；基础避障仍需使用实时传感器。语义地图至少要能说明每条信息的来源、置信度和有效时间。<\/p>\n<p>一个实用的对象记录至少应包含：<\/p>\n<pre class=\"code\"><code>对象 ID\n三维位置、点云或包围盒\n类别及其置信度\n视觉特征向量 embedding（开放词汇时使用）\n首次和最后观测时间\n来源关键帧 ID、相机系观测、地图版本\n位置不确定度或质量标记\n静态、动态、消失或待确认状态<\/code><\/pre>\n<p>地图也不能让最后一帧标签直接覆盖历史结果。系统需要根据置信度、观测角度、距离和历史一致性进行多帧融合。例如同一对象连续得到：<\/p>\n<pre class=\"code\"><code>第 1 帧：door，置信度 0.80\n第 2 帧：door，置信度 0.90\n第 3 帧：wall，置信度 0.30<\/code><\/pre>\n<p>合理结果仍应更支持 door，而不是因为第三帧最后到来就变成 wall。简单系统可以累积加权类别得分；更完整的系统可以维护类别概率，并在每次新观测到来时做贝叶斯更新。<\/p>\n<p>动态对象要单独维护生命周期。人和车辆可以只进入短期活动层；托盘或椅子需要经过多次、跨视角观察后，才判断是临时遮挡、真正移动还是从环境中消失。第 7.3.8 节的静态层、活动层和变化证据层可以直接用于语义地图。<\/p><\/section>\n<section class=\"sec\" data-sec=\"8.1.4\"><h3 id=\"s8.1.4\"><span class=\"num\">8.1.4<\/span> 工业界怎样使用语义地图？<\/h3>\n<p>在工厂、仓库和设备巡检中，常见交付物是附着在几何地图上的规则和命名实体。这些语义可以由人标注，也可以由模型辅助生成；使用方关心的是它能否稳定驱动规划、调度或巡检任务。下面区分公开产品功能、开源导航能力和研究方向：<\/p>\n<div class=\"tbl\"><table><thead><tr><th>使用场景<\/th><th>地图里保存什么<\/th><th>谁读取它、执行什么<\/th><\/tr><\/thead><tbody><tr><td>仓储 AMR 交通管理<\/td><td>禁行区、优先通道、单向或限速区域<\/td><td>全局规划、局部控制或车队调度选择路线和速度<\/td><\/tr><tr><td>工位运输与回充<\/td><td><code>station_A<\/code>、<code>dock_2<\/code> 等命名位置及接近方向<\/td><td>任务系统按名称派单，导航到预停靠点，末端对接模块完成精确靠泊<\/td><\/tr><tr><td>设备巡检<\/td><td>命名设备、巡检点和拍摄动作<\/td><td>任务系统沿路线到点，采集图像、温度或声音并归档到设备 ID<\/td><\/tr><tr><td>动态环境<\/td><td>人、车辆、临时托盘及最后观测时间<\/td><td>局部避障使用实时目标；地图维护模块累计变化证据，再决定是否更新长期层<\/td><\/tr><\/tbody><\/table><\/div>\n<p>公开的工业产品例子是 MiR Fleet：其 2021 年版参考指南列出 Preferred、Unpreferred、Forbidden、Directional 和 Speed 等区域；其中优先区域影响全局路径，限速区域改变机器人在区域内的目标速度。这说明工业语义常是一组可编辑、可审查的运营规则，不必等同于自动生成的三维彩色点云。<a href=\"https://d18hjk6wpn1fl5.cloudfront.net/public/187/documents/Current-mir_fleet_reference_guide_1_4_en_pdf-187-50861-1.pdf\" target=\"_blank\" rel=\"noopener\">MiR Fleet 参考指南，第 3.6.6 节<\/a><\/p>\n<p>开源栈里可以把这种规则做成 Nav2 Costmap Filter：禁行或偏好通道用 Keepout Filter，限速用 Speed Filter。先在同一 <code>map<\/code> 坐标系下制作区域掩码，由 Map Server 和 Filter Info Server 发布，规划器和控制器再消费它。禁行规则通常需要同时进入全局与局部代价地图，否则可能出现全局路线绕行而局部仍试图穿越，或全局路线仍穿过禁行区。<a href=\"https://docs.nav2.org/rolling/tutorials/general_tutorials/navigation2_with_keepout_filter/navigation2_with_keepout_filter/\" target=\"_blank\" rel=\"noopener\">Nav2 禁行区教程<\/a>、<a href=\"https://docs.nav2.org/jazzy/configuration_and_development/configuration_guide/core_servers/costmap_2d/costmap_filters/speed_filter/\" target=\"_blank\" rel=\"noopener\">Nav2 限速过滤器<\/a><\/p>\n<p>命名目标与区域规则是两种不同的输出。以“去二号充电桩”为例，任务系统先用<code>dock_2<\/code> 查到地图中的位姿和对接类型，导航器负责到达接近位姿，对接模块再处理末端误差。Nav2 的 Docking Server 支持把充电桩实例放入数据库，任务按 Dock ID请求对接，而不必每次传一组手写坐标。<a href=\"https://docs.nav2.org/jazzy/tutorials/general_tutorials/using_docking/\" target=\"_blank\" rel=\"noopener\">Nav2 Docking Server 教程<\/a><\/p>\n<p>巡检也有公开的实际接口：Spot GraphNav 的地图包含路点和连边，允许在巡检点显式创建路点；边的注释可指定楼梯模式或速度限制，任务可以在路点执行动作。这属于“带任务语义的拓扑地图”，并不意味着它已自动识别所有设备或构建开放词汇场景图。<a href=\"https://dev.bostondynamics.com/docs/concepts/autonomy/graphnav_map_structure\" target=\"_blank\" rel=\"noopener\">Spot GraphNav 地图结构<\/a>、<a href=\"https://dev.bostondynamics.com/docs/concepts/autonomy/components_of_autonomous_navigation.html\" target=\"_blank\" rel=\"noopener\">Spot 自主导航组成<\/a>、<a href=\"https://support.bostondynamics.com/s/article/Spot-50-Release-Notes-171877\" target=\"_blank\" rel=\"noopener\">Spot 工业巡检功能说明<\/a><\/p>\n<p>完整的开放词汇和长期变化地图仍主要作为研究或进阶开发参考：<a href=\"https://vlmaps.github.io/\" target=\"_blank\" rel=\"noopener\">VLMaps<\/a>用视觉语言特征支持文本查询，<a href=\"https://concept-graphs.github.io/\" target=\"_blank\" rel=\"noopener\">ConceptGraphs<\/a>构建开放词汇对象图，<a href=\"https://github.com/MIT-SPARK/Khronos\" target=\"_blank\" rel=\"noopener\">Khronos<\/a>研究对象出现、移动和消失的时空表示。这些能力的论文或演示不能直接当成工业产品已具备的功能。<\/p>\n<p>一个仓库项目可以这样形成闭环：先验收 LiDAR 底图和定位；人工标注叉车通道禁行区、行人密集处限速区和装卸工位；把区域规则交给规划与控制，把命名工位交给任务系统；人员和临时货物仍由实时传感器避障。回放“去装卸口”的任务，检查实际路线、区域速度、到点误差和动态障碍处理，再决定是否增加自动识别货架或托盘的对象层。这里的语义地图在每一步都有明确的消费者，因而可以按任务成功率和违规次数验收。<\/p>\n<p>语义不会自动提高定位精度。只有建立可靠的语义数据关联，并把它作为观测约束加入估计器时，它才可能帮助定位或回环；错误标签和重复场景也可能产生错误约束。大多数工程项目更适合先让语义服务于导航和任务，不要立即让它修改 SLAM 位姿。<\/p><\/section>\n<section class=\"sec\" data-sec=\"8.1.5\"><h3 id=\"s8.1.5\"><span class=\"num\">8.1.5<\/span> 开放词汇地图比固定类别地图多了什么？<\/h3>\n<p>固定类别系统预先规定：<\/p>\n<pre class=\"code\"><code>墙、地面、人、门、货架、托盘<\/code><\/pre>\n<p>它容易测试和部署，但增加新类别可能需要补数据或重新训练。开放词汇系统把图像区域和文本编码到同一个特征空间。文本查询也变成一个特征向量，再与地图中的 embedding计算相似度，因此可以查询训练阶段没有固定列出的词。<\/p>\n<p>现成视觉基础模型可以作为前端组件。例如<a href=\"https://github.com/IDEA-Research/GroundingDINO\" target=\"_blank\" rel=\"noopener\">Grounding DINO<\/a>根据类别名称或文本描述寻找候选框，<a href=\"https://ai.meta.com/research/sam2/\" target=\"_blank\" rel=\"noopener\">SAM 2<\/a>根据提示生成掩码并在视频中跟踪对象。需要注意：SAM 2 本身并不负责给对象命名；把文本检测、掩码分割、深度、位姿和多帧关联组合起来，才可能形成开放词汇三维地图。<\/p>\n<p>开放词汇模型能识别图像内容，不等于已经解决机器人建图。系统仍要处理：<\/p>\n<ul><li>位姿漂移后，语义对象是否随地图一起修正；<\/li><li>不同视角看到的是否是同一个实例；<\/li><li>动态对象什么时候删除；<\/li><li>相似度多高才接受文本查询；<\/li><li>模型误检是否会污染永久地图；<\/li><li>GPU 延迟、显存和模型不可用时怎样降级。<\/li><\/ul>\n<p>因此大规模系统的难点通常不只是计算 embedding，而是长期几何一致性、对象关联、不确定度、生命周期、索引存储和任务安全。<\/p><\/section>\n<section class=\"sec\" data-sec=\"8.1.6\"><h3 id=\"s8.1.6\"><span class=\"num\">8.1.6<\/span> 当前项目是否有必要做语义地图？<\/h3>\n<p>如果机器人只需要从 A 点安全到达 B 点，可靠定位、几何地图和动态避障通常已经足够，没有必要为了展示效果构建复杂三维场景图。<\/p>\n<p>如果任务需要下面任一能力，语义地图才值得投入：<\/p>\n<ul><li>按名称寻找房间、设备或物体；<\/li><li>区分人、车辆、货物和永久结构；<\/li><li>不同区域采用不同速度、权限或行为；<\/li><li>巡检并记录设备位置和状态；<\/li><li>处理家具、托盘等长期变化；<\/li><li>接收自然语言任务；<\/li><li>为机械臂提供对象位置和空间关系。<\/li><\/ul>\n<p>判断原则是：<\/p>\n<blockquote>先定义哪个下游模块会读取哪一种语义信息，再决定地图表示；没有消费者的语义点云只是可视化效果。<\/blockquote>\n<p>第一个项目不建议直接复现开放词汇场景图。若目标是仓库运输，最小闭环可以是：<\/p>\n<pre class=\"code\"><code>可靠的 LiDAR 地图和定位\n  + 人工标注的禁行区、限速区、命名工位\n  + Nav2 区域过滤器和按名称导航\n  + 回放并验收路线、速度和到点结果<\/code><\/pre>\n<p>若任务还需要机器人自己发现设备或托盘，再增加 RGB-D/双目语义分割、少量固定类别的三维融合和对象查询；稳定后再扩展到开放词汇、场景图和长期变化。<\/p><\/section>\n<section class=\"sec\" data-sec=\"8.1.7\"><h3 id=\"s8.1.7\"><span class=\"num\">8.1.7<\/span> 本章面试题与参考答案<\/h3>\n<p>（先自己作答，再对照答案；答案后括号注明对应小节。）<\/p>\n<h4>题目<\/h4>\n<ol><li value=\"1\">几何地图和语义地图分别回答什么问题？为什么说“给点云涂上类别颜色”还不算语义地图？<\/li><li value=\"2\">语义建图、语义 SLAM 和场景图有什么区别？做第一个项目时应该从哪一种开始，为什么？<\/li><li value=\"3\">相机检测到一个像素 <code>(u,v)<\/code> 处有灭火器，怎样把它变成地图中的三维位置？哪些环节出错会让对象落到错误位置？<\/li><li value=\"4\">追问：如果回环优化修正了历史位姿，已经写进地图的语义对象怎么办？对象记录应该怎样设计才能跟着修正？<\/li><li value=\"5\">同一对象三帧的识别结果依次是 door 0.80、door 0.90、wall 0.30，地图里应该记成什么？多帧融合应考虑哪些因素？<\/li><li value=\"6\">人、车辆、托盘、墙在语义地图里应该怎样区别对待？为什么不能“看到一次就改地图”？<\/li><li value=\"7\">常见误解：“加了语义以后定位一定更准。”你怎么回答？<\/li><li value=\"8\">开放词汇地图比固定类别地图多了什么能力？接上 Grounding DINO 和 SAM 2 之后，建图还剩哪些问题没有解决？<\/li><li value=\"9\">工程判断：面试官问“你们项目要不要做语义地图”，你会怎样论证？给出一个合理的最小闭环。<\/li><li value=\"10\">工业现场的禁行区、限速区、命名充电桩和巡检点分别交给谁使用？哪些信息必须实时更新？<\/li><\/ol>\n<h4>参考答案<\/h4>\n<p><strong>1. 几何地图与语义地图的区别<\/strong><\/p>\n<p>几何地图回答“哪里能走、哪里有障碍、障碍离多远”，例如二维占据栅格只区分空闲、占用和未知。语义地图还要回答“这是什么、静态还是动态、机器人该怎样对待它、属于哪个房间、是否已经移动或消失”。同一块占用区域，语义层能区分墙（进永久地图）、人（动态障碍，不写静态地图）、门（需判断开闭）、托盘（要维护生命周期）、充电桩（对接目标）。<\/p>\n<p>只涂颜色不算，是因为语义地图的价值来自下游消费者：只有导航器、任务规划器、巡检模块或机械臂真正读取并使用这些信息，它才产生系统价值；没有消费者的语义点云只是可视化效果。（见 8.1.1、8.1.6）<\/p>\n<p><strong>2. 语义建图、语义 SLAM 与场景图<\/strong><\/p>\n<pre class=\"code\"><code>语义建图   : 使用已有位姿，把类别或对象放进地图；语义不一定反过来影响位姿\n语义 SLAM  : 语义参与数据关联、定位或回环，会反过来影响位姿\n场景图     : 建立在前两者之上，保存对象、房间、关系、时间和任务属性<\/code><\/pre>\n<p>第一个项目应该先做语义建图：先让几何 SLAM 提供可靠位姿，再在其上建语义层。不要一开始就让不稳定的识别结果反过来修改位姿，否则误检会直接变成错误约束，把定位也拖坏。（见 8.1.1）<\/p>\n<p><strong>3. 从像素到地图坐标<\/strong><\/p>\n<p>先用深度 d 和内参 K 把像素反投影到相机系，再经外参和 SLAM 位姿变换到地图系：<\/p>\n<pre class=\"code\"><code>p_C = d*K^-1*[u,v,1]^T\np_M = T_M_B*T_B_C*p_C<\/code><\/pre>\n<p><code>T_B_C<\/code> 是相机到本体的外参，<code>T_M_B<\/code> 是 SLAM 给出的机器人位姿，<code>p_M<\/code> 是当前地图版本中的位置；长期保存时还应保留来源观测和关键帧，以便回环后重建。相机内参、相机—机器人外参、深度（RGB-D、双目或 LiDAR 提供）、时间同步、SLAM 位姿，任意一项错误都会让对象投影到错误位置。所以二维模型识别出“灭火器”，不等于机器人已经知道灭火器在哪里。（见 8.1.3，时间同步见 7.5.6）<\/p>\n<p><strong>4. 追问：回环修正位姿后语义对象怎么办<\/strong><\/p>\n<p>如果对象只存了一个写死的 <code>p_M<\/code>，回环修正历史位姿后，对象会留在旧位置，和几何地图错开。13.5 把“位姿漂移后，语义对象是否随地图一起修正”列为开放词汇系统仍要处理的问题之一。<\/p>\n<p>对象记录里应保留“来源关键帧”：保存对象相对于关键帧的观测（或关键帧 ID 加相机系位置），地图坐标由 <code>T_M_B(关键帧)<\/code> 重新计算。关键帧位姿被优化更新后，要重投影观测并重新关联、融合对象。一个实用的对象记录至少包含：对象 ID、三维位置/点云/包围盒、类别及置信度、embedding（开放词汇时）、首次和最后观测时间、来源关键帧和相机系观测、地图版本、静态/动态/消失/待确认状态。（见 8.1.3、8.1.5）<\/p>\n<p><strong>5. door、door、wall 三帧怎样融合<\/strong><\/p>\n<p>应该仍然更支持 door，不能因为最后一帧是 wall 就用它覆盖历史结果。简单做法是累积加权类别得分，例如按置信度直接累加：<\/p>\n<pre class=\"code\"><code>door: 0.80 + 0.90 = 1.70\nwall: 0.30<\/code><\/pre>\n<p>更完整的做法是维护类别概率，每次新观测到来时做贝叶斯更新。权重除了置信度，还应考虑观测角度、距离和历史一致性：正对、近距离的观测比斜视、远距离的更可信。（见 8.1.3）<\/p>\n<p><strong>6. 不同对象的生命周期<\/strong><\/p>\n<p>墙等长期结构进入静态层；人和车辆只进入短期活动层或动态避障层，不写进静态地图；托盘、椅子这类可移动物体需要经过多次、跨视角观察，才能判断是临时遮挡、真正移动还是从环境中消失。<\/p>\n<p>不能看到一次就改地图，是因为单次观测可能是遮挡、误检或对象只是暂时离开。第 7.3.8 节的静态层、活动层和变化证据层可以直接用在语义地图上：先积累变化证据，证据足够才修改长期层。（见 8.1.3、7.3.8）<\/p>\n<p><strong>7. 加了语义定位一定更准吗<\/strong><\/p>\n<p>不一定。语义不会自动提高定位精度。只有建立可靠的语义数据关联，并把它作为观测约束加入估计器，它才可能帮助定位或回环；错误标签和重复场景（例如一排外观相同的柜子）还可能产生错误约束，把位姿拉偏。大多数工程项目更适合先让语义服务于导航和任务，不要立即让它修改 SLAM 位姿。（见 8.1.4、8.1.1）<\/p>\n<p><strong>8. 开放词汇地图多了什么、还缺什么<\/strong><\/p>\n<p>固定类别系统预先规定墙、地面、人、门等类别，容易测试部署，但加新类别往往要补数据或重训。开放词汇系统把图像区域和文本编码到同一特征空间，文本查询也变成特征向量，与地图中的 embedding 算相似度，因此能查询训练时没有列出的词。<\/p>\n<p>Grounding DINO 按文本找候选框，SAM 2 按提示生成掩码并跟踪，但 SAM 2 本身不负责给对象命名；两者只解决“图像里有什么”。仍要解决：位姿漂移后语义对象是否随地图修正、不同视角是否同一实例、动态对象何时删除、相似度阈值多高才接受查询、误检是否污染永久地图、GPU 延迟和显存不足或模型不可用时怎样降级。难点在长期几何一致性、对象关联、不确定度、生命周期、索引存储和任务安全，而不只是算 embedding。（见 8.1.5）<\/p>\n<p><strong>9. 项目要不要做语义地图<\/strong><\/p>\n<p>先问哪个下游模块会读取哪种语义信息，再决定表示。如果只需要从 A 安全到 B，可靠定位、几何地图和动态避障通常就够了。只有出现下列需求才值得投入：按名称找房间或设备、区分人车货和永久结构、不同区域不同速度或权限、巡检记录设备位置和状态、处理长期变化、自然语言任务、给机械臂提供对象位置和关系。表示层次也不是越高越好，二维区域和语义代价地图（Nav2 costmap 插件、禁行/限速过滤器）是最直接的工程落点。仓库运输的最小闭环：<\/p>\n<pre class=\"code\"><code>可靠的 LiDAR 地图和定位\n  + 人工标注的禁行区、限速区、命名工位\n  + Nav2 区域过滤器和按名称导航\n  + 路线、速度、到点任务验收<\/code><\/pre>\n<p>需要自动发现对象时，再加 RGB-D/双目语义分割和固定类别三维融合。稳定后再加开放词汇、场景图和长期变化。（见 8.1.2、8.1.3、8.1.4、8.1.6）<\/p>\n<p><strong>10. 工业语义由谁使用<\/strong><\/p>\n<p>禁行区交给全局和局部规划，限速区交给速度过滤器与控制器；命名充电桩先由任务系统查到目标和对接类型，再由导航与末端对接模块执行；巡检点由任务系统关联设备 ID与采集动作。人车和临时货物的位置必须由实时感知更新，不能只依赖建图时的标签。区域规则和固定设备也要在现场变化后按版本审核更新。（见 8.1.3、8.1.4）<\/p>\n<hr><\/section>", "sections": [{"id": "8.1.1", "title": "先从几何地图和语义地图的区别说起"}, {"id": "8.1.2", "title": "语义地图有哪些表示层次？"}, {"id": "8.1.3", "title": "一张语义地图怎样一步一步建立？"}, {"id": "8.1.4", "title": "工业界怎样使用语义地图？"}, {"id": "8.1.5", "title": "开放词汇地图比固定类别地图多了什么？"}, {"id": "8.1.6", "title": "当前项目是否有必要做语义地图？"}, {"id": "8.1.7", "title": "本章面试题与参考答案"}]}, {"num": "8.2", "title": "地图表示与地图质量", "html": "<section class=\"sec\" data-sec=\"8.2.0\"><div class=\"callout tip\"><strong>为什么现在学这一章<\/strong>：地图本身的四个难题：大规模地图怎样压缩并实时渲染、动态物体伪影怎样擦除、多层建筑的 Z 轴怎样锁定、语义标签冲突怎样融合。其中多楼层一节是第 7 级“错层”的延伸，语义一节是上一章的概率细化。<\/div>\n<p>第 7.3 章讨论了错层，第 8.1 章讨论了语义地图怎样建立和使用。本章从“地图本身”出发，回答四个问题：大规模地图怎样压缩并实时渲染，动态物体留下的伪影怎样擦除，多层建筑中Z 轴漂移怎样锁定，2D 语义怎样投影到 3D 并处理冲突。<\/p><\/section>\n<section class=\"sec\" data-sec=\"8.2.1\"><h3 id=\"s8.2.1\"><span class=\"num\">8.2.1<\/span> 怎样用 NeRF 或 3DGS 把大规模点云地图压缩并实时渲染？<\/h3>\n<h4 id=\"s8.2.1.1\"><span class=\"num\">8.2.1.1<\/span> 先校准预期<\/h4>\n<p>“把 TB 级点云压缩到 MB 级”需要拆开看：<\/p>\n<ul><li>TB 级的原始扫描本身高度冗余，同一表面被观测成百上千次；只做去重、体素化和有损量化，就能压到原来的很小一部分；<\/li><li>隐式或神经表征是在此基础上，再利用表面的连续性和空间相关性进一步压缩；<\/li><li>压缩是有损的。要先明确下游需求：渲染和可视化、定位（需要厘米级几何精度）、规划（需要占据和可通行性），三者的容忍度完全不同。<\/li><\/ul>\n<h4 id=\"s8.2.1.2\"><span class=\"num\">8.2.1.2<\/span> 神经隐式路线<\/h4>\n<pre class=\"code\"><code>表征：f_theta(x) -&gt; SDF 或密度，以及颜色；地图就是网络权重\n多分辨率哈希网格（Instant-NGP）：多层哈希表存可学习特征 + 小 MLP，训练和查询快\n面向激光的神经地图：\n  SHINE-Mapping：八叉树特征 + 神经 SDF，支持增量建图\n  PIN-SLAM：基于点的隐式神经表征，回环后可弹性校正\n大场景：Block-NeRF、Mega-NeRF 分块训练、按需加载\n实时渲染：原始 NeRF 体渲染太慢，需要烘焙成网格、稀疏体素或纹理<\/code><\/pre>\n<h4 id=\"s8.2.1.3\"><span class=\"num\">8.2.1.3<\/span> 3D 高斯溅射路线<\/h4>\n<p>3DGS 用一组各向异性三维高斯表示场景（位置、协方差、不透明度、球谐颜色），用可微光栅化渲染，可达上百 FPS。但原生 3DGS 并不小：每个高斯约 59 个 float，百万级高斯就是数百 MB，所以需要压缩：<\/p>\n<ol><li value=\"1\"><strong>剪枝<\/strong>：去掉对渲染贡献小的高斯，例如 LightGaussian 的全局重要性分数；<\/li><li value=\"2\"><strong>锚点 + 神经解码<\/strong>：Scaffold-GS 用稀疏锚点和 MLP 生成局部高斯；HAC 在此基础上用哈希网格建模锚点属性的上下文，再做熵编码，报告相对原生 3DGS 有数十倍以上压缩；<\/li><li value=\"3\"><strong>量化<\/strong>：球谐系数向量量化（码本），位置和尺度低比特量化；<\/li><li value=\"4\"><strong>熵编码<\/strong>；<\/li><li value=\"5\"><strong>城市尺度<\/strong>：CityGaussian、VastGaussian 分块训练，Octree-GS 按视距选择细节层级，流式加载可见块；<\/li><li value=\"6\"><strong>激光初始化<\/strong>：用激光点云初始化高斯，几何更准，例如 LiDAR-GS、Gaussian-LIC、GS-LIVO。<\/li><\/ol>\n<h4 id=\"s8.2.1.4\"><span class=\"num\">8.2.1.4<\/span> 推荐的工程方案<\/h4>\n<pre class=\"code\"><code>原始扫描 -&gt; 位姿优化后的全局点云 -&gt; 体素去重 + 动态物体去除（见 28.2）\n  |\n  +- 几何层（定位用，必须保真）\n  |    降采样点云、NDT 栅格或平面体素；按瓦片 LRU 加载\n  |\n  +- 外观层（可视化、仿真用）\n       瓦片化 3DGS（激光初始化）-&gt; 剪枝 -&gt; 锚点化 -&gt; 球谐向量量化 -&gt; 熵编码\n       细节层级 + 视锥流式加载<\/code><\/pre>\n<p>要点：不要用神经外观层替代定位用的几何层，神经表征在训练分布外区域会“幻觉”出几何，而定位需要可验证的几何精度；动态物体必须在训练前去除，否则会以半透明伪影的形式被“烧”进模型；训练算力和增量更新代价也要算进去，地图变化时只重训受影响的瓦片。<\/p><\/section>\n<section class=\"sec\" data-sec=\"8.2.2\"><h3 id=\"s8.2.2\"><span class=\"num\">8.2.2<\/span> 动态物体的“幽灵轨迹”怎样在后处理中擦除？<\/h3>\n<h4 id=\"s8.2.2.1\"><span class=\"num\">8.2.2.1<\/span> 原理：射线穿过的地方，在那一时刻是空的<\/h4>\n<p>一次激光测量说明两件事：从传感器到端点的射线上是空的，端点处有物体。动态物体在<code>t_1<\/code> 时刻占据某个体素，<code>t_2<\/code> 时刻离开，后来的射线穿过这个体素，它就被观测为空。综合所有时刻：被反复观测为空的体素中出现过的点，就是动态点。<\/p>\n<h4 id=\"s8.2.2.2\"><span class=\"num\">8.2.2.2<\/span> 占据栅格的对数几率更新<\/h4>\n<pre class=\"code\"><code>l_t(m) = l_(t-1)(m) + log( p(m | z_t) / (1 - p(m | z_t)) ) - l_0\n\n端点所在体素：     加 l_hit，例如 p_hit  = 0.7\n射线穿过的体素：   加 l_miss，例如 p_miss = 0.4（3D DDA 或 Bresenham 遍历）\n钳位：            l 限制在 [l_min, l_max]<\/code><\/pre>\n<p>钳位很重要：否则被观测上千次“占据”的体素永远无法被清除，地图对变化失去响应。<\/p>\n<p>后处理判定：对每个地图点所在体素统计命中次数 <code>N_hit<\/code> 和穿过次数 <code>N_miss<\/code>：<\/p>\n<pre class=\"code\"><code>dynamic_score = N_miss / (N_hit + N_miss)\ndynamic_score 超过阈值且 N_miss 足够大 -&gt; 删除<\/code><\/pre>\n<h4 id=\"s8.2.2.3\"><span class=\"num\">8.2.2.3<\/span> 必须处理的坑<\/h4>\n<ol><li value=\"1\"><strong>掠射角误删地面<\/strong>：远处射线几乎平行于地面，离散化后会“穿过”地面体素，把静态地面判成空，地面被挖空。对策：射线在端点前提前若干体素截止；入射角过小的射线不做清除；先做地面分割，地面点不参与动态判定。<\/li><li value=\"2\"><strong>离散化和位姿误差<\/strong>：端点附近的体素被相邻射线互相清除。对策：多分辨率判定，粗分辨率判定、细分辨率恢复；或用距离图像比较（见下表 Removert）。<\/li><li value=\"3\"><strong>可穿透物体<\/strong>：植被、栅栏、玻璃会被射线穿过而误删。对策：引入语义，或要求多次一致的穿过。<\/li><li value=\"4\"><strong>半静态物体<\/strong>：采集期间从未移动的停放车辆，射线法无法删除。对策：语义先验加多会话比较（见 8.3.3.2 的变化检测）。<\/li><li value=\"5\"><strong>计算量<\/strong>：大规模射线遍历很慢。只在后处理时做，使用优化后的位姿，并用 GPU 并行或对射线降采样。<\/li><\/ol>\n<h4 id=\"s8.2.2.4\"><span class=\"num\">8.2.2.4<\/span> 代表性方法<\/h4>\n<div class=\"tbl\"><table><thead><tr><th>方法<\/th><th>思路<\/th><\/tr><\/thead><tbody><tr><td>OctoMap<\/td><td>概率占据 + 射线更新，可在线使用，掠射角问题明显<\/td><\/tr><tr><td>Removert（IROS 2020）<\/td><td>把地图投影到每个扫描视角的距离图像；若扫描距离大于地图点距离（能“看穿”地图点），该地图点是动态的；先删除，再在多个分辨率下恢复误删的静态点<\/td><\/tr><tr><td>ERASOR（RA-L 2021）<\/td><td>不做射线，在自车为中心的极坐标 bin 中比较高度差构成的伪占据，用地面拟合保护地面，速度快<\/td><\/tr><tr><td>DUFOMap、Dynablox、BeautyMap 等<\/td><td>改进的射线或空闲空间推理，提升对稀疏雷达和在线场景的适用性<\/td><\/tr><\/tbody><\/table><\/div>\n<p>评价时要同时看静态点保留率（PR）和动态点剔除率（RR）。只看 RR 会鼓励“把地面一起删光”。<\/p>\n<h4 id=\"s8.2.2.5\"><span class=\"num\">8.2.2.5<\/span> 推荐的后处理流程<\/h4>\n<pre class=\"code\"><code>1. 使用回环和全局优化后的位姿；位姿误差本身会被误判成“动态”\n2. 地面分割，地面点受保护\n3. 可选：语义先验，行人和车辆类点作为高概率动态候选\n4. 射线遍历统计命中和穿过次数；端点前留安全距离，掠射射线不清除\n5. 动态分数阈值 + 最少穿过次数 -&gt; 删除\n6. 多分辨率恢复：粗分辨率判为静态的区域，恢复细分辨率中误删的点\n7. 输出静态地图和动态点，动态点用于统计和调参<\/code><\/pre>\n<figure class=\"anim\"><div class=\"player\"><video src=\"vid/raycast_dynamic.mp4\" poster=\"vid/raycast_dynamic.jpg\" muted loop playsinline preload=\"none\" aria-label=\"动画 27：只累积命中点会留下幽灵轨迹；占据概率更新（命中 +，射线穿过 −）在车离开后把它擦掉\"><\/video><\/div><figcaption><span class=\"badge\">动画 27<\/span>只累积命中点会留下幽灵轨迹；占据概率更新（命中 +，射线穿过 −）在车离开后把它擦掉<\/figcaption><\/figure><\/section>\n<section class=\"sec\" data-sec=\"8.2.3\"><h3 id=\"s8.2.3\"><span class=\"num\">8.2.3<\/span> 多层建筑中 Z 轴漂移导致楼层穿模：怎样用气压计和 2.5D 楼层拓扑锁定？<\/h3>\n<p>第 7.3 章从时间、外参、回环和地图写入分析了错层。本节专门处理多层建筑（地下车库连通地上商场）中的 Z 轴问题。<\/p>\n<h4 id=\"s8.2.3.1\"><span class=\"num\">8.2.3.1<\/span> Z 轴漂移从哪里来？<\/h4>\n<ul><li>LIO 的 roll、pitch 由重力可观，但小的俯仰误差会在长距离行驶中积分成高度误差：<\/li><\/ul>\n<pre class=\"code\"><code>1° 俯仰误差 × 100 m ≈ 1.7 m 高度误差<\/code><\/pre>\n<ul><li>螺旋坡道和长坡道几何相似，配准容易沿坡道方向滑动；<\/li><li>跨楼层的错误回环：不同楼层的车库几乎一样。这是“穿模”最常见也最致命的原因，一条错误回环就能把两层地图拉到一起（见 7.3.6 节）。<\/li><\/ul>\n<h4 id=\"s8.2.3.2\"><span class=\"num\">8.2.3.2<\/span> 气压计：用相对高度，不用绝对高度<\/h4>\n<p>压高公式（标准大气近似）：<\/p>\n<pre class=\"code\"><code>h = (T_0 / L) * [ 1 - (p / p_0)^(R*L / (g*M)) ]\n\n近地面近似：delta_h ≈ -8.3 m/hPa × delta_p（随温度变化）<\/code><\/pre>\n<p>MEMS 气压计短时间内的相对精度可达约 0.1 m 量级。但它有几个问题：天气变化在数小时内可达数 hPa，即数十米；商场与车库之间有 HVAC 正负压，开门瞬间会突变；电梯井有“活塞效应”；还有温度漂移。因此：<\/p>\n<ol><li value=\"1\"><strong>建模为带偏置的相对测量<\/strong>：状态中加入气压偏置 <code>b_p<\/code>，按随机游走变化：<\/li><\/ol>\n<pre class=\"code\"><code>相对因子：e = (z_i - z_j) - (h(p_i) - h(p_j))     只用于时间相近的关键帧\n绝对因子：e = z_i - (h(p_i) + b_p)                b_p 缓慢游走<\/code><\/pre>\n<ol><li value=\"2\"><strong>差分气压<\/strong>：同一楼宇内有固定参考气压计时，做差分消除天气变化；<\/li><li value=\"3\"><strong>门控<\/strong>：气压突变（开门、电梯）时降权或丢弃；以 LIO 高度为主，气压只约束低频漂移；<\/li><li value=\"4\"><strong>辅助识别楼层转移<\/strong>：气压变化率加上 IMU 垂直加速度，判断是否正在上下坡道或乘电梯。<\/li><\/ol>\n<h4 id=\"s8.2.3.3\"><span class=\"num\">8.2.3.3<\/span> 2.5D 楼层拓扑约束<\/h4>\n<p>核心思想：机器人绝大部分时间在平面楼层上，楼层是离散的；楼层之间只通过少数“连接器”（坡道、电梯、扶梯）转移。<\/p>\n<ol><li value=\"1\"><strong>楼层变量与平面约束<\/strong>：<\/li><\/ol>\n<pre class=\"code\"><code>每个楼层 f 引入高度变量 h_f（地库有排水坡度时可再加平面法向）\n在该楼层行驶的关键帧：\n  z_i - h_f = c_mount                 c_mount 为传感器安装高度\n  roll、pitch 相对地面平面的约束      来自激光地面分割拟合的平面\n同一楼层的所有关键帧共享 h_f<\/code><\/pre>\n<p>高度漂移被“焊死”在楼层平面上，并且跨时间一致。<\/p>\n<ol><li value=\"2\"><strong>楼层状态机<\/strong>：<\/li><\/ol>\n<pre class=\"code\"><code>平面行驶：地面平面稳定、气压稳定、pitch 约为 0 -&gt; 归属当前楼层，加楼层约束\n转移中：  持续 pitch（坡道）或垂直加速度、气压快速变化（电梯）\n          -&gt; 不加楼层约束，只加坡道上的相对约束\n转移结束：按高度差匹配已有楼层\n          差值在阈值内 -&gt; 复用 h_f；否则 -&gt; 新建楼层\n          楼层间高差可加先验（层高一般 3.5 至 6 m，车库可查图纸）<\/code><\/pre>\n<ol><li value=\"3\"><strong>回环门控<\/strong>，防穿模最关键的一环：回环候选必须楼层 ID 一致，或高度差小于半个层高；跨楼层候选直接拒绝，再用 8.3.2 节的 PCM、DCS 做最后一道防线。<\/li><li value=\"4\"><strong>地图组织<\/strong>：每层一张 2D 栅格或 2.5D 高程图，加上层间连接器（坡道出入口、电梯位置）组成的拓扑图。这就是 2.5D：几何上是分层的 2D，拓扑上是连通的 3D。导航先在拓扑层规划楼层序列，再在各层地图上规划路径。<\/li><li value=\"5\"><strong>电梯的特殊性<\/strong>：轿厢是封闭空间，激光几何不变，LIO 会认为“静止”，而实际在垂直移动；加速度计只在启停时有信号。需要用气压和 IMU 检测电梯运动，出电梯后重定位到目标楼层的地图。<\/li><\/ol>\n<figure class=\"anim\"><div class=\"player\"><video src=\"vid/multifloor_z.mp4\" poster=\"vid/multifloor_z.jpg\" muted loop playsinline preload=\"none\" aria-label=\"动画 28：多层建筑：俯仰小偏差让 Z 漂移，假回环把两层拉到一起；楼层平面约束 + 回环门控把 Z 锁住\"><\/video><\/div><figcaption><span class=\"badge\">动画 28<\/span>多层建筑：俯仰小偏差让 Z 漂移，假回环把两层拉到一起；楼层平面约束 + 回环门控把 Z 锁住<\/figcaption><\/figure><\/section>\n<section class=\"sec\" data-sec=\"8.2.4\"><h3 id=\"s8.2.4\"><span class=\"num\">8.2.4<\/span> 2D 语义分割怎样投影到 3D 体素？多视角标签冲突怎样处理？<\/h3>\n<p>第 8.1.3 节给出了语义地图的建立流程。本节展开其中的概率融合部分。<\/p>\n<h4 id=\"s8.2.4.1\"><span class=\"num\">8.2.4.1<\/span> 从像素到体素<\/h4>\n<p><strong>关联方式<\/strong>：<\/p>\n<pre class=\"code\"><code>激光点 -&gt; 图像：u = project(K, T_c_l * p_l)，取像素处的类别概率向量\n深度图 -&gt; 3D：  每个像素反投影到三维，再落入体素<\/code><\/pre>\n<p><strong>必须处理的细节<\/strong>：<\/p>\n<ul><li><strong>时间同步与运动补偿<\/strong>：相机曝光时刻与激光点时刻不同，需要用插值位姿补偿，否则高速时语义“错位”（见 7.5.6、9.5.2 节）；<\/li><li><strong>遮挡判断<\/strong>：多个激光点可能投影到同一像素，只有最近的那个真的被看到；被遮挡的点不应获得该像素标签，否则前景物体的标签会“涂”到后面的墙上。做法是先建 z-buffer，只有深度与 z-buffer 一致的点才接受标签；<\/li><li><strong>视场边界与畸变<\/strong>：去畸变后投影，丢弃出界点。<\/li><\/ul>\n<h4 id=\"s8.2.4.2\"><span class=\"num\">8.2.4.2<\/span> 每个体素的递归贝叶斯更新<\/h4>\n<p>体素 <code>v<\/code> 维护类别分布 <code>p(l_v = k | z_1:t)<\/code>。假设各次观测条件独立：<\/p>\n<pre class=\"code\"><code>p(l_v = k | z_1:t)  正比于  p(z_t | l_v = k) * p(l_v = k | z_1:t-1)<\/code><\/pre>\n<p>用分割网络的 softmax 输出近似似然，在对数域累加，数值更稳定：<\/p>\n<pre class=\"code\"><code>L_t(k) = L_(t-1)(k) + w_t * log p_t(k)\n\n最终标签 = arg max_k L(k)\n语义不确定度 = 熵 H = -Σ_k p(k) * log p(k)<\/code><\/pre>\n<p><code>w_t<\/code> 是本次观测的可信度权重，见下一小节。<\/p>\n<p>另一种常用做法是 Dirichlet 计数：<\/p>\n<pre class=\"code\"><code>alpha_k &lt;- alpha_k + w * p(k)\n需要适应变化时：alpha &lt;- gamma * alpha     gamma 为遗忘因子<\/code><\/pre>\n<p>它能区分“没观测过”和“观测过但很不确定”。<\/p>\n<h4 id=\"s8.2.4.3\"><span class=\"num\">8.2.4.3<\/span> 多视角标签冲突从哪里来？怎样处理？<\/h4>\n<div class=\"tbl\"><table><thead><tr><th>冲突来源<\/th><th>处理<\/th><\/tr><\/thead><tbody><tr><td>物体边界处标签渗漏：分割在边缘最不准，投影误差也在边缘最大<\/td><td>按“到分割边界的距离”降权；对掩码做腐蚀；边界像素不参与更新<\/td><\/tr><tr><td>远距离、掠射角的观测质量差<\/td><td>权重 <code>w_t<\/code> 随距离和入射角衰减<\/td><\/tr><tr><td>softmax 过度自信<\/td><td>用温度缩放标定；低置信像素降权或忽略<\/td><\/tr><tr><td>同一物体从不同角度看像不同类别<\/td><td>贝叶斯累积自然投票；用类别混淆矩阵 p(z = j | l = k) 作观测模型，比直接用 softmax 更合理<\/td><\/tr><tr><td>动态物体（路过的行人留下“行人”标签）<\/td><td>动态类别不写入静态语义层，或配合 8.2.2 节的射线清除<\/td><\/tr><tr><td>空间上相邻体素标签噪声<\/td><td>3D CRF 或图模型平滑：一元项来自累积概率，二元项鼓励几何、颜色相近的邻居同标签<\/td><\/tr><\/tbody><\/table><\/div>\n<h4 id=\"s8.2.4.4\"><span class=\"num\">8.2.4.4<\/span> 从体素语义到物体语义<\/h4>\n<p>体素投票无法区分同类的两个实例。物体级方法（Fusion++、PanopticFusion、Voxblox++、Kimera）先做实例分割，再按 3D 重叠和匈牙利匹配做跨帧实例关联，每个物体维护自己的类别分布和几何，冲突在物体层面投票解决。开放词汇方法把 CLIP 等特征融合到 3D，支持自然语言查询（见 8.1.5 节）。<\/p>\n<p>内存方面，每个体素只存前几个类别的对数概率和一个“其他”项，类别多时可显著节省内存。<\/p><\/section>\n<section class=\"sec\" data-sec=\"8.2.5\"><h3 id=\"s8.2.5\"><span class=\"num\">8.2.5<\/span> 本章面试题与参考答案<\/h3>\n<p>先自己作答，再对照答案；答案后括号注明对应小节。<\/p>\n<h4>题目<\/h4>\n<ol><li value=\"1\">“用 NeRF/3DGS 把 TB 级点云压到 MB 级”这句话有哪些需要澄清的地方？<\/li><li value=\"2\">原生 3DGS 为什么并不小？有哪些压缩手段？<\/li><li value=\"3\">为什么不建议用神经外观层替代定位用的几何地图？<\/li><li value=\"4\">写出占据栅格的对数几率更新式。为什么要钳位？<\/li><li value=\"5\">射线法去除动态物体时，为什么容易误删地面？怎样避免？<\/li><li value=\"6\">气压计为什么不能直接给绝对高度？在因子图中怎样使用它？<\/li><li value=\"7\">2.5D 楼层拓扑约束怎样锁定 Z 轴？防止楼层穿模最关键的一步是什么？<\/li><li value=\"8\">2D 语义投影到 3D 时，为什么要做遮挡判断？多视角标签冲突有哪些来源，怎样处理？<\/li><\/ol>\n<h4>参考答案<\/h4>\n<p><strong>1. 压缩预期<\/strong><\/p>\n<p>原始扫描高度冗余，去重和体素化就能压很多；神经表征再利用表面连续性进一步压缩。压缩是有损的，要按渲染、定位、规划区分精度需求。（见 8.2.1.1）<\/p>\n<p><strong>2. 3DGS 压缩<\/strong><\/p>\n<p>每个高斯约 59 个 float，百万级高斯为数百 MB。手段包括剪枝、锚点加神经解码、球谐向量量化、低比特量化、熵编码，以及分块和细节层级流式加载。（见 8.2.1.3）<\/p>\n<p><strong>3. 几何层与外观层<\/strong><\/p>\n<p>神经表征在训练分布外会“幻觉”出几何，定位需要可验证的厘米级精度；所以几何层保留显式表示，神经层只用于可视化和仿真。（见 8.2.1.4）<\/p>\n<p><strong>4. 对数几率<\/strong><\/p>\n<p><code>l_t = l_(t-1) + log(p/(1-p)) - l_0<\/code>，端点加 <code>l_hit<\/code>，穿过的体素加 <code>l_miss<\/code>。不钳位时，被观测很多次的体素对数几率极大，环境变化后永远无法清除。（见 8.2.2.2）<\/p>\n<p><strong>5. 掠射角<\/strong><\/p>\n<p>远处射线几乎平行于地面，离散化后“穿过”地面体素。对策：射线在端点前截止、入射角过小不清除、先做地面分割保护地面，评估时同时看 PR 和 RR。（见 8.2.2.3、8.2.2.4）<\/p>\n<p><strong>6. 气压计<\/strong><\/p>\n<p>天气、HVAC 压差、开门和电梯都会改变气压，绝对高度可能偏差数十米。在因子图中作为相邻关键帧的相对高度因子，或作为带随机游走偏置的绝对因子，并在突变时门控。（见 8.2.3.2）<\/p>\n<p><strong>7. 楼层拓扑<\/strong><\/p>\n<p>同一楼层的关键帧共享楼层高度变量 <code>h_f<\/code>，加地面平面约束，用状态机识别楼层转移。最关键的是回环门控：跨楼层的回环候选直接拒绝。（见 8.2.3.3、7.3.6）<\/p>\n<p><strong>8. 语义投影<\/strong><\/p>\n<p>多个点投影到同一像素时，只有最近的点被看到，不做遮挡判断会把前景标签涂到背景上。冲突来源有边界渗漏、远距离和掠射角、softmax 过度自信、视角依赖、动态物体和空间噪声；对应用边界降权、距离和角度加权、温度标定、混淆矩阵观测模型、动态类别分层和 CRF平滑处理。（见 8.2.4.1、8.2.4.3）<\/p><\/section>", "sections": [{"id": "8.2.1", "title": "怎样用 NeRF 或 3DGS 把大规模点云地图压缩并实时渲染？"}, {"id": "8.2.2", "title": "动态物体的“幽灵轨迹”怎样在后处理中擦除？"}, {"id": "8.2.3", "title": "多层建筑中 Z 轴漂移导致楼层穿模：怎样用气压计和 2.5D 楼层拓扑锁定？"}, {"id": "8.2.4", "title": "2D 语义分割怎样投影到 3D 体素？多视角标签冲突怎样处理？"}, {"id": "8.2.5", "title": "本章面试题与参考答案"}]}, {"num": "8.3", "title": "大规模后端：规模控制、鲁棒回环、多会话与线性求解", "html": "<section class=\"sec\" data-sec=\"8.3.0\"><div class=\"callout tip\"><strong>为什么现在学这一章<\/strong>：第 4 级的 iSAM2 和第 7 级的回环放大到城市级：图越来越大怎么办、漏网的假回环怎样免疫、多次采集的轨迹怎样对齐、线性方程组怎样针对 SLAM 结构加速。<\/div>\n<p>第 4.2 章用小例子讲清了 g2o、GTSAM 和 iSAM2。本章讨论它们放大到城市级、长期运行时遇到的四个问题：图越来越大、假回环、多次采集的轨迹怎样对齐、线性求解怎样加速。<\/p><\/section>\n<section class=\"sec\" data-sec=\"8.3.1\"><h3 id=\"s8.3.1\"><span class=\"num\">8.3.1<\/span> PGO 规模无限增长：怎样用节点稀疏化和 iSAM2 维持计算量？<\/h3>\n<h4 id=\"s8.3.1.1\"><span class=\"num\">8.3.1.1<\/span> 增长来自哪里？<\/h4>\n<ul><li>节点数随时间增长：按固定距离或时间插关键帧，同一区域反复经过时节点不断累积；<\/li><li>边数随节点数和回环数增长：长期在同一区域运行，回环越来越多；<\/li><li>单次求解代价：批量 GN 每次迭代都要分解整个 <code>H<\/code>，回环让图出现环，消元产生填充。<\/li><\/ul>\n<p>目标应分两层表述：在线计算量与运行时间无关，只与当前局部有关；内存与探索面积成正比，而不是与运行时间成正比。<\/p>\n<h4 id=\"s8.3.1.2\"><span class=\"num\">8.3.1.2<\/span> 第一层：只在有新信息时加节点<\/h4>\n<ol><li value=\"1\"><strong>按信息量选关键帧<\/strong>：除了距离和角度阈值，再加“与已有地图的重叠率”判据。重访已建区域时不新建节点，而是把观测作为与旧节点之间的约束。Johannsson 等的reduced pose graph（ICRA 2013）就是这样做的，节点数只随探索面积增长。<\/li><li value=\"2\"><strong>子图分层<\/strong>：像 Cartographer 一样，局部用扫描构建子图，后端节点是子图位姿；还可以做层次化位姿图，粗层只有子图节点，细层按需展开。<\/li><\/ol>\n<h4 id=\"s8.3.1.3\"><span class=\"num\">8.3.1.3<\/span> 第二层：节点稀疏化——删除节点但尽量不丢信息<\/h4>\n<p>直接删除节点会丢失约束；直接边缘化又会产生稠密团：被删节点的所有邻居两两相连（见 4.5.2 节的填充），长期下来图越来越稠密，反而更慢。正确做法是“边缘化 + 稀疏近似”：<\/p>\n<pre class=\"code\"><code>1. 选择要删除的节点\n   信息论准则：删除对地图互信息贡献最小的节点（Kretzschmar 和 Stachniss，IJRR 2012）\n   工程做法：同一空间格子内只保留一个节点\n\n2. 精确边缘化\n   对被删节点做 Schur 补，得到其马尔可夫毯（相邻节点）上的稠密信息矩阵\n\n3. 稀疏近似\n   Chow-Liu 树：在马尔可夫毯上求最大互信息生成树，用树上的两两约束近似稠密团\n   GLC（Carlevaris-Bianco 和 Eustice）：用广义线性约束表示稠密团，在相对坐标中表达\n   NFR（Mazuran 等，RSS 2014）：选定稀疏的非线性因子拓扑，最小化与精确边缘分布的\n       KL 散度来求因子的测量值和信息矩阵，得到可以重新线性化的非线性因子<\/code><\/pre>\n<p>结果：节点数受空间约束，每个节点的度数有上界，图的总规模与面积成正比。<\/p>\n<h4 id=\"s8.3.1.4\"><span class=\"num\">8.3.1.4<\/span> 第三层：iSAM2 的 Bayes tree 怎样只做局部计算？<\/h4>\n<p>第 4.2.7、4.2.8 节已经用小例子说明 Bayes tree 保存的是消元得到的条件密度。这里关注它为什么能让大部分更新只做局部计算：<\/p>\n<pre class=\"code\"><code>变量消元 -&gt; 每个变量得到条件密度 p(x_i | Sep_i)\n团（clique）组织成树，根团是最后消元的变量\n新因子加入时：\n  只有包含相关变量的团，以及从这些团到根的路径受影响\n  -&gt; 把受影响部分剪下，转回因子图\n  -&gt; 加入新因子，对这个小子图重新排序（CCOLAMD，最新变量排在最后，即靠近根）\n  -&gt; 重新消元，把未受影响的孤儿子树接回去<\/code><\/pre>\n<p>再加两种节省：<\/p>\n<ul><li><strong>流体重线性化<\/strong>：只有线性化点变化超过阈值的变量才重新线性化（见 4.2.9 节）；<\/li><li><strong>部分状态更新<\/strong>：回代时，某团的更新量小于阈值，就不再向其子树传播。<\/li><\/ul>\n<p>复杂度：<\/p>\n<div class=\"tbl\"><table><thead><tr><th>情况<\/th><th>受影响范围<\/th><th>代价<\/th><\/tr><\/thead><tbody><tr><td>只加里程计<\/td><td>根附近的团<\/td><td>均摊 O(1)<\/td><\/tr><tr><td>小回环<\/td><td>回环两端到根的路径<\/td><td>较小<\/td><\/tr><tr><td>大回环<\/td><td>路径上包含环上大量变量<\/td><td>可能与环长成正比，甚至更大<\/td><\/tr><\/tbody><\/table><\/div>\n<p>所以 iSAM2 本身不能自动保证常数复杂度，也不限制内存，必须配合下面的手段。<\/p>\n<h4 id=\"s8.3.1.5\"><span class=\"num\">8.3.1.5<\/span> 怎样借助 Bayes tree 做到真正有界？<\/h4>\n<ol><li value=\"1\"><strong>固定滞后平滑器<\/strong>：GTSAM 的 <code>IncrementalFixedLagSmoother<\/code> 基于 iSAM2，强制把最老的变量排在消元顺序最前面，于是它们位于 Bayes tree 的叶子。边缘化叶子团只需丢弃其条件密度、把它对 separator 的边缘作为先验因子，代价 O(1)，不触及树的其他部分。关键在于变量顺序的设计：要丢弃的变量在叶子，活跃变量在根。<\/li><li value=\"2\"><strong>前后端并行<\/strong>（Concurrent Filtering and Smoothing，Williams 等 ICRA 2014）：前端固定滞后平滑器保证实时和常数代价；后端在独立线程对稀疏化后的全局位姿图做较慢的全局优化，大回环在后端处理，不阻塞前端；两者通过共享的 separator 同步。<\/li><li value=\"3\"><strong>大回环单独处理<\/strong>：大回环时在后台线程做一次批量 LM，之后回到增量模式；或者在子图层面闭环，节点少得多。<\/li><\/ol>\n<h4 id=\"s8.3.1.6\"><span class=\"num\">8.3.1.6<\/span> 推荐的系统设计<\/h4>\n<pre class=\"code\"><code>前端：LIO/VIO（滤波或固定滞后平滑，O(1)）\n  | 关键帧（信息量判据；重访时不新建节点，改加约束）\n  v\n中层：iSAM2 增量后端（新变量在根部，里程计更新 O(1)）\n  | 周期性节点稀疏化：选点 -&gt; 边缘化 -&gt; Chow-Liu 或 NFR 稀疏近似\n  v\n后层：子图级全局位姿图（大回环、多会话合并，后台低频批量优化）\n  关键帧点云和描述子落盘，内存中只保留节点和因子<\/code><\/pre>\n<p>在线计算近似常数，内存与探索面积成正比，大回环的尖峰代价被隔离在后台线程。<\/p><\/section>\n<section class=\"sec\" data-sec=\"8.3.2\"><h3 id=\"s8.3.2\"><span class=\"num\">8.3.2<\/span> 回环假阳性：怎样设计鲁棒后端？<\/h3>\n<p>第 7.3.6 节列出了回环验证的检查项，并指出鲁棒核不能代替回环验证。本节回答：验证后仍有漏网的假回环时，后端怎样免疫。<\/p>\n<h4 id=\"s8.3.2.1\"><span class=\"num\">8.3.2.1<\/span> 为什么普通鲁棒核不够？<\/h4>\n<p>鲁棒核（Huber、Cauchy）在误差已经很大时降低权重。但一条错误回环刚加入时，如果它的信息矩阵很大（例如 ICP 收敛得很好），第一次迭代就会把图拉偏；此后它的残差反而变小，被拉伸的真实里程计边残差变大，鲁棒核反而给里程计边降权。所以需要显式的“开关”决策，或者在加入前做一致性筛选。<\/p>\n<h4 id=\"s8.3.2.2\"><span class=\"num\">8.3.2.2<\/span> Switchable Constraints 与 DCS<\/h4>\n<p>Switchable Constraints（Sünderhauf 和 Protzel，IROS 2012）给每条回环一个开关变量<code>s_ij<\/code>，取值在 0 到 1 之间，作为优化变量：<\/p>\n<pre class=\"code\"><code>F = Σ_odom  e_ij^T * Omega_ij * e_ij\n  + Σ_loop  (psi(s_ij) * e_ij)^T * Omega_ij * (psi(s_ij) * e_ij)\n  + Σ_loop  (1 - s_ij)^2 / Xi_ij<\/code><\/pre>\n<ul><li><code>psi(s)<\/code> 通常取 <code>s<\/code> 本身或 sigmoid，乘在回环残差上；<\/li><li>最后一项让开关默认打开，<code>Xi<\/code> 控制“关掉一条回环”的代价；<\/li><li>若某回环与其他约束严重冲突，把 <code>s<\/code> 降到 0 的代价小于保留它的代价，优化器就会关掉它。<\/li><\/ul>\n<p>DCS（Dynamic Covariance Scaling，Agarwal 等 ICRA 2013）证明开关在最优处有闭式解：<\/p>\n<pre class=\"code\"><code>chi2_ij = e_ij^T * Omega_ij * e_ij\ns_ij    = min(1, 2*Phi / (Phi + chi2_ij))<\/code><\/pre>\n<p>不需要额外变量，实现上等价于一种特殊鲁棒核，收敛更快。<\/p>\n<h4 id=\"s8.3.2.3\"><span class=\"num\">8.3.2.3<\/span> Max-Mixture<\/h4>\n<p>Max-Mixture（Olson 和 Agarwal，RSS 2012）把回环的测量模型写成混合高斯：一个分量表示“回环正确”（正常协方差），另一个表示“回环错误”（协方差极大的空假设）：<\/p>\n<pre class=\"code\"><code>p(z | x) = Σ_k w_k * N(mu_k, Sigma_k)<\/code><\/pre>\n<p>求和的对数不是二次型，不能直接用最小二乘。Max-Mixture 用最大值近似求和：<\/p>\n<pre class=\"code\"><code>p(z | x) approximately_equals max_k  w_k * N(mu_k, Sigma_k)<\/code><\/pre>\n<p>每次迭代先为每条边选出当前似然最大的分量，之后就是普通最小二乘。残差大时“错误”分量胜出，这条边的信息几乎为 0。它保持了最小二乘结构，开销小，还能表达多模态，例如对称走廊的两种可能位姿。<\/p>\n<h4 id=\"s8.3.2.4\"><span class=\"num\">8.3.2.4<\/span> PCM：两两一致性最大化<\/h4>\n<p>PCM（Pairwise Consistency Maximization，Mangelson 等 ICRA 2018）的思想是：正确的回环之间两两一致，错误的回环一般不与其他回环一致。<\/p>\n<pre class=\"code\"><code>1. 对回环 z_ik（i -&gt; k）和 z_jl（j -&gt; l），沿里程计 i -&gt; j 和 k -&gt; l 组成一个闭环：\n   eps = inverse(z_ik) * T_ij_odom * z_jl * T_lk_odom\n   计算 eps 的马氏距离（协方差由各段传播得到，见 3.19 节）\n\n2. 马氏距离小于卡方阈值 -&gt; 两条回环一致，在“一致性图”上连一条边\n\n3. 求一致性图的最大团，接受团内回环，拒绝其他<\/code><\/pre>\n<p>最大团是 NP 难问题，但论文给出了精确和启发式求解器，几百条回环可以接受。PCM 在加入优化之前筛选，特别适合多机器人和多会话：会话之间没有里程计，其他方法无从判断（见 8.3.3 节）。<\/p>\n<h4 id=\"s8.3.2.5\"><span class=\"num\">8.3.2.5<\/span> GNC：逐步非凸<\/h4>\n<p>GNC（Graduated Non-Convexity，Yang 等 RA-L 2020）使用截断最小二乘等非凸鲁棒代价，从一个凸的替代函数开始，逐步增大非凸性，迭代加权求解；不依赖初值，外点比例很高时仍可工作。GTSAM 提供 <code>GncOptimizer<\/code>。Kimera-RPGO 就是“PCM 预筛 + GNC 优化”的组合。<\/p>\n<h4 id=\"s8.3.2.6\"><span class=\"num\">8.3.2.6<\/span> 工程上的多道防线<\/h4>\n<div class=\"tbl\"><table><thead><tr><th>层<\/th><th>措施<\/th><\/tr><\/thead><tbody><tr><td>候选检索<\/td><td>时间和空间门限；场景识别分数阈值；楼层或高度一致性门控（见 8.2.3）<\/td><\/tr><tr><td>几何验证<\/td><td>ICP fitness、重叠率、Hessian 最小特征值（退化场景的 ICP 结果直接拒绝）；视觉内点数和内点分布<\/td><\/tr><tr><td>时序一致性<\/td><td>连续多帧检测到同一地点才接受<\/td><\/tr><tr><td>集合一致性<\/td><td>PCM 最大团，多会话必备<\/td><\/tr><tr><td>优化中<\/td><td>Switchable Constraints、DCS、Max-Mixture 或 GNC；回环协方差不要设得过小<\/td><\/tr><tr><td>优化后<\/td><td>检查里程计边残差的卡方分布，大量里程计边被拉伸说明接受了坏回环，用 iSAM2 的 <code>removeFactorIndices<\/code> 撤销<\/td><\/tr><\/tbody><\/table><\/div><\/section>\n<section class=\"sec\" data-sec=\"8.3.3\"><h3 id=\"s8.3.3\"><span class=\"num\">8.3.3<\/span> 多会话众包轨迹：初始误差很大时怎样做全局对齐？<\/h3>\n<p>构建高精地图时，要把不同车辆、不同时间采集的轨迹对齐融合。<\/p>\n<h4 id=\"s8.3.3.1\"><span class=\"num\">8.3.3.1<\/span> 难点<\/h4>\n<ul><li>不同车辆、不同传感器，标定和精度各不相同，每段轨迹自带漂移；<\/li><li>会话之间没有里程计连接，初始对齐可能差几十米（城市峡谷中的低成本 GNSS），甚至完全未知；<\/li><li>场景随时间变化（施工、季节、停放车辆），跨会话匹配更难，外点更多；<\/li><li>规模大：城市级、上千条轨迹。<\/li><\/ul>\n<h4 id=\"s8.3.3.2\"><span class=\"num\">8.3.3.2<\/span> 框架：粗对齐 -&gt; 鲁棒跨会话关联 -&gt; 联合优化 -&gt; 地图融合<\/h4>\n<p><strong>第一步：每个会话独立建图<\/strong>。每条轨迹先做自身的 SLAM 和 PGO（含会话内回环），得到局部一致的子图，并记录协方差。<\/p>\n<p><strong>第二步：用锚点节点表示会话间未知的刚体变换<\/strong>。每个会话 <code>s<\/code> 引入一个锚节点<code>A_s<\/code>（Kim 等 ICRA 2010 的 multiple relative pose graphs）：<\/p>\n<pre class=\"code\"><code>会话内节点在自身局部系表达\n世界坐标 = A_s * x_i_s\n跨会话约束连接 A_s * x_i_s 与 A_t * x_j_t<\/code><\/pre>\n<p>好处是初始对齐错误只体现在一个锚变量上，优化时移动锚点即可，不会扭曲会话内部结构。<\/p>\n<p><strong>第三步：粗对齐，解决初始误差很大的问题<\/strong>：<\/p>\n<ul><li>有 GNSS：给锚点加大协方差的先验；城市峡谷多路径时协方差要自适应，或加鲁棒核；<\/li><li>没有可靠 GNSS：用全局场景识别得到跨会话候选，描述子可以是 Scan Context、学习型描述子，或车道线、杆状物、交通标志、路口拓扑等语义地标；<\/li><li>用不依赖初值的全局配准：FPFH + TEASER++ 或 RANSAC，或基于语义地标的图匹配；<\/li><li>对高精地图而言，矢量化的语义要素（车道线、路沿、停止线）比原始点云更稳定，也更适合低成本众包传感器之间的匹配。<\/li><\/ul>\n<p><strong>第四步：跨会话关联的鲁棒性<\/strong>。跨会话没有里程计可以交叉检验，所以 PCM 几乎是必选：两条跨会话回环若一致，它们推出的锚点相对变换也应一致（见 8.3.2.4）。之后用 GNC 或 DCS做联合优化。<\/p>\n<p><strong>第五步：联合全局优化<\/strong>：<\/p>\n<pre class=\"code\"><code>变量：所有会话的锚点 + 会话内节点（或会话内子图节点，以降低规模）\n因子：会话内里程计和回环 + 跨会话约束 + GNSS 先验\n      + 语义地标约束（地标作为共享变量，多个会话观测同一车道线或杆子，类似 BA）\n\n求解：由粗到细\n  先只优化锚点：每个会话一个 6 自由度变量，变量很少，可以多次重启、全局搜索\n  再放开子图节点\n  最后放开全部节点\n\n大规模：按地理瓦片分区，瓦片内优化，边界变量做 Schur 补后在瓦片层面优化，并行求解<\/code><\/pre>\n<p><strong>第六步：地图融合与变化检测<\/strong>：<\/p>\n<ul><li>对齐后，矢量要素按空间聚类，多源加权融合，权重来自会话位姿协方差和传感器质量；<\/li><li>新会话与已有地图不一致时，要区分是对齐误差还是真实变化（如施工改道）；多次观测一致的变化才更新地图，这与 7.3.8 节“不能看到一次就修改”是同一原则；<\/li><li>维护地图版本和每个要素的置信度，便于增量更新。<\/li><\/ul>\n<h4 id=\"s8.3.3.3\"><span class=\"num\">8.3.3.3<\/span> 怎样评估对齐质量？<\/h4>\n<p>跨会话重叠区域内的一致性（例如同一车道线多会话拟合的横向偏差）；与少量高精度控制点（RTK 实测）比较的绝对精度；优化后残差的卡方分布检验。<\/p><\/section>\n<section class=\"sec\" data-sec=\"8.3.4\"><h3 id=\"s8.3.4\"><span class=\"num\">8.3.4<\/span> 线性求解占大头：怎样针对 SLAM 结构自定义预条件子？<\/h3>\n<h4 id=\"s8.3.4.1\"><span class=\"num\">8.3.4.1<\/span> 线性系统长什么样？<\/h4>\n<p>每次 GN 或 LM 迭代都要解 <code>H * delta_x = -b<\/code>。<\/p>\n<p>BA：变量分为相机 c 和路标 p：<\/p>\n<pre class=\"code\"><code>H = [ B    E ]\n    [ E^T  C ]       C 是 3 × 3 块对角\n\nSchur 补消去路标：\nS = B - E * inverse(C) * E^T      简化相机系统，规模只与相机数有关<\/code><\/pre>\n<p><code>S<\/code> 的稀疏结构由共视关系决定。<\/p>\n<p>PGO：<code>H<\/code> 由 6 × 6 块组成，块稀疏结构等于图的邻接结构。里程计链让 <code>H<\/code> 呈块三对角，回环边只在三对角之外添加少量非零块。<\/p>\n<h4 id=\"s8.3.4.2\"><span class=\"num\">8.3.4.2<\/span> 直接法还是迭代法？<\/h4>\n<ul><li><strong>稀疏 Cholesky<\/strong>（CHOLMOD、Eigen、SuiteSparse）：中小规模最快最稳。关键是填充最少的重排序（AMD、COLAMD、METIS 嵌套剖分）；迭代之间稀疏模式不变，符号分解只做一次，之后只重做数值分解；超节点方法利用稠密块 BLAS。<\/li><li><strong>预条件共轭梯度（PCG）<\/strong>：规模极大、直接分解内存放不下时使用。收敛速度由<code>inverse(M) * H<\/code> 的特征值聚集程度决定，预条件子 <code>M<\/code> 的好坏决定一切。<\/li><\/ul>\n<h4 id=\"s8.3.4.3\"><span class=\"num\">8.3.4.3<\/span> 有哪些预条件子？<\/h4>\n<ol><li value=\"1\"><strong>块 Jacobi<\/strong>：<code>M = blkdiag(H_ii)<\/code>，对每个 6 × 6（或相机 9 × 9）对角块求逆。代价极低、易并行，但对长链结构效果差：整条轨迹的“弯曲”这种低频误差收敛极慢。<\/li><li value=\"2\"><strong>Schur-Jacobi<\/strong>（Ceres 的 <code>SCHUR_JACOBI<\/code>）：在简化相机系统 <code>S<\/code> 上取块对角；<code>S<\/code>不显式构造，乘法按 <code>S*v = B*v - E*(inverse(C)*(E^T*v))<\/code> 隐式计算。<\/li><li value=\"3\"><strong>按可见性聚类<\/strong>（Ceres 的 <code>CLUSTER_JACOBI<\/code>、<code>CLUSTER_TRIDIAGONAL<\/code>）：按共视强度把相机聚成簇，保留簇内和相邻簇之间的块，适合大规模 BA。<\/li><li value=\"4\"><strong>子图预条件子<\/strong>，最契合 SLAM 结构（Dellaert 等 IROS 2010，Jian 等 ICCV 2011）：<\/li><\/ol>\n<pre class=\"code\"><code>把因子图拆成：生成树（例如里程计链或最大权生成树）+ 其余的回环边\n生成树对应的 H_T 消元没有填充，可以 O(n) 精确分解\n  对里程计链就是块三对角的 Thomas 算法\n取 M = H_T：\n  inverse(M) * H = I + inverse(M) * H_loop\n回环边远少于节点数时，只有少数特征值偏离 1 -&gt; PCG 只需很少迭代<\/code><\/pre>\n<p>生成树选信息最强的边，效果最好。<\/p>\n<ol><li value=\"5\"><strong>不完全 Cholesky<\/strong>：保留原稀疏模式的近似分解，通用性强，但并行性差，可能需要对角平移防止分解失败。<\/li><li value=\"6\"><strong>多重网格或层次预条件子<\/strong>：用子图或关键帧聚合构建粗层位姿图，粗层直接求解消除低频误差，细层用块 Jacobi 平滑高频误差，与 SLAM 的层次图天然吻合。<\/li><\/ol>\n<h4 id=\"s8.3.4.4\"><span class=\"num\">8.3.4.4<\/span> 其他加速手段<\/h4>\n<ul><li><strong>非精确牛顿<\/strong>：外层 LM 早期不需要精确解，按 Eisenstat-Walker 准则放宽 PCG 容差；<\/li><li><strong>暖启动<\/strong>：用上一次的解作为 PCG 初值；<\/li><li><strong>块稀疏存储 + SIMD<\/strong>：固定尺寸块用 Eigen 固定尺寸矩阵，矩阵向量乘可以向量化；<\/li><li><strong>增量求解<\/strong>：在线场景用 iSAM2（见 8.3.1.4），避免每次全量求解；<\/li><li><strong>GPU<\/strong>：PCG 中的矩阵向量乘天然适合 GPU；<\/li><li><strong>先 profile<\/strong>：确认确实是线性求解占主导，而不是残差和雅可比计算（自动求导开销、重复的 <code>Exp<\/code>、<code>Log<\/code>）；后者可用解析雅可比或缓存优化（见 9.1.4 节）。<\/li><\/ul>\n<h4 id=\"s8.3.4.5\"><span class=\"num\">8.3.4.5<\/span> 块三对角预条件子实现示意<\/h4>\n<p>适用于以里程计链为主干的 PGO：<code>M<\/code> 只保留 <code>H<\/code> 中的 <code>(i,i)<\/code> 和 <code>(i,i+1)<\/code> 块，用块Thomas 算法分解，回环边交给 PCG 迭代处理。<\/p>\n<pre class=\"code\"><code>// D[i] = H_(i,i)，U[i] = H_(i,i+1)，H_(i+1,i) = U[i]^T\nstruct BlockTridiagPrecond {\n  using Mat6 = Eigen::Matrix&lt;double, 6, 6&gt;;\n  std::vector&lt;Mat6&gt; D, U, L;\n  std::vector&lt;Eigen::LLT&lt;Mat6&gt;&gt; fac;\n\n  void factorize() {  // O(n)，每次 LM 迭代做一次\n    const size_t n = D.size();\n    fac.resize(n);\n    L.resize(n);\n    fac[0].compute(D[0]);\n    for (size_t i = 1; i &lt; n; ++i) {\n      L[i] = fac[i - 1].solve(U[i - 1]).transpose();  // U^T * inverse(D&#x27;_(i-1))\n      fac[i].compute(D[i] - L[i] * U[i - 1]);        // Schur 补 D&#x27;_i\n    }\n  }\n\n  void apply(const Eigen::VectorXd&amp; r, Eigen::VectorXd&amp; z) const {  // z = inverse(M) * r\n    const size_t n = D.size();\n    Eigen::VectorXd y = r;\n    for (size_t i = 1; i &lt; n; ++i)\n      y.segment&lt;6&gt;(6 * i) -= L[i] * y.segment&lt;6&gt;(6 * (i - 1));\n    z.resize(6 * n);\n    z.segment&lt;6&gt;(6 * (n - 1)) = fac[n - 1].solve(y.segment&lt;6&gt;(6 * (n - 1)));\n    for (size_t i = n - 1; i-- &gt; 0;)\n      z.segment&lt;6&gt;(6 * i) =\n          fac[i].solve(y.segment&lt;6&gt;(6 * i) - U[i] * z.segment&lt;6&gt;(6 * (i + 1)));\n  }\n};<\/code><\/pre>\n<p>回环越少、越弱，PCG 迭代次数越少。<\/p><\/section>\n<section class=\"sec\" data-sec=\"8.3.5\"><h3 id=\"s8.3.5\"><span class=\"num\">8.3.5<\/span> 本章面试题与参考答案<\/h3>\n<p>先自己作答，再对照答案；答案后括号注明对应小节。<\/p>\n<h4>题目<\/h4>\n<ol><li value=\"1\">PGO 规模随时间增长，来源有哪些？目标应当怎样表述？<\/li><li value=\"2\">为什么直接边缘化旧节点会让图越来越慢？节点稀疏化怎样解决？<\/li><li value=\"3\">iSAM2 加入新因子时，哪些部分需要重新计算？大回环时为什么代价仍然很大？<\/li><li value=\"4\">固定滞后平滑器怎样借助 Bayes tree 做到 O(1) 边缘化？<\/li><li value=\"5\">为什么鲁棒核不能可靠地免疫错误回环？<\/li><li value=\"6\">比较 Switchable Constraints、Max-Mixture、PCM 和 GNC 的思路和适用场景。<\/li><li value=\"7\">多会话对齐中，锚点节点解决什么问题？初始误差很大时怎样做粗对齐？<\/li><li value=\"8\">为什么子图预条件子适合 PGO？写出它让 PCG 收敛快的原因。<\/li><\/ol>\n<h4>参考答案<\/h4>\n<p><strong>1. 增长来源与目标<\/strong><\/p>\n<p>节点随时间增长、边随回环增长、批量求解每次分解整个 <code>H<\/code>。目标是在线计算与运行时间无关、内存与探索面积成正比。（见 8.3.1.1）<\/p>\n<p><strong>2. 节点稀疏化<\/strong><\/p>\n<p>边缘化会让被删节点的所有邻居两两相连，产生稠密团。稀疏化先精确边缘化，再用 Chow-Liu树、GLC 或 NFR 把稠密团近似成稀疏因子；NFR 最小化 KL 散度，得到可重新线性化的非线性因子。（见 8.3.1.3）<\/p>\n<p><strong>3. iSAM2 增量更新<\/strong><\/p>\n<p>只有包含相关变量的团及其到根的路径需要剪下、重排序、重新消元。大回环时这条路径上包含环上大量变量，所以代价可能与环长成正比。（见 8.3.1.4、4.2.7）<\/p>\n<p><strong>4. 固定滞后平滑<\/strong><\/p>\n<p>把最老的变量排在消元顺序最前面，使其位于 Bayes tree 叶子；边缘化叶子团只需丢弃条件密度并把对 separator 的边缘作为先验，不影响树的其他部分。（见 8.3.1.5）<\/p>\n<p><strong>5. 鲁棒核的局限<\/strong><\/p>\n<p>错误回环若信息矩阵很大，第一次迭代就把图拉偏，此后它的残差变小，被拉伸的里程计边残差变大，鲁棒核反而压低了正确约束的权重。（见 8.3.2.1、7.3.6）<\/p>\n<p><strong>6. 四种方法<\/strong><\/p>\n<p>Switchable Constraints 用开关变量让优化器自己关掉冲突回环，DCS 是其闭式形式；Max-Mixture 用“正确/错误”两个高斯分量，每次迭代取最大分量，能表达多模态；PCM在优化前用两两一致性图的最大团筛选回环，适合多会话；GNC 从凸替代逐步过渡到非凸鲁棒代价，不依赖初值。（见 8.3.2.2 至 8.3.2.5）<\/p>\n<p><strong>7. 多会话<\/strong><\/p>\n<p>锚点把会话间未知的刚体变换集中到一个变量上，优化时移动锚点而不扭曲会话内结构。粗对齐用带大协方差的 GNSS 先验，或场景识别 + 不依赖初值的全局配准，再用 PCM 筛选跨会话约束，由粗到细优化。（见 8.3.3.2）<\/p>\n<p><strong>8. 子图预条件子<\/strong><\/p>\n<p>生成树（如里程计链）对应的 <code>H_T<\/code> 可以无填充地 O(n) 分解；<code>inverse(M)*H =I + inverse(M)*H_loop<\/code>，回环边少时只有少数特征值偏离 1，PCG 很快收敛。（见 8.3.4.3）<\/p><\/section>", "sections": [{"id": "8.3.1", "title": "PGO 规模无限增长：怎样用节点稀疏化和 iSAM2 维持计算量？"}, {"id": "8.3.2", "title": "回环假阳性：怎样设计鲁棒后端？"}, {"id": "8.3.3", "title": "多会话众包轨迹：初始误差很大时怎样做全局对齐？"}, {"id": "8.3.4", "title": "线性求解占大头：怎样针对 SLAM 结构自定义预条件子？"}, {"id": "8.3.5", "title": "本章面试题与参考答案"}]}]}, {"key": "L9", "label": "第 9 级", "title": "综合复习、项目深挖与发展方向", "intro": "<div class=\"callout goal\"><strong>这一级的用途<\/strong>：面试前的总复习和项目自查。知识地图把全书压缩成可速查的几页；项目十二问用一个具体系统串起场景、状态、模型、残差、权重、退化和诊断；因果链把五个问题连成一条线。最后两章是后续发展方向：机器人 Agent 与多模态感知。<\/div>", "chapters": [{"num": "9.1", "title": "SLAM 面试基础知识地图", "html": "<section class=\"sec\" data-sec=\"9.1.0\"><div class=\"callout tip\"><strong>为什么现在学这一章<\/strong>：这一章是前面各级的浓缩版，适合面试前快速过一遍。每个小节都能在前面找到完整推导。（原“运动模型、观测模型和噪声模型”一节已前移到 1.3。）<\/div>\n<p>本章把面试中经常同时出现的基础概念串起来。前面各章已经详细推导过的内容，这里不重复抄写整段公式，而是回答三件事：它是什么、为什么需要它、它与系统代码怎样对应。<\/p>\n<p>可以先记住下面这条主线：<\/p>\n<pre class=\"code\"><code>坐标系和位姿表示\n  -&gt; 用运动模型预测状态\n  -&gt; 用观测模型预测传感器读数\n  -&gt; 实际读数减预测读数得到残差\n  -&gt; 用协方差对白化残差\n  -&gt; MLE/MAP 变成加权最小二乘\n  -&gt; 用雅可比、Gauss-Newton 或 LM 求解\n  -&gt; 用滤波或图优化组织不同时刻的状态\n  -&gt; 用回环、边缘化和退化检测保证长期运行<\/code><\/pre><\/section>\n<section class=\"sec\" data-sec=\"9.1.1\"><h3 id=\"s9.1.1\"><span class=\"num\">9.1.1<\/span> 坐标系、旋转矩阵、四元数和李群李代数<\/h3>\n<h4 id=\"s9.1.1.1\"><span class=\"num\">9.1.1.1<\/span> 为什么必须先说清坐标系？<\/h4>\n<p>同一个三维点，在 LiDAR、IMU、机器人本体和地图坐标系中的数值通常不同。常见坐标系包括：<\/p>\n<div class=\"tbl\"><table><thead><tr><th>符号<\/th><th>工程中的常见名字<\/th><th>含义<\/th><\/tr><\/thead><tbody><tr><td><code>W<\/code><\/td><td><code>map<\/code> 或 world<\/td><td>全局地图坐标系<\/td><\/tr><tr><td><code>O<\/code><\/td><td><code>odom<\/code><\/td><td>连续但允许缓慢漂移的局部坐标系<\/td><\/tr><tr><td><code>B<\/code><\/td><td><code>base_link<\/code><\/td><td>机器人本体坐标系<\/td><\/tr><tr><td><code>I<\/code><\/td><td>IMU frame<\/td><td>IMU 坐标系<\/td><\/tr><tr><td><code>L<\/code><\/td><td>LiDAR frame<\/td><td>激光雷达坐标系<\/td><\/tr><\/tbody><\/table><\/div>\n<p>本文约定 <code>T_A_B<\/code> 表示“把 B 坐标系中的坐标变换到 A 坐标系”。若点 <code>p<\/code> 在 B 系中的坐标是 <code>p_B<\/code>，则：<\/p>\n<pre class=\"code\"><code>p_A = R_A_B * p_B + t_A_B<\/code><\/pre>\n<p>这里：<\/p>\n<ul><li><code>R_A_B<\/code> 负责旋转；<\/li><li><code>t_A_B<\/code> 是 B 坐标系原点在 A 坐标系中的位置；<\/li><li>结果 <code>p_A<\/code> 和 <code>t_A_B<\/code> 都用 A 坐标系表达。<\/li><\/ul>\n<p>把旋转和平移写成一个齐次变换矩阵：<\/p>\n<pre class=\"code\"><code>T_A_B = [R_A_B  t_A_B]\n        [  0        1  ]<\/code><\/pre>\n<p>变换可以直接连乘：<\/p>\n<pre class=\"code\"><code>T_W_L = T_W_I * T_I_L<\/code><\/pre>\n<p>读法是：先把 LiDAR 点从 L 系变到 I 系，再从 I 系变到 W 系。逆变换为：<\/p>\n<pre class=\"code\"><code>R_B_A = R_A_B^T\nt_B_A = -R_A_B^T * t_A_B<\/code><\/pre>\n<p>工程中最常见的错误不是不会乘矩阵，而是 <code>T_A_B<\/code> 的方向、左右乘约定或坐标轴定义没有说清楚。<\/p>\n<h4 id=\"s9.1.1.2\"><span class=\"num\">9.1.1.2<\/span> 旋转矩阵和四元数分别解决什么问题？<\/h4>\n<p>三维旋转矩阵 <code>R<\/code> 满足：<\/p>\n<pre class=\"code\"><code>R^T * R = I\ndet(R) = 1<\/code><\/pre>\n<p>它有 9 个数，但只有 3 个自由度。优点是旋转点非常直接：<\/p>\n<pre class=\"code\"><code>p_rotated = R * p<\/code><\/pre>\n<p>缺点是存储量较大，而且优化时不能把 9 个元素当成普通数随意更新，否则会破坏正交约束。<\/p>\n<p>四元数常写成：<\/p>\n<pre class=\"code\"><code>q = [w, x, y, z]^T<\/code><\/pre>\n<p>合法旋转要求 <code>q^T*q = 1<\/code>。四元数适合保存旋转和进行插值，但要注意：<\/p>\n<ul><li><code>q<\/code> 和 <code>-q<\/code> 表示同一个旋转；<\/li><li>数值积分后要重新归一化；<\/li><li>不同库可能使用 <code>[w,x,y,z]<\/code> 或 <code>[x,y,z,w]<\/code>；<\/li><li>不同库的主动/被动旋转及乘法顺序可能不同。<\/li><\/ul>\n<p>所以四元数没有消除坐标系问题，只是换了一种旋转表示。<\/p>\n<h4 id=\"s9.1.1.3\"><span class=\"num\">9.1.1.3<\/span> 为什么还需要 SO(3)、SE(3) 和李代数？<\/h4>\n<p><code>SO(3)<\/code> 是全部合法三维旋转矩阵构成的集合，<code>SE(3)<\/code> 是全部合法三维刚体位姿构成的集合。它们不是普通欧氏向量空间：两个旋转矩阵逐元素相加，一般不再是旋转矩阵。<\/p>\n<p>优化器却需要计算“给当前位姿增加一个很小的修正”。常用办法是在当前旋转或位姿附近，用普通三维或六维小向量表示局部修正。以右扰动为例：<\/p>\n<pre class=\"code\"><code>R_new = R * Exp(skew(delta_theta))\nT_new = T * Exp(hat(delta_xi))<\/code><\/pre>\n<p>其中：<\/p>\n<ul><li><code>delta_theta<\/code> 是三维小旋转；<\/li><li><code>delta_xi<\/code> 是六维小位姿修正；<\/li><li><code>skew<\/code> 把三维小旋转变成 <code>3 × 3<\/code> 反对称矩阵；<\/li><li><code>hat<\/code> 把六维小位姿修正变成 <code>4 × 4<\/code> 李代数矩阵；<\/li><li><code>Exp<\/code> 把局部小向量映射回合法的旋转或位姿。<\/li><\/ul>\n<p>这就是李代数在 SLAM 中最实际的用途：优化器在局部向量空间求 <code>delta_xi<\/code>，更新后仍然得到合法位姿。左扰动和右扰动都可以使用，但雅可比不同，推导与代码必须采用同一种约定。第 3.5.1 节和第 3.5.13 节给出了进一步说明。<\/p><\/section>\n<section class=\"sec\" data-sec=\"9.1.2\"><h3 id=\"s9.1.2\"><span class=\"num\">9.1.2<\/span> 残差、协方差、信息矩阵和白化<\/h3>\n<p>实际测量与预测测量之差定义为残差：<\/p>\n<pre class=\"code\"><code>r(x) = z - h(x)<\/code><\/pre>\n<p>也可以反过来定义成 <code>h(x)-z<\/code>，但残差、雅可比和更新方程的符号必须一致。特别需要区分：<\/p>\n<pre class=\"code\"><code>在真实状态 x_true 处：r(x_true) = v\n在一般候选状态 x 处：r(x) 不一定等于真实噪声 v<\/code><\/pre>\n<p>候选状态错误、外参错误、时间不同步和数据关联错误都会进入残差。<\/p>\n<p>若一个残差有 <code>m<\/code> 个分量，其协方差 <code>Sigma<\/code> 就是 <code>m × m<\/code> 矩阵：<\/p>\n<pre class=\"code\"><code>Sigma = E[(r - E[r]) * (r - E[r])^T]<\/code><\/pre>\n<p>对角线表示各分量方差，非对角线表示分量之间的相关性。信息矩阵定义为：<\/p>\n<pre class=\"code\"><code>Omega = Sigma^-1<\/code><\/pre>\n<p>协方差越大，说明测量越不确定；对应的信息越小，优化权重也越小。<\/p>\n<p>若 <code>Sigma = L*L^T<\/code>，白化残差定义为：<\/p>\n<pre class=\"code\"><code>e = L^-1 * r<\/code><\/pre>\n<p>于是：<\/p>\n<pre class=\"code\"><code>e^T * e = r^T * Sigma^-1 * r<\/code><\/pre>\n<p>白化的直观含义是把米、弧度、像素等不同尺度的残差换成“相差多少个标准差”。白化后做普通平方和，与原始残差做加权最小二乘是同一件事。完整推导见第 1.5、1.6.3、1.6.4 和 2.4.5 节。<\/p><\/section>\n<section class=\"sec\" data-sec=\"9.1.3\"><h3 id=\"s9.1.3\"><span class=\"num\">9.1.3<\/span> 最大似然、最大后验与加权最小二乘<\/h3>\n<p>已知候选状态 <code>x<\/code> 时，噪声模型给出测量出现的密度：<\/p>\n<pre class=\"code\"><code>p(z | x)<\/code><\/pre>\n<p>当实际测量 <code>z<\/code> 已经固定，把同一个式子看成候选状态 <code>x<\/code> 的函数时，它叫似然。最大似然估计 MLE 寻找最能解释全部测量的状态：<\/p>\n<pre class=\"code\"><code>x_MLE = arg max_x p(z | x)<\/code><\/pre>\n<p>若各残差独立且服从高斯分布，对联合似然取负对数后得到：<\/p>\n<pre class=\"code\"><code>x_MLE\n= arg min_x 0.5 * sum_i [r_i(x)^T * Sigma_i^-1 * r_i(x)]<\/code><\/pre>\n<p>这就是加权最小二乘。若还有状态先验 <code>p(x)<\/code>，贝叶斯公式给出：<\/p>\n<pre class=\"code\"><code>p(x | z) proportional_to p(z | x) * p(x)<\/code><\/pre>\n<p>最大化后验密度得到 MAP。若先验也是高斯分布，就在测量代价之外增加一个先验残差：<\/p>\n<pre class=\"code\"><code>x_MAP = arg min_x {\n  0.5 * r_prior^T * Sigma_prior^-1 * r_prior\n  + 0.5 * sum_i [r_i^T * Sigma_i^-1 * r_i]\n}<\/code><\/pre>\n<p>因此：<\/p>\n<ul><li>MLE 只使用测量；<\/li><li>MAP 使用测量和先验；<\/li><li>加权最小二乘是高斯假设下计算 MLE/MAP 的形式；<\/li><li>白化是实现加权最小二乘的一种等价方式。<\/li><\/ul>\n<p>从概率到代价函数的逐步推导见第 2.1.1、2.3.1 和 2.4 节。<\/p><\/section>\n<section class=\"sec\" data-sec=\"9.1.4\"><h3 id=\"s9.1.4\"><span class=\"num\">9.1.4<\/span> Gauss-Newton、LM、雅可比和 Hessian<\/h3>\n<p>非线性残差不能一次直接解出最优状态。先在当前估计 <code>x<\/code> 附近做一阶展开：<\/p>\n<pre class=\"code\"><code>r(x plus delta_x) approximately_equals r(x) + J * delta_x<\/code><\/pre>\n<p>这里 <code>J<\/code> 是残差对局部状态修正的雅可比。若残差有 <code>m<\/code> 维、状态修正有 <code>n<\/code> 维，则 <code>J<\/code> 的尺寸为 <code>m × n<\/code>。<\/p>\n<p>代入加权最小二乘并对 <code>delta_x<\/code> 求导，得到 Gauss-Newton 方程：<\/p>\n<pre class=\"code\"><code>H_GN * delta_x = -b\n\nH_GN = J^T * Omega * J\nb    = J^T * Omega * r<\/code><\/pre>\n<p><code>H_GN<\/code> 是目标函数 Hessian 的近似。它把“残差对状态是否敏感”和“测量是否可靠”合在一起。小特征值对应弱约束方向，详细解释见第 3.1.4 至 3.3.1 节。<\/p>\n<p>LM 在方程左侧增加阻尼：<\/p>\n<pre class=\"code\"><code>(H_GN + lambda * D) * delta_x = -b<\/code><\/pre>\n<p><code>D<\/code> 可以取单位矩阵或 <code>H_GN<\/code> 的对角部分。当前模型可靠时减小 <code>lambda<\/code>，接近Gauss-Newton；线性化不可靠时增大 <code>lambda<\/code>，步子变小，更接近梯度下降。<\/p>\n<p>雅可比有三种常见计算方式：<\/p>\n<div class=\"tbl\"><table><thead><tr><th>方式<\/th><th>优点<\/th><th>风险及用途<\/th><\/tr><\/thead><tbody><tr><td>解析求导<\/td><td>快、精度高、可利用稀疏结构<\/td><td>容易写错坐标系、扰动方向和符号<\/td><\/tr><tr><td>自动求导<\/td><td>减少手推错误，适合复杂残差<\/td><td>编译和运行开销可能更高<\/td><\/tr><tr><td>数值差分<\/td><td>容易实现，适合核对结果<\/td><td>对步长敏感，通常不作为高频生产方案<\/td><\/tr><\/tbody><\/table><\/div>\n<p>工程上常用解析或自动求导运行，用中心差分离线检查：<\/p>\n<pre class=\"code\"><code>J(:,j)\napproximately_equals\n[r(x plus epsilon*e_j) - r(x minus epsilon*e_j)] / (2*epsilon)<\/code><\/pre>\n<p>位姿不能直接逐元素加减；这里的 <code>plus/minus<\/code> 应当使用与程序一致的流形扰动。<\/p><\/section>\n<section class=\"sec\" data-sec=\"9.1.5\"><h3 id=\"s9.1.5\"><span class=\"num\">9.1.5<\/span> 滤波与图优化的区别<\/h3>\n<p>两者都在融合运动信息、测量信息和先验，不是两个完全无关的理论。<\/p>\n<div class=\"tbl\"><table><thead><tr><th>对比项<\/th><th>滤波<\/th><th>图优化/平滑<\/th><\/tr><\/thead><tbody><tr><td>主要状态<\/td><td>当前状态及其协方差<\/td><td>一段时间或全部关键帧状态<\/td><\/tr><tr><td>新测量到来<\/td><td>预测、更新，递推处理<\/td><td>增加因子并重新求解相关变量<\/td><\/tr><tr><td>历史状态<\/td><td>通常被压缩进当前先验<\/td><td>可显式保留，回环时可重估<\/td><\/tr><tr><td>计算特性<\/td><td>延迟低，适合高频里程计<\/td><td>全局一致性强，适合关键帧和回环<\/td><\/tr><tr><td>常见系统<\/td><td>ESKF、IEKF、FAST-LIO2 前端<\/td><td>位姿图、因子图、LIO-SAM 后端<\/td><\/tr><\/tbody><\/table><\/div>\n<p>在线性高斯条件下，卡尔曼滤波与批量最小二乘可以得到相同结果；非线性时，两者的线性化点、边缘化和重线性化策略不同，结果未必完全一致。详细推导见第 4.1、4.3 章。<\/p><\/section>\n<section class=\"sec\" data-sec=\"9.1.6\"><h3 id=\"s9.1.6\"><span class=\"num\">9.1.6<\/span> 回环检测、数据关联、边缘化和可观性<\/h3>\n<p>这四个概念分别回答不同问题：<\/p>\n<h4>数据关联：这条测量属于地图中的谁？<\/h4>\n<p>激光最近邻、视觉特征匹配以及“当前物体是不是以前那个物体”都属于数据关联。错误关联会产生结构上完全错误的残差，单纯增大迭代次数无法修复。<\/p>\n<h4>回环检测：机器人是否回到了以前来过的地方？<\/h4>\n<p>可靠回环通常包括：<\/p>\n<pre class=\"code\"><code>候选地点检索\n  -&gt; 几何匹配验证\n  -&gt; 检查重叠率、残差和相对位姿\n  -&gt; 通过后加入回环因子\n  -&gt; 使用鲁棒核或可切换约束降低假回环风险<\/code><\/pre>\n<p>回环检测负责提出并验证约束，图优化负责用该约束修正历史轨迹，两者不能混为一谈。<\/p>\n<h4>边缘化：窗口有限时，怎样删除旧变量但保留其信息？<\/h4>\n<p>滑动窗口不能无限增长。边缘化利用 Schur 补消去旧状态，并把旧测量的信息压缩成剩余状态的先验。它不是简单删除数据；代价是先验依赖当时的线性化点，长期运行要留意一致性问题。第 4.2.8、4.3.4 和 3.5.13 节提供了相关背景。<\/p>\n<h4>可观性：现有测量是否足以区分某个状态方向？<\/h4>\n<p>如果状态沿某个方向变化，所有预测测量几乎不变，那么这个方向不可观或弱可观。在线性化系统里通常表现为雅可比存在零空间，或者 Hessian 出现很小的特征值。“优化已经收敛”不等于“所有方向都有足够信息”。走廊退化的完整例子见第 7.1 章。<\/p><\/section>\n<section class=\"sec\" data-sec=\"9.1.7\"><h3 id=\"s9.1.7\"><span class=\"num\">9.1.7<\/span> LiDAR 去畸变、点云匹配和点到平面残差<\/h3>\n<p>机械式 LiDAR 的一帧点云并非同一时刻采集。若机器人在扫描期间运动，直接把所有点当成帧末时刻的数据，会把墙拉弯或形成双墙。去畸变的过程是：<\/p>\n<pre class=\"code\"><code>读取每个点的采样时刻\n  -&gt; 用 IMU/里程计估计扫描期间的连续运动\n  -&gt; 把各点变换到统一参考时刻<\/code><\/pre>\n<p>时间戳或外参错误时，所谓“去畸变”反而会制造系统误差。<\/p>\n<p>点云匹配通常反复执行：<\/p>\n<pre class=\"code\"><code>用当前位姿把扫描点变到地图\n  -&gt; 搜索邻近地图点\n  -&gt; 拟合直线或平面\n  -&gt; 构造残差和雅可比\n  -&gt; 求一次位姿修正\n  -&gt; 更新位姿并重新关联<\/code><\/pre>\n<p>若邻域平面为：<\/p>\n<pre class=\"code\"><code>n^T * p + d = 0<\/code><\/pre>\n<p>其中 <code>n<\/code> 是单位法向量，当前激光点变换到世界系后为 <code>p_W(x)<\/code>，点到平面的有符号距离就是：<\/p>\n<pre class=\"code\"><code>r_L(x) = n^T * p_W(x) + d<\/code><\/pre>\n<p>点到平面残差只直接约束平面法向方向。若环境中所有法向几乎平行，某些运动方向就缺少约束，这正是 LiDAR 退化与 Hessian 小特征值之间的联系。第 11.4、11.5、11.10和 5.2.10 节有完整例子。<\/p><\/section>\n<section class=\"sec\" data-sec=\"9.1.8\"><h3 id=\"s9.1.8\"><span class=\"num\">9.1.8<\/span> LiDAR、IMU、轮速计的时间同步和外参标定<\/h3>\n<p>时间同步解决“测量发生在什么时候”，外参标定解决“测量发生在哪个坐标系”。二者都正确，才能融合。<\/p>\n<p>LiDAR 点到 IMU 系的外参关系为：<\/p>\n<pre class=\"code\"><code>p_I = R_I_L * p_L + t_I_L<\/code><\/pre>\n<p>如果 <code>R_I_L<\/code> 或 <code>t_I_L<\/code> 错误，机器人转动时最容易出现地图重影。若 LiDAR 时钟与IMU 时钟存在偏移 <code>delta_t<\/code>，则 LiDAR 标记为 <code>t<\/code> 的点，可能应当使用 IMU 在<code>t+delta_t<\/code> 附近的状态。高速转弯时，即使几毫秒误差也可能很明显。<\/p>\n<p>轮速计还要处理轮径、轮距、编码器比例和打滑。常用排查顺序是：<\/p>\n<ol><li value=\"1\">先确认坐标轴方向、单位和时间戳来源；<\/li><li value=\"2\">检查消息延迟、乱序、丢包和每点相对时间；<\/li><li value=\"3\">静止时检查 IMU bias 和重力方向；<\/li><li value=\"4\">直行检查轮速尺度，原地转动检查轮距或角速度；<\/li><li value=\"5\">用多方向转动和平移检查 LiDAR–IMU 外参；<\/li><li value=\"6\">最后再调优化权重，避免用权重掩盖系统误差。<\/li><\/ol><\/section>\n<section class=\"sec\" data-sec=\"9.1.9\"><h3 id=\"s9.1.9\"><span class=\"num\">9.1.9<\/span> 本章面试题与参考答案<\/h3>\n<p>（先自己作答，再对照答案；答案后括号注明对应小节。本章是知识地图，题目以串联题和综合题为主，答案会跨章引用。）<\/p>\n<h4>题目<\/h4>\n<ol><li value=\"1\">串联题：用一分钟从“机器人状态不可直接知道”讲到“Gauss-Newton 方程”，每一步说清为什么需要下一步。<\/li><li value=\"2\"><code>T_W_L = T_W_I * T_I_L<\/code> 怎么读？已知 <code>R_A_B<\/code>、<code>t_A_B<\/code>，逆变换是什么？工程中最常见的坐标系错误是什么？<\/li><li value=\"3\">已经有旋转矩阵和四元数了，为什么优化时还要用 <code>SO(3)<\/code>、李代数和左右扰动？追问：左扰动推的雅可比配右扰动更新会怎样？<\/li><li value=\"4\">过程噪声和测量噪声分别描述什么？把激光匹配不稳定的问题通过调大 IMU 过程噪声来“解决”，错在哪里？<\/li><li value=\"5\">残差 <code>r(x) = z - h(x)<\/code> 就是测量噪声 <code>v<\/code> 吗？为什么说候选状态、外参、时间同步错误都会“进入残差”？<\/li><li value=\"6\">串联题：白化、马氏距离、卡方检验和加权最小二乘是什么关系？三维位姿残差的平方马氏距离是 9，95% 门限下能通过吗？<\/li><li value=\"7\">雅可比和 Hessian 的区别是什么？用 <code>r(x,y) = x + 2y - 3<\/code> 说明什么是不可观方向。<\/li><li value=\"8\">陷阱题：LM 的阻尼项 <code>lambda*D<\/code> 让一个奇异的 H 变得可解了，能不能说这个方向现在有信息了？<code>H^-1<\/code> 能不能直接当成状态协方差？<\/li><li value=\"9\">卡尔曼滤波和图优化是什么关系？什么条件下等价，非线性时为什么分岔？工程上怎样组合？<\/li><li value=\"10\">数据关联、回环检测、边缘化和可观性四个概念分别回答什么问题？各举一个“做错会怎样”的例子。<\/li><li value=\"11\">为什么点到平面残差会导致长走廊退化？卡方检验通过了，能不能说明这一帧的定位是对的？<\/li><li value=\"12\">现场排查：新车装上 LiDAR、IMU 和轮速计后建图有重影，你按什么顺序查时间同步和外参？为什么“调权重”放在最后？<\/li><\/ol>\n<h4>参考答案<\/h4>\n<p><strong>1. 从状态不可知讲到 Gauss-Newton<\/strong><\/p>\n<pre class=\"code\"><code>状态不可直接测 -&gt; 用概率 p(x | z) 表示不确定的猜测\n  -&gt; 贝叶斯公式加入测量和先验，求 MLE 或 MAP\n  -&gt; 高斯噪声取负对数，得到加权最小二乘 0.5*Σ_i r_i^T*Sigma_i^-1*r_i\n  -&gt; 残差非线性，用雅可比 J 在当前估计附近线性化\n  -&gt; 得到 H_GN*delta_x = -b，H_GN = J^T*Omega*J，b = J^T*Omega*r\n  -&gt; 把 delta_x 通过 Exp 合法地写回位姿<\/code><\/pre>\n<p>每一步都在补上一步缺的东西：概率表达不确定，高斯假设把概率变成可计算的代价，雅可比让非线性代价可以迭代求解，李群保证更新后仍是合法位姿。之后再由滤波或图优化组织多个时刻，并用回环、边缘化和退化检测保证长期运行。（见 0.1、9.1 章开头主线、9.1.3、9.1.4）<\/p>\n<p><strong>2. 位姿连乘与逆变换<\/strong><\/p>\n<p><code>T_A_B<\/code> 把 B 系坐标变到 A 系，<code>p_A = R_A_B*p_B + t_A_B<\/code>，<code>t_A_B<\/code> 是 B 原点在 A 系中的位置。<code>T_W_L = T_W_I*T_I_L<\/code> 读作：先把 LiDAR 点从 L 变到 I，再从 I 变到 W；相邻下标要能“消掉”。逆变换：<\/p>\n<pre class=\"code\"><code>R_B_A = R_A_B^T\nt_B_A = -R_A_B^T * t_A_B<\/code><\/pre>\n<p>注意逆变换不是只把平移取负。工程中最常见的错误不是不会乘矩阵，而是 <code>T_A_B<\/code> 与 <code>T_B_A<\/code> 方向写反、左右乘约定或坐标轴定义没说清，例如把 <code>T_base_lidar<\/code> 当成 <code>T_lidar_base<\/code> 用，表现为转动时出现固定双墙。（见 9.1.1.1、1.2.4、1.2.5、7.3.5）<\/p>\n<p><strong>3. 为什么需要李群李代数<\/strong><\/p>\n<p>旋转矩阵 9 个数只有 3 个自由度，逐元素加减会破坏正交约束；四元数要保持单位长度，还有 <code>q<\/code> 与 <code>-q<\/code> 同一旋转、<code>[w,x,y,z]<\/code> 与 <code>[x,y,z,w]<\/code> 顺序不同的问题。优化器需要“在当前位姿附近加一个小修正”，所以在李代数的局部向量空间里求 <code>delta_theta<\/code> 或 <code>delta_xi<\/code>，再用 <code>Exp<\/code> 映射回合法旋转或位姿：<\/p>\n<pre class=\"code\"><code>R_new = R * Exp(skew(delta_theta))\nT_new = T * Exp(hat(delta_xi))<\/code><\/pre>\n<p>追问：左右扰动都可以用，但雅可比不同。用左扰动推导的雅可比配右扰动更新，求出的增量方向与实际施加的修正不对应，轻则收敛变慢，重则发散或收敛到错误结果。这正是全文第一条红线：残差、雅可比、扰动侧和协方差必须使用同一套约定。可以用中心差分按程序实际使用的流形扰动逐列核对。（见 9.1.1.2、9.1.1.3、3.5.6 至 3.5.12、0.1.1）<\/p>\n<p><strong>4. 过程噪声与测量噪声<\/strong><\/p>\n<p>过程噪声 <code>w_k<\/code> 描述运动预测有多不可靠，主要影响预测后的状态协方差；测量噪声 <code>v_k<\/code> 描述传感器读数有多不可靠，决定测量残差的权重。调大 IMU 过程噪声的含义是“不太相信仅靠 IMU 推出来的状态”，结果是系统更倾向于相信激光；而问题本身是激光不稳定，应该调的是激光测量协方差（或检测退化、门控）。两者调错位置，程序照样能跑，统计含义却是错的，还会掩盖真正的根因。（见 1.3.1.3）<\/p>\n<p><strong>5. 残差不等于噪声<\/strong><\/p>\n<p>只有在真实状态处才有 <code>r(x_true) = v<\/code>；在一般候选状态 x 处，<code>r(x)<\/code> 不一定等于真实噪声。残差是“测量减去按当前模型和候选状态算出的预测”，所以候选状态错了、外参错了、时间不同步（用错时刻的位姿预测）、数据关联错了（和错误的平面比较），都会让残差变大或变形。这也是为什么残差大不能直接归因于“传感器噪声大”，而要先排查模型和数据链路。（见 9.1.2、2.2）<\/p>\n<p><strong>6. 白化、马氏距离、卡方检验、加权最小二乘<\/strong><\/p>\n<p>若 <code>Sigma = L*L^T<\/code>，白化残差 <code>e = L^-1*r<\/code>，则 <code>e^T*e = r^T*Sigma^-1*r<\/code>，也就是平方马氏距离。它们的关系是：<\/p>\n<pre class=\"code\"><code>加权最小二乘：最小化 Σ_i r_i^T*Sigma_i^-1*r_i\n白化：把同一代价写成普通平方和，量纲变成“多少个标准差”\n卡方检验：模型正确时，m 维平方马氏距离服从自由度 m 的卡方分布，用来判断单个残差是否异常<\/code><\/pre>\n<p>三维位姿残差的平方马氏距离为 9，自由度 3 的 95% 门限是 7.815，<code>9 &gt; 7.815<\/code> 不能通过 95% 门限；但 99% 门限是 11.345，能通过较宽松的门限。反过来，9 对一维残差（门限 3.841）是明显异常，所以查门限前必须先确定自由度。（见 9.1.2、2.4.5、2.4.6、4.1.3.6）<\/p>\n<p><strong>7. 雅可比与 Hessian；不可观方向<\/strong><\/p>\n<p>雅可比 J 是向量残差对状态的一阶导数，维度 <code>残差维数 × 状态维数<\/code>，回答“状态动一点残差怎样变”；Hessian 是标量代价的二阶导数，维度 <code>状态维数 × 状态维数<\/code>，回答“代价沿某方向弯得多快”，Gauss-Newton 用 <code>J^T*Omega*J<\/code> 近似它。<\/p>\n<pre class=\"code\"><code>r(x,y) = x + 2y - 3\nJ = [1, 2]\nH_GN = J^T*J = [1, 2; 2, 4]，秩为 1，特征值为 0 和 5\nv = [2, -1]^T 时 J*v = 0<\/code><\/pre>\n<p>沿 v 移动残差不变，这就是不可观方向：J 有零空间，H 有零特征值。一个方程定不了两个未知数；走廊退化只是把 x、y 换成了位姿自由度。（见 9.1.4、3.1.5）<\/p>\n<p><strong>8. LM 阻尼与 <code>H^-1<\/code><\/strong><\/p>\n<p>不能。LM 在左侧加 <code>lambda*D<\/code> 只是让方程更好解、步长更保守，线性化不可靠时增大 <code>lambda<\/code> 更接近梯度下降；它不产生任何真实观测，弱方向仍然没有信息。把阻尼后的矩阵求逆当协方差，会把“没信息”误报成“有信息”。<\/p>\n<p><code>H^-1<\/code> 也只在线性高斯、模型正确的条件下才近似状态协方差。对应点错误、鲁棒核大量降权、把 LM 阻尼当信息、H 退化、位姿图没固定首帧（规范自由度）时，<code>H^-1<\/code> 都失去意义；对奇异 H 用伪逆还可能把零空间显示成零方差，表达成“完全确定”。实际要同时看局部 SVD、后验协方差、创新一致性和真值误差。（见 9.1.4、3.3.2、7.1.4）<\/p>\n<p><strong>9. 滤波与图优化<\/strong><\/p>\n<p>两者都在求给定测量后的状态后验。滤波把历史压缩成当前均值和协方差，递推处理，延迟低；图优化保留一段或全部历史状态，回环时可以重估历史。线性高斯、模型和数据完全相同时，标准 KF 在 k 时刻的后验等于完整线性因子图中 <code>x_k<\/code> 的边缘后验；Schur 补就是“消去旧状态但保留其信息”的代数形式。非线性时，EKF 在当前预测点线性化一次后就把信息压缩掉，无法在新轨迹上重算雅可比；图优化保留原始非线性因子，可以反复重线性化，所以大回环更适合图优化。<\/p>\n<p>工程组合：高频 ESKF 输出连续的 <code>odom -&gt; base_link<\/code>，低频因子图处理激光关键帧、GNSS 和回环，输出 <code>map -&gt; odom<\/code> 修正。最大陷阱是重复计算同一信息。（见 9.1.5、4.3.3 至 4.3.6）<\/p>\n<p><strong>10. 四个概念<\/strong><\/p>\n<pre class=\"code\"><code>数据关联：这条测量属于地图中的谁？\n  做错：错误对应产生结构性错误残差，增加迭代次数也修不好\n回环检测：是否回到了以前来过的地方？\n  做错：重复货架、相似走廊产生假回环，加入后地图突然折叠\n边缘化：窗口有限时怎样删旧变量但保留信息？\n  做错：直接删数据会丢信息；先验固定在当时线性化点，长期运行有一致性问题\n可观性：现有测量能否区分某个状态方向？\n  做错：把“优化收敛”当成“所有方向都有信息”，走廊纵向仍然是错的<\/code><\/pre>\n<p>回环检测负责提出并验证约束（候选检索、几何验证、重叠率和残差检查、鲁棒核或可切换约束），图优化负责用约束修正轨迹，两者不能混为一谈。（见 9.1.6、7.3.6）<\/p>\n<p><strong>11. 点到平面与走廊退化；卡方通过不等于定位正确<\/strong><\/p>\n<p>点到平面残差 <code>r_L(x) = n^T*p_W(x) + d<\/code> 只直接约束法向方向。走廊两侧墙法向都接近 <code>(0, ±1)<\/code>，残差对纵向平移的雅可比接近 0，H 在该方向出现小特征值。<\/p>\n<p>卡方检验通过只说明残差相对协方差不异常，它检测的是外点和错误关联；退化检测看的是某个状态方向有没有约束。走廊中完全可能出现“残差很小、卡方通过，但纵向奇异值接近零”：残差本来就看不见这个方向。两个检查不能互相替代，这就是第三条红线“优化收敛不等于所有方向都有信息”。（见 9.1.7、7.1.2、7.1.3、0.1.1）<\/p>\n<p><strong>12. 时间同步和外参的排查顺序<\/strong><\/p>\n<pre class=\"code\"><code>1. 先确认坐标轴方向、单位和时间戳来源\n2. 检查消息延迟、乱序、丢包和每点相对时间\n3. 静止时检查 IMU bias 和重力方向\n4. 直行检查轮速尺度，原地转动检查轮距或角速度\n5. 用多方向转动和平移检查 LiDAR–IMU 外参\n6. 最后再调优化权重<\/code><\/pre>\n<p>判别技巧：固定姿态下总有相同偏差更像外参问题；误差随速度或角速度增长更像时间问题；原地旋转最容易暴露时间偏移、旋转外参和杆臂错误。调权重放在最后，是因为时间和外参错误是系统误差，调权重只能把它“摊”到其他传感器上，看起来地图变好了，根因还在。（见 9.1.8、7.3.5、7.3.3）<\/p>\n<hr><\/section>", "sections": [{"id": "9.1.1", "title": "坐标系、旋转矩阵、四元数和李群李代数"}, {"id": "9.1.2", "title": "残差、协方差、信息矩阵和白化"}, {"id": "9.1.3", "title": "最大似然、最大后验与加权最小二乘"}, {"id": "9.1.4", "title": "Gauss-Newton、LM、雅可比和 Hessian"}, {"id": "9.1.5", "title": "滤波与图优化的区别"}, {"id": "9.1.6", "title": "回环检测、数据关联、边缘化和可观性"}, {"id": "9.1.7", "title": "LiDAR 去畸变、点云匹配和点到平面残差"}, {"id": "9.1.8", "title": "LiDAR、IMU、轮速计的时间同步和外参标定"}, {"id": "9.1.9", "title": "本章面试题与参考答案"}]}, {"num": "9.2", "title": "SLAM 项目深挖十二问", "html": "<section class=\"sec\" data-sec=\"9.2.0\"><div class=\"callout tip\"><strong>为什么现在学这一章<\/strong>：面试官会沿着一个项目连续追问。本章用一个统一的示例系统逐项回答十二个问题，并说明它们之间的依赖关系。<\/div>\n<p>只背十二个孤立答案很容易前后矛盾。本章统一使用下面这个示例项目：<\/p>\n<blockquote>一台室内外轮式机器人，配备 10 Hz 三维 LiDAR、200 Hz IMU、50 Hz 轮速计，部分场地可以使用 GNSS。系统需要实时输出连续里程计、建立点云地图，并通过回环或 GNSS修正长期漂移。<\/blockquote>\n<p>示例采用一种常见的混合结构：<\/p>\n<pre class=\"code\"><code>高频前端：IMU 预测 + LiDAR/轮速更新 -&gt; 连续 odom\n关键帧后端：激光相对约束 + IMU 预积分 + 轮速 + GNSS + 回环 -&gt; 全局 map<\/code><\/pre>\n<p>为避免重复计算信息，前端融合结果只给后端提供初值；后端使用各类原始因子时，不再把同一份前端融合位姿当成独立测量重复加入。实际项目若采用不同结构，应当明确哪些数据只用于初值，哪些数据真正形成优化约束。<\/p><\/section>\n<section class=\"sec\" data-sec=\"9.2.1\"><h3 id=\"s9.2.1\"><span class=\"num\">9.2.1<\/span> 问题一：系统输入、输出和使用场景是什么？<\/h3>\n<h4>面试时先简短回答<\/h4>\n<blockquote>输入是带逐点时间的三维点云、IMU、左右轮编码器以及可选 GNSS；输出是高频局部里程计、低频全局位姿、关键帧点云地图和定位质量指标。系统服务于轮式机器人在园区和厂房中的建图定位，目标是实时、连续，并能在短时激光退化时安全降级。<\/blockquote>\n<h4>为什么要这样回答？<\/h4>\n<p>“做了一个 SLAM”信息太少。输入决定能使用什么观测，输出决定系统接口，使用场景决定精度、延迟和失效策略。完整说明应包含：<\/p>\n<div class=\"tbl\"><table><thead><tr><th>项目<\/th><th>示例内容<\/th><\/tr><\/thead><tbody><tr><td>输入<\/td><td><code>PointCloud2<\/code>、IMU、轮速、可选 GNSS、静态外参和标定参数<\/td><\/tr><tr><td>实时输出<\/td><td><code>odom -&gt; base_link<\/code> 连续位姿、速度、状态协方差<\/td><\/tr><tr><td>全局输出<\/td><td><code>map -&gt; odom<\/code> 修正、关键帧轨迹、点云地图<\/td><\/tr><tr><td>质量输出<\/td><td>匹配点数、白化残差、Hessian 特征值、传感器健康状态<\/td><\/tr><tr><td>使用场景<\/td><td>厂房、园区、走廊及室内外过渡区域<\/td><\/tr><tr><td>实时要求<\/td><td>输入不能长期积压，定位延迟满足控制器要求<\/td><\/tr><tr><td>安全要求<\/td><td>低置信时不盲目入图，必要时降速、停车或请求重定位<\/td><\/tr><\/tbody><\/table><\/div>\n<p>还要主动说明边界。例如系统不承诺在大面积玻璃、纯动态人群、完全无几何结构并且GNSS 不可用的环境中长期保持厘米级精度。<\/p><\/section>\n<section class=\"sec\" data-sec=\"9.2.2\"><h3 id=\"s9.2.2\"><span class=\"num\">9.2.2<\/span> 问题二：状态量包含哪些变量？<\/h3>\n<p>前端在时刻 <code>k<\/code> 的导航状态可以写成：<\/p>\n<pre class=\"code\"><code>x_k = {\n  R_W_I,       IMU 在世界系中的姿态\n  p_W_I,       IMU 在世界系中的位置\n  v_W_I,       IMU 在世界系中的速度\n  b_g,         陀螺仪 bias\n  b_a,         加速度计 bias\n  g_W          世界系重力向量，可固定也可估计\n}<\/code><\/pre>\n<p>若在线标定，还可以加入：<\/p>\n<pre class=\"code\"><code>R_I_L, t_I_L       LiDAR 到 IMU 的外参\nscale_wheel         轮速尺度\ndelta_t_LI          LiDAR 与 IMU 的时间偏移<\/code><\/pre>\n<p>但不是变量越多越好。只有运动提供足够激励时，外参、时间偏移和 bias 才能被可靠区分；不可观的在线标定量会与位姿互相补偿，使结果看似收敛但实际错误。<\/p>\n<p>后端每个关键帧可保存：<\/p>\n<pre class=\"code\"><code>X_k = {T_W_I_k, v_W_I_k, b_g_k, b_a_k}<\/code><\/pre>\n<p>若后端只做位姿图，也可以只优化 <code>T_W_B_k<\/code>。面试中必须区分：<\/p>\n<ul><li>状态：每次优化要估计的未知量；<\/li><li>测量：LiDAR、IMU、轮速等传感器读数；<\/li><li>参数：当前固定的外参、噪声和阈值；<\/li><li>地图数据：参与匹配的点或平面，不一定全部作为优化变量。<\/li><\/ul><\/section>\n<section class=\"sec\" data-sec=\"9.2.3\"><h3 id=\"s9.2.3\"><span class=\"num\">9.2.3<\/span> 问题三：每种传感器对应什么观测模型？<\/h3>\n<h4>IMU<\/h4>\n<p>IMU 原始模型可写成：<\/p>\n<pre class=\"code\"><code>omega_m = omega_true + b_g + n_g\na_m     = R_I_W * (a_W - g_W) + b_a + n_a<\/code><\/pre>\n<p>陀螺仪测角速度，加速度计测的是包含重力影响的比力。前端通常把 IMU 用于状态传播；后端则把一段 IMU 积分压缩成连接相邻关键帧的预积分因子。IMU 不是直接测量世界系位置。<\/p>\n<h4>LiDAR<\/h4>\n<p>对当前点 <code>p_L<\/code>，先用外参和候选位姿变换到世界系：<\/p>\n<pre class=\"code\"><code>p_I = R_I_L * p_L + t_I_L\np_W = R_W_I * p_I + p_W_I<\/code><\/pre>\n<p>若地图邻域拟合出的平面是 <code>n^T*p+d=0<\/code>，预测的点到平面距离为：<\/p>\n<pre class=\"code\"><code>h_L(x) = n^T * p_W(x) + d<\/code><\/pre>\n<p>理想距离为 0，所以可以把残差写成：<\/p>\n<pre class=\"code\"><code>r_L(x) = h_L(x) - 0<\/code><\/pre>\n<p>这里使用 <code>预测-测量<\/code>，而第 2.2 节主要使用 <code>测量-预测<\/code>；二者都可以，但本因子的雅可比和更新方程要跟随该定义。<\/p>\n<h4>轮速计<\/h4>\n<p>对轮式机器人，可由左右轮增量得到这段时间的前进距离和偏航变化：<\/p>\n<pre class=\"code\"><code>z_wheel = [delta_s_measured, delta_yaw_measured]^T<\/code><\/pre>\n<p>候选的相邻位姿 <code>T_(k-1)<\/code>、<code>T_k<\/code> 也能预测同样的相对运动：<\/p>\n<pre class=\"code\"><code>h_wheel(T_(k-1), T_k)\n= [delta_s_predicted, delta_yaw_predicted]^T<\/code><\/pre>\n<p>残差为 <code>z_wheel-h_wheel<\/code>。打滑时不能继续保持正常小协方差，否则轮速会错误地拉动整条轨迹。<\/p>\n<h4>GNSS<\/h4>\n<p>若天线到 IMU 的杆臂为 <code>p_I_G<\/code>，预测天线位置为：<\/p>\n<pre class=\"code\"><code>h_gnss(x) = p_W_I + R_W_I * p_I_G<\/code><\/pre>\n<p>GNSS 残差是测得的位置减预测位置。若只给水平定位，残差和协方差就只应约束对应方向；RTK fixed、float 和普通单点定位也不应使用同一权重。<\/p>\n<h4>回环<\/h4>\n<p>若回环匹配给出关键帧 <code>i<\/code> 到 <code>j<\/code> 的相对位姿测量 <code>Z_i_j<\/code>，候选状态预测的相对位姿为 <code>T_i^-1*T_j<\/code>。残差常写成：<\/p>\n<pre class=\"code\"><code>r_loop = Log[Z_i_j^-1 * (T_i^-1 * T_j)]<\/code><\/pre>\n<p><code>Log<\/code> 把两个位姿之间的误差变成六维局部向量。回环的关键不只是写出公式，还要说明候选检索、几何验证和异常回环抑制方法。<\/p><\/section>\n<section class=\"sec\" data-sec=\"9.2.4\"><h3 id=\"s9.2.4\"><span class=\"num\">9.2.4<\/span> 问题四：残差是怎样定义的？<\/h3>\n<p>统一原则是：残差衡量实际测量与候选状态预测测量之间的不一致。对第 <code>i<\/code> 类测量：<\/p>\n<pre class=\"code\"><code>r_i(x) = z_i - h_i(x)<\/code><\/pre>\n<p>位姿、方向等非欧氏量要使用合适的局部误差，不能直接逐元素相减。实际系统会把不同残差堆叠：<\/p>\n<pre class=\"code\"><code>r_total = [\n  r_lidar\n  r_imu\n  r_wheel\n  r_gnss\n  r_loop\n]<\/code><\/pre>\n<p>不能直接比较不同残差的原始数值。例如 <code>0.05 m<\/code> 的激光误差不一定比 <code>0.02 rad<\/code>的角度误差更严重。应该先按各自协方差白化，再比较：<\/p>\n<pre class=\"code\"><code>e_i = L_i^-1 * r_i<\/code><\/pre>\n<p>每实现一个残差，至少要核对：<\/p>\n<ol><li value=\"1\">测量和预测是否在同一坐标系；<\/li><li value=\"2\">单位、分量顺序和角度方向是否一致；<\/li><li value=\"3\">残差正负号是否与雅可比一致；<\/li><li value=\"4\">协方差是否与残差维度和分量顺序一致；<\/li><li value=\"5\">零残差是否确实对应几何上完全一致；<\/li><li value=\"6\">人工扰动某个状态方向时，残差变化是否符合直觉。<\/li><\/ol><\/section>\n<section class=\"sec\" data-sec=\"9.2.5\"><h3 id=\"s9.2.5\"><span class=\"num\">9.2.5<\/span> 问题五：优化目标函数怎样从噪声分布推导出来？<\/h3>\n<p>不要直接背 <code>r^T*Omega*r<\/code>，可以按五步回答。<\/p>\n<p>第一步，假设第 <code>i<\/code> 条测量在真实状态附近满足：<\/p>\n<pre class=\"code\"><code>z_i = h_i(x) + v_i\nv_i 服从均值为 0、协方差为 Sigma_i 的高斯分布<\/code><\/pre>\n<p>第二步，在候选状态 <code>x<\/code> 处，残差为 <code>r_i=z_i-h_i(x)<\/code>。该残差在高斯模型下的密度为：<\/p>\n<pre class=\"code\"><code>p(z_i | x)\n= constant_i\n  * exp[-0.5 * r_i(x)^T * Sigma_i^-1 * r_i(x)]<\/code><\/pre>\n<p>第三步，若给定状态后各测量条件独立，全部测量的联合似然是各项相乘：<\/p>\n<pre class=\"code\"><code>p(all_z | x) = product_i p(z_i | x)<\/code><\/pre>\n<p>第四步，最大化乘积等价于最小化负对数。对数把乘法变成加法，与 <code>x<\/code> 无关的归一化常数可以去掉，得到最大似然目标：<\/p>\n<pre class=\"code\"><code>F_MLE(x)\n= 0.5 * sum_i [r_i(x)^T * Sigma_i^-1 * r_i(x)]<\/code><\/pre>\n<p>第五步，若有高斯先验 <code>x_prior<\/code>，再增加先验项，得到 MAP 目标：<\/p>\n<pre class=\"code\"><code>F_MAP(x)\n= 0.5 * r_prior^T * Sigma_prior^-1 * r_prior\n  + 0.5 * sum_i [r_i^T * Sigma_i^-1 * r_i]<\/code><\/pre>\n<p>实际数据含有动态物体、错误关联和假回环，高斯模型不能覆盖所有离群点，所以工程中常把每项平方马氏距离放入鲁棒核：<\/p>\n<pre class=\"code\"><code>F_robust(x) = sum_i rho(r_i^T * Sigma_i^-1 * r_i)<\/code><\/pre>\n<p>鲁棒核是对离群点的保护，不是错误时间同步、外参或数据关联的替代品。<\/p><\/section>\n<section class=\"sec\" data-sec=\"9.2.6\"><h3 id=\"s9.2.6\"><span class=\"num\">9.2.6<\/span> 问题六：雅可比是解析计算还是数值计算？<\/h3>\n<p>一个可信的项目回答不应只有“解析”或“数值”两个字。示例回答是：<\/p>\n<blockquote>点到平面、轮速和 GNSS 因子使用解析雅可比，因为它们在高频路径上且结构简单；复杂的回环位姿残差可使用库提供的解析/自动求导。开发阶段用中心差分检查每一列，随机生成多组位姿，并特别测试接近零旋转和较大旋转的情况。数值差分只用于验证，不放在高频生产路径中。<\/blockquote>\n<p>解析雅可比容易出错的地方包括：<\/p>\n<ul><li><code>T_A_B<\/code> 与 <code>T_B_A<\/code> 写反；<\/li><li>左扰动推导配上右扰动更新；<\/li><li>状态排列是 <code>[position, rotation]<\/code>，代码却按 <code>[rotation, position]<\/code>；<\/li><li>对四元数四个分量直接求导，却忘了它只有三个局部自由度；<\/li><li>残差定义从 <code>z-h<\/code> 改成 <code>h-z<\/code>，雅可比没有同步改符号。<\/li><\/ul>\n<p>数值检查通过不代表模型一定正确；如果预测测量本身坐标系写错，解析与数值雅可比可能一致地错。因此还需要几何单元测试。<\/p><\/section>\n<section class=\"sec\" data-sec=\"9.2.7\"><h3 id=\"s9.2.7\"><span class=\"num\">9.2.7<\/span> 问题七：不同传感器怎样确定权重？<\/h3>\n<p>权重来自测量不确定度，不应只靠“哪个传感器更重要”的主观判断：<\/p>\n<pre class=\"code\"><code>Omega_i = Sigma_i^-1<\/code><\/pre>\n<p>建议按下面的顺序确定：<\/p>\n<ol><li value=\"1\">用静止或有真值的数据估计传感器基础噪声；<\/li><li value=\"2\">用标定残差估计外参和时间同步的不确定度；<\/li><li value=\"3\">根据匹配点数、平面质量、轮速打滑、GNSS 状态等在线调整协方差；<\/li><li value=\"4\">查看白化残差、NIS 和卡方通过率是否符合预期；<\/li><li value=\"5\">在独立数据集上验证，
